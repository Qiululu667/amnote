/* ── Markdown → HTML ───────────────────── */
let HID = 0;                       // 标题 id 的全局号，只增不减，见下面 h1~h6 那段注释

/* 相邻两行拼成一段时中间加不加空格。
   英文要加（词是靠空格断的），中日韩不能加（句子中间会凭空多出一个空格）。
   以前一律 join(' ')，而库里九成是中文，凡是源码里换了行的段落，
   渲染出来就在断行处多一个空格。两边只要有一边是 CJK 就不加。 */
const CJK = /[⺀-鿿豈-﫿︰-﹏＀-｠　-〿]/;
function joinLines(arr){
  let out = '';
  for(const s of arr){
    if(!out){ out = s; continue; }
    const l = out[out.length-1] || '', r = s[0] || '';
    out += (CJK.test(l) || CJK.test(r)) ? '' : ' ';
    out += s;
  }
  return out;
}

/* 削掉首尾空白，但全角空格（U+3000）不削——段落的段首缩进「　　」是正文（CommonMark 同口径） */
function trimKeepWide(s){ return String(s==null?'':s).replace(/^[^\S\u3000]+|[^\S\u3000]+$/g, ''); }

/* 列表项 ─ 缩进、有序无序、序号、正文 */
const LIRE = /^(\s*)([-*+]|(\d+)[.)])\s+(.*)$/;

/* 这些字符写在正文里会被渲染器认成标记。存盘时如果屏幕上就是这几个字
   （不是工具栏加出来的加粗／斜体），把它换成数字实体再写回，渲染时换回来。
   不用反斜杠：库里的笔记本来就有 \* 、\| 这种字面写法，认了反斜杠会改掉它们。
   实体只在「这段文字再渲染会变样」时才加上，普通句子一个都不加。
   &#38; 是字面的 &：正文里手打的「&#60;」这种实体文字，写回时把 & 换成它，
   不然渲染器会把那串字解成 <（8c3770d 起这几个数字实体是认的），字就变了。
   &#33; 是字面的 !：一个「!」后面紧跟着链接时写成它，不然「![字](地址)」成了图片。 */
const MD_ENT = {'`':'&#96;','*':'&#42;','~':'&#126;','[':'&#91;',']':'&#93;','<':'&#60;','>':'&#62;'};
const MD_ENT_REV = {'96':'`','42':'*','126':'~','91':'[','93':']','60':'<','62':'>','41':')','38':'&','33':'!'};

/* 表格里的竖线会把一格拆成两格。只在切表格行时把 \| 当成「这一格里的竖线」，
   正文里的反斜杠一律不动。 */
function splitRow(r){
  let s = String(r||'').trim();
  if(s.charAt(0)==='|') s = s.slice(1);
  if(s.charAt(s.length-1)==='|' && s.charAt(s.length-2)!=='\\') s = s.slice(0,-1);
  const cells = [];
  let cur = '';
  for(let i=0;i<s.length;i++){
    if(s.charAt(i)==='\\' && s.charAt(i+1)==='|'){ cur += '|'; i++; continue; }
    if(s.charAt(i)==='|'){ cells.push(cur.trim()); cur = ''; continue; }
    cur += s.charAt(i);
  }
  cells.push(cur.trim());
  return cells;
}

/* 段落若整行长得像标题、列表、引用、分隔线、代码围栏，写回去会被当成那种块。
   行首加一个零宽空格当记号，渲染时剥掉，屏幕上仍是原来那一行字。 */
function isStructLine(line){
  const s = String(line||'');
  return /^(#{1,6})\s/.test(s)
    || /^>/.test(s)
    || !!fenceOpen(s)
    || /^([-*_])\s*\1\s*\1[\s\-*_]*$/.test(s)
    || LIRE.test(s);
}
/* 代码围栏（CommonMark 口径）：``` 或 ~~~，三个起；反引号围栏后面的语言串里不能再有
   反引号（那是一行行内代码，不是围栏）。收尾那道：同一种字符、不短于开头、后面只有空白。
   以前见 ``` 开头的行就开、见 ``` 开头的行就收：代码里写 markdown 教程（一行 ```、
   一行 ```python）代码块在那儿就断了，后半截掉出来当正文（R 报告 P0-2）；~~~ 围栏也不认。 */
function fenceOpen(line){
  const m = /^\s*(`{3,}|~{3,})(.*)$/.exec(String(line||''));
  if(!m || (m[1][0]==='`' && m[2].includes('`'))) return null;
  return {ch:m[1][0], n:m[1].length, lang:m[2].trim().split(/\s+/)[0]||''};
}
function fenceClose(line, fo){
  const m = /^\s*(`{3,}|~{3,})\s*$/.exec(String(line||''));
  return !!(m && m[1][0]===fo.ch && m[1].length>=fo.n);
}
/* 第 i 行是不是一道围栏的开头（带上下文判）。反引号围栏跟 HEAD 一样：开了就算，收不上一直到文末。
   波浪线围栏只有后面真找得到收尾（同一种字符、不短于开头）才算——不然一行 ~~~~~~ 当分隔线、
   开头写 ~~~删除~~~ 的老笔记，后面整篇都会被画进代码块（H 轮 P2-B）。 */
function fenceAt(L, i){
  const fo = fenceOpen(L[i]);
  if(!fo || fo.ch==='`') return fo;
  return tildeCloseMax(L)[i+1] >= fo.n ? fo : null;
}
/* 每一行往后（含这一行）最长的那道 ~~~ 收尾有几个字：一趟从后往前算好、按这一份行数组记住。
   以前每一行 ~~~ 开头的都往后扫到底，一篇里两千行「~~~删除线~~~」要两百毫秒（R 终审 P3-2） */
function tildeCloseMax(L){
  let a=TILDE_CLOSE.get(L);
  if(!a){
    a=new Int32Array(L.length+1);
    for(let j=L.length-1; j>=0; j--){
      const m=/^\s*(~{3,})\s*$/.exec(String(L[j]||''));
      a[j]=Math.max(a[j+1], m ? m[1].length : 0);
    }
    TILDE_CLOSE.set(L, a);
  }
  return a;
}
function unguardLine(line){
  if(!line || line.charAt(0)!=='\u200b') return null;
  const rest = line.slice(1);
  return isStructLine(rest) ? rest : null;
}

/* <strong data-amn="1"> 是写回时兜底用的，只包「普通标记拼不回去」的加粗／斜体／删除线／代码。
   用户打出同样一串会被 protectPlain 换成实体，进不到这里。 */
function takeAmn(s, amn){
  let out = '', i = 0;
  while(i<s.length){
    if(s.charAt(i)!=='<'){ out += s.charAt(i); i++; continue; }
    const m = /^<(strong|em|del|code) data-amn="1">/i.exec(s.slice(i));
    if(!m){ out += s.charAt(i); i++; continue; }
    const tag = m[1].toLowerCase();
    const openLen = m[0].length;
    const close = '</' + tag + '>';
    let depth = 1, j = i + openLen;
    while(j<s.length && depth>0){
      const rest = s.slice(j);
      if(rest.toLowerCase().startsWith('<'+tag+' data-amn="1">')){
        depth++; j += openLen; continue;
      }
      if(rest.toLowerCase().startsWith(close)){
        depth--;
        if(depth===0) break;
        j += close.length; continue;
      }
      j++;
    }
    if(depth!==0){ out += s.charAt(i); i++; continue; }
    out += '\uE002' + (amn.push({tag:tag, inner:s.slice(i+openLen, j)}) - 1) + '\uE002';
    i = j + close.length;
  }
  return out;
}

/* 行内。base 是这份 md 所在目录，图片和链接靠它解相对路径。
   四种占位：\uE000 行内代码、\uE001 字面字符、\uE002 data-amn 兜底、\uE003 先收起来的标签。 */
function inl(t, base){
  const lit = [], amn = [], code = [], tag = [];
  // 正文里本来就有的私用区字符先当字面字收起来，别跟下面的占位撞车。
  // 以前是直接删掉——打进去的这几个字一存就没了，自检也永远对不上。
  let s = String(t==null?'':t).replace(/[\uE000-\uE003]/g, ch=>'\uE001'+(lit.push(ch)-1)+'\uE001');
  s = takeAmn(s, amn);
  // 行内代码先收：反引号里的是字，里面写的 &#60; 之类照字面显示（CommonMark 同）。
  // 以前实体先解，`&#60;` 显示成 <，那一段一改就存不进；被转义成 &#96; 的反引号不是
  // 反引号，凑不成代码，下面照常当字面解出来。
  s = s.replace(/`([^`]+)`/g, (m,c)=>'\uE000'+(code.push(esc(c))-1)+'\uE000');
  s = s.replace(/&#(96|42|126|91|93|60|62|41|38|33);/g, (m,n)=>
    '\uE001' + (lit.push(MD_ENT_REV[n]) - 1) + '\uE001');
  // 图片、链接的开头标签、双链整个先收起来，再跑加粗斜体那几条正则。
  // 不收的话 alt 里的 *a*、地址里的星号、双链名里的星号会被套上 <em>——
  // 套在属性值里，图的说明成了一串标签字，存盘自检永远对不上。
  const keep = h => '\uE003' + (tag.push(h) - 1) + '\uE003';
  // 收起来的那几样里反引号是字、不是代码：代码占位还原回原文；字面字符的占位也还原
  // （地址里写成 &#41; 的 )，不还原的话 resolveRef 拿到的是占位符，href/src 编出一串乱码）
  const raw = x => String(x).replace(/\uE000(\d+)\uE000/g, (m,n)=>'`'+(code[+n]||'')+'`')
                            .replace(/\uE001(\d+)\uE001/g, (m,n)=>esc(lit[+n]||''));
  s = esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u)=>{
      a = raw(a); u = raw(u);
      const src = resolveRef(u, base, true);
      return keep(src ? `<img src="${esc(src)}" alt="${a}" title="${a}" data-u="${u}">`
                      : `<span class="imgbad">${esc(TR('图片地址不合法：{u}', {u:a||u}))}</span>`);
    })
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,a,u)=>{
      u = raw(u);
      return keep(`<a href="${esc(resolveRef(u,base,false))}" data-u="${u}" target="_blank" rel="noopener">`)+a+'</a>';
    })
    .replace(/\[\[([^\[\]\n]{1,80})\]\]/g, (m,n)=>{ n = raw(n); return keep(`<a class="wl" data-wl="${n}">${n}</a>`); })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
    .replace(/\uE002(\d+)\uE002/g, (m,n)=>{
      const a = amn[+n];
      if(!a) return '';
      if(a.tag==='code'){
        const raw = a.inner.replace(/&#38;/g,'&').replace(/&#60;/g,'<').replace(/&#62;/g,'>');
        return `<code>${esc(raw)}</code>`;
      }
      return `<${a.tag}>${inl(a.inner, base)}</${a.tag}>`;
    })
    .replace(/\uE003(\d+)\uE003/g, (m,n)=>tag[+n]||'')
    .replace(/\uE000(\d+)\uE000/g, (m,n)=>`<code>${code[+n]||''}</code>`)
    .replace(/\uE001(\d+)\uE001/g, (m,n)=>esc(lit[+n]||''));
  return s;
}

/* 这段纯文字再渲染会不会变样。会，就把会认的字符换成实体。
   <br>、*重点*、`代码`、[文字](地址) 打在正文里都走这里，看起来还是打进去的那几个字。
   只换真正闹事的那一种记号，别一处要换就把整段的 ` * ~ [ ] < > 全换掉（文件里一片实体）。
   渲染器本来就当字面显示的不换：<kbd>⌘</kbd>、<https://…> 这种行内 HTML／自动链接
   原样写回，文件里原来是什么还是什么，换个编辑器打开也不坏（8c3770d 把它们改写成了实体）。
   手打的「&#60;」这种实体文字：& 写成 &#38;，不然渲染器会把它解成 <。 */
const ENT_TEXT = /&(?=#(?:96|42|126|91|93|60|62|41|38|33);)/g;
const MD_CLASS = [/\*/g, /~/g, /`/g, /[\[\]]/g, /[<>]/g];
function protectPlain(s, force){
  const orig = String(s==null?'':s);
  if(!orig) return '';
  const ent = x => x.replace(/[`*~\[\]<>]/g, ch=>MD_ENT[ch]||ch);
  const out = orig.replace(ENT_TEXT, '&#38;');
  if(force) return ent(out);
  if(!/[`*~\[\]<>]/.test(out)) return out;
  const want = esc(orig);
  if(inl(out, '')===want) return out;
  for(const re of MD_CLASS){
    const o = out.replace(re, ch=>MD_ENT[ch]||ch);
    if(o!==out && inl(o, '')===want) return o;
  }
  return ent(out);                                  // 几种记号缠在一起：全换
}

/* off0 不给＝整篇渲染，自己剥 frontmatter 算偏移；
   给了＝只渲染中间的一段（收起编辑框时用），偏移由调用方按绝对行号给。
   一段里不可能含 frontmatter：标签块从来不参与渲染，也就没有 data-l0 落在它身上。 */
function md2html(src, base, off0){
  src = src.replace(/\r\n/g,'\n');
  // frontmatter 剥掉不渲染，但要记住剥了几行。块级就地编辑靠行号把改动切回原文，
  // 这个偏移丢了，改一段正文就会写到别的地方去。
  let off = off0 || 0;
  if (off0===undefined && src.startsWith('---')){
    const e = src.indexOf('\n---',3);
    if (e!==-1){
      const cut = src.indexOf('\n', e+1)+1;
      off = src.slice(0, cut).split('\n').length - 1;
      src = src.slice(cut);
    }
  }
  /* 行内规则在 inl()。这里绑上这份文档的目录，图片和链接的相对路径才解得对。
     data-u 记源码里原来那串地址：渲染时要解成库根下的路径图才出得来，
     写回文件要的是原来那一串，不然一改正文相对路径就变成绝对路径。 */
  const inlB = s => inl(s, base);

  const L = src.split('\n'), o=[]; let i=0;
  // 每个块挂上它在原文里的行号区间。块级就地编辑靠这个把改动切回去，
  // 没有它就只能像以前那样整篇换成源码框。
  const push = (html, s, e) =>
    o.push(html.replace(/^<([a-z0-9]+)/i, `<$1 data-l0="${s+off}" data-l1="${e+off}"`));

  while(i<L.length){
    const s0=i, l=L[i];
    // 代码块。原来是先用一个全局正则把 ``` 段整个抠走换成占位符、再按行走，
    // 那样后面每一行的行号都塌了，块级编辑对不回原文。改成在循环里按行吃。
    const fo=fenceAt(L, i);
    if(fo){
      // 语言记进 data-lang。丢了它，改一个 ```js 存回去就变成裸 ```
      const lang=fo.lang;
      const b=[]; i++;
      while(i<L.length && !fenceClose(L[i], fo)){ b.push(L[i]); i++; }
      if(i<L.length) i++;                       // 吃掉收尾那道围栏
      // ~~~ 围栏记一笔（data-fc），改了这一块写回去还用 ~~~，别平白把整道围栏换成反引号
      push(`<pre${lang?` data-lang="${esc(lang)}"`:''}${fo.ch==='~'?' data-fc="~"':''}><code>${esc(b.join('\n'))}</code></pre>`, s0, i-1);
      continue;
    }
    if(/^\s*\|/.test(l) && i+1<L.length && /^\s*\|[\s:\-|]+\|\s*$/.test(L[i+1])){
      const cs=splitRow;
      const hd=cs(l);
      // 对齐位记进 data-al。库里 1800 多份带表，右对齐（---:）用得很多，
      // 丢了它，改一格数字整张表就从右对齐塌回左对齐
      const al=cs(L[i+1]).map(s=>{
        const a=/^:/.test(s), b=/:$/.test(s);
        return a&&b?'center':b?'right':a?'left':'';
      });
      const sty=n=>al[n]?` style="text-align:${al[n]}"`:'';
      i+=2; const rs=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){rs.push(cs(L[i]));i++}
      push(`<div class="tw"><table data-al="${esc(al.join(','))}"><thead><tr>`
        +hd.map((c,n)=>`<th${sty(n)}>${inlB(c)}</th>`).join('')
        +'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map((c,n)=>`<td${sty(n)}>${inlB(c)}</td>`).join('')+'</tr>').join('')
        +'</tbody></table></div>', s0, i-1);
      continue;
    }
    /* 以竖线开头、下一行又不是分隔行：不是表。以前段落收集器见竖线就停，
       这一行接着被跳过，整行从正文里消失，改一个字就过不了存盘自检。 */
    if(/^\s*\|/.test(l)){
      push(`<p>${inlB(trimKeepWide(l))}</p>`, s0, i); i++; continue;   // 全角空格留着（同段落）
    }
    const h=l.match(/^(#{1,6})\s+(.*)$/);
    // 标题 id 走一个只增不减、跨渲染不重置的全局号。
    // 不能用「第几个标题」——收起编辑框时只重渲染中间一段，计数器会从 0 重来，撞号。
    // 也不能用行号——行号会随编辑平移，data-l0 平移得了、已经写死在 id 里的平移不了，
    // 撞号之后篇内目录会跳到另一个标题上。篇内目录每次都从实时 DOM 重建，
    // 所以 id 只要此刻唯一就够，不需要跨渲染稳定。
    if(h){const n=h[1].length; const id='h'+(++HID);
      push(`<h${n} id="${id}">${inlB(h[2])}</h${n}>`, s0, i); i++; continue}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){push('<hr>', s0, i); i++; continue}
    if(/^\s*>/.test(l)){const b=[];
      while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++}
      // 空的「>」行留着。滤掉的话，引用里空一行再存，自检会对不上，整段卡住。
      push('<blockquote>'+b.map(x=>`<p>${inlB(x)}</p>`).join('')+'</blockquote>', s0, i-1);continue}
    // 列表。以前是把连续的列表行拉平成一层，源码里的缩进全丢；现在按缩进建层级，
    // 顺带认 - [ ] / - [x] 勾选框。一个 li 只吃一行——库里没有续行写法，
    // 吃续行会让行号对不回原文。
    if(LIRE.test(l)){
      const rows=[];
      while(i<L.length && LIRE.test(L[i])){
        const m=L[i].match(LIRE);
        rows.push({ind:m[1].replace(/\t/g,'  ').length, ord:!!m[3], num:+m[3]||1, txt:m[4]});
        i++;
      }
      push(listHtml(rows, inlB, rows[0].ind), s0, i-1); continue;
    }
    if(l.trim()){const b=[];
      while(i<L.length&&L[i].trim()
            &&!/^\s*(\||#{1,6}\s|>)/.test(L[i]) &&!fenceAt(L, i)
            &&!LIRE.test(L[i])
            &&!/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(L[i])){
        const u=unguardLine(L[i]);
        b.push(trimKeepWide(u===null?L[i]:u)); i++;
      }
      if(b.length) push(`<p>${inlB(joinLines(b))}</p>`, s0, i-1); else i++;
      continue}
    i++;
  }
  return o.join('\n');
}

/* 列表行 → 嵌套的 ul/ol。层级按缩进值分档，不假定「一层＝两个空格」——
   库里 2 空格和 4 空格两种写法都有。同一层里有序无序混着写，按第一行的类型算，
   这种写法库里没有，真碰上也只是显示成一种，不会掉内容。 */
function listHtml(rows, inl, base){
  const li = r => {
    const m = r.txt.match(/^\[([ xX])\]\s+(.*)$/);
    // 空项塞一个 <br>：contenteditable 里空 <li> 放不进光标。
    // 写回时 inlMd 会丢掉块末 <br>，normHtml 比较也忽略，不进锁块基线。
    return m
      ? `<li class="task"><input type="checkbox"${/[xX]/.test(m[1])?' checked':''}><span>${inl(m[2])||'<br>'}</span></li>`
      : `<li>${inl(r.txt)||'<br>'}</li>`;
  };
  /* 最外层（top）吃到最后一行为止：缩进比第一行还浅的行（「  - a⏎- b」这种
     第一行缩得更深的写法）就从那一行起把这一层的基准往回挪——跟 CommonMark 一样，
     a、b 排在同一层。以前到这儿就停了，后面几行根本没画出来：阅读时看不见，
     改一下这一块再存，它们就从文件里删掉了（个人库 23 份有这种形状）。 */
  const build = (k, ind, top) => {
    const ord = rows[k].ord;
    const tag = ord ? 'ol' : 'ul';
    let h = `<${tag}${ord && rows[k].num!==1 ? ` start="${rows[k].num}"` : ''}>`;
    let n = k;
    while(n < rows.length && (top || rows[n].ind >= ind)){
      if(top && rows[n].ind < ind) ind = rows[n].ind;
      if(rows[n].ind > ind){                       // 更深一层，塞进上一个 li 里
        const sub = build(n, rows[n].ind);
        h = h.replace(/<\/li>$/, sub.html + '</li>');
        n = sub.next;
        continue;
      }
      h += li(rows[n]); n++;
    }
    return {html: h + `</${tag}>`, next: n};
  };
  return build(0, base, true).html;
}
/* ═══ Markdown ← HTML ═══════════════════
   富文本编辑要把改完的正文写回 markdown，这一段就是那个反向器。

   **它只认 md2html 自己生成的那套结构**，别的一概不猜。外面粘进来的 HTML
   不会原样进正文（见 onPaste：有图的拆成「文字 + 本地图」，没图的只取纯文本
   再按 markdown 解析），所以这里遇到的永远是自己刚渲染出来的东西。

   安全边界不靠这个反向器本身，靠三道：
     ① 进编辑时逐块自检（safeBlock）：反解→重渲染，跟原样对不上的块直接锁住，
        只能点开源码改，跟 v10 一模一样的老路；
     ② 没动过的块不反解，原样抄源码字节（见 serializeBody 的 registry）；
     ③ 存盘前再自检一次（verifyDirty），改出歧义会先拦一次。 */

function codeMd(text){
  text = String(text==null?'':text);
  // 空的：一个字都没有就什么都不写。以前写成 <code data-amn="1"></code>，
  // 项末是代码时回车，新项里那个空壳一停笔就判「存不进」（A 报告 R1）。
  if(!text) return '';
  // 里面自己就有反引号：单反引号包不住，用标记兜住，里面不再当 markdown 解析。
  if(text.includes('`')){
    const body = text.replace(/&/g,'&#38;').replace(/</g,'&#60;').replace(/>/g,'&#62;');
    return '<code data-amn="1">' + body + '</code>';
  }
  return '`' + text + '`';
}
function inlineIs(md, tag){
  const html = inl(md, '');
  const box = document.createElement('div');
  box.innerHTML = html;
  if(box.childNodes.length!==1) return false;
  const n = box.firstChild;
  return n.nodeType===1 && n.tagName===String(tag).toUpperCase();
}
/* 加粗套斜体这类，单靠 ** 和 * 拼出来再渲染对不回原来的标签。
   对得上就写 markdown；对不上就用 data-amn 包一层，打开时还是原来的样子。 */
function markWrap(node, open, close, tag, opt){
  const inner = inlMd(node, opt);
  // 一个字都没有（只剩光标位 <br> 的空壳）：显示上等于没有，什么都不写
  if(inner==='') return '';
  // 只有空白：* * 这种会被渲染成空的斜体，trim 掉标记再渲染就对不回去。
  if(!String(inner).trim())
    return '<' + tag + ' data-amn="1">' + inner + '</' + tag + '>';
  const md = open + inner + close;
  if(inlineIs(md, tag)) return md;
  return '<' + tag + ' data-amn="1">' + inner + '</' + tag + '>';
}
/* 段落一类的块被套进了行里（li>p、跨块格式、粘贴）：前后各断一行，字一个不丢 */
const INL_BLOCK = /^(P|DIV|H[1-6]|BLOCKQUOTE|LI|DT|DD|SECTION|ARTICLE)$/;
function inlMd(node, opt){
  opt = opt || {};
  let out = '', brk = false;
  node.childNodes.forEach(n => {
    if(n.nodeType === 3){
      // &nbsp; 写成普通空格：浏览器在块边、连续空格处塞的就是它，显示上是空格，
      // 写进文件却是一个别的编辑器看不见的字符。换行在这里也只是一个空格。
      const v = n.nodeValue.replace(/[\u00a0\n\r]/g, ' ').replace(PRE_PH_RE, '');   // 代码块粘贴的占位符漏到这里：不要（见 preInsert）
      if(brk){ if(!v.trim()) return; out += '<br>'; brk = false; }
      let s = protectPlain(v, opt.force);
      if(opt.table) s = s.replace(/\|/g, '\\|');
      // 链接文字里的方括号写成实体，不然 [ ] 把链接拆错。只换字里的，行内代码、图片不动
      // （代码先于链接收起来，里面的 ] 碍不着；换成实体反倒照字面显示成 &#93;）
      if(opt.link) s = s.replace(/\]/g,'&#93;').replace(/\[/g,'&#91;');
      out += s;
      return;
    }
    if(n.nodeType !== 1) return;
    const t = n.tagName;
    if(INL_BLOCK.test(t)){
      const inner = inlMd(n, opt).trim();
      if(out.trim() && !/<br>$/.test(out)) out += '<br>';
      out += inner; brk = true;
      return;
    }
    // 块后面紧跟的 <br> 就是那一处断行，别再多断一行
    if(brk){ brk = false; out += '<br>'; if(t === 'BR') return; }
    if(t === 'BR'){ out += '<br>'; return; }
    if(t === 'IMG'){
      const alt = (n.getAttribute('alt')||'').replace(/\]/g,'&#93;');
      // 地址里的 ) 写成 &#41;（同链接），不然 ![a](x(1).png) 在第一个 ) 就断了
      out += `![${alt}](${wellFormed(n.dataset.u || n.getAttribute('src') || '').replace(/\)/g,'&#41;')})`;
      return;
    }
    // 「图片没找到」之类界面换出来的提示不是正文，一个字都不写（自检会把这一块判成存不进）
    if(t === 'SPAN' && n.classList.contains('imgbad')) return;
    if(t === 'A'){
      // 前面紧挨着一个字面的「!」：写成 &#33;，不然「![字](地址)」被认成图片（「![[名]]」在
      // Obsidian 里是嵌入）
      if(/!$/.test(out)) out = out.slice(0, -1) + '&#33;';
      // [[题名]] 原样写回，别把它降级成普通链接——那会把「按名找」变成死路径
      if(n.dataset.wl!==undefined){ out += `[[${n.dataset.wl}]]`; return; }
      const text = inlMd(n, Object.assign({}, opt, {link:true}));
      // 地址里混进半个 emoji（孤立代理项）：渲染时 encodeURIComponent 会抛，整块反解失败
      const u = wellFormed(n.dataset.u || n.getAttribute('href') || '');
      out += `[${text}](${String(u).replace(/\)/g,'&#41;')})`;
      return;
    }
    if(t === 'CODE'){
      // 格子里的代码若含竖线，得写成 \|，否则切表时会把这一格拆开。
      let c = codeMd(n.textContent);
      if(opt.table) c = c.replace(/\|/g, '\\|');
      out += c;
      return;
    }
    if(t === 'STRONG' || t === 'B'){ out += markWrap(n, '**', '**', 'strong', opt); return; }
    if(t === 'EM' || t === 'I'){ out += markWrap(n, '*', '*', 'em', opt); return; }
    if(t === 'DEL' || t === 'S' || t === 'STRIKE'){ out += markWrap(n, '~~', '~~', 'del', opt); return; }
    if(t === 'INPUT') return;                       // 勾选框在 liMd 里单独处理
    out += inlMd(n, opt);                           // span 之类的壳：只取里面的字
  });
  // 块末尾那个 <br> 不写出去。浏览器在空段落里塞它当光标位，显示上等于没有；
  // 写进文件就会在正文里留一串字面上的「<br>」。
  return out.replace(/(?:<br>)+$/, '');
}

function tableMd(tb, opt){
  if(!tb) return '';
  opt = opt || {};
  const al = (tb.dataset.al || '').split(',');
  const cellOpt = {table:true, force:!!opt.force};
  const rows = Array.from(tb.querySelectorAll('tr')).map(r =>
    Array.from(r.children).filter(c => c.tagName==='TD' || c.tagName==='TH').map(c => inlMd(c, cellOpt).trim()));
  if(!rows.length) return '';
  // 按每一行自己的格数写，不把短行补成空格。补了再渲染，表头会多出一串空列，
  // 存盘自检对不上，格子里本来就有竖线的表整张存不进去。
  // 分隔行保留原来的对齐位数：表头两格、分隔行三格这种不齐的表，缩掉一格再渲染会对不上。
  const n = Math.max(rows[0].length, al.length || 0, 1);
  const line = cs => '| ' + cs.join(' | ') + ' |';
  const sep = Array.from({length:n}, (_,k) => {
    const a = al[k] || '';
    return a==='center' ? ':---:' : a==='right' ? '---:' : a==='left' ? ':---' : '---';
  });
  return [line(rows[0]), '| ' + sep.join(' | ') + ' |', ...rows.slice(1).map(line)].join('\n');
}

function listMd(list, ind, opt){
  const ord = list.tagName === 'OL';
  let n = +(list.getAttribute('start') || 1);
  const out = [];
  [...list.children].forEach(li => {
    if(li.tagName !== 'LI') return;
    const cb = li.querySelector(':scope > input[type=checkbox]');
    const subs = [...li.children].filter(c => c.tagName==='UL' || c.tagName==='OL');
    const clone = li.cloneNode(true);
    [...clone.children].forEach(c => {
      if(c.tagName==='UL' || c.tagName==='OL' || c.tagName==='INPUT') c.remove();
    });
    const mark = ord ? (n++) + '.' : '-';
    // 勾着没有，属性和 property 有一个算一个：解析出来的框有时只在属性上，
    // 点一下又是 property 先翻。只认一边的话，存盘自检会对不上，整段存不进去。
    const on = cb && (cb.checked || cb.hasAttribute('checked'));
    out.push(ind + mark + ' ' + (cb ? '[' + (on?'x':' ') + '] ' : '') + inlMd(clone, opt).trim());
    subs.forEach(s => out.push(listMd(s, ind + '  ', opt)));
  });
  return out.join('\n');
}

/* 代码块里的字：<code> 里外都算（段首退格会把下一段并进 <pre>、落在 <code> 外面，
   以前只取 <code> 那一截，并进来的字一存就没了），<br> 当换行。 */
function preText(el){
  let s = '';
  const walk = n => n.childNodes.forEach(c=>{
    if(c.nodeType===3){ s += c.nodeValue; return; }
    if(c.nodeType!==1) return;
    if(c.tagName==='BR'){ s += '\n'; return; }
    // 段落一类的块进了代码块（插进来的 HTML、并段）：各占一行，别挤成一行
    const blk = /^(P|DIV|LI|H[1-6]|TR|BLOCKQUOTE)$/.test(c.tagName);
    if(blk && s && !s.endsWith('\n')) s += '\n';
    walk(c);
    if(blk && !s.endsWith('\n')) s += '\n';
  });
  walk(el);
  return s;
}

/* 一个顶层块 → markdown。返回的不带块与块之间的空行，那个由 serializeBody 管。 */
function blkMdRaw(el, opt){
  opt = opt || {};
  if(!el || el.nodeType !== 1) return '';
  const t = el.tagName;
  if(/^H[1-6]$/.test(t)) return '#'.repeat(Math.min(6, +t[1])) + ' ' + inlMd(el, opt).trim();
  if(t === 'HR') return '---';
  if(t === 'PRE'){
    const body = preText(el).replace(PRE_PH_RE, '\n').replace(/\n$/, '');   // 占位符兜底换回换行（见 preInsert）
    // 围栏挑一道比内容里任何一行行首的反引号串都长的（至少三个）：代码里写着 ``` 的时候
    // 还用 ``` 包，那一行就把代码块提前收尾了（R 报告 P0-2）
    // 原来是 ~~~ 的照旧用 ~~~（同样挑得比内容里的 ~ 串长）
    const ch = el.dataset.fc === '~' ? '~' : '`';
    let n = 3;
    (body.match(ch === '~' ? /^[ \t]*~{3,}/gm : /^[ \t]*`{3,}/gm) || []).forEach(x => { n = Math.max(n, x.trim().length + 1); });
    const f = ch.repeat(n);
    return f + (el.dataset.lang || '') + '\n' + body + '\n' + f;
  }
  if(t === 'BLOCKQUOTE'){
    // 每一段一行。夹在段落之间的散字（浏览器并段、粘贴造出来的）自成一行，
    // 以前只认元素子节点，那些字一存就没了。
    const lines = [];
    let run = null;
    // 引用里一行的行首全角空格也留着（同段落，见 trimKeepWide）
    const flush = () => { if(run){ lines.push('> ' + trimKeepWide(inlMd(run, opt))); run = null; } };
    el.childNodes.forEach(c => {
      if(c.nodeType===1 && INL_BLOCK.test(c.tagName)){ flush(); lines.push('> ' + trimKeepWide(inlMd(c, opt))); return; }
      if(!run){
        if(c.nodeType===3 && !c.nodeValue.trim()) return;
        if(c.nodeType===1 && c.tagName==='BR') return;
        run = document.createElement('p');
      }
      run.appendChild(c.cloneNode(true));
    });
    flush();
    return lines.length ? lines.join('\n') : '> ';
  }
  if(t === 'UL' || t === 'OL') return listMd(el, '', opt);
  if(t === 'TABLE') return tableMd(el, opt);
  if(t === 'DIV' && el.classList.contains('tw')) return tableMd(el.querySelector('table'), opt);
  // 顶层裸 <img>。光标停在段首或段末时，浏览器的 insertHTML 会把图甩出段落、
  // 直接挂到正文根上（Chromium 和 WKWebView 都这样）。img 没有子节点，走下面那条
  // inlMd 会得到空串，序列化时被当空块丢掉——屏幕上看得见，存进文件就没了。
  // 正常路径由 settleImg 当场把它包回 <p>，这条是兜底：不让任何一条路静默丢图。
  if(t === 'IMG'){
    const alt = (el.getAttribute('alt')||'').replace(/\]/g,'&#93;');
    return `![${alt}](${el.dataset.u || el.getAttribute('src') || ''})`;
  }
  // 跑到顶层的裸行内元素（<strong>、<a>……）：连它自己一起当一段的内容，
  // 别只取里面的字——那样加粗、链接一存就没了
  if(t !== 'P' && t !== 'DIV'){
    const w = document.createElement('p');
    w.appendChild(el.cloneNode(true));
    return trimKeepWide(inlMd(w, opt));
  }
  // P，以及浏览器在 contenteditable 里自己造出来的 DIV
  // 段首段尾的全角空格（中文排版的段首缩进「　　」）留着：CommonMark 也不削它，别的编辑器里看得见；
  // 以前 .trim() 连它一起削，一改这一段缩进就没了（H 轮，R 的 g_flows W1）
  return trimKeepWide(inlMd(el, opt));
}
function guardPara(el, md){
  if(!el || el.nodeType!==1 || !md) return md;
  const t = el.tagName;
  if(t!=='P' && !(t==='DIV' && !el.classList.contains('tw'))) return md;
  return md.split('\n').map(line => isStructLine(line) ? '\u200b'+line : line).join('\n');
}
/* md 渲染回来，跟这一块看起来是不是一个样子（见下面 visSig） */
function visSame(el, md, base){
  const box = document.createElement('div');
  box.innerHTML = md2html(md, base||'', 0);
  return visSig([el])===visSig(box.children);
}
/* 段落整行若长得像另一种块，行首加零宽空格，避免存下去变成标题或列表。
   第一遍按屏幕上的加粗斜体写；对不上再把纯文字里的标记字符换成实体。
   排版按钮要的是去掉标记后的正文，走 blkMdRaw，不加这个记号。 */
function blkMd(el, base){
  const b = base || '';
  const once = guardPara(el, blkMdRaw(el));
  if(!el || visSame(el, once, b)) return once;
  const twice = guardPara(el, blkMdRaw(el, {force:true}));
  if(visSame(el, twice, b)) return twice;
  return once;
}

/* ═══ 看得见的样子 ══════════════════════
   存盘自检、进编辑时锁不锁，比的都是这个，不再比 HTML 字符串（normHtml 全等）。
   编辑器里能出现的 DOM 比渲染器造得出来的多得多：块边的 &nbsp;、块尾占位 <br>、
   浏览器包的 <span>、工具栏造的 <a>、洗白剥掉的 class……字符串全等只对「渲染器
   自己的输出」成立，对「被人编辑过的输出」不成立——「打个空格停两秒就红」的根在这儿。
   这里只比读者看得见的：块的种类和语义属性（标题级、列表有序／起始号／勾选、
   表格对齐、代码语言），加一串行内 run（字＋它身上的标记：粗、斜、删、代码、
   链接地址 data-u、双链 data-wl）。
     · 空白：&nbsp;、制表、换行都当空格，连着的并成一个；块首块尾、换行前后的空白看不见
     · 块尾的 <br>（不论几个）、子列表前面那几个 <br> 看不见
     · 相邻同标记的字并成一段；<strong><em> 跟 <em><strong> 一样；空的行内壳等于没有
     · 只有空白的那一截不算粗、不算斜（看不出来）
     · href / target / rel / class 是派生的不比；sup、mark、span 这些认不得的壳只看里面的字
   真的变化照样抓得住：字变了、字丢了、标记真变了（粗了、成了列表、成了标题、链到别处）。
   「两个空格变一个」这类所有 markdown 渲染器都会折叠的差别放过去，可以接受。 */
const VIS_TEXTBLK = /^(P|DIV|H[1-6]|LI|BLOCKQUOTE|TD|TH|DT|DD|SECTION|ARTICLE)$/;
const VIS_HEAVY = /^(UL|OL|TABLE|PRE|HR)$/;
function visSig(nodes){
  const out = [];
  [...nodes].forEach(n => visBlk(n, out));
  return out.join('\n');
}
function visBlk(n, out){
  if(n.nodeType===3){                              // 顶层的散字：按一段算
    if(visTxt(n.nodeValue).trim()) out.push('p'+visRuns([n], true));
    return;
  }
  if(n.nodeType!==1) return;
  const t = n.tagName;
  if(t==='HR'){ out.push('hr'); return; }
  if(/^H[1-6]$/.test(t)){ out.push(t.toLowerCase()+visRuns(n.childNodes)); return; }
  // 代码块末尾的空行看不见（最后那个换行不起新行；Chromium 在代码块里回车还会垫一个占位 <br>）
  if(t==='PRE'){ out.push('pre:'+(n.dataset.lang||'')+'|'+preText(n).replace(/\n+$/,'')); return; }
  if(t==='UL' || t==='OL'){ out.push(visList(n)); return; }
  if(t==='TABLE' || (t==='DIV' && n.classList.contains('tw'))){
    out.push(visTable(t==='TABLE' ? n : n.querySelector('table'))); return;
  }
  if(t==='BLOCKQUOTE'){
    const inner = [];
    let run = [];
    const flush = () => { if(run.length){ inner.push('p'+visRuns(run)); run = []; } };
    n.childNodes.forEach(c => {
      if(c.nodeType===1 && (VIS_TEXTBLK.test(c.tagName) || VIS_HEAVY.test(c.tagName))){ flush(); visBlk(c, inner); return; }
      if(!run.length && c.nodeType===3 && !visTxt(c.nodeValue).trim()) return;
      run.push(c);
    });
    flush();
    out.push('q{'+inner.join('\n')+'}');
    return;
  }
  // P、浏览器造的 DIV、跑到顶层的裸行内元素（img、strong……）：都按一段算
  out.push('p'+visRuns(t==='P' || t==='DIV' ? n.childNodes : [n], true));
}
function visList(list){
  const ord = list.tagName==='OL';
  let s = (ord ? 'ol'+(+(list.getAttribute('start')||1)) : 'ul')+'[';
  list.childNodes.forEach(li => {
    if(li.nodeType===3){ if(visTxt(li.nodeValue).trim()) s += 'li'+visRuns([li])+';'; return; }
    if(li.nodeType!==1) return;
    if(li.tagName!=='LI'){ s += 'li'+visRuns([li])+';'; return; }   // 浏览器塞进来的别的东西：当一项
    const cb = li.querySelector(':scope > input[type=checkbox]');
    s += 'li'+(cb ? ((cb.checked || cb.hasAttribute('checked')) ? '[x]' : '[ ]') : '')+visRuns(li.childNodes)+';';
  });
  return s+']';
}
function visTable(tb){
  if(!tb) return 'table';
  const al = (tb.dataset.al||'').split(',');
  return 'table'+JSON.stringify([...tb.querySelectorAll('tr')].map(r => [...r.children]
    .filter(c => c.tagName==='TD' || c.tagName==='TH')
    .map((c,k) => c.tagName+(al[k]||'')+visRuns(c.childNodes))));
}
/* 读者眼里的字：&nbsp;、制表、换行都是空格，零宽空格看不见 */
function visTxt(s){
  return String(s||'').replace(/[\u200b\ufeff]/g, '').replace(/[ \t\n\r\f\u00a0]+/g, ' ');
}
function visMark(m, k){ return m.indexOf(k)>=0 ? m : m.concat([k]).sort(); }
/* wide：段落（P／DIV／正文根上的散字）——块首块尾的全角空格是正文、看得见，不削（见 trimKeepWide） */
function visRuns(nodes, wide){
  const tk = [];                                   // {k:'t',m,s} ｜ {k:'br'} ｜ {k:'sb'} 软断行 ｜ {k:'x',s,blk}
  const walk = (n, m) => {
    if(n.nodeType===3){ const s = visTxt(n.nodeValue); if(s) tk.push({k:'t', m, s}); return; }
    if(n.nodeType!==1) return;
    const t = n.tagName;
    if(t==='BR'){ tk.push({k:'br'}); return; }
    if(t==='INPUT'){
      // 待办项自己的勾选框在 visList 里单独比；别处的（并段把勾选框带进了段落）也得算一样东西，
      // 不然它被当成没有、判「对得上」，存下去勾选框就静默没了（R 复审 P3-3）
      const own = n.parentElement && n.parentElement.tagName==='LI'
                  && n.parentElement.querySelector(':scope > input[type=checkbox]')===n;
      if(!own && n.type==='checkbox') tk.push({k:'x', s:'cb'+((n.checked || n.hasAttribute('checked'))?1:0)});
      return;
    }
    if(t==='IMG'){
      tk.push({k:'x', s:'img:'+(n.getAttribute('alt')||'')+'|'+(n.getAttribute('data-u')||n.getAttribute('src')||'')+'|'+m.join(' ')});
      return;
    }
    if(t==='SPAN' && n.classList.contains('imgbad')){ tk.push({k:'x', s:'imgbad:'+n.textContent}); return; }
    if(VIS_HEAVY.test(t)){ const o = []; visBlk(n, o); tk.push({k:'x', s:'{'+o.join('\n')+'}', blk:true}); return; }
    /* 行里／列表项里／格子里套进了整块的引用或标题（拖放造得出来：td>blockquote、li>h2、p>blockquote）：
       屏幕上是一块引用、一个大标题，写进 md 只能是一行普通字——块的种类算进签名，判对不上
       （走严格闸，结构块里就是存不进），别当软断行放过去、悄悄存成纯文字（J 轮，R 终审 P3-2）。
       渲染器自己从来不在这些地方造引用和标题，正常文档不受影响。 */
    if(t==='BLOCKQUOTE' || /^H[1-6]$/.test(t)){
      const k = t==='BLOCKQUOTE' ? 'q' : t.toLowerCase();
      tk.push({k:'x', s:'<'+k, blk:true}); n.childNodes.forEach(c => walk(c, m)); tk.push({k:'x', s:k+'>', blk:true});
      return;
    }
    if(VIS_TEXTBLK.test(t)){ tk.push({k:'sb'}); n.childNodes.forEach(c => walk(c, m)); tk.push({k:'sb'}); return; }
    let m2 = m;
    if(t==='STRONG' || t==='B') m2 = visMark(m, 'b');
    else if(t==='EM' || t==='I') m2 = visMark(m, 'i');
    else if(t==='DEL' || t==='S' || t==='STRIKE') m2 = visMark(m, 's');
    else if(t==='CODE') m2 = visMark(m, 'c');
    else if(t==='A'){
      if(n.dataset.wl!==undefined) m2 = visMark(m, 'w:'+n.dataset.wl);
      else if(n.hasAttribute('data-u')) m2 = visMark(m, 'a:'+n.getAttribute('data-u'));
      else if(n.hasAttribute('href')) m2 = visMark(m, 'a:'+n.getAttribute('href'));
    }
    n.childNodes.forEach(c => walk(c, m2));
  };
  [...nodes].forEach(n => walk(n, []));
  // 字按空白切开；空白那一截不算粗斜
  let a = [];
  tk.forEach(x => {
    if(x.k!=='t'){ a.push(x); return; }
    x.s.split(/( +)/).forEach(p => {
      if(!p) return;
      if(p[0]===' ') a.push({k:'t', m:x.m.filter(k => k!=='b' && k!=='i'), s:' '});
      else a.push({k:'t', m:x.m, s:p});
    });
  });
  // 连着的断行算一组：有硬 <br> 按 <br> 的个数，只有软断行（段落套进行里）算一个；
  // 开头的软断行、子列表这类块前面的 <br>、末尾所有的断行都看不见
  const b = [];
  for(let i=0; i<a.length; ){
    if(a[i].k!=='br' && a[i].k!=='sb'){ b.push(a[i++]); continue; }
    let j = i, hard = 0;
    while(j<a.length && (a[j].k==='br' || a[j].k==='sb')){ if(a[j].k==='br') hard++; j++; }
    const head = !b.some(x => x.k!=='t' || x.s!==' ');
    const tail = j>=a.length || (a[j].k==='x' && a[j].blk);
    const n = tail ? 0 : hard ? hard : head ? 0 : 1;
    for(let k=0; k<n; k++) b.push({k:'br'});
    i = j;
  }
  // 空白：连着的并成一个（不论身上什么标记）；块首块尾、断行和块前后的看不见
  const sp = x => x && x.k==='t' && x.s===' ';
  const c0 = [];
  b.forEach(x => { if(!(sp(x) && sp(c0[c0.length-1]))) c0.push(x); });
  const edge = x => !x || x.k==='br' || (x.k==='x' && x.blk);
  const c = c0.filter((x, i) => !(sp(x) && (edge(c0[i-1]) || edge(c0[i+1]))));
  // 块首块尾再按 JS 的 trim 削一遍（跟序列化出口一致：段落留全角空格，别的块连它一起削），削空了的整截拿掉
  const lead = wide ? /^[^\S\u3000]+/ : /^\s+/, trail = wide ? /[^\S\u3000]+$/ : /\s+$/;
  while(c.length && c[0].k==='t'){
    const s = c[0].s.replace(lead, '');
    if(s){ c[0] = {k:'t', m:c[0].m, s}; break; }
    c.shift();
  }
  // 块尾：削空了的字、因此露到末尾的 <br> 一并拿掉（序列化先剥 <br> 再 trim，再渲染也看不见）
  while(c.length && (c[c.length-1].k==='t' || c[c.length-1].k==='br')){
    const L = c.length-1;
    if(c[L].k==='br'){ c.pop(); continue; }
    const s = c[L].s.replace(trail, '');
    if(s){ c[L] = {k:'t', m:c[L].m, s}; break; }
    c.pop();
  }
  // 相邻同标记的字并起来
  const d = [];
  c.forEach(x => {
    if(x.k==='t' && !x.s) return;
    const pv = d[d.length-1];
    if(x.k==='t' && pv && pv.k==='t' && pv.m.join(' ')===x.m.join(' ')){ d[d.length-1] = {k:'t', m:pv.m, s:pv.s+x.s}; return; }
    d.push(x);
  });
  return JSON.stringify(d.map(x => x.k==='t' ? [x.m.join(' '), x.s] : x.k==='br' ? 'br' : x.s));
}

/* 看得见的字（空白、零宽字符不算；一张图算一个字）。判「空块」用。 */
function visChars(nodes){
  let s = '';
  const walk = n => {
    if(n.nodeType===3){ s += n.nodeValue.replace(/[\s\u200b\ufeff]/g, ''); return; }
    if(n.nodeType!==1) return;
    if(n.tagName==='IMG'){ s += '\ufffc'; return; }
    n.childNodes.forEach(walk);
  };
  [...nodes].forEach(walk);
  return s;
}
/* 严格不丢闸认的东西：每个看得见的字（链接里的字带上链接地址，双链里的带上双链目标）、
   每张图（地址＋alt）、每个勾选框勾没勾。空白、零宽字符不算。
   「图片没找到」这类界面换出来的提示（span.imgbad）不是正文：给它一个重画里永远不会有的
   记号，这一块就过不了闸，绝不会把那串提示字照存进文件（R 报告 P0-1）。 */
function strictItems(nodes){
  const out = [];
  const walk = (n, link) => {
    if(n.nodeType===3){
      for(const ch of n.nodeValue.replace(/[\s\u200b\ufeff]/g, '')) out.push(link ? ch+'\u0001'+link : ch);
      return;
    }
    if(n.nodeType!==1) return;
    const t = n.tagName;
    if(t==='IMG'){
      out.push('\ufffc'+(n.getAttribute('data-u')||n.getAttribute('src')||'')+'\u0001'+(n.getAttribute('alt')||'')+'\u0001'+link);
      return;
    }
    if(t==='SPAN' && n.classList.contains('imgbad')){ out.push('\ufffdimgbad'); return; }
    if(t==='INPUT'){ if(n.type==='checkbox') out.push((n.checked || n.hasAttribute('checked')) ? '\u2611' : '\u2610'); return; }
    let l = link;
    if(t==='A'){
      if(n.dataset.wl!==undefined) l = 'w:'+n.dataset.wl;
      else if(n.hasAttribute('data-u')) l = 'a:'+n.getAttribute('data-u');
      else if(n.hasAttribute('href')) l = 'a:'+n.getAttribute('href');
    }
    n.childNodes.forEach(c => walk(c, l));
  };
  [...nodes].forEach(n => walk(n, ''));
  return out;
}
/* 编辑器里的那些东西，重画出来是不是全都在、顺序一致（exact：一个不多、一个不少） */
function strictKeeps(el, box, exact){
  const a = strictItems([el]), b = strictItems(box.childNodes);
  if(exact) return a.length===b.length && a.every((x,i)=>x===b[i]);
  let j = 0;
  for(let i=0; i<b.length && j<a.length; i++) if(b[i]===a[j]) j++;
  return j===a.length;
}
/* 纯文字块：段落、标题、只有文字行的引用。有结构的块（代码块、列表、表格、分隔线，
   以及里面套了列表／表格／代码块的段落和引用）对不上一律不兜底、不压平。 */
function isPureText(el){
  if(!el || el.nodeType!==1) return false;
  const t = el.tagName;
  if(t!=='P' && !/^H[1-6]$/.test(t) && t!=='BLOCKQUOTE') return false;
  // 按白名单认：里面只许有行内的东西（引用底下那一层 <p> 除外）。混进了别的块——
  // 列表、代码、落单的格子／表格行（插 HTML 插出来的）——就不是纯文字，不走照存＋重画
  return [...el.querySelectorAll('*')].every(n => /^(STRONG|EM|DEL|CODE|A|IMG|BR|SPAN)$/.test(n.tagName)
    || (t==='BLOCKQUOTE' && n.tagName==='P' && n.parentNode===el));
}
/* 纯文字兜底（只给纯文字块）：字、图、链接、双链原样，加粗斜体这类格式不要了；
   会被认成标记的字符一律换成实体；块里的换行写成 <br>；标题保留级别，引用一段一行。 */
function plainMd(el){
  const inline = node => {
    let out = '';
    node.childNodes.forEach(n => {
      if(n.nodeType===3){ out += protectPlain(n.nodeValue.replace(/[\s\u00a0]+/g, ' '), true); return; }
      if(n.nodeType!==1) return;
      const t = n.tagName;
      if(t==='BR'){ out += '<br>'; return; }
      if(t==='INPUT' || (t==='SPAN' && n.classList.contains('imgbad'))) return;
      if(t==='IMG'){
        const alt = (n.getAttribute('alt')||'').replace(/[`*~\[\]<>]/g, ch=>MD_ENT[ch]||ch);
        out += `![${alt}](${wellFormed(n.getAttribute('data-u') || n.getAttribute('src') || '').replace(/\)/g,'&#41;')})`;
        return;
      }
      if(t==='A' && n.dataset.wl!==undefined){
        if(/!$/.test(out)) out = out.slice(0, -1) + '&#33;';
        out += `[[${n.dataset.wl}]]`; return;
      }
      if(t==='A' && (n.hasAttribute('data-u') || n.hasAttribute('href'))){
        if(/!$/.test(out)) out = out.slice(0, -1) + '&#33;';
        const u = wellFormed(n.getAttribute('data-u') ?? n.getAttribute('href') ?? '');
        out += '[' + inline(n) + '](' + u.replace(/\)/g,'&#41;') + ')';
        return;
      }
      out += inline(n);
    });
    return trimKeepWide(out.replace(/(?:<br>)+$/, ''));      // 行首全角空格留着（同段落）
  };
  if(el.tagName==='BLOCKQUOTE'){
    const lines = [];
    let run = null;
    const flush = () => { if(run){ lines.push('> ' + inline(run)); run = null; } };
    el.childNodes.forEach(c => {
      if(c.nodeType===1 && /^(P|DIV)$/.test(c.tagName)){ flush(); lines.push('> ' + inline(c)); return; }
      if(!run){ if(c.nodeType===3 && !c.nodeValue.trim()) return; run = document.createElement('p'); }
      run.appendChild(c.cloneNode(true));
    });
    flush();
    return lines.length ? lines.join('\n') : '> ';
  }
  const md = inline(el);
  if(/^H[1-6]$/.test(el.tagName)) return '#'.repeat(+el.tagName[1]) + ' ' + md;
  return isStructLine(md) ? '\u200b'+md : md;
}
/* 一块要写进文件的 md，以及它过没过自检（编排者定的口径，G-fix §0）：
     ok      看得见的样子（visSig）对得上：照常
     !ok     纯文字块对不上，但严格不丢闸成立（字、图地址和 alt、链接地址、双链目标、勾选都在、
             顺序一致）：照写这份 md；光标离开这一块时按它重画（屏幕＝文件），提示一句
     lossy   纯文字块、严格闸不成立：改写成纯文字兜底（plainMd），兜底再按「一个不多一个不少」
             验一遍；过了照写、离开时重画
     stuck   其余一切——有结构的块（代码块、列表、表格）对不上，或者兜底也验不过：
             这一块不写、文件里留它原来的字节，其余各块照存；胶囊「有 N 处存不进」，dirty 一直为真
   stuck 时 md 只是参考（编辑器眼里的样子，源码框里给人看），不进文件。 */
function blockVerdict(el, base){
  const b = base || '';
  const md = blkMd(el, b);
  const box = document.createElement('div');
  if(md.trim()) box.innerHTML = md2html(md, b, 0);
  else if(!visChars([el]) && !el.querySelector('img,input,span.imgbad')) return {md, ok:true};   // 空块：不写出去，也不用管
  const a = visSig([el]), s = visSig(box.children);
  if(a===s) return {md, ok:true};
  if(isPureText(el)){
    if(strictKeeps(el, box)) return {md, ok:false, a, s};
    const fb = plainMd(el);
    const box2 = document.createElement('div');
    box2.innerHTML = md2html(fb, b, 0);
    if(strictKeeps(el, box2, true)) return {md:fb, ok:false, lossy:true, a, s};
  }
  return {md, ok:false, stuck:true, a, s};
}

/* 比两段 HTML 是不是同一个东西。行号、块号、脏标记、标题 id 都是运行时贴上去的，
   不参与比较；贴着标签的那些空白也不算——库里很多行末尾挂着两个空格
   （别处 markdown 的「硬换行」写法，这里的渲染器不认，显示上等于没有）。
   词与词中间的空白照比，代码块里的缩进和换行也照比。
   存盘自检已经改比 visSig（看得见的样子），这个只剩 ?mdrt 自检和测试台在用。 */
function normHtml(h){
  return String(h)
    .replace(/\s(data-(l0|l1|bid|be|dirty|lock|ph)|contenteditable|id)="[^"]*"/g, '')
    // 块末尾那一个 <br> 不参与比较：浏览器拿它当光标位，显示上等于没有，
    // inlMd 出口处本来就不写出去。留着比会让「按一次换行再贴图」这种正常操作
    // 在存盘自检里报一次假警。连着两个以上是真的空行，照旧比，报警是对的。
    // 加 g：一张表里每个空格子末尾都有一个，只剥第一个的话整块就判「会变样」。
    .replace(/<br\s*\/?>(?=<\/(?:p|li|td|th|h[1-6]|blockquote|div)>|$)/ig, '')
    .replace(/>\s+/g, '>')
    .replace(/\s+</g, '<')
    .trim();
}

/* 这一块能不能当富文本改：反解成 markdown 再渲染回来，跟现在看起来一模一样才算能。
   对不上的（裸 HTML、认不出的表格写法、md2html 覆盖不到的语法）就锁住，
   只能点「改源码」按源码改——那是 v10 走的老路，不会有人被改坏。 */
function safeBlock(el, base){
  try{
    const md = blkMd(el, base);
    if(!md.trim()) return false;
    const box = document.createElement('div');
    box.innerHTML = md2html(md, base, 0);
    return visSig([el])===visSig(box.children);
  }catch(e){ return false; }
}

/* ── 标签页 ─────────────────────────────
   每个标签一份 pane ＋一份浏览栈。标签条始终在（solo 除外），一份也出。
   标题撞车时保住尾巴；装不下的进 ▾，不横滑、不偷偷踢掉最老的。 */
let TABS = [], curTab = null, tabSeq = 0;

const paneOf = t => document.getElementById('pane-'+t.id);
const active = () => TABS.find(t=>t.id===curTab) || null;

/* 每个标签一份浏览栈。kind 决定 pane 里画什么；idx 是前进后退的指针。
   第一次打开文件时栈里只有一项——从开始页点进去用 replace，避免多一截空历史。 */
function kindOfTab(t){
  if(!t) return 'start';
  if(t.kind) return t.kind;
  if(t.ext) return 'md';
  if((t.type||'')==='html' || /\.html?$/i.test(t.path||'')) return 'html';
  if(t.path) return 'md';
  return 'start';
}
function titleOfEntry(e){
  if(!e) return TR('开始');
  if(e.kind==='start') return TR('开始');
  if(e.kind==='search') return e.q || e.title || TR('搜索');
  if(e.kind==='folder') return e.folder || e.title || TR('文件夹');
  if(e.kind==='pins') return TR('已收藏');
  if(e.kind==='todo') return TR('待办##page');
  return e.title || (e.path||'').split('/').pop() || TR('无标题');
}
function makeEntry(kind, extra){
  return Object.assign({kind:kind||'start', path:'', title:'', q:'', folder:''}, extra||{});
}
function ensureStack(t){
  if(!t) return null;
  if(!t.stack || !t.stack.length){
    t.stack=[makeEntry(kindOfTab(t), {path:t.path||'', title:t.title||'', q:t.q||'', folder:t.folder||''})];
    t.idx=0;
  }
  if(t.idx==null || t.idx<0) t.idx=0;
  if(t.idx>=t.stack.length) t.idx=t.stack.length-1;
  return t.stack[t.idx];
}
function applyEntry(t, e){
  if(!t || !e) return;
  t.kind=e.kind;
  t.path=e.path||'';
  t.title=e.title || titleOfEntry(e);
  t.q=e.q||'';
  t.folder=e.folder||'';
  t.type = e.kind==='html' ? 'html' : 'md';
}
function makeTab(entry){
  const e=entry||makeEntry('start', {title:TR('开始')});
  const t={
    id:'t'+(++tabSeq),
    path:e.path||'',
    title:e.title || titleOfEntry(e),
    type:e.kind==='html'?'html':'md',
    kind:e.kind||'start',
    q:e.q||'',
    folder:e.folder||'',
    stack:[makeEntry(e.kind, e)],
    idx:0
  };
  return t;
}
function canBack(t){ t=t||active(); return !!(t && t.stack && t.idx>0); }
function canForward(t){ t=t||active(); return !!(t && t.stack && t.idx<t.stack.length-1); }
function isStartTab(t){ return kindOfTab(t)==='start'; }
function inReaderNow(){
  if(SOLO) return TABS.length>0;
  return TABS.some(t=>kindOfTab(t)!=='start') || TABS.length>1;
}
function hasDocNow(t){
  t=t||active();
  const k=kindOfTab(t);
  return !!(t && (k==='md'||k==='html') && t.path);
}
/* 「最近打开」这一条的时间戳（5.10）。在这之前列表按打开顺序排、却写着文件的
   mtime，于是时间列不单调：第 1 行「2025年12月8日」、第 2 行「今天 20:10」。
   现在每开一篇就盖一个 `打开于`（Unix 秒，跟 `改于` 同一口径，直接喂 fmtWhen），
   同一篇再打开就更新并挪回队首。老档案里的条目没有这个字段，读的时候回落 mtime。
   只存一个数字，不是路径，所以不进 nbMapStored 那张迁移表。 */
function touchRecent(it){
  const p=it && (it.路径||it.path); if(!p) return;
  const rec=Array.isArray(ST.recents)?ST.recents.slice():[];
  ST.recents=[{路径:p, 标题:it.标题||it.title||p, 类型:it.类型||it.type||'md',
    打开于:Math.floor(Date.now()/1000)},
    ...rec.filter(x=>x && x.路径!==p)].slice(0,12);
  ST.lastPath=p; saveST();
}
/* 这一篇上次是什么时候打开的。只有「最近打开」那一列和续读大卡问这个问题——
   收藏页和文件夹页答的是「这份文件什么时候改的」，还是 mtime。
   ST.recents 封顶 12 条，线性找一遍比建 Map 便宜。0 ＝ 没记过，调用方回落 mtime。 */
function openedAt(rel){
  const rec=ST.recents||[];
  for(let n=0;n<rec.length;n++){
    const r=rec[n];
    if(r && r.路径===rel) return +r.打开于 || 0;
  }
  return 0;
}
function currentPath(t){
  t=t||active();
  const e=t && ensureStack(t);
  if(!e) return '';
  if(e.kind==='search') return e.q||'';
  if(e.kind==='folder') return (e.folder||'')+'/';
  if(e.kind==='pins') return TR('已收藏');
  if(e.kind==='todo') return TR('待办##page');
  if(e.kind==='start') return '';
  return e.path||t.path||'';
}
function setPaneMode(t){
  const p=t && paneOf(t); if(!p) return;
  const k=kindOfTab(t);
  const html=k==='html', pg=isPageKind(k);
  p.classList.toggle('html', html);
  p.classList.toggle('pg', pg);
  const ifr=p.querySelector('.htmlframe');
  const box=p.querySelector('.pagebox');
  if(ifr){
    ifr.hidden=!html;
    if(!html){ try{ ifr.removeAttribute('src'); ifr.src='about:blank'; }catch(e){} }
  }
  if(box) box.hidden=!pg;
}
function flashLoad(){
  const el=$('#loadbar'); if(!el) return;
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(flashLoad._t);
  flashLoad._t=setTimeout(()=>el.classList.remove('on'), 560);
}

async function navigate(entry, opt){
  opt=opt||{};
  closeUserPop();
  entry=makeEntry(entry.kind, entry);
  let t=opt.tab || active();
  if(!t || opt.newTab){
    t=makeTab(entry);
    TABS.push(t); newPane(t);
    enterReader(); showTab(t.id);
    await loadEntry(t);
    return t;
  }
  // 有东西可丢就先等落盘，落成了再跑一遍；没落成就不跳，字留在编辑区里。
  // 干净又没冲突的编辑态照旧同步收掉——平常跳转不该为此多一次来回。
  // src 框里的改动 dirty 看不见（.md 还是进框前那一版），所以在源码里也一律先存。
  if(t.editing){
    const ep=paneOf(t);
    if(t.editing && (dirty(t) || t.conflict || (ep && ep.classList.contains('src')))){
      saveBeforeLeave(t).then(ok=>{ if(ok) navigate(entry, opt); });
      return;
    }
    endEdit(t);
  }
  ensureStack(t);
  const replace=!!opt.replace || kindOfTab(t)==='start';
  if(replace) t.stack[t.idx]=entry;
  else{
    t.stack=t.stack.slice(0, t.idx+1);
    t.stack.push(entry);
    t.idx=t.stack.length-1;
  }
  applyEntry(t, entry);
  drawTabs();
  await loadEntry(t);
  return t;
}
async function goHist(dir){
  const t=active(); if(!t) return;
  ensureStack(t);
  const n=(t.idx||0)+dir;
  if(n<0 || n>=t.stack.length) return;
  if(t.editing){                              // 同 navigate：有改动就先落盘，落成了再走一遍
    const ep=paneOf(t);
    if(t.editing && (dirty(t) || t.conflict || (ep && ep.classList.contains('src')))){
      saveBeforeLeave(t).then(ok=>{ if(ok) goHist(dir); });
      return;
    }
    endEdit(t);
  }
  t.idx=n;
  applyEntry(t, t.stack[n]);
  drawTabs();
  await loadEntry(t);
}
async function loadEntry(t){
  if(!t) return;
  closeType();
  const e=ensureStack(t);
  applyEntry(t, e);
  setPaneMode(t);
  flashLoad();
  /* 5.14 待办页那份快照：每进一次这一页（导航、前进后退、新标签、⌘⇧T）都按最新数据重建，
     上一回刚勾掉、还灰着留在原位的那几行这时才消失。离开这一页也一并丢掉——
     还在路上的勾选请求回来时认得出「页面已经不是发请求时那一版」，只更新数据、不碰页面。 */
  t.td=null;
  const k=kindOfTab(t);
  if(k==='md'){
    if(t.ext) await loadExt(t);
    else await loadMd(t);
  }else if(k==='html'){
    loadHtml(t);
  }else{
    paintPage(t);
  }
  if(t.id===curTab){
    buildToc(); syncRel(); syncProg(); syncBar(); syncChrome();
  }
  if(k==='md'){ const p=paneOf(t); if(p) pageEnter(p.querySelector('.doc-layout')); }
}
/* ── 库内 html 的预览框 ───────────────────
   沙箱只开 allow-scripts，脚本因此跑在一个不透明源（opaque origin）里：能画图、
   能算，但跟门户不同源。所以读不到 /portal 上的 <meta name="amn-token">，
   fetch 回服务端会被同源策略挡下（服务端一条 CORS 头都不发），就算走表单那种
   「简单请求」，POST 也先过 _gate() 的 Origin 检查——沙箱发出来的是 Origin: null，
   直接 403。AI 写的汇报页里那些 JS 图表能跑起来，库里的内容和 token 仍旧够不着。

   下面这几样一个都不要加，各有各的破法：
     · allow-same-origin —— 和 allow-scripts 一起给就等于没有沙箱：页面同源之后
       能读 token、能读库里任何一页，还能自己把 sandbox 属性摘掉。
     · allow-modals —— alert / confirm 在壳里弹的是原生 NSAlert，一份 html 就能
       把整个 app 卡在那儿。
     · allow-popups、allow-top-navigation —— 前者另开一扇窗，后者把当前这扇窗导走，
       两条都能在用户以为还在 AM·Note 里的时候把他带去别处。
     · allow-forms —— 表单提交打出去的 Origin 一样是 null，_gate() 那关照样 403；
       但那是服务端在兜底，沙箱这层不给 allow-forms，请求根本发不出去。两道都留着，
       少哪一道都还剩一道。

   referrerpolicy="no-referrer" 管的只有一件事：iframe 自己去取这份 html 的那一次
   请求，不带 Referer。服务端根本不读 Referer，顶层 URL 里也没有 token，所以它眼下
   挡不下什么，留着纯粹是纵深防御。别把它当成「这页往外发请求都不带来路」——文档载
   进来之后自己发的请求，引用策略看的是那份响应自己的头和页面里的 meta，不从这个属性
   继承下去。

   顺序也得守住：先 setAttribute('sandbox', …) 再赋 src。沙箱标记是文档开始加载
   的那一刻定下来的，先给 src 再补属性，这一次加载就是没沙箱的。 */
function loadHtml(t){
  const p=paneOf(t); if(!p) return;
  let ifr=p.querySelector('.htmlframe');
  if(!ifr){
    ifr=document.createElement('iframe');
    ifr.className='htmlframe';
    ifr.setAttribute('sandbox','allow-scripts');
    ifr.setAttribute('referrerpolicy','no-referrer');
    p.appendChild(ifr);
  }
  ifr.setAttribute('sandbox','allow-scripts');
  ifr.setAttribute('referrerpolicy','no-referrer');
  ifr.title=t.title||'';
  const u=url(t.path);
  ifr.src='about:blank';
  setTimeout(()=>{ ifr.setAttribute('sandbox','allow-scripts'); ifr.src=u; }, 0);
  drawDocMeta(t);
}
/* 换一页就轻轻淡进来一下。重复调用要先摘掉再挂，不然动画不重放。 */
function pageEnter(el){
  if(!el) return;
  el.classList.remove('page-enter');
  void el.offsetWidth;
  el.classList.add('page-enter');
  const off=()=>el.classList.remove('page-enter');
  el.addEventListener('animationend', off, {once:true});
  setTimeout(off, 400);                       // 动画没跑（元素当时不可见）也要摘掉
}
/* 某一块在这一栏里从顶上数下来多少像素。不用 offsetTop——中间那几层
   （版心、淡入动画）随时可能变成 offsetParent，算出来就偏了。 */
function scrollYOf(box, el){
  if(!box || !el) return 0;
  return box.scrollTop + el.getBoundingClientRect().top - box.getBoundingClientRect().top;
}
/* 开始页 / 搜索页 / 文件夹页 / 已收藏页，四种都画在这个标签自己的 .pagebox 里。
   5.4 起四种都是纯白 --win，卡片靠阴影浮起来；--canvas 只留给引用块和内凹控件。 */
function isPageKind(k){ return k==='start'||k==='search'||k==='folder'||k==='pins'||k==='todo'; }
function paintPage(t, opt){
  const p=paneOf(t); if(!p) return;
  const box=p.querySelector('.pagebox'); if(!box) return;
  const k=kindOfTab(t);
  const quiet=!!(opt&&opt.quiet);
  const y=quiet ? box.scrollTop : 0;
  if(k==='search') paintSerp(t, box);
  else if(k==='folder') paintFolder(t, box);
  else if(k==='pins') paintPins(t, box);
  else if(k==='todo') paintTodo(t, box, quiet);
  else paintStart(box);
  wireAvatars(box);
  if(quiet) box.scrollTop=y;
  else pageEnter(box);
}
/* 收藏或筛选变了就地重画：滚动位置留住，也不再放一遍淡入。 */
function repaintPages(){
  TABS.forEach(t=>{ if(isPageKind(kindOfTab(t))) paintPage(t, {quiet:true}); });
}

/* ── 收藏 ────────────────────────────────
   存的是库根相对路径，跟着 tp-state 走。文件改了名或删了，
   下一次 /__tree 回来时在 prunePins 里剔掉，不留死链。 */
function pinSet(){ return new Set(Array.isArray(ST.pins)?ST.pins:[]); }
function isPinned(rel){ return !!rel && pinSet().has(rel); }
function togglePin(rel){
  if(!rel) return;
  const arr=Array.isArray(ST.pins)?ST.pins.slice():[];
  const at=arr.indexOf(rel);
  if(at>=0) arr.splice(at,1); else arr.unshift(rel);
  ST.pins=arr; saveST();
  notify(at>=0 ? TR('已取消收藏') : TR('已放进「已收藏」'));
  repaintPages();
}
function prunePins(){
  /* 笔记本列表还没回来（或者刚要迁移）：这时候 items 里的路径形态跟 pins 里的
     可能不是一回事，剪下去就是把收藏静默删光。等 nbApply() 落地再说。 */
  if(!nbReady) return;
  const arr=Array.isArray(ST.pins)?ST.pins:[];
  if(!arr.length || !items.length) return;
  const have=new Set(items.map(i=>i.路径));
  const next=arr.filter(p=>have.has(p));
  if(next.length!==arr.length){ ST.pins=next; saveST(); }
}
function openPins(newTab){
  navigate(makeEntry('pins', {title:TR('已收藏')}), {newTab:!!newTab});
}
/* 5.14「待办」页：写法同已收藏——从开始标签点进去是替换，⌘ 点开新标签。 */
function openTodo(newTab){
  navigate(makeEntry('todo', {title:TR('待办##page')}), {newTab:!!newTab});
}

/* ── 卡片清单 ────────────────────────────
   排序：先按「最近打开」的次序，剩下的按改动时间倒序。再过一遍类型筛。 */
/* 文件夹页 / 已收藏页一批画几张。开始页是 12 张的硬上限，不走这条。
   5.9 起每张卡多一张预览（≈20 个 CSS 条），一个 2000 篇的文件夹一次拼完会卡死，
   所以先画一批，末尾挂一枚「再看 {n} 篇」。content-visibility 要 Safari 18，
   MIN_MACOS 是 12，那条路走不通，只能靠 JS 分批。 */
const CARDS_BATCH=60;
/* 这一屏画了几张记在标签对象上（t.cardsN），换文件夹／换筛选就归零：
   key 变了＝换了一屏，重新从一批开始；key 没变（收藏、就地重画）＝原样留住，
   repaintPages 因此是幂等的，滚动位置也不会跳。 */
function cardsBatch(t, key){
  if(!t) return CARDS_BATCH;
  if(t.cardsKey!==key){ t.cardsKey=key; t.cardsN=CARDS_BATCH; }
  return t.cardsN||CARDS_BATCH;
}
function pageDocs(kind, folder){
  let pool;
  if(kind==='pins'){ const set=pinSet(); pool=items.filter(i=>set.has(i.路径)); }
  else if(kind==='folder') pool=filesInFolder(folder);   // 文件夹本身已经限定了笔记本
  else pool=items.slice();
  /* 聚焦某个笔记本时只看那一本；「全部」和单库不过滤（P2 / P3）。
     文件夹页的 folder 前缀里已经带着笔记本名，不用再筛一遍。 */
  // 收藏是跨笔记本的（§4b.1），不跟着笔记本条收窄
  if(kind!=='folder' && kind!=='pins' && NB.cur) pool=pool.filter(inCurBook);
  pool=pool.filter(i=>{ const k=kindOf(i); return k==='md'||k==='html'; });
  const f=homeFilter();
  if(f!=='all') pool=pool.filter(i=>kindOf(i)===f);
  const rank=new Map();
  (ST.recents||[]).forEach((r,n)=>{ if(r&&r.路径&&!rank.has(r.路径)) rank.set(r.路径, n); });
  const at=i=>rank.has(i.路径)?rank.get(i.路径):9999;
  return pool.sort((a,b)=>(at(a)-at(b)) || ((b.修改时间||0)-(a.修改时间||0)));
}
function homeFilter(){ return (ST.homeFilter==='md'||ST.homeFilter==='html') ? ST.homeFilter : 'all'; }
/* 上次读的那一篇：只认 ST.recents，没有就不画「继续阅读」。 */
function resumeDoc(){
  const rec=(ST.recents||[]);
  for(let n=0;n<rec.length;n++){
    const r=rec[n]; if(!r || !r.路径) continue;
    const it=items.find(i=>i.路径===r.路径);
    if(it && kindOf(it)==='md' && inCurBook(it)) return it;
  }
  return null;
}
/* 这一篇在哪个目录里。多笔记本时先把笔记本名那一段剥掉——它由 showBook()
   决定要不要单独说，不跟目录混成一串。 */
function folderLabel(rel){
  const p=NB.strip(String(rel||'')), at=p.lastIndexOf('/');
  return at<0 ? TR('库根') : p.slice(0, at);
}
/* 正在画的这一屏的「范围」。null＝跟笔记本条走；'' ＝跨全部笔记本
   （已收藏页、搜索里把范围切回「全部」的那一次）；'名字' ＝限在那一本。
   收藏是跨笔记本的虚拟文件夹，哪怕此刻聚焦在某一本，它也得报清楚每条是谁的。 */
let nbCtx=null;
function withNbCtx(v, fn){
  const old=nbCtx; nbCtx=v;
  try{ return fn(); } finally{ nbCtx=old; }
}
/* 「这一篇是哪一本的」要不要露出来：只有范围是「全部」时要（P3/P4）。
   聚焦某一本和单库都不说——同一个笔记本里不必反复讲自己是谁。 */
function showBook(rel){
  if(!NB.multi) return '';
  const s = nbCtx===null ? NB.cur : nbCtx;
  return s ? '' : NB.of(rel);
}
/* 卡片页脚 / 继续阅读 / ⌘K / 搜索结果那一段「这一篇在哪儿」。
   「全部」模式：● 工作 › 会议（就在那一本的根上时只写 ● 工作，不写「› 库根」——
   笔记本名本身已经说清了）。聚焦某一本和单库：还是今天那样，黄夹子 ＋ 目录。
   opt.fdr＝目录那一段套 .fdr（卡片页脚靠它打省略号）；opt.icon＝没有色点时补黄夹子。 */
/* 就在某一本的根上、而且这一屏不打算说本名（聚焦模式）：这时候「库根」是句
   没着落的话——哪一本的根？多笔记本时一律报「● 本名」，跟「全部」模式同一种写法。
   单库照旧写「库根」（P1 零变化）。回空串＝没有这一档，走原来那条。 */
function rootBook(rel, book){
  if(book || !NB.multi) return '';
  return NB.of(rel);
}
function whereHtml(rel, opt){
  opt=opt||{};
  const book=showBook(rel);
  const inner=NB.strip(String(rel||''));
  const root = inner.indexOf('/')<0;
  if(root){
    const own=rootBook(rel, book);
    if(own) return nbDot(own,{sm:true})+`<span class="nbname">${esc(own)}</span>`;
  }
  const dir = root ? (book ? '' : TR('库根')) : folderLabel(rel);
  const d = dir ? (opt.fdr ? `<span class="fdr">${esc(dir)}</span>` : esc(dir)) : '';
  if(book) return nbDot(book,{sm:true})+`<span class="nbname">${esc(book)}</span>`
    + (d ? `<span class="csep">›</span>`+d : '');
  return (opt.icon ? icon('folder',11) : '') + d;
}
/* 同一段的纯文本版：给 title / aria-label 这种放不下标签的地方。 */
function folderText(rel){
  const book=showBook(rel);
  const inner=NB.strip(String(rel||''));
  const root = inner.indexOf('/')<0;
  if(root){
    const own=rootBook(rel, book);
    if(own) return own;
  }
  const dir = root ? (book ? '' : TR('库根')) : folderLabel(rel);
  return book ? (dir ? book+' › '+dir : book) : dir;
}
/* 卡片上那两行摘录。/__tree 给的「预览」是原始 md，井号、星号、表格竖线
   全在里面；先洗一遍，再把开头重复的标题去掉，不然卡片上标题会写两遍。 */
function cardText(i){
  let s=String((i&&i.预览) || (NOTEPV && NOTEPV.get(i&&i.路径)) || '');
  s=s.replace(/[#>*`~\[\]]/g,'').replace(/\|/g,' ').replace(/-{3,}/g,' ')
     .replace(/\s+/g,' ').trim();
  const t=String((i&&i.标题)||'').trim();
  if(t && s.slice(0,t.length)===t) s=s.slice(t.length).trim();
  return s.slice(0,140);
}
/* 眉行、大标题、副标，右边一颗「＋ 新建随手记」。
   眉行和副句都是给了才画：开始页 5.8 起两样都不要，只剩一句问候（§1）；
   收藏页和文件夹页照旧传眉行。
   opts.scan＝大标题行尾挂一枚服务状态点（原底部状态栏那一格，只有开始页要）。 */
function greetingHtml(ico, eyebrow, title, sub, opts){
  /* 首次渲染就按当前状态带上类，免得就绪的库先闪一下「扫描中」再消失；
     之后状态变了由 syncScanChip() 就地改类和文字，这里不再重画。 */
  const scan = (opts&&opts.scan)
    ? `<span class="scan${SRV_STATE==='scan'?' scan-busy':(SRV_STATE==='off'?' scan-off':'')}" data-scan><i></i><span class="tx">${esc(scanChipText())}</span></span>`
    : '';
  /* 聚焦某个笔记本时大标题后面淡淡带一笔「· ● 工作」（§4.1）。「全部」不带。 */
  const here = (opts&&opts.here)
    ? `<span class="here">· ${nbDot(opts.here)}${esc(opts.here)}</span>` : '';
  const av = (opts&&opts.avatar)
    ? `<button type="button" class="uchip" id="userChip" title="${esc(profileName() || TR('个人资料'))}" aria-label="${esc(TR('个人资料'))}" aria-haspopup="dialog" aria-expanded="false">${avatarHtml(22)}</button>`
    : '';
  return `<div class="home-greeting">
    <div class="greet-who">
      ${av}
      <div>
        ${eyebrow?`<div class="eyebrow">${ico} ${esc(eyebrow)}</div>`:''}
        <h1>${esc(title)}${here}${scan}</h1>
        ${sub?`<p class="home-sub">${esc(sub)}</p>`:''}
      </div>
    </div>
    <button type="button" class="hbtn key hero-new" data-act="newnote">${icon('plus',16)}<span class="lbl">${esc(TR('新建随手记'))}</span></button>
  </div>`;
}
/* 顶层文件夹芯片行：数据跟书签栏是同一份（TREE.目录），点开文件夹页，⌘ 点开新标签。
   末尾那枚是「已收藏」。5.4 起书签栏由它取代。
   顶层文件夹一多就是三行，5.4.1 起整行可收：收起后只剩「已收藏」＋一枚计数，
   位置不动，所以上面的问候区不会跟着跳。一个顶层文件夹都没有时不出收放件。 */
function chipsOpen(){ return ST.chipsOpen!==false; }
function favChipHtml(cls){
  return `<button type="button" class="${cls||'dirchip'} fav" data-act="pins" title="${esc(TR('已收藏'))}">${icon('star',13)}<span${cls?' class="lbl"':''}>${esc(TR('已收藏'))}</span></button>`;
}
/* 当前笔记本（或单库）那一本的顶层文件夹。data-folder 用的是**前缀路径**，
   点开的文件夹页因此天然知道自己属于哪一本。 */
function bookDirs(book){
  const dirs=(TREE&&TREE.目录)||[];
  if(!NB.multi) return dirs.map(d=>({名称:d.名称, 显示名:d.显示名||d.名称, 份数:d.份数||0, path:d.名称}));
  // 文件夹页看的是**那个文件夹自己那一本**，不一定等于笔记本条选的那一本
  const cur=book===undefined ? NB.cur : book;
  if(!cur) return [];
  return dirs.filter(d=>d.本===cur)
    .map(d=>({名称:d.名称, 显示名:d.显示名||d.名称, 份数:d.份数||0, path:cur+'/'+d.名称}));
}
/* opt.on＝下钻时被点开的那一枚（前缀路径）；opt.drill＝文件夹页那一版，
   不画「已收藏」也不画收放件（这两样属于开始页）。 */
function startChipsHtml(opt){
  opt=opt||{};
  const dirs=bookDirs(opt.book);
  /* 多笔记本时「已收藏」挪进了笔记本条（§4b.1），这一行只管文件夹。 */
  const fav = (NB.multi || opt.drill) ? '' : favChipHtml();
  const chip=d=>`<button type="button" class="dirchip${opt.on===d.path?' on':''}" data-folder="${esc(d.path)}" title="${esc(d.名称)}">${icon('folder',13)}<span>${esc(d.显示名)}</span></button>`;
  if(!dirs.length) return fav ? `<div class="dirchips">${fav}</div>` : '';
  if(!opt.drill && !chipsOpen()){
    return `<div class="dirchips folded">${fav}<button type="button" class="chipfold"
      data-act="chipsfold" aria-expanded="false" title="${esc(TR('展开文件夹'))}">${icon('folder',14)}<span>${esc(TR('{n} 个文件夹',{n:dirs.length}))}</span><span class="ar" aria-hidden="true">›</span></button></div>`;
  }
  const fold = opt.drill ? '' : `<button type="button" class="chipfold"
      data-act="chipsfold" aria-expanded="true" title="${esc(TR('收起文件夹'))}">${icon('chevron-up',13)}<span>${esc(TR('收起'))}</span></button>`;
  return `<div class="dirchips">${dirs.map(chip).join('')}${fav}${fold}</div>`;
}
/* ── 笔记本条（P2）──────────────────────
   `全部 | ● 工作 | ● 读书 | ☆ 已收藏 | ＋`。开始页唯一的「当前笔记本」开关，
   只有两本以上才画。超过 6 本按 .chipfold 那套收起来，「全部」「已收藏」「＋」永不收。
   opt.scope＝⌘K／搜索页顶上那一行范围芯片：矮一档、没有「＋」和「已收藏」，
   选择只影响这一次。 */
function nbStripHtml(cur, opt){
  opt=opt||{};
  if(!NB.multi) return '';
  const scope=!!opt.scope;
  const folded = !scope && NB.list.length>6 && ST.nbFold!==false;
  const one=n=>{
    const gone=n.状态==='离线';
    return `<button type="button" class="nbchip ${NB.cls(n.名字)}${cur===n.名字?' on':''}${gone?' gone':''}"`
      + ` data-nb="${esc(n.名字)}" title="${esc(n.名字)}">`
      + nbDot(n.名字,{gone})
      + `<span class="lbl">${esc(n.名字)}</span>`
      + (gone?`<span class="gonetag">${esc(TR('找不到'))}</span>`:'')
      + `</button>`;
  };
  /* 收起来时露头的那两枚里必须有当前选中的那一本：把它藏了，界面上就再也看不出
     自己此刻在哪一本里。不在前两枚里就顶掉第二枚。 */
  let shown=NB.list;
  if(folded){
    shown=NB.list.slice(0,2);

    if(b && shown.indexOf(b)<0) shown=[NB.list[0], b];
  }
  let h=`<div class="nbchips${scope?' scope':''}">`
    + `<button type="button" class="nbchip all${cur===''?' on':''}" data-nb="">`
    + `<span class="lbl">${esc(TR('全部'))}</span></button>`
    + shown.map(one).join('');
  if(folded)
    h+=`<button type="button" class="chipfold" data-act="nbfold" aria-expanded="false"`
      + ` title="${esc(TR('展开笔记本'))}"><span>${esc(TR('{n} 本',{n:NB.list.length-shown.length}))}</span>`
      + `<span class="ar" aria-hidden="true">›</span></button>`;
  // 展开着也要给一条收回去的路（文件夹芯片那一行早就是这么做的）
  else if(!scope && NB.list.length>6)
    h+=`<button type="button" class="chipfold" data-act="nbfold" aria-expanded="true"`
      + ` title="${esc(TR('收起笔记本'))}">${icon('chevron-up',13)}<span>${esc(TR('收起'))}</span></button>`;
  if(!scope){
    h+=favChipHtml('nbchip');
    h+=`<button type="button" class="nbchip add" data-act="addnb" title="${esc(TR('添加笔记本…'))}"`
      + ` aria-label="${esc(TR('添加笔记本…'))}">${icon('plus',13)}</button>`;
  }
  return h+`</div>`;
}
/* 面包屑（下钻）：`● 工作 › 会议 › 2026`，每一段都点得回去。 */
function crumbsHtml(folder){
  const parts=String(folder||'').split('/').filter(Boolean);
  const d=bookDepth();
  const book=d ? (parts[0]||'') : '';
  const rest=parts.slice(d);
  if(!book && !rest.length) return '';
  let h=`<nav class="crumbs" aria-label="${esc(TR('位置'))}">`;
  const acc=[];
  if(book){
    acc.push(book);
    h+=nbDot(book,{sm:true})
      + `<button type="button" class="cb${rest.length?'':' now'}" data-folder="${esc(book)}">${esc(book)}</button>`;
  }else{
    h+=`<button type="button" class="cb${rest.length?'':' now'}" data-folder="">${esc(TR('库根'))}</button>`;
  }
  rest.forEach((s,i)=>{
    acc.push(s);
    h+=`<span class="sep">›</span><button type="button" class="cb${i===rest.length-1?' now':''}"`
      + ` data-folder="${esc(acc.join('/'))}">${esc(s)}</button>`;
  });
  return h+`</nav>`;
}

/* 署名：这一篇最近一次是本机某个 AI 助手写的（/__tree 带回来的「代理」）。

const agentMark = i => (i && i.代理)
  ? `<span class="agentmark">✦ ${esc(i.代理)}</span>` : '';
/* ── 一行左边那枚文件徽标（5.12）──────────────────────────────
   一张 PNG，md 一枚 html 一枚，40px（窄屏 34）。5.11 那三枚模块级 SVG 常量
   （一份公共属性串 ＋ 描边的 M↓ 与 </> 两份路径）连同它们那一串坐标
   配平的账一起退役：这一版是 codex 出的珍珠玻璃渲染图，边缘折射、块体内发光和
   字形的立体厚度都不是描边画得出来的，所以直接贴他的原件（契约 §0：不复刻）。
   `骨架` 字段服务端照算照带（fulltext.py 的索引列、/__tree 的键都没动），
   前端从 5.11 起就不消费它了，这一轮也没捡回来：将来要回到「画内容」，底稿还在。
   尺寸不写在标签上（不带 width/height），由 CSS 的 .nthumb 管——沿用 5.11
   那条口径：断点那一档只改一个数。
   alt="" ＝ 纯装饰。外面这枚 .nthumb 本来就挂着 aria-hidden，行按钮自己带
   aria-label「打开 {标题}」，类型从来不靠这枚徽标报给读屏 —— 5.11 那枚 SVG
   也一个字都没给。所以这一轮一句新文案都不开，两份词典不用动。 */
function thumbHtml(i){
  const html=kindOf(i)==='html';
  return `<span class="nthumb" aria-hidden="true">`
    + `<img class="fpearl" src="${html?'/file-html.png':'/file-md.png'}" alt=""></span>`;
}
/* ── 副行：一行灰字，给一个点开的理由 ────────────────────────
   来源有规则，不靠手写副标题（brief §1.3-1）：
     `预览`（/__tree 已带回来的 ≤240 字洗净正文）的第一句，截 60 字
       → 取不到就写文件夹路径（去掉笔记本前缀，/ 换成「 / 」）
       → 再取不到（就在库根上）多本时写笔记本名、单库写「库根」。
   洗法跟 cardText 同一套（去 markdown 记号、去表格竖线、去开头重复的标题），
   差别只有两处：标题可能重复不止一次（html 抽取正文会把 <title> 和 <h1> 各留
   一行），所以循环剥；以及断句 —— 到第一个句号/问号/叹号为止，收尾的引号和
   右括号算在句子里面。
   断句认两套终止符：中文那套（。！？，后面跟什么都算）和英文那套（. ! ? 之后
   必须是空白或行尾）。英文那条的「必须跟空白」同时躲开了 `v1.0` / `3.14` 这类
   小数点——没有它，英文笔记永远匹配不到句号，整段 240 字被 60 字硬切在词中间
   （审查 S3）。 */
function rowDesc(i){
  let s=String((i&&i.预览) || (NOTEPV && NOTEPV.get(i&&i.路径)) || '');
  // 行内链接只留文字：不剥的话下面那一句剥完方括号会留下 `客服月报(https://…)`
  s=s.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');
  s=s.replace(/[#>*`~\[\]]/g,'').replace(/\|/g,' ').replace(/-{3,}/g,' ')
     .replace(/\s+/g,' ').trim();
  const t=String((i&&i.标题)||'').trim();
  while(t && s.slice(0,t.length)===t) s=s.slice(t.length).trim();
  const m=s.match(/^[\s\S]*?(?:[。！？!?](?=\s|$|[^」』"'）)])|\.(?=\s|$))/);
  s=(m?m[0]:s).trim();
  // 按码位切，不按 UTF-16 码元：`'字'×59 + 🎉` 硬切会留下半个代理对，渲染成 �
  const cp=Array.from(s);
  if(cp.length>60) s=cp.slice(0,60).join('')+'…';
  if(s) return s;
  const rel=String((i&&i.路径)||'');
  const inner=NB.strip(rel), at=inner.lastIndexOf('/');
  if(at>0) return inner.slice(0,at).split('/').join(' / ');
  return (NB.multi ? NB.of(rel) : '') || TR('库根');
}
/* ── 一行 ────────────────────────────────────────────────────
   ┌────┐  标题 ························· ● 15 分钟前

   └────┘
   日期写两份：.nmeta.wide 给宽屏（钉在最右），.nmeta.narrow 给 <700（跟到副行
   末尾）。CSS 用 display:none 切，被藏起来的那份同时退出无障碍树。
   data-open / data-kind 跟卡片时代一个字不差——点击、右键、中键那一套代理
   （newPane 里 .pagebox 上那一个 listener）因此零改动。 */
/* opened＝这一屏是「最近打开」（开始页）：时间列写这一篇上次**打开**的时刻，
   没记过的老条目回落 mtime。收藏页和文件夹页不传它，照旧写 mtime。 */
function noteRowHtml(i, opened){

    + `<span class="nmain">`

/* opt.n＝这一屏先画几行（文件夹页 / 已收藏页分批，见 CARDS_BATCH）。
   剩下的挂一枚「再看 {n} 篇」在列表下面——样式跟开始页那条「看全部」同一枚。
   不给 opt 就是全画（开始页自己已经切到 12 行）。
   opt.opened＝时间列写「打开于」（只有开始页那一屏传），见 noteRowHtml。 */
function rowsHtml(list, fallback, opt){
  if(!list.length) return fallback;
  const n=(opt && opt.n>0) ? Math.min(opt.n, list.length) : list.length;
  const rest=list.length-n;
  /* 数报的是「按一下会多出来几篇」，不是「还剩几篇」——段头那一枚已经说了总数。 */
  const more = rest>0
    ? `<button type="button" class="see-all" data-act="morecards">${icon('chevron-down',14)}<span>${esc(TR('再看 {n} 篇',{n:Math.min(CARDS_BATCH, rest)}))}</span></button>`
    : '';
  const op=!!(opt && opt.opened);
  return `<div class="notelist">${list.slice(0,n).map(i=>noteRowHtml(i,op)).join('')}</div>${more}`;
}
/* opts.big＝空库那一版，占满问候区以下整片空白并居中；opts.buttons＝换掉默认那颗按钮。 */

function paintStart(box){
  if(!box) return;
  const tip=`<p class="home-tip">${icon('search',13)} ${TR('想找以前写过的内容？按 {kbd} 搜一搜。',{kbd:'<kbd>⌘ K</kbd>'})}</p>`;
  if(!items.length){
    // 空库：⌘K 也搜不到东西，底下那行提示和文件夹芯片一起收起来
    const btns=`<button type="button" class="hbtn key" data-act="newnote">${icon('edit',15)}<span class="lbl">${esc(TR('写下第一篇'))}</span></button>
      <button type="button" class="hbtn" data-act="revealvault">${icon('folder',15)}<span class="lbl">${esc(TR('在访达中打开这个文件夹'))}</span></button>`;
    box.innerHTML=`<div class="home">
      ${greetingHtml('','',
        greetOn()?greetTitle():TR('今天，想记下什么？'),TR('笔记库已经就位，就差第一篇。'),{scan:true, avatar:true})}
      ${nbStripHtml(NB.cur)}

      </div>`;
    return;
  }
  const all=pageDocs('start');
  const last=resumeDoc();
  /* 续读大卡就是第 1 行的放大版（brief §1.5）：有大卡时列表从第 2 篇起，
     段头那个「n 篇」跟着少一篇；没有大卡就整列画。
     **扣掉大卡之后的这个 rest 才是这一屏的口径**——段头、空态、底下那颗
     「看全部」都按它算，拿 all 说话会在小库上自相矛盾（5.10 审查 P2）。
     行数 11 而不是 12：ST.recents 只存 12 条，大卡吃掉第 1 条，列表再画 12 行
     的话最后一行必然落在 rank=9999 档上、只能回落 mtime，时间列永远有一行
     对不上「打开于」（审查 S6）。brief §1.5 写的也是「其余 11 篇进列表」。
     没有大卡时照旧 12 行——那 12 条都在 recents 里，时间列一样是齐的。 */
  const rest=last ? all.filter(i=>i.路径!==last.路径) : all;
  const shown=rest.slice(0, rest.length<all.length ? 11 : 12);
  const cur=NB.cur;
  // 标题右边那个数报的是这一屏画了几张，不是库里一共几篇——数跟眼睛看到的对得上。
  // 装不下的走下面那条去库根，文件夹页里接着翻。
  // 「全部」模式下没有库根可去（§4b.7），这一条不画。
  const rootOfPage = NB.multi ? cur : '';
  const more=(rest.length>shown.length && (!NB.multi || cur))
    ? `<button type="button" class="see-all" data-folder="${esc(rootOfPage)}">${icon('folder',14)}<span>${esc(TR('看全部 {n} 篇',{n:all.length}))}</span></button>`
    : '';
  /* 5.8：副句不再复述大卡。问候开着又有大卡，那一句就是多余的——上次停在哪儿，
     底下那张卡自己写着。没有大卡才问一句今天想写什么；问候关着的话这句已经当了
     大标题，副句同样不画。 */
  const sub = (greetOn() && !last) ? TR('今天，想记下什么？') : '';
  /* 大卡把这一屏唯一的一篇吃掉了（库里统共就这一篇，写完第一篇就是这个画面）：
     段头和列表整块不画。再来一句「这一类还没有」是自相矛盾——那一篇明明就在
     上面的大卡里（审查 P2）。`all.length` 那一半是分寸：筛成「网页」而库里一篇
     网页都没有时 all 本来就是空的，那句「这一类还没有」是对的，照画。 */
  const recent = (!shown.length && all.length) ? ''
    : `${sectionHead(TR('最近打开'), shown.length)}
    ${rowsHtml(shown, emptyHtml(TR('这一类还没有'),esc(TR('换个类型看看，或者写点新的。'))), {opened:true})}`;
  box.innerHTML=`<div class="home">
    ${greetingHtml('','',
      greetOn()?greetTitle():TR('今天，想记下什么？'),sub,{scan:true, avatar:true})}
    ${nbStripHtml(cur)}
    ${(NB.multi && !cur) ? '' : startChipsHtml()}
    ${last?resumeHtml(last):''}
    ${tipsCardHtml()}
    ${todoDoorHtml()}
    ${recent}
    ${more}
    ${tip}</div>`;
}
