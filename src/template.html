@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  /* 卡片上浮、按钮回弹、芯片抬起、箭头右移、浮层落场、翻页淡入，全部按住不动 */
  .note-card:hover,.note-card:active,.resume:hover,.resume:active,
  .hbtn:hover,.hbtn:active,.btn:hover,.btn:active,.dt-btn:hover,.dt-btn:active,
  .dirchip:hover,.card-pin:hover,.resume:hover .continue svg,
  #appmark:hover img,#appmark:active{transform:none}
  button:active:not([disabled]){transform:none}
}
/* 系统里关掉「透明」时，毛玻璃退回实色，别糊成一团。 */
@media (prefers-reduced-transparency:reduce){
  #cmdkWrap,#qlwrap,#cfgWrap{-webkit-backdrop-filter:none;backdrop-filter:none}
  .doc-toolbar{background:var(--win);-webkit-backdrop-filter:none;backdrop-filter:none}
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--win)}
body{background:var(--win);color:var(--t1);
  font:13px/1.5 var(--ui);
  font-synthesis:none;
  -webkit-font-smoothing:antialiased;
  --tabstrip-h:42px; --status-h:0px;
  --chrome-h:var(--tabstrip-h)}
/* 标签跟红绿灯同一行，左侧让出交通灯（约 78px）。多出来的标签由 layoutTabs
   整颗藏进 ▾，不再被左边距裁成半个。 */
body.shell{--tabstrip-h:42px; --tab-left:80px}
body.solo{--tabstrip-h:0px; --status-h:0px}
body.shell.solo{--tabstrip-h:52px; --status-h:0px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;
  transition:background-color .16s ease,color .16s ease,box-shadow .18s ease,
             transform var(--d-fast) var(--ease-out)}
button:active:not([disabled]){transform:scale(.98)}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--hl)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
svg{fill:none;stroke:currentColor}

/* ═══ 骨架 ═══════════════════════════════
   5.4.1 起只剩正文一栏：列表栏（⌃⌘S）整条下线。
   分区只靠背景深浅和留白，全程无分割线无描边。 */
#app{display:grid;height:calc(100% - var(--status-h));
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"doc"}

/* 原生壳是全尺寸透明标题栏：标签条跟红绿灯同一行，工具条和书签栏再往下。
   内容从 --chrome-h 开始。 */
#app{padding-top:var(--chrome-h)}

/* ═══ 浏览器壳：只剩一条标签条 ═══════════
   42px 一行装下全部窗口层控件：左 ‹ › ⌂（壳里从红绿灯右缘 80px 起），
   中间标签，右边搜索胶囊 ＋ ⚙ ＋ 品牌标。空处可拖窗口，控件一律 no-drag。
   当前标签是一枚 9px 圆角白卡片，浮在 --chrome 灰底上。 */
/* 5.4 起顶栏与正文之间不画线：--chrome（#f7f8fa）和 --win（#fff）本来就差一档，
   色差就是分界。要加回来的话记得用 inset 阴影，不要用 border——border 会额外
   占 1px，而 --chrome-h 只算了标签条的高度，正文顶上就会被压掉一行的头。 */
#chrome{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--chrome);
  display:flex;flex-direction:column;box-shadow:none}
body.solo #chrome{display:none!important}
#tabstrip{
  height:var(--tabstrip-h);flex:none;position:relative;
  background:var(--chrome);
  display:flex;align-items:center;
  width:100%;box-sizing:border-box;
  padding:0 12px 0 var(--tab-left);gap:5px;
  user-select:none;-webkit-user-select:none;
  -webkit-app-region:drag;
  overflow:hidden;
}
/* 标签＋加号是一组：加号贴在最后一个标签后面。栏本身可以收缩，
   多出来的标签由 layoutTabs 整颗藏进 ▾，不要被 overflow 切成半个。 */
#tabcluster{
  display:flex;align-items:center;gap:5px;
  flex:0 1 auto;min-width:0;
  /* 右边那簇（搜索胶囊 ＋ ⚙ ＋ 品牌标）加左边三颗导航钮大概 320px，
     给标签留出上限，剩下的交给 flex 收缩和 layoutTabs 的 ▾ 收纳。 */
  max-width:max(120px, calc(100% - 320px));
  transition:opacity var(--d-base) var(--ease-out);
}
#tabstrip .tabbar{
  position:relative;top:auto;left:auto;right:auto;z-index:auto;
  display:flex;align-items:center;gap:4px;
  padding:0;overflow:visible;background:transparent;
  flex:1 1 auto;min-width:0;max-width:none;height:auto;
}
#tabstrip .tabbar.on{display:flex}
#tabstrip .tab{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:9px;
  min-width:96px;max-width:210px;flex:1 1 180px;
  height:34px;margin:0;
  padding:0 26px 0 12px;
  border-radius:var(--tab-r);background:transparent;box-shadow:none;
  color:var(--t2);font-weight:400;
  overflow:hidden;
  transition:background-color .16s ease,color .16s ease,box-shadow .18s ease;
}
#tabstrip .tab:hover{background:var(--hover);color:var(--t1)}
#tabstrip .tab.on{
  z-index:3;
  background:var(--win);color:var(--t1);font-weight:500;
  box-shadow:var(--tab-shadow);
}
#tabstrip .tab .fav{
  width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--t3);
}
#tabstrip .tab.on .fav{color:var(--t2)}
#tabstrip .tab .fav svg{width:13px;height:13px}
#tabstrip .tab .fav,#tabstrip .tab .tt,#tabstrip .tab .ddot{position:relative;z-index:1}
#tabstrip .tab .tx{
  width:19px;height:19px;position:absolute;right:5px;top:50%;margin-top:-9.5px;z-index:2;
  display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--t3);
}
#tabstrip .tab .tx svg{width:11px;height:11px}
#tabstrip .tab .tx:hover{background:var(--hover);color:var(--t1)}
#tabstrip .tab.on .tx:hover{background:var(--canvas)}
#tabstrip .tabmore{
  height:28px;align-self:center;margin:0 2px;z-index:4;
  -webkit-app-region:no-drag;
}
#tabplus{
  width:28px;height:28px;border-radius:8px;flex:none;align-self:center;
  margin:0;color:var(--t2);position:relative;z-index:5;
  display:flex;align-items:center;justify-content:center;
  -webkit-app-region:no-drag;
}
#tabplus:hover{background:var(--hover);color:var(--t1)}
#tabplus svg{width:15px;height:15px;stroke-width:1.6}
#tabflex{
  flex:1 1 auto;min-width:8px;align-self:stretch;
  -webkit-app-region:drag;
}
#appmark{
  width:30px;height:30px;border-radius:9px;flex:none;
  align-self:center;margin:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:6;
  -webkit-app-region:no-drag;
  transition:background-color .15s ease,transform .15s ease;
}
#appmark img{
  width:22px;height:22px;border-radius:6px;display:block;
  box-shadow:0 1px 2px rgba(58,48,80,.14);
  -webkit-user-drag:none;pointer-events:none;
}
#appmark:hover{background:var(--hover)}
#appmark:hover img{transform:scale(1.06)}
#appmark:active{transform:scale(.96)}
#tabstrip .tab,
#tabstrip .tabmore,
#appmark{-webkit-app-region:no-drag}

/* 导航钮：‹ › ⌂ 三颗，5.4 起搬进标签条左端（壳里贴红绿灯右缘，浏览器里贴左缘）。 */
.navgrp{
  display:flex;align-items:center;gap:2px;flex:none;margin-right:10px;
  -webkit-app-region:no-drag;
}
.navb{
  width:28px;height:28px;border-radius:7px;color:var(--t3);flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  -webkit-app-region:no-drag;
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,
             transform var(--d-fast) var(--ease-out);
}
.navb:active:not([disabled]){transform:scale(.96)}
.navb:hover:not([disabled]){background:var(--hover);color:var(--t1)}
.navb[disabled]{opacity:.28;pointer-events:none}
.navb.on{background:var(--hover);color:var(--t1)}
.navb svg{width:16px;height:16px;stroke-width:1.6}

/* 标签条右端：搜索胶囊（⌘K 的唯一入口）＋ ⚙ ＋ 品牌标。 */
.rightgrp{
  display:flex;align-items:center;gap:6px;flex:none;
  -webkit-app-region:no-drag;
}
/* 搜索胶囊：不描边（无线条规则），--field 底靠色差立住，hover 抬 1px 加 --el-1。 */
.topsearch{
  display:flex;align-items:center;gap:8px;flex:none;
  width:150px;height:28px;padding:0 11px;border-radius:999px;
  background:var(--field);border:0;color:var(--t3);font-size:11px;
  -webkit-app-region:no-drag;
  transition:background-color var(--d-base) ease,box-shadow var(--d-base) var(--ease-out),
             transform var(--d-base) var(--ease-out);
}
.topsearch svg{width:13px;height:13px;flex:none;stroke-width:1.6}
.topsearch .lbl{flex:1;text-align:left;white-space:nowrap}
.topsearch kbd{font:10px/1.6 var(--ui);font-weight:500;white-space:nowrap;
  color:var(--t4);background:none;border:0;padding:0}
.topsearch:hover{background:var(--win);box-shadow:var(--el-1);transform:translateY(-1px)}
.topsearch:active{transform:translateY(0);box-shadow:none}
/* 窗口窄了收成一枚 28px 圆钮，只留放大镜——标签永远优先。 */
@media(max-width:1000px){
  .topsearch{width:28px;padding:0;gap:0;justify-content:center}
  .topsearch .lbl,.topsearch kbd{display:none}
}
/* 载入细条：地址栏没了，改贴标签条上缘。 */
.loadbar{position:absolute;left:0;right:0;top:0;height:2px;z-index:8;
  overflow:hidden;pointer-events:none}
.loadbar.on::after{
  content:"";display:block;height:100%;width:38%;background:var(--accent);
  animation:loadbar .55s ease-out;
}
@keyframes loadbar{from{transform:translateX(-120%)}to{transform:translateX(280%)}}

.htmlframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--win);display:none}
.pagebox{position:absolute;inset:0;overflow:auto;display:none;background:var(--win)}
.pane.html,.pane.pg{padding:0!important;overflow:hidden}
.pane.html .htmlframe{display:block}
.pane.html .md,.pane.html .ed,.pane.html .pagebox{display:none!important}
.pane.html .doc-layout{display:none}
.pane.html .htmlframe{top:48px;height:auto;bottom:0}
.pane.pg .pagebox{display:block}
.pane.pg .md,.pane.pg .ed,.pane.pg .htmlframe{display:none!important}
.pane:not(.html) .htmlframe{display:none}
.pane:not(.pg) .pagebox{display:none}

/* ═══ 搜索结果页 ═══════════════════════════
   一行一条：图标 ｜ 标题 ｜「文件夹 · 命中片段」。命中的词照旧高亮。 */
.serp{max-width:720px;margin:0 auto;padding:32px 24px 80px}
.serp-q{font-size:10px;color:var(--t3);margin:0 0 4px;padding:0 12px 6px}
.search-row{
  width:100%;padding:12px;border-radius:10px;text-align:left;
  display:flex;gap:12px;align-items:center;
}
.search-row:hover{background:var(--hover)}
/* 键盘选中的那一条：按设计稿落在画布灰上，跟鼠标划过区分得开。 */
.search-row.on{background:var(--canvas)}
.search-row>.ico{color:var(--t3);flex:none;display:flex;align-items:center}
.search-row>.ico svg{width:17px;height:17px}
.search-row .search-info{flex:1;min-width:0}
.search-row strong{
  display:block;font-size:12px;font-weight:530;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.search-row small{
  display:block;color:var(--t3);margin-top:3px;font-size:10px;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.search-row .kind{
  font-size:9px;font-weight:600;letter-spacing:.04em;color:var(--t3);
  padding:2px 5px;border-radius:5px;background:var(--field);flex:none;
}
.search-row .enter{color:var(--t3);font-size:12px;flex:none}
.vacant{padding:80px 28px;text-align:center;color:var(--t3)}
.vacant h2{margin:0 0 8px;font-size:18px;font-weight:600;color:var(--t2)}
.vacant p{margin:0;font-size:13px;line-height:1.6}
/* 键帽：描边不填色。填色的那版在深色下会烧出一块亮斑。 */
kbd{
  font:10px/1.6 var(--ui);font-weight:500;white-space:nowrap;
  color:var(--t3);background:none;
  border:1px solid var(--rule-row);border-radius:5px;padding:0 5px;
}
/* ═══ 开始页 / 文件夹页 / 已收藏页 ═══════════
   三种页面共用同一套骨架：问候 → 文件夹芯片 → 大卡 → 分区标题 → 卡片网格。
   5.4 起底色是纯白 --win，卡片靠 --el-* 三层阴影浮起来，一条描边都不画；
   --canvas 只留给引用块、代码块和内凹控件。 */
.home{max-width:1050px;margin:0 auto;padding:32px 38px 40px}
.home-greeting{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.eyebrow{color:var(--t2);font-size:11px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.eyebrow svg{width:13px;height:13px}
/* 眉行右边这枚点＋一句话，就是原来底部状态栏那一格：绿＝就绪，琥珀＝扫描中，灰＝服务没起 */
.ey-sep{width:1px;height:9px;background:var(--rule-head);flex:none;margin:0 2px}
.scan{display:inline-flex;align-items:center;gap:6px;color:var(--t3)}
.scan i{width:5px;height:5px;border-radius:50%;background:var(--dot);flex:none;display:block;
  transition:background-color var(--d-base) ease}
.scan.scan-busy i{background:var(--folder)}
.scan.scan-off i{background:var(--t4)}
.home h1{font-weight:570;font-size:29px;letter-spacing:.02em;line-height:1.45;margin:0}
.home-sub{color:var(--t3);margin:7px 0 0;font-size:12px}
/* 次级按钮：白底一层极淡的渐变 ＋ 顶部高光，不描边（§5 悬浮质感） */
.hbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;
  height:30px;border-radius:9px;padding:0 13px;font-size:13px;font-weight:500;white-space:nowrap;
  background:linear-gradient(#fff,#fafbfc);color:var(--t1);border:0;
  box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out);
}
.hbtn svg{width:15px;height:15px;color:var(--t2)}
.hbtn:hover{transform:translateY(-1px);box-shadow:var(--el-2),var(--hi)}
.hbtn:active:not([disabled]){transform:translateY(0);box-shadow:var(--el-1)}
:root[data-theme="dark"] .hbtn{background:linear-gradient(#323843,#2c313a)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hbtn{
  background:linear-gradient(#323843,#2c313a)}}
/* 首屏那颗是全页第一动作，紧挨 29px 标题，比通用次级按钮再大一档 */
.hbtn.hero-new{height:34px;padding:0 16px;border-radius:10px;font-size:14px}
.hbtn.hero-new svg{width:16px;height:16px}
/* 主按钮：淡紫底板 ＋ 强调色字，同样不描边 */
.hbtn.key{background:var(--accent-soft);color:var(--accent)}
.hbtn.key svg{color:var(--accent)}

/* ── 继续阅读大卡 ───────────────────────── */
.resume{
  width:100%;text-align:left;padding:22px 26px;min-height:150px;
  border:1px solid transparent;border-radius:var(--r-lg);background:var(--card-face);
  box-shadow:var(--el-1);position:relative;overflow:hidden;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  transition:transform var(--d-base) var(--ease-out),box-shadow var(--d-base) var(--ease-out);
}
/* 左上→右下一层极淡的强调色，让大卡在纯白页面上成为视觉中心 */
.resume::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(132deg,var(--accent-soft) 0%,transparent 62%);opacity:.85}
.resume > *{position:relative;z-index:1}
.resume:hover{transform:translateY(-2px);box-shadow:var(--el-3);
  transition:transform var(--d-slow) var(--ease-out),box-shadow var(--d-slow) var(--ease-out)}
.resume:active:not([disabled]){transform:translateY(0) scale(.995);transition-duration:80ms}
.resume .rs-text{min-width:0;flex:1}
.resume .overline{font-size:10px;color:var(--ok);display:flex;align-items:center;gap:6px;
  margin-bottom:9px;letter-spacing:.03em}
.resume .overline svg{width:12px;height:12px}
.resume h2{font-size:20px;font-weight:570;margin:0 0 7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .excerpt{font-size:12px;color:var(--t2);max-width:550px;margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-bottom{display:flex;align-items:center;gap:15px;color:var(--t3);font-size:10px;margin-top:15px}
.resume .continue{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:11px;flex:none}
.resume .continue svg{width:13px;height:13px;transition:transform var(--d-base) var(--ease-out)}
.resume:hover .continue svg{transform:translateX(3px)}

/* 右边那三张叠着的纸，纯 CSS 画的，没有图片。深色下换成一套暗纸。 */
.paper-art{width:137px;height:108px;position:relative;margin-right:21px;flex:none;transform:rotate(-7deg)}
.paper-art::before,.paper-art::after,.paper-front{
  content:'';position:absolute;width:83px;height:106px;top:1px;left:31px;
  border:1px solid var(--paper-edge);border-radius:7px;background:var(--paper1);
  box-shadow:0 10px 23px var(--paper-shadow);
}
.paper-art::before{transform:rotate(15deg);background:var(--paper2);left:42px}
.paper-art::after{transform:rotate(6deg);background:var(--paper3);left:35px}
.paper-front{z-index:1;padding:18px 13px}
.paper-front b{display:block;width:24px;height:4px;background:var(--paper-b);margin-bottom:12px;border-radius:4px}
.paper-front i{display:block;height:2px;background:var(--paper-line);margin:7px 0;border-radius:2px}
.paper-front i:last-child{width:65%}
.paper-dot{
  position:absolute;width:27px;height:27px;background:var(--paper-dot);
  border:4px solid var(--card-face);border-radius:50%;bottom:-6px;right:10px;z-index:2;
  display:flex;align-items:center;justify-content:center;
  color:var(--paper-dot-ico);transform:rotate(7deg);
}
.paper-dot svg{width:12px;height:12px}

/* ── 文件夹芯片行 ───────────────────────
   开始页拿它替掉了书签栏（顶层文件夹 ＋ 已收藏），文件夹页拿它列子文件夹。
   不描边：静态是 --field 的浅底块，鼠标进来才浮起来变成一枚白片。 */
.dirchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 1px 20px}
.dirchip{
  display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 13px;
  border-radius:999px;background:var(--field);border:1px solid transparent;
  color:var(--t2);font-size:11.5px;
  transition:background-color var(--d-base) ease,color var(--d-base) ease,
             box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out);
}
.dirchip:hover{background:var(--card-face);color:var(--t1);
  box-shadow:var(--el-1);transform:translateY(-1px)}
.dirchip:active:not([disabled]){transform:translateY(0);box-shadow:none}
.dirchip svg{width:13px;height:13px;color:var(--bm-ico);flex:none}
.dirchip.fav svg{color:var(--pin)}
.dirchip .n{color:var(--t3);font-size:10px}
/* 行尾那枚「收起」／收起后那枚「N 个文件夹 ›」：安静的文字按钮，
   不占底色也不描边，跟芯片同高所以两者天然对齐。 */
.chipfold{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px;
  color:var(--t4);font-size:11.5px;transition:color var(--d-base) ease}
.chipfold:hover{color:var(--t3)}
.chipfold svg{flex:none;color:currentColor}
.chipfold .ar{font-size:12.5px;line-height:1;margin-left:-1px}

/* ── 分区标题：计数 + 类型筛选 + 网格/列表 ── */
.section-head{display:flex;align-items:center;gap:15px;margin:28px 1px 14px}
.section-head h2{font-size:13px;font-weight:570;margin:0}
.section-head .section-meta{font-size:10px;color:var(--t3)}
.section-head .fill{flex:1}
.filters{display:flex;gap:3px;background:var(--seg-track);padding:3px;border-radius:var(--r-sm);flex:none}
.filters button{font-size:10px;border-radius:var(--r-xs);color:var(--t2);padding:4px 9px;
  transition:background-color var(--d-base) var(--ease-out),color var(--d-base) ease,
             box-shadow var(--d-base) var(--ease-out)}
.filters button:hover{color:var(--t1)}
.filters button.on{background:var(--segon);color:var(--t1);box-shadow:var(--segshadow)}
.view-toggle{width:28px;height:28px;border-radius:7px;flex:none;color:var(--t2);
  display:flex;align-items:center;justify-content:center}
.view-toggle:hover{background:var(--hover);color:var(--t1)}
.view-toggle:active:not([disabled]){transform:scale(.96)}
.view-toggle svg{width:14px;height:14px}

/* ── 卡片网格 ───────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note-card{
  position:relative;min-width:0;border:1px solid transparent;border-radius:13px;
  background:var(--card-face);box-shadow:var(--el-1);
  transition:transform var(--d-base) var(--ease-out),box-shadow var(--d-base) var(--ease-out);
}
/* 进来慢一点（--d-slow）、出去快一点（--d-base）：抬起有分量，放下利索 */
.note-card:hover{transform:translateY(-2px);box-shadow:var(--el-3);
  transition:transform var(--d-slow) var(--ease-out),box-shadow var(--d-slow) var(--ease-out)}
.note-card:active{transform:translateY(0) scale(.99);transition-duration:80ms}
/* 卡片自己在动，里面那颗全尺寸按钮就别跟着 scale(.98) 了 */
.note-card .card-open:active:not([disabled]){transform:none}
.card-open{padding:19px 20px 17px;text-align:left;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:flex-start}
.card-open>*{max-width:100%}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.file-icon{width:28px;height:30px;border-radius:7px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--ico-md-bg);color:var(--ico-md);
  transition:background-color var(--d-base) ease,color var(--d-base) ease}
.file-icon svg{width:15px;height:15px}
.file-icon.html{background:var(--ico-html-bg);color:var(--ico-html)}
.note-card:hover .file-icon{background:var(--accent-soft);color:var(--accent)}
.kind-label{font-size:9px;color:var(--t3);letter-spacing:.04em}
.note-card h3{font-size:14px;font-weight:550;line-height:1.65;margin:0;min-height:23px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card-excerpt{font-size:11px;color:var(--t2);line-height:1.75;margin:5px 0 0;min-height:38px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card-footer{margin-top:17px;display:flex;align-items:center;gap:5px;width:100%;
  color:var(--t3);font-size:9px}
.card-footer svg{width:11px;height:11px;flex:none}
.card-footer .fdr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-footer .when{margin-left:auto;flex:none;padding-left:8px}
.card-pin{
  position:absolute;right:10px;top:12px;width:25px;height:25px;border-radius:var(--r-xs);
  color:var(--t3);opacity:0;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s ease,background-color .16s ease,color .16s ease;
}
.card-pin:hover{background:var(--hover);color:var(--t1)}
.card-pin.pinned,.note-card:hover .card-pin{opacity:1}
/* :focus-visible 单开一条：Safari 15.0 不认它，写进逗号组会把整条规则一起丢掉 */
.card-pin:focus-visible{opacity:1}
.card-pin.pinned{color:var(--pin)}
.card-pin svg{width:13px;height:13px}

/* 列表模式：单列，图标 ｜ 标题＋一行摘录 ｜ 文件夹＋时间 */
.cards.list{grid-template-columns:minmax(0,1fr);gap:7px}
.cards.list .card-open{display:grid;grid-template-columns:40px minmax(0,1fr) 180px;
  gap:0 10px;align-items:center;padding:13px 20px}
.cards.list .card-top{margin:0;grid-row:span 2}
.cards.list .kind-label{display:none}
.cards.list h3{min-height:0;-webkit-line-clamp:1}
.cards.list .card-excerpt{min-height:0;-webkit-line-clamp:1;margin:0;grid-column:2}
.cards.list .card-footer{grid-column:3;grid-row:1 / 3;margin:0;padding-right:15px}
.cards.list .card-pin{top:19px;right:6px}
.cards.list .note-card:hover{transform:translateY(-1px)}
.cards.list .note-card:active{transform:translateY(0) scale(.997)}

/* ── 首次提示卡（只在全新的档案第一次进来时出一次）────── */
.tipcard{margin:0 0 20px;padding:15px 20px 16px;border:0;
  border-radius:var(--r-lg);background:var(--accent-soft)}
.tc-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.tc-head h3{font-size:12.5px;font-weight:600;color:var(--accent);margin:0;flex:1}
.tc-x{font-size:11px;color:var(--accent);opacity:.8;padding:4px 8px;border-radius:var(--r-xs);
  transition:background-color var(--d-fast) ease,opacity var(--d-fast) ease}
.tc-x:hover{opacity:1;background:var(--hl)}
.tc-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tc-col{display:flex;align-items:center;gap:10px;min-width:0}
.tc-ico{width:26px;height:26px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--card-face);color:var(--accent);box-shadow:var(--el-1)}
.tc-ico svg{width:14px;height:14px}
.tc-col p{margin:0;font-size:11.5px;color:var(--t2);line-height:1.5}
.tc-col kbd{color:var(--t2);border-color:var(--hl);margin-right:2px}

/* ── 空态 / 底部提示 ────────────────────── */
.empty{padding:60px 20px;text-align:center;color:var(--t2)}
/* 空库那一版占满问候区以下的整片空白并居中，别缩在上半页留一大块无主的白 */
.empty.big{min-height:56vh;padding:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.empty-mark{width:76px;height:76px;border-radius:50%;background:var(--canvas);
  color:var(--t3);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.empty-mark svg{width:30px;height:30px}
.empty h2{font-size:17px;font-weight:550;color:var(--t1);margin:0 0 8px}
.empty p{font-size:12px;margin:0 0 22px;line-height:1.8;color:var(--t3)}
.empty-btns{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.home-tip{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:10px;color:var(--t4);margin:22px 0 0}
.home-tip svg{width:13px;height:13px}
.home-tip kbd{color:var(--t4)}
/* 「最近打开」最多画 12 张，剩下的从这条进库根接着翻 */
.see-all{display:flex;align-items:center;gap:7px;margin:14px 0 0;padding:9px 14px;
  border-radius:9px;background:var(--field);color:var(--t2);font-size:11px;
  transition:background-color var(--d-base) ease,color var(--d-base) ease}
.see-all:hover{background:var(--hover);color:var(--t1)}
.see-all svg{width:14px;height:14px}

@media (max-width:900px){
  .home{padding:30px 26px 40px}
  .home h1{font-size:25px}
  .home-greeting{margin-bottom:21px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .card-open{padding:16px}
  .paper-art{margin-right:0;width:110px}
  .resume .excerpt{max-width:390px}
}
@media (max-width:700px){
  .home{padding:24px 18px 40px}
  .home h1{font-size:23px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .paper-art{display:none}
  .card-pin{opacity:1}
  .home-greeting .hbtn .lbl{display:none}
  .tc-cols{grid-template-columns:minmax(0,1fr);gap:10px}
  .cards.list .card-open{grid-template-columns:40px minmax(0,1fr)}
  .cards.list .card-footer{grid-column:2;grid-row:auto;margin-top:6px;padding-right:0}
}

/* 分隔条：不画线，只留一条看不见的拖动区 */
.split{position:relative;z-index:5;width:0;cursor:col-resize}
.split::after{content:"";position:absolute;inset:0 -3px}

/* 搜索结果 */
.res{padding:10px 12px;margin:0 -12px;border-radius:10px;cursor:default;
  transition:background-color .15s ease}
.res:hover{background:var(--hover)}
.res.sel{background:var(--sel);box-shadow:var(--selshadow)}
.res .rt{display:flex;align-items:center;gap:8px;min-width:0}
.res .rt .t{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.res .rp{font-size:11px;color:var(--t4);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rx{font-size:12px;color:var(--t3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 命中词：加粗 ＋ 强调色下划线，不铺底色 */
.hit{
  font-weight:600;font-style:normal;
  text-decoration:underline;
  text-decoration-color:var(--accent);
  text-decoration-thickness:2px;
  text-underline-offset:3px;
}

/* 行上的次要动作：hover 才出，其余进右键 */
.racts{display:flex;gap:2px;align-items:center;flex-shrink:0;opacity:0;
  transition:opacity .15s ease}
.lrow:hover .racts,.res:hover .racts,.racts:focus-within{opacity:1}
.iba{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:7px;color:var(--t3);
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,
             transform var(--d-fast) var(--ease-out)}
.iba:hover{background:var(--hover);color:var(--t1)}
.iba:active:not([disabled]){transform:scale(.96)}
.iba svg{width:15px;height:15px;stroke-width:1.5}

/* ═══ 边栏 ═══════════════════════════════
   只在列表栏那一态里露过面，5.4.1 起不再上屏（buildNav 还在往里写，
   底下那些 .nav / .livedot 的样式跟着留下）。 */
#side,.split{display:none}
#side{grid-area:side;background:var(--side);padding:18px 10px 14px;
  flex-direction:column;overflow:hidden auto;min-width:0}
.nav{
  height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:10px;
  width:100%;text-align:left;font-size:12px;color:var(--t2);
  transition:background-color .15s ease;
}
.nav svg{width:16px;height:16px;flex:none;color:var(--t2);stroke-width:1.5}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);box-shadow:var(--selshadow);color:var(--t1)}
.nav.sub{color:var(--t2)}
.nav .n{font-size:11px;color:var(--t4);flex:none;font-variant-numeric:tabular-nums}
.nav.deep{padding-left:34px}
.grouplab{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;padding:0 10px;margin:22px 0 9px}
.spacer{flex:1;min-height:12px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--dot);margin-left:auto;flex:none;
  transition:transform .25s ease,background-color .15s ease}
.livedot.off{background:var(--t3)}
.livedot.hit{transform:scale(1.7)}
#stat.hide{display:none}

/* ═══ 条目行 ═══════════════════════════════
   列表栏下线之后这些只画在离屏的 #out 里：选中、快看、搜索回车
   都还认这批 [data-seq] 节点，样式跟着留下。 */
.kindtag{font-size:10px;font-weight:500;letter-spacing:.02em;color:var(--t4);flex:none}
.kindempty{padding:28px 16px;text-align:center;font-size:12px;color:var(--t4)}
.lgroup{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;padding:0 20px;margin:18px 0 8px}
.lrow{
  min-height:43px;margin:0 8px;padding:10px 12px;border-radius:10px;cursor:default;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  transition:background-color .15s ease;
}
.lrow .top{display:flex;align-items:center;gap:12px;width:100%;min-width:0}
.lrow .t{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{font-size:11px;color:var(--t4);flex:none}
.lrow .ex{font-size:12px;color:var(--t3);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--sel);box-shadow:var(--selshadow)}

/* ═══ 正文栏 ═══════════════════════════════ */
#docpane{grid-area:doc;position:relative;background:var(--win);overflow:hidden;min-width:0}

/* 老的编辑状态字。保存状态挪到笔记页顶栏的 pill 上，这一格留着不显示，
   syncStatusLine 仍往里写，别的地方还有引用。 */
.editstatus{display:none}

/* 标签栏底料：撞车标题保住尾巴；装不下的进 ▾，不横滑。闲置的 × 只在悬停时露。
   外形（凹角、竖线）由 #tabstrip .tab 覆盖。 */
.tabbar{position:absolute;top:0;left:0;right:0;z-index:5;
  display:none;align-items:center;gap:4px;padding:44px 16px 6px;overflow:hidden;
  background:var(--win)}
.tabbar.on{display:flex}
.tab{position:relative;display:flex;align-items:center;gap:6px;height:26px;
  padding:0 8px 0 10px;border-radius:7px;font-size:12px;color:var(--t2);cursor:default;
  white-space:nowrap;overflow:hidden;min-width:72px;max-width:220px;
  flex:1 1 108px;transition:background-color .15s ease}
.tabbar .tab[hidden]{display:none!important}
.tab:hover{background:var(--hover)}
.tab.on{flex:2.1 1 240px;min-width:120px;max-width:380px;padding-right:6px;
  background:var(--sel);box-shadow:var(--selshadow);color:var(--t1);font-weight:500}
.tab .tt{display:flex;min-width:0;overflow:hidden;flex:1}
.tab .tt.plain{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tt .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.tab .tt .e{flex:none;white-space:nowrap}
.tab .tx{width:16px;height:16px;border-radius:8px;flex:none;color:var(--t3);
  display:none;align-items:center;justify-content:center}
.tab.on .tx{display:flex}
.tab:hover:not(.on) .tx{display:flex;position:absolute;right:4px;top:5px;
  background:var(--hover);color:var(--t2)}
.tab .tx:hover{background:var(--hover);color:var(--t1)}
.tab.on .tx:hover{background:var(--hover)}
.tab .tx svg{width:11px;height:11px;stroke-width:1.6}
.tab .ddot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--t4);display:none}
.tab.dirty:not(.on):not(:hover) .ddot{display:block}
.tabmore{flex:none;height:26px;min-width:34px;padding:0 8px;border-radius:7px;
  display:none;align-items:center;justify-content:center;gap:3px;
  color:var(--t2);font-size:11px;font-weight:560}
.tabbar.has-more .tabmore{display:flex}
.tabmore:hover,.tabmore.open{background:var(--hover);color:var(--t1)}
.tabmore svg{flex:none}
#tabpick{position:fixed;z-index:90;display:none;min-width:240px;max-width:360px;
  max-height:min(52vh,420px);overflow-y:auto;padding:6px;
  background:var(--card-face);border:0;border-radius:12px;
  box-shadow:var(--el-3);animation:arrive .16s ease-out}
#tabpick.on{display:block}
#tabpick .tprow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px}
#tabpick .tprow:hover{background:var(--hover)}
#tabpick .nm{flex:1;min-width:0}
#tabpick .a{display:block;font-size:13px;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabpick .b{display:block;font-size:11px;color:var(--t4);margin-top:1px}
#tabpick .x{width:18px;height:18px;border-radius:9px;flex:none;color:var(--t4);
  display:flex;align-items:center;justify-content:center}
#tabpick .x:hover{background:var(--hover);color:var(--t1)}

#panes{position:absolute;inset:0}
.pane{position:absolute;inset:0;overflow-y:auto;padding:0;display:none}
.pane.on{display:block}
.pane .ed{display:none}
.pane.edit .md{outline:none}

/* ═══ 笔记页：顶栏 ＋ 版心 ═══════════════
   顶栏贴在正文栏顶上（sticky），左边面包屑，右边按钮组。阅读态是「专注 / 更多 /
   编辑」，编辑态换成「保存状态 / 源码 / 完成」。毛玻璃底色让正文从下面透一点过去。 */
.doc-toolbar{
  position:sticky;top:0;z-index:8;
  height:48px;flex:none;padding:0 22px;
  display:flex;align-items:center;gap:6px;
  border-bottom:0;
  background:var(--win-blur);
  box-shadow:0 4px 12px rgba(58,48,80,.04);
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
  transition:transform var(--d-slow) var(--ease-out),opacity var(--d-slow) var(--ease-out),
             box-shadow var(--d-base) ease;
}
.pane.pg .doc-toolbar,.pane.pg .doc-layout{display:none!important}
/* solo 窗只有一份正文，本来就没有标签条和工具条，阅读时顶栏也不出现。
   但编辑时得留一条——没有它就既看不到存没存上，也没地方点「完成」。
   面包屑、专注、更多在这种窗里没用，收起来，只剩保存状态和收工那两颗。 */
body.solo .doc-toolbar{display:none}
body.solo .pane.edit .doc-toolbar{display:flex;justify-content:flex-end}
body.solo .pane.edit .doc-toolbar .pathchip,
body.solo .pane.edit .doc-toolbar .dt-actions,
body.solo .pane.edit .doc-toolbar .dt-div,
body.solo .pane.edit .doc-toolbar [data-dt="focus"],
body.solo .pane.edit .doc-toolbar [data-dt="more"]{display:none}
body.solo .pane.html .htmlframe{top:0}
/* ═══ 路径芯片 ═══════════════════════════
   「一件信息只出现一次」：路径只在这里。文件夹图标 ＋ › 分段 ＋ 尾部拷贝图标。
   放不下就从最左边起收成一枚 …，最后一段再交给 text-overflow。
   整枚芯片单击＝拷贝路径；⌘ 单击某个文件夹段仍是「在新标签打开那个文件夹」。 */
.pathchip{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  flex:0 1 auto;min-width:0;max-width:520px;
  height:30px;padding:0 9px;margin-left:2px;
  border-radius:var(--r-sm);background:transparent;color:var(--t2);font-size:12px;
  transition:background-color var(--d-base) ease;
}
.pathchip .fi{width:14px;height:14px;flex:none;color:var(--bm-ico);display:flex}
.pathchip .fi svg{width:14px;height:14px}
.pc-body{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden}
/* 段一律不缩——缩了的话 scrollWidth 恒等于 clientWidth，fitPathChip 量不出溢出，
   「从左边起收成 …」那一步就永远不会发生。收到只剩最后一段还嫌长时才加 .tight，
   放开最后那一段自己打省略号。 */
.pc-seg{flex:none;white-space:nowrap}
.pc-body.tight .pc-seg.now{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pc-seg.now{color:var(--t1)}
.pc-sep{flex:none;color:var(--t4)}
.pathchip .cp{position:relative;width:13px;height:13px;flex:none;color:var(--t4);
  margin-left:1px;transition:color var(--d-base) ease}
.pathchip:hover{background:var(--hover)}
.pathchip:hover .cp{color:var(--t2)}
/* 拷贝成功：芯片原地不动——宽度和那条路径全留着，只把尾部那枚拷贝图标换成
   --ok 色的对勾（160ms 缩放浮现），底色临时染 --accent-soft，1.2s 后还原。
   收成一句「✓ 已拷贝」的话宽度要跳一下，刚拷完的那条路径也跟着消失了。 */
.pathchip .cp > span{position:absolute;top:0;left:0;display:block;width:13px;height:13px}
.pathchip .cp .ic-copy{transition:opacity 90ms var(--ease-out)}
.pathchip .cp .ic-done{color:var(--ok);opacity:0;transform:scale(.6);
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
.pathchip.is-copied{background:var(--accent-soft)}
.pathchip.is-copied .cp .ic-copy{opacity:0}
.pathchip.is-copied .cp .ic-done{opacity:1;transform:scale(1)}

/* 自绘提示气泡：深底白字，正下方 6px，真鼠标停 500ms 才出（路径芯片快一点）。
   不用 title——原生气泡样子不受控，还会跟这一枚打架。 */
.has-tip{position:relative}
.tip{position:absolute;top:calc(100% + 6px);left:50%;transform:translate(-50%,-4px);
  background:var(--tip-bg);color:var(--tip-fg);
  font-size:11px;line-height:1.5;font-weight:400;text-align:center;
  padding:5px 9px;border-radius:var(--r-xs);white-space:nowrap;pointer-events:none;
  opacity:0;z-index:40;box-shadow:var(--el-2);
  transition:opacity var(--d-fast) var(--ease-out),transform var(--d-fast) var(--ease-out)}
.tip b{display:block;font-weight:400;font-size:10.5px;opacity:.7;
  max-width:340px;overflow:hidden;text-overflow:ellipsis}
.has-tip:hover > .tip{opacity:1;transform:translate(-50%,0);transition-delay:.5s}
.pathchip:hover > .tip{transition-delay:.18s}
/* 拷完那一下气泡先收掉——底下已经有 toast 了，两句话叠着看不清。
   排在 :hover 那条后面才压得住（同权重，后来居上）。 */
.pathchip.is-copied > .tip{opacity:0;transform:translate(-50%,-4px);transition-delay:0s}

.dt-fill{flex:1 1 auto;min-width:8px}
.dt-actions{display:flex;align-items:center;gap:2px;flex:none}
/* 唯一保留的短竖线：分组用，不是描边 */
.dt-div{width:1px;height:16px;background:var(--rule-row);flex:none;margin:0 7px}
.dt-tag{flex:none;font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--t2);
  background:var(--field);border-radius:5px;padding:4px 7px;white-space:nowrap}
.dt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;
  height:30px;padding:0 13px;border-radius:9px;font-size:12px;font-weight:500;color:var(--t1);
  background:linear-gradient(#fff,#fafbfc);border:0;box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
:root[data-theme="dark"] .dt-btn{background:linear-gradient(#323843,#2c313a)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dt-btn{
  background:linear-gradient(#323843,#2c313a)}}
.dt-btn:hover{transform:translateY(-1px);box-shadow:var(--el-2),var(--hi)}
.dt-btn:active:not([disabled]){transform:translateY(0);box-shadow:var(--el-1)}
.dt-btn.soft{background:var(--accent-soft);color:var(--accent)}
.dt-btn.soft:hover{background:var(--accent-soft)}
.dt-ico{display:inline-flex;align-items:center;justify-content:center;flex:none;
  position:relative;
  width:30px;height:30px;border-radius:7px;color:var(--t3);
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,
             transform var(--d-fast) var(--ease-out)}
.dt-ico:hover{background:var(--hover);color:var(--t1)}
.dt-ico:active:not([disabled]){transform:scale(.96)}
.dt-ico svg{width:16px;height:16px}
/* 收藏了：星星填实，用书签栏那一档金色 */
.dt-ico.pinned{color:var(--pin)}
.dt-ico.pinned svg{fill:currentColor}
.save-state{flex:none;font-size:10px;color:var(--ok);min-width:64px;text-align:right}
.save-state.pending{color:var(--t3)}
.save-state.act{color:var(--folder);cursor:pointer}

/* 版心：默认一栏，居中限宽。开了左侧大纲就不限宽了——版心撑满窗格，左右内边距
   各一份 --ol-inset，大纲于是贴着窗格左缘站定，窗口再宽也不往中间飘。
   栏还够宽的话再往右补一条等宽的空栏（ol-3）：左右两栏一样重，正文就落在正中，
   跟没大纲时是同一处；不够宽退回两栏，正文往右偏半个栏宽，先认了。
   够不够由 syncToc 里的 olWider() 算——看的是正文栏自己的宽，不是窗口宽，
   三栏模式下窗口没变、正文栏窄了一大截。 */
.doc-layout{display:grid;grid-template-columns:minmax(0,1fr);
  max-width:1020px;margin:0 auto;padding:38px 60px 120px}
.doc-layout.ol-on{grid-template-columns:var(--outline-w) minmax(0,1fr);
  max-width:none;padding-left:var(--ol-inset);padding-right:var(--ol-inset)}
.doc-layout.ol-on.ol-3{
  grid-template-columns:var(--outline-w) minmax(0,1fr) var(--outline-w)}
.pane.edit .doc-layout{padding-bottom:200px}
/* 不给 position：篇内目录、搜索命中定位都按 h.offsetTop 算，
   这一层一旦成了 offsetParent，那些偏移就全对不上了。 */
/* width:100% 一个字都不能少：.document 是 grid item，item 上的 auto 外边距
   会让它按 fit-content 定宽——正文于是塌成「最长的那一行」，
   阅读宽度那一栏调什么都不动。 */
.document{width:100%;max-width:var(--docw);margin:0 auto;min-width:0}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  font-size:10px;color:var(--t3);margin:0 0 16px;user-select:none;-webkit-user-select:none}
.doc-meta svg{width:12px;height:12px;flex:none}
.doc-meta:empty{display:none}
.doc-end{display:flex;align-items:center;gap:10px;margin-top:42px;
  color:var(--t3);font-size:10px;user-select:none;-webkit-user-select:none}
.doc-end:before,.doc-end:after{content:'';height:1px;background:var(--rule-row);flex:1}
.pane.edit .doc-end{display:none}
.editor-hint{display:none;font-size:10px;color:var(--t3);margin:22px 0 0}
.pane.edit .editor-hint{display:block}

/* 正文上方那条格式条：跟着正文滚，碰到顶栏就停住。 */
.formatbar{display:none;align-items:center;gap:3px;flex-wrap:wrap;
  position:sticky;top:58px;z-index:7;width:max-content;max-width:100%;
  margin:0 0 24px;padding:5px;border-radius:11px;
  background:var(--card-face);border:0;box-shadow:var(--el-2)}
.pane.edit:not(.src) .formatbar{display:flex}
.formatbar button{height:28px;min-width:30px;padding:0 8px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t2)}
.formatbar button:hover,.formatbar button.on{background:var(--accent-soft);color:var(--accent)}
.formatbar button svg{width:15px;height:15px}
.formatbar i{width:1px;height:15px;background:var(--rule-row);margin:0 3px;flex:none}

/* 整篇源码：一块等宽的框，不是整屏文本域。 */
.pane .ed{width:100%;margin:0;padding:15px;
  border:1px solid var(--rule-row);border-radius:10px;
  background:var(--win);color:var(--t1);resize:none;outline:none;
  font-family:var(--mono);font-size:13px;line-height:1.9;
  tab-size:2;min-height:350px;overflow:hidden}
.pane.edit.src .md{display:none}
.pane.edit.src .ed{display:block}

/* 篇内大纲：版心左边常驻一栏，跟着正文滚，读到哪一节亮哪一条，⌥⌘I 收放。
   栏窄了（三栏模式、小窗）左栏收起，改从顶栏那颗按钮弹 #outfloat 浮层，
   两处用的是同一套 .ol-* 类名和同一份 HTML。 */
.outline{display:none;flex-direction:column;min-width:0;
  padding-right:16px;align-self:start;             /* sticky 在 grid 里必须 start，不然占满整行没得贴 */
  position:sticky;top:62px;z-index:4;
  max-height:calc(100vh - var(--chrome-h) - var(--status-h) - var(--bnr-h, 0px) - 118px)}
.doc-layout.ol-on > .outline{display:flex}
.ol-head{display:flex;align-items:center;gap:6px;flex:none;padding:0 10px 6px}
.ol-t{font-size:12px;font-weight:550;color:var(--t3)}
.ol-n{font-size:11px;color:var(--t4)}
.ol-x{margin-left:auto;flex:none;width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--t3)}
.ol-x:hover{background:var(--hover);color:var(--t1)}
.ol-x svg{width:14px;height:14px}
/* 常驻栏那颗收起箭头平时不露，鼠标进栏或键盘聚焦才浮出来；浮层那颗 × 一直在。 */
.outline .ol-x{opacity:0;transition:opacity .14s ease}
.outline:hover .ol-x{opacity:1}
.outline .ol-x:focus-visible{opacity:1}   /* 单开一条，理由同 .card-pin */
/* 条目自己滚。滚动条平时不露，鼠标进来才浮出一条细的。 */
.ol-list{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:transparent transparent}
.ol-list::-webkit-scrollbar{width:7px}
.ol-list::-webkit-scrollbar-track{background:transparent}
.ol-list::-webkit-scrollbar-thumb{background:transparent;border-radius:4px;
  border:2px solid transparent;background-clip:padding-box}
.outline:hover .ol-list,#outfloat:hover .ol-list{scrollbar-color:var(--rule-head) transparent}
.outline:hover .ol-list::-webkit-scrollbar-thumb,
#outfloat:hover .ol-list::-webkit-scrollbar-thumb{background:var(--rule-head);background-clip:padding-box}
.ol-i{display:block;position:relative;width:100%;text-align:left;
  font-size:13px;line-height:1.4;color:var(--t2);
  padding:4px 8px 4px 10px;border-radius:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background-color .14s ease,color .14s ease}
.ol-i.l1{font-weight:550;color:var(--t1)}
.ol-i.l2{padding-left:20px}
.ol-i.l3{padding-left:30px}
.ol-i.l4{padding-left:40px;color:var(--t3)}
.ol-i.l5{padding-left:50px;color:var(--t3)}
.ol-i.l6{padding-left:60px;color:var(--t3)}
.ol-i:hover{background:var(--hover);color:var(--t1)}
/* 当前节：不铺底色，左缘一道 2px 的强调色短杠 ＋ 强调色文字。杠永远贴条目左缘，
   不跟缩进走，读起来像一枚位置标记。 */
.ol-i.on{color:var(--accent)}
.ol-i.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;
  border-radius:1px;background:var(--accent)}
/* 顶栏那颗大纲按钮：栏宽够就是「收放左栏」，不够就是「弹浮层」。
   [hidden] 得自己写一条——UA 那条 display:none 压不过 .dt-ico 的 inline-flex。 */
.doc-toolbar .dt-ol[hidden]{display:none}
.doc-toolbar .dt-ol.on{background:var(--accent-soft);color:var(--accent)}
#outfloat{position:fixed;z-index:60;display:none;flex-direction:column;
  width:260px;max-height:60vh;padding:8px;
  background:var(--card-face);border:0;border-radius:var(--r-lg);
  box-shadow:var(--el-3);animation:arrive .16s ease-out}
#outfloat.on{display:flex}

/* ═══ Markdown 正文 ═══════════════════════
   默认 17 / 1.8 / 690。中文标题 letter-spacing 为 0，层级靠字重和留白。
   hanging-punctuation 让行首的引号书名号挂到版心外面，中文段落的左缘才是齐的；
   text-autospace 是渐进增强，不认的浏览器忽略。
   版式三项仍能在设置和排版浮层里调。 */
.md{color:var(--t1);margin:0 auto;max-width:var(--docw);
  hanging-punctuation:first allow-end;text-autospace:normal}
.md h1{font-size:1.6em;font-weight:600;letter-spacing:0;line-height:1.45;margin:1.5em 0 .6em}
.md > h1:first-child{font-size:31px;font-weight:600;letter-spacing:0;line-height:1.45;margin:0 0 18px}
.md h2{font-size:1.35em;font-weight:600;letter-spacing:0;margin:2.2em 0 .7em;line-height:1.55}
.md h3{font-size:1.12em;font-weight:600;line-height:1.6;margin:1.8em 0 .5em}
.md h4{font-size:1em;font-weight:500;margin:1.5em 0 .6em;color:var(--t2)}
/* h5/h6 接着 h4 往下退：h5 同字号同字重、再退一级色；h6 再缩一点字号、留白也收一点。 */
.md h5{font-size:1em;font-weight:500;margin:1.3em 0 .5em;color:var(--t3)}
.md h6{font-size:.94em;font-weight:500;margin:1.2em 0 .5em;color:var(--t3)}
.md>:first-child{margin-top:0}
.md p{margin:0 0 1em}
.md strong{font-weight:600}
.md em{font-style:italic;color:var(--t2)}
.md a{color:var(--accent);text-decoration:none}
.md a:hover{text-decoration:underline;text-underline-offset:3px}
.md ul,.md ol{margin:0 0 1em;padding-left:1.5em}
.md li{margin:3px 0;padding-left:3px}
.md li::marker{color:var(--t3)}
.md li ul,.md li ol{margin:.32em 0 0}
.md li.task{list-style:none;margin-left:-1.35em;display:flex;gap:.5em;align-items:flex-start}
.md li.task input{margin:.44em 0 0;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.md li.task input:checked+span{color:var(--t3);text-decoration:line-through}
.md del{color:var(--t3)}
.md hr{border:0;height:1px;background:var(--rule-row);margin:2.4em 0}
.md blockquote{margin:23px 0;padding:12px 20px;color:var(--t2);
  background:var(--canvas);border-radius:0 var(--r-sm) var(--r-sm) 0;border-left:2px solid var(--quote-b)}
.md blockquote p{margin:0 0 .5em}
.md blockquote p:last-child{margin:0}
.md code{background:var(--canvas);padding:2px 5px;border-radius:4px;
  font:.82em/1.6 var(--mono)}
.md pre{background:var(--canvas);border-radius:var(--r-md);padding:14px;overflow-x:auto;margin:0 0 1.15em}
.md pre code{background:none;padding:0;color:var(--t2);font-size:.84em;line-height:1.6}
/* 表格：表头 600 ＋ 表头下一道淡线 ＋ 每行一道更淡的行线，无竖线无斑马，
   宽表在自己容器里横滚。行线是全篇仅存的三种线之一（另两种：引用块左竖条、分段凹槽）。 */
.tw{overflow-x:auto;margin:0 0 1.5em;max-width:100%}
.md table{border-collapse:collapse;width:100%;font-size:.88em;font-variant-numeric:tabular-nums}
.md th{font-size:.92em;font-weight:600;color:var(--t2);text-align:left;
  padding:0 10px 9px;white-space:nowrap;border-bottom:1px solid var(--rule-head)}
.md td{padding:11px 10px;color:var(--t1);vertical-align:top;line-height:1.7;
  border-bottom:1px solid var(--rule-row)}
.md tbody tr:last-child td{border-bottom:0}
.md img{max-width:100%;height:auto;display:block;margin:16px auto;border-radius:6px}
.md img[src$=".svg"]{width:100%}
:root[data-theme="dark"] .md img{background:#f6f6f6;padding:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .md img{background:#f6f6f6;padding:6px}}
.md .imgbad{display:inline-block;padding:2px 8px;border-radius:4px;
  background:var(--field);color:var(--t2);font-size:12px}
/* 长字符串折行。库里正文常带超长飞书 URL、长行内 code、以及「图片没找到：<长地址>」
   这一条提示，不折行的话正文栏自己会横滚（0829 D 路实测最大 453px）。
   用 anywhere 不用 break-word：只有 anywhere 会把 min-content 宽度也算进去，
   inline-block 的 .imgbad 才收得住。
   表格单元格有意不加——宽表该整条横滚，不该把词拆断；pre 保持自身横滚不动。 */
.md p,.md li,.md blockquote,.md h1,.md h2,.md h3,.md h4,.md h5,.md h6,
.md code,.md .imgbad{overflow-wrap:anywhere}
.md pre,.md pre code,.md th,.md td{overflow-wrap:normal}
.md a.wl{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
.pane.edit .md p:empty,.pane.edit .md li:empty{min-height:1em}
.pane.edit .md h1:first-child{min-height:1.22em}
/* 空标题 / 空段的占位。绝对定位叠在块上，不占光标位，也不会进 innerText。 */
.pane.edit .md h1[data-ph],
.pane.edit .md p[data-ph]{position:relative}
.pane.edit .md h1[data-ph]::before,
.pane.edit .md p[data-ph]::before{
  position:absolute;left:0;top:0;right:0;
  color:var(--t4);letter-spacing:0;pointer-events:none;user-select:none}
.pane.edit .md h1[data-ph]::before{content:"无标题";font-weight:500}
.pane.edit .md p[data-ph]::before{content:"写点什么…";font-weight:400}
.f-sans{font-family:var(--ui)}
.f-serif{font-family:ui-serif,"New York",Georgia,"Songti SC","Noto Serif CJK SC",serif}
.f-mono{font-family:var(--mono)}
/* 搜索命中点开：跳到命中段并闪一下 */
@keyframes hitflash{0%,70%{background:var(--hl)}100%{background:transparent}}
.md .flash{animation:hitflash 1.4s ease-out 1;border-radius:6px}

/* 文档历史折叠：纯显示层的一层包装，进编辑与存盘对比前整个拆掉。
   包装盒自己带状态，被包住的那张表一个属性都不动。 */
.histbox{margin:0 0 1.5em}
.histbox>.tw{display:none;margin:10px 0 0}
.histbox.open>.tw{display:block}
.histpill{font-size:11px;color:var(--t2);background:var(--field);border-radius:9px;
  padding:3px 9px;white-space:nowrap;transition:background-color .15s ease}
.histpill:hover{background:var(--hover)}

/* 编辑态 */
.pane.edit .md>[data-lock]{position:relative;background:var(--field);border-radius:6px;
  box-shadow:inset 2px 0 0 var(--t3);
  -webkit-user-modify:read-only;user-select:text}
.pane.edit .md>[data-lock]::after{content:"改源码";position:absolute;top:2px;right:2px;
  font-size:11px;color:var(--t2);background:var(--pop);box-shadow:var(--popshadow);
  border-radius:6px;padding:1px 7px;cursor:pointer;opacity:0;transition:opacity .15s ease}
.pane.edit .md>[data-lock]:hover::after{opacity:1}
.pane.edit .md td,.pane.edit .md th{min-width:44px}
.pane.edit .md td:focus,.pane.edit .md th:focus{outline:none;background:var(--hover)}
.md textarea.blk{display:block;box-sizing:border-box;width:100%;
  margin:1em 0;padding:0;border:0;border-radius:0;background:none;color:var(--t1);
  font-family:var(--mono);font-size:.86em;line-height:1.7;letter-spacing:0;
  resize:none;outline:none;overflow:hidden;tab-size:2;-webkit-font-smoothing:inherit}

/* 选中文字浮出的工具条 */
#fmt{position:fixed;z-index:80;display:none;gap:2px;padding:5px 6px;
  background:var(--card-face);border:0;border-radius:11px;
  box-shadow:var(--el-3);animation:arrive .14s ease-out}
#fmt.on{display:flex}
#fmt button{min-width:30px;height:28px;padding:0 8px;border-radius:7px;color:var(--t1);
  display:flex;align-items:center;justify-content:center;font-size:13px;white-space:nowrap;
  transition:background-color .15s ease}
#fmt button:hover{background:var(--hover)}
#fmt button.on{background:var(--sel);box-shadow:var(--selshadow)}
#fmt .sep{width:7px}
#fmt b{font-weight:600}
#fmt i{font-style:italic}
#fmt s{text-decoration:line-through}
#fmt code{font-family:var(--mono);font-size:11px}

/* ═══ 浮层：⌘K 直达 / 右键 / 快看 / 设置 / 候选 ═══ */

/* ⌘K 直达：设计稿里的 .modal —— 半透明蒙层 + 5px 毛玻璃，面板从顶上落下来。 */
#cmdkWrap{position:fixed;inset:0;z-index:120;display:none;
  justify-content:center;align-items:flex-start;
  padding:clamp(70px,15vh,145px) 18px 30px;
  background:var(--scrim);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  animation:fadeIn .18s ease-out}
#cmdkWrap.on{display:flex}
.modal{width:min(560px,100%);max-height:75vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--card-face);border:0;border-radius:var(--r-xl);
  box-shadow:var(--popbig);
  animation:arrive .22s cubic-bezier(.2,.8,.2,1)}
.search-input-row{flex:none;display:flex;align-items:center;gap:12px;
  padding:17px 20px;border-bottom:1px solid var(--rule-row)}
.search-input-row>svg{width:18px;height:18px;flex:none;color:var(--accent)}
.search-input-row input{flex:1;min-width:0;height:26px;
  border:0;background:none;outline:none;font-size:15px;color:var(--t1)}
.search-input-row input::placeholder{color:var(--t3)}
.search-input-row .escb{flex:none;padding:3px;border-radius:7px;color:var(--t3);
  display:flex;align-items:center}
.search-input-row .escb:hover{background:var(--hover)}
.modal-body{flex:1;min-height:100px;overflow-y:auto;padding:7px}
.search-label{font-size:10px;color:var(--t3);padding:9px 12px 6px}
.modal-footer{flex:none;display:flex;align-items:center;gap:14px;
  padding:11px 18px;border-top:1px solid var(--rule-row);
  font-size:10px;color:var(--t3)}
.modal-empty{padding:46px 20px 40px;text-align:center;color:var(--t2)}
.modal-empty h2{margin:0 0 8px;font-size:17px;font-weight:550;color:var(--t1)}
.modal-empty p{margin:0 0 20px;font-size:12px;line-height:1.7}

#ctx{position:fixed;z-index:150;display:none;min-width:196px;padding:5px;
  background:var(--card-face);border:0;border-radius:var(--r-md);
  box-shadow:var(--el-3);animation:arrive .14s ease-out}
#ctx.on{display:block}
#ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 10px;border-radius:7px;font-size:13px;color:var(--t1);white-space:nowrap}
#ctx button:hover{background:var(--accent);color:var(--on-accent)}
#ctx button[disabled]{opacity:.4;pointer-events:none}
#ctx .sep{height:1px;background:var(--rule-row);margin:5px 8px}

#slash{position:fixed;z-index:85;display:none;width:240px;padding:6px;
  background:var(--card-face);border:0;border-radius:12px;
  box-shadow:var(--el-3);animation:arrive .16s ease-out}
#slash.on{display:block}
#slash .sh{font-size:11px;color:var(--t4);padding:6px 10px 4px}
#slash button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 10px;border-radius:8px;font-size:13px}
#slash button:hover,#slash button.on{background:var(--hover)}
#slash .k{color:var(--t4);font-size:11px;margin-left:auto}

/* ═══ 阅读与外观浮层 ═══════════════════════
   工具条最右那颗滑块按钮拉出来。点外面、按 Esc、翻页都会关掉。 */
#typeWrap{position:fixed;top:calc(var(--chrome-h) + var(--bnr-h, 0px) + 10px);right:20px;z-index:110;
  width:260px;display:none;padding:19px;
  background:var(--card-face);border:0;border-radius:var(--r-lg);
  box-shadow:var(--el-3);transform-origin:top right;animation:arrive .18s ease-out}
#typeWrap.on{display:block}
.pop-title{font-size:13px;font-weight:550;margin:0}
/* 无线条规则：行与行之间原来那道 1px 分隔换成间距，靠留白断句。 */
.setting{padding:0;margin-top:16px}
.setting > label{display:flex;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--t2);margin:0 0 10px}
.setting > label .v{color:var(--t3)}
.setting .filters{display:flex;gap:3px;width:100%;padding:3px;
  border-radius:8px;background:var(--seg-track)}
.setting .filters button{flex:1;padding:7px 4px;border-radius:6px;
  font-size:10px;color:var(--t2);white-space:nowrap}
.setting .filters button:hover{color:var(--t1)}
.setting .filters button.on{background:var(--pop);color:var(--t1);box-shadow:var(--segshadow)}
.setting input[type=range]{width:100%;accent-color:var(--accent)}
.setting .dt-btn{width:100%}
@keyframes arrive{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
body.type-on .toc{display:none!important}

/* ═══ 专注阅读 ═══════════════════════════
   只剩正文：文档头上滑淡出，大纲（常驻栏和浮层）一起淡掉。
   **大纲用 opacity 收，不用 display**——网格那一列还得占着位，
   不然正文会往左跳半栏，「进出专注正文原地不动」就废了。
   壳里留一条标签条高度的空白拖拽条给交通灯，里面的控件淡出；
   浏览器里没有交通灯，整条一起收掉。
   鼠标贴到窗口顶上 8px 内，文档头以浮层形式滑回来（body.peek）。 */
body.focus-mode{--status-h:0px}
body.focus-mode:not(.shell){--tabstrip-h:0px}
body.focus-mode:not(.shell) #tabstrip{display:none}
body.focus-mode.shell #tabcluster,
body.focus-mode.shell .navgrp,
body.focus-mode.shell .rightgrp{opacity:0;pointer-events:none;
  transition:opacity var(--d-base) var(--ease-in)}
body.focus-mode #chrome{box-shadow:none}
body.focus-mode .doc-toolbar{transform:translateY(-100%);opacity:0;pointer-events:none;
  transition:transform var(--d-base) var(--ease-in),opacity var(--d-base) var(--ease-in)}
body.focus-mode .outline{opacity:0;pointer-events:none}
body.focus-mode.peek .doc-toolbar{transform:none;opacity:1;pointer-events:auto;
  box-shadow:var(--el-2);
  transition:transform var(--d-slow) var(--ease-out),opacity var(--d-slow) var(--ease-out)}

#wlpick{position:fixed;z-index:90;background:var(--card-face);
  border:0;border-radius:11px;
  box-shadow:var(--el-3);padding:5px;display:none;animation:arrive .14s ease-out;
  max-width:420px;max-height:300px;overflow-y:auto}
#wlpick.on{display:block}
#wlpick button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:7px;
  font-size:13px;color:var(--t1)}
#wlpick button:hover{background:var(--accent);color:var(--on-accent)}
#wlpick .wp{display:block;font-size:11px;color:var(--t3);margin-top:1px}
#wlpick button:hover .wp{color:var(--on-accent);opacity:.85}

#qlwrap{position:fixed;inset:0;z-index:145;display:none;background:var(--scrim);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:6vh 6vw;animation:fadeIn .18s ease-out}
#qlwrap.on{display:flex}
#ql{width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--card-face);border:0;border-radius:var(--r-xl);
  box-shadow:var(--popbig);overflow:hidden;animation:arrive .22s cubic-bezier(.2,.8,.2,1)}
#qlh{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
#qlt{font-size:13px;font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qlb{flex:1;overflow-y:auto;padding:6px 30px 40px}
#qlb .md{max-width:680px}

/* ═══ 设置 ═══════════════════════════════
   720×600 的弹层：左边 172px 导航栏，右边一栏滚动内容，底下一条只有改了东西
   才冒出来的保存条。四段：阅读与外观 / 笔记库 / 高级 / 关于。
   无线条规则照旧——卡片、芯片、输入框全靠 --el-1 托起来，不描边；
   保留的线只有导航栏与内容区之间那道底色差，和保存条上沿那一条。 */
#cfgWrap{position:fixed;inset:0;z-index:130;display:none;background:var(--scrim);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:4vh 20px;animation:fadeIn .18s ease-out}
#cfgWrap.on{display:flex}
#viewCfg{width:min(720px,96vw);height:min(600px,92vh);display:flex;
  background:var(--pop);border:0;border-radius:var(--r-xl);
  box-shadow:var(--popbig);overflow:hidden;animation:arrive .22s var(--ease-std)}

/* 左导航 */
#viewCfg .cfg-rail{width:172px;flex:none;background:var(--side);
  padding:16px 10px 12px;display:flex;flex-direction:column;gap:2px}
#viewCfg .cfg-rail .rt{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.04em;padding:0 10px 12px}
#viewCfg .cfg-navi{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;
  border-radius:var(--r-sm);font-size:13px;color:var(--t1);text-align:left;
  transition:background-color var(--d-fast) ease}
#viewCfg .cfg-navi svg{width:16px;height:16px;flex:none;color:var(--t2);stroke-width:1.5}
#viewCfg .cfg-navi:hover{background:var(--rail-hover)}
#viewCfg .cfg-navi.on{background:var(--sel);box-shadow:var(--selshadow);font-weight:500}
#viewCfg .cfg-navi.on svg{color:var(--accent)}

/* 右内容 */
#viewCfg .cfg-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win)}
#viewCfg .cfg-head{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 28px}
#viewCfg .cfg-head h2{margin:0;font-size:15px;font-weight:600;flex:1}
#cfgBody{flex:1;min-height:0;overflow-y:auto;padding:0 28px 18px}
#viewCfg .cfg-panel{display:none}
#viewCfg .cfg-panel.on{display:block}

/* 字段行：左标签 58px ＋ 右控件 */
#viewCfg .frow{display:flex;gap:14px;align-items:flex-start}
#viewCfg .frow+.frow{margin-top:19px}
#viewCfg .flab{width:58px;flex:none;font-size:13px;color:var(--t2);line-height:26px}
#viewCfg .fctl{flex:1;min-width:0}
#viewCfg .hint{font-size:12px;color:var(--t3);line-height:1.6;margin:6px 0 0}
#viewCfg .sect{font-size:15px;font-weight:600;margin:0 0 11px}
#viewCfg .sec+.sec{margin-top:22px}
#viewCfg .lbl{font-size:13px;color:var(--t2);margin:0 0 8px;display:block}
#viewCfg .lblrow{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
#viewCfg .lblrow .lbl{margin:0;flex:none}
#viewCfg .lblrow .ih{font-size:12px;color:var(--t3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewCfg .inline-field{display:flex;align-items:center;gap:12px}
#viewCfg .inline-field .lbl{margin:0;flex:none}
#viewCfg .inline-field .tin{width:200px}

/* 主题预览卡：里面那个迷你窗口写死颜色，不跟当前主题走——
   「深色」那张在浅色下也得是深的，不然三张一模一样。 */
#viewCfg .tcards{display:flex;gap:12px}
#viewCfg .tcard{width:120px;text-align:center;flex:none}
#viewCfg .tcard .prev{display:block;width:120px;height:76px;border-radius:var(--r-md);overflow:hidden;
  position:relative;background:#fff;box-shadow:var(--el-1);
  transition:box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out)}
#viewCfg .tcard:hover .prev{transform:translateY(-1px);box-shadow:var(--el-2)}
#viewCfg .tcard.on .prev{box-shadow:0 0 0 2px var(--accent),var(--el-1)}
#viewCfg .tcard .nm{display:block;font-size:11px;color:var(--t2);margin-top:7px}
#viewCfg .tcard.on .nm{color:var(--accent);font-weight:500}
#viewCfg .mw{position:absolute;inset:0}
#viewCfg .mw .bar{position:absolute;left:0;right:0;top:0;height:15px;display:flex;align-items:center;
  gap:3px;padding-left:6px}
#viewCfg .mw .bar em{width:4px;height:4px;border-radius:50%;display:block}
#viewCfg .mw .body{position:absolute;left:0;right:0;top:15px;bottom:0;padding:10px 11px}
#viewCfg .mw .body u{display:block;height:6px;width:52px;border-radius:3px;margin-bottom:8px}
#viewCfg .mw .body s{display:block;height:4px;border-radius:2px;margin-bottom:5px}
#viewCfg .mw.lt{background:#fff}
#viewCfg .mw.lt .bar{background:#f2f4f7}
#viewCfg .mw.lt .bar em{background:#d7dce4}
#viewCfg .mw.lt .body u{background:#b9c2ce}
#viewCfg .mw.lt .body s{background:#e2e7ee}
#viewCfg .mw.dk{background:#23272f}
#viewCfg .mw.dk .bar{background:#1e2229}
#viewCfg .mw.dk .bar em{background:#3d434e}
#viewCfg .mw.dk .body u{background:#6e7784}
#viewCfg .mw.dk .body s{background:#3a4049}
/* 类名不能叫 .split：三栏那两条分隔条已经占着这个名字（width:0）。 */
#viewCfg .mw.half{clip-path:polygon(0 0,64% 0,36% 100%,0 100%)}

/* 字体预览卡：样句用真的字体栈渲染，所见即所得 */
#viewCfg .fcards{display:flex;gap:8px}
#viewCfg .fcard{flex:1;min-width:0;text-align:left;padding:10px 11px 12px;border-radius:var(--r-md);
  background:var(--card-face);box-shadow:var(--el-1);
  transition:box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out)}
#viewCfg .fcard:hover{transform:translateY(-1px);box-shadow:var(--el-2)}
#viewCfg .fcard.on{box-shadow:0 0 0 2px var(--accent),var(--el-1)}
#viewCfg .fcard .nm{display:block;font-family:var(--ui);font-size:11px;color:var(--t2);margin-bottom:6px}
#viewCfg .fcard.on .nm{color:var(--accent);font-weight:500}
#viewCfg .fcard .sm{display:block;font-size:12px;line-height:1.62;color:var(--t1)}
#viewCfg .fcard.f-mono .sm{font-size:11px;letter-spacing:-.01em}

/* 字号滑杆：轨道自己画，左半段是强调色 */
#viewCfg .srow{display:flex;align-items:center;gap:14px;height:26px}
#viewCfg .srow .val{width:30px;flex:none;text-align:right;font-size:12px;color:var(--t1)}
#cfgBody input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;
  height:16px;background:none;margin:0}
#cfgBody input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--accent) 0 var(--pct,33%),var(--field) var(--pct,33%) 100%)}
#cfgBody input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:#fff;margin-top:-5.5px;
  box-shadow:0 1px 3px rgba(58,48,80,.26),0 0 0 .5px rgba(58,48,80,.16)}
:root[data-theme="dark"] #cfgBody input[type=range]::-webkit-slider-thumb{background:#ccd2dc;
  box-shadow:0 1px 4px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cfgBody
  input[type=range]::-webkit-slider-thumb{background:#ccd2dc;
  box-shadow:0 1px 4px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.4)}}
#viewCfg .cfg-sample{margin:8px 0 0;color:var(--t2);line-height:1.5}

/* 开关 34×20 */
#viewCfg .swrow{display:flex;align-items:center;gap:12px}
#viewCfg .swrow .txt{flex:1;min-width:0;font-size:13px;color:var(--t1)}
#viewCfg .sw{width:34px;height:20px;border-radius:999px;background:var(--field);position:relative;flex:none;
  transition:background-color var(--d-base) var(--ease-out)}
#viewCfg .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:var(--el-1),0 0 0 .5px rgba(58,48,80,.10);
  transition:transform var(--d-base) var(--ease-out)}
#viewCfg .sw.on{background:var(--accent)}
#viewCfg .sw.on::after{transform:translateX(14px)}

/* 弹层里的次级按钮：图标＋文字要有间距，图标压成 --t2（主按钮里跟着强调色） */
#viewCfg .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
#viewCfg .btn svg{width:13px;height:13px;color:var(--t2)}
#viewCfg .btn.key svg{color:var(--accent)}
#viewCfg .btnt{height:28px;padding:0 8px;border-radius:7px;font-size:12px;color:var(--t2)}
#viewCfg .btnt:hover{color:var(--t1);background:var(--hover)}
#viewCfg .link{font-size:12px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
#viewCfg .link:hover{text-decoration:underline}
#viewCfg .link[disabled]{opacity:.4;pointer-events:none}

/* 文本输入：不描边，浮起来一层 */
#cfgBody .tin{height:30px;padding:0 10px;border-radius:var(--r-sm);font-size:12.5px;
  color:var(--t1);background:var(--win);border:0;box-shadow:var(--el-1),0 0 0 1px var(--rule-row);
  outline:none}
#cfgBody .tin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cfgBody .tin.n{width:78px;text-align:center}

/* 笔记库卡片 */
#viewCfg .vault{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;
  background:var(--card-face);box-shadow:var(--el-1)}
#viewCfg .vault .fico{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#viewCfg .vault .meta{flex:1;min-width:0}
#viewCfg .vault .vacts{flex:none;display:flex;flex-direction:column;gap:6px}
#viewCfg .vault .nm{display:block;font-size:15px;font-weight:600;line-height:1.3}
#viewCfg .vault .pth{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);
  min-width:0;margin-top:3px}
#viewCfg .vault .pth span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewCfg .cpb{width:20px;height:20px;border-radius:5px;flex:none;color:var(--t4);
  display:flex;align-items:center;justify-content:center}
#viewCfg .cpb svg{width:12px;height:12px}
#viewCfg .cpb:hover{background:var(--hover);color:var(--t2)}
#viewCfg .statusrow{display:flex;align-items:center;gap:10px;margin-top:14px}
#viewCfg .statusrow .st{flex:1;min-width:0;font-size:12px;color:var(--t2);
  display:flex;align-items:center;gap:7px}
#viewCfg .statusrow .st::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--dot);flex:none}
#viewCfg .statusrow .st.busy::before{background:var(--folder)}
#viewCfg .statusrow .st.off::before{background:var(--t4)}
#viewCfg .statusrow .btn span{display:inline-flex}
#viewCfg .statusrow .btn .spin{animation:spinning 1s linear infinite;transform-origin:50% 50%}
@keyframes spinning{to{transform:rotate(360deg)}}

/* 芯片输入 */
#viewCfg .chipbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:38px;padding:5px 8px;
  border-radius:var(--r-md);background:var(--win);
  box-shadow:var(--el-1),0 0 0 1px var(--rule-row)}
#viewCfg .chipbox:focus-within{box-shadow:var(--el-1),0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
#viewCfg .chip{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 3px 0 9px;
  border-radius:7px;background:var(--field);color:var(--t1);font-size:12px;white-space:nowrap}
#viewCfg .chip .x{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;color:var(--t3);opacity:0;transition:opacity var(--d-fast) ease}
#viewCfg .chip .x svg{width:9px;height:9px;stroke-width:2}
#viewCfg .chip:hover .x{opacity:1}
#viewCfg .chip .x:hover{background:var(--hover);color:var(--t1)}
#viewCfg .chip.fresh{background:var(--accent-soft);color:var(--accent)}
#viewCfg .chipbox input{flex:1;min-width:120px;height:24px;border:0;background:none;outline:none;
  font-size:12px;color:var(--t1)}
#viewCfg .chipbox input::placeholder{color:var(--t4)}

/* 服务端返回的「问题」：黄条，贴在对应字段上方 */
#viewCfg .notice{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;
  background:var(--warn-bg);box-shadow:0 0 0 1px var(--warn-bd);
  font-size:12px;line-height:1.6;color:var(--t1);margin:0 0 9px}
#viewCfg .notice svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--warn)}

/* 只读信息行 */
#viewCfg .kvrow{display:flex;align-items:center;gap:10px;min-height:24px;font-size:12px}
#viewCfg .kvgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
#viewCfg .kvgrid .wide{grid-column:1/3}
#viewCfg .kvrow b{width:64px;flex:none;font-weight:400;color:var(--t3)}
#viewCfg .kvrow>span{color:var(--t2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 高级的折叠头 */
#viewCfg .disc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--accent);flex:none}
#viewCfg .disc svg{width:12px;height:12px}
#viewCfg .advrow{display:flex;align-items:center;gap:14px;margin:0 0 12px}
#viewCfg .advrow .advnote{flex:1;min-width:0;font-size:12px;color:var(--t3);line-height:1.6;margin:0}

/* 底部保存条：只有改过库/高级里的字段才出现 */
#viewCfg .dirtybar{flex:none;display:none;align-items:center;gap:10px;height:52px;padding:0 20px 0 28px;
  border-top:1px solid var(--rule-row);background:var(--win)}
#viewCfg.dirty .dirtybar{display:flex}
#viewCfg .dirtybar .msg{flex:1;min-width:0;font-size:12px;color:var(--t2);
  display:flex;align-items:center;gap:8px}
#viewCfg .dirtybar .msg::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--warn);flex:none}

/* 关于 */
#viewCfg .about{padding:76px 0 0;text-align:center}
#viewCfg .about .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:15px;overflow:hidden;
  box-shadow:var(--el-2)}
#viewCfg .about .ico img{width:64px;height:64px;display:block}
#viewCfg .about h3{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em}
#viewCfg .about .ver{margin:5px 0 0;font-size:12px;color:var(--t3)}
#viewCfg .about .desc{margin:12px 0 0;font-size:13px;color:var(--t2)}
#viewCfg .about .acts{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px}
#viewCfg .about .swline{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--t2)}
#viewCfg .about .links{display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:24px;font-size:12px}
#viewCfg .about .links i{color:var(--t4);font-style:normal}
#viewCfg .about .fine{margin:16px 0 0;font-size:11px;color:var(--t4)}

/* ═══ 新用户引导 ═══════════════════════════
   壳里才出现：整窗 --win 底，中间一张 600px 卡片，背后什么都不留。
   浏览器模式下这一层永远不挂。 */
#onbWrap{position:fixed;inset:0;z-index:150;display:none;background:var(--win);
  align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease-out}
#onbWrap.on{display:flex}
body.onb #chrome,body.onb #app,body.onb #banners{display:none!important}
/* 壳里留一条标签条高度的空拖拽带给红绿灯 */
#onbDrag{position:fixed;left:0;right:0;top:0;height:42px;z-index:151;display:none;
  -webkit-app-region:drag}
body.onb.shell #onbDrag{display:block}
#onbWrap .onb-card{width:600px;max-width:100%;border-radius:var(--r-xl);background:var(--card-face);
  box-shadow:var(--el-3);padding:36px 24px 26px;animation:arrive .3s var(--ease-out)}
#onbWrap .onb-head{text-align:center;padding:0 14px}
#onbWrap .onb-ico{width:72px;height:72px;margin:0 auto 18px;border-radius:17px;overflow:hidden;
  box-shadow:var(--el-2)}
#onbWrap .onb-ico img{width:72px;height:72px;display:block}
#onbWrap .onb-card h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1.4}
#onbWrap .onb-sub{margin:11px 0 0;font-size:13px;color:var(--t2);line-height:1.8}
#onbWrap .onb-foot{margin:22px 0 0;text-align:center;font-size:12px;color:var(--t3)}
#onbWrap .onb-fine{margin:18px 0 0;text-align:center;font-size:11px;color:var(--t4)}
#onbWrap .choices{display:flex;gap:12px;margin-top:26px;justify-content:center}
#onbWrap .choice{width:270px;height:176px;flex:none;text-align:left;padding:18px 18px 16px;
  display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--card-face);
  box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-slow) var(--ease-out),box-shadow var(--d-slow) var(--ease-out)}
#onbWrap .choice:hover{transform:translateY(-2px);box-shadow:var(--el-3)}
#onbWrap .choice:active{transform:translateY(0) scale(.99);transition-duration:80ms}
#onbWrap .choice .ci{width:32px;height:32px;border-radius:9px;flex:none;margin-bottom:12px;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center}
#onbWrap .choice .ci svg{width:18px;height:18px}
#onbWrap .choice h2{margin:0;font-size:14px;font-weight:600;line-height:1.4}
#onbWrap .choice p{margin:6px 0 0;font-size:12px;color:var(--t2);line-height:1.7}
#onbWrap .choice .path{margin-top:auto;display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--t3)}
#onbWrap .choice .path .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#onbWrap .choice.wait{opacity:.72;pointer-events:none}
/* 整理中：不定进度条 */
#onbWrap .pbar{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;
  position:relative;margin-top:26px}
#onbWrap .pbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--accent) 22%,var(--accent) 78%,transparent);
  animation:sweep 1.6s linear infinite}
@keyframes sweep{from{transform:translateX(-105%)}to{transform:translateX(255%)}}
#onbWrap .scanrow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:16px}
#onbWrap .scanrow .cnt{font-size:13px;color:var(--t2);flex:none;white-space:nowrap}
#onbWrap .scanrow .cnt b{font-size:15px;font-weight:600;color:var(--t1);margin:0 2px}
#onbWrap .scanrow .pth{font-size:11px;color:var(--t4);flex:1;min-width:0;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 整理好了 */
#onbWrap .okmark{width:48px;height:48px;margin:0 auto 16px;color:var(--ok)}
#onbWrap .okmark svg{width:48px;height:48px;stroke-width:1.5;fill:none;stroke:currentColor}
#onbWrap .stats{display:flex;gap:10px;margin-top:26px}
#onbWrap .stat{flex:1;min-width:0;text-align:center;padding:14px 8px 13px;border-radius:12px;
  background:var(--card-face);box-shadow:var(--el-1)}
#onbWrap .stat b{display:block;font-size:21px;font-weight:600;letter-spacing:.01em;line-height:1.2}
#onbWrap .stat span{display:block;margin-top:5px;font-size:11px;color:var(--t3)}
#onbWrap .skipnote{margin:16px 0 0;text-align:center;font-size:12px;color:var(--t3);line-height:1.7}
/* 找不到笔记库 */
#onbWrap .qmark{position:relative;width:56px;height:56px;margin:0 auto 16px;border-radius:15px;
  background:var(--field);color:var(--t3);display:flex;align-items:center;justify-content:center}
#onbWrap .qmark svg{width:28px;height:28px;stroke-width:1.5}
#onbWrap .qmark em{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;
  background:var(--card-face);box-shadow:var(--el-1);display:flex;align-items:center;
  justify-content:center;font:600 12px/1 var(--ui);font-style:normal;color:var(--t2)}
#onbWrap .oldpath{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;
  max-width:400px;height:32px;padding:0 12px;border-radius:9px;background:var(--field);
  font-size:12px;color:var(--t3)}
#onbWrap .oldpath svg{width:13px;height:13px;flex:none}
#onbWrap .oldpath span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#onbWrap .onb-btns{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px}
#onbWrap .onb-btns .btn{height:34px;padding:0 18px;border-radius:9px;font-size:13px}

/* 分段控件与普通按钮：凹底＋当前项白块，跟样张同一套 */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--field)}
.seg button{height:26px;padding:0 13px;border-radius:7px;font-size:12px;color:var(--t2);
  white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--segon);color:var(--t1);font-weight:500;box-shadow:var(--segshadow)}
/* 次级按钮：白底渐变 ＋ 顶部高光，不描边；主按钮 .key 换成淡紫底板 ＋ 强调色字 */
.btn{height:28px;padding:0 13px;border-radius:var(--r-sm);border:0;
  background:linear-gradient(#fff,#fafbfc);
  font-size:12px;color:var(--t1);box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
:root[data-theme="dark"] .btn{background:linear-gradient(#323843,#2c313a)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{
  background:linear-gradient(#323843,#2c313a)}}
.btn:hover{transform:translateY(-1px);box-shadow:var(--el-2),var(--hi)}
.btn:active:not([disabled]){transform:translateY(0);box-shadow:var(--el-1)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.key{background:var(--accent-soft);color:var(--accent)}
.btn.key:hover{background:var(--accent-soft)}

/* ═══ 顶部横幅：断线 / 升级 / 冲突 ═══════════
   界面里唯一允许出现的一行字，说的是「现在能不能用、你要做什么」，不是旁白。 */
#banners{position:fixed;top:0;left:0;right:0;z-index:160}
.bnr{display:none;align-items:center;justify-content:center;gap:12px;
  height:33px;padding:0 14px;font-size:11px;color:var(--t2);
  background:var(--card-face);border:0;
  box-shadow:var(--el-1);animation:arrive .18s ease-out}
.bnr.on{display:flex}
.bnr::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--accent);opacity:.75}
#offline.bnr::before{background:var(--t3)}
#conflict.bnr::before{background:var(--folder)}
.bnr .btn{height:22px;padding:0 10px;font-size:11px}
body.bnr-on #app{padding-top:calc(var(--chrome-h) + var(--bnr-h))}
body.bnr-on #chrome{top:var(--bnr-h)}

/* 底部状态栏 5.4 起取消：服务状态并进开始页眉行那枚小圆点（.scan），
   「双击正文即可编辑」这类提示并进首次提示卡，字数本来就在文档 meta 行里。 */

/* ═══ 轻提示 ═══════════════════════════════
   一句话、两秒、不挡手。持久性的话走顶部横幅，不走这里。
   带动作按钮的那一版（notify(t,{action})，「已移到废纸篓 · 撤销」）多停几秒，
   而且只有它 pointer-events:auto——平时这张卡片飘在正文上，不该拦鼠标。 */
#toast{
  position:fixed;bottom:calc(var(--status-h) + 46px);left:50%;
  transform:translate(-50%,8px);
  background:var(--card-face);border:0;box-shadow:var(--el-3);
  border-radius:12px;font-size:12px;color:var(--t1);padding:11px 18px;
  z-index:200;pointer-events:none;opacity:0;
  transition:opacity .18s ease,transform .18s ease;
  max-width:calc(100% - 32px);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;padding:9px 10px 9px 18px}
.toast-act{
  flex:0 0 auto;font:inherit;font-weight:600;color:var(--accent);
  background:transparent;border:0;border-radius:8px;padding:5px 10px;
  cursor:pointer;white-space:nowrap;
}
.toast-act:hover{background:var(--hover)}

/* 页面切换的淡入。 */
.page-enter{animation:pageIn .19s ease-out}
@keyframes pageIn{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ═══ 窄窗口 ═══════════════════════════════ */
@media(max-width:900px){
  .section-head .section-meta{display:none}
}
@media(max-width:700px){
  .modal-footer span:last-child{display:none}
}

/* ═══ 独立窗口（solo）═══════════════════════ */
body.solo #side,body.solo .split{display:none!important}
body.solo #app{display:grid!important;grid-template-columns:minmax(0,1fr)}
body.solo .tabbar{display:none!important}
body.solo #chrome{display:none!important}

/* ═══ 打印：只出正文 ═══════════════════════
   ⌘P 走壳的 NSPrintOperation，打的是整个 WebView，所以界面得在这里收干净。 */
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  #side,.split,.tabbar,.outline,#outfloat,.editstatus,
  #chrome,#toast,
  .doc-toolbar,.formatbar,.doc-end,.editor-hint,
  #banners,#ctx,#fmt,#wlpick,#tabpick,#cmdkWrap,#qlwrap,#cfgWrap,#slash,#typeWrap,
  #onbWrap,#onbDrag{display:none!important}
  #app{display:block!important;padding-top:0!important;height:auto!important}
  #docpane{position:static;overflow:visible}
  #panes{position:static}
  .pane{position:static;display:none;overflow:visible;padding:0}
  .pane.on{display:block}
  .doc-layout{max-width:none;padding:0}
  /* 开着大纲打印：栏藏了，网格列也得收，不然正文被挤在中间那一栏 */
  .doc-layout.ol-on,.doc-layout.ol-on.ol-3{grid-template-columns:minmax(0,1fr);padding-left:0;padding-right:0}
  .document{max-width:none}
  .md{max-width:none}
  .histbox>.tw{display:block!important}
}
</style>

  const parts = (u[0]==='/' ? u.slice(1) : (base ? base+'/'+u : u)).split('/');
