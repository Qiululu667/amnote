<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM·Note</title>
<meta name="theme-color" content="#ffffff">
<!-- 口令：服务出页时把下面这串占位替换成真 token。前端读它，读到的还是占位＝旧服务，走降级。 -->
<meta name="amn-token" content="__AMN_TOKEN__">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
/* ═══════════════════════════════════════════════════════════════
   AM·Note 门户样式 · v24
   v24 换上新的设计系统：色板/字体/圆角/阴影全部按 2026-09 的交互稿走；标签条改成
   浮起的白卡片，地址栏改成带 ⌘K 的胶囊，书签栏描边小夹子，底部多一条状态栏，
   轻提示统一走窗口底部的 toast。--win / --chrome 与 app_shell.m 同步改过。
   ⌘K 换成同一套 .modal：毛玻璃蒙层 ＋ 搜索行 ＋ 结果行 ＋ 底部提示；
   下拉、右键、斜杠、标签溢出、快看、设置、格式条、横幅一律 --pop 底 ＋
   --rule-row 描边 ＋ --float 阴影 ＋ arrive 落场，深色各给一套值。
   已删：沉浸首页 #hub 那一整套（运行时不可达，被开始页取代）。
   大纲栏改为贴窗格左缘的常驻栏，条目按最浅标题归一缩进，当前节改为左缘短杠。
   标题认到六级：##### / ###### 不再原样显示井号，正文排版、大纲缩进、编辑记号一并跟上。
   设计参考：2026-09 的交互稿（浅色开始页那一版）。
   v23 正文默认 17 / 1.85 / 640，中文标题不做负字距；打开后的纯正文更像一页纸。
   列表和首页最近一篇带一行摘录，搜索结果露出命中片段。⌘K 能找笔记也能做动作。
   编辑时空段打 / 出插入菜单；排版可从命令面板拉出浮层。
   v22 首页浅色底改纯白，去掉全屏标题栏那条「上面偏白、下面偏灰」的假接缝；
   最近文稿不再套 rrow 选中白卡片，搜索框底下是一条轻标题，不再叠层。
   v21 按最终确认稿收紧首页：搜索框改为 640×54；最近文稿只留轻色标题，
   右侧以时间图标＋日期收口，不再显示「上次打开」文字。
   v20 把确认的第 2 版沉浸首页搬进正式客户端：搜索框在窗口中央，
   首页只留一条「上次打开」，不再摊开最近文稿列表；搜索态和三栏态保持原功能。
   v18 把已确认的无边框气质与文字排版搬进正式客户端：标题栏与正文同面、
   工具按钮默认裸露、列表更克制、三栏空态补齐、正文 15/1.8/680。
   v19 把网页主题同步给原生标题栏：浅色时标题与按钮自动变深，深色时自动变亮。
   这一版做掉的：四态布局（空态／阅读／编辑／搜索）＋⌘K 直达、
   去分割线去描边、表格 B、篇内目录短横线轨道、文档历史折叠。
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* 浏览器自己画的那些东西（滑杆、文本光标、滚动条）跟着主题走。
     不声明的话它们恒为浅色，深色主题下在深底上一片惨白。 */
  color-scheme: light dark;

  /* ── 色板（浅）── */
  --canvas:#f4f5f7;
  --win:#ffffff;
  /* 笔记页顶栏的毛玻璃底：--win 加一点透明。Safari 15 没有 color-mix，写死一对。 */
  --win-blur:rgba(255,255,255,.94);
  --quote-b:#b7c8c0;
  --side:#f4f5f7;
  --list:#f7f8fa;
  --hover:#f2f4f7;
  --sel:#ffffff;
  --t1:#272b31;
  --t2:#727881;
  --t3:#9096a0;
  --t4:#a8aeb8;
  --recent:#727881;
  --accent:#8a63b4;
  --accent-soft:#f4eefa;
  /* 落在 --accent 实底上的字。浅色下是白，深色下 --accent 本身就亮，得反过来压深，
     不然右键菜单和主按钮上的白字直接糊掉。 */
  --on-accent:#ffffff;
  --ok:#6a9484;
  /* 自绘提示气泡：深底白字，浅色深色各一套 */
  --tip-bg:#272b31;
  --tip-fg:#ffffff;

  --pill:#eef0f4;
  --field:#eef0f4;
  --field2:#eef0f4;
  --segon:#ffffff;
  --pop:#ffffff;

  --rule-head:rgba(40,54,74,.13);
  --rule-row:rgba(40,54,74,.085);
  --zebra:#f7f8fa;
  --hl:rgba(138,99,180,.16);
  --dot:#6a9484;

  --shadow:0 3px 7px rgba(58,48,80,.025),0 14px 32px rgba(58,48,80,.045);
  --float:0 5px 10px rgba(58,48,80,.035),0 20px 40px rgba(58,48,80,.09);
  --selshadow:0 2px 9px rgba(58,48,80,.08);
  /* 当前标签浮起、开始页那颗白按钮：浅色下几乎看不见的一层，深色要换成实的 */
  --tab-shadow:0 2px 8px rgba(58,48,80,.05);
  --btn-shadow:0 2px 4px rgba(58,48,80,.02);
  --btn-shadow-h:0 4px 12px rgba(58,48,80,.06);
  --segshadow:0 1px 4px rgba(38,51,75,.09);
  --popshadow:0 3px 7px rgba(58,48,80,.025),0 14px 32px rgba(58,48,80,.045);
  --popbig:0 25px 90px rgba(58,48,80,.15), 0 3px 12px rgba(58,48,80,.05);
  --scrim:rgba(37,51,71,.15);

  /* ── 5.4：圆角 / 缓动 / 时长 / 悬浮质感 ──
     卡片、按钮、芯片、浮层一律不描边，靠这三层阴影让色块「浮」出来。
     --card-face 是卡片与浮层的面色：浅色下就是白，深色下比页面亮一档，
     阴影在深底上看不见，全靠它把色块托起来。 */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-std:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --d-fast:120ms; --d-base:200ms; --d-slow:320ms;
  --el-1:0 1px 2px rgba(58,48,80,.05),0 6px 18px rgba(58,48,80,.06);
  --el-2:0 2px 4px rgba(58,48,80,.06),0 10px 28px rgba(58,48,80,.10);
  --el-3:0 4px 8px rgba(58,48,80,.07),0 18px 44px rgba(58,48,80,.14);
  --hi:inset 0 1px 0 rgba(255,255,255,.75);
  --card-face:#ffffff;
  /* 设置弹层：左导航的 hover 底（在 --side 上再浅一层）、
     服务端「问题」黄条的三件套。深色各另给一套。 */
  --rail-hover:rgba(255,255,255,.62);
  --warn:#e9b949;
  --warn-bg:rgba(233,185,73,.10);
  --warn-bd:rgba(233,185,73,.30);

  /* ── 字体栈 ── */
  --ui:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  /* ── 骨架尺寸 ── */
  --sbw:224px;    /* 边栏宽，可拖，存 localStorage */
  --docw:640px;   /* 正文栏宽，跟 PREF.w 走 */
  --outline-w:248px; /* 左侧大纲栏宽 */
  --ol-inset:24px;   /* 大纲栏离窗格左缘的距离；.doc-layout.ol-on 左右内边距各用它一份，olWider() 现读 */

  /* 书签栏小黄夹：浅色深色都用同一对，夹在灰底上才认得出来。 */
  --folder:#e9b949;
  --folder2:#f4d27a;
  /* 书签栏那排描边文件夹图标的暖色 */
  --bm-ico:#b7a584;
  --pin:#bba66e;

  /* 卡片上的文件小图标：md 一套冷灰蓝，html 一套淡紫。深色另给一套，
     不然白底方块直接砸在深色卡片上。 */
  --ico-md:#91a1b5;   --ico-md-bg:#f4f6f9;
  --ico-html:#9a91b5; --ico-html-bg:#f3f1f7;
  /* 分段控件的凹槽底 */
  --seg-track:rgba(39,43,49,.03);
  /* 「继续阅读」右边那叠纸的配色 */
  --paper1:#ffffff; --paper2:#edf1f4; --paper3:#f7f9fb;
  --paper-edge:rgba(217,225,233,.27); --paper-shadow:rgba(60,81,106,.04);
  --paper-b:#98afab; --paper-line:#e7ecf0;
  --paper-dot:#e3ebe7; --paper-dot-ico:#8aa396;

  /* 标签条底色，跟工具条/正文的 --win 分开：当前标签才能「浮」在工具条之上。
     必须和 app_shell.m 里 chromeColorForTheme 同步。 */
  --chrome:#f7f8fa;
  --tab-r:9px;
  --tab-left:12px;
  /* 顶部横幅占掉的高度，bnr() 按实际条数写进来。没横幅就是 0——
     body.bnr-on 的两条规则只在挂着横幅时生效，那时这个值已经被 bnr() 改写过了。 */
  --bnr-h:0px;

  /* 浏览器壳高度 5.4 起只有标签条一行：地址栏（#toolbar）和书签栏（#bmbar）整条删了，
     ‹ › ⌂ ／搜索胶囊／设置都并进标签条，路径搬进文档头。solo / shell 在 body 上改它。 */
  --tabstrip-h:42px;
  /* 底部状态栏 5.4 起取消。变量留着不删：toast 的下边距、大纲栏的最大高度、
     窄窗里那两条侧栏的 bottom 都还在 calc 里引用它，删了会整片塌掉。 */
  --status-h:0px;
  --chrome-h:var(--tabstrip-h);
}

:root[data-theme="light"]{ color-scheme: light }
:root[data-theme="dark"] { color-scheme: dark  }

  --rule-head:rgba(215,226,250,.16); --rule-row:rgba(215,226,250,.11); --zebra:#22262d;
