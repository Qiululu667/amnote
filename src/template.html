<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM·Note</title>
<meta name="theme-color" content="#ffffff">
<!-- 口令：服务出页时把下面这串占位替换成真 token。前端读它，读到的还是占位＝旧服务，走降级。 -->
<meta name="amn-token" content="__AMN_TOKEN__">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
/* ═══════════════════════════════════════════════════════════════
   AM·Note 门户样式 · v24
   v24 换上新的设计系统：色板/字体/圆角/阴影全部按 2026-09 的交互稿走；标签条改成
   浮起的白卡片，地址栏改成带 ⌘K 的胶囊，书签栏描边小夹子，底部多一条状态栏，
   轻提示统一走窗口底部的 toast。--win / --chrome 与 app_shell.m 同步改过。
   ⌘K 换成同一套 .modal：毛玻璃蒙层 ＋ 搜索行 ＋ 结果行 ＋ 底部提示；
   下拉、右键、斜杠、标签溢出、快看、设置、格式条、横幅一律 --pop 底 ＋
   --rule-row 描边 ＋ --float 阴影 ＋ arrive 落场，深色各给一套值。
   已删：沉浸首页 #hub 那一整套（运行时不可达，被开始页取代）。
   大纲栏改为贴窗格左缘的常驻栏，条目按最浅标题归一缩进，当前节改为左缘短杠。
   标题认到六级：##### / ###### 不再原样显示井号，正文排版、大纲缩进、编辑记号一并跟上。
   设计参考：2026-09 的交互稿（浅色开始页那一版）。
   v23 正文默认 17 / 1.85 / 640，中文标题不做负字距；打开后的纯正文更像一页纸。
   列表和首页最近一篇带一行摘录，搜索结果露出命中片段。⌘K 能找笔记也能做动作。
   编辑时空段打 / 出插入菜单；排版可从命令面板拉出浮层。
   v22 首页浅色底改纯白，去掉全屏标题栏那条「上面偏白、下面偏灰」的假接缝；
   最近文稿不再套 rrow 选中白卡片，搜索框底下是一条轻标题，不再叠层。
   v21 按最终确认稿收紧首页：搜索框改为 640×54；最近文稿只留轻色标题，
   右侧以时间图标＋日期收口，不再显示「上次打开」文字。
   v20 把确认的第 2 版沉浸首页搬进正式客户端：搜索框在窗口中央，
   首页只留一条「上次打开」，不再摊开最近文稿列表；搜索态和三栏态保持原功能。
   v18 把已确认的无边框气质与文字排版搬进正式客户端：标题栏与正文同面、
   工具按钮默认裸露、列表更克制、三栏空态补齐、正文 15/1.8/680。
   v19 把网页主题同步给原生标题栏：浅色时标题与按钮自动变深，深色时自动变亮。
   这一版做掉的：四态布局（空态／阅读／编辑／搜索）＋⌘K 直达、
   去分割线去描边、表格 B、篇内目录短横线轨道、文档历史折叠。
   ═══════════════════════════════════════════════════════════════ */

:root:lang(zh-HK){
  --ui:-apple-system,BlinkMacSystemFont,'PingFang HK','Hiragino Sans CNS','PingFang SC',sans-serif;
}
:root{
  /* 浏览器自己画的那些东西（滑杆、文本光标、滚动条）跟着主题走。
     不声明的话它们恒为浅色，深色主题下在深底上一片惨白。 */
  color-scheme: light dark;

  /* ── 色板（浅）── */
  --canvas:#f4f5f7;
  --win:#ffffff;
  /* 笔记页顶栏的毛玻璃底：--win 加一点透明。Safari 15 没有 color-mix，写死一对。 */
  --win-blur:rgba(255,255,255,.94);
  --quote-b:#b7c8c0;
  --side:#f4f5f7;
  --list:#f7f8fa;
  --hover:#f2f4f7;
  --sel:#ffffff;
  --t1:#272b31;
  --t2:#727881;
  --t3:#9096a0;
  --t4:#a8aeb8;
  --recent:#727881;
  --accent:#8a63b4;
  --accent-soft:#f4eefa;
  /* 头像位上的首字母：11.5px／600 落在 --accent-soft 上，--accent 只有 4.08:1，
     过不了 4.5。单开一档更深的同色系（5.8:1），只在浅色下换，深色分支照旧。 */
  --accent-ink:#6f4d96;
  /* 落在 --accent 实底上的字。浅色下是白，深色下 --accent 本身就亮，得反过来压深，
     不然右键菜单和主按钮上的白字直接糊掉。 */
  --on-accent:#ffffff;
  --ok:#6a9484;
  /* 自绘提示气泡：深底白字，浅色深色各一套 */
  --tip-bg:#272b31;
  --tip-fg:#ffffff;

  --pill:#eef0f4;
  --field:#eef0f4;
  --field2:#eef0f4;
  --segon:#ffffff;
  --pop:#ffffff;

  --rule-head:rgba(40,54,74,.13);
  --rule-row:rgba(40,54,74,.085);
  --zebra:#f7f8fa;
  --hl:rgba(138,99,180,.16);
  --dot:#6a9484;

  --shadow:0 3px 7px rgba(58,48,80,.025),0 14px 32px rgba(58,48,80,.045);
  --float:0 5px 10px rgba(58,48,80,.035),0 20px 40px rgba(58,48,80,.09);
  --selshadow:0 2px 9px rgba(58,48,80,.08);
  /* --tab-shadow 5.8.1 退役：当前标签不再「浮」在框架上，而是接进下一行，
     任何一层外投阴影都会在接缝处画出一条暗线。 */
  --btn-shadow:0 2px 4px rgba(58,48,80,.02);
  --btn-shadow-h:0 4px 12px rgba(58,48,80,.06);
  --segshadow:0 1px 4px rgba(38,51,75,.09);
  --popshadow:0 3px 7px rgba(58,48,80,.025),0 14px 32px rgba(58,48,80,.045);
  --popbig:0 25px 90px rgba(58,48,80,.15), 0 3px 12px rgba(58,48,80,.05);
  --scrim:rgba(37,51,71,.15);

  /* ── 5.4：圆角 / 缓动 / 时长 / 悬浮质感 ──
     卡片、按钮、芯片、浮层一律不描边，靠这三层阴影让色块「浮」出来。
     --card-face 是卡片与浮层的面色：浅色下就是白，深色下比页面亮一档，
     阴影在深底上看不见，全靠它把色块托起来。 */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-std:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --d-fast:120ms; --d-base:200ms; --d-slow:320ms;
  --el-1:0 1px 2px rgba(58,48,80,.05),0 6px 18px rgba(58,48,80,.06);
  --el-2:0 2px 4px rgba(58,48,80,.06),0 10px 28px rgba(58,48,80,.10);
  --el-3:0 4px 8px rgba(58,48,80,.07),0 18px 44px rgba(58,48,80,.14);
  --hi:inset 0 1px 0 rgba(255,255,255,.75);
  --card-face:#ffffff;
  /* 设置弹层：左导航的 hover 底（在 --side 上再浅一层）、
     服务端「问题」黄条的三件套。深色各另给一套。 */
  --rail-hover:rgba(255,255,255,.62);
  --warn:#e9b949;
  --warn-bg:rgba(233,185,73,.10);
  --warn-bd:rgba(233,185,73,.30);

  /* ── 字体栈 ── */
  --ui:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  /* 界面文案的占位串：bootI18n() 按当前语言写进来（CSS content: 里不能调 JS）。 */
  --i18n-ph-h1:"\65E0\6807\9898";
  --i18n-ph-p:"\5199\70B9\4EC0\4E48\2026";
  --i18n-ph-src:"\6539\6E90\7801";

  /* ── 骨架尺寸 ── */
  --sbw:224px;    /* 边栏宽，可拖，存 localStorage */
  --docw:640px;   /* 正文栏宽，跟 PREF.w 走 */
  --outline-w:248px; /* 左侧大纲栏宽 */
  --ol-inset:24px;   /* 大纲栏离窗格左缘的距离；.doc-layout.ol-on 左右内边距各用它一份，olWider() 现读 */
  /* 文档头（Row 2）的高。一处定义两处用：.doc-toolbar 自己的 height，
     和 html 预览 iframe 在 .pane.html 里让出的顶部留白（top ＋ height 都算它），
     两边同源才不会一边改高、另一边把标题压掉一截。 */
  --doc-toolbar-h:48px;

  /* 书签栏小黄夹：浅色深色都用同一对，夹在灰底上才认得出来。 */
  --folder:#e9b949;
  --folder2:#f4d27a;
  /* 书签栏那排描边文件夹图标的暖色 */
  --bm-ico:#b7a584;
  --pin:#bba66e;

  /* 卡片上的文件小图标：md 一套冷灰蓝，html 一套淡紫。深色另给一套，
     不然白底方块直接砸在深色卡片上。 */
  --ico-md:#91a1b5;   --ico-md-bg:#f4f6f9;
  --ico-html:#9a91b5; --ico-html-bg:#f3f1f7;
  /* 5.10 目录式列表：标题牵到日期那串点的颜色。比 --t4 再淡一档——它是牵引
     视线的，不是信息。 */
  --leader:#bcc4cf;
  /* 5.12 文件徽标（珍珠玻璃）落在纸面上的那层影。位图自己烘不了主题——原图里
     那层投影在抠白底时一并去掉了，改由这一枚 token 画，浅深各一支。
     写成 drop-shadow 不写 box-shadow：PNG 是圆角方块外带一圈透明，box-shadow
     描的是 <img> 的方形盒子，四个角会露出直角的影。
     0 1.5px 3px / 16% —— 跟 5.11 那枚字符徽标的 --fi-drop（0 1px 1.5px / 8%）
     同一路数，只是徽标从 34 长到 40、又换成有厚度的玻璃，影子跟着放一档。 */
  --fi-shadow:drop-shadow(0 1.5px 3px rgba(58,48,80,.16));
  /* 分段控件的凹槽底 */
  --seg-track:rgba(39,43,49,.03);
  /* 大卡右边那叠纸的配色。5.8 起并进淡紫系，跟贴在纸角的应用图标是一家人 */
  --paper1:#ffffff; --paper2:#f1ebf7; --paper3:#f7f9fb;
  --paper-edge:rgba(138,99,180,.14); --paper-shadow:rgba(60,81,106,.04);
  --paper-b:#cdbbe3; --paper-line:#e7ecf0;

  /* 标签条底色，跟工具条/正文的 --win 分开：当前标签是从这块框架色里「挖」出来的
     一张卡，底边直接淌进下一行的白。5.13 起框架从冷灰改成跟云朵 icon 同色温的
     珍珠紫「玻璃洗」：--chrome 是条底的实色（外翻角和壳的 chromeColorForTheme
     都指着它），--chrome-hi 是条顶的高光，--chrome-glow 是从品牌标渗出来的那团。
     必须和 app_shell.m 里 chromeColorForTheme 同步（浅 #e6daf0 / 深 #2a2734）。
     Safari 15 没有 color-mix，高光和胶囊一律写死。 */
  --chrome:#e6daf0;
  --chrome-hi:#efe4f7;
  --chrome-glow:rgba(214,176,232,.42);
  --chrome-search:#f5f0fa;
  --chrome-hover:#f0e9f6;
  --chrome-glow-x:24px;
  /* 顶栏当前标签的几何（5.8.1）：标签贴住条底，上两角圆 --tab-r2，下两角靠
     --flare 那两枚外翻角接进下一行。旧的 --tab-r（四角 9px 药丸）随之退役。 */
  --tab-h:36px;
  --tab-r2:10px;
  --flare:8px;
  --tab-left:12px;
  /* 顶部横幅占掉的高度，bnr() 按实际条数写进来。没横幅就是 0——
     body.bnr-on 的两条规则只在挂着横幅时生效，那时这个值已经被 bnr() 改写过了。 */
  --bnr-h:0px;

  /* 浏览器壳高度 5.4 起只有标签条一行：地址栏（#toolbar）和书签栏（#bmbar）整条删了，
     ☁ ／搜索胶囊／设置都并进标签条，路径搬进文档头。solo / shell 在 body 上改它。 */
  --tabstrip-h:42px;
  /* 底部状态栏 5.4 起取消。变量留着不删：toast 的下边距、大纲栏的最大高度、
     窄窗里那两条侧栏的 bottom 都还在 calc 里引用它，删了会整片塌掉。 */
  --status-h:0px;
  --chrome-h:var(--tabstrip-h);

  /* ── 5.7：笔记本身份色（八色盘）──
     八色分布在 hue 346→211 那一段（玫瑰 346 / 梅 308 / 蓝 211 / 灰 217 /
     青 178 / 绿 130 / 黄 43 / 橙 19），230–300 那一段整段留给 --accent：
     紫只表示「选中」，身份色一旦也有紫，选中的工作笔记本和身份为紫的读书
     笔记本就分不开了（P4）。饱和度压在 30–68%，跟 --ok / --folder 一个调子。
     浅色一套对白底 4.03–5.48:1、对 --canvas ≥3.6（过 WCAG 1.4.11 的 3:1），
     深色一套整体提亮一档。明度是第二条线索（黄 L32 最深、玫瑰 L50 最浅），
     红绿色盲把 绿/橙/玫瑰 压到一起时还有明暗和「色点后面永远跟着名字」。
     颜色的唯一入口是祖先上的 --nb / --nb-soft（见下面八枚 .nb-* 类）。 */
  --nb-blue:#3f74ab;   --nb-blue-soft:#eaf1f9;
  --nb-teal:#2b7b79;   --nb-teal-soft:#e5f2f1;
  --nb-green:#45804f;  --nb-green-soft:#e9f3eb;
  --nb-gold:#9d7a1c;   --nb-gold-soft:#f4efdf;
  --nb-orange:#a95a34; --nb-orange-soft:#f8eee9;
  --nb-rose:#b04f66;   --nb-rose-soft:#f9ecef;
  --nb-plum:#96508d;   --nb-plum-soft:#f6ecf5;
  --nb-slate:#6c7686;  --nb-slate-soft:#eef0f3;
}
/* 八枚一次性写好的「挂色」类。下游一律写 var(--nb)，也可以内联 style="--nb:…"。 */
.nb-blue  {--nb:var(--nb-blue);   --nb-soft:var(--nb-blue-soft)}
.nb-teal  {--nb:var(--nb-teal);   --nb-soft:var(--nb-teal-soft)}
.nb-green {--nb:var(--nb-green);  --nb-soft:var(--nb-green-soft)}
.nb-gold  {--nb:var(--nb-gold);   --nb-soft:var(--nb-gold-soft)}
.nb-orange{--nb:var(--nb-orange); --nb-soft:var(--nb-orange-soft)}
.nb-rose  {--nb:var(--nb-rose);   --nb-soft:var(--nb-rose-soft)}
.nb-plum  {--nb:var(--nb-plum);   --nb-soft:var(--nb-plum-soft)}
.nb-slate {--nb:var(--nb-slate);  --nb-soft:var(--nb-slate-soft)}

:root[data-theme="light"]{ color-scheme: light }
:root[data-theme="dark"] { color-scheme: dark  }

/* ── 样张色板（深）── */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#1b1e24; --win:#252931; --side:#1b1e24; --chrome:#2a2734; --list:#1f232a;
  --chrome-hi:#322a3c; --chrome-glow:rgba(198,163,224,.22);
  --chrome-search:#353240; --chrome-hover:#3b3844;
  --win-blur:rgba(37,41,49,.94); --quote-b:#5f7d74;
  --hover:#303640; --sel:#303640;
  --t1:#e9edf3; --t2:#a4acb9; --t3:#929bab; --t4:#7d8593; --recent:#a4acb9; --accent:#c6a3e0;
  --accent-soft:#3a3150; --on-accent:#171a20; --ok:#9ec2b4; --accent-ink:#c6a3e0;
  --tip-bg:#3f4753; --tip-fg:#eef2f8;
  --pill:#2b3038; --field:#2b3038; --field2:#2b3038; --segon:#3a414d; --pop:#252931;
  --rule-head:rgba(215,226,250,.16); --rule-row:rgba(215,226,250,.11); --zebra:#22262d;
  --hl:rgba(198,163,224,.20); --dot:#9ec2b4;
  --card-face:#2c313a;
  --rail-hover:rgba(255,255,255,.055);
  --warn-bg:rgba(233,185,73,.13);
  --warn-bd:rgba(233,185,73,.30);
  --el-1:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.30);
  --el-2:0 2px 4px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.40);
  --el-3:0 4px 8px rgba(0,0,0,.40),0 18px 44px rgba(0,0,0,.50);
  --hi:inset 0 1px 0 rgba(255,255,255,.06);
  --shadow:0 3px 10px rgba(0,0,0,.13),0 14px 32px rgba(0,0,0,.13);
  --float:0 16px 45px rgba(0,0,0,.33);
  --selshadow:0 2px 9px rgba(0,0,0,.30);
  --btn-shadow:0 2px 5px rgba(0,0,0,.22);
  --btn-shadow-h:0 5px 14px rgba(0,0,0,.34);
  --segshadow:0 1px 4px rgba(0,0,0,.35);
  --popshadow:0 3px 10px rgba(0,0,0,.13),0 14px 32px rgba(0,0,0,.13);
  --popbig:0 26px 70px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
  --scrim:rgba(10,14,22,.45);
  --ico-md:#9aa8bb;   --ico-md-bg:#303640;
  --ico-html:#aaa0c8; --ico-html-bg:#343044;
  --leader:#545c6a;
  /* 文件徽标的投影（5.12）：深底上 16% 的紫黑影等于没有，换纯黑并加深到 45%，
     同时把模糊从 3 放到 5、下沉从 1.5 放到 2 —— 影子淡了就得铺得开一点才看得见。 */
  --fi-shadow:drop-shadow(0 2px 5px rgba(0,0,0,.45));
  --seg-track:rgba(215,226,250,.05);
  /* 书签栏那排小文件夹和收藏星：浅色那对压在深底上发闷，各提亮一档 */
  --bm-ico:#c9b48f; --pin:#d6c07e;
  --paper1:#2e333c; --paper2:#292532; --paper3:#2a2f38;
  --paper-edge:rgba(198,163,224,.12); --paper-shadow:rgba(0,0,0,.22);
  --paper-b:#6e5c8c; --paper-line:#3a414c;
  /* 笔记本八色（深）：浅色那八个压在 #1b1e24 上会糊成八坨深灰，整体提亮一档。 */
  --nb-blue:#8ab4e0;   --nb-blue-soft:#2b3a4a;
  --nb-teal:#63b8b4;   --nb-teal-soft:#24403f;
  --nb-green:#84bd8c;  --nb-green-soft:#29402f;
  --nb-gold:#d3b263;   --nb-gold-soft:#3d3624;
  --nb-orange:#e0977a; --nb-orange-soft:#43332a;
  --nb-rose:#df8fa4;   --nb-rose-soft:#432f36;
  --nb-plum:#cd92c8;   --nb-plum-soft:#3e2f3e;
  --nb-slate:#a3adbb;  --nb-slate-soft:#333944;
}}
:root[data-theme="dark"]{
  --canvas:#1b1e24; --win:#252931; --side:#1b1e24; --chrome:#2a2734; --list:#1f232a;
  --chrome-hi:#322a3c; --chrome-glow:rgba(198,163,224,.22);
  --chrome-search:#353240; --chrome-hover:#3b3844;
  --win-blur:rgba(37,41,49,.94); --quote-b:#5f7d74;
  --hover:#303640; --sel:#303640;
  --t1:#e9edf3; --t2:#a4acb9; --t3:#929bab; --t4:#7d8593; --recent:#a4acb9; --accent:#c6a3e0;
  --accent-soft:#3a3150; --on-accent:#171a20; --ok:#9ec2b4; --accent-ink:#c6a3e0;
  --tip-bg:#3f4753; --tip-fg:#eef2f8;
  --pill:#2b3038; --field:#2b3038; --field2:#2b3038; --segon:#3a414d; --pop:#252931;
  --rule-head:rgba(215,226,250,.16); --rule-row:rgba(215,226,250,.11); --zebra:#22262d;
  --hl:rgba(198,163,224,.20); --dot:#9ec2b4;
  --card-face:#2c313a;
  --rail-hover:rgba(255,255,255,.055);
  --warn-bg:rgba(233,185,73,.13);
  --warn-bd:rgba(233,185,73,.30);
  --el-1:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.30);
  --el-2:0 2px 4px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.40);
  --el-3:0 4px 8px rgba(0,0,0,.40),0 18px 44px rgba(0,0,0,.50);
  --hi:inset 0 1px 0 rgba(255,255,255,.06);
  --shadow:0 3px 10px rgba(0,0,0,.13),0 14px 32px rgba(0,0,0,.13);
  --float:0 16px 45px rgba(0,0,0,.33);
  --selshadow:0 2px 9px rgba(0,0,0,.30);
  --btn-shadow:0 2px 5px rgba(0,0,0,.22);
  --btn-shadow-h:0 5px 14px rgba(0,0,0,.34);
  --segshadow:0 1px 4px rgba(0,0,0,.35);
  --popshadow:0 3px 10px rgba(0,0,0,.13),0 14px 32px rgba(0,0,0,.13);
  --popbig:0 26px 70px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
  --scrim:rgba(10,14,22,.45);
  --ico-md:#9aa8bb;   --ico-md-bg:#303640;
  --ico-html:#aaa0c8; --ico-html-bg:#343044;
  --leader:#545c6a;
  /* 文件徽标的投影（5.12）：深底上 16% 的紫黑影等于没有，换纯黑并加深到 45%，
     同时把模糊从 3 放到 5、下沉从 1.5 放到 2 —— 影子淡了就得铺得开一点才看得见。 */
  --fi-shadow:drop-shadow(0 2px 5px rgba(0,0,0,.45));
  --seg-track:rgba(215,226,250,.05);
  /* 书签栏那排小文件夹和收藏星：浅色那对压在深底上发闷，各提亮一档 */
  --bm-ico:#c9b48f; --pin:#d6c07e;
  --paper1:#2e333c; --paper2:#292532; --paper3:#2a2f38;
  --paper-edge:rgba(198,163,224,.12); --paper-shadow:rgba(0,0,0,.22);
  --paper-b:#6e5c8c; --paper-line:#3a414c;
  /* 笔记本八色（深）：浅色那八个压在 #1b1e24 上会糊成八坨深灰，整体提亮一档。 */
  --nb-blue:#8ab4e0;   --nb-blue-soft:#2b3a4a;
  --nb-teal:#63b8b4;   --nb-teal-soft:#24403f;
  --nb-green:#84bd8c;  --nb-green-soft:#29402f;
  --nb-gold:#d3b263;   --nb-gold-soft:#3d3624;
  --nb-orange:#e0977a; --nb-orange-soft:#43332a;
  --nb-rose:#df8fa4;   --nb-rose-soft:#432f36;
  --nb-plum:#cd92c8;   --nb-plum-soft:#3e2f3e;
  --nb-slate:#a3adbb;  --nb-slate-soft:#333944;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  /* 按钮回弹、芯片抬起、箭头右移、浮层落场、翻页淡入，全部按住不动。
     卡片和续读大卡 5.9 起悬停本来就不位移，不必再按。 */
  .resume:active,
  .hbtn:hover,.hbtn:active,.btn:hover,.btn:active,.dt-btn:hover,.dt-btn:active,
  .dirchip:hover,.resume:hover .continue svg,
  #navHome:hover img,.uchip:hover{transform:none}
  button:active:not([disabled]){transform:none}
}
/* 系统里关掉「透明」时，毛玻璃退回实色，别糊成一团。 */
@media (prefers-reduced-transparency:reduce){
  #cmdkWrap,#qlwrap,#cfgWrap{-webkit-backdrop-filter:none;backdrop-filter:none}
  .doc-toolbar{background:var(--win);-webkit-backdrop-filter:none;backdrop-filter:none}
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--win)}
body{background:var(--win);color:var(--t1);
  font:13px/1.5 var(--ui);
  font-synthesis:none;
  -webkit-font-smoothing:antialiased;
  --tabstrip-h:42px; --status-h:0px;
  --chrome-h:var(--tabstrip-h)}
/* 标签跟红绿灯同一行，左侧让出交通灯（约 78px）。多出来的标签由 layoutTabs
   整颗藏进 ▾，不再被左边距裁成半个。 */
body.shell{--tabstrip-h:42px; --tab-left:80px; --chrome-glow-x:94px}
body.solo{--tabstrip-h:0px; --status-h:0px}
body.shell.solo{--tabstrip-h:52px; --status-h:0px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;
  transition:background-color .16s ease,color .16s ease,box-shadow .18s ease,
             transform var(--d-fast) var(--ease-out)}
button:active:not([disabled]){transform:scale(.98)}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--hl)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
svg{fill:none;stroke:currentColor}

/* ═══ 骨架 ═══════════════════════════════
   5.4.1 起只剩正文一栏：列表栏（⌃⌘S）整条下线。
   分区只靠背景深浅和留白，全程无分割线无描边。 */
#app{display:grid;height:calc(100% - var(--status-h));
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"doc"}

/* 原生壳是全尺寸透明标题栏：标签条跟红绿灯同一行，工具条和书签栏再往下。
   内容从 --chrome-h 开始。 */
#app{padding-top:var(--chrome-h)}

/* ═══ 浏览器壳：只剩一条标签条 ═══════════
   42px 一行装下全部窗口层控件：左 ☁（壳里从红绿灯右缘 80px 起，云就是 ⌂），
   中间标签，右边搜索胶囊 ＋ ⚙。空处可拖窗口，控件一律 no-drag。
   5.13 起前进后退从顶栏拿掉（⌘[ / ⌘] 仍走键盘和菜单），头像并进开始页问候。
   5.8.1 起整条改成 align-items:flex-end：所有标签一样高、底边贴住条底，当前那张
   点亮成 --win 并在左右下角长出外翻角，直接接进下一行（首页是 .pagebox 的白，
   阅读页是 .doc-toolbar 那层压在白上的毛玻璃，合成结果同样是 --win）。
   导航组／＋ 仍 margin-bottom:4px 垫回标签的中线；搜索胶囊在框架里单独垫 7px，
   28px 高的药丸在 42px 条里上下各 7px，不再贴着页缝。 */
/* 5.4 起顶栏与正文之间不画线：--chrome 和 --win 本来就差一档，色差就是分界。
   要加回来的话记得用 inset 阴影，不要用 border——border 会额外占 1px，而
   --chrome-h 只算了标签条的高度，正文顶上就会被压掉一行的头。 */
#chrome{position:fixed;top:0;left:0;right:0;z-index:20;
  background:
    radial-gradient(ellipse 340px 78px at var(--chrome-glow-x) 0, var(--chrome-glow), transparent 72%),
    linear-gradient(180deg, var(--chrome-hi) 0%, var(--chrome) 100%);
  display:flex;flex-direction:column;box-shadow:none}
body.solo #chrome{display:none!important}
#tabstrip{
  height:var(--tabstrip-h);flex:none;position:relative;
  background:transparent;
  display:flex;align-items:flex-end;
  width:100%;box-sizing:border-box;
  padding:0 12px 0 var(--tab-left);gap:5px;
  user-select:none;-webkit-user-select:none;
  -webkit-app-region:drag;
  /* overflow:hidden 不能删：外翻角是溢出标签盒的绝对定位块，靠它裁掉
     最左那一枚多出条外的部分。 */
  overflow:hidden;
}
/* 标签＋加号是一组：加号贴在最后一个标签后面。栏本身可以收缩，
   多出来的标签由 layoutTabs 整颗藏进 ▾，不要被 overflow 切成半个。 */
#tabcluster{
  display:flex;align-items:flex-end;gap:5px;
  flex:0 1 auto;min-width:0;
  /* 右边那簇（搜索胶囊 ＋ ⚙）加左边那颗云大概 220px，
     给标签留出上限，剩下的交给 flex 收缩和 layoutTabs 的 ▾ 收纳。 */
  max-width:max(120px, calc(100% - 240px));
  transition:opacity var(--d-base) var(--ease-out);
}
#tabstrip .tabbar{
  position:relative;top:auto;left:auto;right:auto;z-index:auto;
  display:flex;align-items:flex-end;gap:4px;
  padding:0;overflow:visible;background:transparent;
  flex:1 1 auto;min-width:0;max-width:none;height:auto;
}
#tabstrip .tabbar.on{display:flex}
#tabstrip .tab{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:9px;
  min-width:96px;max-width:210px;flex:1 1 180px;
  height:var(--tab-h);margin:0;
  padding:0 26px 0 12px;
  border-radius:var(--tab-r2) var(--tab-r2) 0 0;background:transparent;box-shadow:none;
  color:var(--t2);font-weight:400;
  /* 不能 overflow:hidden —— 外翻角要溢出到标签左右两侧去。
     标题的省略号由 .tt/.tt .h 自己的 overflow 管，不靠这里。 */
  overflow:visible;
  transition:background-color .16s ease,color .16s ease,box-shadow .18s ease;
}
#tabstrip .tab:hover{background:var(--chrome-hover);color:var(--t1)}
/* 当前标签：Chrome 式外翻角。
   ① 上两角 --tab-r2 圆、下两角方，底色 = --win（下一行的实色）；
   ② ::before/::after 各一枚贴在左下/右下外侧，用 radial-gradient 把靠内的
      那个角抠成框架色，剩下填 --win —— 抠出来的那一勾就是外翻角；
   ③ 两端色标都得是不透明色。transparent 在 sRGB 里插值会经过「透明黑」，
      弧线上会烧出一条暗边；
   ④ 方块宽 --flare + 1px，多出来的 1px 压进标签本体（同色，看不出），
      标签宽是 flex 算出来的、会落在半像素上，整宽会在接缝漏出一条框架色细线；
   ⑤ 渐变在 --flare 处收尾（--flare - .7px 起坡），抗锯齿的过渡像素全部落在
      标签外侧，不糊进标签边上；
   ⑥ 一层 box-shadow 都不能留 —— 外投阴影会在下一行上画出暗线，前功尽弃。 */
#tabstrip .tab.on{
  z-index:3;
  background:var(--win);color:var(--t1);font-weight:500;
  box-shadow:none;
}
#tabstrip .tab.on::before,#tabstrip .tab.on::after{
  content:'';position:absolute;bottom:0;
  width:calc(var(--flare) + 1px);height:var(--flare);pointer-events:none;
}
#tabstrip .tab.on::before{
  left:calc(var(--flare) * -1);
  background:radial-gradient(circle at 0 0, var(--chrome) calc(var(--flare) - .7px),
             var(--win) var(--flare));
}
#tabstrip .tab.on::after{
  right:calc(var(--flare) * -1);
  background:radial-gradient(circle at 100% 0, var(--chrome) calc(var(--flare) - .7px),
             var(--win) var(--flare));
}
#tabstrip .tab .fav{
  width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--t3);
}
#tabstrip .tab.on .fav{color:var(--t2)}
#tabstrip .tab .fav svg{width:13px;height:13px}
#tabstrip .tab .fav,#tabstrip .tab .tt,#tabstrip .tab .ddot{position:relative;z-index:1}
#tabstrip .tab .tx{
  width:19px;height:19px;position:absolute;right:5px;top:50%;margin-top:-9.5px;z-index:2;
  display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--t3);
}
#tabstrip .tab .tx svg{width:11px;height:11px}
#tabstrip .tab .tx:hover{background:var(--hover);color:var(--t1)}
#tabstrip .tab.on .tx:hover{background:var(--canvas)}
/* 条改成 flex-end 之后，这几颗 28 高的控件各自垫 4px 回到标签的中线上
   （42 - 36 = 6，标签中线在 24，28 高的钮 bottom 留 4 正好也落在 24）。 */
#tabstrip .tabmore{
  height:28px;align-self:flex-end;margin:0 2px 4px;z-index:4;
  -webkit-app-region:no-drag;
}
#tabplus{
  width:28px;height:28px;border-radius:8px;flex:none;align-self:flex-end;
  margin:0 0 4px;color:var(--t2);position:relative;z-index:5;
  display:flex;align-items:center;justify-content:center;
  -webkit-app-region:no-drag;
}
#tabplus:hover{background:var(--chrome-hover);color:var(--t1)}
#tabplus svg{width:15px;height:15px;stroke-width:1.6}
#tabflex{
  flex:1 1 auto;min-width:8px;align-self:stretch;
  -webkit-app-region:drag;
}
#tabstrip .tab,
#tabstrip .tabmore{-webkit-app-region:no-drag}

/* 导航钮：5.13 起只剩云（回家）。壳里贴红绿灯右缘，浏览器里贴左缘。 */
.navgrp{
  display:flex;align-items:center;gap:2px;flex:none;margin:0 8px 4px 0;
  -webkit-app-region:no-drag;
}
.navb{
  width:28px;height:28px;border-radius:7px;color:var(--t3);flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  -webkit-app-region:no-drag;
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,
             transform var(--d-fast) var(--ease-out);
}
.navb:active:not([disabled]){transform:scale(.96)}
.navb:hover:not([disabled]){background:var(--chrome-hover);color:var(--t1)}
.navb[disabled]{opacity:.28;pointer-events:none}
.navb.on{background:var(--hover);color:var(--t1)}
.navb svg{width:16px;height:16px;stroke-width:1.6}
/* 品牌标：5.5 起⌂ 换成这颗云，还挪到了 ‹ › 前面（壳里紧挨红绿灯）。
   它不参与 syncChrome 的灰化——永远满不透明、永远可点；已经在开始页上时
   只把这一页滚回顶，不再顺手弹 ⌘K。壳色浅，阴影沿用原来那点淡紫，深浅两套通用。 */
#navHome img{
  width:22px;height:22px;border-radius:6px;display:block;
  box-shadow:0 1px 2px rgba(58,48,80,.14);
  -webkit-user-drag:none;pointer-events:none;
  transition:transform var(--d-fast) var(--ease-out);
}
#navHome:hover img{transform:scale(1.06)}

/* 标签条右端：搜索胶囊（⌘K 的唯一入口）＋ ⚙。品牌标 5.5 起挪去了左端当 ⌂。
   5.13：头像离开这一簇。margin-bottom 7px 让 28px 药丸在 42px 条里上下对称，
   不再贴着页缝（4px 时上面 10、下面 4，胶囊看起来沉在条底）。 */
.rightgrp{
  display:flex;align-items:center;gap:6px;flex:none;margin-bottom:7px;
  -webkit-app-region:no-drag;
}
/* 搜索胶囊：不描边（无线条规则），--chrome-search 比框架浅一档才在玻璃洗上立住，
   hover 抬 1px 加 --el-1。 */
.topsearch{
  display:flex;align-items:center;gap:8px;flex:none;
  width:150px;height:28px;padding:0 11px;border-radius:999px;
  background:var(--chrome-search);border:0;color:var(--t3);font-size:11px;
  -webkit-app-region:no-drag;
  transition:background-color var(--d-base) ease,box-shadow var(--d-base) var(--ease-out),
             transform var(--d-base) var(--ease-out);
}
.topsearch svg{width:13px;height:13px;flex:none;stroke-width:1.6}
.topsearch .lbl{flex:1;text-align:left;white-space:nowrap}
.topsearch kbd{font:10px/1.6 var(--ui);font-weight:500;white-space:nowrap;
  color:var(--t4);background:none;border:0;padding:0}
.topsearch:hover{background:var(--win);box-shadow:var(--el-1);transform:translateY(-1px)}
.topsearch:active{transform:translateY(0);box-shadow:none}
/* 窗口窄了收成一枚 28px 圆钮，只留放大镜——标签永远优先。 */
@media(max-width:1000px){
  .topsearch{width:28px;padding:0;gap:0;justify-content:center}
  .topsearch .lbl,.topsearch kbd{display:none}
}
/* ── 开始页问候旁那颗人 ──────────────────
   5.13 起从顶栏右上角搬到「早晨，Lulu」左侧。40px 圆：有头像就是头像，
   没有就是显示名的第一个字。阅读页没有问候，资料入口改走设置。 */
.uchip{
  width:40px;height:40px;border-radius:50%;flex:none;padding:0;border:0;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent-ink);
  font:600 16px/1 var(--ui);letter-spacing:0;
  box-shadow:0 0 0 1px rgba(58,48,80,.10), 0 1px 2px rgba(58,48,80,.08), 0 6px 14px rgba(58,48,80,.10);
  transition:box-shadow var(--d-fast) var(--ease-out),transform var(--d-fast) var(--ease-out);
}
.uchip img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.uchip svg{width:18px;height:18px;stroke-width:1.6}
.uchip:hover{transform:scale(1.05);
  box-shadow:0 0 0 1px rgba(58,48,80,.10), 0 0 0 4px var(--accent-soft), 0 8px 18px rgba(138,99,180,.16)}
.uchip:active{transform:scale(1);box-shadow:0 0 0 1px rgba(58,48,80,.10), 0 1px 2px rgba(58,48,80,.08)}
.uchip[aria-expanded="true"]{box-shadow:0 0 0 2px var(--accent)}
:root[data-theme="dark"] .uchip{
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.40);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .uchip{
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.40);
}}

/* 头像浮层：贴着问候旁头像左缘往下掉一格。窗口右边挤不下就往里收，不出屏。 */
#userPop{
  position:fixed;z-index:110;display:none;width:236px;padding:14px 14px 10px;
  background:var(--card-face);border:0;border-radius:14px;
  box-shadow:var(--el-3);animation:arrive .16s ease-out;
  -webkit-app-region:no-drag;
}
#userPop.on{display:block}
#userPop .who{display:flex;align-items:center;gap:11px}
#userPop .av{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent-ink);font:600 19px/1 var(--ui)}
#userPop .av img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
#userPop .nm{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 底色用 --hover 不用 --field：深色里 --field(#2b3038) 跟 --card-face(#2c313a)
   差不多是同一档灰，这一块就浮不出来了。 */
#userPop .vault{margin:12px 0 0;padding:9px 10px;border-radius:9px;background:var(--hover)}
#userPop .vault .k{display:block;font-size:10.5px;color:var(--t3)}
#userPop .vault .v{display:block;font-size:12.5px;color:var(--t1);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#userPop .acts{margin-top:9px;display:flex;flex-direction:column;gap:1px}
#userPop .acts button{display:block;width:100%;text-align:left;
  height:30px;padding:0 9px;border-radius:8px;font-size:13px;color:var(--t1);
  background:none;border:0;cursor:pointer}
#userPop .acts button:hover{background:var(--hover)}
/* 专注模式里 .rightgrp 整簇淡出，浮层不该单独留在屏上。 */
body.focus-mode #userPop{display:none!important}

/* 载入细条：地址栏没了，改贴标签条上缘。 */
.loadbar{position:absolute;left:0;right:0;top:0;height:2px;z-index:8;
  overflow:hidden;pointer-events:none}
.loadbar.on::after{
  content:"";display:block;height:100%;width:38%;background:var(--accent);
  animation:loadbar .55s ease-out;
}
@keyframes loadbar{from{transform:translateX(-120%)}to{transform:translateX(280%)}}

.htmlframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--win);display:none}
.pagebox{position:absolute;inset:0;overflow:auto;display:none;background:var(--win)}
.pane.html,.pane.pg{padding:0!important;overflow:hidden}
.pane.html .htmlframe{display:block}
.pane.html .md,.pane.html .ed,.pane.html .pagebox{display:none!important}
.pane.html .doc-layout{display:none}
/* iframe 是替换元素：绝对定位下 height:auto 会取它自带的 150px，bottom 直接被丢掉
   （CSS 2.1 §10.6.5），所以这里必须把高算死，不能靠 top ＋ bottom 撑。 */
.pane.html .htmlframe{top:var(--doc-toolbar-h);height:calc(100% - var(--doc-toolbar-h));bottom:auto}
.pane.pg .pagebox{display:block}
.pane.pg .md,.pane.pg .ed,.pane.pg .htmlframe{display:none!important}
.pane:not(.html) .htmlframe{display:none}
.pane:not(.pg) .pagebox{display:none}

/* ═══ 搜索结果页 ═══════════════════════════
   一行一条：图标 ｜ 标题 ｜「文件夹 · 命中片段」。命中的词照旧高亮。 */
.serp{max-width:720px;margin:0 auto;padding:32px 24px 80px}
.serp-q{font-size:10px;color:var(--t3);margin:0 0 4px;padding:0 12px 6px}
.search-row{
  width:100%;padding:12px;border-radius:10px;text-align:left;
  display:flex;gap:12px;align-items:center;
}
.search-row:hover{background:var(--hover)}
/* 键盘选中的那一条：按设计稿落在画布灰上，跟鼠标划过区分得开。 */
.search-row.on{background:var(--canvas)}
.search-row>.ico{color:var(--t3);flex:none;display:flex;align-items:center}
.search-row>.ico svg{width:17px;height:17px}
.search-row .search-info{flex:1;min-width:0}
.search-row strong{
  display:block;font-size:12px;font-weight:530;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.search-row small{
  display:block;color:var(--t3);margin-top:3px;font-size:10px;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.search-row .kind{
  font-size:9px;font-weight:600;letter-spacing:.04em;color:var(--t3);
  padding:2px 5px;border-radius:5px;background:var(--field);flex:none;
}
.search-row .enter{color:var(--t3);font-size:12px;flex:none}
.vacant{padding:80px 28px;text-align:center;color:var(--t3)}
.vacant h2{margin:0 0 8px;font-size:18px;font-weight:600;color:var(--t2)}
.vacant p{margin:0;font-size:13px;line-height:1.6}
/* 键帽：描边不填色。填色的那版在深色下会烧出一块亮斑。 */
kbd{
  font:10px/1.6 var(--ui);font-weight:500;white-space:nowrap;
  color:var(--t3);background:none;
  border:1px solid var(--rule-row);border-radius:5px;padding:0 5px;
}
/* ═══ 开始页 / 文件夹页 / 已收藏页 ═══════════
   三种页面共用同一条主干：问候 → 笔记本条 → 文件夹芯片 → 续读大卡 → 分区标题
   → 目录式列表。
   5.10 起末尾那一段不再是浮起来的卡片网格，是一行行的目录：行不投影、不描边、
   按下去也不位移，指针压上来才铺一层 --hover 的淡底，松开就没了。整屏还靠
   --el-* 三层阴影浮起来的只剩续读大卡和问候行那两枚按钮——一屏里浮的东西越少，
   浮着的那一件才越像「从这儿接着读」。
   5.4 起底色是纯白 --win，一条描边都不画；--canvas 只留给引用块、代码块和
   内凹控件。 */
.home{max-width:1050px;margin:0 auto;padding:32px 38px 40px}
.home-greeting{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
.greet-who{display:flex;align-items:center;gap:14px;min-width:0}
.eyebrow{color:var(--t2);font-size:11px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.eyebrow svg{width:13px;height:13px}
/* 服务状态：这枚点＋一句话就是原来底部状态栏那一格。绿＝就绪，琥珀＝扫描中，灰＝服务没起。
   5.8 起它常驻开始页大标题的行尾，跟「· ● 工作」同一副打扮（.58em / 400 / --t3）；
   就绪态由下面那条 CSS 藏起来，只有琥珀和灰才现身。占位一直在，所以状态来去不顶动页面。 */
.scan{display:inline-flex;align-items:center;gap:6px;color:var(--t3)}
.scan i{width:5px;height:5px;border-radius:50%;background:var(--dot);flex:none;display:block;
  transition:background-color var(--d-base) ease}
.scan.scan-busy i{background:var(--folder)}
.scan.scan-off i{background:var(--t4)}
.home h1{font-weight:570;font-size:29px;letter-spacing:.02em;line-height:1.2;margin:0}
.home h1 .scan{font-size:.58em;font-weight:400;margin-left:.6em;vertical-align:middle;letter-spacing:0}
.home h1 .scan:not(.scan-busy):not(.scan-off){display:none}
.home-sub{color:var(--t3);margin:7px 0 0;font-size:12px}
/* 次级按钮：白底一层极淡的渐变 ＋ 顶部高光，不描边（§5 悬浮质感） */
.hbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:none;
  height:30px;border-radius:9px;padding:0 13px;font-size:13px;font-weight:500;white-space:nowrap;
  background:linear-gradient(#fff,#fafbfc);color:var(--t1);border:0;
  box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out);
}
.hbtn svg{width:15px;height:15px;color:var(--t2)}
.hbtn:hover{transform:translateY(-1px);box-shadow:var(--el-2),var(--hi)}
.hbtn:active:not([disabled]){transform:translateY(0);box-shadow:var(--el-1)}
:root[data-theme="dark"] .hbtn{background:linear-gradient(#323843,#2c313a)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hbtn{
  background:linear-gradient(#323843,#2c313a)}}
/* 首屏那颗是全页第一动作，紧挨 29px 标题，比通用次级按钮再大一档 */
/* 5.9：这一颗走纯圆角胶囊（.hbtn 基类和别处的按钮不动） */
.hbtn.hero-new{height:34px;padding:0 16px;border-radius:999px;font-size:14px}
.hbtn.hero-new svg{width:16px;height:16px}
/* 主按钮：淡紫底板 ＋ 强调色字，同样不描边 */
.hbtn.key{background:var(--accent-soft);color:var(--accent)}
.hbtn.key svg{color:var(--accent)}

/* ── 继续阅读大卡 ───────────────────────── */
.resume{
  width:100%;text-align:left;padding:22px 26px;min-height:150px;
  border:1px solid transparent;border-radius:var(--r-lg);background:var(--card-face);
  box-shadow:var(--el-1);position:relative;overflow:hidden;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  transition:transform var(--d-base) var(--ease-out),box-shadow var(--d-base) var(--ease-out);
}
/* 左上→右下一层极淡的强调色，让大卡在纯白页面上成为视觉中心 */
.resume::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(132deg,var(--accent-soft) 0%,transparent 62%);opacity:.85}
.resume > *{position:relative;z-index:1}
/* 5.9：跟新卡片一样只升阴影、不位移——页面上只剩一种悬停语言。 */
.resume:hover{box-shadow:var(--el-3);
  transition:box-shadow var(--d-slow) var(--ease-out)}
.resume:active:not([disabled]){transform:translateY(0) scale(.995);transition-duration:80ms}
.resume .rs-text{min-width:0;flex:1}
.resume .overline{font-size:10px;color:var(--t3);display:flex;align-items:center;gap:6px;
  margin-bottom:9px;letter-spacing:.03em}
.resume .overline svg{width:12px;height:12px}
.resume h2{font-size:20px;font-weight:570;margin:0 0 7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .excerpt{font-size:12px;color:var(--t2);max-width:550px;margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-bottom{display:flex;align-items:center;gap:15px;color:var(--t3);font-size:10px;margin-top:15px}
.resume .continue{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:11px;flex:none}
.resume .continue svg{width:13px;height:13px;transition:transform var(--d-base) var(--ease-out)}
.resume:hover .continue svg{transform:translateX(3px)}

/* 右边那三张叠着的纸，纯 CSS 画的。右下角那枚是应用图标，像一张贴纸压在纸角上
   （2.5px 卡片色描边＝贴纸的白边），反着纸叠转 7° 摆正。深色下换成一套暗纸。 */
.paper-art{width:137px;height:108px;position:relative;margin-right:21px;flex:none;transform:rotate(-7deg)}
.paper-art::before,.paper-art::after,.paper-front{
  content:'';position:absolute;width:83px;height:106px;top:1px;left:31px;
  border:1px solid var(--paper-edge);border-radius:7px;background:var(--paper1);
  box-shadow:0 10px 23px var(--paper-shadow);
}
.paper-art::before{transform:rotate(15deg);background:var(--paper2);left:42px}
.paper-art::after{transform:rotate(6deg);background:var(--paper3);left:35px}
.paper-front{z-index:1;padding:18px 13px}
.paper-front b{display:block;width:24px;height:4px;background:var(--paper-b);margin-bottom:12px;border-radius:4px}
.paper-front i{display:block;height:2px;background:var(--paper-line);margin:7px 0;border-radius:2px}
.paper-front i:last-child{width:65%}
.paper-mark{
  position:absolute;display:block;width:30px;height:30px;bottom:-6px;right:10px;z-index:2;
  border:2.5px solid var(--card-face);border-radius:8px;
  box-shadow:0 2px 6px rgba(58,48,80,.18);
  transform:rotate(7deg);pointer-events:none;-webkit-user-drag:none;
  transition:transform var(--d-slow) var(--ease-out);
}
.resume:hover .paper-mark{transform:rotate(7deg) translateY(-3px) scale(1.08)}

/* ── 文件夹芯片行 ───────────────────────
   开始页拿它替掉了书签栏（顶层文件夹 ＋ 已收藏），文件夹页拿它列子文件夹。
   不描边：静态是 --field 的浅底块，鼠标进来才浮起来变成一枚白片。 */
.dirchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 1px 20px}
/* 5.7：笔记本条（.nbchip）跟文件夹芯片是同一套外形，共有的几行写在一起，
   差异（色点、选中态、找不到态）在文件末尾那一段里。 */
.dirchip,.nbchip{
  display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 13px;
  border-radius:999px;background:var(--field);border:1px solid transparent;
  color:var(--t2);font-size:11.5px;
  transition:background-color var(--d-base) ease,color var(--d-base) ease,
             box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out);
}
.dirchip:hover,.nbchip:hover{background:var(--card-face);color:var(--t1);
  box-shadow:var(--el-1);transform:translateY(-1px)}
.dirchip:active:not([disabled]),.nbchip:active:not([disabled]){transform:translateY(0);box-shadow:none}
.dirchip svg{width:13px;height:13px;color:var(--bm-ico);flex:none}
.dirchip.fav svg{color:var(--pin)}
.dirchip .n{color:var(--t3);font-size:10px}
/* 行尾那枚「收起」／收起后那枚「N 个文件夹 ›」：安静的文字按钮，
   不占底色也不描边，跟芯片同高所以两者天然对齐。 */
.chipfold{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px;
  color:var(--t4);font-size:11.5px;transition:color var(--d-base) ease}
.chipfold:hover{color:var(--t3)}
.chipfold svg{flex:none;color:currentColor}
.chipfold .ar{font-size:12.5px;line-height:1;margin-left:-1px}

/* ── 分区标题：计数 + 类型筛选 ── */
.section-head{display:flex;align-items:center;gap:15px;margin:20px 1px 9px}
.section-head h2{font-size:13px;font-weight:570;margin:0}
.section-head .section-meta{font-size:10px;color:var(--t3)}
.section-head .fill{flex:1}
/* 纯圆角胶囊。设置页那套 .setting .filters 和 .seg 还是方角小圆（要统一是
   一行的事），这里只管首页/文件夹页/已收藏页的段头。 */
.filters{display:flex;gap:3px;background:var(--seg-track);padding:3px;border-radius:999px;flex:none}
.filters button{font-size:10px;border-radius:999px;color:var(--t2);padding:4px 9px;
  transition:background-color var(--d-base) var(--ease-out),color var(--d-base) ease,
             box-shadow var(--d-base) var(--ease-out)}
.filters button:hover{color:var(--t1)}
.filters button.on{background:var(--segon);color:var(--t1);box-shadow:var(--segshadow)}

/* ── 目录式列表 ───────────────────────────
   5.10：首页「最近打开」、已收藏页、文件夹页从三列卡片网格换成一行一篇的目录
   （brief §1）。一行 ＝ 文件徽标｜标题 ···· 日期｜副行：无分割线、无卡片、无类型
   芯片、无星标 —— 目录的安静全靠留白。类型「标」在左边那枚 40px 的珍珠玻璃徽标上
   （5.12：md 一枚、html 一枚，见下一段），笔记本是日期左边一枚 6px 色点
   （单库一枚都没有）。
   5.11：整列字号收一档（标题 15→14、副行与日期 13→12），加上缩略图从 60 收到
   34，行高跟着从 72 落到 52 —— 一屏多放四行。
   5.12：字号一个不动（还是 5.11 那一档），只把行盒放回 72、徽标 34→40。为什么
   放宽：珍珠是一枚有厚度的物件，52 的行盒把它夹在上下两行字中间，投影直接压在
   副行的字上，玻璃上唇那道高光也没地方透气；40 的珍珠要 72 的行盒才站得住。
   代价是一屏（1280×820，问候＋笔记本条＋续读卡＋段头先占掉 330）从 9 行落到
   6 行半 —— 用户在画布「行距四档」页比过 52/64/72/80，拍的这一档。
   行高由文字列决定：
   72 ＝ 20（标题行）＋ 6（副行上边距）＋ 18（副行 12px × 1.5）＋ 14×2（上下内边距）。
   兼容线：build_app.py MIN_MACOS = "12.0"（Safari 15），所以这一段
   **不用 color-mix、不用容器查询、不用 content-visibility**——透明色一律写死
   rgba（浅深各一份，靠 :root 里 --fi-shadow 那两支切换）。 */
.notelist{display:block;margin:0 -12px}
.nrow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:14px 12px;border-radius:12px;
  transition:background-color var(--d-fast) ease}
/* 悬停只铺淡底：无 transform、无位移、无阴影变化（5.9 决策，全页一种悬停语言） */
.nrow:hover{background:var(--hover)}
/* 按下去也不缩。全局那条 button:active{transform:scale(.98)} 是给按钮尺度的控件写的，
   一整条 72px 的行跟着缩是另一回事（5.9 的卡片专门压过同一条，卡片退役时一起没了）。
   一行只做一件事：铺底。 */
.nrow:active:not([disabled]){transform:none}

/* ── 文件徽标：40×40 的珍珠玻璃，md 一枚、html 一枚 ──
   5.12：5.11 那枚 34px 的字符徽标（CSS 画的圆角方块 ＋ 一枚描边 M↓ / </>）退役，
   换成两张 PNG。**为什么是图片不是 SVG**：这一版玻璃立得住，靠的是边缘那圈折射
   高光、块体里的漫射内发光，和字形从玻璃面上挤出来的那层厚度——三样都是渲染
   出来的光学，描边画不出来。图是 codex 出的渲染原件，我们不复刻不重画
   （契约 §0 用户原话：「你直接用他原版的，不要复刻」）。
   **唯一动过原件的地方是白底**：原图 colortype 2（RGB 无 alpha），底是纯白，直接
   贴进列表有两处露馅——悬停时行底是 --hover #f2f4f7，深色主题下页面是 #252931，
   两种情况下都会看见一个白方块。（codex 自己那份 demo 拿 mix-blend-mode:multiply
   绕过去，那招只在浅底上成立，深色下整张图会被压黑。）所以把白底抠掉补上 alpha，
   预乘后缩到 192×192 RGBA；抠图脚本留底在
   _工作区/20260915_首页重设计_v1/assets/cut_white.py。
   **原图烘进去的那层投影也一并去掉**，改由 --fi-shadow 画，:root 里浅深各一支
   —— 位图投影换不了主题，烘在图里深色下就是一摊看不见的紫灰。
   192 是 4x 余量（列表最大用到 40），只留这一档，不再出 96。图走
   /file-md.png、/file-html.png 两条独立 HTTP 响应，不进 template：静态路由是
   硬编码白名单（portal_server 的 ALIAS）、打包也是硬编码清单（build_app 的
   RESOURCE_FILES），两处各加了一行，少一行就 404 或者构建期炸。
   类名 .fpearl 不叫 .fico、不叫 .md：前者被设置页「当前笔记库」那张卡占着
   （那枚 44px 的 folderMark 格子），后者是阅读态正文的根类，上面那条
   `.pane.pg .md{display:none!important}` 会把列表里每一枚 md 徽标整个藏掉
   （首页 / 收藏页 / 文件夹页全是 .pane.pg）—— 5.11 那枚字符徽标的类名当年也是
   这么绕出来的，这一轮换了图，绕法照旧。 */
.nthumb{flex:none;display:flex;align-items:center;justify-content:center;
  width:40px;height:40px}
/* display:block —— <img> 默认是 inline，行盒会在图底下留一条基线下沉的空隙，
   40 的格子里就装不下 40 的图（底边被顶出去 3~4px）。
   尺寸写 100% 不写死 40：格子多大珍珠多大，尺寸只由上面 .nthumb 一处说了算，
   断点那一档因此只改一个数——沿用 5.11 定下的口径。 */
.nthumb .fpearl{display:block;width:100%;height:100%;filter:var(--fi-shadow)}

/* ── 标题行：标题 ··········· ● 日期 ──
   align-items:flex-end —— 标题、点线、日期共用 20px 行高，末行底缘对齐。
   .ntitle 的 max-width:72% 只拦「几乎占满整行」的标题：更小的封顶会出现
   「右边明明一大截空白，标题却被砍掉」的误会。
   5.11 收一档：15 → 14，行盒 22 → 20。不再往下收到目录档（13px）——用户库里
   二十字以上的中文长标题很多，13 上去就偏小了。 */
.nmain{flex:1;min-width:0}
.ntop{display:flex;align-items:flex-end;gap:10px}
.ntitle{font-size:14px;font-weight:500;line-height:20px;color:var(--t1);
  flex:0 1 auto;min-width:0;max-width:72%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ✦ 署名（5.6）：这一篇最近一次是本机某个 AI 助手改的。颜色借强调色
   （深浅两支已经各自定义过），不新开颜色。续读大卡的底行也用这一条。 */
.agentmark{color:var(--accent);font-weight:500;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 列表行里的那一枚：跟卡片页脚那枚同一个判断条件、同一个字形，只换尺寸和位置
   ——贴在标题后面 4px（.ntop 的 gap 是 10，所以自己收回 6），在点线之前，
   不进副行。margin-bottom:-2px 是量出来的：11px 的字与 14px 的标题盒底齐时
   基线差 2px（算出来是 (14-11)/2＝1.5，字体的升降部再补半格），跟右边 .nmeta
   的 -1px 是同一笔账 —— 5.11 两边各收 1px，这两个补正的口径不变。
   名字长了自己打省略号，不挤标题。 */
.ntop .agentmark{flex:0 1 auto;min-width:0;max-width:26%;
  margin-left:-6px;margin-bottom:-2px;
  font-size:11px;line-height:20px}
/* 点线。min-width 32 —— 标题被截断时它也不会消失；
   margin-bottom 8.5 ＋ 自身 2px 高，把点的中线抬到标题基线上方 5px
   （量出来：20px 行高 14px 字，末行基线在行盒底上方约 4.7；8.5 ＋ 1 ＝ 9.5 ≈ 4.7 ＋ 5）。
   为什么不是 border-bottom:1.5px dotted：dotted 的点距被浏览器锁死成「点径 ＝
   间隙」，1.5px 下密得像一条发丝线，目录那种一粒一粒的感觉出不来。
   5.10 起用 repeating radial-gradient，点径和点距各自可调；Safari 15 认。
   5.12.1：1px / 6px 那档珠子偏大，标题右边一排抢视线。收到 0.6px / 5px
   （实心到 0.6，透明到 0.75，周期 5）——点大约六成，间隙几乎不动，
   线还在、不抢标题。2026-09-18 对照过三档，用户拍的这一档。 */
.nleader{flex:1 1 auto;min-width:32px;height:2px;margin-bottom:8.5px;
  background-image:radial-gradient(circle at center,
    var(--leader) .6px, rgba(0,0,0,0) .75px);
  background-size:5px 2px;background-repeat:repeat-x;background-position:left center}
/* margin-bottom:-1px —— flex-end 对齐的是盒底，12px 的日期和 14px 的标题
   盒底齐时基线差仍是 ~0.8px（5.11 两边各收 1px，差值没变），补回来，
   日期与标题才真的坐在同一条线上。 */
.nmeta{flex:none;display:flex;align-items:center;line-height:20px;font-size:12px;
  margin-bottom:-1px;color:var(--t3)}
/* 色点到日期的 7px：字收到 12 之后 8px 显宽，点像是落了单 */
.nmeta .nd{width:6px;height:6px;margin-right:7px}
/* min-width 60 —— 最长的一串「昨天 18:37」在 12px 下约 57px：够它右对齐钉住，
   又不至于在「刚刚」那种两字日期后面留一大截空 */
.nwhen{color:var(--t3);white-space:nowrap;display:inline-block;
  min-width:60px;text-align:right}
/* 日期写两份：.nmeta.wide 给宽屏（钉在最右），.nmeta.narrow 给 <700（跟到副行
   末尾）。用 display:none 切 —— 被藏起来的那份同时退出无障碍树。 */
.nmeta.narrow{display:none}

/* ── 副行：永远一行，灰字，省略号 ──
   来源：`预览` 的第一句 → 文件夹路径 → 笔记本名 → 库根。没有摘要时回落到
   文件夹路径用的是同一个 .ntx，一模一样的样式，不加图标不加前缀。 */
/* margin-top 6（5.12，原 4）：行盒放到 72 之后标题与副行之间也得跟着松半档，
   不然两行字挤在一起、行盒的空全落在上下内边距上，看着像两行字掉进了一个大格子。 */
.ndesc{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.ndesc .ntx{font-size:12px;line-height:1.5;color:var(--t3);min-width:0;flex:1 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 首次提示卡（只在全新的档案第一次进来时出一次）────── */
.tipcard{margin:0 0 20px;padding:15px 20px 16px;border:0;
  border-radius:var(--r-lg);background:var(--accent-soft)}
.tc-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.tc-head h3{font-size:12.5px;font-weight:600;color:var(--accent);margin:0;flex:1}
.tc-x{font-size:11px;color:var(--accent);opacity:.8;padding:4px 8px;border-radius:var(--r-xs);
  transition:background-color var(--d-fast) ease,opacity var(--d-fast) ease}
.tc-x:hover{opacity:1;background:var(--hl)}
.tc-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tc-col{display:flex;align-items:center;gap:10px;min-width:0}
.tc-ico{width:26px;height:26px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--card-face);color:var(--accent);box-shadow:var(--el-1)}
.tc-ico svg{width:14px;height:14px}
.tc-col p{margin:0;font-size:11.5px;color:var(--t2);line-height:1.5}
.tc-col kbd{color:var(--t2);border-color:var(--hl);margin-right:2px}

/* ── 空态 / 底部提示 ────────────────────── */
.empty{padding:60px 20px;text-align:center;color:var(--t2)}
/* 空库那一版占满问候区以下的整片空白并居中，别缩在上半页留一大块无主的白 */
.empty.big{min-height:56vh;padding:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.empty-mark{width:76px;height:76px;border-radius:50%;background:var(--canvas);
  color:var(--t3);margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.empty-mark svg{width:30px;height:30px}
.empty h2{font-size:17px;font-weight:550;color:var(--t1);margin:0 0 8px}
.empty p{font-size:12px;margin:0 0 22px;line-height:1.8;color:var(--t3)}
.empty-btns{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.home-tip{display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:10px;color:var(--t4);margin:22px 0 0}
.home-tip svg{width:13px;height:13px}
.home-tip kbd{color:var(--t4)}
/* 「最近打开」最多画 12 张，剩下的从这条进库根接着翻 */
.see-all{display:flex;align-items:center;gap:7px;margin:14px 0 0;padding:9px 14px;
  border-radius:9px;background:var(--field);color:var(--t2);font-size:11px;
  transition:background-color var(--d-base) ease,color var(--d-base) ease}
.see-all:hover{background:var(--hover);color:var(--t1)}
.see-all svg{width:14px;height:14px}

@media (max-width:900px){
  .home{padding:30px 26px 40px}
  .home h1{font-size:25px}
  .home-greeting{margin-bottom:21px}
  .paper-art{margin-right:0;width:110px}
  .resume .excerpt{max-width:390px}
}
/* <700：文件徽标收到 34、日期挪到副行末尾右对齐、点线隐藏（brief §1.4）。
   日期在两处各写一份 markup，用 display:none 切——被 display:none 的那份
   同时从无障碍树里消失，不必再挂 aria-hidden。 */
@media (max-width:700px){
  .home{padding:24px 18px 40px}
  .home h1{font-size:23px}
  .uchip{width:32px;height:32px;font-size:13px}
  .greet-who{gap:10px}
  .paper-art{display:none}
  .home-greeting .hbtn .lbl{display:none}
  .tc-cols{grid-template-columns:minmax(0,1fr);gap:10px}
  .section-head .section-meta{display:none}
  .notelist{margin:0 -10px}
  .nrow{gap:12px;padding:12px 10px}
  /* 5.12：珍珠跟着宽屏一起放一档，34（原 28）。行高 65 ＝ 20（标题行：13px 的字
     仍按基类那 20 的行盒排，这一档只改字号）＋ 3（副行上边距，下面那条没跟着
     放宽 —— 窄屏上下留白本来就紧）＋ 18（副行 12×1.5）＋ 12×2（上下内边距）
     —— 比宽屏那档矮 7px，34 的珍珠在 65 的行盒里跟 40 的在 72 里是同一个松紧。
     只写一个数：珍珠的尺寸由 .nthumb 的格子说了算（图是 100%），
     圆角与字形尺寸随 5.11 那枚字符徽标一起退役了。 */
  .nthumb{width:34px;height:34px}
  /* 窄屏标题再收一档到 13：这里没有右边那一列日期抢位，13 读起来不憋屈 */
  .ntitle{font-size:13px;max-width:none}
  .nleader{display:none}
  .nwhen{min-width:0}
  .nmeta.wide{display:none}
  /* 日期跟到副行末尾，比副行再小一档，它是这一行里最次要的一件事 */
  .nmeta.narrow{display:flex;font-size:11px;line-height:1.5;padding-left:10px}
  .ndesc{margin-top:3px}
  .ndesc .ntx{font-size:12px}
}

/* ═══ 5.14 待办汇总 ═══════════════════════════
   数值照设计稿（_工作区/20261001_编辑器两处bug与待办评审_v1/todo/parts/td.css），只用 token。
   类名一律 todo- 前缀：任务行不能借 .ntitle / .nleader——≤700 时前者放开封顶、后者整个藏掉，
   而任务行在窄窗里还是一行，点线和笔记名留在原处（README 第 4 条）。

   ── 开始页那一行：整套就是 .nrow（≤700 跟列表行一起收），只补三处 ──
   上边距 8：卡底到字顶 8＋14＝22，跟段头到第一行字顶的 9＋14 同一档。没有续读卡时上面是
   .dirchips / .tipcard（自带下边距 20）或 .nbchips（12）：外边距会折叠，负的那一截把间距
   收回到同样的 8。下面到「最近打开」照旧是段头自带的 20。 */
.notelist.todo-door{margin-top:8px}
.dirchips+.todo-door,.tipcard+.todo-door{margin-top:-12px}
.nbchips+.todo-door{margin-top:-4px}
.todo-mark{color:var(--t3)}                 /* 记号：线条图标、点不了、不铺底、不投影 */
.todo-mark svg{display:block}
.todo-go{color:var(--accent)}               /* 「查看」：字号跟 .nmeta 走（12，窄窗 11） */

/* ── 待办页 ──
   段头没有右边那枚「全部 / Markdown / HTML」（任务只在 md 里），用 min-height 补回它撑出来
   的 29，跟已收藏页的段头落在同一条线上。 */
.todo-head{min-height:29px}
/* 一行 40 ＝ 20（字）＋ 10×2。内边距、圆角同搜索结果行 .res（10/12、--r-md）。 */
.todo-list{margin:0 -12px}
.todo-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);
  transition:background-color var(--d-fast) ease}
.todo-row:hover{background:var(--hover)}
/* 原生框，跟阅读页 .md li.task input 同一条：accent-color、指针（那条写在 .md 底下，
   页面类标签里 .md 整个藏着，只能照抄一份） */
.todo-row input{flex:none;margin:0;accent-color:var(--accent);cursor:pointer}
/* 文字 · 点线 · 笔记名：同 .ntop 的排法（flex-end 底对齐、gap 10、点线抬到基线上方） */
.todo-line{flex:1 1 auto;min-width:0;display:flex;align-items:flex-end;gap:10px}
.todo-tx{display:block;flex:0 1 auto;min-width:0;max-width:72%;text-align:left;
  font-size:14px;font-weight:400;line-height:20px;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-tx:active:not([disabled]){transform:none}
.todo-leader{flex:1 1 auto;min-width:32px;height:2px;margin-bottom:8.5px;
  background-image:radial-gradient(circle at center, var(--leader) .6px, rgba(0,0,0,0) .75px);
  background-size:5px 2px;background-repeat:repeat-x;background-position:left center}
.todo-src{flex:none;max-width:40%;display:flex;align-items:center;min-width:0;
  font-size:12px;line-height:20px;margin-bottom:-1px;color:var(--t3);white-space:nowrap}
.todo-src .nd{margin-right:7px}
.todo-nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 刚勾掉：同阅读页 input:checked+span（--t3 ＋ 删除线），行留在原位，离开这一页才消失 */
.todo-row.done .todo-tx{color:var(--t3);text-decoration:line-through}
/* 「更早的笔记 ›」：落在段头的位置、跟段头同字号（13），字重收到 500、颜色退到 --t2——
   它是一节折起来的东西，不跟「最近 7 天」抢。箭头同关联面板的文件夹树（chevron-right，
   展开换 chevron-down）；悬停字和箭头一起回到 --t1。 */
.todo-fold{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--t2);
  transition:color var(--d-fast) ease}
.todo-fold svg{color:var(--t3);flex:none;transition:color var(--d-fast) ease}
.todo-fold:active:not([disabled]){transform:none}
.todo-fold:hover,.todo-fold:hover svg{color:var(--t1)}
@media (max-width:700px){
  .todo-list{margin:0 -10px}
  .todo-row{padding:10px}
  .todo-tx{font-size:13px}
}

/* 分隔条：不画线，只留一条看不见的拖动区 */
.split{position:relative;z-index:5;width:0;cursor:col-resize}
.split::after{content:"";position:absolute;inset:0 -3px}

/* 搜索结果 */
.res{padding:10px 12px;margin:0 -12px;border-radius:10px;cursor:default;
  transition:background-color .15s ease}
.res:hover{background:var(--hover)}
.res.sel{background:var(--sel);box-shadow:var(--selshadow)}
.res .rt{display:flex;align-items:center;gap:8px;min-width:0}
.res .rt .t{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.res .rp{font-size:11px;color:var(--t4);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rx{font-size:12px;color:var(--t3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 命中词：加粗 ＋ 强调色下划线，不铺底色 */
.hit{
  font-weight:600;font-style:normal;
  text-decoration:underline;
  text-decoration-color:var(--accent);
  text-decoration-thickness:2px;
  text-underline-offset:3px;
}

/* 行上的次要动作：hover 才出，其余进右键 */
.racts{display:flex;gap:2px;align-items:center;flex-shrink:0;opacity:0;
  transition:opacity .15s ease}
.lrow:hover .racts,.res:hover .racts,.racts:focus-within{opacity:1}
.iba{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:7px;color:var(--t3);
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,
             transform var(--d-fast) var(--ease-out)}
.iba:hover{background:var(--hover);color:var(--t1)}
.iba:active:not([disabled]){transform:scale(.96)}
.iba svg{width:15px;height:15px;stroke-width:1.5}

/* ═══ 边栏 ═══════════════════════════════
   只在列表栏那一态里露过面，5.4.1 起不再上屏（buildNav 还在往里写，
   底下那些 .nav / .livedot 的样式跟着留下）。 */
#side,.split{display:none}
#side{grid-area:side;background:var(--side);padding:18px 10px 14px;
  flex-direction:column;overflow:hidden auto;min-width:0}
.nav{
  height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:10px;
  width:100%;text-align:left;font-size:12px;color:var(--t2);
  transition:background-color .15s ease;
}
.nav svg{width:16px;height:16px;flex:none;color:var(--t2);stroke-width:1.5}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);box-shadow:var(--selshadow);color:var(--t1)}
.nav.sub{color:var(--t2)}
.nav .n{font-size:11px;color:var(--t4);flex:none;font-variant-numeric:tabular-nums}
.nav.deep{padding-left:34px}
.grouplab{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;padding:0 10px;margin:22px 0 9px}
.spacer{flex:1;min-height:12px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--dot);margin-left:auto;flex:none;
  transition:transform .25s ease,background-color .15s ease}
.livedot.off{background:var(--t3)}
.livedot.hit{transform:scale(1.7)}
#stat.hide{display:none}

/* ═══ 条目行 ═══════════════════════════════
   列表栏下线之后这些只画在离屏的 #out 里：选中、快看、搜索回车
   都还认这批 [data-seq] 节点，样式跟着留下。 */
.kindtag{font-size:10px;font-weight:500;letter-spacing:.02em;color:var(--t4);flex:none}
.kindempty{padding:28px 16px;text-align:center;font-size:12px;color:var(--t4)}
.lgroup{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;padding:0 20px;margin:18px 0 8px}
.lrow{
  min-height:43px;margin:0 8px;padding:10px 12px;border-radius:10px;cursor:default;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  transition:background-color .15s ease;
}
.lrow .top{display:flex;align-items:center;gap:12px;width:100%;min-width:0}
.lrow .t{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{font-size:11px;color:var(--t4);flex:none}
.lrow .ex{font-size:12px;color:var(--t3);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--sel);box-shadow:var(--selshadow)}

/* ═══ 正文栏 ═══════════════════════════════ */
#docpane{grid-area:doc;position:relative;background:var(--win);overflow:hidden;min-width:0}

/* 老的编辑状态字。保存状态挪到笔记页顶栏的 pill 上，这一格留着不显示，
   syncStatusLine 仍往里写，别的地方还有引用。 */
.editstatus{display:none}

/* 标签栏底料：撞车标题保住尾巴；装不下的进 ▾，不横滑。闲置的 × 只在悬停时露。
   外形（凹角、竖线）由 #tabstrip .tab 覆盖。 */
.tabbar{position:absolute;top:0;left:0;right:0;z-index:5;
  display:none;align-items:center;gap:4px;padding:44px 16px 6px;overflow:hidden;
  background:var(--win)}
.tabbar.on{display:flex}
.tab{position:relative;display:flex;align-items:center;gap:6px;height:26px;
  padding:0 8px 0 10px;border-radius:7px;font-size:12px;color:var(--t2);cursor:default;
  white-space:nowrap;overflow:hidden;min-width:72px;max-width:220px;
  flex:1 1 108px;transition:background-color .15s ease}
.tabbar .tab[hidden]{display:none!important}
.tab:hover{background:var(--hover)}
.tab.on{flex:2.1 1 240px;min-width:120px;max-width:380px;padding-right:6px;
  background:var(--sel);box-shadow:var(--selshadow);color:var(--t1);font-weight:500}
.tab .tt{display:flex;min-width:0;overflow:hidden;flex:1}
.tab .tt.plain{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tt .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.tab .tt .e{flex:none;white-space:nowrap}
.tab .tx{width:16px;height:16px;border-radius:8px;flex:none;color:var(--t3);
  display:none;align-items:center;justify-content:center}
.tab.on .tx{display:flex}
.tab:hover:not(.on) .tx{display:flex;position:absolute;right:4px;top:5px;
  background:var(--hover);color:var(--t2)}
.tab .tx:hover{background:var(--hover);color:var(--t1)}
.tab.on .tx:hover{background:var(--hover)}
.tab .tx svg{width:11px;height:11px;stroke-width:1.6}
.tab .ddot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--t4);display:none}
.tab.dirty:not(.on):not(:hover) .ddot{display:block}
.tabmore{flex:none;height:26px;min-width:34px;padding:0 8px;border-radius:7px;
  display:none;align-items:center;justify-content:center;gap:3px;
  color:var(--t2);font-size:11px;font-weight:560}
.tabbar.has-more .tabmore{display:flex}
.tabmore:hover,.tabmore.open{background:var(--hover);color:var(--t1)}
.tabmore svg{flex:none}
#tabpick{position:fixed;z-index:90;display:none;min-width:240px;max-width:360px;
  max-height:min(52vh,420px);overflow-y:auto;padding:6px;
  background:var(--card-face);border:0;border-radius:12px;
  box-shadow:var(--el-3);animation:arrive .16s ease-out}
#tabpick.on{display:block}
#tabpick .tprow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px}
#tabpick .tprow:hover{background:var(--hover)}
#tabpick .nm{flex:1;min-width:0}
#tabpick .a{display:block;font-size:13px;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabpick .b{display:block;font-size:11px;color:var(--t4);margin-top:1px}
#tabpick .x{width:18px;height:18px;border-radius:9px;flex:none;color:var(--t4);
  display:flex;align-items:center;justify-content:center}
#tabpick .x:hover{background:var(--hover);color:var(--t1)}

#panes{position:absolute;inset:0}
.pane{position:absolute;inset:0;overflow-y:auto;padding:0;display:none}
.pane.on{display:block}
.pane .ed{display:none}
.pane.edit .md{outline:none}

/* ═══ 笔记页：顶栏 ＋ 版心 ═══════════════
   顶栏贴在正文栏顶上（sticky），左边面包屑，右边按钮组。阅读态是「专注 / 更多 /
   编辑」，编辑态换成「保存状态 / 源码 / 完成」。毛玻璃底色让正文从下面透一点过去。 */
.doc-toolbar{
  position:sticky;top:0;z-index:8;
  height:var(--doc-toolbar-h);flex:none;padding:0 22px;
  display:flex;align-items:center;gap:6px;
  border-bottom:0;
  background:var(--win-blur);
  box-shadow:0 4px 12px rgba(58,48,80,.04);
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
  transition:transform var(--d-slow) var(--ease-out),opacity var(--d-slow) var(--ease-out),
             box-shadow var(--d-base) ease;
}
.pane.pg .doc-toolbar,.pane.pg .doc-layout{display:none!important}
/* solo 窗只有一份正文，本来就没有标签条和工具条，阅读时顶栏也不出现。
   但编辑时得留一条——没有它就既看不到存没存上，也没地方点「完成」。
   面包屑、专注、更多在这种窗里没用，收起来，只剩保存状态和收工那两颗。 */
body.solo .doc-toolbar{display:none}
body.solo .pane.edit .doc-toolbar{display:flex;justify-content:flex-end}
body.solo .pane.edit .doc-toolbar .pathchip,
body.solo .pane.edit .doc-toolbar .dt-actions,
body.solo .pane.edit .doc-toolbar .dt-div,
body.solo .pane.edit .doc-toolbar [data-dt="focus"],
body.solo .pane.edit .doc-toolbar [data-dt="more"]{display:none}
body.solo .pane.html .htmlframe{top:0;height:100%}
/* ═══ 路径芯片 ═══════════════════════════
   「一件信息只出现一次」：路径只在这里。文件夹图标 ＋ › 分段 ＋ 尾部拷贝图标。
   放不下就从最左边起收成一枚 …，最后一段再交给 text-overflow。
   整枚芯片单击＝拷贝路径；⌘ 单击某个文件夹段仍是「在新标签打开那个文件夹」。 */
.pathchip{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  flex:0 1 auto;min-width:0;max-width:520px;
  height:30px;padding:0 9px;margin-left:2px;
  border-radius:var(--r-sm);background:transparent;color:var(--t2);font-size:12px;
  transition:background-color var(--d-base) ease;
}
.pathchip .fi{width:14px;height:14px;flex:none;color:var(--bm-ico);display:flex}
.pathchip .fi svg{width:14px;height:14px}
.pc-body{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden}
/* 段一律不缩——缩了的话 scrollWidth 恒等于 clientWidth，fitPathChip 量不出溢出，
   「从左边起收成 …」那一步就永远不会发生。收到只剩最后一段还嫌长时才加 .tight，
   放开最后那一段自己打省略号。 */
.pc-seg{flex:none;white-space:nowrap}
.pc-body.tight .pc-seg.now{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pc-seg.now{color:var(--t1)}
.pc-sep{flex:none;color:var(--t4)}
.pathchip .cp{position:relative;width:13px;height:13px;flex:none;color:var(--t4);
  margin-left:1px;transition:color var(--d-base) ease}
.pathchip:hover{background:var(--hover)}
.pathchip:hover .cp{color:var(--t2)}
/* 拷贝成功：芯片原地不动——宽度和那条路径全留着，只把尾部那枚拷贝图标换成
   --ok 色的对勾（160ms 缩放浮现），底色临时染 --accent-soft，1.2s 后还原。
   收成一句「✓ 已拷贝」的话宽度要跳一下，刚拷完的那条路径也跟着消失了。 */
.pathchip .cp > span{position:absolute;top:0;left:0;display:block;width:13px;height:13px}
.pathchip .cp .ic-copy{transition:opacity 90ms var(--ease-out)}
.pathchip .cp .ic-done{color:var(--ok);opacity:0;transform:scale(.6);
  transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
.pathchip.is-copied{background:var(--accent-soft)}
.pathchip.is-copied .cp .ic-copy{opacity:0}
.pathchip.is-copied .cp .ic-done{opacity:1;transform:scale(1)}

/* 自绘提示气泡：深底白字，正下方 6px，真鼠标停 500ms 才出（路径芯片快一点）。
   不用 title——原生气泡样子不受控，还会跟这一枚打架。 */
.has-tip{position:relative}
.tip{position:absolute;top:calc(100% + 6px);left:50%;transform:translate(-50%,-4px);
  background:var(--tip-bg);color:var(--tip-fg);
  font-size:11px;line-height:1.5;font-weight:400;text-align:center;
  padding:5px 9px;border-radius:var(--r-xs);white-space:nowrap;pointer-events:none;
  opacity:0;z-index:40;box-shadow:var(--el-2);
  transition:opacity var(--d-fast) var(--ease-out),transform var(--d-fast) var(--ease-out)}
.tip b{display:block;font-weight:400;font-size:10.5px;opacity:.7;
  max-width:340px;overflow:hidden;text-overflow:ellipsis}
.has-tip:hover > .tip{opacity:1;transform:translate(-50%,0);transition-delay:.5s}
.pathchip:hover > .tip{transition-delay:.18s}
/* 拷完那一下气泡先收掉——底下已经有 toast 了，两句话叠着看不清。
   排在 :hover 那条后面才压得住（同权重，后来居上）。 */
.pathchip.is-copied > .tip{opacity:0;transform:translate(-50%,-4px);transition-delay:0s}

.dt-fill{flex:1 1 auto;min-width:8px}
.dt-actions{display:flex;align-items:center;gap:2px;flex:none}
/* 唯一保留的短竖线：分组用，不是描边 */
.dt-div{width:1px;height:16px;background:var(--rule-row);flex:none;margin:0 7px}
.dt-tag{flex:none;font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--t2);
  background:var(--field);border-radius:5px;padding:4px 7px;white-space:nowrap}
.dt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;
  height:30px;padding:0 13px;border-radius:9px;font-size:12px;font-weight:500;color:var(--t1);
  background:linear-gradient(#fff,#fafbfc);border:0;box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
:root[data-theme="dark"] .dt-btn{background:linear-gradient(#323843,#2c313a)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dt-btn{
  background:linear-gradient(#323843,#2c313a)}}
.dt-btn:hover{transform:translateY(-1px);box-shadow:var(--el-2),var(--hi)}
.dt-btn:active:not([disabled]){transform:translateY(0);box-shadow:var(--el-1)}
.dt-btn.soft{background:var(--accent-soft);color:var(--accent)}
.dt-btn.soft:hover{background:var(--accent-soft)}
.dt-ico{display:inline-flex;align-items:center;justify-content:center;flex:none;
  position:relative;
  width:30px;height:30px;border-radius:7px;color:var(--t3);
  transition:background-color var(--d-fast) ease,color var(--d-fast) ease,
             transform var(--d-fast) var(--ease-out)}
.dt-ico:hover{background:var(--hover);color:var(--t1)}
.dt-ico:active:not([disabled]){transform:scale(.96)}
.dt-ico svg{width:16px;height:16px}
/* 收藏了：星星填实，用书签栏那一档金色 */
.dt-ico.pinned{color:var(--pin)}
.dt-ico.pinned svg{fill:currentColor}
.save-state{flex:none;font-size:10px;color:var(--ok);min-width:64px;text-align:right}
.save-state.pending{color:var(--t3)}
.save-state.act{color:var(--folder);cursor:pointer}

/* 版心：默认一栏，居中限宽。开了左侧大纲就不限宽了——版心撑满窗格，左右内边距
   各一份 --ol-inset，大纲于是贴着窗格左缘站定，窗口再宽也不往中间飘。
   栏还够宽的话再往右补一条等宽的空栏（ol-3）：左右两栏一样重，正文就落在正中，
   跟没大纲时是同一处；不够宽退回两栏，正文往右偏半个栏宽，先认了。
   够不够由 syncToc 里的 olWider() 算——看的是正文栏自己的宽，不是窗口宽，
   三栏模式下窗口没变、正文栏窄了一大截。 */
.doc-layout{display:grid;grid-template-columns:minmax(0,1fr);
  max-width:1020px;margin:0 auto;padding:38px 60px 120px}
.doc-layout.ol-on{grid-template-columns:var(--outline-w) minmax(0,1fr);
  max-width:none;padding-left:var(--ol-inset);padding-right:var(--ol-inset)}
.doc-layout.ol-on.ol-3{
  grid-template-columns:var(--outline-w) minmax(0,1fr) var(--outline-w)}
.pane.edit .doc-layout{padding-bottom:200px}
/* 不给 position：篇内目录、搜索命中定位都按 h.offsetTop 算，
   这一层一旦成了 offsetParent，那些偏移就全对不上了。 */
/* width:100% 一个字都不能少：.document 是 grid item，item 上的 auto 外边距
   会让它按 fit-content 定宽——正文于是塌成「最长的那一行」，
   阅读宽度那一栏调什么都不动。 */
.document{width:100%;max-width:var(--docw);margin:0 auto;min-width:0}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  font-size:10px;color:var(--t3);margin:0 0 16px;user-select:none;-webkit-user-select:none}
.doc-meta svg{width:12px;height:12px;flex:none}
.doc-meta:empty{display:none}
.doc-end{display:flex;align-items:center;gap:10px;margin-top:42px;
  color:var(--t3);font-size:10px;user-select:none;-webkit-user-select:none}
.doc-end:before,.doc-end:after{content:'';height:1px;background:var(--rule-row);flex:1}
.pane.edit .doc-end{display:none}
.editor-hint{display:none;font-size:10px;color:var(--t3);margin:22px 0 0}
.pane.edit .editor-hint{display:block}

/* 正文上方那条格式条：跟着正文滚，碰到顶栏就停住。 */
.formatbar{display:none;align-items:center;gap:3px;flex-wrap:wrap;
  position:sticky;top:58px;z-index:7;width:max-content;max-width:100%;
  margin:0 0 24px;padding:5px;border-radius:11px;
  background:var(--card-face);border:0;box-shadow:var(--el-2)}
.pane.edit:not(.src) .formatbar{display:flex}
.formatbar button{height:28px;min-width:30px;padding:0 8px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t2)}
.formatbar button:hover,.formatbar button.on{background:var(--accent-soft);color:var(--accent)}
.formatbar button svg{width:15px;height:15px}
.formatbar i{width:1px;height:15px;background:var(--rule-row);margin:0 3px;flex:none}

/* 整篇源码：一块等宽的框，不是整屏文本域。 */
.pane .ed{width:100%;margin:0;padding:15px;
  border:1px solid var(--rule-row);border-radius:10px;
  background:var(--win);color:var(--t1);resize:none;outline:none;
  font-family:var(--mono);font-size:13px;line-height:1.9;
  tab-size:2;min-height:350px;overflow:hidden}
.pane.edit.src .md{display:none}
.pane.edit.src .ed{display:block}

/* 篇内大纲：版心左边常驻一栏，跟着正文滚，读到哪一节亮哪一条，⌥⌘I 收放。
   栏窄了（三栏模式、小窗）左栏收起，改从顶栏那颗按钮弹 #outfloat 浮层，
   两处用的是同一套 .ol-* 类名和同一份 HTML。 */
.outline{display:none;flex-direction:column;min-width:0;
  padding-right:16px;align-self:start;             /* sticky 在 grid 里必须 start，不然占满整行没得贴 */
  position:sticky;top:62px;z-index:4;
  max-height:calc(100vh - var(--chrome-h) - var(--status-h) - var(--bnr-h, 0px) - 118px)}
.doc-layout.ol-on > .outline{display:flex}
.ol-head{display:flex;align-items:center;gap:6px;flex:none;padding:0 10px 6px}
.ol-t{font-size:12px;font-weight:550;color:var(--t3)}
.ol-n{font-size:11px;color:var(--t4)}
.ol-x{margin-left:auto;flex:none;width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--t3)}
.ol-x:hover{background:var(--hover);color:var(--t1)}
.ol-x svg{width:14px;height:14px}
/* 常驻栏那颗收起箭头平时不露，鼠标进栏或键盘聚焦才浮出来；浮层那颗 × 一直在。 */
.outline .ol-x{opacity:0;transition:opacity .14s ease}
.outline:hover .ol-x{opacity:1}
.outline .ol-x:focus-visible{opacity:1}   /* 单开一条：Safari 15.0 不认逗号组里的它 */
/* 条目自己滚。滚动条平时不露，鼠标进来才浮出一条细的。 */
.ol-list{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:transparent transparent}
.ol-list::-webkit-scrollbar{width:7px}
.ol-list::-webkit-scrollbar-track{background:transparent}
.ol-list::-webkit-scrollbar-thumb{background:transparent;border-radius:4px;
  border:2px solid transparent;background-clip:padding-box}
.outline:hover .ol-list,#outfloat:hover .ol-list{scrollbar-color:var(--rule-head) transparent}
.outline:hover .ol-list::-webkit-scrollbar-thumb,
#outfloat:hover .ol-list::-webkit-scrollbar-thumb{background:var(--rule-head);background-clip:padding-box}
.ol-i{display:block;position:relative;width:100%;text-align:left;
  font-size:13px;line-height:1.4;color:var(--t2);
  padding:4px 8px 4px 10px;border-radius:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background-color .14s ease,color .14s ease}
.ol-i.l1{font-weight:550;color:var(--t1)}
.ol-i.l2{padding-left:20px}
.ol-i.l3{padding-left:30px}
.ol-i.l4{padding-left:40px;color:var(--t3)}
.ol-i.l5{padding-left:50px;color:var(--t3)}
.ol-i.l6{padding-left:60px;color:var(--t3)}
.ol-i:hover{background:var(--hover);color:var(--t1)}
/* 当前节：不铺底色，左缘一道 2px 的强调色短杠 ＋ 强调色文字。杠永远贴条目左缘，
   不跟缩进走，读起来像一枚位置标记。 */
.ol-i.on{color:var(--accent)}
.ol-i.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2px;
  border-radius:1px;background:var(--accent)}
/* 顶栏那颗大纲按钮：栏宽够就是「收放左栏」，不够就是「弹浮层」。
   [hidden] 得自己写一条——UA 那条 display:none 压不过 .dt-ico 的 inline-flex。 */
.doc-toolbar .dt-ol[hidden]{display:none}
.doc-toolbar .dt-ol.on{background:var(--accent-soft);color:var(--accent)}
#outfloat{position:fixed;z-index:60;display:none;flex-direction:column;
  width:260px;max-height:60vh;padding:8px;
  background:var(--card-face);border:0;border-radius:var(--r-lg);
  box-shadow:var(--el-3);animation:arrive .16s ease-out}
#outfloat.on{display:flex}

/* ═══ 关联面板（5.8） ═════════════════════
   回答「这篇周围有什么」：所在文件夹那棵树、同一篇的别的版本、链到与被链。
   跟大纲共用左列：同宽（--outline-w）、同字号、同留白，一次只露一个。
   ST.rel 开着时大纲让位，ST.toc 一个字节不改，关掉关联大纲原样回来。
   默认关着，永不自动弹；关着的时候阅读页跟没有这一段时一模一样。 */
.relpanel{display:none;flex-direction:column;min-width:0;
  padding-right:16px;align-self:start;            /* sticky 在 grid 里必须 start，同 .outline */
  position:sticky;top:62px;z-index:4;
  max-height:calc(100vh - var(--chrome-h) - var(--status-h) - var(--bnr-h, 0px) - 118px)}
.doc-layout.rel-on{grid-template-columns:var(--outline-w) minmax(0,1fr);
  max-width:none;padding-left:var(--ol-inset);padding-right:var(--ol-inset)}
.doc-layout.rel-on.ol-3{
  grid-template-columns:var(--outline-w) minmax(0,1fr) var(--outline-w)}
.doc-layout.rel-on > .relpanel{display:flex}
/* 条目自己滚，滚动条平时不露、鼠标进栏才浮出来——跟 .ol-list 同一套。 */
.rel-list{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:transparent transparent}
.rel-list::-webkit-scrollbar{width:7px}
.rel-list::-webkit-scrollbar-track{background:transparent}
.rel-list::-webkit-scrollbar-thumb{background:transparent;border-radius:4px;
  border:2px solid transparent;background-clip:padding-box}
.relpanel:hover .rel-list{scrollbar-color:var(--rule-head) transparent}
.relpanel:hover .rel-list::-webkit-scrollbar-thumb{background:var(--rule-head);background-clip:padding-box}
.rel-sec + .rel-sec{margin-top:18px}
.rel-h{font-size:10px;color:var(--t3);letter-spacing:.03em;padding:0 8px 5px 10px}
/* 「链到 ／ 被链」是段里的小节，比段头再轻一档，跟前一组之间留一口气。 */
.rel-sh{color:var(--t4);padding-top:7px}
.rel-h + .rel-sh{padding-top:0}
.rel-i{display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  height:26px;padding:0 8px 0 10px;border-radius:6px;
  font-size:12px;color:var(--t2);
  transition:background-color .14s ease,color .14s ease}
.rel-i:hover{background:var(--hover);color:var(--t1)}
/* 当前这一篇：强调色字 ＋ 一层淡底，是「你在这儿」而不是「点我」。 */
.rel-i.on{background:var(--accent-soft);color:var(--accent)}
.rel-i i{width:12px;height:12px;flex:none;color:var(--t3);
  display:flex;align-items:center;justify-content:center}
.rel-i i svg{width:12px;height:12px}
.rel-i.on i{color:var(--accent)}
.rel-i .nd{width:7px;height:7px}
/* 名字分两段：头部会被省略号咬掉，尾巴（最后 7 个字符）永远露着。
   这个面板存在的理由就是分辨 v1 ／ v2 ／ 终版，尾部截断恰恰把版本号吃掉。
   纯 flex 做的中间省略，不用 JS 量宽度：头 flex:0 1 auto 可收缩，尾 flex:none 不收缩。 */
.rel-nm{display:flex;flex:1 1 auto;min-width:0;align-items:baseline}
.rel-nm .hd{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-nm .tl{flex:none;white-space:nowrap}
.rel-n,.rel-when{flex:none;font-size:10px;color:var(--t4);margin-left:4px}
.rel-fdr{flex:0 1 auto;min-width:0;max-width:45%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--t4)}
.rel-more{font-size:11px;color:var(--t3)}
/* 窄窗（正文栏 < 980）：不挤正文，贴着窗格左缘覆一层。.pane 自己是滚动容器，
   绝对定位会跟着正文滚走，所以这一档钉在视口上量。Esc 或再按一次开关收掉。
   这一档 relHost() 一定把面板挂在 .pane 底下（不进 .doc-layout）：带 transform 的
   祖先会接管 position:fixed 的包含块（CSS Position §6.2），而 pageEnter() 每开一篇
   都给 .doc-layout 挂 190ms 的 translateY——挂在里面就会每换一篇跳半屏。 */
.pane.rel-float > .relpanel{
  display:flex;position:fixed;left:0;
  top:calc(var(--chrome-h) + var(--bnr-h, 0px) + var(--doc-toolbar-h));
  bottom:var(--status-h);width:var(--outline-w);max-height:none;z-index:9;
  /* stretch 一个字都不能少：常驻档从 .outline 抄来的 align-self:start 会让
     上下都钉死的绝对定位盒子缩成内容高（CSS Align §4.1），面板于是只有半屏。 */
  align-self:stretch;
  background:var(--win);box-shadow:var(--el-3);padding:12px 6px 12px 10px}
/* html 窗格：.doc-layout 整个 display:none，面板只能做 .pane 级的绝对定位兄弟。
   iframe 那条 top/height 的算法（5.6.1）一个字不动，这里只补 left 和宽。 */
.pane.html.rel-on > .relpanel{display:flex;position:absolute;left:0;
  top:var(--doc-toolbar-h);bottom:0;width:var(--outline-w);max-height:none;z-index:5;
  align-self:stretch;                              /* 同上：不写就缩成内容高 */
  background:var(--win);padding:12px 6px 12px 10px}
.pane.html.rel-on .htmlframe{left:var(--outline-w);width:calc(100% - var(--outline-w))}
/* 专注模式：跟大纲一样只淡出，不能 display:none——网格列宽得留着，正文不跳。 */
body.focus-mode .relpanel{opacity:0;pointer-events:none}
/* 顶栏那颗按钮。[hidden] 得自己写一条，理由同 .dt-ol。 */
.doc-toolbar .dt-rel[hidden]{display:none}
.doc-toolbar .dt-rel.on{background:var(--accent-soft);color:var(--accent)}

/* ═══ Markdown 正文 ═══════════════════════
   默认 17 / 1.8 / 690。中文标题 letter-spacing 为 0，层级靠字重和留白。
   hanging-punctuation 让行首的引号书名号挂到版心外面，中文段落的左缘才是齐的；
   text-autospace 是渐进增强，不认的浏览器忽略。
   版式三项仍能在设置和排版浮层里调。 */
.md{color:var(--t1);margin:0 auto;max-width:var(--docw);
  hanging-punctuation:first allow-end;text-autospace:normal}
.md h1{font-size:1.6em;font-weight:600;letter-spacing:0;line-height:1.45;margin:1.5em 0 .6em}
.md > h1:first-child{font-size:31px;font-weight:600;letter-spacing:0;line-height:1.45;margin:0 0 18px}
.md h2{font-size:1.35em;font-weight:600;letter-spacing:0;margin:2.2em 0 .7em;line-height:1.55}
.md h3{font-size:1.12em;font-weight:600;line-height:1.6;margin:1.8em 0 .5em}
.md h4{font-size:1em;font-weight:500;margin:1.5em 0 .6em;color:var(--t2)}
/* h5/h6 接着 h4 往下退：h5 同字号同字重、再退一级色；h6 再缩一点字号、留白也收一点。 */
.md h5{font-size:1em;font-weight:500;margin:1.3em 0 .5em;color:var(--t3)}
.md h6{font-size:.94em;font-weight:500;margin:1.2em 0 .5em;color:var(--t3)}
.md>:first-child{margin-top:0}
.md p{margin:0 0 1em}
.md strong{font-weight:600}
.md em{font-style:italic;color:var(--t2)}
.md a{color:var(--accent);text-decoration:none}
.md a:hover{text-decoration:underline;text-underline-offset:3px}
.md ul,.md ol{margin:0 0 1em;padding-left:1.5em}
.md li{margin:3px 0;padding-left:3px}
.md li::marker{color:var(--t3)}
.md li ul,.md li ol{margin:.32em 0 0}
.md li.task{list-style:none;margin-left:-1.35em;display:flex;flex-wrap:wrap;column-gap:.5em;align-items:flex-start}
.md li.task input{margin:.44em 0 0;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.md li.task input:checked+span{color:var(--t3);text-decoration:line-through}
/* 正文那一项必须给 0 基准。flex 的分行按「假想主尺寸」算，span 的 flex-basis:auto
   ⇒ 假想尺寸 ＝ max-content：一条比一行宽的待办，勾选框 ＋ 整段 max-content 放不下，
   下面那句 flex-wrap:wrap 就把整段文字推到第二条 flex 线上，还带着 margin-left:-1.35em
   落到比周围列表更靠左的位置（5.10 审查 P1，打印同样中招）。
   flex:1 1 0 让它先落到第一条线上再撑开；min-width:0 是给长单词/URL 留出收缩余地。 */
.md li.task>span{flex:1 1 0;min-width:0}
/* 嵌套：子列表是这个 li 的第三个 flex 项。不让它换行的话它会排到正文右边去
   （5.9 就是这样，一整张子清单飘在父项旁边）。给它独占一行。
   那 1.35em 是把上面那句 margin-left:-1.35em 还回来——负边距是为了让勾选框
   站到项目符号本来的位置，它会连着把子列表一起往左拖，不还回去子项只比父项
   缩进 5px，跟普通嵌套列表的 1.5em 对不上。
   gap 拆成 column-gap：留着 gap 会连带一个行间距，换行之后凭空多半个字高。 */
.md li.task>ul,.md li.task>ol{flex-basis:100%;margin-left:1.35em}
.md del{color:var(--t3)}
.md hr{border:0;height:1px;background:var(--rule-row);margin:2.4em 0}
.md blockquote{margin:23px 0;padding:12px 20px;color:var(--t2);
  background:var(--canvas);border-radius:0 var(--r-sm) var(--r-sm) 0;border-left:2px solid var(--quote-b)}
.md blockquote p{margin:0 0 .5em}
.md blockquote p:last-child{margin:0}
.md code{background:var(--canvas);padding:2px 5px;border-radius:4px;
  font:.82em/1.6 var(--mono)}
.md pre{background:var(--canvas);border-radius:var(--r-md);padding:14px;overflow-x:auto;margin:0 0 1.15em}
.md pre code{background:none;padding:0;color:var(--t2);font-size:.84em;line-height:1.6}
/* 表格：表头 600 ＋ 表头下一道淡线 ＋ 每行一道更淡的行线，无竖线无斑马，
   宽表在自己容器里横滚。行线是全篇仅存的三种线之一（另两种：引用块左竖条、分段凹槽）。 */
.tw{overflow-x:auto;margin:0 0 1.5em;max-width:100%}
.md table{border-collapse:collapse;width:100%;font-size:.88em;font-variant-numeric:tabular-nums}
.md th{font-size:.92em;font-weight:600;color:var(--t2);text-align:left;
  padding:0 10px 9px;white-space:nowrap;border-bottom:1px solid var(--rule-head)}
.md td{padding:11px 10px;color:var(--t1);vertical-align:top;line-height:1.7;
  border-bottom:1px solid var(--rule-row)}
.md tbody tr:last-child td{border-bottom:0}
.md img{max-width:100%;height:auto;display:block;margin:16px auto;border-radius:6px}
.md img[src$=".svg"]{width:100%}
:root[data-theme="dark"] .md img{background:#f6f6f6;padding:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .md img{background:#f6f6f6;padding:6px}}
.md .imgbad{display:inline-block;padding:2px 8px;border-radius:4px;
  background:var(--field);color:var(--t2);font-size:12px}
/* 编辑态里取不到的图：图元素留着（存盘照原样写回 ![alt](地址)），画成一个虚线框。
   按 alt 字收窄（inline-block、宽度自动），最小 120×32；不撑满整行。深色那两份 .md img 规则
   （#f6f6f6 底、6px 内边距，特异性更高）会把它盖成一条亮色整宽条，下面两条同样特异性再盖回来（H 轮 §5） */
.md img.imgmiss{display:inline-block;width:auto;max-width:100%;min-width:120px;min-height:32px;margin:6px 0;padding:0;
  vertical-align:middle;border:1px dashed var(--t4);border-radius:6px;background:var(--field);color:var(--t3);font-size:12px}
:root[data-theme="dark"] .md img.imgmiss{background:var(--field);padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .md img.imgmiss{background:var(--field);padding:0}}
/* 「有 N 处存不进」点过去：那一块闪一下 */
.md .stuckflash{outline:2px solid var(--folder);outline-offset:4px;border-radius:4px;transition:outline-color .6s}
/* 长字符串折行。库里正文常带超长飞书 URL、长行内 code、以及「图片没找到：<长地址>」
   这一条提示，不折行的话正文栏自己会横滚（0829 D 路实测最大 453px）。
   用 anywhere 不用 break-word：只有 anywhere 会把 min-content 宽度也算进去，
   inline-block 的 .imgbad 才收得住。
   表格单元格有意不加——宽表该整条横滚，不该把词拆断；pre 保持自身横滚不动。 */
.md p,.md li,.md blockquote,.md h1,.md h2,.md h3,.md h4,.md h5,.md h6,
.md code,.md .imgbad{overflow-wrap:anywhere}
.md pre,.md pre code,.md th,.md td{overflow-wrap:normal}
.md a.wl{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
.pane.edit .md p:empty,.pane.edit .md li:empty{min-height:1em}
.pane.edit .md h1:first-child{min-height:1.22em}
/* 空标题 / 空段的占位。绝对定位叠在块上，不占光标位，也不会进 innerText。 */
.pane.edit .md h1[data-ph],
.pane.edit .md p[data-ph]{position:relative}
.pane.edit .md h1[data-ph]::before,
.pane.edit .md p[data-ph]::before{
  position:absolute;left:0;top:0;right:0;
  color:var(--t4);letter-spacing:0;pointer-events:none;user-select:none}
.pane.edit .md h1[data-ph]::before{content:var(--i18n-ph-h1);font-weight:500}
.pane.edit .md p[data-ph]::before{content:var(--i18n-ph-p);font-weight:400}
.f-sans{font-family:var(--ui)}
.f-serif{font-family:ui-serif,"New York",Georgia,"Songti SC","Noto Serif CJK SC",serif}
.f-mono{font-family:var(--mono)}
/* 新细明体：本机装了就直接用（两条 local()），没装的话由门户服务把 Office 里那份
   mingliu.ttc 抽出来当 web font 借出来；服务也拿不到时整条落到宋體-繁那一档。
   swap ＝ 22 MB 的字体在路上时先拿回退字面把字排出来，不留白屏。 */
@font-face{font-family:"AMN PMingLiU";src:local("PMingLiU"),local("新細明體"),
  url("/__font/pmingliu") format("truetype");font-display:swap}
.f-hk{font-family:"PingFang HK","PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif}
.f-ming{font-family:"AMN PMingLiU","PMingLiU","新細明體","MingLiU_HKSCS","MingLiU","Songti TC","LiSong Pro","Apple LiSung",serif}
/* 苹方-港有 100–600 六个真字面（没有 700）。正文字重由 .md 上的内联 --rw 传进来——
   applyPref 会整条重写 class，内联 style 不受影响，所以字重走属性不走类名。
   全局 font-synthesis:none ＝ 没有假粗体，加粗只能往上挑一个真字面：
   正文 +200 封顶 600，四级以下标题 +100。--rw 到 600 时粗体与正文同重，是字体的上限。 */
.md.f-hk{font-weight:var(--rw,400)}
.md.f-hk strong,.md.f-hk b,.md.f-hk th,
.md.f-hk h1,.md.f-hk h2,.md.f-hk h3{font-weight:min(600, calc(var(--rw,400) + 200))}
.md.f-hk h4,.md.f-hk h5,.md.f-hk h6{font-weight:min(600, calc(var(--rw,400) + 100))}
/* 搜索命中点开：跳到命中段并闪一下 */
@keyframes hitflash{0%,70%{background:var(--hl)}100%{background:transparent}}
.md .flash{animation:hitflash 1.4s ease-out 1;border-radius:6px}

/* 文档历史折叠：纯显示层的一层包装，进编辑与存盘对比前整个拆掉。
   包装盒自己带状态，被包住的那张表一个属性都不动。
   5.8.1 起默认是展开的（.open 由 decorateHistory 直接挂上），点芯片收起；
   收起只记在本标签页的内存里（HIST_FOLD），不进 ST、不落盘。
   两枚 chevron 都画进 DOM，靠 CSS 切显示——JS 不换 innerHTML，
   undecorateHistory 拆盒子时它们跟着盒子一起没，正文一个属性都不留。 */
.histbox{margin:0 0 1.5em}
.histbox>.tw{display:none;margin:10px 0 0}
.histbox.open>.tw{display:block}
.histpill{display:inline-flex;align-items:center;gap:5px;
  font-size:11px;color:var(--t2);background:var(--field);border-radius:9px;
  padding:3px 9px;white-space:nowrap;transition:background-color .15s ease}
.histpill:hover{background:var(--hover)}
.histpill .cv{display:flex;align-items:center;color:var(--t3);margin-right:-1px}
.histbox.open .histpill .cv-dn{display:none}
.histbox:not(.open) .histpill .cv-up{display:none}

/* 编辑态 */
.pane.edit .md>[data-lock]{position:relative;background:var(--field);border-radius:6px;
  box-shadow:inset 2px 0 0 var(--t3);
