/* 一层一层往下画，只钻展开着的那几个文件夹。每层缩进 12px。 */
function relTreeRows(node, depth, cur, open, book){
  const pad=10+depth*12;
  const dirs=[...node.dirs.values()].sort((a,b)=>relCmp(a.name,b.name));
  const files=node.files.slice().sort((a,b)=>relCmp(relStem(a.路径), relStem(b.路径)));
  const total=dirs.length+files.length;
  let left=REL_CAP, out='';
  for(let n=0;n<dirs.length && left>0;n++,left--){
    const kid=dirs[n], on=open.has(kid.path);
    /* aria-expanded：箭头是画给眼睛看的，读屏得靠这一位才知道展没展开。 */
    out += relRow('rel-d', ` data-rd="${esc(kid.path)}" aria-expanded="${on}"`, pad,
                  `<i>${icon(on?'chevron-down':'chevron-right',12)}</i>`,
                  relDirLabel(kid.name, kid.path, book),
                  kid.n?`<span class="rel-n num">${kid.n}</span>`:'');
    if(on) out += relTreeRows(kid, depth+1, cur, open, book);
  }
  for(let n=0;n<files.length && left>0;n++,left--){
    const i=files[n], here=i.路径===cur;
    out += relRow('rel-f'+(here?' on':''), ` data-rf="${esc(i.路径)}"`, pad,
                  `<i>${icon(kindOf(i)==='html'?'globe':'doc',12)}</i>`,
                  relStem(i.路径), '');
  }
  if(total>REL_CAP){
    /* 这一行是提示不是文件名，尾巴不用留，整句从尾部截断就行。 */
    out += `<button type="button" class="rel-i rel-more" data-rmore="${esc(node.path)}"`
         + ` style="padding-left:${pad}px"><span class="rel-nm"><span class="hd">`
         + esc(TR('还有 {n} 项，打开文件夹页',{n:total-REL_CAP})) + `</span></span></button>`;
  }
  return out;
}
/* ① 所在文件夹。多本时最上面一行是笔记本（色点 ＋ 名字），单库不画根行。 */
function relFolderHtml(t){
  const book=NB.of(t.path||'');
  const open=relOpenSet(t);
  const root=relTree(book);
  let rows='';
  if(NB.multi && book){
    const on=open.has(book);
    rows += relRow('rel-d rel-root', ` data-rd="${esc(book)}" aria-expanded="${on}"`, 10,
                   `<i>${icon(on?'chevron-down':'chevron-right',12)}</i>`+nbDot(book),
                   book, root.n?`<span class="rel-n num">${root.n}</span>`:'');
    if(on) rows += relTreeRows(root, 1, t.path, open, book);
  }else{
    rows += relTreeRows(root, 0, t.path, open, book);
  }
  if(!rows) return '';
  return `<div class="rel-sec"><div class="rel-h">${esc(TR('所在文件夹'))}</div>${rows}</div>`;
}
/* ② 其他版本：文件名主干归一化后相等，限同一笔记本，md 和 html 都算，排除自己。
   归一化只剩一个字＝没什么可比的；通用名（README 这类）只在同一文件夹里认。 */
/* 路径 → 归一化主干的缓存。整张 items 现算一遍是面板重画里最贵的一段
   （5000 篇实测 8.1ms，每条 ~12 次正则），而它只跟文件名有关、跟展开态无关：
   展开／收起一个文件夹重画时白算一遍太亏。items 换了一版（relGen++）才作废。 */
const REL_STEM=new Map();
let relStemGen=-1;
function relVerStem(path){
  if(relStemGen!==relGen){ REL_STEM.clear(); relStemGen=relGen; }
  let v=REL_STEM.get(path);
  if(v===undefined){ v=versionStem(relStem(path)); REL_STEM.set(path, v); }
  return v;
}
function relVersions(t){
  const me=String(t.path||''), key=relVerStem(me);
  if(key.length<2) return [];
  const book=NB.of(me), dir=relDirOf(me), generic=REL_GENERIC.has(key);
  return items.filter(i=>{
    const p=String(i.路径||'');
    if(p===me || NB.of(p)!==book) return false;
    const k=kindOf(i); if(k!=='md' && k!=='html') return false;
    if(relVerStem(p)!==key) return false;
    return !generic || relDirOf(p)===dir;
  }).sort((a,b)=>(b.修改时间||0)-(a.修改时间||0)).slice(0,12);
}
function relVersionsHtml(t){
  const list=relVersions(t);
  if(!list.length) return '';
  const dir=relDirOf(String(t.path||''));
  /* 家族限同一笔记本，所以「在哪儿」只说目录——本名在这一段里重复了没意义。 */
  const rows=withNbCtx(NB.of(String(t.path||'')), ()=>list.map(i=>{
    const other=relDirOf(i.路径)!==dir ? folderText(i.路径) : '';
    return relRow('rel-f', ` data-rf="${esc(i.路径)}"`, 10,
                  `<i>${icon(kindOf(i)==='html'?'globe':'doc',12)}</i>`, relStem(i.路径),
                  (other?`<span class="rel-fdr">${esc(other)}</span>`:'')
                  + `<span class="rel-when">${esc(fmtWhen(i.修改时间))}</span>`);
  }).join(''));
  return `<div class="rel-sec"><div class="rel-h">${esc(TR('其他版本'))}</div>${rows}</div>`;
}
/* ③ 链接。一篇问一次 /__links，按路径缓存；{ok:false}、网络出错、
   老服务端 404 一律当「没有这一段」，静默不画。
   缓存被标过期之后不作废、只在下次画到那一篇时后台重新问一发（下面那三个函数）。 */
/* 两份回复算不算「一样」：只认上屏用得着的那几个字段，服务端多给的一律不看。 */
const relLinksKey = j => !j ? '' : JSON.stringify([
  (j.出链||[]).map(l=>[l.目标, l.文本, l.存在===false?0:1, l.类型||'']),
  (j.反链||[]).map(l=>[l.源, l.文本])]);
/* 一发回来了。返回「要不要重画」：
   ① 重新校验失败（{ok:false}／网络错）不覆盖旧的——多显示一会儿旧的，
      好过整段凭空消失；头一回就失败的那档照旧落 null，静默不画。
   ② 一个字没变：只把过期标记摘掉，版本号不动 ⇒ 签名不变 ⇒ 不重画、不闪。
   ③ 真的变了：落表、版本号 +1，交给调用方 syncRel()。 */
function relLinksTake(p, v){
  const had=REL_LINKS.has(p), old=had?REL_LINKS.get(p):null;
  REL_STALE.delete(p);
  if(had && old && v===null) return false;
  if(had && relLinksKey(old)===relLinksKey(v)) return false;
  REL_LINKS.set(p, v);
  REL_LVER.set(p, (REL_LVER.get(p)||0)+1);
  return true;
}
function relLinksFor(t){
  const p=String(t&&t.path||''); if(!p) return null;
  const had=REL_LINKS.has(p), old=had?REL_LINKS.get(p):null;
  if(had && !REL_STALE.has(p)) return old;
  /* 没服务端、或者这条路径已经有一发在路上：手上有什么先用什么。 */
  if(!IS_HTTP || REL_PEND.has(p)) return old;
  REL_PEND.add(p);
  fetch('/__links?path='+encodeURIComponent(p), {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(j => relLinksTake(p, (j && j.ok) ? j : null))
    .catch(()=> relLinksTake(p, null))
    .then(hit => {
      REL_PEND.delete(p);
      const cur=active();
      if(hit && REL_ON && cur && cur.path===p) syncRel();   // 变了才补画这一段
    });
  return old;                       // 头一回是 null；重新校验期间照旧交出旧的
}
const relByPath = rel => items.find(i=>i.路径===rel) || null;
/* 题名链的目标是裸名：在同一本里按文件名主干或者标题（都小写）找。 */
function relByName(name, book){
  const q=String(name||'').trim().toLowerCase();
  if(!q) return null;
  return items.find(i=>{
    if(NB.of(i.路径)!==book) return false;
    return relStem(i.路径).toLowerCase()===q || String(i.标题||'').trim().toLowerCase()===q;
  }) || null;
}
function relLinksHtml(t){
  const j=relLinksFor(t);
  if(!j) return '';
  const me=String(t.path||''), book=NB.of(me);
  const pick=(arr, get)=>{
    const seen=new Set(), out=[];
    (arr||[]).forEach(l=>{
      const it=get(l);
      if(!it || it.路径===me || seen.has(it.路径)) return;
      seen.add(it.路径); out.push(it);
    });
    return out;
  };
  const outs=pick(j.出链, l => l.存在===false ? null
    : (l.类型==='路径' ? relByPath(l.目标) : relByName(l.目标, book)));
  const backs=pick(j.反链, l => relByPath(l.源));
  if(!outs.length && !backs.length) return '';
  /* 行文字用文件名主干，跟树和「其他版本」一个口径——同一份文件不该在一块面板里
     以两个名字出现（cleanTitle 会把 v1／v2 洗掉，两行看着一模一样）。 */
  const rows=list=>list.map(i=>relRow('rel-f', ` data-rf="${esc(i.路径)}"`, 10,
      `<i>${icon(kindOf(i)==='html'?'globe':'doc',12)}</i>`, relStem(i.路径), '')).join('');
  return `<div class="rel-sec"><div class="rel-h">${esc(TR('链接##关联'))}</div>`
    + (outs.length ? `<div class="rel-h rel-sh">${esc(TR('链到'))}</div>`+rows(outs) : '')
    + (backs.length ? `<div class="rel-h rel-sh">${esc(TR('被链'))}</div>`+rows(backs) : '')
    + `</div>`;
}
/* 只在开着的时候填，签名没变就一个字节都不动（改动时会闪，滚动位置也会跳）。 */
function relSig(t){

     （后台重新校验回来，只有内容真的变了才会 +1）。 */
  return [t.id, t.path, relGen, REL_LINKS.has(t.path)?1:0, REL_LVER.get(t.path)||0,
          [...relOpenSet(t)].sort().join('>')].join('~');

function paintRel(t, el){
  const sig=relSig(t), key=t.id+'~'+t.path;
  if(el.dataset.sig===sig) return;
  /* 「同一篇重画」和「换了一篇」要分开：前者（展开一个文件夹、外部改了任何一份
     文件触发重扫、链接到货）保留滚动位置，不然用户往下翻着翻着，一次自动保存就
     把视野拽回当前这一篇；后者才把新的当前项滚进视野。 */
  const list0=el.querySelector('.rel-list');
  /* list0 为空 ＝ 刚开面板（关掉时 syncRel 把内容清空了），那一下算「换了一篇」。 */
  const keep=list0?list0.scrollTop:0, same=!!list0 && el.dataset.key===key;
  el.dataset.sig=sig; el.dataset.key=key;
  el.innerHTML=`<div class="rel-list">`
    + relFolderHtml(t) + relVersionsHtml(t) + relLinksHtml(t)
    + `</div>`;
  const list=el.querySelector('.rel-list');
  if(same && list){ list.scrollTop=keep; return; }
  const now=el.querySelector('.rel-f.on');
  if(now) now.scrollIntoView({block:'nearest'});
}
/* 面板该在谁底下：md 窗格的宽档搭在 .doc-layout 的网格首列上；html 窗格里
   .doc-layout 是 display:none，窄窗覆盖档又是 position:fixed（DOM 上挂哪儿不影响
   布局）—— 这两档都挪到 .pane 底下做绝对／固定定位的兄弟。
   窄档必须挪出去：带 transform 的祖先会接管 fixed 的包含块（CSS Position §6.2），
   而 pageEnter() 每开一篇都给 .doc-layout 挂 190ms 的 translateY，挂在里面的话
   每换一篇面板就往下掉半屏再弹回来。 */
function relHost(p, t){
  const el=p.querySelector('.relpanel'); if(!el) return null;
  const lay=p.querySelector('.doc-layout');
  const want = (kindOfTab(t)==='html' || !olWide()) ? p : lay;
  if(want && el.parentNode!==want){
    if(want===p) p.appendChild(el);
    else lay.insertBefore(el, lay.querySelector('.document'));
  }
  return el;
}
/* 该不该露、露成哪一档、顶栏那颗按钮什么样。最后接着跑 syncToc()——
   两栏是同一列，大纲得知道自己此刻要不要让位。 */
function syncRel(){
  const t=active(), p=t&&paneOf(t);
  const ready=relReady(t);
  REL_ON = ready && ST.rel===true;
  if(p){
    const el=relHost(p, t);
    const lay=p.querySelector('.doc-layout');
    const wide=olWide();
    if(lay) lay.classList.toggle('rel-on', REL_ON && wide);
    p.classList.toggle('rel-on', REL_ON && wide);
    p.classList.toggle('rel-float', REL_ON && !wide);
    if(el){
      if(REL_ON) paintRel(t, el);
      else if(el.dataset.sig){ el.dataset.sig=''; el.innerHTML=''; }
    }
    const b=p.querySelector('[data-dt="related"]');
    if(b){ b.hidden=!ready; b.classList.toggle('on', REL_ON); }
  }
  if(REL_ON) closeOlFloat();            // 窄窗里两层不叠着出现
  syncToc();
}
/* 点条目：文件＝当前标签打开（已开着的切过去），⌘／Ctrl＝新标签；
   文件夹＝展开收起，⌘ 单击＝新标签开那一页（跟路径芯片一个规矩）。 */
function wireRel(p, t){
  const el=p.querySelector('.relpanel'); if(!el) return;
  el.addEventListener('pointerdown', e=>{ if(e.target.closest('.rel-i')) e.preventDefault(); });
  el.addEventListener('click', e=>{
    const b=e.target.closest('.rel-i'); if(!b) return;
    if(t.id!==curTab) showTab(t.id);
    const meta=e.metaKey||e.ctrlKey;
    const openFolder=(f, nt)=>navigate(makeEntry('folder',
        {folder:f, title:f?f.split('/').pop():TR('库根'), path:f?f+'/':'/'}), {newTab:!!nt});
    if(b.dataset.rf!=null){
      const it=relByPath(b.dataset.rf);
      if(it) openDoc(it, {newTab:meta});
      return;
    }
    /* 「还有 N 项」跟文件行同一个规矩：单击当前标签，⌘ 单击新标签。 */
    if(b.dataset.rmore!=null){ openFolder(b.dataset.rmore, meta); return; }
    if(b.dataset.rd!=null){
      const f=b.dataset.rd;
      if(meta){ openFolder(f, true); return; }
      const set=relOpenSet(t);
      set.has(f) ? set.delete(f) : set.add(f);
      syncRel();
      return;
    }
  });
}

/* ── 列表栏（⌃⌘S）5.4.1 下线 ─────────────
   壳菜单和老调用方都还可能喊 AMN.toggleLists，留一颗空壳，点了什么也不做。 */
function toggleLists(){}

/* 块台账。每一块在原文里是哪几行（src），和下一块之间隔着哪几行（gap），下一块是谁（nx，块号）。
   头（frontmatter 和它后面的空行）和尾（末尾的空行）单独留着，原样带出去。
   这三样拼起来一定等于进来时的 t.work，一个字节不差。
   块源码框收起时会在台账末尾补新块（见 srcBlkCommit），块号不再跟文件里的先后一致，
   「谁挨着谁」只认 nx。 */
function buildRegistry(t){
  const md=paneOf(t).querySelector('.md');
  const lines=t.work.split('\n');
  const els=[...md.children].filter(e=>e.nodeType===1 && e.hasAttribute('data-l0'));
  const reg={head:[], tail:[], blocks:[]};
  // 台账的「代」：块号只在同一代里算数。撤销会把早先删掉的块原样插回来，它身上是旧台账的块号，
  // 编号换过之后可能正好指着另一块的原文——代对不上就当新块（H 轮）
  t.regEpoch=(t.regEpoch||0)+1;
  if(!els.length){ reg.head=lines; return (t.reg=reg); }
  reg.head=lines.slice(0, +els[0].getAttribute('data-l0'));
  els.forEach((el,k)=>{
    const l0=+el.getAttribute('data-l0'), l1=+el.getAttribute('data-l1');
    const nx=els[k+1] ? +els[k+1].getAttribute('data-l0') : null;
    reg.blocks.push({src:lines.slice(l0,l1+1), gap:nx===null?null:lines.slice(l1+1,nx), nx:nx===null?null:k+1});
    el.dataset.bid=k; el.dataset.be=t.regEpoch;
    delete el.dataset.dirty;
  });
  reg.tail=lines.slice(+els[els.length-1].getAttribute('data-l1')+1);
  return (t.reg=reg);
}

/* 这一块在台账里的块号：有、在台账里、而且是这一代台账记的（见 buildRegistry 的 regEpoch），否则 null */
function blockBid(t, el){
  const b=el && el.dataset ? el.dataset.bid : undefined;
  if(b===undefined || !t.reg || !t.reg.blocks[+b]) return null;
  if(String(el.dataset.be)!==String(t.regEpoch)) return null;
  return +b;
}
/* 正文 DOM → 整份文件的文本（I 轮：回到整篇写）。顺序完全按 DOM 走。
   台账 t.reg＝{head, blocks:[{src, gap}], tail} 是进编辑时文件按块切开的样子，编辑期间不变；
   DOM 里每一块的 data-bid 指回台账里它那一块。没动过的块抄台账原字节（它在文件里一直就是这几行）；
   动过的、新的、块号重了的（浏览器劈段会把块号抄给新块）按自检结论写（blockPlan）。
   块源码框（⌥⌘E）开着的那块：没动过的照台账写；动过的照开框那一刻它该写的样子写（ta._md）；
   原来就存不进的，框开着也算存不进（ta._stuck）——收起（⌘↩）或 ⌘S 时才把框里的字落回去
   （⌘S 落过之后框开着就照落下的那一份写，ta._md）。框里正在打、还没落的字不写。
   源码框收起后渲染出来的几块各有各的块号、各有一份台账（J 轮，见 srcBlkCommit）；
   同一个块号出现在好几块上（浏览器劈段、撤销插回来的）一律按块号重了算，每一块按眼前的样子写。
   两块之间的空白：台账里前一块的下一块（nx）正好是后一块，就照原样写那几行，别的情况给一个空行。
   存不进（stuck）：这一次整篇不写（saveEdit 见 stuck 就不发 /__save），文件保持上次存下的样子。
   H 轮按锚点分段、stuck 的那段写原字节——拖放、并段、源码框都会让内容在块之间挪，锚点认的是元素
   不是内容，三轮都被找出丢字或写重，I 轮整个拿掉。这里只有切整篇源码（draft，toggleSrc 先问过人）
   才会把存不进的块按编辑器眼里的样子写出来；不是 draft 时 text 里它照台账写（尽力而为，不会拿去写盘）。
   probe（K 轮，只给 srcBlkFits 用）：假装块源码框 probe.ta 已经落下、框里是 probe.lines，往后接空白按
   probe.link（落框以后末一块的 gap／nx）；probe.pad＝框跟前后文之间一个空行都没有的地方补一个。
   返回 {text, stuck:[判成存不进的块…]}；有 probe 时多给 at（框里第一行落在第几行，没写出去是 -1）
   和 inLink（框前面那一块往后接空白认的那一条台账）。 */
function bodyPlan(t, over, draft, probe){
  const p=paneOf(t), md=p.querySelector('.md'), reg=t.reg, base=dirOf(t.path);
  const kids=[...md.children].filter(el=>el.nodeType===1 && !el.dataset.chrome);
  const units=kids.map(el=>{
    const bid=blockBid(t, el), ta=el.tagName==='TEXTAREA';
    return {el, bid, ta, clean:bid!==null && (ta || !el.dataset.dirty)};
  });
  const cnt=new Map();
  units.forEach(u=>{ if(u.bid!==null) cnt.set(u.bid, (cnt.get(u.bid)||0)+1); });
  const stuck=[], ent=[];
  units.forEach(u=>{
    // 块号重了：每一块都按眼前的样子写，台账那一份谁也不抄（不然原文写两遍）
    const el=u.el, dup=u.bid!==null && cnt.get(u.bid)>1, isProbe=!!(probe && el===probe.ta);
    let src=null, last=u.bid;                       // last：往后接哪一块的空白，按台账里哪一块的 nx／gap 算
    if(isProbe) src=probe.lines;
    else if(u.ta && draft){                          // 切整篇源码：框里眼下的字原样进源码（K 轮），往后接空白按开框那一刻
      src=String(el.value).replace(/\r\n/g,'\n').split('\n'); last=null;
    }
    else if(u.ta){
      if(el._stuck){ stuck.push(el); if(u.bid!==null) src=reg.blocks[u.bid].src; }
      else if(el._md!=null){ src=String(el._md).split('\n'); if(el._last!==undefined) last=el._last; }
      else if(u.bid!==null) src=reg.blocks[u.bid].src;
    }else if(u.clean && !dup) src=reg.blocks[u.bid].src;
    else{
      const v=(over && over.has(el)) ? over.get(el) : blockPlan(el, base);
      if(v.stuck && !draft){ stuck.push(el); if(u.bid!==null && !dup) src=reg.blocks[u.bid].src; }
      else src=String(v.md==null?'':v.md).split('\n');
    }
    if(!src || !src.join('').trim()) return;          // 空块不写出去
    const link=isProbe ? probe.link : (u.ta && draft) ? (el._out || null) : (last!==null && reg.blocks[last]) || null;
    ent.push({bid:u.bid, link, src, probe:isProbe});
  });
  const out=reg.head.slice();
  let at=-1, inLink=null;
  ent.forEach((e,k)=>{
    if(k){
      const L=ent[k-1].link;
      // 台账里本来就前后挨着的两块，中间那几行空白原样保留；别的情况给一个空行
      let g=(L && e.bid!==null && L.nx===e.bid) ? L.gap : null;
      if(e.probe) inLink=L;
      if(probe && probe.pad && (e.probe || ent[k-1].probe) && g && !g.length) g=null;
      out.push(...(g||['']));
    }
    if(e.probe) at=out.length;
    out.push(...e.src);
  });
  out.push(...reg.tail);
  return {text:wellFormed(out.join('\n')), stuck, at, inLink};
}
function serializeBody(t, over, draft){
  if(!paneOf(t) || !t.reg) return t.work;
  return bodyPlan(t, over, draft).text;
}
/* 一块动过的块的结论（blockVerdict）。反解本身抛了：这一块按存不进算（文件里留原来的字节），
   md 给一份尽量像的，只给源码框看。 */
function blockPlan(el, base){
  try{ return blockVerdict(el, base); }
  catch(e){
    let md='';
    try{ md=blkMd(el, base); }catch(e2){ md=tidyTxt(el.textContent||''); }
    return {md, ok:false, stuck:true};
  }
}
/* 孤立的代理项（半个 emoji）换成 U+FFFD。服务端按 UTF-8 编码时会抛异常，
   整篇每一次都存不进；屏幕上它本来就画成一个替换符号。 */
function wellFormed(s){
  s=String(s);
  if(typeof s.toWellFormed==='function') return s.toWellFormed();
  let o='';
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    if(c>=0xD800 && c<=0xDBFF){
      const d=s.charCodeAt(i+1);
      if(d>=0xDC00 && d<=0xDFFF){ o+=s[i]+s[i+1]; i++; } else o+='\uFFFD';
    }else o += (c>=0xDC00 && c<=0xDFFF) ? '\uFFFD' : s[i];
  }
  return o;
}

/* 编辑期间判「有没有改动」：动过、而且还没确认落盘，就算。
   以前是把正文序列化出来跟磁盘那一版比——序列化恰好把改动丢了的时候
   （双链里打的字、只改了块边空白）就判成没改，壳的退出／关窗拦截不弹，退出即丢。
   t.touched 由改动置上，存盘成功（而且存的这一会儿没再动）才清。也省得壳
   每半秒问一次 state() 就把整篇反解一遍。 */
const dirty = t => !!(t && t.editing && t.touched);
/* ── DOM 洗白 ───────────────────────────
   浏览器在 contenteditable 里造出来的东西不完全是我们渲染的那一套：加粗给的是 <b>、
   斜体是 <i>，撤销和拖动还会塞 <span style> 和 <font>。每次改完把这一块洗回
   我们自己的形状，序列化和自检才有一个稳定的比较基准。
   编辑器自己也会造坏形状（B 报告 §5.1 的 C–F 类），一并在这里收拾：
   跑到顶层的裸行内元素包回段落；段落套进了行里／li／格子（跨块格式、粘贴）拆壳、
   前后各断一行；引用里的散字包成段；li 里挨着的两张子表并成一张；代码块里只留字；
   行内代码里的 <br> 把代码切开；相邻同名标签并起来（<em>甲</em><em>乙</em> 写成
   *甲**乙* 是加粗）；双链保住 class、做成原子；外来的 <a href> 补成自家的样子；
   认不得的行内标签（sup、mark、kbd……）只留里面的字。 */
const UNWRAP={SPAN:1, DIV:1, FONT:1, U:1, SMALL:1, BIG:1};
const RETAG={B:'strong', I:'em', STRIKE:'del', S:'del'};
// 正文里认得的元素；别的行内标签一律拆壳留字
const KEEP_TAG=/^(P|H[1-6]|UL|OL|LI|BLOCKQUOTE|PRE|CODE|STRONG|EM|DEL|A|BR|IMG|INPUT|HR|TABLE|THEAD|TBODY|TFOOT|TR|TD|TH|CAPTION|COLGROUP|COL|SPAN|DIV)$/;
const TOP_BLOCK=/^(P|H[1-6]|UL|OL|BLOCKQUOTE|PRE|HR|TABLE|DIV)$/;

function unwrapKeep(n){
  const f=document.createDocumentFragment();
  while(n.firstChild) f.appendChild(n.firstChild);
  n.replaceWith(f);
}
/* root 里紧挨着 node 前面（back）或后面的那个「有东西」的叶子：
   非空白的字、<br>、<img>、子表这类块。空的壳、纯空白跳过去。 */
function leafNear(node, root, back){
  let n=node;
  for(;;){
    let s = back ? n.previousSibling : n.nextSibling;
    while(!s){
      n=n.parentNode;
      if(!n || n===root) return null;
      s = back ? n.previousSibling : n.nextSibling;
    }
    n=s;
    while(n.nodeType===1 && !/^(BR|IMG|INPUT|UL|OL|TABLE|PRE|HR)$/.test(n.tagName)
          && (back ? n.lastChild : n.firstChild)) n = back ? n.lastChild : n.firstChild;
    if(n.nodeType===3){ if(tidyTxt(n.nodeValue).trim()) return n; continue; }
    if(n.nodeType===1 && /^(BR|IMG|UL|OL|TABLE|PRE|HR)$/.test(n.tagName)) return n;
  }
}
const isTag = (n, re) => !!(n && n.nodeType===1 && re.test(n.tagName));

function cleanBlock(el){
  if(!el || el.nodeType!==1) return el;
  if(el.tagName==='TEXTAREA' || el.dataset.chrome) return el;
  // 顶层被浏览器造成了 div（某些情况下回车会给 div），按正文段落算
  if(el.tagName==='DIV' && !el.classList.contains('tw')){
    const p=document.createElement('p');
    while(el.firstChild) p.appendChild(el.firstChild);
    [...el.attributes].forEach(a=>p.setAttribute(a.name,a.value));
    el.replaceWith(p); el=p;
  }else if(!TOP_BLOCK.test(el.tagName)){
    // 跑到顶层的裸行内元素（图、加粗、链接……）：包回一个段落。
    // 块号、脏标记挪到外面这层，台账和序列化认的是顶层那一块
    const p=document.createElement('p');
    ['bid','be','dirty'].forEach(k=>{ if(el.dataset[k]!==undefined){ p.dataset[k]=el.dataset[k]; delete el.dataset[k]; } });
    el.replaceWith(p); p.appendChild(el); el=p;
  }
  // 代码块粘贴的占位符（撤销再重做会把它原样插回来）：代码块里换回换行、别处删掉（见 preInsert）
  fixPreHolders(el);
  el.querySelectorAll('b,i,s,strike,u,font,span').forEach(n=>{
    if(n.tagName==='SPAN' && n.parentElement && n.parentElement.classList.contains('task')) return;
    if(n.tagName==='SPAN' && n.classList.contains('imgbad')) return;
    const to=RETAG[n.tagName];
    if(to){
      const r=document.createElement(to);
      while(n.firstChild) r.appendChild(n.firstChild);
      n.replaceWith(r);
    }else if(UNWRAP[n.tagName]) unwrapKeep(n);
  });
  // 认不得的行内标签（sup、mark、kbd、small……）：拆壳留字
  el.querySelectorAll('*').forEach(n=>{ if(!KEEP_TAG.test(n.tagName)) unwrapKeep(n); });
  // 代码块：只留 <pre><code>字和 <br></code></pre>。并进来的字（落在 <code> 外面）收进去，
  // 里面的加粗之类（写不进 md）拆壳。<br> 原样留着——Chromium 在代码块里回车插的就是它，
  // 换成换行字符的话，按字符数记的光标会往回跳一格（preText 写回时把它当换行）
  if(el.tagName==='PRE'){
    const c=el.firstChild;
    const plain = el.childNodes.length===1 && isTag(c, /^CODE$/)
                  && [...c.childNodes].every(x=>x.nodeType===3 || isTag(x, /^BR$/));
    if(!plain){
      const code=document.createElement('code');
      const flat=n=>n.childNodes.forEach(x=>{
        if(x.nodeType===3 || isTag(x, /^BR$/)) code.appendChild(x.cloneNode(true));
        else if(x.nodeType===1){
          // 段落一类的块进了代码块：各占一行（同 preText）
          const blk=/^(P|DIV|LI|H[1-6]|TR|BLOCKQUOTE)$/.test(x.tagName);
          if(blk && code.textContent && !/\n$/.test(preText(code))) code.appendChild(document.createElement('br'));
          flat(x);
          if(blk) code.appendChild(document.createElement('br'));
        }
      });
      flat(el);
      el.textContent='';
      el.appendChild(code);
    }
  }
  // 段落一类的块套进了行里／li／格子／别的段落（跨块格式、粘贴、li>p）：
  // 拆壳，前后各断一行。只有引用底下那一层 <p> 是正经结构。
  // 落单的 <li>（不在 ul/ol 里，插 HTML 插出来的）同样：写回去只能是一行，屏幕上也按一行来，
  // 别让它顶着项目符号、存下去却是普通的一行（R 判据 r-js-li-in-p）
  el.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li').forEach(n=>{
    if(!el.contains(n) || n.classList.contains('tw')) return;
    if(n.tagName==='LI' && n.parentNode && /^(UL|OL)$/.test(n.parentNode.tagName)) return;
    if(el.tagName==='BLOCKQUOTE' && n.parentNode===el){
      if(n.tagName!=='P'){                          // 引用里的 div / 标题：当一段
        const p=document.createElement('p');
        while(n.firstChild) p.appendChild(n.firstChild);
        n.replaceWith(p);
      }
      return;
    }
    let box=n.parentNode;
    while(box && box!==el && !/^(LI|TD|TH|P|H[1-6])$/.test(box.tagName)) box=box.parentNode;
    if(!box) return;
    while(n.lastChild && isTag(n.lastChild, /^BR$/)) n.lastChild.remove();   // 段尾那个占位 <br>
    const pv=leafNear(n, box, true), nx=leafNear(n, box, false);
    if(pv && !isTag(pv, /^BR$/)) n.before(document.createElement('br'));
    if(nx && !isTag(nx, /^(BR|UL|OL)$/)) n.after(document.createElement('br'));
    unwrapKeep(n);
  });
  // 引用里夹在段落之间的散字：包成一段（浏览器并段、退格合并会造出来）
  if(el.tagName==='BLOCKQUOTE'){
    let run=null;
    [...el.childNodes].forEach(c=>{
      if(isTag(c, /^(P|UL|OL|PRE|TABLE|HR|BLOCKQUOTE)$/)){ run=null; return; }
      if(!run){
        if(c.nodeType===3 && !tidyTxt(c.nodeValue).trim()) return;
        run=document.createElement('p'); c.before(run);
      }
      run.appendChild(c);
    });
  }
  // 列表：li 以外的东西收进一条 li；li 里挨着的两张子表并成一张——写回去本来就是一张，
  // 不并的话屏幕上一条是「1.」一条是「•」，存完再开却都成了有序
  const lists=[el, ...el.querySelectorAll('ul,ol')].filter(x=>isTag(x, /^(UL|OL)$/));
  lists.forEach(list=>{
    let li=null;
    [...list.childNodes].forEach(c=>{
      if(isTag(c, /^LI$/)){ li=null; return; }
      if(c.nodeType===3 && !tidyTxt(c.nodeValue).trim()) return;
      if(!li){ li=document.createElement('li'); c.before(li); }
      li.appendChild(c);
    });
  });
  el.querySelectorAll('li').forEach(li=>{
    [...li.children].forEach(c=>{
      if(!isTag(c, /^(UL|OL)$/) || c.parentNode!==li) return;
      let nx=c.nextSibling;
      while(nx && nx.nodeType===3 && !tidyTxt(nx.nodeValue).trim()) nx=nx.nextSibling;
      while(isTag(nx, /^(UL|OL)$/)){
        while(nx.firstChild) c.appendChild(nx.firstChild);
        const gone=nx; nx=nx.nextSibling; gone.remove();
        while(nx && nx.nodeType===3 && !tidyTxt(nx.nodeValue).trim()) nx=nx.nextSibling;
      }
    });
  });
  // 行内代码：里面的格式拆掉（写不进 md），<br> 处把代码切开
  el.querySelectorAll('code').forEach(c=>{
    if(el.tagName==='PRE') return;
    c.querySelectorAll('*').forEach(x=>{ if(x.tagName!=='BR') unwrapKeep(x); });
    if(!c.querySelector('br')) return;
    const f=document.createDocumentFragment();
    let cur=null;
    [...c.childNodes].forEach(x=>{
      if(isTag(x, /^BR$/)){ cur=null; f.appendChild(x); return; }
      if(!cur){ cur=document.createElement('code'); f.appendChild(cur); }
      cur.appendChild(x);
    });
    c.replaceWith(f);
  });
  // 同名标签套同名标签（粗里又一层粗）：里面那层是多余的
  el.querySelectorAll('strong strong, em em, del del, a a').forEach(n=>{ if(el.contains(n)) unwrapKeep(n); });
  // 链接
  el.querySelectorAll('a').forEach(a=>{
    if(a.dataset.wl!==undefined){
      // 双链：class 保住（洗白以前把它剥了，一碰就存不进）；做成原子，光标进不去，
      // 末尾接着打的字落在链接外面。字跟名字对不上（老版本里打进去的字）就把多出来的挪出去
      const name=a.dataset.wl, txt=a.textContent;
      if(txt!==name){
        const at=txt.indexOf(name);
        if(at>=0){
          if(at>0) a.before(document.createTextNode(txt.slice(0, at)));
          if(at+name.length<txt.length) a.after(document.createTextNode(txt.slice(at+name.length)));
        }else if(txt.trim() && txt.length<=80 && !/[\[\]\n]/.test(txt)) a.dataset.wl=txt;
        else{ unwrapKeep(a); return; }
        a.textContent=a.dataset.wl;
      }
      if(a.childNodes.length!==1 || a.firstChild.nodeType!==3) a.textContent=a.dataset.wl;
      a.className='wl';
      a.setAttribute('contenteditable','false');
      return;
    }
    // 外来的 <a href>（拖进来的、浏览器自己造的）：地址记进 data-u，跟渲染器造的一个样
    if(!a.hasAttribute('data-u')){
      if(!a.hasAttribute('href')){ unwrapKeep(a); return; }
      a.setAttribute('data-u', a.getAttribute('href'));
    }
    a.setAttribute('target','_blank'); a.setAttribute('rel','noopener');
  });
  // 一个子节点都没有的行内壳（<strong></strong>、<code></code>）：写不进文件，屏幕上
  // 行内代码还会画出一小块底色。拿掉。只剩光标位 <br> 的那种（<li><strong><br></strong>，
  // 加粗项末回车造出来的）留着——光标在里面，接着打的字照旧是粗的
  el.querySelectorAll('strong,em,del,code,a').forEach(n=>{
    if(!n.firstChild && n.dataset.wl===undefined && el.contains(n)) n.remove();
  });
  // 相邻的同名标签并起来：<em>甲</em><em>乙</em> 写出来是 *甲**乙*——成了加粗
  el.querySelectorAll('strong,em,del,code,a').forEach(n=>{
    if(!el.contains(n) || n.dataset.wl!==undefined) return;
    let nx=n.nextSibling;
    while(nx && nx.nodeType===1 && nx.tagName===n.tagName && nx.dataset.wl===undefined
          && (n.tagName!=='A' || nx.getAttribute('data-u')===n.getAttribute('data-u'))){
      while(nx.firstChild) n.appendChild(nx.firstChild);
      const gone=nx; nx=nx.nextSibling; gone.remove();
    }
  });
  // 浏览器随手贴的 style / class 一律去掉。表格格子的 text-align 是我们自己按
  // 对齐位生成的，留着；li.task、div.tw、span.imgbad、a.wl 四个 class 同理。
  // li.task 只在真有勾选框时才保：浏览器劈 <li> 会把 class 一起抄给下半个、
  // 勾选框却留在上半个，那条骗人的 class 会让一条普通列表项一直顶着待办的样子
  // （无项目符号、flex 版式），存盘写出来却是 `- 文字`。没框就不是待办，剥掉。
  el.querySelectorAll('[style],[class],[align],[color],[face],[dir]').forEach(n=>{
    if(!/^(TD|TH)$/.test(n.tagName)) n.removeAttribute('style');
    if(!(n.tagName==='LI'&&n.classList.contains('task')
         && n.querySelector(':scope > input[type=checkbox]'))
       && !n.classList.contains('tw') && !n.classList.contains('imgbad')
       && !(n.tagName==='A' && n.dataset.wl!==undefined)
       && !(n.tagName==='IMG' && n.classList.contains('imgmiss'))) n.removeAttribute('class');
    ['align','color','face','dir'].forEach(a=>n.removeAttribute(a));
  });
  // 末尾那个 <br> 不在这里删。浏览器拿它当空段落的光标位，删了正在打字的地方
  // 就没了。它不写进文件——inlMd 出口处会去掉。
  ensureBr(el);
  return el;
}

/* 空块必须有一个 <br>，否则 WebKit 放不进光标，看起来像「回车了但光标没动」。 */
function ensureBr(el){
  if(!el || el.nodeType!==1) return el;
  if(/^(UL|OL|TABLE|THEAD|TBODY|TR|HR)$/.test(el.tagName)) return el;
  const has = (el.textContent||'').replace(/\u200b/g,'').length
           || el.querySelector('img,br,ul,ol,table,input');
  if(!has) el.appendChild(document.createElement('br'));
  return el;
}
function tidyTxt(s){ return String(s||'').replace(/[\u00a0\u3000]/g,' ').replace(/\u200b/g,''); }

/* 光标所在的可落点块。选区按这块内部的字符偏移记，不按整篇的字符数——
   空块没有字符，按整篇数会把光标送回上一块末尾。
   段落套在 li／格子／另一个段落里（粘贴、跨块格式造出来的）：按外面那一层记。
   洗白会把里面那层壳拆掉，按里层记的坐标就放不回去了。 */
function blockish(n, root){
  let topDiv=null, hit=null;
  while(n && n!==root){
    if(n.nodeType===1 && /^(P|H[1-6]|LI|TD|TH|PRE|BLOCKQUOTE)$/.test(n.tagName)){
      if(!hit) hit=n;
      else if(/^(P|H[1-6])$/.test(hit.tagName) && /^(P|H[1-6]|LI|TD|TH)$/.test(n.tagName)) hit=n;
      else break;
    }
    if(n.nodeType===1 && n.tagName==='DIV' && n.parentNode===root && !n.classList.contains('tw')) topDiv=n;
    n=n.parentNode;
  }
  return hit || topDiv;
}
function pathFrom(root, el){
  const path=[];
  let n=el;
  while(n && n!==root){
    const p=n.parentNode; if(!p) break;
    path.unshift([...p.children].indexOf(n));
    n=p;
  }
  return path;
}
function elAtPath(root, path){
  let el=root;
  for(const i of (path||[])){
    if(!el || !el.children || i<0 || i>=el.children.length) return null;
    el=el.children[i];
  }
  return el;
}

/* 洗白会换掉节点，光标就散了。按「哪一块 + 块内第几个字符」记，
   DIV 换成 P、空段加 <br> 都不影响这个坐标。 */
function saveSel(md){
  /* 焦点在块源码框里：正文的选区不归这里管，不记、也就不放回。以前存盘前洗白（tidyDirty）照样记下、放回，
     放回那一下把焦点从框里拽到正文——框失焦就收了，接着按的 Esc 落到「放弃修改」上（K 轮随机会话种子 304，
     H 轮起就有） */
  const ae=document.activeElement;
  if(ae && ae.tagName==='TEXTAREA' && md.contains(ae)) return null;
  const s=getSelection();
  if(!s || !s.rangeCount || !md.contains(s.anchorNode)) return null;
  const r=s.getRangeAt(0);
  const blk=blockish(r.startContainer, md);
  const pre=r.cloneRange();
  if(blk){
    pre.selectNodeContents(blk); pre.setEnd(r.startContainer, r.startOffset);
    return {
      path: pathFrom(md, blk),
      at: pre.toString().length,
      len: r.toString().length,
      empty: !tidyTxt(blk.textContent).length
    };
  }
  pre.selectNodeContents(md); pre.setEnd(r.startContainer, r.startOffset);
  return {at: pre.toString().length, len: r.toString().length, empty:false};
}
function restoreSel(md, m){
  if(!m) return;
  if(m.path){
    const el=elAtPath(md, m.path);
    if(!el) return;
    if(m.empty || !tidyTxt(el.textContent).length){
      ensureBr(el);
      caretEnd(el, true);
      return;
    }
    if(!caretAtOffset(el, m.at)) return;
    if(!m.len) return;
    const s=getSelection(); if(!s || !s.rangeCount) return;
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let seen=0, n, endAt=m.at+m.len, b=null;
    while((n=w.nextNode())){
      const e=seen+n.nodeValue.length;
      if(endAt<=e){ b=[n, endAt-seen]; break; }
      seen=e; b=[n, n.nodeValue.length];
    }
    if(!b) return;
    try{
      const r=s.getRangeAt(0);
      r.setEnd(b[0], Math.max(0, Math.min(b[1], b[0].nodeValue.length)));
      s.removeAllRanges(); s.addRange(r);
    }catch(e){}
    return;
  }
  const w=document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
  let seen=0, a=null, b=null, n;
  while((n=w.nextNode())){
    const end=seen+n.nodeValue.length;
    if(!a && m.at<=end) a=[n, m.at-seen];
    if(!b && m.at+m.len<=end){ b=[n, m.at+m.len-seen]; break; }
    seen=end;
  }
  if(!a) return;
  try{
    const r=document.createRange();
    r.setStart(a[0], Math.max(0, Math.min(a[1], a[0].nodeValue.length)));
    if(b) r.setEnd(b[0], Math.max(0, Math.min(b[1], b[0].nodeValue.length)));
    else r.collapse(true);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}

/* ── 重画正文 ─────────────────────────── */
function paintWork(t){
  const p=paneOf(t); if(!p) return;
  const top=p.scrollTop;
  unwatch(t);                                   // 整篇重画会炸出成千上万条变更记录
  const md=p.querySelector('.md');
  undecorateHistory(md);
  renderMd(md, t.editing ? t.work : t.raw, dirOf(t.path));
  if(!t.editing) decorateHistory(md, t);
  applyPref();
  drawDocMeta(t);
  p.scrollTop=top;
}

/* ── 改动跟踪 ───────────────────────────
   哪一块被动过就给哪一块盖 data-dirty，出去的时候只有盖了章的才反解。 */
function unwatch(t){ if(t.mo){ t.mo.disconnect(); t.mo=null; } }

function watchEdits(t){
  unwatch(t);
  const p0=paneOf(t); if(!p0) return;            // 标签已经关了（移到废纸篓那条路）
  const md=p0.querySelector('.md');
  const top=n=>{
    while(n && n!==md && n.parentNode && n.parentNode!==md) n=n.parentNode;
    return (n && n!==md && n.parentNode===md && n.nodeType===1 && !n.dataset.chrome) ? n : null;
  };
  const hit=[];
  const mark=n=>{ const b=top(n); if(b){ b.dataset.dirty='1'; hit.push(b); } };
  t.mo=new MutationObserver(ms=>{
    hit.length=0;
    const stray=[];
    ms.forEach(m=>{
      mark(m.target);
      m.addedNodes.forEach(mark);
      // 正文根上冒出来的散字（不在任何块里）：序列化只认块，它一存就没了——下面包成一段
      [m.target, ...m.addedNodes].forEach(n=>{
        if(n && n.nodeType===3 && n.parentNode===md && tidyTxt(n.nodeValue).trim()) stray.push(n);
      });
    });
    t.touched=true;
    // 洗白要等这一轮变更记录处理完再做，不然会跟浏览器自己的编辑动作打架。
    // 洗之前把光标位置记下来，洗完放回去——换节点会把光标弄丢。
    // 拼音打到一半不能洗：换节点、重设 Range 会打断输入法组合，
    // 表现是候选框消失、半截拼音上屏。
    const list=[...new Set(hit)];
    if(list.length || stray.length) requestAnimationFrame(()=>{
      if(COMPOSING) return;
      // 这一帧之间编辑态可能已经收了（收编辑、关标签、移到废纸篓），
      // 那就什么都别做：面板都拆了，洗块和重挂观察器全是空转
      if(!t.editing || !paneOf(t)) return;
      unwatch(t);
      const before=md.innerHTML, keep=saveSel(md);
      wrapStray(md, stray);
      list.forEach(b=>{ if(b.isConnected) cleanBlock(b); });
      if(md.innerHTML!==before) restoreSel(md, keep);
      watchEdits(t);
      syncPh(t);
      if(t.id===curTab && !COMPOSING) syncTabTitle(t);
    });
    if(t.id===curTab) olKick();                  // 标题改了，大纲停手 300 毫秒跟上
    autoKick(t);                                 // 停笔两秒自动落盘
  });
  t.mo.observe(md, {subtree:true, childList:true, characterData:true});
}

/* 正文根上的散字（全选删光再打、某些撤销会造出来）：不在任何块里，序列化只认块，
   一存就没了，壳退出也不拦。连同后面挨着的行内内容一起包成一段。 */
function wrapStray(md, nodes){
  nodes.forEach(n=>{
    if(n.parentNode!==md || !tidyTxt(n.nodeValue).trim()) return;
    const p=document.createElement('p'); p.dataset.dirty='1';
    n.before(p);
    let x=p.nextSibling;
    while(x && (x.nodeType===3 || (x.nodeType===1 && !TOP_BLOCK.test(x.tagName)
                                  && x.tagName!=='TEXTAREA' && !x.dataset.chrome))){
      const nx=x.nextSibling; p.appendChild(x); x=nx;
    }
    cleanBlock(p);
  });
}

/* ── 进编辑前的准备 ─────────────────────
   反解不回 markdown 的块锁住，只能按源码改（v10 的老路）。
   显示层的包装（文档历史折叠）必须先拆干净：台账按 .md 的直接子节点建，
   包装盒会把那张表挤出直接子节点，一拆一存就对不回原文。 */
function prepEdit(t){
  const p=paneOf(t), md=p.querySelector('.md'), base=dirOf(t.path);
  undecorateHistory(md);
  buildRegistry(t);
  let lock=0;
  [...md.children].forEach(el=>{ if(el.nodeType===1) lock+=prepBlock(el, base); });
  md.setAttribute('contenteditable','true');
  md.spellcheck=false;
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  watchEdits(t);
  t.lock=lock;
  syncPh(t);
}

/* 进编辑时一块的准备：反解不回的锁住（返回 1），能编辑的把双链做成原子。块源码框收起、
   就地换上新渲染的那几块时也走这里（closeSrcBlk）。 */
function prepBlock(el, base){
  if(el.dataset.chrome){ el.contentEditable='false'; return 0; }
  if(safeBlock(el, base)){
    el.removeAttribute('data-lock'); el.removeAttribute('contenteditable');
    // 双链做成原子（同图片）：光标进不去，末尾接着打的字落在链接外面。以前落进 <a>，
    // 序列化只认 data-wl，那几个字存不进、退出也不拦。新冒出来的双链由 cleanBlock 补上
    el.querySelectorAll('a[data-wl]').forEach(a=>a.setAttribute('contenteditable','false'));
    return 0;
  }
  el.setAttribute('data-lock','1'); el.setAttribute('contenteditable','false');
  return 1;
}

/* 光标落到某一块的末尾（atStart 则到开头）。空块先补 <br> 再放光标。 */
function caretEnd(el, atStart){
  if(!el) return;
  let tgt = el.tagName==='UL'||el.tagName==='OL' ? (el.querySelector('li')||el) : el;
  /* 待办项：光标要落进那个 <span>，不能停在 li 自己身上。停在 li 上（offset 0）
     打的字会变成 <input> **前面**一个裸文本节点——排版上正文跑到勾选框左边去，
     而 listMd 照样收得进来，文件里一个字不差，所以只有肉眼能发现。
     空待办项特别容易踩：restoreSel 见块内没有文字就走 caretEnd(el, true)，
     而 li.task 的文字全在 span 里、input 不贡献 textContent，
     一条刚建出来的空待办永远判成「空块」。 */
  if(tgt.tagName==='LI' && tgt.classList.contains('task'))
    tgt = tgt.querySelector(':scope > span') || tgt;
  ensureBr(tgt);
  try{
    const r=document.createRange();
    const last=tgt.lastChild;
    /* 落到块尾、最后一个是占位 <br>：停在它前面，别停在它后面。
       停在后面的话 Chromium 组字时首字母会被单独提交出去（「- 」后打拼音得到「n你好」，
       A 报告 R9），WebKit 里打的字也会落到 <br> 之后的新一行上。 */
    if(!atStart && last && last.nodeType===1 && last.tagName==='BR') r.setStartBefore(last);
    else r.selectNodeContents(tgt);
    r.collapse(!!atStart);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
/* 选中一块里的文字（不含末尾那个当光标位的 <br>）。新建笔记用来圈住默认标题。 */
function caretSelect(el){
  if(!el) return;
  try{
    const texts=[];
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n; while((n=w.nextNode())) if(n.nodeValue) texts.push(n);
    const r=document.createRange();
    if(texts.length){
      r.setStart(texts[0], 0);
      const last=texts[texts.length-1];
      r.setEnd(last, last.nodeValue.length);
    }else{
      ensureBr(el);
      r.selectNodeContents(el);
    }
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
function isBlankBlock(el){
  if(!el || el.nodeType!==1) return true;
  if(el.querySelector('img,table,ul,ol,pre')) return false;
  return !tidyTxt(el.textContent).trim();
}
/* 空标题、文首空段叠一层占位。data-ph 不进序列化（normHtml 会剥掉）。 */
function syncPh(t){
  const p=t&&paneOf(t); if(!p || !t.editing || p.classList.contains('src')) return;
  const md=p.querySelector('.md'); if(!md) return;
  const kids=[...md.children].filter(el=>el.nodeType===1 && el.tagName!=='TEXTAREA' && !el.dataset.chrome);
  kids.forEach(el=>el.removeAttribute('data-ph'));
  const h1=kids[0] && kids[0].tagName==='H1' ? kids[0] : null;
  if(h1 && isBlankBlock(h1)) h1.setAttribute('data-ph','1');
  const para=kids.find(el=>el.tagName==='P');
  const rest=kids.filter(el=>el!==h1 && el!==para);
  if(para && isBlankBlock(para) && rest.every(isBlankBlock)) para.setAttribute('data-ph','1');
}
function syncTabTitle(t){
  if(!t || t.ext) return;
  const md=paneOf(t)&&paneOf(t).querySelector('.md');
  const h1=md && md.firstElementChild && md.firstElementChild.tagName==='H1'
    ? tidyTxt(md.firstElementChild.textContent).trim() : '';
  const title=h1 || TR('无标题');
  if(t.title===title) return;
  t.title=title;
  const e=ensureStack(t); if(e && e.kind==='md') e.title=title;
  drawTabs();
  lastNat='';
  syncNative();
  syncChrome();
}
function caretAtStart(el){
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed || !el) return false;
  const r=s.getRangeAt(0);
  if(!el.contains(r.startContainer) && r.startContainer!==el) return false;
  const pre=r.cloneRange();
  pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return !pre.toString();
}

/* 当前光标所在的顶层块 */
function curBlock(t){
  const p=paneOf(t); if(!p) return null;
  const md=p.querySelector('.md'), s=getSelection();
  if(!s || !s.rangeCount) return null;
  let n=s.getRangeAt(0).startContainer;
  if(!md.contains(n)) return null;
  while(n && n.parentNode && n.parentNode!==md) n=n.parentNode;
  return (n && n.parentNode===md && n.nodeType===1 && !n.dataset.chrome) ? n : null;
}

/* 进编辑之后光标到底在不在正文里。v27「打不了字」的病根就是这一条没成立：
   选区还留在别处，看着进了编辑态，键盘敲进去没有插入点。
   判据：选区存在、且落在 #doc（当前这一份的正文）里面。 */
function caretInDoc(){
  const doc=$('#doc'); if(!doc) return false;
  const s=getSelection();
  if(!s || !s.rangeCount) return false;
  const n=s.getRangeAt(0).startContainer;
  return !!(n && doc.contains(n));
}
/* 兜底：不在就 focus 正文，把光标放到第一个可编辑块的末尾。 */
function ensureCaret(t){
  if(caretInDoc()) return true;
  const p=paneOf(t); if(!p) return false;
  const md=p.querySelector('.md');
  md.focus();
  const first=[...md.children].find(el=>el.nodeType===1 && !el.hasAttribute('data-lock')
                                        && el.tagName!=='TEXTAREA');
  if(first) caretEnd(first);
  else{
    const np=document.createElement('p'); np.dataset.dirty='1';
    md.appendChild(np); caretEnd(np);
  }
  return caretInDoc();
}

/* ── 块级源码 ───────────────────────────
   锁住的块只能走这条；没锁的块按 ⌥⌘E 也能走，想直接写 markdown 的时候用。
   改完是**把这一块在台账里的源码换掉**，不是反解——所以按源码改的块，
   写出去还是你亲手打的那几行字节。 */
function openSrcBlk(t, el){
  if(!el || el.tagName==='TEXTAREA') return null;
  const base=dirOf(t.path), md=paneOf(t).querySelector('.md');
  let bid=blockBid(t, el);
  // 块号重了（浏览器劈段抄过去的）：这一块按新块算，不跟另一半抢台账里那一份
  if(bid!==null && [...md.children].some(c=>c!==el && blockBid(t, c)===bid)) bid=null;
  const clean=bid!==null && !el.dataset.dirty;
  /* 框里放什么：没动过的块——台账里的原文；动过的块——它眼下该写进文件的 md（自检结论）；
     存不进的块——尽力写出来的草稿 md（一个字不丢，结构是能存下来的那种），收起就照它重画、照常存（I 轮）。
     框开着的时候：存不进的那块照样算存不进（整篇先不写）；动过的照开框那一刻的样子写（ta._md）。 */
  const v=clean ? null : blockPlan(el, base);
  const src=clean ? t.reg.blocks[bid].src.join('\n') : String(v.md==null ? '' : v.md);
  const ta=document.createElement('textarea');
  ta.className='blk mono'; ta.value=src; ta.spellcheck=false;
  ta._orig=el;                                   // 不改就收起（Esc）：原样放回去，脏标记、没存进去的改动都在
  ta._init=src;                                  // 框里的字有没有改过，跟它比
  if(v){ if(v.stuck) ta._stuck=true; else ta._md=src; }
  ta.setAttribute('contenteditable','false');    // 别让外面那层 contenteditable 接管
  if(bid!==null){
    ta.dataset.bid=bid; ta.dataset.be=t.regEpoch;
    // 这一块往后接着谁、中间空几行：框里的字收起来变成几块时，最后一块接上它（见 srcBlkCommit）
    ta._out={gap:t.reg.blocks[bid].gap, nx:t.reg.blocks[bid].nx};
  }
  ta._fit=()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+1)+'px'; };
  /* 框里打字也是改动（J 轮，R 终审 P2-1）：dirty 为真，关标签、⌘W、退出都会拦。改动观察器看不见
     textarea 的 value，以前框里打了字 dirty 还是假，⌘W 不问就关、框里的字没了。
     停笔照常自动存：框开着的这一块照开框那一刻（或 ⌘S 落下的那一份）写，框里正打着的半截字不写；
     存完只要框里还有没落的字，dirty 就一直为真（见 srcBlkPending）。 */
  ta.addEventListener('input', ()=>{ ta._fit(); t.touched=true; autoKick(t); });
  ta.addEventListener('keydown', e=>{
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeSrcBlk(t, ta, false); }
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); closeSrcBlk(t, ta, true, true); }
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart, x=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(x);
      ta.selectionStart=ta.selectionEnd=s+2; ta._fit();
      t.touched=true; autoKick(t);                // 改 value 不发 input，这里补上
    }
  });
  ta.addEventListener('blur', ()=>{ if(!ta.dataset.closing) closeSrcBlk(t, ta, true); });
  unwatch(t);
  el.replaceWith(ta);
  watchEdits(t);
  ta._fit(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  syncStatusLine();
  return ta;
}
/* 框里的字落回台账、渲染成几块（收起、或者框开着时按 ⌘S）。渲染出来的块不盖脏：下一次存盘
   按台账原样写，不反解——锁住的块、写法特别的块，改完源码照样存得进；锁、双链原子、坏图占位
   照进编辑时那样准备好。
   **每一块各登记一份台账原文**（J 轮，R 终审 P1-1）：md2html 给的 data-l0／l1 是每块在框里的
   行号，按它把框里的字切开。头一块接着用框原来的块号（框没块号就在台账末尾补），后面几块在台账
   末尾各补一份；块与块之间框里那几行空白记进 gap、nx 指着下一块；最后一块接上开框那一刻这一块
   往后的那一截（ta._out），跟后文之间的空白照旧。框里头一块前面、末一块后面不成块的那几行
   （多打的空行之类）并进头一块／末一块，一个字节不丢。
   以前（H、I）几块共用一份台账：其中一块被删掉、或者被单独开框改过以后，剩下没动的那块把整份
   原文抄进文件——删掉的段还在、改过的段旧版本也在，胶囊照样说已保存。
   框记下头一块的块号（下一次落还从它起）和末一块的块号（ta._last：框开着时往后接空白按它算）。
   落之前先过 srcBlkFits（K 轮）：框里的字放回整篇以后渲染出来得还是框里单独渲染的那几块；
   不是就不落，返回 null（原因记在 ta._why），台账、屏幕一样都不动。 */
function srcBlkCommit(t, ta, text){
  const base=dirOf(t.path), reg=t.reg, box=document.createElement('div');
  box.innerHTML=md2html(text, base, 0);
  const made=[...box.children], lines=text.split('\n'), out=ta._out || {gap:null, nx:null};
  const fit=srcBlkFits(t, ta, text, made);
  if(!fit.ok){ ta._why=fit; return null; }
  wireImg(box);
  const head=blockBid(t, ta);
  if(!made.length){
    // 渲染不出块（删空了、只剩空行）：这一块没了。台账里那一份留着框里的字，没有块指着它就不会写出去
    if(head!==null) reg.blocks[head].src=lines;
    ta._last=null;
    return made;
  }
  // 跟前一块之间一个空行都没有、放回去会连成一块：补的那个空行记进前一块往后的空白（同屏幕上是两块）
  if(fit.pad && fit.inLink && fit.inLink.nx===head && fit.inLink.gap && !fit.inLink.gap.length) fit.inLink.gap=[''];
  const span=made.map(m=>[+m.getAttribute('data-l0'), +m.getAttribute('data-l1')]);
  const bids=made.map((m,i)=>{
    if(i===0 && head!==null) return head;
    reg.blocks.push({src:[], gap:null, nx:null});
    return reg.blocks.length-1;
  });
  made.forEach((m,i)=>{
    const end=i===made.length-1;
    const b=reg.blocks[bids[i]];
    b.src=lines.slice(i===0 ? 0 : span[i][0], end ? lines.length : span[i][1]+1);
    // 末一块跟后一块之间同理：要补空行的话补在这里
    if(end){ b.gap=(fit.pad && out.gap && !out.gap.length) ? [''] : out.gap; b.nx=out.nx; }
    else{ b.gap=lines.slice(span[i][1]+1, span[i+1][0]); b.nx=bids[i+1]; }
    m.removeAttribute('data-l0'); m.removeAttribute('data-l1');
    m.dataset.bid=bids[i]; m.dataset.be=t.regEpoch;
    prepBlock(m, base);
  });
  ta.dataset.bid=bids[0]; ta.dataset.be=t.regEpoch;
  ta._last=bids[bids.length-1];
  return made;
}
/* 框里的字有没有开了头、没收尾的代码围栏：按 md2html 同一套规则（fenceOpen／fenceClose）从头扫，
   返回第一道没收尾的（{ch, n}），都收了返回 null。波浪线开头在框里找不到收尾也算没收尾——单看框里
   它不算围栏（fenceAt 要后面找得到收尾，屏幕上是一段带删除线的字），放回整篇以后后文只要还有一行
   ~~~ 就配上了，中间全成代码（R 终审 P1-J1 的 K13、种子 140：收尾行被改成「~~~改」）。 */
function openFence(lines){
  for(let i=0; i<lines.length; i++){
    const fo=fenceOpen(lines[i]);
    if(!fo) continue;
    let j=i+1;
    while(j<lines.length && !fenceClose(lines[j], fo)) j++;
    if(j>=lines.length) return fo;
    i=j;
  }
  return null;
}
/* 框里的字落回原处以后，整篇渲染出来是不是还是框里单独渲染的那几块（K 轮，R 终审 P1-J1）。
   H 轮起框是就地换：框里的 md 只按自己那几行渲染，屏幕上看着是那样；可文件里这几行夹在整篇中间，
   跟前后文一起渲染——代码围栏没收尾就把后文吞成代码（K12、K13、种子 140），跟上一块／下一块之间
   一个空行都没有时会连成一段、并成一张表（标题改成正文、段落改成列表项……）。所以落之前先用
   bodyPlan 把「落下以后的整篇」排一遍、md2html 渲染出来，看框那几行：有没有块跨在框的边上、
   框里那几行是不是还是这几块（visSig）。
   · 围栏没收尾（openFence）：不落，{ok:false, fence}——提示补上收尾那一行；
   · 只是跟前后文挨得太紧：挨着的地方补一个空行（pad）再看，过了就带着 pad 落——只多一个空行，
     跟屏幕上一样是分开的两块；
   · 还是对不上（比如前文有一行 ~~~ 会被框里的围栏配上、框在文首被当成文件开头的属性区）：不落，{ok:false}。
   没改过的框、Esc 收起不走这里（原样放回，字节不变）。 */
function srcBlkFits(t, ta, text, made){
  const lines=text.split('\n');
  const fo=openFence(lines);
  if(fo) return {ok:false, fence:fo};
  if(!made.length) return {ok:true};
  const base=dirOf(t.path), want=visSig(made);
  const probe={ta, lines, link:ta._out || null, pad:false};
  const fits=()=>{
    const plan=bodyPlan(t, null, false, probe);
    if(plan.at<0) return {ok:true, inLink:plan.inLink};
    const A=plan.at, B=plan.at+lines.length-1;
    const box=document.createElement('div');
    box.innerHTML=md2html(plan.text, base);
    const inside=[];
    for(const r of box.children){
      if(!r.hasAttribute('data-l0')) continue;
      const l0=+r.getAttribute('data-l0'), l1=+r.getAttribute('data-l1');
      if(l1<A || l0>B) continue;
      if(l0<A || l1>B) return null;                // 有一块跨在框的边上：放回去会跟前后文连成一块
      inside.push(r);
    }
    return visSig(inside)===want ? {ok:true, inLink:plan.inLink} : null;
  };
  let r=fits();
  if(r) return r;
  probe.pad=true;
  r=fits();
  if(r){ r.pad=true; return r; }
  return {ok:false, fence:null};
}
/* 框收不了（srcBlkFits 不过）：框留着、框里的字一个不动，提示一句怎么办，框闪一下。 */
function srcBlkRefuse(t, ta){
  const f=ta._why || {};
  notify(f.fence ? TR('代码块还没收尾，补上一行 {fence} 再收起',{fence:f.fence.ch.repeat(f.fence.n)})
                 : TR('放回原处会跟前后文连成一块，存下去跟现在看到的不一样，改一改再收起'));
  ta.classList.add('stuckflash');
  setTimeout(()=>ta.classList.remove('stuckflash'), 1800);
}
/* 框里有没有还没落的字（打了、还没 ⌘↩／⌘S／点到别处）。有就算没存完：dirty 一直为真，
   关标签、⌘W、退出都拦（J 轮，R 终审 P2-1）。 */
function srcBlkPending(t){
  const p=t && paneOf(t); if(!p) return false;
  return [...p.querySelectorAll('.md > textarea.blk')].some(ta=>ta.value!==ta._init);
}
/* 框开着时按 ⌘S：先把框里的字落回去（框不收），再存。之后 Esc 放回去的是落过的这一份；
   框开着的这段时间存盘照落下的这一份写（ta._md，往后接空白按 ta._last）。
   没改过、本来也存得进的框不用落（照台账／开框那一刻的样子写）。
   落不下（srcBlkFits，K 轮）：框里的字不落，这一块照旧按没收起算（I 轮口径：照开框那一刻或上一次
   落下的样子写，框里的字没存、dirty 为真），返回 false，saveEdit 存完别的再提示。 */
function commitSrcBlk(t, ta){
  if(!ta || !ta.isConnected || (ta.value===ta._init && !ta._stuck)) return true;
  const text=ta.value.replace(/\r\n/g,'\n');
  const made=srcBlkCommit(t, ta, text);
  if(!made) return false;
  ta._orig=made;
  ta._init=ta.value; ta._stuck=false; ta._md=text;
  t.touched=true;
  return true;
}
/* 收起块源码框。keep＝要框里的字（⌘↩、点到别处）；explicit＝⌘↩ 明说的。
   就地换，不整篇重画（H 轮起）：只换这一块，别的块（包括存不进的那几块）一动不动。
   Esc，或者没改过就收起：原样放回原来那一块——这一块不算动过，字节不变（I 轮：以前会被重新反解，
   `* ` 列表变成 `- `）。存不进的块、开框时就动过的块，⌘↩ 就是认了框里那一份：照它重画、照常存。
   落不下（srcBlkFits，K 轮：围栏没收尾、放回去会跟前后文连成一块）：⌘↩、点到别处都不收，框留着，提示。 */
function closeSrcBlk(t, ta, keep, explicit){
  if(!ta || !ta.isConnected) return;
  ta.dataset.closing='1';
  // 编辑态已经收了（关标签点「不保存并关闭」、放弃修改）：框跟着面板一起没，别再往台账里落（台账已经清了，
  // 以前这里会抛 TypeError——框失焦是在收编辑态之后才来的）
  if(!t.editing || !t.reg) return;
  const p=paneOf(t), top=p.scrollTop;
  const commit=keep && (ta.value!==ta._init || (explicit && (ta._stuck || ta._md!=null)));
  let made=null;
  if(commit){
    made=srcBlkCommit(t, ta, ta.value.replace(/\r\n/g,'\n'));
    if(!made){ delete ta.dataset.closing; srcBlkRefuse(t, ta); return; }
  }
  unwatch(t);
  if(!commit){
    const orig=[].concat(ta._orig||[]);
    if(orig.length) ta.replaceWith(...orig); else ta.remove();
  }else{
    if(made.length) ta.replaceWith(...made); else ta.remove();
    t.touched=true;
  }
  watchEdits(t);
  p.scrollTop=top;
  buildToc(); syncProg();
  syncStatusLine(); autoKick(t);
}
/* ── 排版动作 ───────────────────────────
   都走「拿到这一块的纯文本 → 按新的块类型重新渲染一块 → 换上去」这条，
   不去手搓 DOM，样子一定跟正常渲染出来的一致。 */
/* 插入表格时垫的表头。这是要写进 .md 文件的字节，跟界面语言走，
   但不走词典——伪翻译、缺译都不该落到磁盘上。 */
const TABLE_HEAD = LANG==='en' ? '| Item | Note |'
                 : LANG==='zh-HK' ? '| 項目 | 備註 |' : '| 项目 | 备注 |';
const MARK={p:'', h1:'# ', h2:'## ', h3:'### ', h4:'#### ',
            h5:'##### ', h6:'###### ',
            quote:'> ', ul:'- ', ol:'1. ', task:'- [ ] '};

const plainOf = el => blkMdRaw(el)
  .replace(/^#{1,6}\s+/,'')
  .replace(/^>\s?/,'')
  .replace(/^([-*+]|\d+[.)])\s+/,'')
  .replace(/^\[[ xX]\]\s+/,'')
  .replace(/^`{3,}[^\n]*\n?/,'').replace(/\n?`{3,}\s*$/,'');

function retype(t, el, kind, text){
  if(!el) return null;
  const body = text!==undefined ? text : plainOf(el);
  const src = kind==='pre'   ? '```\n'+body+'\n```'
            : kind==='hr'    ? '---'
            : kind==='table' ? TABLE_HEAD+'\n| --- | --- |\n|  |  |'
            : (MARK[kind]||'') + body;
  const box=document.createElement('div');
  box.innerHTML=md2html(src.trim()?src:' ', dirOf(t.path), 0);
  const made=box.firstElementChild || document.createElement('p');
  made.dataset.dirty='1';
  delete made.dataset.bid; delete made.dataset.be;
  t.touched=true; autoKick(t);
  if(/^(ul|ol|task)$/.test(kind)){
    const li=made.querySelector('li');
    const want=kind==='ol'?'OL':'UL';
    const prev=el.previousElementSibling;
    const next=el.nextElementSibling;
    const joinNext = host => {
      if(!(li && next && next.isConnected && next.tagName===want && !next.hasAttribute('data-lock'))) return;
      [...next.children].forEach(n=>host.appendChild(n));
      next.remove();
      host.dataset.dirty='1';
    };
    if(li && prev && prev.tagName===want && !prev.hasAttribute('data-lock')){
      prev.appendChild(li);
      prev.dataset.dirty='1';
      el.remove();
      // 后面紧挨着的同类表也并进来。列表中间按两下回车退出、再打「- 」接回去时，
      // 以前只并上一张，列表永久劈成两段，有序的后半张从 1 重数（A 报告 R4）
      joinNext(prev);
      ensureBr(li);
      caretEnd(li);
      return prev;
    }
    el.replaceWith(made);
    joinNext(made);
    if(li){ ensureBr(li); caretEnd(li); } else caretEnd(made);
    return made;
  }
  el.replaceWith(made);
  caretEnd(made);
  return made;
}

/* 列表进退层级。不用 execCommand('indent')：WebKit 常包一层 blockquote，
   反解会丢掉 `- ` 前缀，存盘后列表项变成引用。 */
function indentLi(t, li){
  if(!li) return;
  const prev=li.previousElementSibling;
  if(!prev || prev.tagName!=='LI') return;
  const list=li.parentElement;
  const tag=list.tagName;
  let sub=[...prev.children].reverse().find(c=>c.tagName===tag);
  if(!sub){ sub=document.createElement(tag.toLowerCase()); prev.appendChild(sub); }
  sub.appendChild(li);
  const top=list.closest('.md>*')||list; top.dataset.dirty='1';
  t.touched=true; autoKick(t);
  caretEnd(li);
}
/* 后面那些兄弟。不能写成 while (el.nextElementSibling) rest.push(...)：
   只读不挪的话下一兄弟永远还是它，空项夹在中间一按删除就卡死。 */
function nextSiblings(el){
  const rest=[];
  for(let n=el.nextElementSibling; n; n=n.nextElementSibling) rest.push(n);
  return rest;
}
function outdentLi(t, li){
  if(!li) return false;
  const list=li.parentElement;
  const parentLi=list && list.parentElement;
  if(!parentLi || parentLi.tagName!=='LI') return false;
  const rest=nextSiblings(li);
  parentLi.after(li);
  if(rest.length){
    let sub=[...li.children].reverse().find(c=>c.tagName===list.tagName);
    if(!sub){ sub=document.createElement(list.tagName.toLowerCase()); li.appendChild(sub); }
    rest.forEach(n=>sub.appendChild(n));
  }
  if(!list.children.length) list.remove();
  const top=li.closest('.md>*'); if(top) top.dataset.dirty='1';
  t.touched=true; autoKick(t);
  caretEnd(li);
  return true;
}
function liftLiToP(t, li){
  const list=li.parentElement; if(!list) return;
  // 这一条在表里排第几：拆有序表时后半张接着原来的号，别从 1 重数（A 报告 R4）
  const k=[...list.children].filter(n=>n.tagName==='LI').indexOf(li);
  const rest=nextSiblings(li);
  const p=document.createElement('p');
  p.dataset.dirty='1';
  while(li.firstChild){
    const c=li.firstChild;
    if(c.nodeType===1 && /^(UL|OL|INPUT)$/.test(c.tagName)) break;
    p.appendChild(c);
  }
  ensureBr(p);
  // 劈出来的几块带上原表的块号（跟浏览器劈段一样抄过去）：块号一重，每一块都按眼前的样子写，
  // 台账里原表那一份谁也不抄（见 bodyPlan）
  const bid=list.dataset.bid, be=list.dataset.be;
  if(bid!==undefined){ p.dataset.bid=bid; if(be!==undefined) p.dataset.be=be; }
  li.remove();
  if(!list.children.length) list.replaceWith(p);
  else { list.dataset.dirty='1'; list.after(p); }
  if(rest.length){
    const nx=document.createElement(list.tagName);
    nx.dataset.dirty='1';
    if(bid!==undefined){ nx.dataset.bid=bid; if(be!==undefined) nx.dataset.be=be; }
    if(list.tagName==='OL'){
      const st=+(list.getAttribute('start')||1)+Math.max(0, k);
      if(st!==1) nx.setAttribute('start', String(st));
    }
    rest.forEach(n=>nx.appendChild(n));
    p.after(nx);
    // 首项退出、后面的全搬走了：原表空着别留在 DOM 里——之后在这一段打「- 」
    // 会并进这张空表、后半张不并，又劈成两段（A 报告 R5）
    if(list.isConnected && !list.children.length) list.remove();
  }
  t.touched=true; autoKick(t);
  caretEnd(p, true);
}
function exitOrOutdentLi(t, li){
  if(outdentLi(t, li)) return;
  liftLiToP(t, li);
}
/* 待办项上回车 → 下一条还是待办。
   不接住的话落到 contenteditable 的默认行为：WebKit 把 <li> 从光标处劈开，
   <input> 在光标之前、留在上半个 li 里，新起的那个继承了 class="task" 却
   没有勾选框——看着是一条悬空的文字（li.task 是 flex 且 list-style:none，
   连项目符号都没有），存盘时 listMd 看 cb 为 null，写出来是普通列表项 `- 文字`。
   光标后面的文字跟着搬进新项；li 下面挂着的子列表留在原处不动。
   空待办项上回车不走这里——上面那条空 li 分支先接走了，跟普通列表一样退出列表。 */
function splitTaskLi(t, li){
  const span=li.querySelector(':scope > span') || li;
  let tail=null;
  try{
    const s=getSelection(), r=s.getRangeAt(0), rr=r.cloneRange();
    rr.selectNodeContents(span);
    /* 选中几个字再回车：跟别处一样，那几个字先被删掉，再从光标处劈开。
       只搬「选区之后」的话选中的内容会原地留下（审查 S9）。
       整个选区落在这一条的正文里才这么办——跨到别的 li 的选区一律沿老路
       （从选区末尾切），deleteContents 会一路删过去，连勾选框一起带走。 */
    const inSpan=span.contains(r.commonAncestorContainer);
    if(inSpan){
      if(!r.collapsed) r.deleteContents();      // 删完 r 自己收成光标，下面那句拿的就是光标位置
      rr.setStart(r.startContainer, r.startOffset);
    }else{
      rr.setStart(r.endContainer, r.endOffset);
    }
    tail=rr.extractContents();
  }catch(e){}
  const nl=document.createElement('li');
  nl.className='task';
  const cb=document.createElement('input');
  cb.type='checkbox';                            // 新起的一条永远是没勾的
  const sp=document.createElement('span');
  if(tail) sp.appendChild(tail);
  nl.appendChild(cb); nl.appendChild(sp);
  ensureBr(sp); ensureBr(span);
  li.after(nl);
  const top=li.closest('.md>*'); if(top) top.dataset.dirty='1';
  t.touched=true;
  caretEnd(sp, true);
  autoKick(t);                                   // 观察器没开 attributes，新 input 靠这一句推
}
/* 空项上按删除：只拿掉这一条，光标落到上一条末尾。不要做出缩——
   夹在中间的空项做出缩会把后面整段列表拖走，而且原先那圈兄弟会卡死。 */
function removeEmptyLi(t, li){
  const list=li.parentElement; if(!list) return;
  const prev=li.previousElementSibling;
  const parentLi=list.parentElement && list.parentElement.tagName==='LI' ? list.parentElement : null;
  li.remove();
  t.touched=true; autoKick(t);
  if(list.children.length){
    const top=list.closest('.md>*')||list;
    top.dataset.dirty='1';
    if(prev) caretEnd(prev);
    else{
      const first=[...list.children].find(n=>n.tagName==='LI');
      if(first) caretEnd(first, true);
    }
    return;
  }
  if(parentLi){
    const top=parentLi.closest('.md>*');
    list.remove();
    if(top) top.dataset.dirty='1';
    caretEnd(parentLi);
    return;
  }
  const p=document.createElement('p');
  p.dataset.dirty='1';
  ensureBr(p);
  list.replaceWith(p);
  caretEnd(p, true);
}

/* 行内标记。已经在这个标记里就取消，跟加粗按钮该有的行为一致。 */
function closestTag(n, tag){
  while(n && n.nodeType!==9){
    if(n.nodeType===1 && n.tagName===tag) return n;
    if(n.nodeType===1 && n.classList && n.classList.contains('md')) return null;
    n=n.parentNode;
  }
  return null;
}
function unwrapEl(n){
  const f=document.createDocumentFragment();
  while(n.firstChild) f.appendChild(n.firstChild);
  n.replaceWith(f);
}
/* 选区跨了好几块（段落、列表项、格子）：按块切开，每块各包一层。以前整个
   extractContents 再包，几个 <p> 一起装进一个 <strong>，造出「顶层 <strong> 里套段落」
   ——存不进，也画不回去（B 报告 E 类，S14）。代码块里不加格式（写不进 md）；
   双链是原子，选区切在它字中间就把整个双链算进来，别把它劈成两半。 */
function wrapInline(tag, attrs){
  const s=getSelection(); if(!s || !s.rangeCount) return;
  const r=s.getRangeAt(0);
  const cur=closestTag(r.commonAncestorContainer, tag);
  if(cur && !attrs){ unwrapEl(cur); return; }
  if(r.collapsed) return;
  const parts=rangeByBlock(r);
  if(!parts.length) return;
  const made=parts.map(pr=>{
    const el=document.createElement(tag);
    if(attrs) for(const k in attrs) el.setAttribute(k, attrs[k]);
    try{ pr.surroundContents(el); }
    catch(e){ el.appendChild(pr.extractContents()); pr.insertNode(el); }
    return el;
  });
  const nr=document.createRange();
  const last=made[made.length-1];
  nr.setStart(made[0], 0); nr.setEnd(last, last.childNodes.length);
  s.removeAllRanges(); s.addRange(nr);
}
/* 一个选区按「可落点块」（段落、标题、列表项、格子）切成几段，每段只在一块里头 */
function rangeByBlock(r){
  const root=r.commonAncestorContainer;
  const host=(root.nodeType===1 ? root : root.parentNode);
  const md=host && host.closest ? host.closest('.md') : null;
  if(!md) return [r];
  const texts=[];
  if(root.nodeType===3) texts.push(root);
  else{
    const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n; while((n=w.nextNode())) if(r.intersectsNode(n)) texts.push(n);
  }
  const groups=[];
  texts.forEach(n=>{
    const b=blockish(n, md);
    const g=groups[groups.length-1];
    if(g && g.b===b) g.ns.push(n); else groups.push({b, ns:[n]});
  });
  const out=[];
  groups.forEach(g=>{
    if(!g.b || g.b.tagName==='PRE' || g.b.closest('pre')) return;
    const a=g.ns[0], z=g.ns[g.ns.length-1];
    const pr=document.createRange();
    pr.setStart(a, a===r.startContainer ? r.startOffset : 0);
    pr.setEnd(z, z===r.endContainer ? r.endOffset : z.nodeValue.length);
    const a0=atomOf(pr.startContainer, md); if(a0) pr.setStartBefore(a0);
    const a1=atomOf(pr.endContainer, md); if(a1) pr.setEndAfter(a1);
    if(pr.collapsed || !tidyTxt(pr.toString()).trim()) return;
    out.push(pr);
  });
  return out;
}

/* ── 选中文字时浮出来的那一条 ─────────── */
const FMT=[
  ['bold','<b>B</b>',withKbd(TR('加粗'),'⌘B')], ['italic','<i>I</i>',withKbd(TR('斜体'),'⌘I')],
  ['del','<s>S</s>',withKbd(TR('删除线'),'⌘⇧X')], ['code','<code>&lt;&gt;</code>',withKbd(TR('行内代码'),'⌘E')],
  ['link',esc(TR('链接')),TR('加链接')], ['sep'],
  ['h2','H2',TR('二级标题')], ['h3','H3',TR('三级标题')], ['p',esc(TR('正文')),TR('正文')],
  ['ul',esc(TR('列表')),TR('无序列表')], ['quote',esc(TR('引用')),TR('引用')], ['sep'],
  ['src',esc(TR('源码')),withKbd(TR('这一块按 markdown 源码改'),'⌥⌘E')],
];
function buildFmtBar(){
  if($('#fmt')) return;
  const d=document.createElement('div'); d.id='fmt';
  d.innerHTML=FMT.map(f=>f[0]==='sep'?'<span class="sep"></span>'
    :`<button data-a="${f[0]}" title="${esc(f[2])}">${f[1]}</button>`).join('');
  document.body.appendChild(d);
  // mousedown 先于 blur，不 preventDefault 的话点按钮时选区就没了
  d.addEventListener('mousedown', e=>e.preventDefault());
  d.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    fmtAction(b.dataset.a);
  });
}
function fmtAction(a){
  const t=active(); if(!t || !t.editing) return;
  const blk=curBlock(t);
  // 不走 execCommand('bold')：它给的是 <b>，而我们渲染出来的是 <strong>，
  // 事后再洗一遍会把光标弄丢。直接生成自己那套标签。
  if(a==='bold'){ wrapInline('STRONG'); }
  else if(a==='italic'){ wrapInline('EM'); }
  else if(a==='del'){ wrapInline('DEL'); }
  else if(a==='code'){ wrapInline('CODE'); }
  else if(a==='link'){
    const cur=closestTag(getSelection().anchorNode,'A');
    if(cur){ unwrapEl(cur); }
    else{
      const u=prompt(TR('链接地址')); if(!u || !u.trim()) return;
      wrapInline('A', linkAttrs(u, dirOf(t.path)));
    }
  }
  else if(a==='src'){ hideFmt(); if(blk) openSrcBlk(t, blk); return; }
  else if(blk && !blk.hasAttribute('data-lock')){ retype(t, blk, a); }
  t.touched=true;
  if(blk && blk.isConnected) blk.dataset.dirty='1';
  autoKick(t);
  placeFmt();
}
/* 格式条「链接」、选中字粘贴网址：链接按渲染器的样子造——href、data-u、target、rel
   跟 [字](地址) 渲染出来的一模一样，存盘自检才对得上。www. 开头补 https://：
   不补的话它被当成库里的相对路径，点开是一份不存在的笔记。file:// 照收
   （库里五百多份这种链接），渲染器给它 href="#"，写回认的是 data-u。 */
function linkAttrs(u, base){
  u=String(u||'').trim();
  if(/^www\./i.test(u)) u='https://'+u;
  const box=document.createElement('div');
  try{ box.innerHTML=inl('[x]('+u.replace(/\)/g,'&#41;')+')', base); }catch(e){}
  const a=box.querySelector('a');
  const href=(a && a.getAttribute('data-u')===u) ? a.getAttribute('href') : u;
  return {href, 'data-u':u, target:'_blank', rel:'noopener'};
}
function hideFmt(){ const f=$('#fmt'); if(f) f.classList.remove('on'); }
function placeFmt(){
  const f=$('#fmt'); if(!f) return;
  const t=active();
  if(!t || !t.editing || paneOf(t).classList.contains('src')){ hideFmt(); return; }
  const s=getSelection();
  if(!s || !s.rangeCount || s.isCollapsed){ hideFmt(); return; }
  const md=paneOf(t).querySelector('.md');
  if(!md.contains(s.anchorNode)){ hideFmt(); return; }
  const r=s.getRangeAt(0).getBoundingClientRect();
  if(!r.width && !r.height){ hideFmt(); return; }
  f.classList.add('on');
  const w=f.offsetWidth, h=f.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.top-h-8;
  if(y<40) y=r.bottom+8;
  f.style.left=Math.max(8, Math.min(innerWidth-w-8, x))+'px';
  f.style.top=y+'px';
  // 当前选区已经是加粗/斜体的话按钮点亮
  const on=(tag)=>!!closestTag(s.anchorNode, tag);
  f.querySelectorAll('button').forEach(b=>{
    const a=b.dataset.a;
    b.classList.toggle('on',
      a==='bold'?on('STRONG'):a==='italic'?on('EM'):a==='del'?on('DEL'):
      a==='code'?on('CODE'):a==='link'?on('A'):false);
  });
}
document.addEventListener('selectionchange', ()=>{
  clearTimeout(placeFmt._tm);
  placeFmt._tm=setTimeout(placeFmt, 60);
  const t=active();
  if(!t || !t.editing) return;
  caretOutOfAtom(t);
  slashAway();                                        // 光标离开了打「/」的那一段：收起菜单
  if(t.redraw && t.redraw.size) redrawAway(t);       // 光标离开了照存过的那一块：按文件重画
});
/* 光标落进了双链（原子，contenteditable=false）里——别的代码、脚本按字符偏移放光标时
   会这样：挪到它外面。停在里面的话，接着敲的字浏览器一个都不收（两个内核实测）。
   选区也一样（编辑态双击双链选词、从双链字中间开始拖选）：一头落在原子里，WebKit 打字、
   退格都不理（R 报告 P1-1）。起点在原子里挪到它前面、终点在原子里挪到它后面，方向不变——
   双击双链＝选中整个双链，打字替换、退格删掉。 */
function caretOutOfAtom(t){
  const s=getSelection(); if(!s || !s.rangeCount) return;
  const r=s.getRangeAt(0), p=paneOf(t), md=p && p.querySelector('.md');
  if(!md || !md.contains(r.startContainer)) return;
  if(s.isCollapsed){
    const a=atomOf(r.startContainer, md); if(!a) return;
    const nr=document.createRange();
    if(r.startOffset===0 && (r.startContainer===a || r.startContainer===a.firstChild)) nr.setStartBefore(a);
    else nr.setStartAfter(a);
    nr.collapse(true);
    s.removeAllRanges(); s.addRange(nr);
    return;
  }
  const a0=atomOf(r.startContainer, md), a1=atomOf(r.endContainer, md);
  if(!a0 && !a1) return;
  const at=(n, after)=>[n.parentNode, [...n.parentNode.childNodes].indexOf(n)+(after?1:0)];
  const st=a0 ? at(a0, false) : [r.startContainer, r.startOffset];
  const en=a1 ? at(a1, true) : [r.endContainer, r.endOffset];
  // 反着拖的（焦点在前）保持反着，Shift+方向键接着扩选不乱
  const back=(s.anchorNode===r.endContainer && s.anchorOffset===r.endOffset)
             && !(s.anchorNode===r.startContainer && s.anchorOffset===r.startOffset);
  try{
    if(back) s.setBaseAndExtent(en[0], en[1], st[0], st[1]);
    else s.setBaseAndExtent(st[0], st[1], en[0], en[1]);
  }catch(e){}
}

/* ── 编辑区里的键 ───────────────────────
   markdown 打法照样管用：行首打 ## 加空格就变二级标题，- 加空格变列表，
   > 加空格变引用，[] 加空格变勾选项；一行 --- 回车变分隔线，``` 回车变代码块。
   记号+空格走 input 事件（空格已经进 DOM），不走 keydown preventDefault——
   否则 DIV 还没洗成 P、或输入法刚上屏，keydown 那一拍经常认不出来。 */
const INPUT_RULES=[
  [/^(#{1,6}) $/, m=>'h'+m[1].length],
  [/^[-*+] $/, ()=>'ul'],
  [/^(\d+)[.)] $/, (m,blk)=>olOk(m[1], blk) ? 'ol' : null],
  [/^> $/, ()=>'quote'],
  [/^\[[ xX]?\] $/, ()=>'task'],
];
const MARKER_ONLY=[
  [/^(#{1,6})$/, m=>'h'+m[1].length],
  [/^[-*+]$/, ()=>'ul'],
  [/^(\d+)[.)]$/, (m,blk)=>olOk(m[1], blk) ? 'ol' : null],
  [/^>$/, ()=>'quote'],
  [/^\[[ xX]?\]$/, ()=>'task'],
];
/* 行首「数字＋点」什么时候算有序列表：只认 1. / 1)，或者正好是紧挨着的上一张有序表的
   下一个号（接着往下写）。「2026. 年度目标」这种别的数字照原样留成字——以前一律变成
   从 1 起的有序表，年份就这么没了（B 报告 S34）。 */
function olOk(num, blk){
  if(+num===1) return true;
  const prev=blk && blk.previousElementSibling;
  if(!prev || prev.tagName!=='OL' || prev.hasAttribute('data-lock')) return false;
  const n=[...prev.children].filter(x=>x.tagName==='LI').length;
  return +num === +(prev.getAttribute('start')||1) + n;
}

let COMPOSING=false;
document.addEventListener('compositionstart', ()=>{ COMPOSING=true; });
document.addEventListener('compositionend', ()=>{
  COMPOSING=false;
  const t=active();
  if(t && t.editing) requestAnimationFrame(()=>{
    syncPh(t);
    if(t.id===curTab) syncTabTitle(t);
    tryMdShortcut(t);
    maybeSlash(t);
  });
});

function tryMdShortcut(t){
  if(!t || !t.editing || COMPOSING) return false;
  const blk=curBlock(t);
  if(!blk || blk.hasAttribute('data-lock')) return false;
  if(!/^(P|DIV)$/.test(blk.tagName)) return false;
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed) return false;
  const r=s.getRangeAt(0);
  if(!blk.contains(r.startContainer) && r.startContainer!==blk) return false;
  const pre=r.cloneRange();
  pre.selectNodeContents(blk); pre.setEnd(r.endContainer, r.endOffset);
  const before=tidyTxt(pre.toString());
  for(const [re,kind] of INPUT_RULES){
    const m=before.match(re);
    if(!m) continue;
    const k=kind(m, blk);
    if(!k) continue;
    const rest=tidyTxt(blk.textContent).slice(before.length);
    retype(t, blk, k, rest);
    return true;
  }
  return false;
}

function edKey(t, e){
  if(e.isComposing || e.keyCode===229) return;
  caretOutOfAtom(t);                                // 光标别停在双链里（见 caretOutOfAtom）
  // 菜单看得见，Esc 就只收菜单（光标走没走都一样），别再往下取消编辑
  if(e.key==='Escape' && $('#slash').classList.contains('on')){ e.preventDefault(); e.stopPropagation(); hideSlash(); return; }
  slashAway();                                      // 菜单还挂着、光标早走了：先收（selectionchange 是异步的）
  if(slashOn()){
    if(e.key==='ArrowDown'){ e.preventDefault(); e.stopPropagation(); slashI=Math.min(SLASH.length-1, slashI+1); paintSlash(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); e.stopPropagation(); slashI=Math.max(0, slashI-1); paintSlash(); return; }
    if(e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); e.stopPropagation(); applySlash(); return; }
  }
  const blk=curBlock(t);
  const cmd=e.metaKey;

  if(cmd && !e.shiftKey && !e.altKey){
    const k=e.key.toLowerCase();
    if(k==='b'){ e.preventDefault(); wrapInline('STRONG'); t.touched=true; autoKick(t); return; }
    if(k==='i'){ e.preventDefault(); wrapInline('EM'); t.touched=true; autoKick(t); return; }
    if(k==='e'){ e.preventDefault(); wrapInline('CODE'); t.touched=true; autoKick(t); return; }
  }
  if(cmd && e.shiftKey && e.key.toLowerCase()==='x'){
    e.preventDefault(); wrapInline('DEL'); t.touched=true; autoKick(t); return;
  }
  /* ⌥⌘E 调出这一块的源码。这里必须认 e.code 不能认 e.key：
     macOS 上 Option+E 是重音符号的死键，按下去 e.key 拿到的不是 'e'，
     在客户端里实测过一次，按了没反应就是被这个坑住的。 */
  if(cmd && e.altKey && (e.code==='KeyE' || e.key.toLowerCase()==='e')){
    e.preventDefault(); if(blk) openSrcBlk(t, blk); return;
  }
  if(!blk) return;

  // Tab：表格里跳格子，列表里进退层级
  if(e.key==='Tab'){
    const cell=closestTag(getSelection().anchorNode,'TD') || closestTag(getSelection().anchorNode,'TH');
    if(cell){ e.preventDefault(); hopCell(t, cell, e.shiftKey); return; }
    const li=closestTag(getSelection().anchorNode,'LI');
    if(li){
      e.preventDefault();
      if(e.shiftKey){ if(!outdentLi(t, li)) liftLiToP(t, li); }
      else indentLi(t, li);
      return;
    }
    return;
  }

  if(e.key==='Backspace'){
    const s=getSelection();
    const li=closestTag(s && s.anchorNode,'LI');
    if(!cmd && !e.altKey && li && s && s.isCollapsed && caretAtStart(li) && !tidyTxt(li.textContent).trim() && !li.querySelector('img')){
      e.preventDefault();
      removeEmptyLi(t, li);
      return;
    }
    /* 段首退格、上一块是代码块／表格／分隔线／锁住的块：别交给浏览器——它会把这一段的字
       并进 <pre>（落在 <code> 外面，存盘时丢，S15/S39）、并进表格最后一格，
       或者把锁住的整块删掉。自己接管：
         分隔线 → 删掉分隔线；锁住的块 → 不动；
         代码块／表格 → 这一段是空的就删掉它，光标去上一块末尾；有字就只挪光标，不合并。
       ⌥⌫（删词）、⌘⌫（删到行首）在段首也是并段，一样接管（R 报告 P3-2）。 */
    if(s && s.isCollapsed && /^(P|H[1-6])$/.test(blk.tagName) && caretAtStart(blk)){
      const prev=blk.previousElementSibling;
      const tw=prev && (prev.tagName==='TABLE' || (prev.tagName==='DIV' && prev.classList.contains('tw')));
      if(prev && (prev.hasAttribute('data-lock') || prev.tagName==='PRE' || prev.tagName==='HR' || tw)){
        e.preventDefault();
        if(prev.hasAttribute('data-lock')) return;
        if(prev.tagName==='HR'){ prev.remove(); t.touched=true; autoKick(t); return; }
        const spot = prev.tagName==='PRE' ? (prev.querySelector('code')||prev)
                   : ([...prev.querySelectorAll('td,th')].pop() || prev);
        if(isBlankBlock(blk)){ blk.remove(); t.touched=true; autoKick(t); }
        caretEnd(spot);
        return;
      }
    }
  }

  if(e.key==='Enter'){
    if(e.metaKey || e.ctrlKey) return;
    // 代码块里回车就是换行，别把块拆了。走 insertLineBreak：WebKit（壳）里 insertText('\n')
    // 会把 <pre> 从光标处劈成两个代码块（存下去就是两段代码），Chromium 不会；
    // insertLineBreak 在代码里两个内核都只插一个换行（实测，G 轮 W24）
    if(blk.tagName==='PRE'){
      e.preventDefault();
      document.execCommand('insertLineBreak');
      return;
    }
    // 表格格子里回车 → 格子内换行，正是 markdown 表格里 <br> 的用法。
    // 走 insertLineBreak：格子末尾它会补一个占位 <br>、光标落在新的一行上；以前 insertHTML('<br>')
    // 两个内核都把光标留在那个 <br> 前面，回车看起来没反应，再打的字接在原行后面（B §8-4、S33）
    const cell=closestTag(getSelection().anchorNode,'TD') || closestTag(getSelection().anchorNode,'TH');
    if(cell){ e.preventDefault(); document.execCommand('insertLineBreak'); t.touched=true; autoKick(t); return; }

    if(/^(P|DIV)$/.test(blk.tagName)){
      const txt=tidyTxt(blk.textContent).trim();
      for(const [re,kind] of MARKER_ONLY){
        const m=txt.match(re);
        if(!m) continue;
        const k=kind(m, blk);
        if(!k) continue;
        e.preventDefault();
        retype(t, blk, k, '');
        return;
      }
      if(/^(-{3,}|\*{3,}|_{3,})$/.test(txt)){
        e.preventDefault();
        const hr=retype(t, blk, 'hr', '');
        const p=document.createElement('p'); p.dataset.dirty='1';
        ensureBr(p); hr.after(p); caretEnd(p, true); return;
      }
      if(/^```/.test(txt)){
        e.preventDefault(); retype(t, blk, 'pre', ''); return;
      }
    }

    const li=closestTag(getSelection().anchorNode,'LI');
    if(li && !tidyTxt(li.textContent).trim() && !li.querySelector('img')){
      e.preventDefault();
      exitOrOutdentLi(t, li);
      return;
    }
    // 非空待办项上回车 → 再来一条待办（空的那条已经被上面接走，退出列表）
    if(li && li.classList.contains('task') && li.querySelector(':scope > input[type=checkbox]')){
      e.preventDefault();
      splitTaskLi(t, li);
      return;
    }

    // 标题末尾回车 → 下面起一个正文段，而不是再来一个标题。
    // 下面已经有一个空段（新建笔记会先垫一个）就落到那一段，不再插一层。
    if(/^H[1-6]$/.test(blk.tagName)){
      const s=getSelection();
      const r=s.getRangeAt(0), tail=r.cloneRange();
      tail.selectNodeContents(blk); tail.setStart(r.endContainer, r.endOffset);
      if(!tail.toString().trim()){
        e.preventDefault();
        let p=blk.nextElementSibling;
        if(!(p && p.tagName==='P' && isBlankBlock(p))){
          p=document.createElement('p'); p.dataset.dirty='1';
          ensureBr(p);
          blk.after(p);
        }
        caretEnd(p, true); t.touched=true; autoKick(t); return;
      }
    }
  }
}

/* 表格里 Tab 跳下一格；停在最后一格再按就补一行。
   库里一千八百多份文件带表，这条比什么都常用。 */
function hopCell(t, cell, back){
  const row=cell.parentElement, tb=row.closest('table');
  const cells=[...tb.querySelectorAll('td,th')];
  let i=cells.indexOf(cell)+(back?-1:1);
  if(i<0) return;
  if(i>=cells.length){
    if(back) return;
    const tr=document.createElement('tr');
    const n=row.children.length;
    for(let k=0;k<n;k++){
      const td=document.createElement('td');
      const ref=tb.rows[tb.rows.length-1].children[k];
      if(ref && ref.getAttribute('style')) td.setAttribute('style', ref.getAttribute('style'));
      // 空格子就留空，跟 md2html 渲染出来的一模一样（光标落进去时 ensureBr 自会补 <br>）
      tr.appendChild(td);
    }
    (tb.tBodies[0]||tb).appendChild(tr);
    t.touched=true; autoKick(t);
    const blk=tb.closest('[data-bid]') || tb.parentElement;
    if(blk) blk.dataset.dirty='1';
    caretEnd(tr.firstElementChild, true);
    return;
  }
  caretEnd(cells[i], true);
}

/* 粘贴。
   直接放行 HTML 的话，从网页和 Word 里粘来的一堆 <span style> 会灌进正文，
   反解不回 markdown。所以没图时仍然只收纯文本，按 markdown 解析后再插。
   飞书聊天、网页文章那种「文字夹着几张图」是另一回事：图在 text/html 的
   <img> 里，不在 files 里；只取 text/plain 就只剩字。这种把 HTML 拆成
   「文字块 + 图」，图落到这份 md 旁边的 _图/，插进去的仍是编辑器认得的
   <p> 和 <img data-u>，样式丢掉、图留下。 */
function onPaste(t, e){
  const dt=e.clipboardData; if(!dt) return;
  const html=dt.getData('text/html')||'';
  const txt=(dt.getData('text/plain')||'').replace(/\r\n/g,'\n');
  const files=clipImageFiles(dt);
  const s=getSelection();
  // 光标在代码块里：原样插字，换行就是换行，不当 markdown 解析、不拆成段落
  // （按一行一段插进 <pre> 会被洗成挤在一起的一行）。图不进代码块。
  if(closestTag(s && s.anchorNode, 'PRE')){
    e.preventDefault();
    // 剪贴板里只有图（截图、飞书图片）：代码块收不了图，说一声，别当改过了
    if(!txt){ if(files.length || /<img\b/i.test(html) || clipLooksLikeImage(dt)) notify(TR('代码块里放不了图')); return; }
    preInsert(txt);
    t.touched=true; autoKick(t); return;
  }
  // 选着字粘一条网址进来 → 直接变成链接，这是最常用的一下
  if(s && !s.isCollapsed && /^(https?:\/\/|file:\/\/)\S+$/.test(txt.trim())
     && !/<img\b/i.test(html) && files.length===0){
    e.preventDefault();
    wrapInline('A', linkAttrs(txt.trim(), dirOf(t.path)));
    t.touched=true; autoKick(t); return;
  }
  const hasImgTag=/<img\b/i.test(html);
  // 飞书在 Mac 上常常只往剪贴板塞一张 PNG，WKWebView 的 clipboardData.files
  // 是空的。有图标签、多张文件、或者类型里写着 image/png，都走混贴（壳里再读原生剪贴板）。
  if(hasImgTag || files.length>1 || (files.length===0 && (clipLooksLikeImage(dt) || SHELL))){
    e.preventDefault();
    pasteMixed(t, {html, txt, files});
    return;
  }
  if(files.length===1){
    e.preventDefault(); pasteImg(t, files[0].file); return;
  }
  e.preventDefault();
  if(!txt) return;
  document.execCommand('insertHTML', false, pasteHtml(txt, dirOf(t.path)));
  t.touched=true; autoKick(t);
}

/* 代码块里插一段多行的字（粘贴）。整段 insertText 碰到换行，WebKit（壳）会把 <pre> 劈成好几个
   代码块；一行一条 insertText／insertLineBreak 又太慢（WebKit 里 2000 行要半分钟），撤销还得
   按好几十下。办法：换行先换成占位符 PRE_PH，一条 insertText 插完，再就地把占位符换回换行——
   一个字换一个字，长度不变，光标和撤销记录都不受影响（撤销一下撤掉整段，两个内核实测）。
   占位符用 U+FDD0：Unicode 的「非字符」，规定只给程序内部用、不进交换的文本，正文里不该有它
   （G 轮用的 U+E00F 是私用区，图标字体会用到，算正文）。
   撤销之后再重做，浏览器按撤销栈原样再插一遍带占位符的那串，脚本那一步不会再跑（H 轮 P0-B）：
   input（historyRedo／historyUndo）里当场换回（fixPreHolders）；cleanBlock、blkMd 再各兜一道——
   占位符任何情况下都不进文件。占位符常量 PRE_PH 定义在文件靠前（inlMd、cleanBlock 也要用）。 */
function preInsert(txt){
  txt=String(txt).replace(PRE_PH_RE, '');          // 剪贴板里真有这个非字符：不要它
  if(!txt.includes('\n')){ document.execCommand('insertText', false, txt); return; }
  document.execCommand('insertText', false, txt.replace(/\n/g, PRE_PH));
  const s=getSelection();
  fixPreHolders(closestMd(s && s.anchorNode));
}
/* 把正文里（或某一块里）残留的占位符换回换行：代码块里换成 \n，别处直接删。
   一个字换一个字（replaceData），光标位置和撤销记录都不受影响。 */
function fixPreHolders(root){
  if(!root) return false;
  let hit=false;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const list=[]; let n;
  while((n=w.nextNode())) if(n.nodeValue.indexOf(PRE_PH)>=0) list.push(n);
  list.forEach(n=>{
    const inPre=!!closestTag(n, 'PRE');
    let i;
    while((i=n.nodeValue.indexOf(PRE_PH))>=0){ if(inPre) n.replaceData(i, 1, '\n'); else n.deleteData(i, 1); hit=true; }
  });
  return hit;
}
function closestMd(n){
  while(n && n.nodeType!==9){ if(n.nodeType===1 && n.classList && n.classList.contains('md')) return n; n=n.parentNode; }
  return null;
}
/* 粘贴的纯文字 → 要插进去的 HTML（浏览器里的 onPaste 和壳里的 pasteMixed 共用）。
   一行一段：markdown 的「软换行」在粘贴这件事上是错的——聊天记录、地址、诗，原文分行
   就是要分行，拼成一段中文连空格都没有，字挤成一团（A 报告「顺带」第一条）。
   结构行（列表、引用、标题、表格、围栏里）照旧交给 md2html，「- a⏎- b」仍是列表。
   插的样子：只有一段 → 插它里面的字（行内）；光标在列表项／表格格子／引用里 → 块级的
   结果降成一行一行（pasteRows）：列表项、格子里用 <br> 接，引用里一行一段。别往 <li>
   里塞 <p>：WebKit 会把它套进空 <li>，之后回车不出新的项目符号、整张表存不进（A 报告 R6，
   真 app 里粘贴的主因）；也别把列表、代码块塞进格子／引用——写不回去，只能判存不进（R 报告 P2-2）。 */
function pasteHtml(txt, base){
  const box=document.createElement('div');
  box.innerHTML=md2html(pasteLines(txt), base, 0);
  const kids=[...box.children];
  if(kids.length===1 && kids[0].tagName==='P') return kids[0].innerHTML;
  const s=getSelection();
  const at=s && s.rangeCount ? s.anchorNode : null;
  const li=closestTag(at,'LI'), cell=closestTag(at,'TD') || closestTag(at,'TH'), quote=closestTag(at,'BLOCKQUOTE');
  if(!li && !cell && !quote) return box.innerHTML;
  // 列表项里粘列表源码：交给浏览器并成兄弟项（空项里粘就是接着往下几项）
  if(li && !cell && kids.some(k=>k.tagName==='UL' || k.tagName==='OL')
     && kids.every(k=>/^(P|UL|OL)$/.test(k.tagName))) return box.innerHTML;
  // 其余（列表项、格子、引用里粘进来的段落、引用、表格、代码……）：降成一行一行。
  // 块级元素塞进 li／格子／引用，一行一项的模型写不回去，存盘只能判存不进（R 报告 P2-2）。
  // 引用里一行就是一段，照样一行一段；列表项、格子里用 <br> 接
  const rows=pasteRows(kids);
  if(quote && !li && !cell) return rows.map(r=>'<p>'+(r||'<br>')+'</p>').join('');
  return rows.join('<br>');
}
/* 粘贴结果降成「行」，记号照字面留着（贴进来的就是这些字）：列表项带 - ／1. ／[ ]，
   标题带 #，引用带 >；代码一行一行照字面（围栏不要）；表格一行一行、格子用 | 隔开 */
function pasteRows(kids){
  const rows=[];
  kids.forEach(k=>{
    const t=k.tagName;
    if(t==='UL' || t==='OL'){
      let n=+(k.getAttribute('start')||1);
      [...k.children].forEach(li=>{
        if(li.tagName!=='LI') return;
        const cb=li.querySelector(':scope > input[type=checkbox]');
        const own=li.cloneNode(true);
        own.querySelectorAll(':scope > ul, :scope > ol, :scope > input').forEach(x=>x.remove());
        const mark=(t==='OL' ? (n++)+'. ' : '- ') + (cb ? '['+(cb.hasAttribute('checked')?'x':' ')+'] ' : '');
        rows.push(esc(mark)+own.innerHTML.replace(/^<span>([\s\S]*)<\/span>$/,'$1').replace(/<br>$/,''));
        li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub=>rows.push(...pasteRows([sub])));
      });
    }else if(t==='PRE'){
      preText(k).replace(/\n$/,'').split('\n').forEach(l=>rows.push(esc(l)));
    }else if(t==='TABLE' || (t==='DIV' && k.classList.contains('tw'))){
      const tb=t==='TABLE' ? k : k.querySelector('table');
      if(tb) [...tb.querySelectorAll('tr')].forEach(r=>rows.push([...r.children].map(c=>c.innerHTML).join(' | ')));
    }else if(t==='BLOCKQUOTE'){
      [...k.children].forEach(p=>rows.push('&gt; '+p.innerHTML));
    }else if(/^H[1-6]$/.test(t)) rows.push('#'.repeat(+t[1])+' '+k.innerHTML);
    else if(t==='HR') rows.push('---');
    else rows.push(k.innerHTML);
  });
  return rows;
}
/* 相邻的两行普通文字之间补一个空行，让 md2html 把它们画成两段；结构行和围栏里不动 */
function pasteLines(txt){
  const L=String(txt||'').split('\n'), out=[];
  const para = i => { const l=L[i]; return !!l.trim() && !/^\s*(\||#{1,6}\s|>)/.test(l) && !fenceAt(L, i) && !LIRE.test(l)
                    && !/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l); };
  let fo=null;
  L.forEach((l, i)=>{
    out.push(l);
    if(fo){ if(fenceClose(l, fo)) fo=null; return; }
    const f=fenceAt(L, i); if(f){ fo=f; return; }
    if(i+1<L.length && para(i) && para(i+1)) out.push('');
  });
  return out.join('\n');
}

function clipLooksLikeImage(dt){
  const types=[...(dt.types||[])];
  if(types.some(x=>/image\/|png|tiff|jpeg|Files/i.test(String(x)))) return true;
  try{
    if(dt.items && [...dt.items].some(i=>i.kind==='file' || /^image\//.test(i.type||''))) return true;
  }catch(e){}
  return false;
}

function clipImageFiles(dt){
  const seen=new Set(), out=[];
  const looksImg=f=>{
    if(!f) return false;
    const t=(f.type||'').toLowerCase();
    if(t.startsWith('image/')) return true;
    if(!t || t==='application/octet-stream') return true;
    return false;
  };
  const add=f=>{
