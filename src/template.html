  -webkit-user-modify:read-only;user-select:text}
.pane.edit .md>[data-lock]::after{content:var(--i18n-ph-src);position:absolute;top:2px;right:2px;
  font-size:11px;color:var(--t2);background:var(--pop);box-shadow:var(--popshadow);
  border-radius:6px;padding:1px 7px;cursor:pointer;opacity:0;transition:opacity .15s ease}
.pane.edit .md>[data-lock]:hover::after{opacity:1}
.pane.edit .md td,.pane.edit .md th{min-width:44px}
.pane.edit .md td:focus,.pane.edit .md th:focus{outline:none;background:var(--hover)}
.md textarea.blk{display:block;box-sizing:border-box;width:100%;
  margin:1em 0;padding:0;border:0;border-radius:0;background:none;color:var(--t1);
  font-family:var(--mono);font-size:.86em;line-height:1.7;letter-spacing:0;
  resize:none;outline:none;overflow:hidden;tab-size:2;-webkit-font-smoothing:inherit}

/* 选中文字浮出的工具条 */
#fmt{position:fixed;z-index:80;display:none;gap:2px;padding:5px 6px;
  background:var(--card-face);border:0;border-radius:11px;
  box-shadow:var(--el-3);animation:arrive .14s ease-out}
#fmt.on{display:flex}
#fmt button{min-width:30px;height:28px;padding:0 8px;border-radius:7px;color:var(--t1);
  display:flex;align-items:center;justify-content:center;font-size:13px;white-space:nowrap;
  transition:background-color .15s ease}
#fmt button:hover{background:var(--hover)}
#fmt button.on{background:var(--sel);box-shadow:var(--selshadow)}
#fmt .sep{width:7px}
#fmt b{font-weight:600}
#fmt i{font-style:italic}
#fmt s{text-decoration:line-through}
#fmt code{font-family:var(--mono);font-size:11px}

/* ═══ 浮层：⌘K 直达 / 右键 / 快看 / 设置 / 候选 ═══ */

/* ⌘K 直达：设计稿里的 .modal —— 半透明蒙层 + 5px 毛玻璃，面板从顶上落下来。 */
#cmdkWrap{position:fixed;inset:0;z-index:120;display:none;
  justify-content:center;align-items:flex-start;
  padding:clamp(70px,15vh,145px) 18px 30px;
  background:var(--scrim);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  animation:fadeIn .18s ease-out}
#cmdkWrap.on{display:flex}
.modal{width:min(560px,100%);max-height:75vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--card-face);border:0;border-radius:var(--r-xl);
  box-shadow:var(--popbig);
  animation:arrive .22s cubic-bezier(.2,.8,.2,1)}
.search-input-row{flex:none;display:flex;align-items:center;gap:12px;
  padding:17px 20px;border-bottom:1px solid var(--rule-row)}
.search-input-row>svg{width:18px;height:18px;flex:none;color:var(--accent)}
.search-input-row input{flex:1;min-width:0;height:26px;
  border:0;background:none;outline:none;font-size:15px;color:var(--t1)}
.search-input-row input::placeholder{color:var(--t3)}
.search-input-row .escb{flex:none;padding:3px;border-radius:7px;color:var(--t3);
  display:flex;align-items:center}
.search-input-row .escb:hover{background:var(--hover)}
.modal-body{flex:1;min-height:100px;overflow-y:auto;padding:7px}
.search-label{font-size:10px;color:var(--t3);padding:9px 12px 6px}
.modal-footer{flex:none;display:flex;align-items:center;gap:14px;
  padding:11px 18px;border-top:1px solid var(--rule-row);
  font-size:10px;color:var(--t3)}
.modal-empty{padding:46px 20px 40px;text-align:center;color:var(--t2)}
.modal-empty h2{margin:0 0 8px;font-size:17px;font-weight:550;color:var(--t1)}
.modal-empty p{margin:0 0 20px;font-size:12px;line-height:1.7}

#ctx{position:fixed;z-index:150;display:none;min-width:196px;padding:5px;
  background:var(--card-face);border:0;border-radius:var(--r-md);
  box-shadow:var(--el-3);animation:arrive .14s ease-out}
#ctx.on{display:block}
#ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 10px;border-radius:7px;font-size:13px;color:var(--t1);white-space:nowrap}
#ctx button:hover{background:var(--accent);color:var(--on-accent)}
#ctx button[disabled]{opacity:.4;pointer-events:none}
#ctx .sep{height:1px;background:var(--rule-row);margin:5px 8px}

#slash{position:fixed;z-index:85;display:none;width:240px;padding:6px;
  background:var(--card-face);border:0;border-radius:12px;
  box-shadow:var(--el-3);animation:arrive .16s ease-out}
#slash.on{display:block}
#slash .sh{font-size:11px;color:var(--t4);padding:6px 10px 4px}
#slash button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 10px;border-radius:8px;font-size:13px}
#slash button:hover,#slash button.on{background:var(--hover)}
#slash .k{color:var(--t4);font-size:11px;margin-left:auto}

/* ═══ 阅读与外观浮层 ═══════════════════════
   工具条最右那颗滑块按钮拉出来。点外面、按 Esc、翻页都会关掉。 */
#typeWrap{position:fixed;top:calc(var(--chrome-h) + var(--bnr-h, 0px) + 10px);right:20px;z-index:110;
  width:260px;display:none;padding:19px;
  background:var(--card-face);border:0;border-radius:var(--r-lg);
  box-shadow:var(--el-3);transform-origin:top right;animation:arrive .18s ease-out}
#typeWrap.on{display:block}
.pop-title{font-size:13px;font-weight:550;margin:0}
/* 无线条规则：行与行之间原来那道 1px 分隔换成间距，靠留白断句。 */
.setting{padding:0;margin-top:16px}
.setting > label{display:flex;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--t2);margin:0 0 10px}
.setting > label .v{color:var(--t3)}
.setting .filters{display:flex;gap:3px;width:100%;padding:3px;
  border-radius:8px;background:var(--seg-track)}
.setting .filters button{flex:1;padding:7px 4px;border-radius:6px;
  font-size:10px;color:var(--t2);white-space:nowrap}
.setting .filters button:hover{color:var(--t1)}
.setting .filters button.on{background:var(--pop);color:var(--t1);box-shadow:var(--segshadow)}
/* 260px 的浮层里五种字体排不下一行，换行成 3＋2；字重六档一行放得下。 */
.setting .filters.wrap{flex-wrap:wrap}
.setting .filters.wrap button{flex:1 1 28%}
.setting .filters.fw button{font-family:"PingFang HK","PingFang SC",var(--ui)}
/* 没装新细明体那一句。260px 的浮层里跟着字体那一行走，比设置面板的 .hint 再小一号。 */
.setting .pop-hint{margin:8px 0 0;font-size:10px;line-height:1.5;color:var(--t3)}
.setting input[type=range]{width:100%;accent-color:var(--accent)}
.setting .dt-btn{width:100%}
@keyframes arrive{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
body.type-on .toc{display:none!important}

/* ═══ 专注阅读 ═══════════════════════════
   只剩正文：文档头上滑淡出，大纲（常驻栏和浮层）一起淡掉。
   **大纲用 opacity 收，不用 display**——网格那一列还得占着位，
   不然正文会往左跳半栏，「进出专注正文原地不动」就废了。
   壳里留一条标签条高度的空白拖拽条给交通灯，里面的控件淡出；
   浏览器里没有交通灯，整条一起收掉。
   鼠标贴到窗口顶上 8px 内，文档头以浮层形式滑回来（body.peek）。 */
body.focus-mode{--status-h:0px}
body.focus-mode:not(.shell){--tabstrip-h:0px}
body.focus-mode:not(.shell) #tabstrip{display:none}
body.focus-mode.shell #tabcluster,
body.focus-mode.shell .navgrp,
body.focus-mode.shell .rightgrp{opacity:0;pointer-events:none;
  transition:opacity var(--d-base) var(--ease-in)}
body.focus-mode #chrome{box-shadow:none}
body.focus-mode .doc-toolbar{transform:translateY(-100%);opacity:0;pointer-events:none;
  transition:transform var(--d-base) var(--ease-in),opacity var(--d-base) var(--ease-in)}
body.focus-mode .outline{opacity:0;pointer-events:none}
body.focus-mode.peek .doc-toolbar{transform:none;opacity:1;pointer-events:auto;
  box-shadow:var(--el-2);
  transition:transform var(--d-slow) var(--ease-out),opacity var(--d-slow) var(--ease-out)}

#wlpick{position:fixed;z-index:90;background:var(--card-face);
  border:0;border-radius:11px;
  box-shadow:var(--el-3);padding:5px;display:none;animation:arrive .14s ease-out;
  max-width:420px;max-height:300px;overflow-y:auto}
#wlpick.on{display:block}
#wlpick button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:7px;
  font-size:13px;color:var(--t1)}
#wlpick button:hover{background:var(--accent);color:var(--on-accent)}
#wlpick .wp{display:block;font-size:11px;color:var(--t3);margin-top:1px}
#wlpick button:hover .wp{color:var(--on-accent);opacity:.85}

#qlwrap{position:fixed;inset:0;z-index:145;display:none;background:var(--scrim);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:6vh 6vw;animation:fadeIn .18s ease-out}
#qlwrap.on{display:flex}
#ql{width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--card-face);border:0;border-radius:var(--r-xl);
  box-shadow:var(--popbig);overflow:hidden;animation:arrive .22s cubic-bezier(.2,.8,.2,1)}
#qlh{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
#qlt{font-size:13px;font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qlb{flex:1;overflow-y:auto;padding:6px 30px 40px}
#qlb .md{max-width:680px}

/* ═══ 设置 ═══════════════════════════════
   720×600 的弹层：左边 172px 导航栏，右边一栏滚动内容，底下一条只有改了东西
   才冒出来的保存条。四段：阅读与外观 / 笔记库 / 高级 / 关于。
   无线条规则照旧——卡片、芯片、输入框全靠 --el-1 托起来，不描边；
   保留的线只有导航栏与内容区之间那道底色差，和保存条上沿那一条。 */
#cfgWrap{position:fixed;inset:0;z-index:130;display:none;background:var(--scrim);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:4vh 20px;animation:fadeIn .18s ease-out}
#cfgWrap.on{display:flex}
#viewCfg{width:min(720px,96vw);height:min(600px,92vh);display:flex;
  background:var(--pop);border:0;border-radius:var(--r-xl);
  box-shadow:var(--popbig);overflow:hidden;animation:arrive .22s var(--ease-std)}

/* 左导航 */
#viewCfg .cfg-rail{width:172px;flex:none;background:var(--side);
  padding:16px 10px 12px;display:flex;flex-direction:column;gap:2px}
#viewCfg .cfg-rail .rt{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.04em;padding:0 10px 12px}
#viewCfg .cfg-navi{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;
  border-radius:var(--r-sm);font-size:13px;color:var(--t1);text-align:left;
  transition:background-color var(--d-fast) ease}
#viewCfg .cfg-navi svg{width:16px;height:16px;flex:none;color:var(--t2);stroke-width:1.5}
#viewCfg .cfg-navi:hover{background:var(--rail-hover)}
#viewCfg .cfg-navi.on{background:var(--sel);box-shadow:var(--selshadow);font-weight:500}
#viewCfg .cfg-navi.on svg{color:var(--accent)}

/* 右内容 */
#viewCfg .cfg-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--win)}
#viewCfg .cfg-head{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 28px}
#viewCfg .cfg-head h2{margin:0;font-size:15px;font-weight:600;flex:1}
#cfgBody{flex:1;min-height:0;overflow-y:auto;padding:0 28px 18px}
#viewCfg .cfg-panel{display:none}
#viewCfg .cfg-panel.on{display:block}

/* 字段行：左标签 58px ＋ 右控件 */
#viewCfg .frow{display:flex;gap:14px;align-items:flex-start}
#viewCfg .frow+.frow{margin-top:19px}
#viewCfg .flab{width:58px;flex:none;font-size:13px;color:var(--t2);line-height:26px}
#viewCfg .fctl{flex:1;min-width:0}
#viewCfg .hint{font-size:12px;color:var(--t3);line-height:1.6;margin:6px 0 0}
#viewCfg .sect{font-size:15px;font-weight:600;margin:0 0 11px}
#viewCfg .sec+.sec{margin-top:22px}
#viewCfg .lbl{font-size:13px;color:var(--t2);margin:0 0 8px;display:block}
#viewCfg .lblrow{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
#viewCfg .lblrow .lbl{margin:0;flex:none}
#viewCfg .lblrow .ih{font-size:12px;color:var(--t3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewCfg .inline-field{display:flex;align-items:center;gap:12px}
#viewCfg .inline-field .lbl{margin:0;flex:none}
#viewCfg .inline-field .tin{width:200px}

/* 主题预览卡：里面那个迷你窗口写死颜色，不跟当前主题走——
   「深色」那张在浅色下也得是深的，不然三张一模一样。 */
#viewCfg .tcards{display:flex;gap:12px}
#viewCfg .tcard{width:120px;text-align:center;flex:none}
#viewCfg .tcard .prev{display:block;width:120px;height:76px;border-radius:var(--r-md);overflow:hidden;
  position:relative;background:#fff;box-shadow:var(--el-1);
  transition:box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out)}
#viewCfg .tcard:hover .prev{transform:translateY(-1px);box-shadow:var(--el-2)}
#viewCfg .tcard.on .prev{box-shadow:0 0 0 2px var(--accent),var(--el-1)}
#viewCfg .tcard .nm{display:block;font-size:11px;color:var(--t2);margin-top:7px}
#viewCfg .tcard.on .nm{color:var(--accent);font-weight:500}
#viewCfg .mw{position:absolute;inset:0}
#viewCfg .mw .bar{position:absolute;left:0;right:0;top:0;height:15px;display:flex;align-items:center;
  gap:3px;padding-left:6px}
#viewCfg .mw .bar em{width:4px;height:4px;border-radius:50%;display:block}
#viewCfg .mw .body{position:absolute;left:0;right:0;top:15px;bottom:0;padding:10px 11px}
#viewCfg .mw .body u{display:block;height:6px;width:52px;border-radius:3px;margin-bottom:8px}
#viewCfg .mw .body s{display:block;height:4px;border-radius:2px;margin-bottom:5px}
#viewCfg .mw.lt{background:#fff}
#viewCfg .mw.lt .bar{background:#f2f4f7}
#viewCfg .mw.lt .bar em{background:#d7dce4}
#viewCfg .mw.lt .body u{background:#b9c2ce}
#viewCfg .mw.lt .body s{background:#e2e7ee}
#viewCfg .mw.dk{background:#23272f}
#viewCfg .mw.dk .bar{background:#1e2229}
#viewCfg .mw.dk .bar em{background:#3d434e}
#viewCfg .mw.dk .body u{background:#6e7784}
#viewCfg .mw.dk .body s{background:#3a4049}
/* 类名不能叫 .split：三栏那两条分隔条已经占着这个名字（width:0）。 */
#viewCfg .mw.half{clip-path:polygon(0 0,64% 0,36% 100%,0 100%)}

/* 字体预览卡：样句用真的字体栈渲染，所见即所得。
   五张卡在 420px 的控件区里排一行会挤成条，所以摆成 3＋2：六列网格，
   前三张各占两列，后两张各占三列，两行都是满的，不留半截空档。 */
#viewCfg .fcards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#viewCfg .fcard{grid-column:span 2;min-width:0;text-align:left;padding:10px 11px 12px;border-radius:var(--r-md);
  background:var(--card-face);box-shadow:var(--el-1);
  transition:box-shadow var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out)}
#viewCfg .fcard:hover{transform:translateY(-1px);box-shadow:var(--el-2)}
#viewCfg .fcard.on{box-shadow:0 0 0 2px var(--accent),var(--el-1)}
#viewCfg .fcard .nm{display:block;font-family:var(--ui);font-size:11px;color:var(--t2);margin-bottom:6px}
#viewCfg .fcard.on .nm{color:var(--accent);font-weight:500}
#viewCfg .fcard.wide{grid-column:span 3}
#viewCfg .fcard .sm{display:block;font-size:12px;line-height:1.62;color:var(--t1)}
#viewCfg .fcard.f-mono .sm{font-size:11px;letter-spacing:-.01em}
/* 字重那一档：每颗按钮用它自己那一档字重、拿苹方-港画出来，按下去就是正文的样子。
   字重写在 style 上（内联压得过 .seg button.on 的 500）。 */
#viewCfg .seg[data-k="fw"] button{font-family:"PingFang HK","PingFang SC",var(--ui)}
/* .frow 是 display:flex，压得过浏览器自带的 [hidden]，得自己写一条。 */
#viewCfg .frow[hidden]{display:none}

/* 字号滑杆：轨道自己画，左半段是强调色 */
#viewCfg .srow{display:flex;align-items:center;gap:14px;height:26px}
#viewCfg .srow .val{width:30px;flex:none;text-align:right;font-size:12px;color:var(--t1)}
#cfgBody input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;
  height:16px;background:none;margin:0}
#cfgBody input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--accent) 0 var(--pct,33%),var(--field) var(--pct,33%) 100%)}
#cfgBody input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:#fff;margin-top:-5.5px;
  box-shadow:0 1px 3px rgba(58,48,80,.26),0 0 0 .5px rgba(58,48,80,.16)}
:root[data-theme="dark"] #cfgBody input[type=range]::-webkit-slider-thumb{background:#ccd2dc;
  box-shadow:0 1px 4px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cfgBody
  input[type=range]::-webkit-slider-thumb{background:#ccd2dc;
  box-shadow:0 1px 4px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.4)}}
#viewCfg .cfg-sample{margin:8px 0 0;color:var(--t2);line-height:1.5}

/* 开关 34×20 */
#viewCfg .swrow{display:flex;align-items:center;gap:12px}
#viewCfg .swrow .txt{flex:1;min-width:0;font-size:13px;color:var(--t1)}
#viewCfg .sw{width:34px;height:20px;border-radius:999px;background:var(--field);position:relative;flex:none;
  transition:background-color var(--d-base) var(--ease-out)}
#viewCfg .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:var(--el-1),0 0 0 .5px rgba(58,48,80,.10);
  transition:transform var(--d-base) var(--ease-out)}
#viewCfg .sw.on{background:var(--accent)}
#viewCfg .sw.on::after{transform:translateX(14px)}

/* 「个人」段：72 头像 ＋ 两颗按钮。整块是拖放目标，拖进来时染一层强调色。
   高亮块比行本身往外扩 12px，而 #cfgBody 顶上没有内边距、又是滚动区——
   这一段自己让出 12px，第一行的高亮才不会被切掉半条边。 */
#viewCfg [data-cfgpanel="profile"]{padding-top:12px}
#viewCfg .avrow{display:flex;align-items:center;gap:16px;padding:12px;margin:-12px;
  border-radius:12px;transition:background-color var(--d-base) ease}
#viewCfg .avrow.drop{background:var(--accent-soft)}
#viewCfg .av{width:72px;height:72px;border-radius:50%;flex:none;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent-ink);font:600 28px/1 var(--ui)}
#viewCfg .av img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
#viewCfg .avacts{min-width:0}
#viewCfg .avacts .btns{display:flex;align-items:center;gap:8px}
#viewCfg .avacts .hint{margin-top:8px}

/* 「Agent」段：标签列比别处宽一点——「Claude Code」「Codex 与其他」按 58px 排不下。
   路径动辄七八十个字符，等宽小字、随处断行地摆着，720 宽的弹层才不会横着长出去。 */
#viewCfg [data-cfgpanel="agent"] .flab{white-space:nowrap}
#viewCfg .agnote{font-size:12.5px;color:var(--t2);line-height:1.7;margin:0 0 18px}
#viewCfg .agwait{margin-top:0}
#viewCfg .fctl>.btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#viewCfg .hint.pth,#viewCfg .hint .pth{font-family:var(--mono);font-size:11px;
  line-height:1.55;word-break:break-all}
#viewCfg .hint.pth{margin-top:7px}

/* 弹层里的次级按钮：图标＋文字要有间距，图标压成 --t2（主按钮里跟着强调色） */
#viewCfg .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
#viewCfg .btn svg{width:13px;height:13px;color:var(--t2)}
#viewCfg .btn.key svg{color:var(--accent)}
#viewCfg .btnt{height:28px;padding:0 8px;border-radius:7px;font-size:12px;color:var(--t2)}
#viewCfg .btnt:hover{color:var(--t1);background:var(--hover)}
#viewCfg .btnt[disabled]{opacity:.4;pointer-events:none}
#viewCfg .link{font-size:12px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
#viewCfg .link:hover{text-decoration:underline}
#viewCfg .link[disabled]{opacity:.4;pointer-events:none}

/* 文本输入：不描边，浮起来一层 */
#cfgBody .tin{height:30px;padding:0 10px;border-radius:var(--r-sm);font-size:12.5px;
  color:var(--t1);background:var(--win);border:0;box-shadow:var(--el-1),0 0 0 1px var(--rule-row);
  outline:none}
#cfgBody .tin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#cfgBody .tin.n{width:78px;text-align:center}

/* 笔记库卡片 */
#viewCfg .vault{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;
  background:var(--card-face);box-shadow:var(--el-1)}
#viewCfg .vault .fico{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#viewCfg .vault .meta{flex:1;min-width:0}
#viewCfg .vault .vacts{flex:none;display:flex;flex-direction:column;gap:6px}
#viewCfg .vault .nm{display:block;font-size:15px;font-weight:600;line-height:1.3}
#viewCfg .vault .pth{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);
  min-width:0;margin-top:3px}
#viewCfg .vault .pth span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewCfg .cpb{width:20px;height:20px;border-radius:5px;flex:none;color:var(--t4);
  display:flex;align-items:center;justify-content:center}
#viewCfg .cpb svg{width:12px;height:12px}
#viewCfg .cpb:hover{background:var(--hover);color:var(--t2)}
#viewCfg .statusrow{display:flex;align-items:center;gap:10px;margin-top:14px}
#viewCfg .statusrow .st{flex:1;min-width:0;font-size:12px;color:var(--t2);
  display:flex;align-items:center;gap:7px}
#viewCfg .statusrow .st::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--dot);flex:none}
#viewCfg .statusrow .st.busy::before{background:var(--folder)}
#viewCfg .statusrow .st.off::before{background:var(--t4)}
#viewCfg .statusrow .btn span{display:inline-flex}
#viewCfg .statusrow .btn .spin{animation:spinning 1s linear infinite;transform-origin:50% 50%}
@keyframes spinning{to{transform:rotate(360deg)}}

/* 芯片输入 */
#viewCfg .chipbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:38px;padding:5px 8px;
  border-radius:var(--r-md);background:var(--win);
  box-shadow:var(--el-1),0 0 0 1px var(--rule-row)}
#viewCfg .chipbox:focus-within{box-shadow:var(--el-1),0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
#viewCfg .chip{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 3px 0 9px;
  border-radius:7px;background:var(--field);color:var(--t1);font-size:12px;white-space:nowrap}
#viewCfg .chip .x{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;color:var(--t3);opacity:0;transition:opacity var(--d-fast) ease}
#viewCfg .chip .x svg{width:9px;height:9px;stroke-width:2}
#viewCfg .chip:hover .x{opacity:1}
#viewCfg .chip .x:hover{background:var(--hover);color:var(--t1)}
#viewCfg .chip.fresh{background:var(--accent-soft);color:var(--accent)}
#viewCfg .chipbox input{flex:1;min-width:120px;height:24px;border:0;background:none;outline:none;
  font-size:12px;color:var(--t1)}
#viewCfg .chipbox input::placeholder{color:var(--t4)}

/* 服务端返回的「问题」：黄条，贴在对应字段上方 */
#viewCfg .notice{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;
  background:var(--warn-bg);box-shadow:0 0 0 1px var(--warn-bd);
  font-size:12px;line-height:1.6;color:var(--t1);margin:0 0 9px}
#viewCfg .notice svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--warn)}

/* 只读信息行 */
#viewCfg .kvrow{display:flex;align-items:center;gap:10px;min-height:24px;font-size:12px}
#viewCfg .kvgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
#viewCfg .kvgrid .wide{grid-column:1/3}
#viewCfg .kvrow b{width:64px;flex:none;font-weight:400;color:var(--t3)}
#viewCfg .kvrow>span{color:var(--t2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 高级的折叠头 */
#viewCfg .disc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--accent);flex:none}
#viewCfg .disc svg{width:12px;height:12px}
#viewCfg .advrow{display:flex;align-items:center;gap:14px;margin:0 0 12px}
#viewCfg .advrow .advnote{flex:1;min-width:0;font-size:12px;color:var(--t3);line-height:1.6;margin:0}

/* 底部保存条：只有改过库/高级里的字段才出现 */
#viewCfg .dirtybar{flex:none;display:none;align-items:center;gap:10px;height:52px;padding:0 20px 0 28px;
  border-top:1px solid var(--rule-row);background:var(--win)}
#viewCfg.dirty .dirtybar{display:flex}
#viewCfg .dirtybar .msg{flex:1;min-width:0;font-size:12px;color:var(--t2);
  display:flex;align-items:center;gap:8px}
#viewCfg .dirtybar .msg::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--warn);flex:none}

/* 关于 */
#viewCfg .about{padding:76px 0 0;text-align:center}
#viewCfg .about .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:15px;overflow:hidden;
  box-shadow:var(--el-2)}
#viewCfg .about .ico img{width:64px;height:64px;display:block}
#viewCfg .about h3{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em}
#viewCfg .about .ver{margin:5px 0 0;font-size:12px;color:var(--t3)}
#viewCfg .about .desc{margin:12px 0 0;font-size:13px;color:var(--t2)}
#viewCfg .about .acts{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px}
#viewCfg .about .swline{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--t2)}
#viewCfg .about .links{display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:24px;font-size:12px}
#viewCfg .about .links i{color:var(--t4);font-style:normal}
#viewCfg .about .fine{margin:16px 0 0;font-size:11px;color:var(--t4)}

/* 英文的词比中文长：左标签 58px（照四个汉字量的）装不下 Line spacing，只读行的
   64px 装不下 Access token，说明句一行也说不完。这三条只在 :lang(en) 下生效，
   简体／繁體两版的排版一个像素都不动。左标签放到 90px 之后控件区还剩 388px，
   主题那三张 120px 的卡（共 384px）仍排得下一行。 */
:root:lang(en) #viewCfg .flab{width:90px}
:root:lang(en) #viewCfg .kvrow b{width:110px}
/* Agent 段的标签列要比别处宽：「Codex 与其他」按 58px 排不下，英文的
   「Command Line」「Codex & Others」按 90px 更排不下。写在上面那条 90px
   之后、再多挂一个 :root 顶上去——不然同样重的两条里后面那条赢。 */
:root #viewCfg [data-cfgpanel="agent"] .flab{width:132px}
:root:lang(en) #viewCfg [data-cfgpanel="agent"] .flab{width:150px}
:root:lang(en) #viewCfg .lblrow .ih{white-space:normal;overflow:visible;
  text-overflow:clip;line-height:1.5}

/* ═══ 新用户引导 ═══════════════════════════
   壳里才出现：整窗 --win 底，中间一张 600px 卡片，背后什么都不留。
   浏览器模式下这一层永远不挂。 */
#onbWrap{position:fixed;inset:0;z-index:150;display:none;background:var(--win);
  align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease-out}
#onbWrap.on{display:flex}
body.onb #chrome,body.onb #app,body.onb #banners{display:none!important}
/* 壳里留一条标签条高度的空拖拽带给红绿灯 */
#onbDrag{position:fixed;left:0;right:0;top:0;height:42px;z-index:151;display:none;
  -webkit-app-region:drag}
body.onb.shell #onbDrag{display:block}
#onbWrap .onb-card{width:600px;max-width:100%;border-radius:var(--r-xl);background:var(--card-face);
  box-shadow:var(--el-3);padding:36px 24px 26px;animation:arrive .3s var(--ease-out)}
#onbWrap .onb-head{text-align:center;padding:0 14px}
#onbWrap .onb-ico{width:72px;height:72px;margin:0 auto 18px;border-radius:17px;overflow:hidden;
  box-shadow:var(--el-2)}
#onbWrap .onb-ico img{width:72px;height:72px;display:block}
#onbWrap .onb-card h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1.4}
#onbWrap .onb-sub{margin:11px 0 0;font-size:13px;color:var(--t2);line-height:1.8}
#onbWrap .onb-foot{margin:22px 0 0;text-align:center;font-size:12px;color:var(--t3)}
#onbWrap .onb-fine{margin:18px 0 0;text-align:center;font-size:11px;color:var(--t4)}
#onbWrap .choices{display:flex;gap:12px;margin-top:26px;justify-content:center}
#onbWrap .choice{width:270px;height:176px;flex:none;text-align:left;padding:18px 18px 16px;
  display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--card-face);
  box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-slow) var(--ease-out),box-shadow var(--d-slow) var(--ease-out)}
#onbWrap .choice:hover{transform:translateY(-2px);box-shadow:var(--el-3)}
#onbWrap .choice:active{transform:translateY(0) scale(.99);transition-duration:80ms}
#onbWrap .choice .ci{width:32px;height:32px;border-radius:9px;flex:none;margin-bottom:12px;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center}
#onbWrap .choice .ci svg{width:18px;height:18px}
#onbWrap .choice h2{margin:0;font-size:14px;font-weight:600;line-height:1.4}
#onbWrap .choice p{margin:6px 0 0;font-size:12px;color:var(--t2);line-height:1.7}
#onbWrap .choice .path{margin-top:auto;display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--t3)}
#onbWrap .choice .path .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#onbWrap .choice.wait{opacity:.72;pointer-events:none}
/* 整理中：不定进度条 */
#onbWrap .pbar{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;
  position:relative;margin-top:26px}
#onbWrap .pbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--accent) 22%,var(--accent) 78%,transparent);
  animation:sweep 1.6s linear infinite}
@keyframes sweep{from{transform:translateX(-105%)}to{transform:translateX(255%)}}
#onbWrap .scanrow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:16px}
#onbWrap .scanrow .cnt{font-size:13px;color:var(--t2);flex:none;white-space:nowrap}
#onbWrap .scanrow .cnt b{font-size:15px;font-weight:600;color:var(--t1);margin:0 2px}
#onbWrap .scanrow .pth{font-size:11px;color:var(--t4);flex:1;min-width:0;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 整理好了 */
#onbWrap .okmark{width:48px;height:48px;margin:0 auto 16px;color:var(--ok)}
#onbWrap .okmark svg{width:48px;height:48px;stroke-width:1.5;fill:none;stroke:currentColor}
#onbWrap .stats{display:flex;gap:10px;margin-top:26px}
#onbWrap .stat{flex:1;min-width:0;text-align:center;padding:14px 8px 13px;border-radius:12px;
  background:var(--card-face);box-shadow:var(--el-1)}
#onbWrap .stat b{display:block;font-size:21px;font-weight:600;letter-spacing:.01em;line-height:1.2}
#onbWrap .stat span{display:block;margin-top:5px;font-size:11px;color:var(--t3)}
#onbWrap .skipnote{margin:16px 0 0;text-align:center;font-size:12px;color:var(--t3);line-height:1.7}
/* 找不到笔记库 */
#onbWrap .qmark{position:relative;width:56px;height:56px;margin:0 auto 16px;border-radius:15px;
  background:var(--field);color:var(--t3);display:flex;align-items:center;justify-content:center}
#onbWrap .qmark svg{width:28px;height:28px;stroke-width:1.5}
#onbWrap .qmark em{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;
  background:var(--card-face);box-shadow:var(--el-1);display:flex;align-items:center;
  justify-content:center;font:600 12px/1 var(--ui);font-style:normal;color:var(--t2)}
#onbWrap .oldpath{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;
  max-width:400px;height:32px;padding:0 12px;border-radius:9px;background:var(--field);
  font-size:12px;color:var(--t3)}
#onbWrap .oldpath svg{width:13px;height:13px;flex:none}
#onbWrap .oldpath span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#onbWrap .onb-btns{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px}
#onbWrap .onb-btns .btn{height:34px;padding:0 18px;border-radius:9px;font-size:13px}

/* 分段控件与普通按钮：凹底＋当前项白块，跟样张同一套 */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--field)}
.seg button{height:26px;padding:0 13px;border-radius:7px;font-size:12px;color:var(--t2);
  white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--segon);color:var(--t1);font-weight:500;box-shadow:var(--segshadow)}
/* 次级按钮：白底渐变 ＋ 顶部高光，不描边；主按钮 .key 换成淡紫底板 ＋ 强调色字 */
.btn{height:28px;padding:0 13px;border-radius:var(--r-sm);border:0;
  background:linear-gradient(#fff,#fafbfc);
  font-size:12px;color:var(--t1);box-shadow:var(--el-1),var(--hi);
  transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast) var(--ease-out)}
:root[data-theme="dark"] .btn{background:linear-gradient(#323843,#2c313a)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{
  background:linear-gradient(#323843,#2c313a)}}
.btn:hover{transform:translateY(-1px);box-shadow:var(--el-2),var(--hi)}
.btn:active:not([disabled]){transform:translateY(0);box-shadow:var(--el-1)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.key{background:var(--accent-soft);color:var(--accent)}
.btn.key:hover{background:var(--accent-soft)}

/* ═══ 顶部横幅：断线 / 升级 / 冲突 ═══════════
   界面里唯一允许出现的一行字，说的是「现在能不能用、你要做什么」，不是旁白。 */
#banners{position:fixed;top:0;left:0;right:0;z-index:160}
.bnr{display:none;align-items:center;justify-content:center;gap:12px;
  height:33px;padding:0 14px;font-size:11px;color:var(--t2);
  background:var(--card-face);border:0;
  box-shadow:var(--el-1);animation:arrive .18s ease-out}
.bnr.on{display:flex}
.bnr::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--accent);opacity:.75}
#offline.bnr::before{background:var(--t3)}
#conflict.bnr::before{background:var(--folder)}
.bnr .btn{height:22px;padding:0 10px;font-size:11px}
body.bnr-on #app{padding-top:calc(var(--chrome-h) + var(--bnr-h))}
body.bnr-on #chrome{top:var(--bnr-h)}

/* 底部状态栏 5.4 起取消：服务状态并进开始页大标题行尾那枚小圆点（.scan），
   「双击正文即可编辑」这类提示并进首次提示卡，字数本来就在文档 meta 行里。 */

/* ═══ 轻提示 ═══════════════════════════════
   一句话、两秒、不挡手。持久性的话走顶部横幅，不走这里。
   带动作按钮的那一版（notify(t,{action})，「已移到废纸篓 · 撤销」）多停几秒，
   而且只有它 pointer-events:auto——平时这张卡片飘在正文上，不该拦鼠标。 */
#toast{
  position:fixed;bottom:calc(var(--status-h) + 46px);left:50%;
  transform:translate(-50%,8px);
  background:var(--card-face);border:0;box-shadow:var(--el-3);
  border-radius:12px;font-size:12px;color:var(--t1);padding:11px 18px;
  z-index:200;pointer-events:none;opacity:0;
  transition:opacity .18s ease,transform .18s ease;
  max-width:calc(100% - 32px);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;padding:9px 10px 9px 18px}
.toast-act{
  flex:0 0 auto;font:inherit;font-weight:600;color:var(--accent);
  background:transparent;border:0;border-radius:8px;padding:5px 10px;
  cursor:pointer;white-space:nowrap;
}
.toast-act:hover{background:var(--hover)}

/* 页面切换的淡入。 */
.page-enter{animation:pageIn .19s ease-out}
@keyframes pageIn{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ═══ 窄窗口 ═══════════════════════════════ */
@media(max-width:900px){
  .section-head .section-meta{display:none}
}
@media(max-width:700px){
  .modal-footer span:last-child{display:none}
}

/* ═══ 独立窗口（solo）═══════════════════════ */
body.solo #side,body.solo .split{display:none!important}
body.solo #app{display:grid!important;grid-template-columns:minmax(0,1fr)}
body.solo .tabbar{display:none!important}
body.solo #chrome{display:none!important}

/* ═══ 打印：只出正文 ═══════════════════════
   ⌘P 走壳的 NSPrintOperation，打的是整个 WebView，所以界面得在这里收干净。 */
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  #side,.split,.tabbar,.outline,#outfloat,.relpanel,.editstatus,
  #chrome,#toast,
  .doc-toolbar,.formatbar,.doc-end,.editor-hint,
  #banners,#ctx,#fmt,#wlpick,#tabpick,#cmdkWrap,#qlwrap,#cfgWrap,#slash,#typeWrap,
  #userPop,#onbWrap,#onbDrag{display:none!important}
  #app{display:block!important;padding-top:0!important;height:auto!important}
  #docpane{position:static;overflow:visible}
  #panes{position:static}
  .pane{position:static;display:none;overflow:visible;padding:0}
  .pane.on{display:block}
  .doc-layout{max-width:none;padding:0}
  /* 开着大纲打印：栏藏了，网格列也得收，不然正文被挤在中间那一栏 */
  .doc-layout.ol-on,.doc-layout.ol-on.ol-3,
  .doc-layout.rel-on,.doc-layout.rel-on.ol-3{grid-template-columns:minmax(0,1fr);padding-left:0;padding-right:0}
  .document{max-width:none}
  .md{max-width:none}
  /* 苹方-港的 100/200 印在纸上会断线，打印时把正文兜到 300，粗体跟着抬同样一档。 */
  .md.f-hk{font-weight:max(300, var(--rw,400))}
  .md.f-hk strong,.md.f-hk b,.md.f-hk th,
  .md.f-hk h1,.md.f-hk h2,.md.f-hk h3{font-weight:min(600, calc(max(300, var(--rw,400)) + 200))}
  .md.f-hk h4,.md.f-hk h5,.md.f-hk h6{font-weight:min(600, calc(max(300, var(--rw,400)) + 100))}
  .histbox>.tw{display:block!important}
  /* 待办勾选框。框本身打得出来（原生控件，没被隐藏），但「勾」是 accent-color
     填出来的一块底色，浏览器打印默认丢背景色＝纸上只剩一排空框，做完的和
     没做的长得一样。强制按原色打，顺手把强调紫换成黑：紫在激光打印机上太淡。
     完成态的灰＋删除线由 :checked+span 那条管，这里不用重复。 */
  .md li.task input{-webkit-print-color-adjust:exact;print-color-adjust:exact;accent-color:#000}
}

/* ═══ 5.7：多笔记本 ═══════════════════════
   规矩两条，整段都在守它：
   · 颜色是身份，紫色是选中（P4）。八色只出现在色点、色点后的名字、
     设置里的小色块上；「谁被选中」永远是 --accent-soft ＋ --accent。
   · 单库零变化（P1）。这一段全部规则都挂在多笔记本才出现的元素上
     （.nbchips / .nd / .pc-seg.nb / …），一个笔记本时这些元素根本不画。 */

/* ── 色点 ──
   全套多笔记本 UI 只靠这一枚。默认 8px（笔记本条、设置），
   .sm 6px（标签页、⌘K 行、列表行、路径芯片）。
   不描边——实心圆本身就够；「找不到」那一态才换成一圈 inset 环。 */
.nd{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--nb,var(--t4))}
.nd.sm{width:6px;height:6px}
.nd.gone{background:none;box-shadow:inset 0 0 0 1.5px var(--t4)}

/* ── 笔记本条 ──
   位置：问候语之下、文件夹芯片行之上。骨架跟 .dirchips 一样（见上面合并的那两条），
   差异只有色点和 .dirchip 从来没有过的选中态。 */
.nbchips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 1px 12px}
/* 选中＝紫。色点留着——紫说「我被选中了」，色点说「我是谁」，两句话不打架。 */
.nbchip.on,.dirchip.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nbchip.on:hover,.dirchip.on:hover{background:var(--accent-soft);color:var(--accent)}
.dirchip.on svg{color:var(--accent)}
/* 「全部」没有色点：它不是一个笔记本，是没有筛选。 */
.nbchip.all{padding:0 14px}
/* 文件夹找不到：整枚压成 --t4，色点换空心环，尾巴挂一句小字。不移除。 */
.nbchip.gone{color:var(--t4);background:var(--field)}
.nbchip.gone:hover{color:var(--t3);background:var(--card-face)}
.nbchip .gonetag{font-size:10px;color:var(--t4)}
.nbchip.on .gonetag{color:var(--accent);opacity:.7}
/* 末尾那枚 ＋：跟 .chipfold 一样安静，不占底色。 */
.nbchip.add{background:none;color:var(--t4);padding:0 9px;gap:5px}
.nbchip.add:hover{background:var(--field);color:var(--t2);box-shadow:none;transform:none}
.nbchip.add svg{width:13px;height:13px}
.nbchip.fav svg{width:13px;height:13px;color:var(--pin);flex:none}
/* 名字长的截住：一条最多 168px，再长打省略号。 */
.nbchip .lbl{max-width:168px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 问候语旁那一笔 ──
   「早安，Lulu · ● 工作」。聚焦某个笔记本时才有；紫色不用，只用 --t3 ＋ 色点。 */
.home-greeting .here{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;
  margin-left:.42em;font-size:.58em;font-weight:400;color:var(--t3);letter-spacing:0}
.home-greeting .here .nd{width:7px;height:7px}

/* ── 卡片页脚 ──
/* ── 继续阅读大卡 ──
   这一行是普通文字流不是 flex，色点得自己带右边距。 */
.resume-bottom .nd{margin-right:5px}
.resume-bottom .nbname{color:var(--t3)}

/* ── 路径芯片 ──
   「● 工作 › 会议 › 周会.md」。开头那枚 .fi 黄夹子换成色点：同一个 14px 槽位，
   芯片一个像素都不变宽，fitPathChip 那套收 … 的逻辑照旧。 */
.pathchip .fi.nbdot{display:flex;align-items:center;justify-content:center;color:var(--nb)}
.pathchip .pc-seg.nb{color:var(--t2)}

/* ── 标签页 ──
   两案，用 .tabbar 上的修饰类切：(a) .nb-dot 标题前一枚 6px 色点；
   (b) .nb-bar 顶部 2px 色条（单条标签窄于 110px 时整条退到这一案）。
   5.8.1 起当前标签不再有 --tab-shadow，这条色条是 inset、跟着上两角的圆走，
   当前标签那条由下面这一条一起管，不必再单写一遍。 */
#tabstrip .tabbar.nb-dot .tab .nd{margin-right:-3px}
#tabstrip .tabbar.nb-bar .tab .nd{display:none}
/* --nb 得给个兜底值：没挂色点的标签（库外只读、别的来源）上 var(--nb) 解不出来，
   整条 box-shadow 声明会被丢掉，色条就不画了。 */
#tabstrip .tabbar.nb-bar .tab{box-shadow:inset 0 2px 0 var(--nb, transparent)}
#tabpick .tprow .nd{flex:none;margin-right:6px}

/* ── 左上那颗云 ──
   聚焦某个笔记本时，云的右下角挂一枚 7px 色点，外面一圈 --chrome 把它托起来。
   「全部」模式不挂——那时候 app 不处在任何一个笔记本里。 */
#navHome{position:relative}
#navHome .nd{position:absolute;right:1px;bottom:1px;width:7px;height:7px;
  box-shadow:0 0 0 2px var(--chrome);pointer-events:none}

/* ── ⌘K / 搜索结果 ── */
.search-row small .nd{margin-right:5px;position:relative;top:1px}
.search-row small .nbname{color:var(--t3)}
/* 这几处是普通文字流（不是列表行 .nmeta 那种 flex），› 得自己带左右间距 */
.search-row small .csep,.resume-bottom .csep,#toast .csep{margin:0 4px;color:var(--t4)}
/* 范围芯片行：⌘K 面板里贴在输入行下面，结果页里贴在 .serp-q 下面。 */
.modal .nbchips.scope{margin:0;padding:9px 14px 3px}
.serp .nbchips.scope{margin:0 0 14px;padding:0 12px}
.nbchips.scope .nbchip{height:26px;padding:0 11px;font-size:11px;gap:6px}
.nbchips.scope .nbchip .nd{width:7px;height:7px}

/* ── toast ── */
#toast .nd{margin:0 1px;position:relative;top:1px}

/* ── 文件夹下钻（§5）──
   面包屑在芯片行上方；子文件夹芯片另起一行、不占底色，比顶层浅一档，
   一眼看出「这是第二层」。被点开的那一枚顶层芯片进入 .on。 */
.dirchip.sub{height:26px;padding:0 11px;font-size:11px;
  background:none;color:var(--t3)}
.dirchip.sub svg{color:var(--t4)}
.dirchip.sub:hover{background:var(--card-face);color:var(--t1);box-shadow:var(--el-1)}
.dirchip.sub .n{color:var(--t4);font-size:10px}
.dirchips.subs{margin:-14px 1px 20px;padding-left:14px;gap:6px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:0 1px 10px;
  font-size:11.5px;color:var(--t3)}
.crumbs .cb{color:var(--t2)}
.crumbs .cb:hover{color:var(--t1)}
.crumbs .cb.now{color:var(--t1);font-weight:500}
.crumbs .sep{color:var(--t4)}
.crumbs .nd{margin-right:1px}

/* ── 提示卡多的那一句 ── */
.tipcard .tc-more{margin:13px 0 0;font-size:11.5px;color:var(--t2);
  display:flex;align-items:center;gap:8px}
.tipcard .tc-more svg{width:13px;height:13px;color:var(--accent);flex:none}

/* ═══ 设置 · 笔记本列表 ═══
   原来的「当前笔记库」那张 .vault 大卡换成一列 .nbrow。
   一行＝色块 / 名字（可改） / 灰字路径（点击访达显示） / 篇数 / 默认 / 移除。 */
#viewCfg .nblist{display:flex;flex-direction:column;gap:8px}
#viewCfg .nbrow{display:flex;align-items:center;gap:13px;padding:11px 14px;
  border-radius:12px;background:var(--card-face);box-shadow:var(--el-1)}
#viewCfg .nbsw{position:relative;width:28px;height:28px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;background:var(--nb-soft)}
#viewCfg .nbsw .nd{width:11px;height:11px}
#viewCfg .nbsw:hover{box-shadow:var(--el-1)}
#viewCfg .nbsw[aria-expanded="true"]{box-shadow:0 0 0 2px var(--accent)}
#viewCfg .nbrow .meta{flex:1;min-width:0}
#viewCfg .nbrow .nm{display:block;font-size:14px;font-weight:600;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:1px 3px;margin:-1px -3px;border-radius:5px}
#viewCfg .nbrow .nm:focus{background:var(--field);outline:none}
/* button 是 fit-content 撑的，光给 display:block 收不住：绝对路径很长，
   必须写死 width:100% 才会在行内打省略号而不是把整行顶出去。 */
#viewCfg .nbrow .pth{display:block;width:100%;font-size:11.5px;color:var(--t3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#viewCfg .nbrow .pth:hover{color:var(--t2)}
#viewCfg .nbrow .n{flex:none;font-size:11.5px;color:var(--t3);
  font-variant-numeric:tabular-nums}
#viewCfg .nbrow .nbacts{flex:none;display:flex;align-items:center;gap:4px}
/* 「默认」是个既成事实，不是按钮：紫底小标。「设为默认」才是 .btnt。 */
#viewCfg .nbtag{flex:none;font-size:10px;font-weight:600;letter-spacing:.03em;
  color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px}
/* 找不到：整行压灰，色点换空心环，路径那一行换成一句话 ＋「重新定位…」。 */
#viewCfg .nbrow.gone{background:var(--warn-bg);box-shadow:0 0 0 1px var(--warn-bd)}
#viewCfg .nbrow.gone .nm{color:var(--t2)}
#viewCfg .nbrow.gone .nbsw{background:var(--field)}
#viewCfg .nbrow.gone .pth{color:var(--t4)}
#viewCfg .nbadd{margin-top:10px}
/* 八色小色盘：4×2，一格 26px。当前那一格套一圈紫。 */
#viewCfg .nbpal{position:absolute;top:34px;left:-8px;z-index:30;
  display:grid;grid-template-columns:repeat(4,26px);gap:7px;padding:9px;
  border-radius:12px;background:var(--card-face);box-shadow:var(--el-3);
  animation:arrive .14s ease-out}
#viewCfg .nbpal span{width:26px;height:26px;border-radius:8px;background:var(--nb-soft);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
#viewCfg .nbpal span .nd{width:11px;height:11px}
#viewCfg .nbpal span.on{box-shadow:0 0 0 2px var(--accent)}
/* 「哪个笔记本的选项」——随手记 / 整理范围两段共用的小分段控件。 */
#viewCfg .seg.nbseg button{display:inline-flex;align-items:center;gap:6px}
#viewCfg .seg.nbseg .nd{width:7px;height:7px}
/* 头像浮层那一行的色点 */
#userPop .vault .v .nd{margin-right:5px;position:relative;top:1px}
/* [[题名]] 多个候选那一列 */
#wlpick .nd{margin-right:6px}

const ASEP=String.fromCharCode(1);

  ok=ok||TR('好'); cancel=cancel||TR('取消');

/* ═══ 口令门禁 ═══════════════════════════
   服务出页时把 <meta name="amn-token"> 里的占位串换成真 token。所有 POST 与
   /__rescan 带 X-AMN-Token 头；GET 只读路由不带（页面里 <img> 带不了头）。
   占位串在这里必须拼出来，不能写成字面量——服务端是按字面替换的，
   写成字面量会连这一行一起换掉，降级判断就永远为假。 */

  const h = Object.assign({'Content-Type':'application/json', 'X-AMN-Lang': LANG}, extra||{});
  if(TOKEN_OK) h['X-AMN-Token'] = TOKEN;
  return h;
}
/* 降级：旧服务出的页里 meta 还是占位串。POST 不带头照发（旧服务本来也不校验），

function bnr(id, on){
  const el=$('#'+id); if(!el) return;
  el.classList.toggle('on', !!on);
  const n=$$('#banners .bnr.on').length;
  document.body.classList.toggle('bnr-on', !!n);
  // 三条同时挂出来的时候（升级 ＋ 离线），标签条要按实际条数往下让
  document.documentElement.style.setProperty('--bnr-h', (n*33)+'px');
  // 芯片跟着往下挪了，开着的浮层得重新贴上去（没开着这一句自己就返回）
  placeUserPop();

/* 写死在 <body> 里的那些字。键＝trim 并把连续空白压成一个空格之后的原文；
   「标签 ＋ 快捷键」（后退 ⌘[、关闭 Esc）只把标签部分当键，快捷键原样接回去。
   alt="AM·Note"（没有中日韩字）和空属性一律不动。 */
const I18N_ATTRS = ['title','placeholder','aria-label','alt'];
const KBD_TAIL = /^([\s\S]*?)[\s　]+((?:[⌘⌥⇧⌃][^\s　]*)|Esc)$/;
function tPhrase(str){
  const m = KBD_TAIL.exec(str);
  if(m && CJK.test(m[1])) return withKbd(TR(m[1]), m[2]);
  return TR(str);
}
function bootI18n(){
  /* CSS 的 content: 只认字面量，翻不了；先把三条占位写进自定义属性。 */
  const css = document.documentElement.style;
  css.setProperty('--i18n-ph-h1', JSON.stringify(TR('无标题')));
  css.setProperty('--i18n-ph-p', JSON.stringify(TR('写点什么…')));
  css.setProperty('--i18n-ph-src', JSON.stringify(TR('改源码')));
  if(LANG==='zh-Hans') return;                 // 源语言：markup 本来就是对的
  const w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const jobs=[]; let n;
  while((n=w.nextNode())){
    const tag=(n.parentNode && n.parentNode.tagName)||'';
    if(tag==='SCRIPT'||tag==='STYLE') continue;
    if(!CJK.test(n.nodeValue||'')) continue;
    jobs.push(n);
  }
  jobs.forEach(node=>{
    const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(node.nodeValue);
    const src=m[2].replace(/\s+/g,' ');
    if(!src) return;
    const out=tPhrase(src);
    if(out!==src) node.nodeValue=m[1]+out+m[3];
  });
  document.querySelectorAll('*').forEach(el=>{
    I18N_ATTRS.forEach(a=>{
      const v=el.getAttribute(a);
      if(!v) return;
      const src=v.replace(/\s+/g,' ').trim();
      if(!src || !CJK.test(src)) return;
      const out=tPhrase(src);
      if(out!==src) el.setAttribute(a, out);
    });
  });
}

    const s=String(path||'');
    const n=NB.of(s);
    return n ? s.slice(n.length+1) : s;
  },
  /* 前缀路径 → 它所在笔记本的绝对根。单库退回 LIBROOT。 */
  rootOf(path){
    const n=NB.of(path);
    if(n){ const b=NB.byName(n); return b ? String(b.路径||'') : ''; }
    return LIBROOT;
  },
  color(name){
    const b=NB.byName(name);
    const c=b && b.颜色;
    return NB_COLORS.indexOf(c)>=0 ? c : 'slate';
  },
  cls(name){ return 'nb-'+NB.color(name); },
  offline(name){ const b=NB.byName(name); return !!(b && b.状态==='离线'); },
  /* 所有根：多本各一条，单本就是 LIBROOT（名字为空＝路径不加前缀）。
     openPath(绝对路径)／拖进来的文件按这张表取最长前缀。 */
  roots(){
    if(NB.multi) return NB.list.map(n=>({name:n.名字, root:String(n.路径||'')}));
    if(NB.list.length===1) return [{name:'', root:String(NB.list[0].路径||'')}];
    return LIBROOT ? [{name:'', root:LIBROOT}] : [];
  },
};
/* 路径里笔记本名占掉的段数：多本 1，单本 0。切 _d0/_d1、算「这一层」都用它。 */
const bookDepth = () => NB.multi ? 1 : 0;
/* 色点。多笔记本才画，单库一枚都没有（P1）。 */
function nbDot(name, opt){
  if(!NB.multi || !name) return '';
  opt=opt||{};
  return `<i class="nd${opt.sm?' sm':''}${opt.gone?' gone':''} ${NB.cls(name)}"></i>`;
}
/* 前缀路径 → 绝对路径。原来那六处 LIBROOT+'/'+rel 全走这里。 */
function absOf(rel){
  const r=NB.rootOf(rel);
  return r ? r+'/'+NB.strip(rel) : '';
}
/* 这一条属不属于当前聚焦的笔记本。「全部」和单库一律为真。 */
function inCurBook(i){
  const cur=NB.cur;
  return !cur || NB.of(i && (i.路径||i)) === cur;
}
/* 某一本的随手记目录（前缀路径）。name 为空＝主／单笔记本。 */
function noteDirOf(name){
  const b=name ? NB.byName(name) : null;
  const d=(b && b.随手记目录) || NOTE_DIR;
  return NB.multi && name ? name+'/'+d : d;
}
/* 绝对路径 → 前缀路径（取最长匹配的那个根）。不在任何一本里就回 null。 */
function relFromAbs(abs){
  const p=String(abs||'');
  let best=null;
  NB.roots().forEach(r=>{
    if(!r.root) return;
    const root=r.root.replace(/\/+$/,'')+'/';
    if(p.indexOf(root)!==0) return;
    if(best && best.root.length>=root.length) return;
    best={root, name:r.name, rel:p.slice(root.length)};
  });
  if(!best || !best.rel) return null;
  return best.name ? best.name+'/'+best.rel : best.rel;
}

/* ── 存储里的路径迁移 ──────────────────────
   tp-state 里存路径的只有三处：pins[]、recents[].路径、lastPath。
   `nbMark` 记着它们此刻是什么形态：'' ＝无前缀，'multi' ＝带笔记本名前缀。
   服务端说的模式跟它对不上就迁一次：
     单 → 多：老键只可能属于主笔记本，统一加上主笔记本名前缀；
     多 → 单：剥掉等于那唯一一本名字的前缀，别的本的键直接丢（那些文件已经不在库里了）。
   迁完之前 prunePins() 不剪枝——它按 items 里的路径认领，形态不一致会把收藏全删光。 */
let nbReady=false;
/* 跑起来之后又翻了一次面（别的窗口、CLI、壳菜单动了笔记本，这一趟轮询才发现）。
   首屏那一次不算：那时候还没有开着的标签，迁完照常画就是了。 */
let nbFlipped=false;
function nbMapStored(fn){
  const pins=Array.isArray(ST.pins)?ST.pins:[];
  ST.pins=pins.map(fn).filter(Boolean);
  const rec=Array.isArray(ST.recents)?ST.recents:[];
  ST.recents=rec.map(r=>{
    if(!r || !r.路径) return null;
    const p=fn(r.路径);
    return p ? Object.assign({}, r, {路径:p}) : null;
  }).filter(Boolean);
  if(ST.lastPath) ST.lastPath=fn(ST.lastPath)||'';
}
function nbMigrate(mode, mainName){
  const want = mode==='多' ? 'multi' : '';
  const have = ST.nbMark==='multi' ? 'multi' : '';
  if(want===have) return false;
  if(want==='multi'){
    if(!mainName) return false;                    // 名字还没到，下一趟再迁
    const pre=mainName+'/';
    nbMapStored(p=>{ p=String(p||''); return (!p || p.indexOf(pre)===0) ? p : pre+p; });
  }else{
    const pre=mainName ? mainName+'/' : '';
    nbMapStored(p=>{
      p=String(p||''); if(!p) return '';
      if(pre && p.indexOf(pre)===0) return p.slice(pre.length);
      return p.indexOf('/')<0 ? p : '';            // 别的本的：丢
    });
  }
  ST.nbMark=want;
  ST.nb='';                                        // 形态换了，「当前笔记本」重来
  saveST();
  return true;
}
/* 服务端给的笔记本列表落地。/__status 和多本的 /__tree 都会调，谁先到算谁的。 */
function nbApply(list, mode){
  if(!Array.isArray(list) || !list.length) return false;
  const before=JSON.stringify(NB.list.map(n=>[n.名字,n.颜色,n.状态,n.默认,n.路径]));
  NB.list=list;
  if(mode) NB.mode=mode;
  const m = mode || (list.length>=2 ? '多' : '单');
  const first=!nbReady;
  if(nbMigrate(m, (list[0]||{}).名字||'') && !first) nbFlipped=true;
  nbReady=true;
  const after=JSON.stringify(NB.list.map(n=>[n.名字,n.颜色,n.状态,n.默认,n.路径]));
  return before!==after;
}
/* 存储里的路径形态翻了面（单↔多），或者同源另一个窗口刚翻过：手上的 TABS /
   stack / CLOSED / NOTEPV / TRASHED 全是旧形态，半页新半页旧是最难查的一类错，
   所以只走「落盘 → 整页重来」这一条——跟切换界面语言是同一条老路（setLang）。
   存不下就**不 reload**：重载等于把没落盘的字扔了。挂起来，等编辑收了在 tick() 里补。
   opt.writeST＝这一趟是自己迁的，ST 得先手写一遍（防抖那 300 毫秒等不到 reload）；
   别的窗口迁的那一趟一个字都别写，手上这份是旧形态。 */
async function reloadForNb(opt){
  opt=opt||{};
  nbFlipped=false;
  if(opt.writeST) saveSTNow();
  if(!(await saveAllForReload())){
    nbHold={writeST:!!opt.writeST, quiet:true};
    if(!opt.quiet) notify(TR('先把这一份存好，笔记本的改动才跟得上'));
    return false;
  }
  nbHold=null;
  if(opt.writeST) saveSTNow();
  location.reload();
  return true;
}

/* ═══ 个人资料 ═══════════════════════════
   名字、头像、要不要问候，三样都在服务端（Application Support 里的 profile.json），
   一个都不进 localStorage——localStorage 是按端口分家的，端口一变就是另一份，
   个人资料不该跟着丢。启动时并行拉一次，之后每存成功一次就换成响应里的那份。 */
let PROFILE = {名字:'', 默认名字:'', 头像:false, 头像版本:0, 问候:true, 更新于:''};
async function loadProfile(){
  try{
    const r=await fetch('/__profile',{cache:'no-store'}); if(!r.ok) throw 0;
    const p=await r.json();
    if(p && p.ok) PROFILE=p;
  }catch(e){}                       // 老服务没有这条路由：一切如旧，不问好、芯片留空
  applyProfile();
}
/* 显示名＝自己起的名字，没起就用这台 Mac 的账户名。两个都空＝一句都不问。 */
function profileName(){
  return String((PROFILE.名字||'').trim() || (PROFILE.默认名字||'').trim());
}
/* 首字母：整个码位取一个（emoji 是两个 UTF-16 单元），拉丁字母抬成大写。 */
function profileInitial(){
  const s=profileName();
  if(!s) return '';
  const c=String.fromCodePoint(s.codePointAt(0));
  return /[a-z]/.test(c) ? c.toUpperCase() : c;
}
/* 头像地址带版本号：服务端出的是 no-store，但换头像后地址也变，图片缓存一并让开。 */
function avatarSrc(){ return PROFILE.头像 ? '/__avatar?v='+(PROFILE.头像版本||0) : ''; }
/* 有头像画头像，没头像画首字母；名字也拿不到（服务没起、旧服务没这条路由）
   就画一枚人形，右上角不留一个空圈。 */
function avatarHtml(sz){
  const src=avatarSrc();
  if(src) return `<img src="${esc(src)}" alt="" data-av>`;
  const c=profileInitial();
  return c ? esc(c) : icon('user', sz||14);
}
/* 图裂了（服务重启、文件被人删了）就退回首字母，不留一块空白。
   只重画裂掉的这一处：PROFILE.头像 不动——一次超时就把整份资料判成「没有头像」，
   别处的头像会跟着一起掉成首字母，下一次存资料还会把这个错值写回去。 */
function wireAvatars(root){
  (root||document).querySelectorAll('img[data-av]').forEach(img=>{
    img.onerror=()=>{
      const b=img.parentElement; if(!b) return;
      const c=profileInitial();
      b.innerHTML = c ? esc(c) : icon('user', b.clientHeight>40 ? 32 : 14);
    };
  });
}
/* 三档问候按本地时间分：5–11 早上，12–17 下午，其余晚上。 */
const GREETINGS = [K('早上好，{name}'), K('下午好，{name}'), K('晚上好，{name}')];
function greetOn(){ return PROFILE.问候!==false && !!profileName(); }
/* 「开始页向我问好」那颗开关的回填。按下去先翻面再存，存不成得翻回来，
   所以单拎成一条，syncPrefControls 和 syncProfilePanel 都走它。 */
function syncGreetSwitch(){
  const gr=$('#cfgGreet'); if(!gr) return;
  const on=PROFILE.问候!==false;
  gr.classList.toggle('on', on);
  gr.setAttribute('aria-checked', on?'true':'false');
}
function greetTitle(){
  const h=new Date().getHours();
  return TR(GREETINGS[(h>=5&&h<12) ? 0 : ((h>=12&&h<18) ? 1 : 2)], {name:profileName()});
}
/* 存一笔（任意子集）。存成了就把 PROFILE 换成响应，芯片和开始页跟着刷新。
   排成一队发：昵称是边打边存的，两发并行时先送出去的那一发后回来，PROFILE
   就退回了上一个值。串起来之后，最后送出去的那一发一定最后落地。 */
let profileQueue=Promise.resolve();
function saveProfile(patch){
  const run=()=>postProfile(patch);
  const p=profileQueue.then(run, run);
  profileQueue=p.then(()=>{}, ()=>{});     // 队列本身不带失败，不然后面全被短路
  return p;
}
async function postProfile(patch){
  try{
    const r=await (await fetch('/__profile',{method:'POST', headers:hdrs(),
      body:JSON.stringify(patch||{})})).json();
    if(!r.ok){ notify(r.错误||TR('没保存成功')); return null; }
    PROFILE=r; applyProfile(); return r;
  }catch(e){ notify(TR('服务没应答')); return null; }
}
/* 资料变了要动的三处：开始页问候旁的芯片、设置页那块头像、开始页的问候。
   设置页只回填控件不重画整段——昵称输入框正在打字，重画会把焦点弄丢。 */
function applyProfile(){
  syncUserChip();
  syncProfilePanel();
  repaintPages();
}
function syncUserChip(){
  const b=$('#userChip'); if(!b) return;
  b.innerHTML=avatarHtml();
  wireAvatars(b);
  b.title=profileName() || TR('个人资料');
  if(userPopOn()) openUserPop();          // 开着就顺手重画一遍浮层
}

/* ── 右上角浮层 ───────────────────────── */
function userPopOn(){ const p=$('#userPop'); return !!(p && p.classList.contains('on')); }
function closeUserPop(){
  const p=$('#userPop'); if(!p || !p.classList.contains('on')) return;
  p.classList.remove('on');
  const b=$('#userChip'); if(b) b.setAttribute('aria-expanded','false');
}
/* 当前库：壳注入的绝对路径优先，浏览器里退回 /__status 的库根。 */
function vaultPath(){ return String(window.__AMN_VAULT_PATH__ || LIBROOT || ''); }
function openUserPop(){
  const p=$('#userPop'), b=$('#userChip'); if(!p || !b) return;
  const nm=profileName(), path=vaultPath();
  /* 多笔记本时这一格改说「我现在在哪本」；单库一字不变（P1）。 */
  const cur=NB.cur;
  const vault = NB.multi
    ? `<div class="vault"><span class="k">${esc(cur?TR('当前笔记本'):TR('全部笔记本'))}</span>
      <span class="v">${cur ? nbDot(cur)+esc(cur)
        : esc(TR('{n} 本',{n:NB.list.length}))}</span></div>`
    : (path?`<div class="vault"><span class="k">${esc(TR('当前笔记库'))}</span>
      <span class="v" title="${esc(path)}">${esc(baseName(path))}</span></div>`:'');
  const swap = NB.multi
    ? `<button type="button" data-up="manage">${esc(TR('管理笔记本…'))}</button>`
    : (SHELL ? `<button type="button" data-up="choose">${esc(TR('更换笔记库…'))}</button>` : '');
  p.innerHTML=`<div class="who">
      <span class="av">${avatarHtml(22)}</span>
      <span class="nm">${esc(nm||TR('个人资料'))}</span>
    </div>
    ${vault}
    <div class="acts">
      <button type="button" data-up="edit">${esc(TR('编辑资料…'))}</button>
      ${swap}
    </div>`;
  wireAvatars(p);
  p.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{
    const a=x.dataset.up;
    closeUserPop();
    if(a==='edit'){ ST.cfgTab='profile'; saveST(); openCfg(); }
    else if(a==='manage'){ ST.cfgTab='library'; saveST(); openCfg(); }
    else if(a==='choose') post({type:'chooseVault'});
  });
  p.classList.add('on');
  b.setAttribute('aria-expanded','true');
  placeUserPop();
}
/* 贴着问候旁头像的左缘往下掉一格；窗口右边挤不下就往里收，浮层不出屏。 */
function placeUserPop(){
  const p=$('#userPop'), b=$('#userChip');
  if(!p || !b || !p.classList.contains('on')) return;
  const r=b.getBoundingClientRect(), w=p.offsetWidth||236;
  p.style.left=Math.max(10, Math.min(r.left, innerWidth-w-10))+'px';
  p.style.top=(r.bottom+8)+'px';
}

/* ── 头像图片：裁方、缩到 256、转 PNG ──────
   服务端只认原始字节，所以缩放在这边做完再发：一张 4000×3000 的照片直接传上去
   既慢又占地方，而芯片最大也只画到 72 逻辑像素。 */
const AVATAR_PX = 256;
async function avatarBase64(file){
  const img=await loadBitmap(file);
  try{
    const w=img.width||img.naturalWidth, h=img.height||img.naturalHeight;
    if(!w || !h) throw new Error('empty');
    const side=Math.min(w, h);                     // 居中裁一个正方形
    const cv=document.createElement('canvas');
    cv.width=cv.height=AVATAR_PX;
    const cx=cv.getContext('2d');
    cx.imageSmoothingQuality='high';
    cx.drawImage(img, (w-side)/2, (h-side)/2, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
    return String(cv.toDataURL('image/png')).split(',')[1]||'';
  }finally{
    if(img.close) try{ img.close(); }catch(e){}
    // objectURL 要等画完再撤：撤早了 Safari 有机会画出一张白图
    if(img._objUrl) try{ URL.revokeObjectURL(img._objUrl); }catch(e){}
  }
}
/* <img> ＋ objectURL 那条路。WebKit 的 <img> 解得了 HEIC，createImageBitmap 不解，
   所以这不只是「旧浏览器兜底」，是 iPhone 照片真正走的那一条。 */
function loadImgEl(file){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im._objUrl=u;                                  // 画完由 avatarBase64 撤
    im.onload=()=>ok(im);
    im.onerror=()=>{ URL.revokeObjectURL(u); no(new Error('decode')); };
    im.src=u;
  });
}
/* createImageBitmap 认不了这一张（HEIC、或者旧 WebKit 压根不吃 File）时是
   **异步 reject** 的：包一层 try/catch 只兜得住同步抛错（比如不认第二个参数），
   真正的退路得挂在 .catch 上，不然这一发直接变成一条没人接的 rejection。 */
function loadBitmap(file){
  if(window.createImageBitmap){
    try{
      return Promise.resolve(createImageBitmap(file, {imageOrientation:'from-image'}))
        .catch(()=>loadImgEl(file));
    }catch(e){}
  }
  return loadImgEl(file);
}

const IS_HTTP = location.protocol.startsWith('http');

/* ── 独立窗口 ────────────────────────────
   `/portal?solo=1&doc=<库根相对路径>`：一份文稿一个窗口，只有正文。
   它不发 `client=portal` 那条轮询——那条会把 Agent 排的「打开这份」队列取走，
   独立窗口不该替主窗口收件（app_shell.m 设计约束 4）。 */
const QS = new URLSearchParams(location.search);
const SOLO = IS_HTTP && QS.get('solo')==='1';
if(SOLO) document.body.classList.add('solo');
function openSolo(rel){
  if(!rel || !IS_HTTP) return;
  window.open('/portal?solo=1&doc='+encodeURIComponent(rel), '_blank', 'width=1020,height=940');
}
// 新建随手记落哪。默认「随手记」，真正目录从 /__status 的「随手记目录」读。
let NOTE_DIR = '随手记';
const seg = p => p.split('/').map(encodeURIComponent).join('/');
const url = p => IS_HTTP ? '/'+seg(p)
  : 'file:///'+seg(LIBROOT.replace(/^\//,''))+'/'+seg(p);

/* ── MD 里的相对路径 ─────────────────────
   MD 里的图片和链接是相对它自己所在目录写的，而门户的地址是 /portal，
   浏览器拿 /portal 当基准去解，于是 ![](图示/x.svg) 被解成 /图示/x.svg → 404，
   图片一张都出不来。这里按这份 MD 所在的目录，把相对路径解成库根下的绝对路径。 */
const dirOf = p => { const i=String(p||'').lastIndexOf('/'); return i<0?'':String(p).slice(0,i); };
const unesc = s => String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<')
  .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
/* md 里写 `/图示/x.svg` 这种「从库根算起」的地址，多笔记本时算的是**写它那一本的根**
   （P7：路径以笔记本名开头，跨本引用没有意义）。base 是这份文档所在的目录，
   头一段就是它那一本。单库回空串，一切照旧。 */
function nbAbsBase(base){
  const n=NB.multi ? NB.of(base||'') : '';
  return n ? n+'/' : '';
}

function resolveRef(u, base, isImg){
  // inl() 是先 esc() 再跑正则的，所以这里拿到的已经是转义过的文本，先还原
  u = unesc(String(u||'').trim());
  if(!u) return '';
  if(/^(?:[a-z][a-z0-9+.\-]*:|\/\/|#)/i.test(u)){
    // 带 scheme 的、协议相对的、页内锚点：不动。
    // 但 javascript: 这类要挡掉——以前 esc() 先跑、链接正则后跑，
    // [x](javascript:…) 能活着进 href，门户现在跑在原生壳里，别留这个口子。
    const ok = isImg ? /^(?:https?:|data:image\/|\/\/)/i.test(u)
                     : /^(?:https?:|mailto:|#|\/\/)/i.test(u);
    return ok ? u : (isImg ? '' : '#');
  }
  const parts = (u[0]==='/' ? nbAbsBase(base)+u.slice(1) : (base ? base+'/'+u : u)).split('/');
  const out=[];
  for(const s of parts){
    if(!s || s==='.') continue;
    if(s==='..'){ out.pop(); continue; }
    out.push(s);
  }
  // MD 里可能已经写成 %E5%9B%BE 这种，先解回来再统一编码，免得二次编码
  return url(out.map(s=>{ try{ return decodeURIComponent(s); }catch(e){ return s; } }).join('/'));
}

/* ── 交给系统 ────────────────────────────
   html 在标签里用沙箱 iframe 打开；pdf / Excel / Word 仍去各自的默认程序。
   「在浏览器里打开」那颗地球按钮才走这条。 */
async function openExternal(rel){
  if(!rel || !IS_HTTP) return;
  try{
    const r=await (await fetch('/__external',{method:'POST',
      headers:hdrs(), body:JSON.stringify({路径:rel})})).json();
    if(!r.ok) tell(TR('打不开'), r.错误||'');
  }catch(e){ tell(TR('打不开'), TR('服务没应答')); }
}
/* 在访达里打开库根。服务端现在还要求非空路径（Phase B 放宽 /__reveal），
   被拒了就退回「当前这份文档」那条老路，两条都不行才出一句提示。 */
async function revealVault(){
  if(IS_HTTP){
    try{
      // 聚焦某一本时开那一本的根（空串在多本里没有着落，服务端会当成主笔记本）
      const r=await (await fetch('/__reveal',{method:'POST',
        headers:hdrs(), body:JSON.stringify({路径:NB.cur ? NB.cur+'/' : ''})})).json();
      if(r && r.ok) return;
    }catch(e){}
  }
  const t=(typeof active==='function') ? active() : null;
  if(t && t.path && !t.ext){ revealPath(t.path); return; }
  flash(TR('这个版本还打不开库根，先从访达里自己进去'));
}
async function revealPath(path){
  if(!path || !IS_HTTP) return;
  try{
    const r=await (await fetch('/__reveal',{method:'POST',
      headers:hdrs(), body:JSON.stringify({路径:path})})).json();
    if(!r.ok) flash(r.错误||TR('打不开访达'));
  }catch(e){ flash(TR('服务没应答')); }
}
/* 所有「拷到剪贴板」都走这一条：壳里 NSPasteboard，浏览器里 navigator.clipboard。
   返回 Promise<boolean>——浏览器那条在没有用户手势时会被拒，不能一律报「已拷贝」。 */
async function copyText(t){
  if(!t) return false;
  if(SHELL){ post({type:'clip', text:t}); return true; }
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}
/* opt.text 直接给整串（库外文档用绝对路径），opt.msg 换掉回执文案。
   不带 opt 的调用一个字都没变——菜单、⌥⌘C、右键都还是老样子。 */
function clipPath(rel, opt){
  opt=opt||{};
  let txt=opt.text||'';
  if(!txt){
    if(!rel) return;
    if(!LIBROOT){ flash(TR('还没连上服务')); return; }
    txt='file://'+absOf(rel);
  }
  copyText(txt).then(ok=>flash(ok ? (opt.msg||TR('路径已拷贝')) : TR('拷不了')));
}
/* 一句话的回执，两秒多自己消失。窗口底部居中一张小卡片。
   持久的事（断线、升级、冲突）走顶部横幅 bnr()，不走这里。

   第二个参数可选 {action:{label,fn}, ms}：右侧多一颗按钮（「撤销」就是它），
   停留时间也能加长。**只有带按钮那一版收鼠标**——平时这张卡片
   pointer-events:none，飘在正文上不挡手，加了按钮才临时打开，
   收掉的时候一起关回去。 */
let toastT=null;
function notify(t, opt){
  const el=$('#toast'); if(!el){ return; }
  opt=opt||{};
  const act=opt.action;
  el.innerHTML='';
  const sp=document.createElement('span');
  sp.className='toast-text';
  sp.textContent=String(t||'');
  el.appendChild(sp);
  if(opt.html) sp.innerHTML=opt.html;            // 「已在 ● 工作 新建」那种带色点的
  if(act && act.label){
    const b=document.createElement('button');
    b.type='button'; b.className='toast-act'; b.textContent=act.label;
    // 位置传给回调：「换一个」要在这颗按钮旁边弹一列笔记本，收掉之后就量不到了
    b.onclick=()=>{ const r=b.getBoundingClientRect(); hideToast(); if(act.fn) act.fn(r); };
    el.appendChild(b);
  }
  el.classList.toggle('act', !!(act && act.label));
  el.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(hideToast, Math.max(1200, +opt.ms || 2400));
}
function hideToast(){
  const el=$('#toast'); if(!el) return;
  clearTimeout(toastT); toastT=null;
  el.classList.remove('on','act');
}
/* 老代码里到处在调 flash()，名字留着，统一走 toast。 */
function flash(t){ notify(t); }

/* ── 阅读版式 ─────────────────────────────

   默认」的人迁过来，自己调过的一律不动。 */
const DEF_PREF = {font:'f-sans', fw:400, fs:17, lh:180, w:690, theme:'auto', lang:'auto'};

(function migratePrefs(){
  if(!PREF.prefsGen){
    if(+PREF.w === 740) PREF.w = 680;
    PREF.prefsGen = 1;
  }
  if(PREF.prefsGen < 2){

let FONTS_INFO = null;

/* 换界面语言。壳和网页要一起换，所以只走「落盘 → 整页重来」这一条：
   壳收到 setLanguage 之后自己重建菜单再 reload，浏览器里页面自己 reload。
   正在编辑的先存好，存不下就停在原地（语言偏好已经写下了，下次打开生效）。 */
async function setLang(v){
  if(['auto','zh-Hans','zh-HK','en'].indexOf(v)<0) return;
  if((SHELL_LANG_PREF || PREF.lang || 'auto')===v) return;
  // 先全存住再写偏好：存不下就停在原地，偏好也不能改——写了它下次打开就换了语言，
  // 而这一份还没落盘的字，用户以为「我按了取消」。
  if(!(await saveAllForReload())){ notify(TR('先把这一份存好，再换语言')); return; }
  PREF.lang=v; savePref();
  if(SHELL){
    /* 壳收到之后自己重建菜单再 reload。但 AppKit 自带的那几项（服务、字体、
       输入法…）是按 AppleLanguages 在启动时定的，这一轮换不掉，重载回来说一声。 */
    try{ localStorage.setItem('tp-lang-switched','1'); }catch(e){}
    post({type:'setLanguage', lang:v});
  }
  else location.reload();
}

   saveBeforeLeave 自己提示过了）；不抛异常——壳等着这个结果决定什么时候重载。
   壳换语言前会对每块 webview 调一次：主窗自己在 setLang 里走过这一遭，独立窗
   （⌥⌘O）没有别的落盘时机，只有 pagehide 那条 keepalive，而 keepalive 的请求体
   有 64KiB 上限，长笔记根本发不出去，重载就等于把字扔了。 */
async function saveAllForReload(){
  let ok=true;
  for(const tb of TABS.slice()){
    try{ if(tb.editing && !(await saveBeforeLeave(tb))) ok=false; }
    catch(e){ ok=false; }
  }
  return ok;
}
function toggleTheme(){
