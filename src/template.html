function wireCfg(tab){
  const body=$('#cfgBody');
  // 「访达 / 更换文件夹 / 检查更新 / 拷路径」四段里都可能有，统一先贴一遍
  body.querySelectorAll('[data-cfga]').forEach(b=>b.onclick=()=>cfgAction(b.dataset.cfga));
  if(tab==='reading'){
    $$('#cfgBody [data-tc]').forEach(b=>b.onclick=()=>setPref('theme', b.dataset.tc));
    $$('#cfgBody [data-fc]').forEach(b=>b.onclick=()=>setPref('font', b.dataset.fc));
    const fs=$('#cfgFs'); if(fs) fs.oninput=e=>setPref('fs', +e.target.value);
    $$('#cfgBody .seg[data-k] button').forEach(b=>b.onclick=()=>
      setPref(b.parentElement.dataset.k, +b.dataset.v));
    const tc=$('#cfgToc');
    if(tc) tc.onclick=()=>{ ST.toc = !(ST.toc!==false); saveST(); syncToc(); syncPrefControls(); };
    const cq=$('#cfgChips');
    if(cq) cq.onclick=()=>setChipsOpen(!chipsOpen());
    const rb=$('#rstPref');
    if(rb) rb.onclick=()=>{ RESETTABLE.forEach(k=>PREF[k]=DEF_PREF[k]); savePref(); applyPref(); };
    return;
  }
  if(tab==='about'){
    const sw=$('#cfgAuto');
    if(sw) sw.onclick=()=>{
      const on=!sw.classList.contains('on');
      sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on?'true':'false');
      post({type:'setAutoUpdate', on:on});
    };
    $$('#cfgBody [data-url]').forEach(b=>b.onclick=()=>openLink(b.dataset.url));
    return;
  }
  // 笔记库 / 高级：芯片、文本框、端口，改的都是 CFG_FORM
  $$('#cfgBody .chipbox').forEach(box=>wireChips(box));
  const nd=$('#cfgNoteDir');
  if(nd) nd.oninput=()=>{ CFG_FORM.随手记目录=nd.value.trim(); syncCfgDirty(); };
  ['cfgPortA','cfgPortB'].forEach((id,i)=>{
    const el=$('#'+id); if(!el) return;
    el.oninput=()=>{ const v=parseInt(el.value,10); CFG_FORM.端口范围[i]=isNaN(v)?'':v; syncCfgDirty(); };
  });

/* 芯片输入：回车／逗号成片，× 删，空输入按退格删最后一枚。 */
function wireChips(box){
  const key=box.dataset.chips, inp=box.querySelector('input');
  const add=v=>{
    v=String(v||'').trim().replace(/[,，]+$/,'').trim();
    if(!v) return;
    if(CFG_FORM[key].indexOf(v)>=0){ inp.value=''; return; }
    CFG_FORM[key]=CFG_FORM[key].concat([v]);
    const sp=document.createElement('span');
    sp.className='chip fresh';
    sp.appendChild(document.createTextNode(v));
    const x=document.createElement('button');
    x.type='button'; x.className='x'; x.setAttribute('aria-label','删除 '+v);
    x.innerHTML=icon('close',9);
    x.dataset.ci=String(CFG_FORM[key].length-1);
    sp.appendChild(x);
    box.insertBefore(sp, inp);
    inp.value='';
    rewireChip(box);
    syncCfgDirty();
  };
  box.querySelectorAll('.chip .x').forEach(x=>x.onclick=()=>dropChip(box, x));
  inp.onkeydown=e=>{
    if(e.key==='Enter' || e.key===',' || e.key==='，'){ e.preventDefault(); add(inp.value); }
    else if(e.key==='Backspace' && !inp.value){
      const last=[...box.querySelectorAll('.chip .x')].pop();
      if(last){ e.preventDefault(); dropChip(box, last); }
    }
  };
  inp.onblur=()=>{ if(inp.value.trim()) add(inp.value); };
  box.onclick=e=>{ if(e.target===box) inp.focus(); };
}
function dropChip(box, x){
  const key=box.dataset.chips, i=+x.dataset.ci;
  CFG_FORM[key]=CFG_FORM[key].filter((_,n)=>n!==i);
  x.closest('.chip').remove();
  rewireChip(box);
  syncCfgDirty();
}
/* 删掉一枚之后后面的下标全变了，重新贴一遍。 */
function rewireChip(box){
  box.querySelectorAll('.chip .x').forEach((x,i)=>{
    x.dataset.ci=String(i);
    x.onclick=()=>dropChip(box, x);
  });
}

async function syncStatus(){

/* /__pulse 的消费逻辑原样保留：整串当指纹，变了就重扫。 */
async function pulse(){

    const r=await fetch('/__pulse',{cache:'no-store'}); if(!r.ok) throw 0;
    const fp=JSON.stringify(await r.json());
    if(lastFp===null){ lastFp=fp; return; }
    if(fp!==lastFp){
      lastFp=fp;
      await doRescan();
      const nd=$('#live'); if(nd){ nd.classList.add('hit'); setTimeout(()=>nd.classList.remove('hit'),1600); }
    }
  }catch(e){}
  finally{ polling=false; }
}

function dragSplit(el, get, set, lo, hi){
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const x0=e.clientX, v0=get();
    const mv=ev=>{ const v=Math.max(lo, Math.min(hi, v0+(ev.clientX-x0))); set(v); };
    const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); saveST(); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
  el.addEventListener('dblclick', ()=>{ set(DEF_ST.sbw); saveST(); });
}

   已有方法一律保留。 */
window.AMN = {
  closeTab(){ if(curTab) closeTab(curTab); },
  save(){ const t=active(); if(t&&t.editing) saveEdit(false); },
  newNote(){ newNote(); },
  newTab(){ newTab(); },

  reveal(){ const t=active(); if(t && t.path) revealPath(t.path); },

  settings(){ openCfg(); },
  /* 列表栏 5.4.1 下线。两个名字都留着——壳菜单和老调用方还指得着，
     点了静默返回，不抛异常。 */
  toggleSidebar(){ toggleLists(); },

  /* 栏宽够就是收放左栏，不够就弹浮层——两种情况下这一颗（和 ⌥⌘I）都叫「大纲」。 */
  toggleToc(){

    ST.toc=!ST.toc; saveST(); syncToc();
  },
  toggleBookmarks(){ toggleBookmarks(); },

  search(t){

  },
  focusSearch(){ focusOmnibox(); },
  focusOmnibox(){ focusOmnibox(); },
  searchEnter(){

    if(hits.length) openDoc(hits[0], {jump:terms()});
  },
  quickOpen(){ quickOn() ? closeQuick() : openQuick(); },
  enterEdit(){ const t=active(); if(t && !t.editing) startEdit(); },
  toggleEdit(){ const t=active(); if(!t) return; t.editing ? finishEdit() : startEdit(); },
  rescan(){ doRescan(); },

  openRecent(){ goHome(false); },
  openPath(rel){ if(rel) openByPath(rel); },
  openExternalPath(abs){ if(abs) openExtPath(abs); },
  popoutWindow(){ const t=active(); if(t && !t.ext && hasDocNow(t)) openSolo(t.path); },
  quickLook(){ qlOn?closeQL():quickLook(listNow[selSeq]); },
  /* 文件 → 移到废纸篓（⌘⌫）。编辑态下菜单项是灰的（state().canTrash 为假），
     那一下按键会放行给编辑器，⌘⌫ 在编辑态仍然是「删到行首」。 */
  trashDoc(){ const t=active(); if(t && !t.ext && !t.editing) trashDoc(t.path); },
  print(){ try{ window.print(); }catch(e){} },
  escape(){
    if($('#ctx').classList.contains('on')){ closeCtx(); return; }
    if(tabPickOn()){ closeTabPick(); return; }
    if(olFloatOn()){ closeOlFloat(); syncToc(); return; }
    if(slashOn()){ hideSlash(); return; }
    if(typeOn()){ closeType(); return; }
    const wp=$('#wlpick'); if(wp && wp.classList.contains('on')){ wp.classList.remove('on'); return; }
    const fb=$('#fmt'); if(fb && fb.classList.contains('on')){ hideFmt(); return; }
    if(quickOn()){ closeQuick(); return; }
    if(qlOn){ closeQL(); return; }
    if(cfgOn()){ closeCfg(); return; }
    if(FOCUS){ setFocus(false); return; }
    const t=active();
    if(t && t.editing){ cancelEdit(); return; }
    if(kw){ clearQ(false); return; }
  },
  /* 壳那边「取消」的回执靠一个 50 毫秒的延时判定，极端情况下会先送一条 null
     再送真实选择。所以收到 null 不立刻销毁回调，延后一拍再销毁。 */
  menuPick(id, itemId){
    if(itemId){ const cb=ctxCb; ctxCb=null; if(cb) cb(itemId); return; }
    const cb=ctxCb; setTimeout(()=>{ if(ctxCb===cb) ctxCb=null; }, 300);
  },
  confirmReply(){},                       // 确认框走同步那条路，这里留着占位
  state(){
    const t=active();
    const start=isStartTab(t) && TABS.length===1;
    return JSON.stringify({
      hasDoc:hasDocNow(t),
      inReader:inReaderNow(),
      isStart:start,
      tabCount:TABS.length,
      canBack:canBack(t),
      canForward:canForward(t),
      bookmarks:false,               /* 书签栏 5.4 起下线，这一位恒假 */
      dirty:!!dirty(t), editing:!!(t&&t.editing),
      canEdit:hasDocNow(t) && !t.ext && kindOfTab(t)==='md' && canEditPath(t.path),
      /* 第 14 个键（v23）。编辑态一律为假：⌘⌫ 在编辑器里是「删到行首」，
         菜单项灰掉这一下按键才会放行给正文。 */
      canTrash:hasDocNow(t) && !t.ext && !t.editing && canTrashPath(t.path),
      /* 列表栏 5.4.1 下线，这两位恒假；键留着，壳还在读。 */
      lists:false, sidebar:false, toc:OL_ON||olFloatOn()
    });
  }
};

/* 以前回沉浸首页。现在 chrome 不收，改成当前标签去开始页，前进后退还能回来。 */
function tryLeaveReader(){
  const t=active();
  // 原先是「不保存并离开」＋丢字，现在改成先落盘：既然存得下，就没有要问的了。
  // 存不成 saveBeforeLeave 自己会报一句，这里不再叠一个确认框。
  if(t && t.editing){
    const ep=paneOf(t);
    if(t.editing && (dirty(t) || t.conflict || (ep && ep.classList.contains('src')))){
      saveBeforeLeave(t).then(ok=>{ if(ok) tryLeaveReader(); });
      return false;                          // 这一趟没走成，落盘之后自己再来一遍
    }
    endEdit(t);
  }
  if(SOLO){ leaveReader(); return true; }
  navigate(makeEntry('start', {title:'开始'}));
  return true;
}

/* ═══ 键盘 ═══════════════════════════════
   ⌘K / ⌥⌘K / ⌘E / ⌘N 在壳里由菜单转发（见 app_shell.m），页内这几条是
   浏览器直开门户时的兜底：壳在就不重复接，免得一次按键触发两遍。 */
addEventListener('keydown', e=>{
  if(e.isComposing || e.keyCode===229) return;
  const inReader=inReaderNow();
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'') || e.target.isContentEditable;

  if(e.key==='Escape'){ AMN.escape(); return; }

  // ⌘S 存当前这份
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s' && !e.ctrlKey){
    const t=active();
    if(t && t.editing){ e.preventDefault(); saveEdit(false); return; }
  }
  if(e.metaKey && e.key===','){ e.preventDefault(); openCfg(); return; }
  if(e.metaKey && e.altKey && e.key.toLowerCase()==='c'){
    e.preventDefault(); const t=active(); if(t && t.path) clipPath(t.path); return; }
  if(e.metaKey && e.altKey && e.key.toLowerCase()==='i'){ e.preventDefault(); AMN.toggleToc(); return; }
  if(e.metaKey && e.key.toLowerCase()==='l'){ e.preventDefault(); focusOmnibox(); return; }
  if(e.metaKey && e.key==='['){ e.preventDefault(); goHist(-1); return; }
  if(e.metaKey && e.key===']'){ e.preventDefault(); goHist(1); return; }
  if(e.metaKey && e.shiftKey && e.key.toLowerCase()==='b'){ e.preventDefault(); toggleBookmarks(); return; }
  // ⌘⇧T 把刚关掉的那个标签搬回来。壳菜单没占这一组，页面里绑就行。
  if(e.metaKey && e.shiftKey && !e.altKey && e.key.toLowerCase()==='t' && !SOLO){
    e.preventDefault(); reopenClosed(); return;
  }
  if(e.metaKey && !e.shiftKey && e.key.toLowerCase()==='t'){ e.preventDefault(); newTab(); return; }
  if(!e.metaKey && !e.ctrlKey && !e.altKey && !inField && e.key.length===1 && !/\s/.test(e.key)){
    const t=active();
    if(isStartTab(t)){
      e.preventDefault();
      focusOmnibox({seed:e.key, pulse:true});
      return;
    }
  }
  // 关掉当前标签。开始页且只剩一个时 inReader 为假，⌘W 交给壳关窗口。
  if(e.metaKey && e.key.toLowerCase()==='w' && inReader && curTab){
    e.preventDefault(); closeTab(curTab); return;
  }
  // ⌃Tab / ⌃⇧Tab 在打开的标签里循环。⌘W 仍关当前这份。
  if(e.ctrlKey && !e.metaKey && !e.altKey && e.key==='Tab' && inReader && TABS.length>=2){
    e.preventDefault(); cycleTab(e.shiftKey ? -1 : 1); return;
  }
  if(e.ctrlKey && !e.metaKey && (e.key==='PageDown' || e.key==='PageUp') && inReader && TABS.length>=2){
    e.preventDefault(); cycleTab(e.key==='PageDown' ? 1 : -1); return;
  }
  if(SHELL) return;                       // 下面几条壳里走菜单转发
  if(e.metaKey && e.altKey && e.key.toLowerCase()==='k'){ e.preventDefault(); focusSearch(); return; }
  if(e.metaKey && e.key.toLowerCase()==='k'){ e.preventDefault(); AMN.quickOpen(); return; }
  if(e.metaKey && e.key.toLowerCase()==='n'){ e.preventDefault(); AMN.newWindow(); return; }
  if(e.metaKey && e.key.toLowerCase()==='e' && inReader){
    const t=active();
    if(t && !t.ext && canEditPath(t.path) && !t.editing){ e.preventDefault(); startEdit(); }
    return;
  }
  if(e.key==='/' && !inField && !inReader){ e.preventDefault(); focusSearch(); return; }
  if(e.key===' ' && !inField && qlOn){ e.preventDefault(); closeQL(); }
});
addEventListener('compositionend', e=>{
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'') || e.target.isContentEditable;
  if(inField || !e.data) return;
  const t=active();
  if(isStartTab(t)) focusOmnibox({seed:e.data, pulse:true});
});

/* ═══ 拖进来的文件 ═══════════════════════
   库内的照旧在门户里开；库外的 .md 走只读模式，不再静默丢弃。 */
addEventListener('dragover', e=>{ if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });

  const path=f.path || '';                       // WKWebView 给得到本地路径
  if(!path){ tell('打不开','这个来源拿不到文件路径'); return; }
  const root=LIBROOT ? LIBROOT+'/' : '';
  if(root && path.startsWith(root)){ openByPath(path.slice(root.length)); return; }
  if(/\.md$/i.test(path)){ openExtPath(path); return; }
  tell('打不开','库外的文件只能读 .md：'+path);
});

/* ── 新用户引导 ─────────────────────────
   四张卡片，一台很小的状态机，**只在壳里跑**（浏览器模式一律不挂）：

     __AMN_VAULT_STATE__ === 'first-run'  → welcome  欢迎，两张选择卡
     __AMN_VAULT_STATE__ === 'missing'    → missing  找不到上次的笔记库
     __AMN_ONBOARDING__  === true         → scanning 正在整理 → done 整理好了
     其余（ok 且没有 onboarding 标记）     → 什么都不画

   welcome / missing 那两张按下去只是 post 一条消息给壳，**不等回音**：
   壳弹的是 NSOpenPanel，用户按取消、或者又选了同一个库根，壳就不会重载，
   页面得留在原地还能再点。所以按钮只进「正在打开…」这个软状态，卡片不锁死。
   scanning → done 靠 /__status 轮询：状态回到「就绪」就换卡片。 */
const ONB_STATE = SHELL ? String(window.__AMN_VAULT_STATE__||'ok') : 'ok';
const ONB_PATH  = SHELL ? String(window.__AMN_VAULT_PATH__||'') : '';
let onbStep=null, onbTimer=null, onbFound=0;

function onbNeeded(){
  if(!SHELL || SOLO) return null;
  if(ONB_STATE==='first-run') return 'welcome';
  if(ONB_STATE==='missing') return 'missing';
  if(window.__AMN_ONBOARDING__===true) return 'scanning';
  return null;
}
function onbCard(inner){ return `<div class="onb-card">${inner}</div>`; }
function onbHead(icoHtml, h1, sub){
  return `<div class="onb-head">${icoHtml}<h1>${h1}</h1><p class="onb-sub">${sub}</p></div>`;
}
const onbAppIco = `<div class="onb-ico"><img src="/icon-192.png" width="72" height="72" alt="AM·Note"></div>`;

function onbHtml(step){
  if(step==='welcome') return onbCard(
    onbHead(onbAppIco,'欢迎使用 AM·Note','把一个文件夹变成你的笔记本。文件留在原地，不上传，不改格式。')
    + `<div class="choices">
        <button type="button" class="choice" data-onb="create">
          <span class="ci">${icon('new-note',18)}</span>
          <h2>新建一个笔记库</h2>
          <p>在「文稿」里创建 AM·Note 文件夹，附一篇示例笔记。</p>
          <span class="path"><span class="p">~/Documents/AM·Note</span></span>
        </button>
        <button type="button" class="choice" data-onb="choose">
          <span class="ci">${icon('folder',18)}</span>
          <h2>使用已有文件夹</h2>
          <p>选择一个已经放着 Markdown / 网页的文件夹。</p>
          <span class="path"><span class="p">支持子文件夹，原样保留</span></span>
        </button>
      </div>
      <p class="onb-foot">以后随时可以在 设置 › 笔记库 里更换。</p>`);

  if(step==='missing') return onbCard(
    onbHead(`<div class="qmark">${icon('folder',28)}<em>?</em></div>`,
            '找不到上次的笔记库','这个文件夹被移动、改名或者删掉了。')
    + `<div class="oldpath">${icon('folder',13)}<span title="${esc(ONB_PATH)}">${esc(ONB_PATH||'（没记下路径）')}</span></div>
       <div class="onb-btns">
         <button type="button" class="btn key" data-onb="choose">重新选择位置…</button>
         <button type="button" class="btn" data-onb="create">新建一个笔记库</button>
       </div>
       <p class="onb-fine">文件不会丢，只是 AM·Note 找不到那个文件夹了。</p>`);

  if(step==='scanning') return onbCard(
    onbHead(onbAppIco,'正在整理你的笔记…','读一遍文件夹里的 Markdown 和网页，不会改动任何文件。')
    + `<div class="pbar" role="progressbar" aria-label="正在整理"></div>
       <div class="scanrow">
         <span class="cnt">已找到 <b class="num" id="onbCnt">${onbFound}</b> 篇</span>
         <span class="pth" title="${esc(ONB_PATH||LIBROOT)}">${esc(ONB_PATH||LIBROOT)}</span>
       </div>
       <p class="onb-foot">这一步只做一次，之后打开就是秒开。</p>`);

  // done
  const docs=(TREE&&TREE.文档)||[];
  const md=docs.filter(d=>String(d.类型||'md')!=='html').length;
  const html=docs.length-md;
  const dirs=((TREE&&TREE.目录)||[]).length;
  const ok=`<div class="okmark"><svg viewBox="0 0 24 24" aria-hidden="true">`
    + `<path d="M3.2,12 A8.8,8.8 0 1,0 20.8,12 A8.8,8.8 0 1,0 3.2,12" stroke-linecap="round"/>`
    + `<path d="M7.6,12.3 L10.7,15.4 L16.4,8.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  const skipped=onbSkipped();
  return onbCard(
    onbHead(ok,'整理好了','你的笔记库已经可以用了。')
    + `<div class="stats">
        <div class="stat"><b class="num">${md}</b><span>篇 Markdown</span></div>
        <div class="stat"><b class="num">${html}</b><span>个网页</span></div>
        <div class="stat"><b class="num">${dirs}</b><span>个文件夹</span></div>
      </div>
      ${skipped?`<p class="skipnote">跳过了 ${esc(skipped)}（可在设置里调整）</p>`:''}
      <div class="onb-btns"><button type="button" class="btn key" data-onb="go">开始使用</button></div>`);
}
/* 「跳过了 …」这一行报的是**真的被整个跳掉的顶层文件夹**，不是配置里的关键词：
   静态服务对库根出的是目录清单，从那儿拿到磁盘上真有的顶层文件夹名，再拿
   「跳过目录关键词」按服务端同一套判据（包含即命中，见 fulltext.should_skip）
   比一遍。点开头的（.git/.amnote/.claude）是机器的事，不跟用户报账。
   任何一步取不到就整行不出——规范允许省略，但不允许写一句可能是假的。 */
let ONB_SKIP_NAMES=[];
function onbSkipped(){ return ONB_SKIP_NAMES.slice(0,4).join('、'); }
async function onbLoadSkips(){
  ONB_SKIP_NAMES=[];
  if(!IS_HTTP) return;
  try{
    const cr=await fetch('/__config',{cache:'no-store'}); if(!cr.ok) return;
    const kw=(((await cr.json()).配置)||{}).跳过目录关键词||[];
    if(!kw.length) return;
    const lr=await fetch('/',{cache:'no-store'}); if(!lr.ok) return;
    const doc=new DOMParser().parseFromString(await lr.text(),'text/html');
    const dirs=[...doc.querySelectorAll('a[href]')]
      .map(a=>a.getAttribute('href')||'')
      .filter(h=>h.slice(-1)==='/' && h.indexOf('..')<0)
      .map(h=>{ try{ return decodeURIComponent(h.slice(0,-1)); }catch(e){ return h.slice(0,-1); } })
      .filter(n=>n && n[0]!=='.');
    ONB_SKIP_NAMES=dirs.filter(n=>kw.some(k=>k && k[0]!=='.' && n.indexOf(k)>=0));
  }catch(e){}
}

function onbShow(step){
  onbStep=step;
  document.body.classList.add('onb');
  const w=$('#onbWrap');
  w.classList.add('on');
  w.innerHTML=onbHtml(step);
  w.querySelectorAll('[data-onb]').forEach(b=>b.onclick=()=>onbClick(b));
}
function onbHide(){
  onbStep=null;
  clearTimeout(onbTimer); onbTimer=null;
  document.body.classList.remove('onb');
  const w=$('#onbWrap');
  w.classList.remove('on'); w.innerHTML='';
}
function onbClick(b){
  const a=b.dataset.onb;
  if(a==='go'){ onbHide(); ST.tips=true; saveST(); repaintPages(); return; }
  if(a!=='choose' && a!=='create') return;
  // 壳可能根本不会重载（用户按了取消、或又选了同一个库根），所以只给一层
  // 「正在打开…」的软提示：这一张卡片变淡、不可点，另一张照样能点。
  post({type: a==='choose' ? 'chooseVault' : 'createVault'});
  b.classList.add('wait');
  const p=b.querySelector('.path .p') || b;
  const old=p.textContent;
  p.textContent='正在打开…';
  setTimeout(()=>{ b.classList.remove('wait'); p.textContent=old; }, 2500);
}
/* 整理中：每 500ms 问一次 /__status，收录数往上跳；状态回到「就绪」就换卡片。 */
async function onbPoll(){
  if(onbStep!=='scanning') return;
  let done=false;
  try{
    const r=await fetch('/__status',{cache:'no-store'});
    if(r.ok){
      const s=await r.json();
      onbFound=(s.索引||{}).收录||0;
      const el=$('#onbCnt'); if(el) el.textContent=onbFound;
      done = s.状态!=='扫描中';
    }
  }catch(e){}
  if(onbStep!=='scanning') return;
  if(done){
    try{ await loadTree(); }catch(e){}
    await onbLoadSkips();
    if(onbStep==='scanning') onbShow('done');
    return;
  }
  onbTimer=setTimeout(onbPoll, 500);
}
function onbBoot(){
  const step=onbNeeded();
  if(!step) return;
  onbShow(step);
  if(step==='scanning') onbTimer=setTimeout(onbPoll, 120);
}

/* ═══ 起步 ═══════════════════════════════ */
if(EMBED){
  const t=makeTab(makeEntry('md', {path:EMBED.路径, title:EMBED.标题}));
  t.noEdit=true;
  TABS.push(t); newPane(t);
  t.raw=EMBED.正文;
  const md=paneOf(t).querySelector('.md');
  renderMd(md, EMBED.正文, dirOf(EMBED.路径));
  decorateHistory(md);
  drawDocMeta(t);
  enterReader(); showTab(t.id);
}else{
  loadFilters();
  applyST();
  render();
  if(!SOLO){
    openStartTab();
  }
  loadTree().then(()=>{
    if(!SOLO && !TABS.length) openStartTab();
    const at=active();
    if(at && isPageKind(kindOfTab(at))) paintPage(at);
  });
  if(!TOKEN_OK && IS_HTTP) bnr('upgrade', true);
  // solo 窗口一律不轮询：它只显示自己那一份，不该替主窗口收件
  if(LIVE && !SOLO){ tick(); setInterval(tick, 3000); }
  if(SOLO){ const d=QS.get('doc'); if(d) openByPath(d); }
}
paintIcons(document);
applyST();
applyPref();
syncToc();
onbBoot();
post({type:'ready'});
</script>
