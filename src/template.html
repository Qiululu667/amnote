/* ── 阅读与外观 ─────────────────────────
   主题走 PREF.theme + applyPref()（applyPref 里会 post 一条 theme 给壳，别绕过它）。
   字体、行高沿用设置页那三档；字号 15–21 实时；宽度三个预设。 */
const POP_THEMES=[['auto',TR('跟随系统')],['light',TR('浅色')],['dark',TR('深色')]];
const POP_FONTS=[['f-sans',TR('系统')],['f-serif',TR('宋体')],['f-mono',TR('等宽')],
                 ['f-hk',TR('苹方-港')],['f-ming',TR('新细明体')]];
const POP_FW=[[100,TR('极细')],[200,TR('纤细')],[300,TR('细')],
              [400,TR('标准')],[500,TR('中黑')],[600,TR('中粗')]];
const POP_WIDTHS=[[620,TR('紧凑')],[690,TR('舒适')],[820,TR('宽阔')]];
function popSeg(k, arr, cur, cls){
  return `<div class="filters${cls?' '+cls:''}" role="group">` + arr.map(x=>{
    const on = String(cur)===String(x[0]);
    const st = k==='fw' ? ` style="font-weight:${x[0]}"` : '';   // 每档拿自己的字重画
    return `<button type="button" data-pk="${k}" data-v="${x[0]}" class="${on?'on':''}" aria-pressed="${on?'true':'false'}"${st}>${esc(x[1])}</button>`;
  }).join('') + `</div>`;
}
function drawType(){
  const box=$('#typeWrap'); if(!box) return;
  box.innerHTML=`<div class="pop-title">${esc(TR('阅读与外观'))}</div>
    <div class="setting"><label>${esc(TR('主题'))}</label>${popSeg('theme', POP_THEMES, PREF.theme)}</div>
    <div class="setting"><label>${esc(TR('字体'))}</label>${popSeg('font', POP_FONTS, PREF.font, 'wrap')}
      ${mingMissing() ? `<p class="pop-hint">${esc(TR('未安装新细明体，暂以宋體-繁代替'))}</p>` : ''}</div>
    ${PREF.font==='f-hk' ? `<div class="setting"><label>${esc(TR('字重'))}</label>${popSeg('fw', POP_FW, PREF.fw, 'fw')}</div>` : ''}
    <div class="setting"><label for="popFs">${esc(TR('正文字号'))} <span class="v num" id="popVfs">${PREF.fs}</span></label>
      <input id="popFs" type="range" min="15" max="21" step="1" value="${PREF.fs}"></div>
    <div class="setting"><label>${esc(TR('正文宽度'))}</label>${popSeg('w', POP_WIDTHS, PREF.w)}</div>
    <div class="setting"><label for="popLh">${esc(TR('行高'))} <span class="v num" id="popVlh">${(PREF.lh/100).toFixed(2)}</span></label>
      <input id="popLh" type="range" min="160" max="200" step="5" value="${PREF.lh}"></div>
    <div class="setting"><button type="button" class="dt-btn" data-pk="focus">${icon('focus',14)} ${esc(FOCUS?TR('退出专注阅读'):TR('专注阅读'))}</button></div>`;
  box.querySelector('#popFs').oninput=e=>setPref('fs', +e.target.value);
  box.querySelector('#popLh').oninput=e=>setPref('lh', +e.target.value);
  /* 有没有新细明体不影响这层画出来（跟设置面板一样，问一次就缓存住）；
     问回来了再补那句提示，浮层这会儿要是已经关了就别白重画。 */
  if(!FONTS_INFO) probeFonts().then(()=>{ if(typeOn()) drawType(); });
}
/* 原来挂在地址栏那颗滑块按钮下面，那颗按钮 5.4 起没了。
   现在从文档头的 ⋯ 菜单和 ⌘K 的「阅读与外观」进，浮层就贴 ⋯ 那颗按钮下方；
   开始页上没有 ⋯（也没有文档头），退回 CSS 里那个「顶栏下、贴右缘」的位置。 */
function openType(){
  drawType();
  $('#typeWrap').classList.add('on');
  document.body.classList.add('type-on');
  placeType();
  syncPrefControls();
}
function placeType(){
  const box=$('#typeWrap'); if(!box || !box.classList.contains('on')) return;
  const t=active(), p=t&&paneOf(t);
  const anchor=p && p.querySelector('[data-dt="more"]');
  if(anchor && anchor.offsetParent){
    const r=anchor.getBoundingClientRect();
    box.style.top=(r.bottom+8)+'px';
    box.style.right=Math.max(12, Math.round(innerWidth-r.right))+'px';
  }else{
    box.style.top=''; box.style.right='';
  }
}
function closeType(){
  $('#typeWrap').classList.remove('on');
  document.body.classList.remove('type-on');
}
const typeOn = () => $('#typeWrap').classList.contains('on');
$('#typeWrap').addEventListener('click', e=>{
  const b=e.target.closest('[data-pk]'); if(!b) return;
  const k=b.dataset.pk;
  if(k==='focus'){ closeType(); toggleFocus(); return; }
  setPref(k, (k==='w'||k==='fw') ? +b.dataset.v : b.dataset.v);
  if(k==='font') drawType();       // 字重那一行只在苹方-港底下有，换字体得重画
});

/* ── 斜杠插入 ─────────────────────────── */
const SLASH=[
  {id:'h1', title:TR('标题一'), k:'#'},
  {id:'h2', title:TR('标题二'), k:'##'},
  {id:'h3', title:TR('标题三'), k:'###'},
  {id:'quote', title:TR('引用'), k:'>'},
  {id:'task', title:TR('待办'), k:'[]'},
  {id:'ul', title:TR('列表'), k:'-'},
  {id:'pre', title:TR('代码块'), k:'```'},
  {id:'hr', title:TR('分割线'), k:'---'},
];
let slashI=0, slashBlk=null;
/* 菜单开着、可光标已经不在打「/」的那一段里了（点到别处、方向键挪走）：收起来、当没开。
   以前照样把回车当「应用」吞掉，列表里回车没反应，「/」那段倒变成了空标题（A 报告 R7）。 */
function slashOn(){
  if(!$('#slash').classList.contains('on')) return false;
  const s=getSelection();
  return !!(slashBlk && slashBlk.isConnected && s && s.rangeCount && slashBlk.contains(s.anchorNode));
}
/* 只问「判断」，不顺手收菜单：收起来放在 selectionchange 里（slashAway）。以前 slashOn 自己收，
   Esc 进 AMN.escape 先被它收掉、返回假，又往下走把编辑态取消了（R 报告 P3-1）。 */
function slashAway(){
  if($('#slash').classList.contains('on') && !slashOn()) hideSlash();
}
function hideSlash(){
  $('#slash').classList.remove('on');
  slashBlk=null;
}
function paintSlash(){
  $('#slash').innerHTML=`<div class="sh">${esc(TR('插入'))}</div>`+SLASH.map((s,i)=>
    `<button type="button" class="${i===slashI?'on':''}" data-id="${s.id}"><span>${s.title}</span><span class="k">${s.k}</span></button>`
  ).join('');
  $$('#slash button').forEach((b,i)=>{
    b.onmousedown=e=>e.preventDefault();
    b.onmouseenter=()=>{ slashI=i; paintSlash(); };
    b.onclick=()=>applySlash(b.dataset.id);
  });
}
function maybeSlash(t){
  if(!t || !t.editing || COMPOSING) return hideSlash();
  const blk=curBlock(t);
  if(!blk || !/^(P|DIV)$/.test(blk.tagName) || blk.hasAttribute('data-lock')) return hideSlash();
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed) return hideSlash();
  const r=s.getRangeAt(0);
  const pre=r.cloneRange();
  pre.selectNodeContents(blk); pre.setEnd(r.endContainer, r.endOffset);
  if(tidyTxt(pre.toString())!=='/') return hideSlash();
  slashBlk=blk; slashI=0;
  const box=$('#slash');
  const rc=r.getBoundingClientRect();
  box.classList.add('on');
  paintSlash();
  const w=240, h=Math.min(320, box.offsetHeight||240);
  let x=rc.left, y=rc.bottom+8;
  if(x+w>innerWidth-8) x=innerWidth-w-8;
  if(y+h>innerHeight-8) y=Math.max(8, rc.top-h-8);
  box.style.left=Math.max(8,x)+'px';
  box.style.top=y+'px';
}
function applySlash(id){
  const t=active();
  const blk=slashBlk || (t && curBlock(t));
  hideSlash();
  if(!t || !t.editing || !blk || !blk.isConnected) return;
  retype(t, blk, id||SLASH[slashI].id, '');
  t.touched=true;
  autoKick(t);
}

/* ── 新建随手记 ─────────────────────────
   落在随手记目录。从开始页点「新建随手记」；编辑中先自动保存再新建。
   不再弹命名框：直接落一份「无标题」，打开正文，标题圈住就能改。
   第一次写出真正的一级标题时，文件名跟着改。 */
function syncNotePv(){
  NOTEPV.clear();
  ((TREE&&TREE.随手记)||[]).forEach(n=>{ if(n.预览) NOTEPV.set(n.路径, n.预览); });
  items.forEach(i=>{ const pv=NOTEPV.get(i.路径); if(pv) i.预览=pv; });
}
/* 「无标题」有三个身份，不能混：
     · 显示  → TR('无标题')，跟界面语言走；
     · 写盘  → UNTITLED_LOCAL，一级标题和文件名主干用它。这是落到磁盘上的字节，
               所以按语言写死，不走词典（伪翻译、缺译都不该进文件）；
     · 认名  → UNTITLED_FN / UNTITLED_ANY，三种写法一起认——换过语言之后，
               早先建的那些无标题笔记还要能自动改名。 */
const UNTITLED_LOCAL = LANG==='en' ? 'Untitled' : (LANG==='zh-HK' ? '無標題' : '无标题');
const UNTITLED_FN = /^(?:无标题|無標題|Untitled)(?:_\d+)?_20\d{6}\.md$/i;
const UNTITLED_ANY = /^(?:无标题|無標題|Untitled)$/i;
function ymdParts(d){
  d=d||new Date();
  const z=n=>String(n).padStart(2,'0');
  return {
    日:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,
    紧:`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}`
  };
}
function safeNoteStem(title, 日){
  // 切到 60 个字时别把一个 emoji 劈成两半：剩下的半个（孤立代理项）进了文件名，
  // 服务端 realpath 会抛 UnicodeEncodeError，正文已经写进去了却回成「保存失败」
  let safe=String(title||'').replace(/[\/\\:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().slice(0,60).replace(/[\uD800-\uDBFF]$/,'');
  if(日) safe=safe.replace(new RegExp('[ _\\-]*'+日.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$'),'').trim() || safe;
  return safe;
}
function takenPaths(){
  const s=new Set(items.map(i=>i.路径));
  TABS.forEach(t=>{ if(t.path) s.add(t.path); });
  return s;
}
function firstHeading(src){
  let skip=String(src||'');
  if(skip.startsWith('---')){
    const e=skip.indexOf('\n---',3);
    if(e!==-1){
      const cut=skip.indexOf('\n', e+1)+1;
      if(cut>0) skip=skip.slice(cut);
    }
  }
  let fence=false;
  for(const ln of skip.split('\n').slice(0,400)){
    const s=ln.trim();
    if(s.startsWith('```')||s.startsWith('~~~')){ fence=!fence; continue; }
    if(fence) continue;
    if(s.startsWith('# ')) return s.slice(2).replace(/#+$/,'').trim();
  }
  return '';
}
function suggestRename(rel, title){
  const fn=(rel||'').split('/').pop();
  if(!UNTITLED_FN.test(fn)) return null;
  const stamp=(fn.match(/20\d{6}/)||[])[0];
  if(!stamp) return null;
  const 日=stamp.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');
  const stem=safeNoteStem(title, 日);
  if(!stem || UNTITLED_ANY.test(stem)) return null;
  const dir=rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
  const used=takenPaths();
  used.delete(rel);
  for(let i=1;i<=20;i++){
    const name=`${stem}${i>1?'_'+i:''}_${stamp}.md`;
    const dest=dir ? dir+'/'+name : name;
    if(dest===rel || !used.has(dest)) return dest===rel ? null : dest;
  }
  return null;
}
function applyRenamedPath(t, next){
  const old=t.path;
  if(!next || next===old) return;
  t.path=next;
  const e=ensureStack(t); if(e){ e.path=next; if(t.title) e.title=t.title; }
  ST.lastPath=next;
  if(Array.isArray(ST.recents)) ST.recents.forEach(r=>{ if(r.路径===old) r.路径=next; });
  saveST();
  items.forEach(i=>{ if(i.路径===old){ i.路径=next; if(t.title) i.标题=t.title; } });
  if(TREE && TREE.文档) TREE.文档.forEach(d=>{ if(d.路径===old){ d.路径=next; if(t.title) d.标题=t.title; } });
  lastNat='';
  syncTabTitle(t);
  drawTabs();
  drawDocBar(t); drawDocMeta(t);
  syncChrome();
  pushState();
}
let newNoteBusy=false;
async function newNote(){
  if(newNoteBusy) return;
  if(!IS_HTTP){ tell(TR('新建要服务在跑'), TR('双击 AM·Note.app 打开就行。')); return; }
  const cur=active(); if(cur && cur.editing) flushSave(cur);
  const {日, 紧}=ymdParts();
  const body='# '+UNTITLED_LOCAL+'\n\n';
  /* 只看笔记本条：聚焦某一本就落它的随手记，「全部」落默认笔记本（P5）。
     **不看正在读的是哪一本**——那不是一种模式，看它规则就变成两条了。 */
  const book = NB.multi ? (NB.cur || NB.default) : '';
  const dir = noteDirOf(book);
  newNoteBusy=true;
  try{
    const used=takenPaths();
    for(let i=1;i<=20;i++){
      const rel=`${dir}/${UNTITLED_LOCAL}${i>1?'_'+i:''}_${紧}.md`;
      if(used.has(rel)) continue;
      let r;
      try{
        r=await (await fetch('/__save',{method:'POST', headers:hdrs(),
          body:JSON.stringify({路径:rel, 正文:body, 新建:true})})).json();
      }catch(e){ tell(TR('建不了'), TR('服务没应答')); return; }
      if(r && r.ok){ await openFreshNote(r.路径||rel, 日); newNoteToast(book, r.路径||rel, body); return; }
      /* 「这个名字被占了」要靠稳定的短码认，别去匹配服务端的中文文案——
         那句话现在会跟着语言变。老服务不给「代码」，退回原来那条正则。 */
      const code=(r&&r.代码)||'';
      const taken = code ? code==='exists'
                         : /已经有了|刚被建走/.test((r&&r.错误)||'');
      if(!taken){ tell(TR('建不了'), (r&&r.错误)||''); return; }
      used.add(rel);
    }
    tell(TR('建不了'), TR('今天的无标题已经建了 20 份了'));
  }finally{ newNoteBusy=false; }
}
async function openFreshNote(rel, 日){
  const now=Date.now()/1000;
  if(!items.some(i=>i.路径===rel)){
    items.unshift({路径:rel, 标题:UNTITLED_LOCAL, 类型:'md', 修改时间:now, 日期:日||ymdParts().日});
    prepItems();
  }
  await openDoc({路径:rel, 标题:UNTITLED_LOCAL, 类型:'md'}, {newTab:!isStartTab(active())});
  const t=active();
  if(t && t.path===rel) t.fresh=true;
  await startEdit({fresh:true});
}

/* ═══ 5.7 笔记本的那几个动作 ═══════════════
   切当前本、弹一列笔记本、新建之后那句 toast 和它的退路、增删改名重定位。 */

/* 笔记本条／⌘K 里选了一本。'' ＝「全部」。 */
function setCurNb(name){
  const v=String(name||'');
  if(!NB.multi || ST.nb===v) return;
  ST.nb=v; saveST();
  syncHomeDot();
  ftKick(v);                                  // 搜索的默认范围跟着走
  const at=active();
  TABS.forEach(t=>{ if(isPageKind(kindOfTab(t))) paintPage(t, {quiet:t!==at}); });
  pushState();
}
/* 弹一列笔记本让人选。壳里是真的 NSMenu，浏览器里是同款面板（都走 popMenu）。
   anchor 可以是元素、DOMRect，或者不给（就落在窗口中间偏下）。 */
function pickNotebook(anchor, opt, cb){
  opt=opt||{};
  const r = (anchor && anchor.getBoundingClientRect) ? anchor.getBoundingClientRect()
          : (anchor && anchor.left!=null ? anchor : null);
  const e={clientX: r?r.left:Math.round(innerWidth/2)-90,
           clientY: r?r.top:Math.round(innerHeight*0.6),
           preventDefault(){}, stopPropagation(){}};
  const list=NB.list.filter(n=>n.名字!==opt.exclude);
  const rows=list.map((n,i)=>({id:'nb'+i, label:n.名字}));
  if(opt.all) rows.unshift({id:'all', label:TR('全部')});
  if(!rows.length) return;
  popMenu(e, rows, id=>{
    if(id==='all'){ cb(''); return; }
    const n=list[+String(id).slice(2)];
    if(n) cb(n.名字);
  });
}
/* 新建之后立刻说清楚落在哪一本，并留一条退路（§4b.3）。单库一句都不多说。 */
/* 「● 工作」这一小块：先拿一个占位符走完翻译、整条 esc()，最后才把占位符换成
   那一段标签——名字和标签都逃不掉转义，i18n 还是「{nb}」这一个键
   （跟 agInstalledAt 用的是同一套办法）。 */
const NB_MARK='\u0001';
function nbInText(key, name){
  const mark=nbDot(name,{sm:true})+`<span class="nbname">${esc(name)}</span>`;
  return esc(TR(key,{nb:NB_MARK})).replace(NB_MARK, ()=>mark);
}
function newNoteToast(book, rel, body){
  if(!NB.multi || !book) return;
  notify(TR('已在 {nb} 新建',{nb:book}), {
    html: nbInText(K('已在 {nb} 新建'), book),
    ms: 6000,
    action: {label:TR('换一个'), fn:r=>moveFreshNote(rel, body, r)},
  });
}
/* 「换一个」：只对刚建、还没动过的空笔记有效。
   服务端那边是「在目标本的随手记里新建一份 ＋ 把原件挪进废纸篓」，
   标签无缝跟过去（路径改掉，编辑态不断）。 */
async function moveFreshNote(rel, body, anchor){
  const t=TABS.find(x=>!x.ext && x.path===rel);
  if(!t || !t.fresh || dirty(t)){
    notify(TR('这一篇已经写过了，换本得自己搬')); return;
  }
  pickNotebook(anchor, {exclude:NB.of(rel)}, async name=>{
    const t2=TABS.find(x=>!x.ext && x.path===rel);
    if(!t2 || !t2.fresh || dirty(t2)){ notify(TR('这一篇已经写过了，换本得自己搬')); return; }
    const dir=noteDirOf(name);
    const used=takenPaths();
    const fn=rel.split('/').pop();
    let dest=dir+'/'+fn;
    if(used.has(dest)){
      const stem=fn.replace(/\.md$/i,'');
      for(let i=2;i<=20;i++){ const d2=`${dir}/${stem}_${i}.md`; if(!used.has(d2)){ dest=d2; break; } }
    }
    let r=null;
    try{
      r=await (await fetch('/__save',{method:'POST', headers:hdrs(),
        body:JSON.stringify({路径:dest, 正文:body, 新建:true})})).json();
    }catch(e){ notify(TR('服务没应答')); return; }
    if(!r || !r.ok){ notify((r&&r.错误)||TR('搬不过去')); return; }
    dest=r.路径||dest;
    applyRenamedPath(t2, dest);
    try{
      await fetch('/__trash',{method:'POST', headers:hdrs(), body:JSON.stringify({路径:rel})});
      TRASHED.set(rel, Date.now());
    }catch(e){}
    refreshRawAt(t2);
    refreshTree();
    notify(TR('已搬到 {nb}',{nb:name}), {html: nbInText(K('已搬到 {nb}'), name)});
  });
}

/* ── 增 / 删 / 改名 / 换色 / 设默认 / 重新定位 ──
   全部走 POST /__notebooks（带口令）。服务端回一份新列表和一段「变化」，
   模式翻转或改名会让存储里的路径形态变掉，那时候先迁 localStorage 再整页重来
   ——半页用旧前缀、半页用新前缀是最难查的一类错。 */
async function nbPost(body){
  if(!IS_HTTP){ tell(TR('这一步要服务在跑'), TR('双击 AM·Note.app 打开就行。')); return null; }
  let r=null;
  try{
    r=await (await fetch('/__notebooks',{method:'POST', headers:hdrs(),
      body:JSON.stringify(body)})).json();
  }catch(e){ notify(TR('服务没应答')); return null; }
  if(!r || !r.ok){ notify((r&&r.错误)||TR('没保存成功')); return null; }
  await nbAfterChange(r);
  return r;
}
/* 改名：路径的**形态**没变（还是「名字/…」），只是头一段换了个写法。
   这一档不整页 reload，就地把手上带路径的那几处全改掉，开着的标签接着用。
   会漏东西的两张表（NOTEPV / TRASHED）重建，搜索缓存直接清空。 */
function nbRenameLive(from, to){
  const f=from+'/', t=to+'/';
  const fix=p=>{ p=String(p||''); return p.indexOf(f)===0 ? t+p.slice(f.length)
                                 : (p===from ? to : p); };
  nbMapStored(fix);
  if(ST.nb===from) ST.nb=to;
  ST.nbGen=(+ST.nbGen||0)+1;                 // 同源别的窗口靠它知道该重来了
  saveSTNow();
  TABS.forEach(tb=>{
    // nbs＝这个搜索结果页这一次的范围（存的是名字，不是路径），也得跟着改
    if(tb.nbs===from) tb.nbs=to;
    if(tb.ext) return;
    if(tb.path) tb.path=fix(tb.path);
    if(tb.folder) tb.folder=fix(tb.folder);
    (tb.stack||[]).forEach(e=>{
      if(e.path) e.path=fix(e.path);
      if(e.folder) e.folder=fix(e.folder);
    });
  });
  if(ckScope===from) ckScope=to;              // ⌘K 面板开着时那一行范围芯片
  CLOSED.forEach(rec=>(rec.stack||[]).forEach(e=>{
    if(e.path) e.path=fix(e.path);
    if(e.folder) e.folder=fix(e.folder);
  }));
  items.forEach(i=>{ i.路径=fix(i.路径); if(i.本===from) i.本=to; });
  if(TREE && TREE.文档) TREE.文档.forEach(d=>{ d.路径=fix(d.路径); if(d.本===from) d.本=to; });
  if(TREE && TREE.目录) TREE.目录.forEach(d=>{ if(d.本===from) d.本=to; });
  const pv=[...NOTEPV.entries()]; NOTEPV.clear(); pv.forEach(([k,v])=>NOTEPV.set(fix(k), v));
  const tr=[...TRASHED.entries()]; TRASHED.clear(); tr.forEach(([k,v])=>TRASHED.set(fix(k), v));
  FT={q:'', nb:'', map:new Map(), 状态:'', 总:0, timer:null};
  if(CFG_NB===from) CFG_NB=to;
  if(AGENT_NB===from) AGENT_NB=to;
  lastNat='';
}
async function nbAfterChange(r){
  const ch=r.变化||{};
  const flip = ch.从 && ch.到 && ch.从!==ch.到;          // 单↔多：路径形态整个翻面
  const renamed = !!(ch.旧名 && ch.新名);
  if(flip){
    // 迁移按「变化」给的主名走：单→多时老键全属于它，多→单时剥的也是它
    nbMigrate(ch.到, ch.主名||(r.笔记本&&r.笔记本[0]&&r.笔记本[0].名字)||'');
    ST.nbGen=(+ST.nbGen||0)+1;
    NB.list=r.笔记本||NB.list;
    // 存不下就不 reload（reloadForNb 自己提示并挂起），别把没落盘的字扔了
    await reloadForNb({writeST:true});
    return;
  }
  if(renamed && ST.nbMark==='multi') nbRenameLive(ch.旧名, ch.新名);
  nbApply(r.笔记本||[], r.模式||'');
  if(ST.nb && !NB.byName(ST.nb)){ ST.nb=''; saveST(); }
  await loadTree();
  if(cfgOn()) renderCfg();
  syncHomeDot(); drawTabs(); repaintPages();
  const at=active(); if(at) drawDocBar(at);
}
/* 壳选完目录之后调这两条（app_shell.m 的 addVault / relocateVault）。 */
async function addNotebooks(paths){
  const arr=(Array.isArray(paths)?paths:[paths]).map(String).filter(Boolean);
  if(!arr.length) return;
  const r=await nbPost({动作:'添加', 路径:arr});
  // 翻面卡在「有一份没存住」上（nbHold）：那句「先把这一份存好」才是要紧的，别覆盖它
  if(r && !nbHold) notify(TR('已添加 {n} 个笔记本',{n:((r.变化||{}).新增||arr).length}));
}
async function relocateNotebook(id, path){
  if(!id || !path) return;
  const r=await nbPost({动作:'重新定位', id, 路径:String(path)});
  if(r && !nbHold) notify(TR('已重新定位'));
}
/* 浏览器模式没有 NSOpenPanel，退回一个「贴绝对路径」的输入框。 */
function askVaultPath(title){
  let v=null;
  try{ v=prompt(title, ''); }catch(e){ v=null; }
  v=String(v||'').trim();
  return v && v[0]==='/' ? v : (v ? (notify(TR('要一个以 / 开头的绝对路径')), '') : '');

function addVaultFlow(){
  if(SHELL){ post({type:'addVault'}); return; }

function relocateVaultFlow(id){

/* ── 设置：阅读与外观 ｜ 笔记库 ｜ 高级 ｜ 关于 ─────────────────
   一个 720×600 的弹层，左边四段导航，右边一栏内容。
   两类设置在这里并排放着，存的地方完全不同，改的方式也不同：
     · 阅读与外观 → localStorage 的 PREF / ST，**即时生效，没有保存按钮**；
     · 笔记库与高级 → 服务端 .amnote/config.json，改完底部才冒出保存条，
       按「保存并重新整理」才写盘（POST /__config → /__rescan）。
   分界线就是 CFG_FORM：只有它里面的六个键才算「未保存的更改」。 */
let CFG=null;                 // 上一次 /__config 的整包（含 状态 / 问题 / 说明）
let CFG_FORM=null;            // 六个可编辑键的工作副本，界面改的是它
let CFG_BASE='';              // 载入时那一刻的快照，用来判断脏不脏
let cfgBusy=false;            // 「重新整理」转着的时候
const CFG_KEYS=['跳过目录关键词','噪声目录','噪声文件','通用标题','端口范围','随手记目录'];
const CFG_TABS={profile:TR('个人'), reading:TR('阅读与外观'), library:TR('笔记库'),
                agent:TR('Agent'), advanced:TR('高级'), about:TR('关于')};
const REPO='https://github.com/Qiululu667/amnote';
const LINKS=[[TR('GitHub 项目'),REPO],[TR('使用说明'),REPO+'#readme'],[TR('反馈问题'),REPO+'/issues']];

function openCfg(){ closeUserPop(); $('#cfgWrap').classList.add('on'); loadCfg(); }
function closeCfg(){ $('#cfgWrap').classList.remove('on'); }
const cfgOn = () => $('#cfgWrap').classList.contains('on');

/* 现在改的是哪一本的配置（每本各存各的 .amnote/config.json）。空＝主笔记本。 */
let CFG_NB='';
let nbPalOpen='';             // 哪一行的八色小色盘开着（id）
async function loadCfg(){
  const nb=(NB.multi && CFG_NB && NB.byName(CFG_NB)) ? CFG_NB : '';
  CFG_NB = nb || (NB.multi ? ((NB.list[0]||{}).名字||'') : '');
  try{
    const r=await fetch('/__config?lang='+LANG+(nb?'&nb='+encodeURIComponent(nb):''),
                        {cache:'no-store'}); if(!r.ok) throw 0;
    CFG=await r.json();
    if(CFG && CFG.笔记本) CFG_NB=CFG.笔记本;
  }catch(e){ CFG=null; }
  const c=(CFG&&CFG.配置)||{};
  CFG_FORM={
    跳过目录关键词: (c.跳过目录关键词||[]).slice(),
    噪声目录: (c.噪声目录||[]).slice(),
    噪声文件: (c.噪声文件||[]).slice(),
    通用标题: (c.通用标题||[]).slice(),
    端口范围: [ (c.端口范围||[])[0]||'', (c.端口范围||[])[1]||'' ],
    随手记目录: c.随手记目录||'',
  };
  CFG_BASE=JSON.stringify(CFG_FORM);
  renderCfg();
}
/* 服务没起时六个键全是空的，那就不该拿「空」去覆盖人家配置文件。 */
const cfgReady = () => !!(CFG && CFG.配置);
/* 一个进程一个端口：`端口范围` 只有第一本的那一格算数（服务端 boot 时读的就是它）。
   在别的本上，那两个输入框摆着能改、存下去也没人看——干脆禁掉，也不发这个键。 */
const cfgPortLocked = () => !!(NB.multi && CFG_NB && CFG_NB!==((NB.list[0]||{}).名字||''));
function cfgDirty(){ return cfgReady() && JSON.stringify(CFG_FORM)!==CFG_BASE; }
function syncCfgDirty(){ $('#viewCfg').classList.toggle('dirty', cfgDirty()); }

/* ── 小零件 ───────────────────────────── */
/* label＝这一行给人看的那句标题（芯片框上面那一行）。旁白念的是它，不是配置文件里的
   键名——「添加：跳过目录关键词」在英文界面里翻不掉，「Add to Skip these folders」才是人话。 */
function chipsHtml(key, ph, label){
  const arr=(CFG_FORM&&CFG_FORM[key])||[];
  return `<div class="chipbox" data-chips="${key}">`
    + arr.map((v,i)=>`<span class="chip">${esc(v)}<button type="button" class="x" data-ci="${i}"
        aria-label="${esc(TR('删除 {name}',{name:v}))}">${icon('close',9)}</button></span>`).join('')
    + `<input type="text" spellcheck="false" placeholder="${esc(ph||TR('输入名称后按回车'))}"
        aria-label="${esc(TR('添加：{key}',{key: label||key}))}"></div>`;
}
/* 服务端那份「问题」是一句句人话，键名夹在「」里。按键名认领，认不到的
   归到 unmatched，由调用方摆在整段的最上面。 */
function noticeFor(key){
  const ps=(CFG&&CFG.问题)||[];
  return ps.filter(t=>String(t).indexOf('「'+key+'」')>=0).map(noticeHtml).join('');
}
function noticeHtml(t){
  return `<div class="notice">${icon('info',14)}<span>${esc(t)}</span></div>`;
}
function looseNotices(){
  const ps=(CFG&&CFG.问题)||[];
  return ps.filter(t=>!CFG_KEYS.some(k=>String(t).indexOf('「'+k+'」')>=0))
           .map(noticeHtml).join('');
}
const hasAdvProblem = () => ['噪声目录','噪声文件','通用标题','端口范围']
  .some(k=>((CFG&&CFG.问题)||[]).some(t=>String(t).indexOf('「'+k+'」')>=0));
/* 「2026-09-05 23:56:22」→ 时间戳。给 fmtWhen 用。 */
function tsOf(s){
  const t=Date.parse(String(s||'').replace(' ','T'));
  return isNaN(t) ? 0 : t/1000;
}
const baseName = p => String(p||'').replace(/\/+$/,'').split('/').pop() || '/';

/* ── 「笔记库」段 ────────────────────────
   一个笔记本时（P1 零变化）：还是今天那张「当前笔记库」大卡，一个像素都不动，
   只在动作那一排多一颗「添加笔记本…」——浏览器模式下这是唯一的入口（§4.8）。
   两本以上：整段换成一列笔记本行（§4.7），底下两段（随手记 / 整理范围）
   前面多一个「改的是哪一本」的分段控件。 */
function panelLibrary(){
  const st=(CFG&&CFG.状态)||{};
  const root=st.库根||LIBROOT||'';
  const idx=st.索引||{};
  const last=st.上次扫描 ? fmtWhen(tsOf(st.上次扫描)) : '';
  const stCls = cfgBusy||SRV_STATE==='scan' ? 'busy' : (SRV_STATE==='off' ? 'off' : '');
  const stTxt = cfgBusy ? TR('正在整理…')
    : (root ? esc(TR('收录 {n} 篇',{n:idx.收录||0}))
              +(last?' · '+esc(TR('上次整理 {when}',{when:last})):'')
            : TR('服务没起'));
  const swap = SHELL
    ? `<button type="button" class="btn" data-cfga="choose">${esc(TR('更换文件夹…'))}</button>`
    : '';
  const head = NB.multi ? `<div class="sec">
      <h3 class="sect">${esc(TR('笔记本##标题'))}</h3>
      <div class="nblist">${NB.list.map(nbRowHtml).join('')}</div>
      <button type="button" class="btn nbadd" data-cfga="addnb">${icon('plus',13)}${esc(TR('添加笔记本…'))}</button>
      <p class="hint">${esc(TR('加进来只是登记一下：文件留在原地，不搬、不改、不删。至少留一个。'))}</p>
      ${NB.list.length>8?`<p class="hint">${esc(TR('八本以上颜色会重复用——颜色只是提示，名字才是身份。'))}</p>`:''}
      <div class="statusrow">
        <span class="st ${stCls}" id="cfgStat">${stTxt}</span>
        <button type="button" class="btn" id="cfgRescan"${cfgBusy?' disabled':''}>
          <span class="${cfgBusy?'spin':''}">${icon('refresh',13)}</span>${esc(cfgBusy?TR('整理中…'):TR('重新整理'))}</button>
      </div>
    </div>` : `<div class="sec">
      <h3 class="sect">${esc(TR('当前笔记库'))}</h3>
      <div class="vault">
        <span class="fico" aria-hidden="true">${folderMark(40)}</span>
        <span class="meta">
          <span class="nm">${esc(baseName(root)||TR('（未连上）'))}</span>
          <span class="pth"><span title="${esc(root)}">${esc(root)}</span>
            <button type="button" class="cpb" data-cfga="copyroot" title="${esc(TR('拷贝路径'))}"
              aria-label="${esc(TR('拷贝路径'))}">${icon('copy',12)}</button></span>
        </span>
        <span class="vacts">
          <button type="button" class="btn" data-cfga="reveal">${esc(TR('在访达中显示'))}</button>
          ${swap}
        </span>
      </div>
      ${SHELL?'':`<p class="hint">${esc(TR('浏览器模式下用 --root 指定文件夹。'))}</p>`}
      <div class="statusrow">
        <span class="st ${stCls}" id="cfgStat">${stTxt}</span>
        <button type="button" class="btn" id="cfgRescan"${cfgBusy?' disabled':''}>
          <span class="${cfgBusy?'spin':''}">${icon('refresh',13)}</span>${esc(cfgBusy?TR('整理中…'):TR('重新整理'))}</button>
      </div>
    </div>`;
  /* 「下面两段是哪个笔记本的」。每本各存各的配置，切换前要是有没存的改动
     先问一句（§4b.13）。 */
  const pick = NB.multi && cfgReady() ? `<div class="sec">
      <div class="lblrow"><span class="lbl">${esc(TR('下面两段是哪个笔记本的'))}</span>
        <span class="ih">${esc(TR('每个笔记本各存各的，互不影响'))}</span></div>
      <span class="seg nbseg" data-k="cfgnb">${NB.list.map(n=>
        `<button type="button" data-v="${esc(n.名字)}" class="${n.名字===CFG_NB?'on':''}"`
        + ` aria-pressed="${n.名字===CFG_NB?'true':'false'}">${nbDot(n.名字,{sm:true})}${esc(n.名字)}</button>`
      ).join('')}</span>
    </div>` : '';
  const noteHint = NB.multi
    ? TR('新建的随手记会放进「{nb}」里的这个文件夹。',{nb:CFG_NB})
    : TR('新建的随手记会放进笔记库里的这个文件夹。');
  return `<section class="cfg-panel on" data-cfgpanel="library">
    ${looseNotices()}

      <h3 class="sect">${esc(TR('整理范围'))}</h3>
      ${noticeFor('跳过目录关键词')}
      <div class="lblrow"><span class="lbl">${esc(TR('不收录这些文件夹'))}</span>
        <span class="ih">${esc(TR('文件夹名里含有这些字样，整个文件夹就跳过'))}</span></div>
      ${chipsHtml('跳过目录关键词',TR('例如 备份、node_modules'),TR('不收录这些文件夹'))}

    ${NB.multi ? '' : `<div class="sec">

    </div>`}

/* 一行笔记本：色块（点开八色小色盘）/ 名字（就地改，失焦即存）/ 灰字路径
   （点一下在访达里打开）/ 篇数 /「默认」标记或「设为默认」/「移除」。
   找不到的那一本压灰、色点换空心环、路径那行换成一句话＋「重新定位…」，
   不自动移除（P6）。 */
function nbRowHtml(n){
  const gone=n.状态==='离线';
  const scanning=n.状态==='扫描中';
  const acts = gone
    ? `<button type="button" class="btnt" data-nbact="relocate" data-nbid="${esc(n.id)}">${esc(TR('重新定位…'))}</button>`
      + `<button type="button" class="btnt" data-nbact="remove" data-nbid="${esc(n.id)}">${esc(TR('移除'))}</button>`
    : (n.默认
        ? `<span class="nbtag">${esc(TR('默认'))}</span>`
          + `<button type="button" class="btnt" data-nbact="remove" data-nbid="${esc(n.id)}">${esc(TR('移除'))}</button>`
        : `<button type="button" class="btnt" data-nbact="default" data-nbid="${esc(n.id)}">${esc(TR('设为默认'))}</button>`
          + `<button type="button" class="btnt" data-nbact="remove" data-nbid="${esc(n.id)}">${esc(TR('移除'))}</button>`);
  const pal = (nbPalOpen===n.id) ? `<div class="nbpal" role="listbox" aria-label="${esc(TR('选一个颜色'))}">`
    + NB_COLORS.map(c=>`<span class="nb-${c}${c===n.颜色?' on':''}" role="option" data-nbcolor="${c}"`
        + ` data-nbid="${esc(n.id)}" title="${esc(TR(NB_COLOR_NAMES[c]))}"><i class="nd"></i></span>`).join('')
    + `</div>` : '';
  const cnt = gone ? '—' : (scanning ? TR('扫描中…') : TR('{n} 篇',{n:n.收录||0}));
  return `<div class="nbrow ${NB.cls(n.名字)}${gone?' gone':''}" data-nbid="${esc(n.id)}">
    <button type="button" class="nbsw" data-nbact="palette" data-nbid="${esc(n.id)}"
      aria-label="${esc(TR('换个颜色'))}" aria-expanded="${nbPalOpen===n.id?'true':'false'}"><i class="nd${gone?' gone':''}"></i>${pal}</button>
    <span class="meta">
      <span class="nm" contenteditable="true" spellcheck="false" role="textbox"
        data-nbname="${esc(n.名字)}" data-nbid="${esc(n.id)}"
        aria-label="${esc(TR('笔记本名字'))}">${esc(n.名字)}</span>
      <button type="button" class="pth" data-nbact="reveal" data-nbid="${esc(n.id)}"
        title="${esc(n.路径)}">${gone?esc(TR('找不到这个文件夹'))+' · ':''}${esc(n.路径)}</button>
    </span>
    <span class="n num">${esc(cnt)}</span>
    <span class="nbacts">${acts}</span>
  </div>`;
}
/* 服务没起时 /__config 是读不到的，六个键全空。这时候不摆输入框——

  return `<div class="sec">${noticeHtml(TR('服务没起，读不到配置文件。重开一次 AM·Note 再来改。'))}</div>`;
}

/* ── 「Agent」段 ─────────────────────────
   这台 Mac 上的 AI 助手怎么接进来，四件事一行一件：命令行工具、Claude Code 的
   skill、Codex 那份配置、库地图。状态全从 /__agent_setup 来；装完拿响应里的
   新状态只重画这四行，不重画整段——上面那句说明不该跟着闪一下。 */
let AGENT=null;              // /__agent_setup 的整包；null＝还没问，false＝问不到
let agentAct='';             // 正在跑的动作名：这期间四行都按不动
let agentSeq=0;              // 每发一次请求 +1：慢的那一发回来发现号变了就闭嘴
let agentMap='';             // 预取好的库地图正文（拷贝那一拍要现成的）
let agentMapBusy=false;
const MAP_REL='库地图.md';   // 导出以后要在访达里选中的那一份
/* 现在这四行说的是哪一本（多本时 agents_md / 地图文件 是按本的数组）。 */
let AGENT_NB='';
function agentNb(){
  if(!NB.multi) return '';
  return (AGENT_NB && NB.byName(AGENT_NB)) ? AGENT_NB : ((NB.list[0]||{}).名字||'');
}
/* 服务端给的是数组（多本）或对象（单本）：按当前这一本挑一条出来。 */
function agentOne(v){
  if(Array.isArray(v)){
    const nb=agentNb();
    return v.find(x=>x && x.本===nb) || v[0] || {};
  }
  return v||{};
}
/* 服务端给的是绝对路径，/__reveal 要的是库相对——库根就在这份文件的上一级，
   取文件名就够了。服务端哪天改了名字这里也跟得上，取不到才回落到常量。 */
/* /__reveal 要的是（多本时带笔记本名前缀的）库内路径，服务端给的是绝对路径。
   拿它所在那一本的根去剥，剥不掉才回落到常量。 */
const mapRel = () => {
  const abs=(agentOne((AGENT||{}).地图文件).路径)||'';
  return relFromAbs(abs) || (NB.multi ? agentNb()+'/'+MAP_REL : MAP_REL);
};

function panelAgent(){
  return `<section class="cfg-panel on" data-cfgpanel="agent">
    <p class="agnote">${esc(TR('AM·Note 开着的时候，这台 Mac 上的 AI 助手可以搜索和读写这个库。只在本机，不联网。'))}</p>
    <div id="agentRows">${agentRowsHtml()}</div>
  </section>`;
}
/* 还没问回来（或者服务没起）：摆一句话，不摆四行按不动的按钮。 */
function agentRowsHtml(){
  if(!AGENT) return `<p class="hint agwait">${esc(AGENT===false
    ? TR('读不到接入状态，服务可能没起。') : TR('正在检查…'))}</p>`;
  const cli=AGENT.命令行||{}, sk=AGENT.skill||{};
  const am=agentOne(AGENT.agents_md), mp=agentOne(AGENT.地图文件);
  /* AGENTS.md 和库地图是**写进某一本的库根**的，所以多本时先选哪一本。 */
  const pick = NB.multi ? `<div class="frow"><span class="flab">${esc(TR('写到哪一本'))}</span>`
    + `<div class="fctl"><span class="seg nbseg" data-k="agentnb">` + NB.list.map(n=>
        `<button type="button" data-v="${esc(n.名字)}" class="${n.名字===agentNb()?'on':''}"`
        + ` aria-pressed="${n.名字===agentNb()?'true':'false'}">${nbDot(n.名字,{sm:true})}${esc(n.名字)}</button>`
      ).join('') + `</span></div></div>` : '';
  return agRow(TR('命令行工具'),
      agDo('cli', TR('安装'), cli.已链接, TR('已安装')) + agCopy('cli', TR('拷贝路径'), 1),
      cli.已链接 ? agInstalledAt(cli.链接路径||'')
                 : `<p class="hint">${esc(TR('未安装'))}</p>`)
    + agRow(TR('Claude Code'),
      (skillStale(sk) ? agDo('skill', TR('更新 Skill'), false, '')
                      : agDo('skill', TR('安装 Skill'), sk.已安装, TR('已安装')))
        + agCopy('mcp', TR('拷贝 MCP 命令'), 1),
      agPath(sk.路径||'')
        + (skillStale(sk) ? `<p class="hint">${esc(TR('装着的是旧版，更新一下才认这一轮的新写法。'))}</p>` : ''))
    + pick
    + agRow(TR('Codex 与其他'),
      agCopy('codex', TR('拷贝 MCP 配置'))
        + agDo('agents_md', TR('在库根生成 AGENTS.md'), am.已存在, TR('已存在'), 1),
      agPath(am.路径||''))
    + agRow(TR('库地图'),
      agCopy('map', TR('拷贝库地图')) + agDo('map_export', TR('导出到库根'), false, '', 1),
      agPath(mp.路径||''));
}
/* 已经装过、但装的是旧版（服务端给 skill.版本 与 skill.最新，都是整数）：
   按钮从按不动的「已安装」换回可按的「更新 Skill」。老服务端没有这两个字段，
   那就当没这回事，维持原样——不拿缺字段当「旧版」。 */
function skillStale(sk){
  const cur=+((sk||{}).版本)||0, latest=+((sk||{}).最新)||0;
  return !!(sk && sk.已安装 && cur && latest && cur<latest);
}
const agRow = (label, btns, foot) => `<div class="frow"><span class="flab">${esc(label)}</span>`
  + `<div class="fctl"><span class="btns">${btns}</span>${foot}</div></div>`;
const agPath = pth => `<p class="hint pth">${esc(pth)}</p>`;
/* 「已安装到 <路径>」：等宽只给路径那一段，前面那三个字跟别处一样。
   先拿一个占位符走完翻译、整条 esc()，最后把占位符换成那一段 <span>——
   标签和路径都逃不掉转义，i18n 还是「已安装到 {path}」这一个键。 */
function agInstalledAt(pth){
  const M='\u0001';
  // 替换值写成函数：路径里真有 $& 这种字样时，别被 replace 当成替换语法吃掉
  const seg=`<span class="pth">${esc(pth)}</span>`;
  return `<p class="hint">${esc(TR('已安装到 {path}',{path:M})).replace(M, ()=>seg)}</p>`;
}
/* 装好了就换成一颗按不动的「已安装」。不做「重新安装」——按下去看不出差别的按钮
   只会让人怀疑自己有没有按到。 */
function agDo(act, label, done, doneLabel, flat){
  const cls = flat ? 'btnt' : 'btn';
  if(done) return `<button type="button" class="${cls}" disabled>${esc(doneLabel)}</button>`;
  // 一次只跑一个动作：跑着的时候四颗一起灰掉，不然按下别的那几颗毫无反应
  return `<button type="button" class="${cls}" data-ag="${act}"${agentAct?' disabled':''}>${esc(label)}</button>`;
}
const agCopy = (what, label, flat) => `<button type="button" class="${flat?'btnt':'btn'}"`
  + ` data-agc="${what}">${esc(label)}</button>`;

function wireAgent(){
  wireAgentRows();
  loadAgentSetup();            // 每次进这一段都重问一遍：外头可能已经装过了
}
function wireAgentRows(){
  const box=$('#agentRows'); if(!box) return;
  box.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>agentDo(b.dataset.ag));
  box.querySelectorAll('[data-agc]').forEach(b=>b.onclick=()=>agentCopy(b.dataset.agc));
  box.querySelectorAll('.seg.nbseg button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===agentNb()) return;
    AGENT_NB=b.dataset.v; agentMap=''; syncAgentRows(); fetchAgentMap(true);
  });
  fetchAgentMap();             // 「拷贝库地图」按下去那一拍不能有 await，先备着
}
/* 浏览器模式下 navigator.clipboard.writeText 只认「用户手势那一拍」：在 await
   后面写会被拒（壳里走 NSPasteboard 没这问题，但两边得是同一条路）。所以地图
   在画这四行的时候就先拉回来，按下去只是同步地拷一份现成的。
   地图随笔记变，所以导出到库根之后强制再拉一次。 */
function fetchAgentMap(force, loud){
  if(!IS_HTTP || agentMapBusy || (agentMap && !force)) return;
  agentMapBusy=true;
  const nb=agentNb();
  fetch('/__map'+(nb?'?nb='+encodeURIComponent(nb):''),{cache:'no-store'})
    .then(r=>r.json()).then(r=>{
    if(r && r.ok) agentMap=String(r.地图||'');
    else if(loud) notify((r&&r.错误)||TR('读不到库地图'));
  }).catch(()=>{ if(loud) notify(TR('服务没应答')); })
    .then(()=>{ agentMapBusy=false; });
}
function syncAgentRows(){
  const box=$('#agentRows'); if(!box) return;
  box.innerHTML=agentRowsHtml();
  wireAgentRows();
}
/* 问不到的时候：手上已经有一份就留着，别把好好的四行换成一句「读不到」。 */
async function loadAgentSetup(){
  if(agentAct) return;                    // 正在装：POST 的响应比这一发新，不去打扰
  const my=++agentSeq;
  let r=null;
  if(IS_HTTP){
    try{ r=await (await fetch('/__agent_setup',{cache:'no-store'})).json(); }catch(e){ r=null; }
  }
  /* 这中间又问过一次、或者已经装起来了：这一发是旧的，扔掉。
     不然「进来 → GET 慢 → 装好了 → 慢的那一发回来」会把四行退回没装的样子。 */
  if(my!==agentSeq || agentAct) return;
  if(r && r.ok) AGENT=r; else if(!AGENT) AGENT=false;
  if(cfgOn() && ST.cfgTab==='agent') syncAgentRows();
}
/* 一次只跑一个动作。成功了拿响应当新状态（响应＝GET 的形状再加一句「结果」）。 */
async function agentDo(act){
  if(agentAct) return;
  agentAct=act; agentSeq++;               // 在路上的那些 GET 一律作废
  syncAgentRows();
  let r=null;
  try{
    const nb=agentNb();
    r=await (await fetch('/__agent_setup',{method:'POST', headers:hdrs(),
      body:JSON.stringify(nb?{动作:act, nb}:{动作:act})})).json();
  }catch(e){ r=null; }
  agentAct='';
  if(!r){ notify(TR('服务没应答')); syncAgentRows(); return; }
  if(!r.ok){ notify(r.错误||TR('没保存成功')); syncAgentRows(); return; }
  AGENT=r; syncAgentRows();
  if(r.结果) notify(r.结果);
  // 导出完在访达里选中它——一份写在库根的文件，看得见才算真的到手
  if(act==='map_export'){ fetchAgentMap(true); revealPath(mapRel()); }
}
/* 四颗拷贝钮都走这里。要害是：真正写剪贴板那一句必须还在用户手势这一拍里，
   所以这上面一个 await 都不能有——库地图是 fetchAgentMap() 提前备好的。 */
async function agentCopy(what){
  const a=AGENT||{};
  let txt='';
  if(what==='cli') txt=(a.命令行||{}).路径||'';
  else if(what==='mcp') txt=a.mcp命令||'';
  else if(what==='codex') txt=a.codex配置||'';
  else if(what==='map'){
    // 还没备好：催一发，请人再按一次。在这儿等，剪贴板就写不进去了
    if(!agentMap){ fetchAgentMap(true, 1); notify(TR('正在准备库地图，再点一次')); return; }
    txt=agentMap;
  }
  // 服务端这一栏是空的（老服务、字段改过名）：也得说一句，不能一按没反应
  if(!txt){ notify(TR('拷不了')); return; }
  const ok=await copyText(txt);
  notify(ok ? TR('已拷贝') : TR('拷不了'));
}

/* ── 画一遍 ───────────────────────────── */
function renderCfg(){
  const tab = CFG_TABS[ST.cfgTab] ? ST.cfgTab : 'reading';
  ST.cfgTab = tab;
  $$('#cfgRail .cfg-navi').forEach(b=>{
    const on=b.dataset.tab===tab;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on?'page':'false');
  });
  $('#cfgTitle').textContent=CFG_TABS[tab];
  const body=$('#cfgBody');
  body.innerHTML = tab==='profile' ? panelProfile()
    : tab==='reading' ? panelReading()
    : tab==='library' ? panelLibrary()
    : tab==='agent' ? panelAgent()
    : tab==='advanced' ? panelAdvanced()
    : panelAbout();
  body.scrollTop=0;
  wireCfg(tab);
  syncCfgDirty();
  syncPrefControls();
}

function wireCfg(tab){
  const body=$('#cfgBody');
  // 「访达 / 更换文件夹 / 检查更新 / 拷路径」四段里都可能有，统一先贴一遍
  body.querySelectorAll('[data-cfga]').forEach(b=>b.onclick=()=>cfgAction(b.dataset.cfga));
  if(tab==='profile'){ wireProfile(); return; }
  if(tab==='agent'){ wireAgent(); return; }
  if(tab==='reading'){
    $$('#cfgBody [data-tc]').forEach(b=>b.onclick=()=>setPref('theme', b.dataset.tc));
    $$('#cfgBody [data-fc]').forEach(b=>b.onclick=()=>setPref('font', b.dataset.fc));
    const fs=$('#cfgFs'); if(fs) fs.oninput=e=>setPref('fs', +e.target.value);
    $$('#cfgBody .seg[data-k] button').forEach(b=>b.onclick=()=>{
      const k=b.parentElement.dataset.k;
      if(k==='lang'){ setLang(b.dataset.v); return; }   // 语言的值不是数字，也不即时生效
      setPref(k, +b.dataset.v);
    });
    const tc=$('#cfgToc');
    /* 大纲开回来就等于「关联让位」——不然左列还站着关联，这颗开关看着像坏的。
       翻的是显示端那个值（`大纲此刻在不在`），所以关联开着时点一下必定把大纲请回来。 */
    if(tc) tc.onclick=()=>{ ST.toc = !(ST.toc!==false && !REL_ON); if(ST.toc) ST.rel=false;
      saveST(); syncRel(); syncPrefControls(); };
    const cq=$('#cfgChips');
    if(cq) cq.onclick=()=>setChipsOpen(!chipsOpen());
    const rb=$('#rstPref');
    if(rb) rb.onclick=()=>{ RESETTABLE.forEach(k=>PREF[k]=DEF_PREF[k]); savePref(); applyPref(); };
    // 有没有新细明体不影响这一页画出来，问回来了再决定那句提示露不露。
    probeFonts().then(()=>{ if($('#cfgMingHint')) syncPrefControls(); });
    return;
  }
  if(tab==='about'){
    const sw=$('#cfgAuto');
    if(sw) sw.onclick=()=>{
      const on=!sw.classList.contains('on');
      sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on?'true':'false');
      post({type:'setAutoUpdate', on:on});
    };
    $$('#cfgBody [data-url]').forEach(b=>b.onclick=()=>openLink(b.dataset.url));
    return;
  }
  // 笔记库 / 高级：芯片、文本框、端口，改的都是 CFG_FORM
  if(tab==='library') wireNotebooks();
  $$('#cfgBody .chipbox').forEach(box=>wireChips(box));
  const nd=$('#cfgNoteDir');
  if(nd) nd.oninput=()=>{ CFG_FORM.随手记目录=nd.value.trim(); syncCfgDirty(); };
  ['cfgPortA','cfgPortB'].forEach((id,i)=>{
    const el=$('#'+id); if(!el) return;
    el.oninput=()=>{ const v=parseInt(el.value,10); CFG_FORM.端口范围[i]=isNaN(v)?'':v; syncCfgDirty(); };
  });
  const rs=$('#cfgRescan');
  if(rs) rs.onclick=cfgRescan;
  const ad=$('#cfgAdvT');
  if(ad) ad.onclick=()=>{ ST.cfgAdv = ST.cfgAdv!==true; saveST(); renderCfg(); };
}

/* ── 「笔记库」段里那一列笔记本的接线 ────── */
function wireNotebooks(){
  const body=$('#cfgBody'); if(!body) return;
  body.querySelectorAll('[data-nbact]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    nbRowAction(b.dataset.nbact, b.dataset.nbid, b);
  });
  body.querySelectorAll('[data-nbcolor]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    nbPalOpen='';
    nbPost({动作:'颜色', id:el.dataset.nbid, 颜色:el.dataset.nbcolor});
  });
  /* 名字就地改：失焦或按回车就存。空的、只有空白的、跟原来一样的都当没改。 */
  body.querySelectorAll('[data-nbname]').forEach(el=>{
    el.onkeydown=ev=>{
      if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); }
      else if(ev.key==='Escape'){ ev.preventDefault(); el.textContent=el.dataset.nbname; el.blur(); }
    };
    el.onblur=()=>{
      const v=String(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!v || v===el.dataset.nbname){ el.textContent=el.dataset.nbname; return; }
      // 名字会一路长到 CLI 输出和 Agent 的路径里，长了不禁止，只提一句
      if([...v].filter(c=>CJK.test(c)).length>8 || v.length>16) notify(TR('名字短一点更好用'));
      /* 服务端拒了（名字不合法、跟别的本撞了）：把这一格写回原来的名字。
         不写回就是格子里留着一个根本没生效的新名字，看着像已经改成了。 */
      nbPost({动作:'改名', id:el.dataset.nbid, 名字:v}).then(r=>{
        if(!r) el.textContent=el.dataset.nbname;
      });
    };
  });
  // 「下面两段是哪个笔记本的」：切之前先把没存的改动问一句（§4b.13）
  body.querySelectorAll('.seg.nbseg button').forEach(b=>b.onclick=async()=>{
    const v=b.dataset.v; if(v===CFG_NB) return;
    if(cfgDirty()){
      const ok=ask(TR('先保存这一本的改动？'), TR('切到别的笔记本会丢掉还没保存的那几处。'),
                   TR('保存'), TR('放弃'));
      if(ok) await saveCfg();
    }
    CFG_NB=v; nbPalOpen=''; await loadCfg();
  });
  // 点别处收掉色盘
  if(nbPalOpen){
    setTimeout(()=>{
      const off=ev=>{ if(!ev.target.closest || !ev.target.closest('.nbpal,.nbsw')){
        nbPalOpen=''; document.removeEventListener('click', off, true); renderCfg(); } };
      document.addEventListener('click', off, true);
    }, 0);
  }
}
async function nbRowAction(act, id, el){

  if(act==='palette'){ nbPalOpen = (nbPalOpen===id) ? '' : id; renderCfg(); return; }

/* 「个人」段的接线。头像三条路进来：按钮选、拖进来、粘贴；出口都是 putAvatar()。 */
let avBusy=false;                 // 一张图正在传：两颗按钮都按不动
let nameT=null;                   // 昵称防抖
function wireProfile(){
  clearTimeout(nameT); nameSent=null;          // 这一段是新画的，防抖账清零
  const row=$('#cfgAvRow'), file=$('#cfgAvFile');
  const pick=$('#cfgAvPick'), rm=$('#cfgAvDrop');
  if(pick) pick.onclick=()=>{ if(file) file.click(); };
  if(file) file.onchange=()=>{
    const f=file.files && file.files[0];
    file.value='';                // 同一张图再选一次也要触发 change
    if(f) putAvatar(f);
  };
  if(rm) rm.onclick=()=>{ if(!avBusy && PROFILE.头像) putAvatar(null); };
  if(row){
    /* 停传：窗口上还挂着一条「拖进来的文件」的总处理（库内的开、库外的 .md 只读、
       别的弹一句「打不开」）。不掐住的话，往头像上放一张图会先换掉头像，
       再当头弹一句说这张图打不开——甚至跳去开别的文件。 */
    row.ondragover=e=>{ e.preventDefault(); e.stopPropagation(); row.classList.add('drop'); };
    /* 只有真的离开这一块才熄灯：光标从空处挪到里面的按钮上也来一发 dragleave，
       照单全收就是一路闪。 */
    row.ondragleave=e=>{ if(!row.contains(e.relatedTarget)) row.classList.remove('drop'); };
    row.ondrop=e=>{
      e.preventDefault(); e.stopPropagation(); row.classList.remove('drop');
      const f=(e.dataTransfer && e.dataTransfer.files || [])[0];
      if(f) putAvatar(f);
    };
  }
  const nm=$('#cfgName');
  if(nm){
    nm.oninput=()=>{ clearTimeout(nameT); nameT=setTimeout(()=>putName(nm.value), 500); };
    nm.onblur=()=>{ clearTimeout(nameT); putName(nm.value); };
    nm.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); nm.blur(); } };
  }
  const gr=$('#cfgGreet');
  if(gr) gr.onclick=()=>{
    const on=!(PROFILE.问候!==false);
    gr.classList.toggle('on', on);
    gr.setAttribute('aria-checked', on?'true':'false');
    // 先翻面是为了按下去当场有反应；没存成就照 PROFILE 翻回去，别留一个假状态
    saveProfile({问候:on}).then(r=>{ if(!r) syncPrefControls(); });
  };
  syncProfilePanel();
}
/* 名字：一样就不发。空串合法，服务端会认回默认名字。
   防抖那一发还在路上时刚好又失焦，比的是「上一次送出去的值」，不是 PROFILE
   ——PROFILE 要等响应回来才换，光比它会白发第二遍。 */
let nameSent=null;
function putName(v){
  const nv=String(v==null?'':v).trim().slice(0,40);
  if(nv===(nameSent!=null ? nameSent : (PROFILE.名字||''))) return;
  nameSent=nv;
  saveProfile({名字:nv}).then(r=>{ if(!r) nameSent=null; });
}
/* file＝一张图，null＝移除。传的时候两颗按钮都禁掉，免得连点两次。 */
async function putAvatar(file){
  if(avBusy) return;
  if(file && !/^image\//.test(file.type||'')){ notify(TR('读不了这张图')); return; }
  avBusy=true; avSetBusy(true);
  try{
    const payload = file ? {头像:{数据: await avatarBase64(file)}} : {头像:null};
    await saveProfile(payload);
  }catch(e){ notify(TR('读不了这张图')); }
  finally{ avBusy=false; avSetBusy(false); syncProfilePanel(); }
}
function avSetBusy(on){
  const pick=$('#cfgAvPick'), rm=$('#cfgAvDrop');
  if(pick) pick.disabled=on;
  if(rm) rm.disabled=on || !PROFILE.头像;
}
/* 「个人」段开着时，⌘V 一张图就是换头像。挂在 document 上（那一段里没有可聚焦的
   收图控件），所以先确认设置弹层开着、当前正是这一段，再动手。 */
document.addEventListener('paste', e=>{
  if(!cfgOn() || ST.cfgTab!=='profile' || !$('#cfgAvRow')) return;
  const fs=(e.clipboardData && e.clipboardData.files) || [];
  const f=[].slice.call(fs).filter(x=>/^image\//.test(x.type||''))[0];
  if(!f) return;
  e.preventDefault();
  putAvatar(f);
});

/* 芯片输入：回车／逗号成片，× 删，空输入按退格删最后一枚。 */
function wireChips(box){
  const key=box.dataset.chips, inp=box.querySelector('input');
  const add=v=>{
    v=String(v||'').trim().replace(/[,，]+$/,'').trim();
    if(!v) return;
    if(CFG_FORM[key].indexOf(v)>=0){ inp.value=''; return; }
    CFG_FORM[key]=CFG_FORM[key].concat([v]);
    const sp=document.createElement('span');
    sp.className='chip fresh';
    sp.appendChild(document.createTextNode(v));
    const x=document.createElement('button');
    x.type='button'; x.className='x'; x.setAttribute('aria-label', TR('删除 {name}',{name:v}));
    x.innerHTML=icon('close',9);
    x.dataset.ci=String(CFG_FORM[key].length-1);
    sp.appendChild(x);
    box.insertBefore(sp, inp);
    inp.value='';
    rewireChip(box);
    syncCfgDirty();
  };
  box.querySelectorAll('.chip .x').forEach(x=>x.onclick=()=>dropChip(box, x));
  inp.onkeydown=e=>{
    if(e.key==='Enter' || e.key===',' || e.key==='，'){ e.preventDefault(); add(inp.value); }
    else if(e.key==='Backspace' && !inp.value){
      const last=[...box.querySelectorAll('.chip .x')].pop();
      if(last){ e.preventDefault(); dropChip(box, last); }
    }
  };
  inp.onblur=()=>{ if(inp.value.trim()) add(inp.value); };
  box.onclick=e=>{ if(e.target===box) inp.focus(); };
}
function dropChip(box, x){
  const key=box.dataset.chips, i=+x.dataset.ci;
  CFG_FORM[key]=CFG_FORM[key].filter((_,n)=>n!==i);
  x.closest('.chip').remove();
  rewireChip(box);
  syncCfgDirty();
}
/* 删掉一枚之后后面的下标全变了，重新贴一遍。 */
function rewireChip(box){
  box.querySelectorAll('.chip .x').forEach((x,i)=>{
    x.dataset.ci=String(i);
    x.onclick=()=>dropChip(box, x);
  });
}

  if(cfgPortLocked()) delete payload.端口范围;

   绿＝就绪 · N 篇，琥珀＝扫描中，灰＝服务没起。开始页画一次，之后状态变了就地改字。 */
/* 「状态」的哨兵值（扫描中／就绪／…）跟服务端比较时一律用中文原串，
   这里只管显示，翻不翻不影响判断。 */
function scanChipText(){
  if(SRV_STATE==='off') return TR('服务没起');
  if(SRV_STATE==='scan') return TR('扫描中…');
  return TR('就绪 · {n} 篇',{n:items.length});
}

/* 服务端 JSON 里的「状态」永远是中文哨兵（跟它比较时也一律用中文原串），
   摆到界面上之前翻一次。K() 运行时什么都不做，只是让校验脚本认出这五个键；
   认不出来的值原样放行，不进 __i18nMissing——那是服务端加了新哨兵，不是漏翻。 */
const IDX_STATES = [K('就绪'), K('同步中'), K('未建库'), K('异常'), K('扫描中')];
const idxState = v => IDX_STATES.indexOf(v)>=0 ? TR(v) : String(v==null?'':v);

async function syncStatus(){
  try{
    const r=await fetch('/__status?lang='+LANG,{cache:'no-store'}); if(!r.ok) throw 0;
    const s=await r.json();
    if(s.库根) LIBROOT=s.库根;
    if(s.随手记目录) NOTE_DIR = s.随手记目录;
    /* 笔记本列表的权威来源。单库那一份也有（一条），所以「模式」由服务端说了算，
     不用页面自己猜。列表真的变了（加了一本、改了名、某本离线）才重画。 */
    const wasMulti=NB.multi;
    const nbNew=nbApply(s.笔记本||[], s.模式||'');
    /* 轮询才发现的翻面（别的窗口、CLI、壳菜单加了／移除了笔记本）：nbApply() 已经把
       存储里的路径迁过面了，可 TABS / stack / CLOSED / NOTEPV / TRASHED 还全是旧形态，
       自动保存那一发 POST 会带着不带前缀的路径出去。跟设置里自己改那条一样整页重来。 */
    if(nbFlipped){ await reloadForNb({writeST:true}); return; }
    if(nbNew || wasMulti!==NB.multi){
      /* prunePins() 这里绝不能跑：pins 已经是新形态，items 还是上一趟 /__tree 的旧形态，
         对不上就等于把收藏静默删光。交给下一次 setTree()。 */
      if(wasMulti!==NB.multi) prepItems();
      syncHomeDot(); drawTabs(); repaintPages();
      /* 关联面板画的根行、色点、路径分段都跟着这一版笔记本表走：多本翻面时
         bookDepth() 从 0 变 1，树整棵都得重算；改了颜色／别名也要补一发。
         不补的话得等下一次 relGen++（＝下一次重扫）才对得上。 */
      if(REL_ON){ relGen++; syncRel(); }
      if(cfgOn() && ST.cfgTab==='library') renderCfg();
    }
    const scanning = busy || s.状态==='扫描中';
    /* 5.14：服务端自己在后台扫（开机那一趟同步；老库升级后第一次开机，待办就是在这一趟里
       回填出来的）——扫完不会让 /__pulse 的指纹变，页面就一直拿着扫之前那棵树：升级后头一回
       打开，开始页那一行和待办页是空的，要等库里哪份文件动一下才出来（HEAD 就有的缺口：app
       关着时外部改过的笔记，开机同步完也刷不到页面上）。所以服务端从「扫描中」回到「就绪」的
       那一下补拉一次树——只在这个跳变上拉，不是每 3 秒；页面自己点的重扫（busy）期间问到的
       「扫描中」不算。**这一页只补这一次**（页面加载后头一回跳变）：之后的扫描由 pulse / 重扫自己
       带树回来，平时后台那趟同步（存完、勾完的 kick_sync 恰好被轮询看见）再补一次就是开始页白白
       多淡入一回。回到「就绪」时页面自己正在重扫（busy）就等它扫完再补：撞上开机那一趟时服务端的
       重扫是直接跳过的（sync 拿不到锁），它带回来的那棵树未必是扫完的，而这一次补过就不再补了。 */
    if(srvScan<2){
      if(s.状态==='扫描中'){ if(!busy) srvScan=1; }
      else if(srvScan===1 && !busy){ srvScan=2; loadTree(); }
    }
    const idx=s.索引||{};
    setState(scanning?'scan':'ok',
      TR('端口 {port}',{port:s.端口})+'\n'+TR('上次扫描 {when}',{when:s.上次扫描||''})
      +(idx.收录?'\n'+TR('全文索引 {n} 份（{state}）',{n:idx.收录, state:idxState(idx.状态)}):''));
  }catch(e){ setState('off', TR('服务没起')); }
}

/* /__pulse 的消费逻辑原样保留：整串当指纹，变了就重扫。 */
async function pulse(){
  if(polling) return; polling=true;
  try{
    const r=await fetch('/__pulse',{cache:'no-store'}); if(!r.ok) throw 0;
    const fp=JSON.stringify(await r.json());
    if(lastFp===null){ lastFp=fp; return; }
    if(fp!==lastFp){
      lastFp=fp;
      await doRescan();
      const nd=$('#live'); if(nd){ nd.classList.add('hit'); setTimeout(()=>nd.classList.remove('hit'),1600); }
    }
  }catch(e){}
  finally{ polling=false; }
}
function tick(){
  /* 上一次该整页重来、卡在「有一份没存住」上：等到一个编辑态都不剩了，悄悄补上。
     不在这儿再喊 saveBeforeLeave——那会每三秒弹一次同样的提示。 */
  if(nbHold && !TABS.some(t=>t.editing)){ const o=nbHold; nbHold=null; reloadForNb(o); return; }
  pulse(); syncStatus();
}
$('#retry').onclick=()=>{ setState('scan'); tick(); };

function dragSplit(el, get, set, lo, hi){
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const x0=e.clientX, v0=get();
    const mv=ev=>{ const v=Math.max(lo, Math.min(hi, v0+(ev.clientX-x0))); set(v); };
    const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); saveST(); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
  el.addEventListener('dblclick', ()=>{ set(DEF_ST.sbw); saveST(); });
}

/* ═══ 原生壳能调的那一套 ═══════════════════
   每个都必须存在、不许抛异常、不适用时静默返回——菜单项和工具栏都指着它们。
   v17 新增：toggleLists / quickOpen / enterEdit / rescan / focusSearch。
   v23 新增：trashDoc（文件 → 移到废纸篓，⌘⌫），state() 跟着多一个键 canTrash。
   5.4.1：列表栏下线，toggleLists / toggleSidebar 留成空壳。
   已有方法一律保留。 */
window.AMN = {
  closeTab(){ if(curTab) closeTab(curTab); },
  save(){ const t=active(); if(t&&t.editing) saveEdit(false); },
  newNote(){ newNote(); },
  newTab(){ newTab(); },
  newWindow(){ if(IS_HTTP) window.open('/portal?win=1','_blank','width=1320,height=880'); },
  reveal(){ const t=active(); if(t && t.path) revealPath(t.path); },
  copyPath(){ const t=active(); if(t && t.path) clipPath(t.path); },
  settings(){ openCfg(); },
  /* 换界面语言。'auto' | 'zh-Hans' | 'zh-HK' | 'en'，改完整页重来。 */
  setLang(code){ setLang(code); },
  lang(){ return LANG; },
  /* 壳换语言前挨个 webview 调这一发，等它落地再 reload。返回 true＝都存住了。 */
  saveAllForReload(){ return saveAllForReload(); },
  /* 列表栏 5.4.1 下线。两个名字都留着——壳菜单和老调用方还指得着，
     点了静默返回，不抛异常。 */
  toggleSidebar(){ toggleLists(); },
  toggleLists(){ toggleLists(); },
  /* 栏宽够就是收放左栏，不够就弹浮层——两种情况下这一颗（和 ⌥⌘I）都叫「大纲」。 */
  toggleToc(){
    /* 5.8：关联占着左列时，这一下的意思是「把大纲换回来」——先让关联退场。
       宽窗直接把大纲亮出来（收着的话顺手打开）；窄窗接着走下面的浮层那条。 */
    if(ST.rel){
      ST.rel=false;
      const wide=olWide();
      if(wide) ST.toc=true;
      saveST(); syncRel();
      if(wide) return;
    }
    if(olReady() && !olWide()){ olFloatOn() ? closeOlFloat() : openOlFloat(); syncToc(); return; }
    ST.toc=!ST.toc; saveST(); syncToc();
  },
  /* 5.8：阅读页左列换成「关联」（所在文件夹 ／ 其他版本 ／ 链接）。
     页面标签、库外文档、solo 窗里没有可关联的东西，静默不动。 */
  toggleRelated(){
    if(!relReady()) return;
    ST.rel=!ST.rel; saveST(); syncRel();
  },
  toggleBookmarks(){ toggleBookmarks(); },
  back(){ goHist(-1); },
  forward(){ goHist(1); },
  /* 三条都通向 ⌘K 面板（5.4 起唯一的搜索入口）：search 带预填文字并全选，
     回车就是面板第一行「在全部笔记中搜索…」。 */
  search(t){
    const q=String(t||'');
    setKw(q); render();
    focusOmnibox({seed:q, select:true});
  },
  focusSearch(){ focusOmnibox(); },
  focusOmnibox(){ focusOmnibox(); },
  searchEnter(){
    if(quickOn()){ const it=ckList[ckSel]; if(it){ runCk(it); return; } }
    if(hits.length) openDoc(hits[0], {jump:terms()});
  },
  quickOpen(){ quickOn() ? closeQuick() : openQuick(); },
  enterEdit(){ const t=active(); if(t && !t.editing) startEdit(); },
  toggleEdit(){ const t=active(); if(!t) return; t.editing ? finishEdit() : startEdit(); },
  rescan(){ doRescan(); },
  openNotes(){ openNotesFolder(); },
  openRecent(){ goHome(false); },
  /* 壳递进来的文件（访达双击、拖到 Dock、amnote://open、-AMNOpenAtLaunch）：
     shell:true ＝「别顶掉正在读的那一篇」，见 openDoc。页面自己的拖放和
     链接点击不带这一笔，照旧复用当前标签。 */
  openPath(rel){ if(rel) openByPath(rel, {shell:true}); },
  openExternalPath(abs){ if(abs) openExtPath(abs); },
  /* 5.7：壳弹完 NSOpenPanel 之后调这两条，参数是绝对路径。 */
  addNotebooks(paths){ addNotebooks(paths); },
  relocateNotebook(id, path){ relocateNotebook(id, path); },
  notebooks(){ return JSON.stringify({模式:NB.multi?'多':'单', 当前:NB.cur, 笔记本:NB.list}); },
  popoutWindow(){ const t=active(); if(t && !t.ext && hasDocNow(t)) openSolo(t.path); },
  quickLook(){ qlOn?closeQL():quickLook(listNow[selSeq]); },
  /* 文件 → 移到废纸篓（⌘⌫）。编辑态下菜单项是灰的（state().canTrash 为假），
     那一下按键会放行给编辑器，⌘⌫ 在编辑态仍然是「删到行首」。 */
  trashDoc(){ const t=active(); if(t && !t.ext && !t.editing) trashDoc(t.path); },
  print(){ try{ window.print(); }catch(e){} },
  escape(){
    if($('#ctx').classList.contains('on')){ closeCtx(); return; }
    if(tabPickOn()){ closeTabPick(); return; }
    if(olFloatOn()){ closeOlFloat(); syncToc(); return; }
    if($('#slash').classList.contains('on')){ hideSlash(); return; }   // 看得见就先收它，这一下 Esc 到此为止
    if(typeOn()){ closeType(); return; }
    const wp=$('#wlpick'); if(wp && wp.classList.contains('on')){ wp.classList.remove('on'); return; }
    const fb=$('#fmt'); if(fb && fb.classList.contains('on')){ hideFmt(); return; }
    if(quickOn()){ closeQuick(); return; }
    if(qlOn){ closeQL(); return; }
    if(cfgOn()){ closeCfg(); return; }
    /* 窄窗里关联是覆在正文上的一层，Esc 先收它。宽窗停靠着的那一档不收——
       它跟大纲一样是常驻栏，不该被 Esc 关掉。专注模式下它 opacity:0 看不见，
       那一下 Esc 该留给「退出专注」——看不见的一层不该抢走 Esc（同下面头像浮层）。 */
    if(REL_ON && !olWide() && !FOCUS){ AMN.toggleRelated(); return; }
    if(FOCUS){ setFocus(false); return; }
    /* 头像浮层排在这几层后面。它会被 ⌘K 面板／快看／设置整个盖住，专注模式下
       还跟着 .rightgrp 一起淡出——看不见的一层不该抢走 Esc。上面那几处也都在
       打开时顺手关掉它，这一条只兜「浮层是当前唯一开着的东西」。 */
    if(userPopOn()){ closeUserPop(); return; }
    const t=active();
    if(t && t.editing){ cancelEdit(); return; }
    if(kw){ clearQ(false); return; }
  },
  /* 壳那边「取消」的回执靠一个 50 毫秒的延时判定，极端情况下会先送一条 null
     再送真实选择。所以收到 null 不立刻销毁回调，延后一拍再销毁。 */
  menuPick(id, itemId){
    if(itemId){ const cb=ctxCb; ctxCb=null; if(cb) cb(itemId); return; }
    const cb=ctxCb; setTimeout(()=>{ if(ctxCb===cb) ctxCb=null; }, 300);
  },
  confirmReply(){},                       // 确认框走同步那条路，这里留着占位
  /* 壳读完 NSPasteboard 的回执。id 对不上（已经超时）就丢掉。 */
  clipPeekReply(id, payload){
    const w=CLIP_PEEK[id];
    if(!w) return;
    clearTimeout(w.to);
    delete CLIP_PEEK[id];
    w.resolve(payload||null);
  },
  state(){
    const t=active();
    const start=isStartTab(t) && TABS.length===1;
    return JSON.stringify({
      hasDoc:hasDocNow(t),
      inReader:inReaderNow(),
      isStart:start,
      tabCount:TABS.length,
      canBack:canBack(t),
      canForward:canForward(t),
      bookmarks:false,               /* 书签栏 5.4 起下线，这一位恒假 */
      dirty:!!dirty(t), editing:!!(t&&t.editing),
      canEdit:hasDocNow(t) && !t.ext && kindOfTab(t)==='md' && canEditPath(t.path),
      /* 第 14 个键（v23）。编辑态一律为假：⌘⌫ 在编辑器里是「删到行首」，
         菜单项灰掉这一下按键才会放行给正文。 */
      canTrash:hasDocNow(t) && !t.ext && !t.editing && canTrashPath(t.path),
      /* 列表栏 5.4.1 下线，这两位恒假；键留着，壳还在读。 */
      lists:false, sidebar:false, toc:OL_ON||olFloatOn(),
      /* 第 15 个键（5.7）：此刻聚焦的笔记本名，「全部」和单库是空串。 */
      notebook:NB.cur, notebookCount:NB.list.length,
      /* 第 16 个键（5.8）：关联面板此刻露没露，壳菜单「显示关联」靠它打勾。 */
      related:REL_ON
    });
  }
};

/* 以前回沉浸首页。现在 chrome 不收，改成当前标签去开始页，前进后退还能回来。 */
function tryLeaveReader(){
  const t=active();
  // 原先是「不保存并离开」＋丢字，现在改成先落盘：既然存得下，就没有要问的了。
  // 存不成 saveBeforeLeave 自己会报一句，这里不再叠一个确认框。
  if(t && t.editing){
    const ep=paneOf(t);
    if(t.editing && (dirty(t) || t.conflict || (ep && ep.classList.contains('src')))){
      saveBeforeLeave(t).then(ok=>{ if(ok) tryLeaveReader(); });
      return false;                          // 这一趟没走成，落盘之后自己再来一遍
    }
    endEdit(t);
  }
  if(SOLO){ leaveReader(); return true; }
  navigate(makeEntry('start', {title:TR('开始')}));
  return true;
}

/* ═══ 键盘 ═══════════════════════════════
   ⌘K / ⌥⌘K / ⌘E / ⌘N 在壳里由菜单转发（见 app_shell.m），页内这几条是
   浏览器直开门户时的兜底：壳在就不重复接，免得一次按键触发两遍。 */
addEventListener('keydown', e=>{
  if(e.isComposing || e.keyCode===229) return;
  const inReader=inReaderNow();
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'') || e.target.isContentEditable;

  if(e.key==='Escape'){ AMN.escape(); return; }

  // ⌘S 存当前这份
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s' && !e.ctrlKey){
    const t=active();
    if(t && t.editing){ e.preventDefault(); saveEdit(false); return; }
  }
  if(e.metaKey && e.key===','){ e.preventDefault(); openCfg(); return; }
  if(e.metaKey && e.altKey && e.key.toLowerCase()==='c'){
    e.preventDefault(); const t=active(); if(t && t.path) clipPath(t.path); return; }
  if(e.metaKey && e.altKey && e.key.toLowerCase()==='i'){ e.preventDefault(); AMN.toggleToc(); return; }
  /* ⌥⌘R 关联（5.8）。壳里也有这一项，所以必须排在下面 `if(SHELL) return` 之前；
     按住 Option 时 e.key 可能是死键或 ®，认 e.code。 */
  if(e.metaKey && e.altKey && e.code==='KeyR'){ e.preventDefault(); AMN.toggleRelated(); return; }
  if(e.metaKey && e.key.toLowerCase()==='l'){ e.preventDefault(); focusOmnibox(); return; }
  if(e.metaKey && e.key==='['){ e.preventDefault(); goHist(-1); return; }
  if(e.metaKey && e.key===']'){ e.preventDefault(); goHist(1); return; }
  if(e.metaKey && e.shiftKey && e.key.toLowerCase()==='b'){ e.preventDefault(); toggleBookmarks(); return; }
  // ⌘⇧T 把刚关掉的那个标签搬回来。壳菜单没占这一组，页面里绑就行。
  if(e.metaKey && e.shiftKey && !e.altKey && e.key.toLowerCase()==='t' && !SOLO){
    e.preventDefault(); reopenClosed(); return;
  }
  if(e.metaKey && !e.shiftKey && e.key.toLowerCase()==='t'){ e.preventDefault(); newTab(); return; }
  if(!e.metaKey && !e.ctrlKey && !e.altKey && !inField && e.key.length===1 && !/\s/.test(e.key)){
    const t=active();
    if(isStartTab(t)){
      e.preventDefault();
      focusOmnibox({seed:e.key, pulse:true});
      return;
    }
  }
  // 关掉当前标签。开始页且只剩一个时 inReader 为假，⌘W 交给壳关窗口。
  if(e.metaKey && e.key.toLowerCase()==='w' && inReader && curTab){
    e.preventDefault(); closeTab(curTab); return;
  }
  // ⌃Tab / ⌃⇧Tab 在打开的标签里循环。⌘W 仍关当前这份。
  if(e.ctrlKey && !e.metaKey && !e.altKey && e.key==='Tab' && inReader && TABS.length>=2){
    e.preventDefault(); cycleTab(e.shiftKey ? -1 : 1); return;
  }
  if(e.ctrlKey && !e.metaKey && (e.key==='PageDown' || e.key==='PageUp') && inReader && TABS.length>=2){
    e.preventDefault(); cycleTab(e.key==='PageDown' ? 1 : -1); return;
  }
  if(SHELL) return;                       // 下面几条壳里走菜单转发
  if(e.metaKey && e.altKey && e.key.toLowerCase()==='k'){ e.preventDefault(); focusSearch(); return; }
  if(e.metaKey && e.key.toLowerCase()==='k'){ e.preventDefault(); AMN.quickOpen(); return; }
  /* ⌥⌘N 新建随手记（5.7 起，壳里由菜单转发）。按住 Option 时 e.key 可能是
     死键或 ñ，所以先认 e.code。⌘N 仍然是「新建窗口」，这一条必须排在它前面。 */
  if(e.metaKey && e.altKey && (e.code==='KeyN' || e.key.toLowerCase()==='n')){
    e.preventDefault(); newNote(); return;
  }
  if(e.metaKey && e.key.toLowerCase()==='n'){ e.preventDefault(); AMN.newWindow(); return; }
  if(e.metaKey && e.key.toLowerCase()==='e' && inReader){
    const t=active();
    if(t && !t.ext && canEditPath(t.path) && !t.editing){ e.preventDefault(); startEdit(); }
    return;
  }
  if(e.key==='/' && !inField && !inReader){ e.preventDefault(); focusSearch(); return; }
  if(e.key===' ' && !inField && qlOn){ e.preventDefault(); closeQL(); }
});
addEventListener('compositionend', e=>{
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'') || e.target.isContentEditable;
  if(inField || !e.data) return;
  const t=active();
  if(isStartTab(t)) focusOmnibox({seed:e.data, pulse:true});
});

/* ═══ 拖进来的文件 ═══════════════════════
   库内的照旧在门户里开；库外的 .md 走只读模式，不再静默丢弃。 */
addEventListener('dragover', e=>{ if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
addEventListener('drop', e=>{
  // 设置弹层里有自己的收图区（「个人」段那块头像）：那儿的拖放归它自己管。
  // 那边也 stopPropagation 了，这一条是第二道保险。
  if(e.target && e.target.closest && e.target.closest('#cfgWrap')) return;
  const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  e.preventDefault();
  const path=f.path || '';                       // WKWebView 给得到本地路径
  if(!path){ tell(TR('打不开'), TR('这个来源拿不到文件路径')); return; }
  // 绝对路径这一段（问 /__locate、回落最长前缀、库外只读）跟访达双击是同一条
  openByPath(path);
});

/* ═══ 同源的另一个窗口改了笔记本 ═══════════
   那边已经把 tp-state 里的路径迁过一遍了（加前缀／剥前缀），这边手上的
   TABS / pins / recents 就全是旧形态。半页新半页旧是最难查的一类错，
   看到 nbMark 变了就整页重来——跟切换界面语言走的是同一条老路，重来之前先把
   还在编辑的那几份落盘（reloadForNb），存不下就停在原地不 reload。
   **一个字都不写 localStorage**：迁移是那边做的，这边手上还是旧形态。 */
addEventListener('storage', e=>{
  if(!e || e.key!=='tp-state' || !e.newValue) return;
  let v=null; try{ v=JSON.parse(e.newValue)||{}; }catch(err){ return; }
  const mark=(v.nbMark==='multi'?'multi':'') !== (ST.nbMark==='multi'?'multi':'');
  const gen=(+v.nbGen||0) !== (+ST.nbGen||0);        // 改名：形态没变，但前缀的写法变了
  if(mark || gen) reloadForNb();
});

/* ── 新用户引导 ─────────────────────────
   四张卡片，一台很小的状态机，**只在壳里跑**（浏览器模式一律不挂）：

     __AMN_VAULT_STATE__ === 'first-run'  → welcome  欢迎，两张选择卡
     __AMN_VAULT_STATE__ === 'missing'    → missing  找不到上次的笔记库
     __AMN_ONBOARDING__  === true         → scanning 正在整理 → done 整理好了
     其余（ok 且没有 onboarding 标记）     → 什么都不画

   welcome / missing 那两张按下去只是 post 一条消息给壳，**不等回音**：
   壳弹的是 NSOpenPanel，用户按取消、或者又选了同一个库根，壳就不会重载，
   页面得留在原地还能再点。所以按钮只进「正在打开…」这个软状态，卡片不锁死。
   scanning → done 靠 /__status 轮询：状态回到「就绪」就换卡片。 */
const ONB_STATE = SHELL ? String(window.__AMN_VAULT_STATE__||'ok') : 'ok';
const ONB_PATH  = SHELL ? String(window.__AMN_VAULT_PATH__||'') : '';
let onbStep=null, onbTimer=null, onbFound=0;

function onbNeeded(){
  if(!SHELL || SOLO) return null;
  if(ONB_STATE==='first-run') return 'welcome';
  if(ONB_STATE==='missing') return 'missing';
  if(window.__AMN_ONBOARDING__===true) return 'scanning';
  return null;
}

   得按真数字挑（英文 1 篇是 note、2 篇是 notes），所以先拿数字翻译，再把译文里

  if(step==='missing') return onbCard(
    onbHead(`<div class="qmark">${icon('folder',28)}<em>?</em></div>`,
            esc(TR('找不到上次的笔记库')),esc(TR('这个文件夹被移动、改名或者删掉了。')))
    + `<div class="oldpath">${icon('folder',13)}<span title="${esc(ONB_PATH)}">${esc(ONB_PATH||TR('（没记下路径）'))}</span></div>
       <div class="onb-btns">
         <button type="button" class="btn key" data-onb="choose">${esc(TR('重新选择位置…'))}</button>
         <button type="button" class="btn" data-onb="create">${esc(TR('新建一个笔记库'))}</button>
       </div>
       <p class="onb-fine">${esc(TR('文件不会丢，只是 AM·Note 找不到那个文件夹了。'))}</p>`);

  if(step==='scanning') return onbCard(
    onbHead(onbAppIco,esc(TR('正在整理你的笔记…')),esc(TR('读一遍文件夹里的 Markdown 和网页，不会改动任何文件。')))
    + `<div class="pbar" role="progressbar" aria-label="${esc(TR('正在整理'))}"></div>
       <div class="scanrow">
         <span class="cnt">${onbCntHtml(onbFound)}</span>
         <span class="pth" title="${esc(ONB_PATH||LIBROOT)}">${esc(ONB_PATH||LIBROOT)}</span>
       </div>
       <p class="onb-foot">${esc(TR('这一步只做一次，之后打开就是秒开。'))}</p>`);

  // done
  const docs=(TREE&&TREE.文档)||[];
  const md=docs.filter(d=>String(d.类型||'md')!=='html').length;
  const html=docs.length-md;
  const dirs=((TREE&&TREE.目录)||[]).length;
  const ok=`<div class="okmark"><svg viewBox="0 0 24 24" aria-hidden="true">`
    + `<path d="M3.2,12 A8.8,8.8 0 1,0 20.8,12 A8.8,8.8 0 1,0 3.2,12" stroke-linecap="round"/>`
    + `<path d="M7.6,12.3 L10.7,15.4 L16.4,8.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  const skipped=onbSkipped();
  return onbCard(
    onbHead(ok,esc(TR('整理好了')),esc(TR('你的笔记库已经可以用了。')))
    + `<div class="stats">
        <div class="stat"><b class="num">${md}</b><span>${esc(TR('篇 Markdown',{n:md}))}</span></div>
        <div class="stat"><b class="num">${html}</b><span>${esc(TR('个网页',{n:html}))}</span></div>
        <div class="stat"><b class="num">${dirs}</b><span>${esc(TR('个文件夹',{n:dirs}))}</span></div>
      </div>
      ${skipped?`<p class="skipnote">${esc(TR('跳过了 {names}（可在设置里调整）',{names:skipped}))}</p>`:''}
      <div class="onb-btns"><button type="button" class="btn key" data-onb="go">${esc(TR('开始使用'))}</button></div>`);
}
/* 「跳过了 …」这一行报的是**真的被整个跳掉的顶层文件夹**，不是配置里的关键词：
   静态服务对库根出的是目录清单，从那儿拿到磁盘上真有的顶层文件夹名，再拿
   「跳过目录关键词」按服务端同一套判据（包含即命中，见 fulltext.should_skip）
   比一遍。点开头的（.git/.amnote/.claude）是机器的事，不跟用户报账。
   任何一步取不到就整行不出——规范允许省略，但不允许写一句可能是假的。 */
let ONB_SKIP_NAMES=[];
function onbSkipped(){ return ONB_SKIP_NAMES.slice(0,4).join(LANG==='en' ? ', ' : '、'); }
async function onbLoadSkips(){
  ONB_SKIP_NAMES=[];
  if(!IS_HTTP) return;
  try{
    const cr=await fetch('/__config?lang='+LANG,{cache:'no-store'}); if(!cr.ok) return;
    const kw=(((await cr.json()).配置)||{}).跳过目录关键词||[];
    if(!kw.length) return;
    const lr=await fetch('/',{cache:'no-store'}); if(!lr.ok) return;
    const doc=new DOMParser().parseFromString(await lr.text(),'text/html');
    const dirs=[...doc.querySelectorAll('a[href]')]
      .map(a=>a.getAttribute('href')||'')
      .filter(h=>h.slice(-1)==='/' && h.indexOf('..')<0)
      .map(h=>{ try{ return decodeURIComponent(h.slice(0,-1)); }catch(e){ return h.slice(0,-1); } })
      .filter(n=>n && n[0]!=='.');
    ONB_SKIP_NAMES=dirs.filter(n=>kw.some(k=>k && k[0]!=='.' && n.indexOf(k)>=0));
  }catch(e){}
}

function onbShow(step){
  onbStep=step;
  document.body.classList.add('onb');
  const w=$('#onbWrap');
  w.classList.add('on');
  w.innerHTML=onbHtml(step);
  w.querySelectorAll('[data-onb]').forEach(b=>b.onclick=()=>onbClick(b));
}
function onbHide(){
  onbStep=null;
  clearTimeout(onbTimer); onbTimer=null;
  document.body.classList.remove('onb');
  const w=$('#onbWrap');
  w.classList.remove('on'); w.innerHTML='';
}
function onbClick(b){
  const a=b.dataset.onb;
  if(a==='go'){ onbHide(); ST.tips=true; saveST(); repaintPages(); return; }
  if(a!=='choose' && a!=='create') return;
  // 壳可能根本不会重载（用户按了取消、或又选了同一个库根），所以只给一层
  // 「正在打开…」的软提示：这一张卡片变淡、不可点，另一张照样能点。
  post({type: a==='choose' ? 'chooseVault' : 'createVault'});
  b.classList.add('wait');
  const p=b.querySelector('.path .p') || b;
  const old=p.textContent;
  p.textContent=TR('正在打开…');
  setTimeout(()=>{ b.classList.remove('wait'); p.textContent=old; }, 2500);
}
/* 整理中：每 500ms 问一次 /__status，收录数往上跳；状态回到「就绪」就换卡片。 */
async function onbPoll(){
  if(onbStep!=='scanning') return;
  let done=false;
  try{
    const r=await fetch('/__status?lang='+LANG,{cache:'no-store'});
    if(r.ok){
      const s=await r.json();
      onbFound=(s.索引||{}).收录||0;
      const el=$('#onbCnt'); if(el) el.textContent=onbFound;
      done = s.状态!=='扫描中';
    }
  }catch(e){}
  if(onbStep!=='scanning') return;
  if(done){
    try{ await loadTree(); }catch(e){}
    await onbLoadSkips();
    if(onbStep==='scanning') onbShow('done');
    return;
  }
  onbTimer=setTimeout(onbPoll, 500);
}
function onbBoot(){
  const step=onbNeeded();
  if(!step) return;
  onbShow(step);
  if(step==='scanning') onbTimer=setTimeout(onbPoll, 120);
}

/* ═══ 起步 ═══════════════════════════════ */
/* mdrt＝只跑写回自检，不拉库、不开轮询，无头浏览器才能把页面吐出来。 */
const MDRT = /[?&]mdrt(?:[=&]|$)/.test(location.search);
if(!MDRT){
bootI18n();                 // 写死在 <body> 里的字，先按当前语言换掉
if(EMBED){
  const t=makeTab(makeEntry('md', {path:EMBED.路径, title:EMBED.标题}));
  t.noEdit=true;
  TABS.push(t); newPane(t);
  t.raw=EMBED.正文;
  const md=paneOf(t).querySelector('.md');
  renderMd(md, EMBED.正文, dirOf(EMBED.路径));
  decorateHistory(md, t);
  drawDocMeta(t);
  enterReader(); showTab(t.id);
}else{
  loadFilters();
  applyST();
  render();
  /* 个人资料跟 /__tree 并行拉，但开始页的第一笔要等它落地：问候和
     「今天，想记下什么？」是同一行 h1，先画一句再换成另一句就是闪。
     最多等 800 毫秒——服务卡住了页面也得出来，晚到的那份照样会重画。 */
  const profileReady = Promise.race([
    loadProfile(),
    new Promise(ok=>setTimeout(ok, 800)),
  ]);
  if(!SOLO){
    openStartTab(profileReady);
  }
  loadTree().then(()=>profileReady).then(()=>{
    if(!SOLO && !TABS.length) openStartTab();
    const at=active();
    if(at && isPageKind(kindOfTab(at))) paintPage(at);
  });

  if(!TOKEN_OK && IS_HTTP) bnr('upgrade', true);
  // solo 窗口一律不轮询：它只显示自己那一份，不该替主窗口收件
  if(LIVE && !SOLO){ tick(); setInterval(tick, 3000); }
  if(SOLO){ const d=QS.get('doc'); if(d) openByPath(d); }
}
paintIcons(document);
applyST();
applyPref();
syncRel();
onbBoot();
}
/* 上一轮在壳里换了语言：菜单已经重建过，但 AppKit 自带的那几项要下次启动才跟上。
   记号只消费一次，说完就抹掉。 */
(function langSwitchedNote(){
  let f=null;
  try{ f=localStorage.getItem('tp-lang-switched'); localStorage.removeItem('tp-lang-switched'); }catch(e){}
  if(f && SHELL) setTimeout(()=>notify(TR('系统菜单里的少数项目会在下次启动后换成新语言')), 900);
})();
post({type:'ready'});

/* 地址栏带 mdrt 才跑：富文本写回 markdown 再渲染，必须还是屏幕上那一块。
   平时一个断言都不执行。 */
if(MDRT){
  const rtBox = document.createElement('div');
  function rtHtml(md){
    rtBox.innerHTML = md2html(md, 'notes', 0);
    return [...rtBox.children];
  }
  function blockOk(el){
    const s = blkMd(el);
    const back = document.createElement('div');
    back.innerHTML = md2html(s, 'notes', 0);
    const ok = back.children.length===1 && normHtml(back.innerHTML)===normHtml(el.outerHTML);
    return {ok, s, a:normHtml(el.outerHTML), b:back.children.length===1?normHtml(back.innerHTML):('N='+back.children.length+' '+back.innerHTML)};
  }
  function rtMd(md){
    const els = rtHtml(md);
    if(els.length!==1) return {ok:false, md, s:'', a:'blocks='+els.length, b:els.map(e=>e.tagName).join(',')};
    const r = blockOk(els[0]);
    r.md = md;
    return r;
  }
  function rtDom(html){
    const box = document.createElement('div');
    box.innerHTML = html;
    const el = box.firstElementChild;
    const r = blockOk(el);
    r.md = html;
    return r;
  }
  const fails = [];
  const expect = (name, cond, detail) => { if(!cond) fails.push(name+(detail?': '+detail:'')); };
  [
    '# 标题','## 二级','普通一段','**加粗**','*斜体*','~~删除~~','`代码`',
    '3*4=12','路径里的 \\* 号','- 一项','- [ ] 待办','- [x] 已办',
    '1. 有序','> 引用','---',
    '```js\nconst a=1;\n```',
    '| 项目 | 备注 |\n| --- | ---: |\n| 甲 | 1 |\n| 乙 | 2 |',
    '| 起\\|止 | 说明 |\n| --- | --- |\n| a\\|b | 还在一格 |',
    '[[周会]]','[链接](https://example.com/a)','见 <br> 这里',
    '一行\n接着一行',
    '![](图示/a.png)',
  ].forEach(md => { const r = rtMd(md); if(!r.ok) fails.push('md '+JSON.stringify(md).slice(0,80)+'\n  '+r.s+'\n  A '+r.a+'\n  B '+r.b); });
  [
    '<p>*重点*</p>','<p>**加粗**</p>','<p>3*4=12</p>','<p>a * b * c</p>',
    '<p>`代码`</p>','<p>~~删~~</p>','<p>[文字](https://example.com)</p>',
    '<p>未定稿 \\*</p>','<p>- 这不是列表</p>','<p># 这不是标题</p>',
    '<p>&gt; 这不是引用</p>','<p>---</p>','<p>| 不是表格</p>',
    '<p><strong>加粗</strong></p>','<p><em>斜体</em></p>','<p><strong><em>又粗又斜</em></strong></p>',
    '<p><strong>前 <em>中</em> 后</strong></p>','<p><strong>甲</strong><em>乙</em></p>',
    '<p><code>a*b</code></p>','<p><code>a`b</code></p>','<p><del>删</del></p>',
    '<p><a href="https://example.com/a)b" data-u="https://example.com/a)b" target="_blank" rel="noopener">链</a></p>',
  ].forEach(html => {
    const box = document.createElement('div');
    box.innerHTML = html;
    const p = box.firstElementChild;
    if(p && p.textContent==='<br>' || html==='<p><br></p>'){} 
    const r = rtDom(html);
    if(!r.ok) fails.push('dom '+html+'\n  '+r.s+'\n  A '+r.a+'\n  B '+r.b);
  });
  /* 打出来的 <br> 四个字要还是四个字，不能变成换行。 */
  {
    const p = document.createElement('p');
    p.appendChild(document.createTextNode('<br>'));
    const r = blockOk(p);
    expect('literal br text', r.ok && r.b.indexOf('<br>')<0 && /&lt;br&gt;/.test(r.a||''), r.s+' || '+r.b);
  }
  /* 只有一个光标位的空段：不写进文件，自检也不该把它当成存不进去。 */
  {
    const p = document.createElement('p');
    p.appendChild(document.createElement('br'));
    expect('empty paragraph skipped', !blkMd(p, 'notes').trim());
  }
  /* 表格格子里的竖线留在这一格。 */
  {
    const html = '<div class="tw"><table data-al=","><thead><tr><th>项目</th><th>备注</th></tr></thead><tbody><tr><td>起|止</td><td>说明</td></tr></tbody></table></div>';
    const r = rtDom(html);
    expect('cell pipe', r.ok && r.s.includes('\\|') && !r.b.includes('</td><td>止'), r.s);
  }
  /* 老写法 \| 打开时应是一格里的竖线，不是从这里拆开。 */
  {
    const els = rtHtml('| 格式「起\\|止」 | 说明 |\n| --- | --- |\n| 甲 | 乙 |');
    const cells = [...els[0].querySelectorAll('td,th')].map(c=>c.textContent);
    expect('legacy escaped pipe', cells[0]==='格式「起|止」' && cells.length===4, cells.join(' / '));
  }
  /* 反斜杠星号仍是反斜杠星号，不当成转义。 */
  {
    const els = rtHtml('未定稿一律打 \\*');
    expect('literal backslash star', els.length===1 && els[0].textContent==='未定稿一律打 \\*', els[0]&&els[0].textContent);
  }
  const pre = document.createElement('pre');
  pre.id = 'mdrt-out';
  pre.textContent = fails.length ? ('FAIL '+fails.length+'\n'+fails.join('\n---\n')) : 'OK';
  document.body.appendChild(pre);
  window.__mdrt = {ok:!fails.length, fails};
}
</script>
