    if(!(n.tagName==='LI'&&n.classList.contains('task'))
       && !n.classList.contains('tw') && !n.classList.contains('imgbad')) n.removeAttribute('class');
    ['align','color','face','dir'].forEach(a=>n.removeAttribute(a));
  });
  // 末尾那个 <br> 不在这里删。浏览器拿它当空段落的光标位，删了正在打字的地方
  // 就没了。它不写进文件——inlMd 出口处会去掉。
  ensureBr(el);
  return el;
}

/* 空块必须有一个 <br>，否则 WebKit 放不进光标，看起来像「回车了但光标没动」。 */
function ensureBr(el){
  if(!el || el.nodeType!==1) return el;
  if(/^(UL|OL|TABLE|THEAD|TBODY|TR|HR)$/.test(el.tagName)) return el;
  const has = (el.textContent||'').replace(/\u200b/g,'').length
           || el.querySelector('img,br,ul,ol,table,input');
  if(!has) el.appendChild(document.createElement('br'));
  return el;
}
function tidyTxt(s){ return String(s||'').replace(/[\u00a0\u3000]/g,' ').replace(/\u200b/g,''); }

/* 光标所在的可落点块。选区按这块内部的字符偏移记，不按整篇的字符数——
   空块没有字符，按整篇数会把光标送回上一块末尾。 */
function blockish(n, root){
  let topDiv=null;
  while(n && n!==root){
    if(n.nodeType===1 && /^(P|H[1-6]|LI|TD|TH|PRE|BLOCKQUOTE)$/.test(n.tagName)) return n;
    if(n.nodeType===1 && n.tagName==='DIV' && n.parentNode===root && !n.classList.contains('tw')) topDiv=n;
    n=n.parentNode;
  }
  return topDiv;
}
function pathFrom(root, el){
  const path=[];
  let n=el;
  while(n && n!==root){
    const p=n.parentNode; if(!p) break;
    path.unshift([...p.children].indexOf(n));
    n=p;
  }
  return path;
}
function elAtPath(root, path){
  let el=root;
  for(const i of (path||[])){
    if(!el || !el.children || i<0 || i>=el.children.length) return null;
    el=el.children[i];
  }
  return el;
}

/* 洗白会换掉节点，光标就散了。按「哪一块 + 块内第几个字符」记，
   DIV 换成 P、空段加 <br> 都不影响这个坐标。 */
function saveSel(md){
  const s=getSelection();
  if(!s || !s.rangeCount || !md.contains(s.anchorNode)) return null;
  const r=s.getRangeAt(0);
  const blk=blockish(r.startContainer, md);
  const pre=r.cloneRange();
  if(blk){
    pre.selectNodeContents(blk); pre.setEnd(r.startContainer, r.startOffset);
    return {
      path: pathFrom(md, blk),
      at: pre.toString().length,
      len: r.toString().length,
      empty: !tidyTxt(blk.textContent).length
    };
  }
  pre.selectNodeContents(md); pre.setEnd(r.startContainer, r.startOffset);
  return {at: pre.toString().length, len: r.toString().length, empty:false};
}
function restoreSel(md, m){
  if(!m) return;
  if(m.path){
    const el=elAtPath(md, m.path);
    if(!el) return;
    if(m.empty || !tidyTxt(el.textContent).length){
      ensureBr(el);
      caretEnd(el, true);
      return;
    }
    if(!caretAtOffset(el, m.at)) return;
    if(!m.len) return;
    const s=getSelection(); if(!s || !s.rangeCount) return;
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let seen=0, n, endAt=m.at+m.len, b=null;
    while((n=w.nextNode())){
      const e=seen+n.nodeValue.length;
      if(endAt<=e){ b=[n, endAt-seen]; break; }
      seen=e; b=[n, n.nodeValue.length];
    }
    if(!b) return;
    try{
      const r=s.getRangeAt(0);
      r.setEnd(b[0], Math.max(0, Math.min(b[1], b[0].nodeValue.length)));
      s.removeAllRanges(); s.addRange(r);
    }catch(e){}
    return;
  }
  const w=document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
  let seen=0, a=null, b=null, n;
  while((n=w.nextNode())){
    const end=seen+n.nodeValue.length;
    if(!a && m.at<=end) a=[n, m.at-seen];
    if(!b && m.at+m.len<=end){ b=[n, m.at+m.len-seen]; break; }
    seen=end;
  }
  if(!a) return;
  try{
    const r=document.createRange();
    r.setStart(a[0], Math.max(0, Math.min(a[1], a[0].nodeValue.length)));
    if(b) r.setEnd(b[0], Math.max(0, Math.min(b[1], b[0].nodeValue.length)));
    else r.collapse(true);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}

/* ── 重画正文 ─────────────────────────── */
function paintWork(t){
  const p=paneOf(t); if(!p) return;
  const top=p.scrollTop;
  unwatch(t);                                   // 整篇重画会炸出成千上万条变更记录
  const md=p.querySelector('.md');
  undecorateHistory(md);
  renderMd(md, t.editing ? t.work : t.raw, dirOf(t.path));
  if(!t.editing) decorateHistory(md);
  applyPref();
  drawDocMeta(t);
  p.scrollTop=top;
}

/* ── 改动跟踪 ───────────────────────────
   哪一块被动过就给哪一块盖 data-dirty，出去的时候只有盖了章的才反解。 */
function unwatch(t){ if(t.mo){ t.mo.disconnect(); t.mo=null; } }

function watchEdits(t){
  unwatch(t);
  const p0=paneOf(t); if(!p0) return;            // 标签已经关了（移到废纸篓那条路）
  const md=p0.querySelector('.md');
  const top=n=>{
    while(n && n!==md && n.parentNode && n.parentNode!==md) n=n.parentNode;
    return (n && n!==md && n.parentNode===md && n.nodeType===1 && !n.dataset.chrome) ? n : null;
  };
  const hit=[];
  const mark=n=>{ const b=top(n); if(b){ b.dataset.dirty='1'; hit.push(b); } };
  t.mo=new MutationObserver(ms=>{
    hit.length=0;
    ms.forEach(m=>{
      mark(m.target);
      m.addedNodes.forEach(mark);
    });
    t.touched=true;
    // 洗白要等这一轮变更记录处理完再做，不然会跟浏览器自己的编辑动作打架。
    // 洗之前把光标位置记下来，洗完放回去——换节点会把光标弄丢。
    // 拼音打到一半不能洗：换节点、重设 Range 会打断输入法组合，
    // 表现是候选框消失、半截拼音上屏。
    const list=[...new Set(hit)];
    if(list.length) requestAnimationFrame(()=>{
      if(COMPOSING) return;
      // 这一帧之间编辑态可能已经收了（收编辑、关标签、移到废纸篓），
      // 那就什么都别做：面板都拆了，洗块和重挂观察器全是空转
      if(!t.editing || !paneOf(t)) return;
      unwatch(t);
      const before=md.innerHTML, keep=saveSel(md);
      list.forEach(b=>{ if(b.isConnected) cleanBlock(b); });
      if(md.innerHTML!==before) restoreSel(md, keep);
      watchEdits(t);
      syncPh(t);
      if(t.id===curTab && !COMPOSING) syncTabTitle(t);
    });
    if(t.id===curTab) olKick();                  // 标题改了，大纲停手 300 毫秒跟上
    autoKick(t);                                 // 停笔两秒自动落盘
  });
  t.mo.observe(md, {subtree:true, childList:true, characterData:true});
}

/* ── 进编辑前的准备 ─────────────────────
   反解不回 markdown 的块锁住，只能按源码改（v10 的老路）。
   显示层的包装（文档历史折叠）必须先拆干净：台账按 .md 的直接子节点建，
   包装盒会把那张表挤出直接子节点，一拆一存就对不回原文。 */
function prepEdit(t){
  const p=paneOf(t), md=p.querySelector('.md'), base=dirOf(t.path);
  undecorateHistory(md);
  buildRegistry(t);
  let lock=0;
  [...md.children].forEach(el=>{
    if(el.nodeType!==1) return;
    if(el.dataset.chrome){ el.contentEditable='false'; return; }
    if(safeBlock(el, base)){
      el.removeAttribute('data-lock'); el.removeAttribute('contenteditable');
    }else{
      el.setAttribute('data-lock','1'); el.setAttribute('contenteditable','false'); lock++;
    }
  });
  md.setAttribute('contenteditable','true');
  md.spellcheck=false;
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  watchEdits(t);
  t.lock=lock;
  syncPh(t);
}

/* 光标落到某一块的末尾（atStart 则到开头）。空块先补 <br> 再放光标。 */
function caretEnd(el, atStart){
  if(!el) return;
  const tgt = el.tagName==='UL'||el.tagName==='OL' ? (el.querySelector('li')||el) : el;
  ensureBr(tgt);
  try{
    const r=document.createRange();
    r.selectNodeContents(tgt);
    r.collapse(!!atStart);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
/* 选中一块里的文字（不含末尾那个当光标位的 <br>）。新建笔记用来圈住默认标题。 */
function caretSelect(el){
  if(!el) return;
  try{
    const texts=[];
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n; while((n=w.nextNode())) if(n.nodeValue) texts.push(n);
    const r=document.createRange();
    if(texts.length){
      r.setStart(texts[0], 0);
      const last=texts[texts.length-1];
      r.setEnd(last, last.nodeValue.length);
    }else{
      ensureBr(el);
      r.selectNodeContents(el);
    }
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
function isBlankBlock(el){
  if(!el || el.nodeType!==1) return true;
  if(el.querySelector('img,table,ul,ol,pre')) return false;
  return !tidyTxt(el.textContent).trim();
}
/* 空标题、文首空段叠一层占位。data-ph 不进序列化（normHtml 会剥掉）。 */
function syncPh(t){
  const p=t&&paneOf(t); if(!p || !t.editing || p.classList.contains('src')) return;
  const md=p.querySelector('.md'); if(!md) return;
  const kids=[...md.children].filter(el=>el.nodeType===1 && el.tagName!=='TEXTAREA' && !el.dataset.chrome);
  kids.forEach(el=>el.removeAttribute('data-ph'));
  const h1=kids[0] && kids[0].tagName==='H1' ? kids[0] : null;
  if(h1 && isBlankBlock(h1)) h1.setAttribute('data-ph','1');
  const para=kids.find(el=>el.tagName==='P');
  const rest=kids.filter(el=>el!==h1 && el!==para);
  if(para && isBlankBlock(para) && rest.every(isBlankBlock)) para.setAttribute('data-ph','1');
}
function syncTabTitle(t){
  if(!t || t.ext) return;
  const md=paneOf(t)&&paneOf(t).querySelector('.md');
  const h1=md && md.firstElementChild && md.firstElementChild.tagName==='H1'
    ? tidyTxt(md.firstElementChild.textContent).trim() : '';
  const title=h1 || '无标题';
  if(t.title===title) return;
  t.title=title;
  const e=ensureStack(t); if(e && e.kind==='md') e.title=title;
  drawTabs();
  lastNat='';
  syncNative();
  syncChrome();
}
function caretAtStart(el){
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed || !el) return false;
  const r=s.getRangeAt(0);
  if(!el.contains(r.startContainer) && r.startContainer!==el) return false;
  const pre=r.cloneRange();
  pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return !pre.toString();
}

/* 当前光标所在的顶层块 */
function curBlock(t){
  const p=paneOf(t); if(!p) return null;
  const md=p.querySelector('.md'), s=getSelection();
  if(!s || !s.rangeCount) return null;
  let n=s.getRangeAt(0).startContainer;
  if(!md.contains(n)) return null;
  while(n && n.parentNode && n.parentNode!==md) n=n.parentNode;
  return (n && n.parentNode===md && n.nodeType===1 && !n.dataset.chrome) ? n : null;
}

/* 进编辑之后光标到底在不在正文里。v27「打不了字」的病根就是这一条没成立：
   选区还留在别处，看着进了编辑态，键盘敲进去没有插入点。
   判据：选区存在、且落在 #doc（当前这一份的正文）里面。 */
function caretInDoc(){
  const doc=$('#doc'); if(!doc) return false;
  const s=getSelection();
  if(!s || !s.rangeCount) return false;
  const n=s.getRangeAt(0).startContainer;
  return !!(n && doc.contains(n));
}
/* 兜底：不在就 focus 正文，把光标放到第一个可编辑块的末尾。 */
function ensureCaret(t){
  if(caretInDoc()) return true;
  const p=paneOf(t); if(!p) return false;
  const md=p.querySelector('.md');
  md.focus();
  const first=[...md.children].find(el=>el.nodeType===1 && !el.hasAttribute('data-lock')
                                        && el.tagName!=='TEXTAREA');
  if(first) caretEnd(first);
  else{
    const np=document.createElement('p'); np.dataset.dirty='1';
    md.appendChild(np); caretEnd(np);
  }
  return caretInDoc();
}

/* ── 块级源码 ───────────────────────────
   锁住的块只能走这条；没锁的块按 ⌥⌘E 也能走，想直接写 markdown 的时候用。
   改完是**把这一块在台账里的源码换掉**，不是反解——所以按源码改的块，
   写出去还是你亲手打的那几行字节。 */
function openSrcBlk(t, el){
  if(!el || el.tagName==='TEXTAREA') return null;
  const bid=el.dataset.bid;
  const src=(bid!==undefined && t.reg.blocks[+bid] && !el.dataset.dirty)
    ? t.reg.blocks[+bid].src.join('\n') : blkMd(el);
  const ta=document.createElement('textarea');
  ta.className='blk mono'; ta.value=src; ta.spellcheck=false;
  ta.setAttribute('contenteditable','false');    // 别让外面那层 contenteditable 接管
  if(bid!==undefined) ta.dataset.bid=bid;
  ta._fit=()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+1)+'px'; };
  ta.addEventListener('input', ta._fit);
  ta.addEventListener('keydown', e=>{
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeSrcBlk(t, ta, false); }
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); closeSrcBlk(t, ta, true); }
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart, x=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(x);
      ta.selectionStart=ta.selectionEnd=s+2; ta._fit();
    }
  });
  ta.addEventListener('blur', ()=>{ if(!ta.dataset.closing) closeSrcBlk(t, ta, true); });
  unwatch(t);
  el.replaceWith(ta);
  watchEdits(t);
  ta._fit(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  syncStatusLine();
  return ta;
}

function closeSrcBlk(t, ta, keep){
  if(!ta || !ta.isConnected) return;
  ta.dataset.closing='1';
  const bid=ta.dataset.bid;
  const p=paneOf(t), top=p.scrollTop;
  if(keep && bid!==undefined && t.reg.blocks[+bid]){
    t.reg.blocks[+bid].src=ta.value.replace(/\r\n/g,'\n').split('\n');
    t.touched=true;
  }
  // 占位块只带 bid、不带 dirty，序列化时会去台账里抄刚写进去的那几行
  const ph=document.createElement('p');
  if(bid!==undefined) ph.dataset.bid=bid;
  unwatch(t);
  ta.replaceWith(ph);
  if(keep && bid===undefined){                    // 没登记过的块（新插的），直接按文本走
    const box=document.createElement('div');
    box.innerHTML=md2html(ta.value, dirOf(t.path), 0);
    const made=[...box.children]; made.forEach(m=>m.dataset.dirty='1');
    if(made.length) ph.replaceWith(...made); else ph.remove();
  }
  // 行号全变了，重新落一次台账
  t.work=serializeBody(t);
  paintWork(t); prepEdit(t);
  p.scrollTop=top;
  buildToc(); syncProg();
  syncStatusLine(); autoKick(t);
}
/* ── 排版动作 ───────────────────────────
   都走「拿到这一块的纯文本 → 按新的块类型重新渲染一块 → 换上去」这条，
   不去手搓 DOM，样子一定跟正常渲染出来的一致。 */
const MARK={p:'', h1:'# ', h2:'## ', h3:'### ', h4:'#### ',
            h5:'##### ', h6:'###### ',
            quote:'> ', ul:'- ', ol:'1. ', task:'- [ ] '};

const plainOf = el => blkMd(el)
  .replace(/^#{1,6}\s+/,'')
  .replace(/^>\s?/,'')
  .replace(/^([-*+]|\d+[.)])\s+/,'')
  .replace(/^\[[ xX]\]\s+/,'')
  .replace(/^```[^\n]*\n?/,'').replace(/\n?```\s*$/,'');

function retype(t, el, kind, text){
  if(!el) return null;
  const body = text!==undefined ? text : plainOf(el);
  const src = kind==='pre'   ? '```\n'+body+'\n```'
            : kind==='hr'    ? '---'
            : kind==='table' ? '| 项目 | 备注 |\n| --- | --- |\n|  |  |'
            : (MARK[kind]||'') + body;
  const box=document.createElement('div');
  box.innerHTML=md2html(src.trim()?src:' ', dirOf(t.path), 0);
  const made=box.firstElementChild || document.createElement('p');
  made.dataset.dirty='1';
  delete made.dataset.bid;
  t.touched=true;
  if(/^(ul|ol|task)$/.test(kind)){
    const li=made.querySelector('li');
    const want=kind==='ol'?'OL':'UL';
    const prev=el.previousElementSibling;
    if(li && prev && prev.tagName===want && !prev.hasAttribute('data-lock')){
      prev.appendChild(li);
      prev.dataset.dirty='1';
      el.remove();
      ensureBr(li);
      caretEnd(li);
      return prev;
    }
    const next=el.nextElementSibling;
    el.replaceWith(made);
    if(li && next && next.tagName===want && !next.hasAttribute('data-lock')){
      [...next.children].forEach(n=>{ if(n.tagName==='LI') made.appendChild(n); });
      next.remove();
      made.dataset.dirty='1';
    }
    if(li){ ensureBr(li); caretEnd(li); } else caretEnd(made);
    return made;
  }
  el.replaceWith(made);
  caretEnd(made);
  return made;
}

/* 列表进退层级。不用 execCommand('indent')：WebKit 常包一层 blockquote，
   反解会丢掉 `- ` 前缀，存盘后列表项变成引用。 */
function indentLi(t, li){
  if(!li) return;
  const prev=li.previousElementSibling;
  if(!prev || prev.tagName!=='LI') return;
  const list=li.parentElement;
  const tag=list.tagName;
  let sub=[...prev.children].reverse().find(c=>c.tagName===tag);
  if(!sub){ sub=document.createElement(tag.toLowerCase()); prev.appendChild(sub); }
  sub.appendChild(li);
  const top=list.closest('.md>*')||list; top.dataset.dirty='1';
  t.touched=true;
  caretEnd(li);
}
/* 后面那些兄弟。不能写成 while (el.nextElementSibling) rest.push(...)：
   只读不挪的话下一兄弟永远还是它，空项夹在中间一按删除就卡死。 */
function nextSiblings(el){
  const rest=[];
  for(let n=el.nextElementSibling; n; n=n.nextElementSibling) rest.push(n);
  return rest;
}
function outdentLi(t, li){
  if(!li) return false;
  const list=li.parentElement;
  const parentLi=list && list.parentElement;
  if(!parentLi || parentLi.tagName!=='LI') return false;
  const rest=nextSiblings(li);
  parentLi.after(li);
  if(rest.length){
    let sub=[...li.children].reverse().find(c=>c.tagName===list.tagName);
    if(!sub){ sub=document.createElement(list.tagName.toLowerCase()); li.appendChild(sub); }
    rest.forEach(n=>sub.appendChild(n));
  }
  if(!list.children.length) list.remove();
  const top=li.closest('.md>*'); if(top) top.dataset.dirty='1';
  t.touched=true;
  caretEnd(li);
  return true;
}
function liftLiToP(t, li){
  const list=li.parentElement; if(!list) return;
  const rest=nextSiblings(li);
  const p=document.createElement('p');
  p.dataset.dirty='1';
  while(li.firstChild){
    const c=li.firstChild;
    if(c.nodeType===1 && /^(UL|OL|INPUT)$/.test(c.tagName)) break;
    p.appendChild(c);
  }
  ensureBr(p);
  li.remove();
  if(!list.children.length) list.replaceWith(p);
  else { list.dataset.dirty='1'; list.after(p); }
  if(rest.length){
    const nx=document.createElement(list.tagName);
    nx.dataset.dirty='1';
    rest.forEach(n=>nx.appendChild(n));
    p.after(nx);
  }
  t.touched=true;
  caretEnd(p, true);
}
function exitOrOutdentLi(t, li){
  if(outdentLi(t, li)) return;
  liftLiToP(t, li);
}
/* 空项上按删除：只拿掉这一条，光标落到上一条末尾。不要做出缩——
   夹在中间的空项做出缩会把后面整段列表拖走，而且原先那圈兄弟会卡死。 */
function removeEmptyLi(t, li){
  const list=li.parentElement; if(!list) return;
  const prev=li.previousElementSibling;
  const parentLi=list.parentElement && list.parentElement.tagName==='LI' ? list.parentElement : null;
  li.remove();
  t.touched=true;
  if(list.children.length){
    const top=list.closest('.md>*')||list;
    top.dataset.dirty='1';
    if(prev) caretEnd(prev);
    else{
      const first=[...list.children].find(n=>n.tagName==='LI');
      if(first) caretEnd(first, true);
    }
    return;
  }
  if(parentLi){
    const top=parentLi.closest('.md>*');
    list.remove();
    if(top) top.dataset.dirty='1';
    caretEnd(parentLi);
    return;
  }
  const p=document.createElement('p');
  p.dataset.dirty='1';
  ensureBr(p);
  list.replaceWith(p);
  caretEnd(p, true);
}

/* 行内标记。已经在这个标记里就取消，跟加粗按钮该有的行为一致。 */
function closestTag(n, tag){
  while(n && n.nodeType!==9){
    if(n.nodeType===1 && n.tagName===tag) return n;
    if(n.nodeType===1 && n.classList && n.classList.contains('md')) return null;
    n=n.parentNode;
  }
  return null;
}
function unwrapEl(n){
  const f=document.createDocumentFragment();
  while(n.firstChild) f.appendChild(n.firstChild);
  n.replaceWith(f);
}
function wrapInline(tag, attrs){
  const s=getSelection(); if(!s || !s.rangeCount) return;
  const r=s.getRangeAt(0);
  const cur=closestTag(r.commonAncestorContainer, tag);
  if(cur && !attrs){ unwrapEl(cur); return; }
  if(r.collapsed) return;
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs) el.setAttribute(k, attrs[k]);
  try{ r.surroundContents(el); }
  catch(e){ el.appendChild(r.extractContents()); r.insertNode(el); }
  const nr=document.createRange(); nr.selectNodeContents(el);
  s.removeAllRanges(); s.addRange(nr);
}

/* ── 选中文字时浮出来的那一条 ─────────── */
const FMT=[
  ['bold','<b>B</b>','加粗 ⌘B'], ['italic','<i>I</i>','斜体 ⌘I'],
  ['del','<s>S</s>','删除线 ⌘⇧X'], ['code','<code>&lt;&gt;</code>','行内代码 ⌘E'],
  ['link','链接','加链接'], ['sep'],
  ['h2','H2','二级标题'], ['h3','H3','三级标题'], ['p','正文','正文'],
  ['ul','列表','无序列表'], ['quote','引用','引用'], ['sep'],
  ['src','源码','这一块按 markdown 源码改 ⌥⌘E'],
];
function buildFmtBar(){
  if($('#fmt')) return;
  const d=document.createElement('div'); d.id='fmt';
  d.innerHTML=FMT.map(f=>f[0]==='sep'?'<span class="sep"></span>'
    :`<button data-a="${f[0]}" title="${esc(f[2])}">${f[1]}</button>`).join('');
  document.body.appendChild(d);
  // mousedown 先于 blur，不 preventDefault 的话点按钮时选区就没了
  d.addEventListener('mousedown', e=>e.preventDefault());
  d.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    fmtAction(b.dataset.a);
  });
}
function fmtAction(a){
  const t=active(); if(!t || !t.editing) return;
  const blk=curBlock(t);
  // 不走 execCommand('bold')：它给的是 <b>，而我们渲染出来的是 <strong>，
  // 事后再洗一遍会把光标弄丢。直接生成自己那套标签。
  if(a==='bold'){ wrapInline('STRONG'); }
  else if(a==='italic'){ wrapInline('EM'); }
  else if(a==='del'){ wrapInline('DEL'); }
  else if(a==='code'){ wrapInline('CODE'); }
  else if(a==='link'){
    const cur=closestTag(getSelection().anchorNode,'A');
    if(cur){ unwrapEl(cur); }
    else{
      const u=prompt('链接地址'); if(!u) return;
      wrapInline('A', {href:u, 'data-u':u, target:'_blank', rel:'noopener'});
    }
  }
  else if(a==='src'){ hideFmt(); if(blk) openSrcBlk(t, blk); return; }
  else if(blk && !blk.hasAttribute('data-lock')){ retype(t, blk, a); }
  t.touched=true;
  if(blk && blk.isConnected) blk.dataset.dirty='1';
  autoKick(t);
  placeFmt();
}
function hideFmt(){ const f=$('#fmt'); if(f) f.classList.remove('on'); }
function placeFmt(){
  const f=$('#fmt'); if(!f) return;
  const t=active();
  if(!t || !t.editing || paneOf(t).classList.contains('src')){ hideFmt(); return; }
  const s=getSelection();
  if(!s || !s.rangeCount || s.isCollapsed){ hideFmt(); return; }
  const md=paneOf(t).querySelector('.md');
  if(!md.contains(s.anchorNode)){ hideFmt(); return; }
  const r=s.getRangeAt(0).getBoundingClientRect();
  if(!r.width && !r.height){ hideFmt(); return; }
  f.classList.add('on');
  const w=f.offsetWidth, h=f.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.top-h-8;
  if(y<40) y=r.bottom+8;
  f.style.left=Math.max(8, Math.min(innerWidth-w-8, x))+'px';
  f.style.top=y+'px';
  // 当前选区已经是加粗/斜体的话按钮点亮
  const on=(tag)=>!!closestTag(s.anchorNode, tag);
  f.querySelectorAll('button').forEach(b=>{
    const a=b.dataset.a;
    b.classList.toggle('on',
      a==='bold'?on('STRONG'):a==='italic'?on('EM'):a==='del'?on('DEL'):
      a==='code'?on('CODE'):a==='link'?on('A'):false);
  });
}
document.addEventListener('selectionchange', ()=>{
  clearTimeout(placeFmt._tm);
  placeFmt._tm=setTimeout(placeFmt, 60);
});

/* ── 编辑区里的键 ───────────────────────
   markdown 打法照样管用：行首打 ## 加空格就变二级标题，- 加空格变列表，
   > 加空格变引用，[] 加空格变勾选项；一行 --- 回车变分隔线，``` 回车变代码块。
   记号+空格走 input 事件（空格已经进 DOM），不走 keydown preventDefault——
   否则 DIV 还没洗成 P、或输入法刚上屏，keydown 那一拍经常认不出来。 */
const INPUT_RULES=[
  [/^(#{1,6}) $/, m=>'h'+m[1].length],
  [/^[-*+] $/, ()=>'ul'],
  [/^\d+[.)] $/, ()=>'ol'],
  [/^> $/, ()=>'quote'],
  [/^\[[ xX]?\] $/, ()=>'task'],
];
const MARKER_ONLY=[
  [/^(#{1,6})$/, m=>'h'+m[1].length],
  [/^[-*+]$/, ()=>'ul'],
  [/^\d+[.)]$/, ()=>'ol'],
  [/^>$/, ()=>'quote'],
  [/^\[[ xX]?\]$/, ()=>'task'],
];

let COMPOSING=false;
document.addEventListener('compositionstart', ()=>{ COMPOSING=true; });
document.addEventListener('compositionend', ()=>{
  COMPOSING=false;
  const t=active();
  if(t && t.editing) requestAnimationFrame(()=>{
    syncPh(t);
    if(t.id===curTab) syncTabTitle(t);
    tryMdShortcut(t);
    maybeSlash(t);
  });
});

function tryMdShortcut(t){
  if(!t || !t.editing || COMPOSING) return false;
  const blk=curBlock(t);
  if(!blk || blk.hasAttribute('data-lock')) return false;
  if(!/^(P|DIV)$/.test(blk.tagName)) return false;
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed) return false;
  const r=s.getRangeAt(0);
  if(!blk.contains(r.startContainer) && r.startContainer!==blk) return false;
  const pre=r.cloneRange();
  pre.selectNodeContents(blk); pre.setEnd(r.endContainer, r.endOffset);
  const before=tidyTxt(pre.toString());
  for(const [re,kind] of INPUT_RULES){
    const m=before.match(re);
    if(!m) continue;
    const rest=tidyTxt(blk.textContent).slice(before.length);
    retype(t, blk, kind(m), rest);
    return true;
  }
  return false;
}

function edKey(t, e){
  if(e.isComposing || e.keyCode===229) return;
  if(slashOn()){
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); hideSlash(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); e.stopPropagation(); slashI=Math.min(SLASH.length-1, slashI+1); paintSlash(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); e.stopPropagation(); slashI=Math.max(0, slashI-1); paintSlash(); return; }
    if(e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); e.stopPropagation(); applySlash(); return; }
  }
  const blk=curBlock(t);
  const cmd=e.metaKey;

  if(cmd && !e.shiftKey && !e.altKey){
    const k=e.key.toLowerCase();
    if(k==='b'){ e.preventDefault(); wrapInline('STRONG'); t.touched=true; return; }
    if(k==='i'){ e.preventDefault(); wrapInline('EM'); t.touched=true; return; }
    if(k==='e'){ e.preventDefault(); wrapInline('CODE'); t.touched=true; return; }
  }
  if(cmd && e.shiftKey && e.key.toLowerCase()==='x'){
    e.preventDefault(); wrapInline('DEL'); t.touched=true; return;
  }
  /* ⌥⌘E 调出这一块的源码。这里必须认 e.code 不能认 e.key：
     macOS 上 Option+E 是重音符号的死键，按下去 e.key 拿到的不是 'e'，
     在客户端里实测过一次，按了没反应就是被这个坑住的。 */
  if(cmd && e.altKey && (e.code==='KeyE' || e.key.toLowerCase()==='e')){
    e.preventDefault(); if(blk) openSrcBlk(t, blk); return;
  }
  if(!blk) return;

  // Tab：表格里跳格子，列表里进退层级
  if(e.key==='Tab'){
    const cell=closestTag(getSelection().anchorNode,'TD') || closestTag(getSelection().anchorNode,'TH');
    if(cell){ e.preventDefault(); hopCell(t, cell, e.shiftKey); return; }
    const li=closestTag(getSelection().anchorNode,'LI');
    if(li){
      e.preventDefault();
      if(e.shiftKey){ if(!outdentLi(t, li)) liftLiToP(t, li); }
      else indentLi(t, li);
      return;
    }
    return;
  }

  if(e.key==='Backspace' && !cmd && !e.altKey){
    const s=getSelection();
    const li=closestTag(s && s.anchorNode,'LI');
    if(li && s && s.isCollapsed && caretAtStart(li) && !tidyTxt(li.textContent).trim() && !li.querySelector('img')){
      e.preventDefault();
      removeEmptyLi(t, li);
      return;
    }
  }

  if(e.key==='Enter'){
    if(e.metaKey || e.ctrlKey) return;
    // 代码块里回车就是换行，别把块拆了
    if(blk.tagName==='PRE'){
      e.preventDefault();
      document.execCommand('insertText', false, '\n');
      return;
    }
    // 表格格子里回车 → 格子内换行，正是 markdown 表格里 <br> 的用法
    const cell=closestTag(getSelection().anchorNode,'TD') || closestTag(getSelection().anchorNode,'TH');
    if(cell){ e.preventDefault(); document.execCommand('insertHTML', false, '<br>'); t.touched=true; return; }

    if(/^(P|DIV)$/.test(blk.tagName)){
      const txt=tidyTxt(blk.textContent).trim();
      for(const [re,kind] of MARKER_ONLY){
        const m=txt.match(re);
        if(!m) continue;
        e.preventDefault();
        retype(t, blk, kind(m), '');
        return;
      }
      if(/^(-{3,}|\*{3,}|_{3,})$/.test(txt)){
        e.preventDefault();
        const hr=retype(t, blk, 'hr', '');
        const p=document.createElement('p'); p.dataset.dirty='1';
        ensureBr(p); hr.after(p); caretEnd(p, true); return;
      }
      if(/^```/.test(txt)){
        e.preventDefault(); retype(t, blk, 'pre', ''); return;
      }
    }

    const li=closestTag(getSelection().anchorNode,'LI');
    if(li && !tidyTxt(li.textContent).trim() && !li.querySelector('img')){
      e.preventDefault();
      exitOrOutdentLi(t, li);
      return;
    }

    // 标题末尾回车 → 下面起一个正文段，而不是再来一个标题。
    // 下面已经有一个空段（新建笔记会先垫一个）就落到那一段，不再插一层。
    if(/^H[1-6]$/.test(blk.tagName)){
      const s=getSelection();
      const r=s.getRangeAt(0), tail=r.cloneRange();
      tail.selectNodeContents(blk); tail.setStart(r.endContainer, r.endOffset);
      if(!tail.toString().trim()){
        e.preventDefault();
        let p=blk.nextElementSibling;
        if(!(p && p.tagName==='P' && isBlankBlock(p))){
          p=document.createElement('p'); p.dataset.dirty='1';
          ensureBr(p);
          blk.after(p);
        }
        caretEnd(p, true); t.touched=true; return;
      }
    }
  }
}

/* 表格里 Tab 跳下一格；停在最后一格再按就补一行。
   库里一千八百多份文件带表，这条比什么都常用。 */
function hopCell(t, cell, back){
  const row=cell.parentElement, tb=row.closest('table');
  const cells=[...tb.querySelectorAll('td,th')];
  let i=cells.indexOf(cell)+(back?-1:1);
  if(i<0) return;
  if(i>=cells.length){
    if(back) return;
    const tr=document.createElement('tr');
    const n=row.children.length;
    for(let k=0;k<n;k++){
      const td=document.createElement('td');
      const ref=tb.rows[tb.rows.length-1].children[k];
      if(ref && ref.getAttribute('style')) td.setAttribute('style', ref.getAttribute('style'));
      // 空格子就留空，跟 md2html 渲染出来的一模一样（光标落进去时 ensureBr 自会补 <br>）
      tr.appendChild(td);
    }
    (tb.tBodies[0]||tb).appendChild(tr);
    t.touched=true;
    const blk=tb.closest('[data-bid]') || tb.parentElement;
    if(blk) blk.dataset.dirty='1';
    caretEnd(tr.firstElementChild, true);
    return;
  }
  caretEnd(cells[i], true);
}

/* 粘贴。**只收纯文本，按 markdown 解析后再插进去。**
   直接放行 HTML 的话，从网页和 Word 里粘来的一堆 <span style> 会灌进正文，
   反解不回 markdown。代价是从别处粘来的样式会丢，换来的是粘什么都不会把文档搞坏。 */
function onPaste(t, e){
  const dt=e.clipboardData; if(!dt) return;
  // 剪贴板里有图就先走图这一支：截图、从别处拷来的图都是这个形状。
  // items 和 files 两处都翻——Safari 截图走 items，从访达拷文件走 files。
  const img=[...(dt.files||[])].find(f=>/^image\//.test(f.type))
        || [...(dt.items||[])].filter(i=>i.kind==='file' && /^image\//.test(i.type))
             .map(i=>i.getAsFile()).find(Boolean);
  if(img){ e.preventDefault(); pasteImg(t, img); return; }
  e.preventDefault();
  const txt=(dt.getData('text/plain')||'').replace(/\r\n/g,'\n');
  if(!txt) return;
  const s=getSelection();
  // 选着字粘一条网址进来 → 直接变成链接，这是最常用的一下
  if(s && !s.isCollapsed && /^(https?:\/\/|file:\/\/)\S+$/.test(txt.trim())){
    wrapInline('A', {href:txt.trim(), 'data-u':txt.trim(), target:'_blank', rel:'noopener'});
    t.touched=true; return;
  }
  const box=document.createElement('div');
  box.innerHTML=md2html(txt, dirOf(t.path), 0);
  const one=box.children.length===1 && box.firstElementChild.tagName==='P';
  document.execCommand('insertHTML', false, one ? box.firstElementChild.innerHTML : box.innerHTML);
  t.touched=true;
}

/* 把粘进来的图写进这份 md 旁边的 _图/，再插一条跟渲染器一模一样的 <img>。
   反解那边（blkMd 的 IMG 分支）认 data-u，所以这里必须带上原始相对路径，
   不然存盘时会把解析后的完整 URL 写回 markdown。
   v17 起：全库可编辑的 md 都能贴图（服务端同一道判据再拦一次）。 */
async function pasteImg(t, file){
  if(!IS_HTTP){ flash('贴图要服务在跑'); return; }
  if(!canEditPath(t.path) || t.ext){ flash('这一份不能改'); return; }
  const p=paneOf(t), md=p && p.querySelector('.md');
  if(!md) return;
  const keep=saveSel(md);          // 上传要等一会儿，光标位置先记下来
  flash('图片上传中');
  try{
    const b64=await new Promise((ok,no)=>{
      const fr=new FileReader();
      fr.onload=()=>ok(String(fr.result).split(',')[1]||'');
      fr.onerror=()=>no(new Error('读不了这张图'));
      fr.readAsDataURL(file);
    });
    const r=await (await fetch('/__save',{method:'POST', headers:hdrs(),
      body:JSON.stringify({路径:t.path, 图片:{数据:b64}})})).json();
    if(!r.ok){ flash(r.错误||'图片没写进去'); return; }
    restoreSel(md, keep);
    const u=r.相对路径;
    document.execCommand('insertHTML', false,
      `<img src="${esc(resolveRef(u, dirOf(t.path), true))}" alt="" title="" data-u="${esc(u)}" data-fresh="1">`);
    settleImg(md);
    t.touched=true; autoKick(t);
  }catch(err){ flash('图片上传失败'); }
}

/* 刚插进去的那张图归位。

   浏览器的 insertHTML 有个脾气：光标停在段首或段末（以及正文本来就是空的）时，
   它不把 <img> 放进段落里，而是甩出来挂在正文根上。裸 <img> 不是这套编辑器认识的
   顶层块，序列化时取不到内容，会被当空块丢掉——图在屏幕上好好的，一存盘就没了。
   所以插完当场把它包回一个 <p>，再把光标放到图后面，接着打字就是图下面一段。 */
function settleImg(md){
  const im=md.querySelector('img[data-fresh]');
  if(!im) return;
  im.removeAttribute('data-fresh');
  if(im.parentElement===md){
    const p=document.createElement('p');
    im.replaceWith(p); p.appendChild(im);
  }
  let blk=im;
  while(blk.parentElement && blk.parentElement!==md) blk=blk.parentElement;
  if(blk.parentElement===md) blk.dataset.dirty='1';   // 新包的块没有 bid，盖章免得被抄旧源码
  try{
    const r=document.createRange(); r.setStartAfter(im); r.collapse(true);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}

/* ── 正文栏右上角那行淡字 ───────────────
   只报状态，不讲解怎么用：正在编辑 / 保存中 / 已保存 HH:MM / 有 N 处存不进 · 点看。 */
function syncStatusLine(){
  syncScanChip();
  const m=$('#edMsg'); if(!m) return;
  const t=active();
  paintSaveState(t);
  m.classList.remove('act');
  if(!t || !t.editing){ m.textContent=''; return; }
  if(t.pendingBad && t.pendingBad.length){
    m.textContent=`有 ${t.pendingBad.length} 处存不进 · 点看`;
    m.classList.add('act');
    return;
  }
  if(t.saving){ m.textContent='保存中'; return; }
  m.textContent = t.savedAt ? `正在编辑 · 已保存 ${t.savedAt}` : '正在编辑';
}
/* 老代码里的一句话回执沿用这个名字，路由到同一格。 */
function edSay(cls, txt){ if(txt) flash(txt); else syncStatusLine(); }
$('#edMsg').onclick=()=>{
  const t=active();
  if(t && t.editing && t.pendingBad && t.pendingBad.length) saveEdit(false);
};

/* ── 能不能改 ───────────────────────────
   全库 md 都能改，判据照抄服务端 _edit_ok：只收 .md；路径要落在库根内（相对路径，
   不许绝对、不许 ..）；任一段是 _编辑备份 / __pycache__ / .amnote 或以点开头的
   一律不可编辑。99_历史版本 和 99、归档 是可编辑的（给她开，Agent 纪律照旧）。 */
const BADSEG=/^(?:_编辑备份|__pycache__|\.amnote)$|^\./;
function canEditPath(rel){
  if(!IS_HTTP) return false;
  rel=String(rel||'');
  if(!/\.md$/i.test(rel)) return false;
  const parts=rel.split('/');
  if(!parts.length) return false;
  return parts.every(s=>s && s!=='..' && !BADSEG.test(s));
}
/* 能不能移到废纸篓。判据照抄服务端 _trash_ok，跟 canEditPath 只差认哪些后缀：
   改只认 .md，搬认 .md / .html / .htm——门户里打得开的就这三种。
   **两边改必须一起改**（portal_server.py 的 _trash_ok）。
   库外文档（t.ext）恒假：那些文件不在库根里，服务端一条都不给动。 */
function canTrashPath(rel){
  if(!IS_HTTP) return false;
  rel=String(rel||'');
  if(!/\.(md|html|htm)$/i.test(rel)) return false;
  if(rel[0]==='/') return false;
  const parts=rel.split('/');
  if(!parts.length) return false;
  return parts.every(s=>s && s!=='..' && !BADSEG.test(s));
}

/* ── 移到废纸篓 ─────────────────────────
   建错一份随手记是最常见的一次误操作，以前只能去访达删。这里给一条出口。

   **不弹确认框。** 文件进的是系统废纸篓，原样躺着；toast 上八秒内点「撤销」
   就回原位，八秒之后访达里照样捞得回来。多一道确认只是多一次点击。

   TRASHED 是「刚挪走、服务端索引还没跟上」的那几份：/__tree 是从索引里出的，
   同步跑完之前会照样把它们列出来，卡片会「消失一下又冒回来」。先在 setTree
   里挡一道，等索引真的不列它了（或者撤销了）再解除。
   记的是挪走的时刻：同步万一没跑到（服务重启、索引坏了），挡了 30 秒就无条件
   放行——挡下去等于一份存在的笔记从库里凭空消失，比闪一下糟得多。 */
const TRASHED=new Map();          // 相对路径 → 挪走的时刻
const TRASH_HIDE_MS=30000;
let trashBusy=false;

function forgetPath(rel){
  ST.recents=(Array.isArray(ST.recents)?ST.recents:[]).filter(x=>x && x.路径!==rel);
  ST.pins=(Array.isArray(ST.pins)?ST.pins:[]).filter(p=>p!==rel);
  if(ST.lastPath===rel) ST.lastPath=ST.recents.length ? ST.recents[0].路径 : '';
  saveST();
}

async function trashDoc(rel){
  rel=String(rel||'');
  if(!rel || !IS_HTTP) return false;
  if(!canTrashPath(rel)){ flash('这一份不能删'); return false; }
  if(trashBusy) return false;
  trashBusy=true;
  const mine=TABS.filter(t=>!t.ext && t.path===rel);
  try{
    /* **等 /__trash 回来了再收编辑态。** 收在前面的话，服务端一说不行，
       屏幕上还是用户刚敲的字，t.work 却已经丢了、dirty 也假了、停笔自动保存
       也停了——下一次导航按 t.raw 重画，那几个字就永久没了。
       等响应这段用 t.trashing 顶住：autoKick / flushSave / saveEdit /
       saveBeforeLeave 第一行都在判它，不会有哪一存赶在文件挪走前后发出去。 */
    for(const t of mine){
      // 自动保存正好在飞：等它落地再动文件，不然那一存会赶在挪走之后，把文件又写出来
      for(let i=0;i<60 && t.saving;i++) await new Promise(r=>setTimeout(r, 50));
      t.trashing=true;
      clearTimeout(t.autoT); t.autoT=null;
    }
    let r=null;
    try{
      r=await (await fetch('/__trash',{method:'POST', headers:hdrs(),
        body:JSON.stringify({路径:rel})})).json();
    }catch(e){ flash('服务没应答'); return false; }
    if(!r || !r.ok){ flash((r&&r.错误)||'删不掉'); return false; }
    /* 文件这会儿才真的挪走了，收编辑态才安全。收完 t.editing 就是假，
       flushAll / flushSave / saveBeforeLeave / saveEdit 四个入口第一行都在判它，
       pagehide 和 visibilitychange 那两条也走 flushAll——所以挪走之后
       不会再有任何一条 /__save 把这份文件写回来。 */
    for(const t of mine){
      clearTimeout(t.autoT); t.autoT=null;
      if(t.editing) endEdit(t);              // 里面把 editing/work/touched/pendingBad 一起清了
      t.again=false; t.conflict=null;
    }
    TRASHED.set(rel, Date.now());
    forgetPath(rel);
    /* solo 窗里就这一份，关掉标签只剩一块白板。窗口本来就是 window.open 开的，
       关掉它才是这一步的收尾；关不掉（浏览器里直开的那种）就留着字，报一句。 */
    if(SOLO){
      notify('已移到废纸篓，可以关掉这个窗口', {ms:8000});
      try{ window.close(); }catch(e){}
      return true;
    }
    // 关掉所有开着它的标签。**不进 CLOSED**：⌘⇧T 恢复出来的会是一个开不了的标签
    for(const t of mine) await closeTab(t.id, {forget:true});
    refreshTree();
    notify('已移到废纸篓', {ms:8000, action:{label:'撤销', fn:()=>untrashDoc(rel)}});
    return true;
  }finally{
    trashBusy=false;
    // 没删成就把顶住的那道撤了，字还在编辑区里，停笔照样自动保存
    mine.forEach(t=>{ if(t.trashing){ t.trashing=false; if(t.editing && dirty(t)) autoKick(t); } });
  }
}

async function untrashDoc(rel){
  rel=String(rel||'');
  if(!rel || !IS_HTTP) return;
  let r=null;
  try{
    r=await (await fetch('/__untrash',{method:'POST', headers:hdrs(),
      body:JSON.stringify({路径:rel})})).json();
  }catch(e){ flash('服务没应答'); return; }
  if(!r || !r.ok){ flash((r&&r.错误)||'放不回去'); return; }
  TRASHED.delete(rel);
  notify('已放回');
  await refreshTree();
  openByPath(rel);
}

/* 挪完文件重取一次树。服务端那趟同步是后台跑的，第一次取回来可能还是旧的，
   隔七百毫秒再取一次；再不成也有 /__pulse 那条三秒一次的兜底。 */
async function refreshTree(){
  await loadTree();
  setTimeout(loadTree, 700);
}

function syncBar(){
  syncStatusLine();
  drawDocBar(active());
  syncNative();
  syncTabDirty();
}

/* 把「开着哪一份、改了没有」告诉壳。壳据此设窗口标题、代理图标、
   关闭按钮里的脏点。 */
let lastNat='';
function syncNative(){
  const t=active();
  const d=!!dirty(t);
  const sig=(t?t.path:'')+'|'+d;
  if(sig===lastNat) return;
  lastNat=sig;
  const file=hasDocNow(t);
  post({type:'doc', title:t?(t.title||''):null,
        path: file ? ((t&&!t.ext)?(LIBROOT+'/'+t.path):t.path) : null});
  post({type:'dirty', on:d});
  post({type:'canedit', on:!!file && !t.ext && kindOfTab(t)==='md' && canEditPath(t.path)});
}

/* ── 进／出编辑态 ───────────────────────
   opt.block / opt.at：双击进来的那一下，光标要落回双击的位置。 */
async function startEdit(opt){
  opt=opt||{};
  const t=active();
  if(!t || t.ext || !canEditPath(t.path) || t.editing) return;
  const p=paneOf(t);
  try{
    const r=await (await fetch('/__raw?path='+encodeURIComponent(t.path),
                               {cache:'no-store'})).json();
    if(!r.ok){ tell('进不了编辑', r.错误||'读不到源码'); return; }
    t.raw=r.正文; t.rawAt=r.改于;
  }catch(e){ tell('进不了编辑','服务没应答'); return; }
  // ⌘E 走「鼠标停在第几块」；双击走双击的那一块
  const md0=p.querySelector('.md');
  undecorateHistory(md0);
  const kids0=[...md0.children];
  const hi = (opt.block!==undefined && opt.block>=0) ? opt.block
           : (t.hover && t.hover.isConnected ? kids0.indexOf(t.hover) : -1);
  p.querySelector('.ed').value=t.raw;
  t.work=t.raw;
  t.editing=true; t.touched=false; t.pendingBad=null; t.savedAt=null;
  p.classList.add('edit'); p.classList.remove('src','fresh');
  paintWork(t); prepEdit(t); buildToc(); buildFmtBar();
  if(opt.fresh){
    const md=p.querySelector('.md');
    const h1=[...md.children].find(el=>el.tagName==='H1' && !el.hasAttribute('data-lock'));
    unwatch(t);
    if(![...md.children].some(el=>el.tagName==='P' && !el.dataset.chrome)){
      const np=document.createElement('p');
      ensureBr(np);
      const meta=md.querySelector('.doc-meta');
      if(meta) meta.after(np);
      else if(h1) h1.after(np);
      else md.appendChild(np);
    }
    t.touched=false;
    watchEdits(t);
    p.classList.add('fresh');
    md.focus();
    if(h1) caretSelect(h1); else ensureCaret(t);
    syncPh(t);
    syncTabTitle(t);
  }else{
    const kids=[...p.querySelector('.md').children];
    const tgt = hi>=0 ? kids[hi] : null;
    if(tgt && !tgt.hasAttribute('data-lock')){
      if(opt.at!==undefined) caretAtOffset(tgt, opt.at); else caretEnd(tgt);
    }
    // v27 的病根：进了编辑态但选区不在 #doc 里，键盘敲进去没有插入点。
    // 这里判一次，不成立就 focus 正文、把光标放到第一个可编辑块末尾。
    ensureCaret(t);
  }
  syncBar();
}

function endEdit(t){
  const p=paneOf(t); if(!p) return;
  clearTimeout(t.autoT); t.autoT=null;
  unwatch(t); hideFmt();
  const md=p.querySelector('.md');
  md.removeAttribute('contenteditable');
  [...md.children].forEach(el=>{
    if(el.nodeType!==1) return;
    el.removeAttribute('contenteditable');
    ['bid','dirty'].forEach(k=>delete el.dataset[k]);
    el.removeAttribute('data-lock');
  });
  p.classList.remove('edit','src','fresh');
  t.editing=false; t.work=undefined; t.reg=null; t.touched=false;
  t.pendingBad=null;
  bnr('conflict', false);
  syncBar();
}

function cancelEdit(){
  const t=active(); if(!t||!t.editing) return;
  if(dirty(t) && !ask('要放弃这次修改吗？','改过的内容会回到打开时的样子。','放弃修改','取消',true)) return;
  endEdit(t); paintWork(t); buildToc(); syncProg();
}

/* 富文本 ↔ 整篇源码。开头的标签块不参与渲染，要改它只能来源码这边。 */
function toggleSrc(){
  const t=active(); if(!t||!t.editing) return;
  const p=paneOf(t), ta=p.querySelector('.ed');
  if(p.classList.contains('src')){
    t.work=ta.value.replace(/\r\n/g,'\n');
    p.classList.remove('src');
    paintWork(t); prepEdit(t); buildToc();
    ensureCaret(t);
  }else{
    hideFmt();
    t.work=serializeBody(t);                       // 正文里改的先落到工作副本
    unwatch(t);
    ta.value=t.work;
    p.classList.add('src');
    growEd(ta);
    ta.focus(); ta.setSelectionRange(0,0); p.scrollTop=0;
  }
  applyPref(); syncBar();
}

/* ── 自动保存 ───────────────────────────
   停笔 2 秒落盘；切文档、关标签、关窗口、页面隐藏时强制落盘；⌘S 照常手动即存。 */
const AUTOSAVE_MS = 2000;
function autoKick(t){
  if(!t || !t.editing || t.trashing) return;   // trashing：/__trash 正在飞，这一刻一个字都不许写回去
  t.pendingBad=null;
  // 打字这条路径也要把脏标志推给壳，不然关闭按钮里的脏点要等到别处
  // 调 syncBar 才出现。syncNative 自带 lastNat 去重，敲一个字不会刷屏。
  if(t.id===curTab){ syncStatusLine(); syncNative(); }
  syncTabDirty();
  clearTimeout(t.autoT);
  t.autoT=setTimeout(()=>{ t.autoT=null; saveEdit(false, {tab:t, auto:true}); }, AUTOSAVE_MS);
}
function flushSave(t){
  if(!t || !t.editing || t.trashing) return;   // 同 autoKick
  clearTimeout(t.autoT); t.autoT=null;
  if(!dirty(t)) return;
  saveEdit(false, {tab:t, auto:true, keepalive:true});
}
function flushAll(){ TABS.forEach(t=>{ if(t.editing) flushSave(t); }); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAll(); });
addEventListener('pagehide', flushAll);
addEventListener('beforeunload', e=>{
  flushAll();
  if(TABS.some(dirty)){ e.preventDefault(); e.returnValue=''; }
});

const hhmm = () => { const d=new Date(), z=n=>String(n).padStart(2,'0');
  return z(d.getHours())+':'+z(d.getMinutes()); };

/* 存盘。自动保存这条路上不弹窗打断：
   冲突（别人改过）→ 顶部横幅两个动作；自检报「会变样」→ 状态字变「有 N 处存不进 · 点看」。
   手动 ⌘S 保持原来的对话框行为。
   返回值：真＝这次改动确实落到文件里了（或本来就跟文件一样）；假＝没落盘，
   改动还在编辑区里。「完成」按这个决定要不要回阅读态，别的调用点可以不看。 */
async function saveEdit(force, opt){
  opt=opt||{};
  const t=opt.tab||active();
  if(!t || !t.editing || t.trashing) return false;   // 同 autoKick
  if(t.saving){ t.again=true; return false; }
  const p=paneOf(t); if(!p) return false;
  const auto=!!opt.auto;

  let body;
  if(p.classList.contains('src')){
    body=p.querySelector('.ed').value.replace(/\r\n/g,'\n');
  }else{
    undecorateHistory(p.querySelector('.md'));
    const bad=force?[]:verifyDirty(t);
    if(bad.length){
      if(auto){ t.pendingBad=bad; if(t.id===curTab) syncStatusLine(); return false; }
      if(!ask(
        `有 ${bad.length} 块存下去会变样，仍然保存吗？`,
        '多半是打了 markdown 会认的记号，比如表格格子里的竖线、落单的星号：\n\n'
        + bad.slice(0,6).map(x=>'· '+x).join('\n')
        + (bad.length>6?`\n…还有 ${bad.length-6} 块`:''),
        '仍然保存','取消',true)){ t.pendingBad=bad; syncStatusLine(); return false; }
    }
    t.pendingBad=null;
    body=serializeBody(t);
  }
  if(body===t.raw){ t.touched=false; if(t.id===curTab) syncStatusLine(); return true; }

  t.saving=true; if(t.id===curTab) syncStatusLine();
  const payload={路径:t.path, 正文:body, 基于:t.rawAt, 强制:!!force};
  // keepalive 这条路上响应可能到不了，不改名——下次正常保存再跟标题对齐。
  if(!opt.keepalive){
    const dest=suggestRename(t.path, firstHeading(body));
    if(dest) payload.新路径=dest;
  }
  const req={method:'POST', headers:hdrs(),
             body:JSON.stringify(payload)};
  if(opt.keepalive) req.keepalive=true;
  let r=null;
  try{ r=await (await fetch('/__save', req)).json(); }
  catch(e){ t.saving=false; if(t.id===curTab) flash('服务没应答'); return false; }
  t.saving=false;

  if(!r.ok){
    if(r.需确认){
      t.conflict=body;
      if(auto){ showConflict(t, r.错误||''); return false; }
      if(ask('这份在外部被改过了，仍然保存吗？',
             (r.错误||'')+'\n外部那一版会被你这一版覆盖，覆盖前会先留档。',
             '仍然保存','取消',true)) return saveEdit(true, {tab:t});
      // 手动这条路上按了「取消」＝不存了，冲突就此揭过，别让 pill 和「完成」一直卡着
      t.conflict=null;
      if(t.id===curTab) syncStatusLine();
      return false;
    }
    if(t.id===curTab) flash(r.错误||'写失败');
    return false;
  }
  t.raw=body; t.touched=false; t.conflict=null;
  bnr('conflict', false);
  t.savedAt=hhmm(); t.lastArchive=r.留档||'';
  if(r.路径 && r.路径!==t.path) applyRenamedPath(t, r.路径);
  else if(t.id===curTab) syncTabTitle(t);
  // 留档只在手动 ⌘S 之后报一句；自动保存不吭声，状态字里只有「已保存 HH:MM」
  if(!auto && r.留档 && t.id===curTab){
    flash('已保存 · 留档 '+r.留档);
  }
  // 存完文件的 mtime 变了，下一次的「基于」得跟着换，不然会被当成外部改动
  if(r.改于) t.rawAt=r.改于; else await refreshRawAt(t);
  drawDocMeta(t);
  if(t.id===curTab){ syncStatusLine(); syncNative(); }
  if(t.again){ t.again=false; autoKick(t); }
  return true;
}

async function refreshRawAt(t){
  try{
    const r=await (await fetch('/__meta?path='+encodeURIComponent(t.path),
                               {cache:'no-store'})).json();
    if(r && r.ok && r.改于) t.rawAt=r.改于;
  }catch(e){}
}

/* 冲突横幅：保留我的（强制覆盖，服务端覆盖前先留档）／ 改用对方的（丢掉这次改动） */
let conflictTab=null;
function showConflict(t, why){
  conflictTab=t;
  $('#conflictT').textContent = why || '这份在外部被改过了';
  bnr('conflict', true);
  if(t.id===curTab) syncStatusLine();
}
$('#keepMine').onclick=()=>{
  const t=conflictTab; bnr('conflict', false); conflictTab=null;
  if(t && t.editing) saveEdit(true, {tab:t});
};
$('#takeTheirs').onclick=async()=>{
  const t=conflictTab; bnr('conflict', false); conflictTab=null;
  if(!t) return;
  try{
    const r=await (await fetch('/__raw?path='+encodeURIComponent(t.path),
                               {cache:'no-store'})).json();
    if(!r.ok){ flash(r.错误||'读不到源码'); return; }
    t.raw=r.正文; t.rawAt=r.改于; t.work=r.正文; t.touched=false; t.conflict=null;
    paintWork(t); prepEdit(t); buildToc(); ensureCaret(t);
    if(t.id===curTab) syncStatusLine();
  }catch(e){ flash('服务没应答'); }
};

/* 探针：D 路在沙箱里验「双击之后光标在正文」用的就是这个。 */
window.__amnProbe = {
  caretInDoc,
  editing(){ const t=active(); return !!(t&&t.editing); },
  lists(){ return false; },      /* 列表栏 5.4.1 下线，恒假 */
  histDecorated(){ return !!document.querySelector('.histbox[data-hist-deco]'); },
  histResidue(){
    // 拆干净了没有：正文里不该再剩任何包装痕迹
    const md=$('#doc')||document.querySelector('#panes .pane.on .md');
    if(!md) return 'no-doc';
    return md.querySelectorAll('.histbox,.histpill,[data-hist-deco]').length;
  },
  autoT(){ const t=active(); return !!(t&&t.autoT); },
  savedAt(){ const t=active(); return t?t.savedAt||null:null; },
  serialize(){ const t=active(); return (t&&t.editing)?serializeBody(t):null; },
  composing(){ return !!COMPOSING; },
  curTag(){ const t=active(); const b=t&&curBlock(t); return b?b.tagName:null; },
  mdHtml(){ const md=$('#doc')||document.querySelector('#panes .pane.on .md'); return md?md.innerHTML:null; }
};

/* 存盘前对改过的块再自检一次：反解出来的 markdown 重新渲染，必须还是屏幕上那个样子。
   对不上说明打的字里带了 markdown 会认的记号（在表格格子里打了竖线、
   写了个落单的星号），存下去和看到的不是一回事，先拦一次。 */
function verifyDirty(t){
  const md=paneOf(t).querySelector('.md'), base=dirOf(t.path), bad=[];
  [...md.children].forEach(el=>{
    if(el.nodeType!==1 || !el.dataset.dirty || el.hasAttribute('data-lock')) return;
    const s=blkMd(el); if(!s.trim()) return;
    const box=document.createElement('div');
    box.innerHTML=md2html(s, base, 0);
    if(box.children.length!==1 || normHtml(box.innerHTML)!==normHtml(el.outerHTML))
      bad.push((el.textContent||'').replace(/\s+/g,' ').trim().slice(0,26));
  });
  return bad;
}

/* ── 数据 ───────────────────────────────
   只有一份：`/__tree`，服务从全文索引里现给。库里全部 md 和 html，每条有
   路径、标题、类型、改动时间、预览。 */
let items=[];
let TREE=null;
let fDir=null, fSub=null;       // 选中的大类文件夹 ／ 它下面的子文件夹
let fNotes=false;               // 随手记那一屏
let fRecent=true;               // 首页＝最近改动
let fKind='all';                // 最近／搜索：全部 ／ 只 md ／ 只 html
let kw='';
let PAGE=80;                    // 往下滚动续加，不加按钮

const stripNo = s => String(s||'').replace(/^\d{1,2}[、_.．]\s*/,'');

/* 文件夹＝路径的前两段。再往下不切——库里的专项就住在第二层。 */
function prepItems(){
  items.forEach(i=>{
    const seg=(i.路径||'').split('/');
    i._d0 = seg.length>1 ? seg[0] : '';
    i._d1 = seg.length>2 ? seg[1] : '';
  });
}

const ymd = t => { const d=new Date((t||0)*1000), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };

/* 「多久之前」只有这一把梯子：刚刚 → N 分钟前 → 今天 09:12 → 昨天 16:40
   → 9月3日 → 2025年12月1日。卡片、最近列表、继续阅读大卡都走它。 */
function fmtWhen(sec){
  const ms=(sec||0)*1000;
  if(!ms) return '';
  const d=new Date(ms), z=n=>String(n).padStart(2,'0');
  const gap=Date.now()-ms;
  if(gap>=0 && gap<60e3) return '刚刚';
  if(gap>=0 && gap<3600e3) return Math.floor(gap/60e3)+' 分钟前';
  const hm=z(d.getHours())+':'+z(d.getMinutes());
  const b=dayBucket(sec);
  if(b!=='更早') return b+' '+hm;
  if(d.getFullYear()===new Date().getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日';
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
/* 时间怎么写：窄栏（wide）走上面那把梯子，列表栏挤，只写时刻。 */
function whenLabel(sec, wide){
  if(wide) return fmtWhen(sec);
  const ms=(sec||0)*1000, d=new Date(ms), z=n=>String(n).padStart(2,'0');
  const b=dayBucket(sec);
  return b==='更早' ? (d.getMonth()+1)+'月'+d.getDate()+'日'
                    : z(d.getHours())+':'+z(d.getMinutes());
}

function setTree(t){
  if(!t || !t.ok) return;
  TREE=t;
  let docs=t.文档||[];
  /* 刚挪进废纸篓的那几份：索引跟上之前先当它们不在。索引真的不列了就解除，
     免得这张表越攒越长（撤销那条路上 untrashDoc 自己会删）。
     再加一道时间上限：挡了 30 秒还在树上，就当同步这条路断了，无条件放行——
     一直挡着等于一份还在的笔记从库里凭空消失，比闪一下糟得多。 */
  if(TRASHED.size){
    const have=new Set(docs.map(d=>d.路径)), now=Date.now();
    TRASHED.forEach((ts, p)=>{
      if(!have.has(p) || now-ts>TRASH_HIDE_MS) TRASHED.delete(p);
    });
    if(TRASHED.size) docs=docs.filter(d=>!TRASHED.has(d.路径));
  }
  items=docs.map(d=>({
    路径:d.路径, 标题:d.标题||'', 类型:d.类型||'md',
    修改时间:d.改于||0, 日期:ymd(d.改于), 预览:d.预览||''}));
  prepItems(); syncNotePv(); prunePins();
  buildNav(); render();
  syncScanChip();
  TABS.forEach(t=>{
    const k=kindOfTab(t);
    if(isPageKind(k)) paintPage(t);
  });
}

async function loadTree(){
  if(!IS_HTTP) return;
  try{ setTree(await (await fetch('/__tree',{cache:'no-store'})).json()); }
  catch(e){ /* 服务没起：列表是空的，状态点会变灰 */ }
}

/* 类型筛：全部 / Markdown / HTML。只在浏览列表时生效；搜索始终覆盖 md 和 html。
   html 点开在标签里用沙箱 iframe 读。 */
function kindOf(i){
  if(i && (i.类型==='html' || i.类型==='md')) return i.类型;
  if(i && /\.html?$/i.test(i.路径||i.path||'')) return 'html';
  return (i && i.类型) || 'md';
}
function kindOk(i){
  const k=kindOf(i);
  if(fKind==='md') return k==='md';
  if(fKind==='html') return k==='html';
  return k==='md' || k==='html';
}
function passes(i){
  if(fNotes) return String(i.路径||'').startsWith(NOTE_DIR+'/');
  if(!kindOk(i)) return false;
  if(String(i.路径||'').startsWith(NOTE_DIR+'/') && !fDir) return false;  // 随手记有自己那一格
  if(fDir===null) return true;                                           // 最近：md 和 html 都进
  if(i._d0!==fDir) return false;
  if(fSub && i._d1!==fSub) return false;
  return true;
}

function saveFilters(){
  ST.f={dir:fDir, sub:fSub, recent:fRecent, notes:fNotes, kind:fKind};
  saveST();
}
function loadFilters(){
  const f=ST.f; if(!f) return;
  fDir=f.dir??null; fSub=f.sub??null;
  fRecent=f.recent===undefined?true:!!f.recent;
  fNotes=!!f.notes;
  /* 类型筛的那排按钮跟列表栏一起下线了，老档案里存的 kind 不再沿用。 */
}

/* ── 边栏：随手记 ｜ 最近 ｜ 文件夹 ｜ 设置 ──
   文件夹图标一律中性灰，18 色调色板撤了。 */
let navSig='';
function buildNav(){
  const nn=$('#navNotes'); if(nn) nn.classList.toggle('on', fNotes);
  const nr=$('#navRecent'); if(nr) nr.classList.toggle('on', fRecent && !fNotes && fDir===null && !kw);
  const cn=$('#ctNotes'); if(cn) cn.textContent=(TREE&&TREE.随手记||[]).length||'';
  const ct=$('#ctRecent'); if(ct)
    ct.textContent=items.filter(i=>(i.修改时间||0)*1000 > Date.now()-7*864e5).length || '';

  const dirs=(TREE && TREE.目录)
    ? TREE.目录.map(d=>({名称:d.名称, 份数:d.份数, 子目录:d.子目录||[]})) : [];
  const sig=[fDir,fSub,!!kw,dirs.length,dirs.map(d=>d.名称+':'+d.份数).join('|')].join('~');
  if(sig===navSig) return;
  navSig=sig;

  $('#dirList').innerHTML = dirs.map(d=>{
    const open = fDir===d.名称;
    const subs=(d.子目录||[]).filter(s=>s.份数>0);
    return `<button class="nav sub${open&&!fSub&&!kw?' on':''}" data-d="${esc(d.名称)}" title="${esc(d.名称)}">`
      + `<i data-ic="folder"></i>`
      + `<span class="lbl">${esc(stripNo(d.名称))}</span>`
      + `<span class="n">${d.份数||''}</span></button>`
      + (open ? subs.map(s=>
          `<button class="nav sub deep${fSub===s.名称&&!kw?' on':''}" data-d="${esc(d.名称)}" data-s="${esc(s.名称)}" title="${esc(s.名称)}">`
          + `<span class="lbl">${esc(stripNo(s.名称))}</span>`
          + `<span class="n">${s.份数}</span></button>`).join('') : '');
  }).join('');

  paintIcons($('#dirList'));
  $$('#dirList [data-d]').forEach(b=>{
    b.onclick=()=>gotoDir(b.dataset.d, b.dataset.s||null);
    b.oncontextmenu=e=>popMenu(e,[{id:'reveal', label:'在访达中显示'}],
      id=>{ if(id==='reveal') revealPath(b.dataset.s ? b.dataset.d+'/'+b.dataset.s : b.dataset.d); });
  });
}

/* 进文件夹＝退出搜索。搜索是全库的，跟文件夹叠不到一起。 */
function gotoDir(name, sub){
  setKw('');
  if(fDir===name && !sub && !fSub){ fDir=null; }          // 再点一次＝收起来
  else fDir=name;
  fSub=sub||null; fRecent=false; fNotes=false; PAGE=80;
  buildNav(); render();
}

function goHome(notes){
  setKw('');
  fDir=null; fSub=null; fNotes=!!notes; fRecent=!notes; PAGE=80;
  buildNav(); render();
}
function openNotesFolder(){
  navigate(makeEntry('folder', {folder:NOTE_DIR, title:NOTE_DIR, path:NOTE_DIR+'/'}));
}

/* ── 搜索 ───────────────────────────────
   搜索一律走全库：只要搜索框里有字，文件夹就不参与。 */
const terms = () => kw.toLowerCase().split(/\s+/).filter(Boolean);
const hayOf = i => (String(i.标题||'')+' '+String(i.路径||'')+' '+String(i.预览||'')).toLowerCase();

/* 标题和路径的匹配在本地立刻出；正文命中问服务的全文索引（/__search），防抖 250ms。 */
let FT={q:'', map:new Map(), 状态:'', 总:0, timer:null};
function ftKick(){
  if(!LIVE) return;
  const q=kw;
  if(q===FT.q) return;
  clearTimeout(FT.timer);
  if(!q){ FT={q:'', map:new Map(), 状态:'', 总:0, timer:null}; return; }
  FT.timer=setTimeout(async()=>{
    try{
      const r=await (await fetch('/__search?q='+encodeURIComponent(q)+'&n=200',
                                 {cache:'no-store'})).json();
      if(kw!==q) return;                       // 打字比请求快，过期的丢掉
      FT.q=q;
      FT.map=new Map((r.结果||[]).map(h=>[h.路径,h]));
      FT.状态=(r.状态||{}).状态||'';
      FT.总=r.总命中||0;
      render();
    }catch(e){}
  }, 250);
}

function hit(i){
  const ts=terms();
  if(!ts.length) return passes(i);
  // 搜索覆盖 md 和 html，不管类型筛。类型筛只在浏览列表时生效。
  const k=kindOf(i);
  if(k!=='md' && k!=='html') return false;
  return ts.every(t=>hayOf(i).includes(t)) || (FT.q===kw && FT.map.has(i.路径));
}
function docsMatching(q){
  q=String(q||'').trim();
  const ts=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!ts.length) return [];
  const seen=new Set(), out=[];
  const useFt=FT.q===q;
  const take=i=>{
    const p=i && i.路径; if(!p || seen.has(p)) return;
    const k=kindOf(i);
    if(k!=='md' && k!=='html') return;
    seen.add(p); out.push(i);
  };
  items.forEach(i=>{
    if(ts.every(x=>hayOf(i).includes(x)) || (useFt && FT.map.has(i.路径))) take(i);
  });
  if(useFt){
    FT.map.forEach((h,p)=>{
      if(seen.has(p)) return;
      if(h.类型==='md' || h.类型==='html')
        take({路径:p, 标题:h.标题||p.split('/').pop(), 类型:h.类型, 预览:''});
    });
  }
  return out.sort((a,b)=>score(b,ts)-score(a,ts));
}

/* 相关度：文件名全中最重（跟服务端第一档同一个判据），标题次之，正文命中加一点。 */
function score(i, ts){
  const t=(i.标题||'').toLowerCase(), p=(i.路径||'').toLowerCase();
  const name=p.split('/').pop();
  const fb0=FT.map.get(i.路径);
  let s=0;
  if((fb0 && fb0.档===1) || ts.every(x=>name.includes(x))) s+=400;
  ts.forEach(x=>{
    if(t===x) s+=200; else if(t.startsWith(x)) s+=120; else if(t.includes(x)) s+=80;
    if(p.includes(x)) s+=8;
  });
  const fb=FT.map.get(i.路径);
  if(fb) s+= 6 + Math.min(24, fb.命中数||0);
  return s;
}

/* 正文摘录。全文索引连标签块一起收了，命中经常落在文件头的 YAML 上，
   摘出来全是字段名，这类片段直接丢掉。
   文件名档（服务端 档=1）的「片段」是空数组：这时不出摘录行，路径那一行兜底，
   别渲染一个空框出来。 */
const FMKEYS=/(标题:|状态:|层级:|日期:|主题:|版本:|关键词:|阅读版:|回答什么:|底稿:)/g;
function isFrontMatter(f){
  const s=(f.前||'')+(f.中||'')+(f.后||'');
  if(/^\s*---/.test(s)) return true;
  return (s.match(FMKEYS)||[]).length>=2;
}
function snipOf(i, ts){
  if(!ts || !ts.length) return '';
  const fb=FT.map.get(i.路径);
  if(!fb || !(fb.片段||[]).length) return '';
  const frag=(fb.片段||[]).filter(f=>!isFrontMatter(f))[0];
  if(!frag) return '';
  return esc(frag.前||'')+'<span class="hit">'+esc(frag.中||'')+'</span>'+esc(frag.后||'');
}

/* 命中的词标出来：加粗＋强调色下划线，不铺底色（金黄命中色 v17 退役）。 */
function hl(s, ts){
  s=String(s==null?'':s);
  if(!ts||!ts.length) return esc(s);
  const low=s.toLowerCase(), spans=[];
  ts.forEach(t=>{
    if(!t) return;
    let i=low.indexOf(t);
    while(i!==-1){ spans.push([i,i+t.length]); i=low.indexOf(t,i+t.length); }
  });
  if(!spans.length) return esc(s);
  spans.sort((a,b)=>a[0]-b[0]);
  const m=[];
  spans.forEach(x=>{
    const last=m[m.length-1];
    if(last && x[0]<=last[1]) last[1]=Math.max(last[1],x[1]);
    else m.push(x.slice());
  });
  let out='', p=0;
  m.forEach(([a,b])=>{ out+=esc(s.slice(p,a))+'<span class="hit">'+esc(s.slice(a,b))+'</span>'; p=b; });
  return out+esc(s.slice(p));
}

/* 标题末尾那个八位日期是文件名的尾巴（命名规矩是 名称_vN_YYYYMMDD），
   日期已经在右边单列了一格，剪掉不写两遍。 */
const TAILDATE=/[ _\-·]*20\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])$/;
const TAILZHDATE=/\s+\d{1,2}月\d{1,2}日$/;
function cleanTitle(i){
  const s=String(i.标题||'');
  return s.replace(TAILDATE,'').replace(TAILZHDATE,'').trim() || s;
}

/* 「今天 ／ 昨天 ／ 更早」。找刚写完的那份，问的是「多久之前」。 */
function dayBucket(t){
  const d=new Date(); d.setHours(0,0,0,0);
  const ms=(t||0)*1000;
  if(ms>=d.getTime()) return '今天';
  if(ms>=d.getTime()-864e5) return '昨天';
  return '更早';
}

/* 行上的次要动作三颗：拷贝路径 / 访达 / 浏览器打开（html 才有），hover 才出。 */
const acts = (i, idx) =>
  `<span class="racts">`
  + ((i.类型||'md')==='html'
      ? `<button class="iba" data-ext="${idx}" title="在浏览器里打开">${icon('globe',15)}</button>` : '')
  + `<button class="iba" data-clip="${idx}" title="拷贝路径">${icon('copy',15)}</button>`
  + `<button class="iba" data-rev="${idx}" title="在访达中显示">${icon('folder',15)}</button>`
  + `</span>`;

/* 一行。普通行和搜索结果两种形状，走同一套选中、拖动、右键。 */
function excerptOf(i){
  const fromNote=NOTEPV.get(i && i.路径);
  if(fromNote) return String(fromNote).replace(/\s+/g,' ').trim();
  if(kindOf(i)==='html' && i && i.预览) return String(i.预览).replace(/\s+/g,' ').trim();
  const p=String((i&&i.路径)||'');
  return p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
}

function rowHtml(i, idx, ts, seq, kind){
  const base=`role="option" data-idx="${idx}" data-seq="${seq}" draggable="true" aria-selected="false"`;
  const tag = kindOf(i)==='html' ? `<span class="kindtag">HTML</span>` : '';
  if(kind==='res'){
    const x=snipOf(i,ts);
    return `<div class="res" ${base}>`
      + `<div class="rt"><span class="t">${hl(cleanTitle(i),ts)}</span>${tag}</div>`
      + `<div class="rp">${esc(i.路径)}</div>`
      + (x?`<div class="rx">${x}</div>`:'')
      + acts(i, idx)
      + `</div>`;
  }
  const ex=excerptOf(i);
  return `<div class="lrow" ${base}>`
    + `<span class="top"><span class="t">${esc(cleanTitle(i))}</span>${tag}`
    + acts(i, idx)
    + `<span class="m num">${esc(whenLabel(i.修改时间, false))}</span></span>`
    + (ex?`<span class="ex">${esc(ex)}</span>`:'')
    + `</div>`;
}

let hits=[];        // 当前搜索结果，Enter 开第一条要用
let listNow=[];     // 当前屏上按显示顺序排好的条目，键盘上下键走的就是它
let selSeq=-1;
let selSet=new Set();
const NOTEPV=new Map();

const byRecent=(a,b)=>(b.修改时间||0)-(a.修改时间||0);

function render(){
  const ts=terms(), searching=ts.length>0;
  document.body.classList.toggle('searching', searching);
  if(searching) ftKick();
  buildNav();
  const kind = searching ? 'res' : 'lrow';
  const glab = 'lgroup';

  const list=items.filter(hit);
  hits = searching ? list : [];
  listNow=[]; selSet.clear();

  if(!list.length){
    const empty = (searching || fNotes) ? '' : (fKind==='html' ? '没有 HTML 文件' : fKind==='md' ? '没有 Markdown 文件' : '');
    $('#out').innerHTML = empty ? `<div class="kindempty">${empty}</div>` : '';
    selSeq=-1; saveFilters(); pushState(); return;
  }

  const cell=(i,tt)=>{ listNow.push(i); const seq=listNow.length-1;
    return rowHtml(i, items.indexOf(i), tt, seq, kind); };
  const sec=(title,arr,attr)=>
    `<div class="${glab}"${attr||''}>${esc(title)}</div>` + arr.map(i=>cell(i)).join('');

  let h='';
  if(searching){
    list.sort((a,b)=> score(b,ts)-score(a,ts) || (b.修改时间||0)-(a.修改时间||0));
    hits=list;
    h=list.slice(0,PAGE).map(i=>cell(i,ts)).join('');
  }else if(fNotes || fSub){
    h=list.slice().sort(byRecent).slice(0,PAGE).map(i=>cell(i)).join('');
  }else if(fDir===null){
    /* 三栏里的最近仍按今天／昨天／更早分组，信息结构不变。 */
    const arr=list.slice().sort(byRecent).slice(0,PAGE);
    const rest = arr;
    const g={今天:[], 昨天:[], 更早:[]};
    rest.forEach(i=>g[dayBucket(i.修改时间)].push(i));
    ['今天','昨天','更早'].forEach(k=>{ if(g[k].length) h+=sec(k, g[k]); });
  }else{
    // 在大类里：按子文件夹分组，直接摊在大类根下的排最前
    const g=new Map(); const root=[];
    list.slice().sort(byRecent).forEach(i=>{
      if(!i._d1) root.push(i); else { if(!g.has(i._d1)) g.set(i._d1,[]); g.get(i._d1).push(i); } });
    if(root.length) h+=sec('直接放在这一层', root);
    [...g.keys()].sort().forEach(k=> h+=sec(stripNo(k), g.get(k), ` data-gs="${esc(k)}"`));
  }
  $('#out').innerHTML=h;
  wireRows($('#out'));
  $$('#out [data-gs]').forEach(el=>el.onclick=()=>gotoDir(fDir, el.dataset.gs));
  if(selSeq>=listNow.length) selSeq=-1;
  paintSel();
  saveFilters();
  pushState();
  const at=active();
  if(at && kindOfTab(at)==='search') paintSerp(at);
}

/* ── 选中与键盘 ───────────────────────── */
function wireRows(root){
  root.querySelectorAll('[data-seq]').forEach(el=>{
    const seq=+el.dataset.seq;
    el.onclick=e=>{
      if(e.target.closest('[data-ext],[data-clip],[data-rev]')) return;
      if(e.metaKey){ selSet.has(seq)?selSet.delete(seq):selSet.add(seq); selSeq=seq; paintSel(); return; }
      if(e.shiftKey && selSeq>=0){ const a=Math.min(selSeq,seq),b=Math.max(selSeq,seq);
        selSet.clear(); for(let k=a;k<=b;k++) selSet.add(k); paintSel(); return; }
      selectSeq(seq, true);
    };
    el.ondblclick=()=>openDoc(listNow[seq], {jump:terms()});
    el.oncontextmenu=e=>{ if(!selSet.has(seq)) selectSeq(seq, false); rowMenu(e, seq); };
    el.ondragstart=e=>{
      const picked=(selSet.size?[...selSet]:[seq]).map(s=>listNow[s]).filter(Boolean);
      const uris=picked.map(i=>'file://'+encodeURI(LIBROOT+'/'+i.路径)).join('\n');
      try{
        e.dataTransfer.setData('text/uri-list', uris);
        e.dataTransfer.setData('text/plain', uris);
        e.dataTransfer.effectAllowed='copyLink';
      }catch(err){}
    };
  });
  root.querySelectorAll('[data-ext]').forEach(el=>el.onclick=e=>{e.stopPropagation();openExternal(items[+el.dataset.ext].路径)});
  root.querySelectorAll('[data-clip]').forEach(el=>el.onclick=e=>{e.stopPropagation();clipPath(items[+el.dataset.clip].路径)});
  root.querySelectorAll('[data-rev]').forEach(el=>el.onclick=e=>{e.stopPropagation();revealPath(items[+el.dataset.rev].路径)});
}

let openT=null;
function selectSeq(seq, open){
  if(seq<0||seq>=listNow.length) return;
  selSeq=seq; selSet.clear(); selSet.add(seq); paintSel();
  const el=$(`#out [data-seq="${seq}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
  if(open){ clearTimeout(openT); openT=setTimeout(()=>openDoc(listNow[seq], {jump:terms()}), 90); }
}
function paintSel(){
  $$('#out [data-seq]').forEach(el=>{
    const s=+el.dataset.seq, on=selSet.has(s)||s===selSeq;
    el.classList.toggle('sel', on);
    el.setAttribute('aria-selected', on?'true':'false');
  });
}

/* ── 右键菜单 ───────────────────────────
   壳里弹真的 NSMenu，浏览器里弹一个同款外观的面板。 */
let ctxCb=null, ctxSeq=0;
function popMenu(e, itemsArr, cb){
  e.preventDefault(); e.stopPropagation();
  const x=e.clientX, y=e.clientY;
  if(SHELL){
    ctxCb=cb; ctxSeq++;
    post({type:'menu', id:ctxSeq, x, y, items:itemsArr});
    return;
  }
  const box=$('#ctx');
  box.innerHTML=itemsArr.map(it=>it.sep?`<div class="sep"></div>`
    :`<button data-mid="${esc(it.id)}"${it.enabled===false?' disabled':''}>${esc(it.label)}</button>`).join('');
  box.classList.add('on');
  const w=box.offsetWidth, h=box.offsetHeight;
  box.style.left=Math.min(x, innerWidth-w-8)+'px';
  box.style.top =Math.min(y, innerHeight-h-8)+'px';
  box.querySelectorAll('[data-mid]').forEach(b=>b.onclick=()=>{ closeCtx(); cb(b.dataset.mid); });
  ctxCb=cb;
}
function closeCtx(){ const b=$('#ctx'); if(b) b.classList.remove('on'); }

function rowMenu(e, seq){
  const i=listNow[seq]; if(!i) return;
  const many=selSet.size>1 ? `（${selSet.size} 份）` : '';
  const md=(i.类型||'md')==='md';
  popMenu(e, [
    {id:'open', label:'打开'},
    ...(!md?[{id:'browser', label:'在浏览器里打开'}]:[]),
    ...(IS_HTTP?[{id:'newwin', label:'在新窗口打开'}]:[]),
    {sep:true},
    {id:'copyurl',label:'拷贝路径'+many},
    {id:'reveal', label:'在访达中显示'+many},
    {id:'copyrel',label:'拷贝库内相对路径'+many},
  ], id=>{
    const picked=(selSet.size?[...selSet]:[seq]).map(s=>listNow[s]).filter(Boolean);
    if(id==='open') openDoc(i, {jump:terms()});
    else if(id==='browser') openExternal(i.路径);
    else if(id==='newwin') openSolo(i.路径);
    else if(id==='reveal') picked.forEach(x=>revealPath(x.路径));
    else if(id==='copyrel') copyText(picked.map(x=>x.路径).join('\n')).then(ok=>flash(ok?'路径已拷贝':'拷不了'));
    else if(id==='copyurl'){
      copyText(picked.map(x=>'file://'+LIBROOT+'/'+x.路径).join('\n'))
        .then(ok=>flash(!ok ? '拷不了' : (picked.length>1?`${picked.length} 条路径已拷贝`:'路径已拷贝')));
    }
  });
}

/* 卡片上的右键：开始页 / 文件夹页 / 已收藏页那一张张卡片，还有搜索结果那一行行。
   壳里是原生 NSMenu，浏览器里是 #ctx，都走 popMenu。 */
function cardMenu(e, rel, kind){
  if(!rel) return;
  const it=items.find(i=>i.路径===rel)
    || {路径:rel, 标题:rel.split('/').pop(), 类型:kind||'md'};
  popMenu(e, [
    {id:'open',    label:'打开'},
    {id:'newtab',  label:'在新标签打开'},
    {id:'pin',     label:isPinned(rel)?'取消收藏':'收藏'},
    {id:'reveal',  label:'在访达中显示'},
    {id:'copyurl', label:'拷贝路径'},
    ...(canTrashPath(rel) ? [{sep:true},{id:'trash', label:'移到废纸篓'}] : []),
  ], id=>{
    if(id==='open') openDoc(it);
    else if(id==='newtab') openDoc(it, {newTab:true});
    else if(id==='pin') togglePin(rel);
    else if(id==='reveal') revealPath(rel);
    else if(id==='copyurl') clipPath(rel);

/* 正文上的右键：原来顶栏那一排按钮搬到这里（工具栏收成两颗，见 C 路）。 */
function docMenu(e, t){
  if(!t) return;
  const kk=kindOfTab(t);
  if(kk==='start'||kk==='search'||kk==='folder') return;
  if(e.target.closest('a,img,textarea,iframe,.pagebox')) return;
  const ed=!!t.editing, src=paneOf(t).classList.contains('src');
  popMenu(e, [
    ...(!ed && !t.ext && canEditPath(t.path) ? [{id:'edit', label:'进入编辑'},{sep:true}] : []),
    ...(ed ? [{id:'src', label:src?'回到正文':'整篇源码'},
              {id:'cancel', label:'放弃这次修改'},{sep:true}] : []),
    ...(t.ext ? [] : [{id:'newwin', label:'在新窗口打开'}]),
    {id:'copyurl',label:'拷贝路径'},
    {id:'reveal', label:'在访达中显示'},
    {id:'type', label:'排版'},
    ...(t.ext ? [] : [{id:'share', label:'分享'}]),
  ], id=>{
    if(id==='edit') startEdit();
    else if(id==='src') toggleSrc();
    else if(id==='cancel') cancelEdit();
    else if(id==='newwin') openSolo(t.path);
    else if(id==='copyurl'){
      const s = t.ext ? t.abs : (LIBROOT+'/'+t.path);
      copyText('file://'+s).then(ok=>flash(ok?'路径已拷贝':'拷不了'));
    }
    else if(id==='reveal') revealPath(t.path);
    else if(id==='type') openType();
    else if(id==='share') post({type:'share', path:LIBROOT+'/'+t.path});
  });
}

   下面照旧是动作和笔记，排序没动。 */
let ckList=[], ckSel=0;
const CK_ACTS=[
  {id:'tab', title:'新建标签页', kbd:'⌘T', go(){ newTab(); }},
  {id:'new', title:'新建随手记', kbd:'', go(){ newNote(); }},

/* seed 预填一段文字。opt.select 为真＝全选（AMN.search），否则光标停在末尾
   （开始页敲第一个字那条路：接着敲第二个字不能把第一个顶掉）。 */
function openQuick(seed, opt){
  opt=opt||{};
  $('#cmdkWrap').classList.add('on');
  const el=$('#ck'); el.value=seed||''; ckSel=0; ckRender();
  setTimeout(()=>{
    el.focus();
    if(seed && !opt.select) el.setSelectionRange(seed.length, seed.length);
    else el.select();
  }, 0);
}
function closeQuick(){ $('#cmdkWrap').classList.remove('on'); }
const quickOn = () => $('#cmdkWrap').classList.contains('on');
function ckNotes(q){
  q=String(q||'').trim().toLowerCase();
  const stem=p=>p.split('/').pop().replace(/\.(md|html|htm)$/i,'');
  const pool=items.filter(i=>{ const k=kindOf(i); return k==='md'||k==='html'; });
  if(!q) return pool.sort(byRecent).slice(0,12);
  const w=q.split(/\s+/).filter(Boolean);
  const rank=i=>{
    const t=(i.标题||'').toLowerCase(), n=stem(i.路径).toLowerCase(), h=hayOf(i);
    if(!w.every(x=>h.includes(x))) return -1;
    let s=0;
    w.forEach(x=>{
      if(t.startsWith(x)||n.startsWith(x)) s+=100;
      else if(t.includes(x)||n.includes(x)) s+=40;
      else s+=10;
    });
    return s;
  };
  return pool.map(i=>({i, s:rank(i)})).filter(x=>x.s>=0)
    .sort((a,b)=> b.s-a.s || (b.i.修改时间||0)-(a.i.修改时间||0))
    .slice(0,12).map(x=>x.i);
}
function ckItems(q){
  const raw=String(q||'').trim();
  const low=raw.toLowerCase();
  const head=raw ? [{kind:'q', q:raw}] : [];
  const acts=CK_ACTS.filter(a=>!low || a.title.toLowerCase().includes(low))
    .map(a=>({kind:'act', a}));
  const notes=ckNotes(raw).map(i=>({kind:'note', i}));
  return head.concat(acts, notes);
}
/* 动作行前面那颗图标，只是长相，不进 CK_ACTS。 */
const CK_ICON={tab:'plus', new:'new-note', win:'newwin',
  edit:'pencil', type:'sliders', finder:'folder', home:'home'};
/* 全库搜索：跟原来地址栏回车一字不差——setKw ＋ 一张搜索结果页。 */
function runSearch(q, newTab){
  q=String(q||'').trim(); if(!q) return;
  setKw(q);
  navigate(makeEntry('search', {q, title:q, path:'搜索: '+q}), {newTab:!!newTab});
}
function runCk(it, newTab){
  closeQuick();
  if(!it) return;
  if(it.kind==='q'){ runSearch(it.q, newTab); return; }
  if(it.kind==='act'){ it.a.go(); return; }
  openDoc(it.i, newTab?{newTab:true}:null);
}
function ckRender(){
  const q=$('#ck').value;
  ckList=ckItems(q);
  if(ckSel>=ckList.length) ckSel=Math.max(0, ckList.length-1);
  const ts=String(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const mark=s=>{
    if(!ts.length) return esc(s);
    let out=esc(s);
    ts.forEach(t=>{
      const low=String(s).toLowerCase(), k=low.indexOf(t);
      if(k<0) return;
      out=esc(s.slice(0,k))+'<b>'+esc(s.slice(k,k+t.length))+'</b>'+esc(s.slice(k+t.length));
    });
    return out;
  };
  const row=(n, ico, title, sub, tail)=>
    `<button type="button" class="search-row${n===ckSel?' on':''}" role="option"`
    + ` aria-selected="${n===ckSel?'true':'false'}" data-n="${n}">`
    + `<span class="ico">${ico}</span>`
    + `<span class="search-info"><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span>`
    + tail + `</button>`;
  const acts=ckList.filter(x=>x.kind==='act');
  const notes=ckList.filter(x=>x.kind==='note');
  let html='';
  const qrow=ckList.find(x=>x.kind==='q');
  if(qrow){
    html+=row(ckList.indexOf(qrow), icon('search',17),
      '在全部笔记中搜索“'+esc(qrow.q)+'”', '', '<span class="enter">↩</span>');
  }
  if(acts.length){
    html+=`<div class="search-label">动作</div>`;
    acts.forEach(it=>{
      const n=ckList.indexOf(it);
      html+=row(n, icon(CK_ICON[it.a.id]||'arrow',17), esc(it.a.title), '',
        it.a.kbd ? `<kbd>${esc(it.a.kbd)}</kbd>` : '<span class="enter">↵</span>');
    });
  }
  if(notes.length){
    const typed=String(q||'').trim();
    html+=`<div class="search-label">${typed?('找到 '+notes.length+' 篇'):'最近的笔记'}</div>`;
    notes.forEach(it=>{
      const n=ckList.indexOf(it);
      const isHtml=kindOf(it.i)==='html';
      const bits=[folderLabel(it.i.路径), cardText(it.i)].filter(Boolean);
      html+=row(n, icon(isHtml?'globe':'doc',17), mark(cleanTitle(it.i)),
        esc(bits.join(' · ')), '<span class="enter">↵</span>');
    });
  }
  if(!ckList.length || (ckList.length===1 && qrow)){
    html+=`<div class="modal-empty"><h2>还没找到这篇笔记</h2>`
      + `<p>换一个短一点的词试试。</p>`
      + `<button type="button" class="hbtn" id="ckNew">${icon('plus',15)}<span>先记下这个想法</span></button></div>`;
  }
  $('#ckList').innerHTML=html;
  $$('#ckList .search-row').forEach(el=>{
    el.onclick=e=>runCk(ckList[+el.dataset.n], e.metaKey||e.ctrlKey);
  });
  const ne=$('#ckNew'); if(ne) ne.onclick=()=>{ closeQuick(); newNote(); };
  const cur=$('#ckList .search-row.on');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}
$('#ck').oninput=()=>{ ckSel=0; ckRender(); };
$('#ck').onkeydown=e=>{
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); ckSel=Math.min(ckList.length-1, ckSel+1); ckRender(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); ckSel=Math.max(0, ckSel-1); ckRender(); }
  else if(e.key==='Enter'){ e.preventDefault(); runCk(ckList[ckSel], e.metaKey||e.ctrlKey); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeQuick(); }
};

const SLASH=[
  {id:'h1', title:'标题一', k:'#'},
  {id:'h2', title:'标题二', k:'##'},
  {id:'h3', title:'标题三', k:'###'},
  {id:'quote', title:'引用', k:'>'},
  {id:'task', title:'待办', k:'[]'},
  {id:'ul', title:'列表', k:'-'},
  {id:'pre', title:'代码块', k:'```'},
  {id:'hr', title:'分割线', k:'---'},
];
let slashI=0, slashBlk=null;
function slashOn(){ return $('#slash').classList.contains('on'); }
function hideSlash(){
  $('#slash').classList.remove('on');
  slashBlk=null;
}
function paintSlash(){
  $('#slash').innerHTML='<div class="sh">插入</div>'+SLASH.map((s,i)=>
    `<button type="button" class="${i===slashI?'on':''}" data-id="${s.id}"><span>${s.title}</span><span class="k">${s.k}</span></button>`
  ).join('');
  $$('#slash button').forEach((b,i)=>{
    b.onmousedown=e=>e.preventDefault();
    b.onmouseenter=()=>{ slashI=i; paintSlash(); };
    b.onclick=()=>applySlash(b.dataset.id);
  });
}
function maybeSlash(t){
  if(!t || !t.editing || COMPOSING) return hideSlash();
  const blk=curBlock(t);
  if(!blk || !/^(P|DIV)$/.test(blk.tagName) || blk.hasAttribute('data-lock')) return hideSlash();
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed) return hideSlash();
  const r=s.getRangeAt(0);
  const pre=r.cloneRange();
  pre.selectNodeContents(blk); pre.setEnd(r.endContainer, r.endOffset);
  if(tidyTxt(pre.toString())!=='/') return hideSlash();
  slashBlk=blk; slashI=0;
  const box=$('#slash');
  const rc=r.getBoundingClientRect();
  box.classList.add('on');
  paintSlash();
  const w=240, h=Math.min(320, box.offsetHeight||240);
  let x=rc.left, y=rc.bottom+8;
  if(x+w>innerWidth-8) x=innerWidth-w-8;
  if(y+h>innerHeight-8) y=Math.max(8, rc.top-h-8);
  box.style.left=Math.max(8,x)+'px';
  box.style.top=y+'px';
}
function applySlash(id){
  const t=active();
  const blk=slashBlk || (t && curBlock(t));
  hideSlash();
  if(!t || !t.editing || !blk || !blk.isConnected) return;
  retype(t, blk, id||SLASH[slashI].id, '');
  t.touched=true;
  autoKick(t);
}

/* ── 新建随手记 ─────────────────────────
   落在随手记目录。从开始页点「新建随手记」；编辑中先自动保存再新建。
   不再弹命名框：直接落一份「无标题」，打开正文，标题圈住就能改。
   第一次写出真正的一级标题时，文件名跟着改。 */
function syncNotePv(){
  NOTEPV.clear();
  ((TREE&&TREE.随手记)||[]).forEach(n=>{ if(n.预览) NOTEPV.set(n.路径, n.预览); });
  items.forEach(i=>{ const pv=NOTEPV.get(i.路径); if(pv) i.预览=pv; });
}
const UNTITLED = '无标题';
const UNTITLED_FN = /^无标题(?:_\d+)?_20\d{6}\.md$/i;
function ymdParts(d){
  d=d||new Date();
  const z=n=>String(n).padStart(2,'0');
  return {
    日:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,
    紧:`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}`
  };
}
function safeNoteStem(title, 日){
  let safe=String(title||'').replace(/[\/\\:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().slice(0,60);
  if(日) safe=safe.replace(new RegExp('[ _\\-]*'+日.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$'),'').trim() || safe;
  return safe;
}
function takenPaths(){
  const s=new Set(items.map(i=>i.路径));
  TABS.forEach(t=>{ if(t.path) s.add(t.path); });
  return s;
}
function firstHeading(src){
  let skip=String(src||'');
  if(skip.startsWith('---')){
    const e=skip.indexOf('\n---',3);
    if(e!==-1){
      const cut=skip.indexOf('\n', e+1)+1;
      if(cut>0) skip=skip.slice(cut);
    }
  }
  let fence=false;
  for(const ln of skip.split('\n').slice(0,400)){
    const s=ln.trim();
    if(s.startsWith('```')||s.startsWith('~~~')){ fence=!fence; continue; }
    if(fence) continue;
    if(s.startsWith('# ')) return s.slice(2).replace(/#+$/,'').trim();
  }
  return '';
}
function suggestRename(rel, title){
  const fn=(rel||'').split('/').pop();
  if(!UNTITLED_FN.test(fn)) return null;
  const stamp=(fn.match(/20\d{6}/)||[])[0];
  if(!stamp) return null;
  const 日=stamp.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');
  const stem=safeNoteStem(title, 日);
  if(!stem || stem===UNTITLED) return null;
  const dir=rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
  const used=takenPaths();
  used.delete(rel);
  for(let i=1;i<=20;i++){
    const name=`${stem}${i>1?'_'+i:''}_${stamp}.md`;
    const dest=dir ? dir+'/'+name : name;
    if(dest===rel || !used.has(dest)) return dest===rel ? null : dest;
  }
  return null;
}
function applyRenamedPath(t, next){
  const old=t.path;
  if(!next || next===old) return;
  t.path=next;
  const e=ensureStack(t); if(e){ e.path=next; if(t.title) e.title=t.title; }
  ST.lastPath=next;
  if(Array.isArray(ST.recents)) ST.recents.forEach(r=>{ if(r.路径===old) r.路径=next; });
  saveST();
  items.forEach(i=>{ if(i.路径===old){ i.路径=next; if(t.title) i.标题=t.title; } });
  if(TREE && TREE.文档) TREE.文档.forEach(d=>{ if(d.路径===old){ d.路径=next; if(t.title) d.标题=t.title; } });
  lastNat='';
  syncTabTitle(t);
  drawTabs();
  drawDocBar(t); drawDocMeta(t);
  syncChrome();
  pushState();
}
let newNoteBusy=false;
async function newNote(){
  if(newNoteBusy) return;
  if(!IS_HTTP){ tell('新建要服务在跑','双击 AM·Note.app 打开就行。'); return; }
  const cur=active(); if(cur && cur.editing) flushSave(cur);
  const {日, 紧}=ymdParts();
  const body='# '+UNTITLED+'\n\n';
  newNoteBusy=true;
  try{
    const used=takenPaths();
    for(let i=1;i<=20;i++){
      const rel=`${NOTE_DIR}/${UNTITLED}${i>1?'_'+i:''}_${紧}.md`;
      if(used.has(rel)) continue;
      let r;
      try{
        r=await (await fetch('/__save',{method:'POST', headers:hdrs(),
          body:JSON.stringify({路径:rel, 正文:body, 新建:true})})).json();
      }catch(e){ tell('建不了','服务没应答'); return; }
      if(r && r.ok){ await openFreshNote(r.路径||rel, 日); return; }
      if(!/已经有了|刚被建走/.test((r&&r.错误)||'')){ tell('建不了', (r&&r.错误)||''); return; }
      used.add(rel);
    }
    tell('建不了','今天的无标题已经建了 20 份了');
  }finally{ newNoteBusy=false; }
}
async function openFreshNote(rel, 日){
  const now=Date.now()/1000;
  if(!items.some(i=>i.路径===rel)){
    items.unshift({路径:rel, 标题:UNTITLED, 类型:'md', 修改时间:now, 日期:日||ymdParts().日});
    prepItems();
  }
  await openDoc({路径:rel, 标题:UNTITLED, 类型:'md'}, {newTab:!isStartTab(active())});
  const t=active();
  if(t && t.path===rel) t.fresh=true;
  await startEdit({fresh:true});
}

   一个 720×600 的弹层，左边四段导航，右边一栏内容。
   两类设置在这里并排放着，存的地方完全不同，改的方式也不同：
     · 阅读与外观 → localStorage 的 PREF / ST，**即时生效，没有保存按钮**；
     · 笔记库与高级 → 服务端 .amnote/config.json，改完底部才冒出保存条，
       按「保存并重新整理」才写盘（POST /__config → /__rescan）。
   分界线就是 CFG_FORM：只有它里面的六个键才算「未保存的更改」。 */

const CFG_TABS={reading:'阅读与外观', library:'笔记库', advanced:'高级', about:'关于'};

  const c=(CFG&&CFG.配置)||{};

    跳过目录关键词: (c.跳过目录关键词||[]).slice(),
    噪声目录: (c.噪声目录||[]).slice(),

    随手记目录: c.随手记目录||'',

/* 服务端那份「问题」是一句句人话，键名夹在「」里。按键名认领，认不到的
   归到 unmatched，由调用方摆在整段的最上面。 */
function noticeFor(key){
  const ps=(CFG&&CFG.问题)||[];

/* 「2026-09-05 23:56:22」→ 时间戳。给 fmtWhen 用。 */

function renderCfg(){

    const on=b.dataset.tab===tab;

  $('#cfgTitle').textContent=CFG_TABS[tab];
  const body=$('#cfgBody');
  body.innerHTML = tab==='reading' ? panelReading()
    : tab==='library' ? panelLibrary()
    : tab==='advanced' ? panelAdvanced()
    : panelAbout();
  body.scrollTop=0;
  wireCfg(tab);
  syncCfgDirty();
  syncPrefControls();
