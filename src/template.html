<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM·Note</title>
<meta name="theme-color" content="#ffffff">
<!-- 口令：服务出页时把下面这串占位替换成真 token。前端读它，读到的还是占位＝旧服务，走降级。 -->
<meta name="amn-token" content="__AMN_TOKEN__">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
/* ═══════════════════════════════════════════════════════════════
   AM·Note 门户样式 · v22
   视觉依据：_工作区/20260830_AMNote首页重设计Demo_v2/qa/10_home_light_recent_title_final.png
   实现依据：_工作区/20260830_AMNote首页重设计Demo_v2/src/styles.css
   v22 首页浅色底改纯白，去掉全屏标题栏那条「上面偏白、下面偏灰」的假接缝；
   最近文稿不再套 rrow 选中白卡片，搜索框底下是一条轻标题，不再叠层。
   v21 按最终确认稿收紧首页：搜索框改为 640×54；最近文稿只留轻色标题，
   右侧以时间图标＋日期收口，不再显示「上次打开」文字。
   v20 把确认的第 2 版沉浸首页搬进正式客户端：搜索框在窗口中央，
   首页只留一条「上次打开」，不再摊开最近文稿列表；搜索态和三栏态保持原功能。
   v18 把已确认的无边框气质与文字排版搬进正式客户端：标题栏与正文同面、
   工具按钮默认裸露、列表更克制、三栏空态补齐、正文 15/1.8/680。
   v19 把网页主题同步给原生标题栏：浅色时标题与按钮自动变深，深色时自动变亮。
   这一版做掉的：四态布局（空态／阅读／编辑／搜索）＋⌘K 直达、
   去分割线去描边、表格 B、篇内目录短横线轨道、文档历史折叠。
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* 浏览器自己画的那些东西（滑杆、文本光标、滚动条）跟着主题走。
     不声明的话它们恒为浅色，深色主题下在深底上一片惨白。 */
  color-scheme: light dark;

  /* ── 样张色板（浅） ── */
  --canvas:#c7d0d5;
  --win:#ffffff;
  --side:#ededee;
  --list:#f3f3f4;
  --hover:#efeff1;
  --sel:#ffffff;
  --t1:#1e1e20;
  --t2:#535358;
  --t3:#74747a;
  --t4:#9b9ba0;
  --recent:#66666b;
  --accent:#3279c7;

  --pill:#ececee;
  --field:#ececee;
  --field2:#ececee;
  --segon:#ffffff;
  --pop:#ffffff;

  --rule-head:#dedee1;
  --rule-row:#e8e8ea;
  --zebra:#f1f1f2;
  --hl:rgba(10,110,209,.12);
  --dot:#34c759;

  --selshadow:0 2px 9px rgba(0,0,0,.08);
  --segshadow:0 1px 3px rgba(0,0,0,.10);
  --popshadow:0 10px 30px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
  --popbig:0 26px 70px rgba(0,0,0,.24), 0 6px 18px rgba(0,0,0,.10);
  --scrim:rgba(0,0,0,.18);

  /* ── 字体栈 ── */
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Hiragino Sans GB",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  /* ── 骨架尺寸 ── */
  --sbw:224px;    /* 边栏宽，可拖，存 localStorage */
  --lcw:320px;    /* 列表栏宽，可拖 */
  --docw:680px;   /* 正文栏宽，跟 PREF.w 走 */
}
@supports (color:AccentColor){ :root{ --accent:AccentColor } }
@supports (color:-apple-system-control-accent){ :root{ --accent:-apple-system-control-accent } }

:root[data-theme="light"]{ color-scheme: light }
:root[data-theme="dark"] { color-scheme: dark  }

/* ── 样张色板（深）── */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#a9b8c0; --win:#19191b; --side:#202023; --list:#1c1c1f;
  --hover:#2d2d31; --sel:#333338;
  --t1:#f4f4f5; --t2:#b4b4b9; --t3:#85858b; --t4:#66666c; --recent:#a0a0a5; --accent:#8eb9ea;
  --pill:#27272b; --field:#27272b; --field2:#27272b; --segon:#3a3a40; --pop:#27272b;
  --rule-head:#343439; --rule-row:#29292d; --zebra:#202023;
  --hl:rgba(142,185,234,.18); --dot:#32d66b;
  --selshadow:0 2px 9px rgba(0,0,0,.22);
  --segshadow:0 1px 3px rgba(0,0,0,.35);
  --popshadow:0 10px 30px rgba(0,0,0,.50), 0 2px 8px rgba(0,0,0,.30);
  --popbig:0 26px 70px rgba(0,0,0,.60), 0 6px 18px rgba(0,0,0,.40);
  --scrim:rgba(0,0,0,.38);
}}
:root[data-theme="dark"]{
  --canvas:#a9b8c0; --win:#19191b; --side:#202023; --list:#1c1c1f;
  --hover:#2d2d31; --sel:#333338;
  --t1:#f4f4f5; --t2:#b4b4b9; --t3:#85858b; --t4:#66666c; --recent:#a0a0a5; --accent:#8eb9ea;
  --pill:#27272b; --field:#27272b; --field2:#27272b; --segon:#3a3a40; --pop:#27272b;
  --rule-head:#343439; --rule-row:#29292d; --zebra:#202023;
  --hl:rgba(142,185,234,.18); --dot:#32d66b;
  --selshadow:0 2px 9px rgba(0,0,0,.22);
  --segshadow:0 1px 3px rgba(0,0,0,.35);
  --popshadow:0 10px 30px rgba(0,0,0,.50), 0 2px 8px rgba(0,0,0,.30);
  --popbig:0 26px 70px rgba(0,0,0,.60), 0 6px 18px rgba(0,0,0,.40);
  --scrim:rgba(0,0,0,.38);
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--win)}
body{background:var(--win);color:var(--t1);
  font:13px/1.5 var(--ui);
  font-synthesis:none;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-appearance:none}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--hl)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{fill:none;stroke:currentColor}

/* ═══ 四态骨架 ═══════════════════════════
   纯正文（默认）｜三栏（lists-on）｜窄栏（空态／搜索，nodoc 且未开列表）。
   分区只靠背景深浅和留白，全程无分割线无描边。 */
#app{display:none;height:100%;
  grid-template-columns:var(--sbw) 0 var(--lcw) 0 1fr;
  grid-template-areas:"side sp1 list sp2 doc"}
body.lists-on #app,
body:not(.nodoc) #app{display:grid}
body:not(.lists-on) #app{grid-template-columns:0 0 0 0 1fr}
body:not(.lists-on) #side,
body:not(.lists-on) #listpane,
body:not(.lists-on) .split{display:none}

/* 原生壳改成全尺寸透明标题栏后，网页底色铺到窗口圆角里。
   正文骨架从标题栏下方开始，顶部 52px 只留给系统交通灯、标题和两颗工具键。 */
body.shell #app,body.shell #hub{padding-top:52px}

#hub{display:none;height:100%;overflow-y:auto;background:var(--win)}
body.nodoc:not(.lists-on) #hub{display:block}
body.nodoc:not(.lists-on) #app{display:none}

/* 分隔条：不画线，只留一条看不见的拖动区 */
.split{position:relative;z-index:5;width:0;cursor:col-resize}
.split::after{content:"";position:absolute;inset:0 -3px}
#sp1{grid-area:sp1} #sp2{grid-area:sp2}

/* ═══ 窄栏（空态 / 搜索）═══════════════════ */
.col{width:560px;margin:0 auto;padding:clamp(68px,10vh,106px) 0 100px;transition:width .2s ease}
body.searching .col{width:640px}

.searchpill{
  height:36px;border-radius:18px;background:var(--pill);
  display:flex;align-items:center;gap:9px;padding:0 14px;
}
.searchpill svg{width:16px;height:16px;flex:none;color:var(--t3);stroke-width:1.5}
.searchpill input{flex:1;min-width:0;border:0;background:none;outline:none;
  font-size:13px;color:var(--t1);-webkit-appearance:none}
.searchpill input::placeholder{color:var(--t3)}
.searchpill input::-webkit-search-cancel-button{display:none}
.searchpill .clear{width:20px;height:20px;border-radius:10px;flex:none;
  display:none;align-items:center;justify-content:center;color:var(--t3);
  transition:background-color .15s ease}
body.searching .searchpill .clear{display:flex}
.searchpill .clear:hover{background:var(--hover)}
.searchpill .clear svg{width:13px;height:13px}
.searchpill.sm{height:30px;border-radius:15px;background:var(--field2);padding:0 11px}
.searchpill.sm svg{width:14px;height:14px}
.searchpill.sm input{font-size:12px}

/* 沉浸首页（第 2 版）：整面只承担「找」和「继续上次阅读」。
   搜索结果出现后仍回到原来的可滚动列表结构，不把结果塞在窗口正中央。 */
body.nodoc:not(.lists-on):not(.searching) #hub{
  display:grid;place-items:center;overflow:hidden;padding:28px;
}
body.shell.nodoc:not(.lists-on):not(.searching) #hub{padding:52px 28px}
body.nodoc:not(.lists-on):not(.searching) #hub .col{
  width:min(640px,calc(100vw - 48px));margin:0;padding:0;
  transform:translateY(-1.5vh);
}
body.nodoc:not(.lists-on):not(.searching) #hub .searchpill{
  height:54px;border-radius:27px;gap:13px;padding:0 18px 0 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.035);
  transition:background-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
body.nodoc:not(.lists-on):not(.searching) #hub .searchpill:hover{
  background:color-mix(in srgb,var(--pill) 86%,var(--t1) 4%)
}
body.nodoc:not(.lists-on):not(.searching) #hub .searchpill:focus-within{
  box-shadow:0 13px 34px rgba(0,0,0,.055);transform:translateY(-1px)
}
body.nodoc:not(.lists-on):not(.searching) #hub .searchpill svg{width:20px;height:20px;stroke-width:1.45}
body.nodoc:not(.lists-on):not(.searching) #hub .searchpill input{
  font-size:16px;line-height:1;font-weight:420;letter-spacing:-.015em
}
body.nodoc:not(.lists-on):not(.searching) #hub .searchpill .clear{
  width:26px;height:26px;border-radius:13px
}
body.nodoc:not(.lists-on):not(.searching) #hubbody{padding-top:0}

/* 首页最近一行必须压过后面的 .rrow / .rrow.sel。
   上一版把 home-last 和 rrow 叠在同一颗节点上，选中态变成白卡片，
   搜索框的阴影又压在卡片上，看起来像两层错位。 */
body.nodoc:not(.lists-on):not(.searching) #hub .home-last{
  width:100%;height:46px;margin:14px 0 0;padding:0 18px 0 20px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;
  border-radius:14px;background:transparent;box-shadow:none;cursor:pointer;
  transition:background-color .15s ease,transform .10s ease-out;
}
body.nodoc:not(.lists-on):not(.searching) #hub .home-last:hover{
  background:rgba(0,0,0,.035)
}
body.nodoc:not(.lists-on):not(.searching) #hub .home-last:active{transform:scale(.992)}
body.nodoc:not(.lists-on):not(.searching) #hub .home-last .last-title{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;font-weight:450;letter-spacing:-.012em;color:var(--recent)
}
body.nodoc:not(.lists-on):not(.searching) #hub .home-last .last-time{
  display:inline-flex;align-items:center;justify-self:end;gap:7px;
  font-size:13px;font-weight:400;color:var(--t4);white-space:nowrap
}
body.nodoc:not(.lists-on):not(.searching) #hub .home-last .last-time svg{
  width:15px;height:15px;flex:none;stroke-width:1.45
}
body.nodoc:not(.lists-on):not(.searching) #hub .home-last.sel,
body.nodoc:not(.lists-on):not(.searching) #hub .home-last.sel:hover{
  background:transparent;box-shadow:none
}
body.nodoc:not(.lists-on) .res.sel{background:rgba(0,0,0,.04);box-shadow:none}

.seclab{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;margin-top:30px}
.hitline{text-align:right;font-size:11px;color:var(--t4);margin-top:10px}
.hitline.off{display:none}

/* 窄栏里的一行 */
.rrow{
  height:43px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 10px;margin:0 -10px;border-radius:10px;cursor:default;
  transition:background-color .15s ease;
}
.rrow .t{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rrow .m{font-size:11px;color:var(--t4);flex:none}
.rrow:hover{background:var(--hover)}
.rrow.sel{background:var(--sel);box-shadow:var(--selshadow)}

/* 搜索结果 */
.res{padding:10px 12px;margin:0 -12px;border-radius:10px;cursor:default;
  transition:background-color .15s ease}
.res:hover{background:var(--hover)}
.res.sel{background:var(--sel);box-shadow:var(--selshadow)}
.res .rt{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rp{font-size:11px;color:var(--t4);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rx{display:none} /* 搜索结果只给标题＋位置，不常驻正文片段，减少信息压力 */
/* 命中词：加粗 ＋ 强调色下划线，不铺底色 */
.hit{
  font-weight:600;font-style:normal;
  text-decoration:underline;
  text-decoration-color:var(--accent);
  text-decoration-thickness:2px;
  text-underline-offset:3px;
}

/* 行上的次要动作：hover 才出，其余进右键 */
.racts{display:flex;gap:2px;align-items:center;flex-shrink:0;opacity:0;
  transition:opacity .15s ease}
.rrow:hover .racts,.lrow:hover .racts,.res:hover .racts,.racts:focus-within{opacity:1}
.iba{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:7px;color:var(--t3);transition:background-color .15s ease,color .15s ease}
.iba:hover{background:var(--hover);color:var(--t1)}
.iba svg{width:15px;height:15px;stroke-width:1.5}

/* ═══ 边栏 ═══════════════════════════════ */
#side{grid-area:side;background:var(--side);padding:18px 10px 14px;
  display:flex;flex-direction:column;overflow:hidden auto;min-width:0}
.nav{
  height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:10px;
  width:100%;text-align:left;font-size:12px;color:var(--t2);
  transition:background-color .15s ease;
}
.nav svg{width:16px;height:16px;flex:none;color:var(--t2);stroke-width:1.5}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);box-shadow:var(--selshadow);color:var(--t1)}
.nav.sub{color:var(--t2)}
.nav .n{font-size:11px;color:var(--t4);flex:none;font-variant-numeric:tabular-nums}
.nav.deep{padding-left:34px}
.grouplab{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;padding:0 10px;margin:22px 0 9px}
.spacer{flex:1;min-height:12px}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--dot);margin-left:auto;flex:none;
  transition:transform .25s ease,background-color .15s ease}
.livedot.off{background:var(--t3)}
.livedot.hit{transform:scale(1.7)}
#stat.hide{display:none}

/* ═══ 列表栏 ═══════════════════════════════ */
#listpane{grid-area:list;background:var(--list);padding:18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;min-width:0}
.listtop{padding:0 10px;flex:none}
#listbody{flex:1;overflow-y:auto;padding:0 0 40px;min-height:0}
.lgroup{font-size:11px;font-weight:560;color:var(--t4);letter-spacing:.01em;padding:0 20px;margin:18px 0 8px}
.lrow{
  height:43px;margin:0 8px;padding:0 12px;border-radius:10px;cursor:default;
  display:flex;align-items:center;gap:12px;transition:background-color .15s ease;
}
.lrow .t{font-size:13px;font-weight:470;letter-spacing:-.006em;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{font-size:11px;color:var(--t4);flex:none}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--sel);box-shadow:var(--selshadow)}
#listbody .res{margin:0 8px;padding:10px 12px}
#hubbody{padding-top:6px}

/* ═══ 正文栏 ═══════════════════════════════ */
#docpane{grid-area:doc;position:relative;background:var(--win);overflow:hidden;min-width:0}

/* 三栏打开但还没选文稿：给一个窄而安静的落点，避免右侧被拉成一整块空黑。 */
.quiet-empty{position:absolute;inset:0;display:none;place-content:center;justify-items:center;
  color:var(--t4);text-align:center;pointer-events:none}
body.nodoc.lists-on .quiet-empty{display:grid}
body.nodoc.lists-on #panes,
body.nodoc.lists-on .tabbar,
body.nodoc.lists-on .toc,
body.nodoc.lists-on .editstatus{display:none!important}
.empty-symbol{width:46px;height:46px;display:grid;place-items:center;margin-bottom:13px;
  border-radius:15px;background:var(--field);box-shadow:0 3px 14px rgba(0,0,0,.08)}
.empty-symbol svg{width:22px;height:22px;stroke-width:1.25}
.quiet-empty h2{margin:0 0 7px;color:var(--t2);font-size:14px;font-weight:560}
.quiet-empty p{margin:0;font-size:11px}
.quiet-empty kbd{display:inline-flex;align-items:center;padding:2px 6px;border:0;border-radius:6px;
  background:var(--field);color:var(--t2);font:10px/1.4 var(--ui)}

.listbtn{
  position:absolute;top:13px;left:16px;z-index:7;
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);transition:background-color .15s ease,color .15s ease;
}
body.shell .listbtn{display:none}     /* 壳里工具栏上已经有一颗 */
body.solo .listbtn{display:none}
.listbtn:hover{background:var(--hover);color:var(--t1)}
body.lists-on .listbtn{background:var(--sel);box-shadow:var(--selshadow);color:var(--t1)}
.listbtn svg{width:17px;height:17px;stroke-width:1.5}

.editstatus{position:absolute;top:20px;right:24px;z-index:6;
  font-size:11px;color:var(--t3);white-space:nowrap;max-width:46%;
  overflow:hidden;text-overflow:ellipsis}
.editstatus.act{cursor:pointer;color:var(--t2)}

/* 标签栏：两份以上才出。当前项是圆角色块，不画下边框 */
.tabbar{position:absolute;top:0;left:0;right:0;z-index:5;
  display:none;gap:3px;padding:44px 16px 6px;overflow-x:auto;scrollbar-width:none;
  background:var(--win)}
.tabbar::-webkit-scrollbar{display:none}
.tabbar.on{display:flex}
body.tabs-on .pane{padding-top:88px}
.tab{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;
  border-radius:7px;font-size:12px;color:var(--t2);cursor:default;
  white-space:nowrap;max-width:220px;flex:none;transition:background-color .15s ease}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--sel);box-shadow:var(--selshadow);color:var(--t1);font-weight:500}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab .tx{width:16px;height:16px;border-radius:8px;flex:none;color:var(--t3);
  display:flex;align-items:center;justify-content:center}
.tab .tx:hover{background:var(--hover);color:var(--t1)}
.tab .tx svg{width:11px;height:11px;stroke-width:1.6}

#panes{position:absolute;inset:0}
.pane{position:absolute;inset:0;overflow-y:auto;padding:46px 42px 140px;display:none}
.pane.on{display:block}
.pane .ed{display:none}
.pane.edit .md{outline:none}
.pane.edit.src{padding:0;overflow:hidden}
.pane.edit.src .md{display:none}
.pane.edit.src .ed{display:block;width:100%;height:100%;margin:0;padding:44px 38px 90px;
  border:0;background:var(--win);color:var(--t1);resize:none;
  outline:none;overflow-y:auto;tab-size:2;min-height:0;font-family:var(--mono)}

/* 篇内目录：右侧短横线轨道，读到哪亮哪，hover 展开标题，⌥⌘I 钉住 */
.toc{position:absolute;top:120px;z-index:6;
  right:max(12px, calc(50% - var(--docw)/2 - 34px));
  display:flex;flex-direction:column;gap:6px}
.toc.hide{display:none}
.tick{position:relative;height:12px;display:flex;align-items:center;justify-content:flex-end;cursor:default}
.tick .bar{width:16px;height:2px;border-radius:1px;background:var(--t3);transition:background-color .15s ease}
.tick.h3 .bar{width:10px}
.tick:hover .bar{background:var(--t2)}
.tick.on .bar,.tick.on:hover .bar{background:var(--t1)}
.tick .lab{
  position:absolute;right:24px;top:50%;transform:translateY(-50%);
  white-space:nowrap;font-size:11px;color:var(--t2);
  background:var(--pop);box-shadow:var(--popshadow);border-radius:8px;padding:4px 9px;
  opacity:0;pointer-events:none;transition:opacity .15s ease;
  max-width:240px;overflow:hidden;text-overflow:ellipsis;
}
.tick:hover .lab{opacity:1}
body.toc-pin .tick .lab{opacity:1}

/* ═══ Markdown 正文 ═══════════════════════
   样张排版基线：系统字体；正文 15 / 1.8 / 680；大标题 24；二级标题 17。
   层级主要靠字重、留白和灰阶，不靠到处加粗。版式三项仍能在设置里调。 */
.md{color:var(--t1);margin:0 auto;max-width:var(--docw)}
.md h1{font-size:24px;font-weight:680;letter-spacing:-.025em;line-height:1.28;margin:0 0 12px}
.md > h1:first-child{font-size:28px;font-weight:660;letter-spacing:-.03em;line-height:1.22;margin:0 0 14px}
.md h2{font-size:17px;font-weight:640;letter-spacing:-.01em;margin:38px 0 10px;line-height:1.45}
.md h3{font-size:15px;font-weight:600;margin:1.5em 0 .45em}
.md h4{font-size:1em;font-weight:500;margin:1.3em 0 .35em;color:var(--t2)}
.md>:first-child{margin-top:0}
.md p{margin:0 0 16px}
.md strong{font-weight:600}
.md em{font-style:italic;color:var(--t2)}
.md a{color:var(--accent);text-decoration:none}
.md a:hover{text-decoration:underline;text-underline-offset:3px}
.md ul,.md ol{margin:0 0 1.1em;padding-left:1.5em}
.md li{margin:.32em 0}
.md li ul,.md li ol{margin:.32em 0 0}
.md li.task{list-style:none;margin-left:-1.35em;display:flex;gap:.5em;align-items:flex-start}
.md li.task input{margin:.44em 0 0;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.md li.task input:checked+span{color:var(--t3);text-decoration:line-through}
.md del{color:var(--t3)}
.md hr{border:0;height:1px;background:var(--rule-row);margin:2.4em 0}
.md blockquote{margin:0 0 1.1em;padding:.1em 0 .1em 1.1em;color:var(--t2);
  box-shadow:inset 2px 0 0 var(--rule-head)}
.md blockquote p{margin:0 0 .5em}
.md blockquote p:last-child{margin:0}
.md code{background:var(--field);padding:.14em .4em;border-radius:4px;font-size:.88em;
  font-family:var(--mono)}
.md pre{background:var(--field);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 1.15em}
.md pre code{background:none;padding:0;color:var(--t2);font-size:.84em;line-height:1.6}
/* 表格 B：表头 600 ＋ 表头下一道淡线 ＋ 隔行浅底，无竖线，宽表在自己容器里横滚 */
.tw{overflow-x:auto;margin:0 0 1.5em;max-width:100%}
.md table{border-collapse:collapse;width:100%;font-size:.88em;font-variant-numeric:tabular-nums}
.md th{font-size:.92em;font-weight:600;color:var(--t2);text-align:left;
  padding:0 10px 9px;white-space:nowrap;border-bottom:1px solid var(--rule-head)}
.md td{padding:10px;color:var(--t1);vertical-align:top;line-height:1.7}
.md tbody tr:nth-child(odd) td{background:var(--zebra)}
.md tbody tr td:first-child{border-top-left-radius:6px;border-bottom-left-radius:6px}
.md tbody tr td:last-child{border-top-right-radius:6px;border-bottom-right-radius:6px}
.md img{max-width:100%;height:auto;display:block;margin:16px auto;border-radius:6px}
.md img[src$=".svg"]{width:100%}
:root[data-theme="dark"] .md img{background:#f6f6f6;padding:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .md img{background:#f6f6f6;padding:6px}}
.md .imgbad{display:inline-block;padding:2px 8px;border-radius:4px;
  background:var(--field);color:var(--t2);font-size:12px}
/* 长字符串折行。库里正文常带超长飞书 URL、长行内 code、以及「图片没找到：<长地址>」
   这一条提示，不折行的话正文栏自己会横滚（0829 D 路实测最大 453px）。
   用 anywhere 不用 break-word：只有 anywhere 会把 min-content 宽度也算进去，
   inline-block 的 .imgbad 才收得住。
   表格单元格有意不加——宽表该整条横滚，不该把词拆断；pre 保持自身横滚不动。 */
.md p,.md li,.md blockquote,.md h1,.md h2,.md h3,.md h4,
.md code,.md .imgbad{overflow-wrap:anywhere}
.md pre,.md pre code,.md th,.md td{overflow-wrap:normal}
.md a.wl{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
.pane.edit .md p:empty,.pane.edit .md li:empty{min-height:1em}
.pane.edit .md h1:first-child{min-height:1.22em}
/* 空标题 / 空段的占位。绝对定位叠在块上，不占光标位，也不会进 innerText。 */
.pane.edit .md h1[data-ph],
.pane.edit .md p[data-ph]{position:relative}
.pane.edit .md h1[data-ph]::before,
.pane.edit .md p[data-ph]::before{
  position:absolute;left:0;top:0;right:0;
  color:var(--t4);letter-spacing:0;pointer-events:none;user-select:none}
.pane.edit .md h1[data-ph]::before{content:"无标题";font-weight:500}
.pane.edit .md p[data-ph]::before{content:"写点什么…";font-weight:400}
.f-sans{font-family:var(--ui)}
.f-serif{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}
.f-mono{font-family:var(--mono)}
/* 搜索命中点开：跳到命中段并闪一下 */
@keyframes hitflash{0%,70%{background:var(--hl)}100%{background:transparent}}
.md .flash{animation:hitflash 1.4s ease-out 1;border-radius:6px}

/* 文档历史折叠：纯显示层的一层包装，进编辑与存盘对比前整个拆掉。
   包装盒自己带状态，被包住的那张表一个属性都不动。 */
.histbox{margin:0 0 1.5em}
.histbox>.tw{display:none;margin:10px 0 0}
.histbox.open>.tw{display:block}
.histpill{font-size:11px;color:var(--t2);background:var(--field);border-radius:9px;
  padding:3px 9px;white-space:nowrap;transition:background-color .15s ease}
.histpill:hover{background:var(--hover)}

/* 编辑态 */
.pane.edit .md>[data-lock]{position:relative;background:var(--field);border-radius:6px;
  box-shadow:inset 2px 0 0 var(--t3);
  -webkit-user-modify:read-only;user-select:text}
.pane.edit .md>[data-lock]::after{content:"改源码";position:absolute;top:2px;right:2px;
  font-size:11px;color:var(--t2);background:var(--pop);box-shadow:var(--popshadow);
  border-radius:6px;padding:1px 7px;cursor:pointer;opacity:0;transition:opacity .15s ease}
.pane.edit .md>[data-lock]:hover::after{opacity:1}
.pane.edit .md td,.pane.edit .md th{min-width:44px}
.pane.edit .md td:focus,.pane.edit .md th:focus{outline:none;background:var(--hover)}
.md textarea.blk{display:block;box-sizing:border-box;width:100%;
  margin:1em 0;padding:0;border:0;border-radius:0;background:none;color:var(--t1);
  font-family:var(--mono);font-size:.86em;line-height:1.7;letter-spacing:0;
  resize:none;outline:none;overflow:hidden;tab-size:2;-webkit-font-smoothing:inherit}

/* 选中文字浮出的工具条 */
#fmt{position:fixed;z-index:80;display:none;gap:2px;padding:5px 6px;
  background:var(--pop);border-radius:10px;box-shadow:var(--popshadow)}
#fmt.on{display:flex}
#fmt button{min-width:30px;height:28px;padding:0 8px;border-radius:7px;color:var(--t1);
  display:flex;align-items:center;justify-content:center;font-size:13px;white-space:nowrap;
  transition:background-color .15s ease}
#fmt button:hover{background:var(--hover)}
#fmt button.on{background:var(--sel);box-shadow:var(--selshadow)}
#fmt .sep{width:7px}
#fmt b{font-weight:600}
#fmt i{font-style:italic}
#fmt s{text-decoration:line-through}
#fmt code{font-family:var(--mono);font-size:11px}

/* ═══ 浮层：⌘K 直达 / 右键 / 快看 / 设置 / 候选 ═══ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:118}

#cmdkWrap{position:fixed;inset:0;z-index:120;display:none}
#cmdkWrap.on{display:block}
.cmdk{position:absolute;z-index:121;left:50%;transform:translateX(-50%);top:118px;width:560px;
  max-width:calc(100vw - 40px);
  background:var(--pop);border-radius:12px;box-shadow:var(--popbig);padding-bottom:8px;overflow:hidden}
.cmdk .q{padding:16px 20px 13px}
.cmdk .q input{width:100%;border:0;background:none;outline:none;font-size:15px;color:var(--t1)}
.cmdk .q input::placeholder{color:var(--t3)}
.cmdk .rows{max-height:min(52vh,420px);overflow-y:auto}
.krow{height:36px;margin:0 8px;padding:0 12px;border-radius:8px;cursor:default;
  display:flex;align-items:center;gap:14px;transition:background-color .15s ease}
.krow .t{font-size:13px;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .t b{font-weight:600}
.krow .p{font-size:11px;color:var(--t3);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow:hover{background:var(--hover)}
.krow.on{background:var(--sel);box-shadow:var(--selshadow)}

#ctx{position:fixed;z-index:150;display:none;min-width:196px;padding:5px;
  background:var(--pop);border-radius:10px;box-shadow:var(--popshadow)}
#ctx.on{display:block}
#ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 10px;border-radius:7px;font-size:13px;color:var(--t1);white-space:nowrap}
#ctx button:hover{background:var(--accent);color:#fff}
#ctx button[disabled]{opacity:.4;pointer-events:none}
#ctx .sep{height:1px;background:var(--rule-row);margin:5px 8px}

#wlpick{position:fixed;z-index:90;background:var(--pop);border-radius:10px;
  box-shadow:var(--popshadow);padding:5px;display:none;
  max-width:420px;max-height:300px;overflow-y:auto}
#wlpick.on{display:block}
#wlpick button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:7px;
  font-size:13px;color:var(--t1)}
#wlpick button:hover{background:var(--accent);color:#fff}
#wlpick .wp{display:block;font-size:11px;color:var(--t3);margin-top:1px}
#wlpick button:hover .wp{color:#fff;opacity:.85}

#qlwrap{position:fixed;inset:0;z-index:145;display:none;background:var(--scrim);
  align-items:center;justify-content:center;padding:6vh 6vw}
#qlwrap.on{display:flex}
#ql{width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--pop);border-radius:12px;box-shadow:var(--popbig);overflow:hidden}
#qlh{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
#qlt{font-size:13px;font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qlb{flex:1;overflow-y:auto;padding:6px 30px 40px}
#qlb .md{max-width:680px}

#cfgWrap{position:fixed;inset:0;z-index:130;display:none;background:var(--scrim);
  align-items:flex-start;justify-content:center;padding:6vh 20px}
#cfgWrap.on{display:flex}
#viewCfg{width:min(720px,96vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--pop);border-radius:12px;box-shadow:var(--popbig);overflow:hidden}
.cfghead{flex:none;display:flex;align-items:center;gap:10px;padding:18px 22px 6px}
.cfghead .ttl{font-size:15px;font-weight:600;flex:1}
#cfgBody{flex:1;overflow-y:auto;padding:6px 22px 26px}
.cfgsec{margin-top:26px}
.cfgsec:first-child{margin-top:8px}
.cfgh{font-size:11px;font-weight:500;color:var(--t3);margin-bottom:10px}
.cfgrow{display:flex;align-items:center;gap:14px;min-height:32px}
.cfgrow .k{font-size:13px;color:var(--t1);width:76px;flex:none}
.cfgrow .v{font-size:12px;color:var(--t3);flex:none;width:64px;text-align:right;
  font-variant-numeric:tabular-nums}
.cfgrow input[type=range]{flex:1;accent-color:var(--accent)}
.cfgd{font-size:11px;color:var(--t3);margin:0 0 7px;line-height:1.6}
.cfgsec textarea{width:100%;min-height:70px;padding:9px 11px;font-size:12px;line-height:1.7;
  background:var(--field);color:var(--t1);border:0;border-radius:8px;
  outline:none;resize:vertical;font-family:var(--mono)}
.cfgsec .tin{padding:5px 9px;font-size:12px;background:var(--field);border:0;
  border-radius:7px;outline:none;color:var(--t1);width:76px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 14px;font-size:12px;color:var(--t2)}
.kv b{font-weight:400;color:var(--t3)}
.cfgbar{display:flex;gap:10px;align-items:center;margin-top:20px}
.cfgmsg{font-size:11px;color:var(--t3)}

/* 分段控件与普通按钮：凹底＋当前项白块，跟样张同一套 */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--field)}
.seg button{height:26px;padding:0 13px;border-radius:7px;font-size:12px;color:var(--t2);
  white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--segon);color:var(--t1);font-weight:500;box-shadow:var(--segshadow)}
.btn{height:28px;padding:0 13px;border-radius:8px;background:var(--field);
  font-size:12px;color:var(--t1);transition:background-color .15s ease}
.btn:hover{background:var(--hover)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.key{background:var(--accent);color:#fff}
.btn.key:hover{opacity:.88;background:var(--accent)}

/* ═══ 顶部横幅：断线 / 升级 / 冲突 ═══════════
   界面里唯一允许出现的一行字，说的是「现在能不能用、你要做什么」，不是旁白。 */
#banners{position:fixed;top:0;left:0;right:0;z-index:160}
.bnr{display:none;align-items:center;justify-content:center;gap:12px;
  height:33px;padding:0 14px;font-size:12px;color:var(--t2);background:var(--field)}
.bnr.on{display:flex}
.bnr .btn{height:22px;padding:0 10px;font-size:11px;background:var(--pop)}
body.bnr-on #app,body.bnr-on #hub{padding-top:33px}

/* ═══ 窄窗口 ═══════════════════════════════ */
@media(max-width:900px){
  body.lists-on #app{grid-template-columns:0 0 var(--lcw) 0 1fr}
  body.lists-on #side{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);z-index:60;
    box-shadow:var(--popbig);display:none}
  body.lists-on.sideover #side{display:flex}
}
@media(max-width:720px){
  body.lists-on #app{grid-template-columns:0 0 0 0 1fr}
  body.lists-on #listpane{position:fixed;left:0;top:0;bottom:0;width:var(--lcw);z-index:55;
    box-shadow:var(--popbig)}
  .toc{display:none}
  .pane{padding:46px 24px 120px}
  .col{width:calc(100vw - 40px)}
  body.searching .col{width:calc(100vw - 40px)}
}

/* ═══ 独立窗口（solo）═══════════════════════ */
body.solo #side,body.solo #listpane,body.solo .split,body.solo #hub{display:none!important}
body.solo #app{display:grid!important;grid-template-columns:0 0 0 0 1fr}
body.solo .tabbar{display:none!important}

/* ═══ 打印：只出正文 ═══════════════════════
   ⌘P 走壳的 NSPrintOperation，打的是整个 WebView，所以界面得在这里收干净。 */
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  #side,#listpane,.split,#hub,.tabbar,.toc,.listbtn,.editstatus,
  #banners,#ctx,#fmt,#wlpick,#cmdkWrap,#qlwrap,#cfgWrap{display:none!important}
  #app{display:block!important}
  #docpane{position:static;overflow:visible}
  #panes{position:static}
  .pane{position:static;display:none;overflow:visible;padding:0}
  .pane.on{display:block}
  .md{max-width:none}
  .histbox>.tw{display:block!important}
}
</style>
</head>
<body class="nodoc">

<div id="banners">
  <div class="bnr" id="upgrade">
    <span>退出并重新打开 AM·Note 完成升级</span>
  </div>

</div>

<div id="app">

    <div id="dirList"></div>

  </aside>

  <div class="split" id="sp1" role="separator" aria-orientation="vertical" title="拖动调整边栏宽度"></div>

  <div id="listpane">
    <div class="listtop">
      <label class="searchpill sm">
        <i data-ic="search"></i>
        <input id="q2" type="search" autocomplete="off" spellcheck="false" aria-label="搜索整个库">
        <button class="clear" id="qclear2" title="清除"><i data-ic="close"></i></button>
      </label>

      <div class="empty-symbol"><i data-ic="doc-text"></i></div>

    </div>

</div>

<div id="hub">
  <div class="col">
    <label class="searchpill">
      <i data-ic="search"></i>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索整个库">
      <button class="clear" id="qclear" title="清除"><i data-ic="close"></i></button>
    </label>
    <div class="hitline off num" id="qhint"></div>
    <div id="hubbody" tabindex="0" role="listbox" aria-label="文稿列表"></div>
  </div>
</div>

<div id="out" hidden></div>

<div id="cmdkWrap">
  <div class="scrim" id="cmdkScrim"></div>
  <div class="cmdk">
    <div class="q"><input id="ck" type="text" autocomplete="off" spellcheck="false" aria-label="按名字直达"></div>
    <div class="rows" id="ckList"></div>
  </div>

  .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");

function resolveRef(u, base, isImg){
  // inl() 是先 esc() 再跑正则的，所以这里拿到的已经是转义过的文本，先还原
  u = unesc(String(u||'').trim());
  if(!u) return '';
  if(/^(?:[a-z][a-z0-9+.\-]*:|\/\/|#)/i.test(u)){
    // 带 scheme 的、协议相对的、页内锚点：不动。
    // 但 javascript: 这类要挡掉——以前 esc() 先跑、链接正则后跑，
    // [x](javascript:…) 能活着进 href，门户现在跑在原生壳里，别留这个口子。
    const ok = isImg ? /^(?:https?:|data:image\/|\/\/)/i.test(u)
                     : /^(?:https?:|mailto:|#|\/\/)/i.test(u);
    return ok ? u : (isImg ? '' : '#');
  }
  const parts = (u[0]==='/' ? u.slice(1) : (base ? base+'/'+u : u)).split('/');
  const out=[];
  for(const s of parts){
    if(!s || s==='.') continue;
    if(s==='..'){ out.pop(); continue; }
    out.push(s);
  }
  // MD 里可能已经写成 %E5%9B%BE 这种，先解回来再统一编码，免得二次编码
  return url(out.map(s=>{ try{ return decodeURIComponent(s); }catch(e){ return s; } }).join('/'));

  let out = '';

    out += (CJK.test(l) || CJK.test(r)) ? '' : ' ';

      const cut = src.indexOf('\n', e+1)+1;
      off = src.slice(0, cut).split('\n').length - 1;
      src = src.slice(cut);
    }
  }
  /* 行内代码先抽成占位符，跑完图片／链接／加粗／斜体再还原成 <code>。
     以前是就地换成 <code>、图片和链接的正则排在后面，于是行内代码里举例写的
     `![](图示/x.svg)` 会被当成真图片渲染：正文冒出一行「图片没找到」，控制台刷一串 404。
     占位符里不能出现 ` [ ] ( ) * 这些后面几条正则要认的字符，否则轮到它自己被改。
     用私用区的 \uE000：MD 正文里不会有，且写成转义序列还是写成字符都等价，
     不像 \u0000 落成真字节会被 HTML 解析器吞掉。进来先清掉源文里的 \uE000，杜绝撞号。 */
  const inl = t => {
    const code = [];
    return esc(t).replace(/\uE000/g,'')
    .replace(/`([^`]+)`/g,(m,c)=>'\uE000'+(code.push(c)-1)+'\uE000')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,u)=>{
      // data-u 记的是源码里原来写的那串地址。渲染时地址被解成了库根下的绝对路径
      // （不解图片出不来），而写回文件要的是原来那一串；没有它，改一段带图带链接的
      // 正文就会把相对路径换成一长条绝对路径，文件一搬位置就全断。
      const s=resolveRef(u,base,true);
      // 不加 loading="lazy"。库里的图示是 width="100%" 的 SVG，没有固有尺寸，
      // 渲染出来是 0×0；0×0 永远不进视口，lazy 就永远不去加载，死锁（20260817 实测）。
      return s ? `<img src="${esc(s)}" alt="${a}" title="${a}" data-u="${u}">`
               : `<span class="imgbad">图片地址不合法：${a||u}</span>`;
    })
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,a,u)=>
      `<a href="${esc(resolveRef(u,base,false))}" data-u="${u}" target="_blank" rel="noopener">${a}</a>`)
    /* [[题名]]（v15）：按标题或文件名指库内那一份，点了才解析（openWiki）。
       写回时 inlMd 的 A 分支认 data-wl，原样还原成 [[题名]]，不过反解。 */
    .replace(/\[\[([^\[\]\n]{1,80})\]\]/g,(m,n)=>`<a class="wl" data-wl="${n}">${n}</a>`)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    /* 只放行 <br> 这一个标签。库里的表格靠它在格子里换行，以前原样显示成
       「<br>」四个字（README「还没做的」里记着的老问题）。其余裸 HTML 仍当文字。 */
    .replace(/&lt;br\s*\/?&gt;/gi,'<br>')
    .replace(/\uE000(\d+)\uE000/g,(m,n)=>`<code>${code[n]}</code>`);
  };

  const L = src.split('\n'), o=[]; let i=0;
  // 每个块挂上它在原文里的行号区间。块级就地编辑靠这个把改动切回去，
  // 没有它就只能像以前那样整篇换成源码框。
  const push = (html, s, e) =>
    o.push(html.replace(/^<([a-z0-9]+)/i, `<$1 data-l0="${s+off}" data-l1="${e+off}"`));

  while(i<L.length){
    const s0=i, l=L[i];
    // 代码块。原来是先用一个全局正则把 ``` 段整个抠走换成占位符、再按行走，
    // 那样后面每一行的行号都塌了，块级编辑对不回原文。改成在循环里按行吃。
    if(/^\s*```/.test(l)){
      // 语言记进 data-lang。丢了它，改一个 ```js 存回去就变成裸 ```
      const lang=(l.match(/^\s*```\s*(\S*)/)||[])[1]||'';
      const b=[]; i++;
      while(i<L.length && !/^\s*```/.test(L[i])){ b.push(L[i]); i++; }
      if(i<L.length) i++;                       // 吃掉收尾那行 ```
      push(`<pre${lang?` data-lang="${esc(lang)}"`:''}><code>${esc(b.join('\n'))}</code></pre>`, s0, i-1);
      continue;
    }
    if(/^\s*\|/.test(l) && i+1<L.length && /^\s*\|[\s:\-|]+\|\s*$/.test(L[i+1])){
      const cs=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const hd=cs(l);
      // 对齐位记进 data-al。库里 1800 多份带表，右对齐（---:）用得很多，
      // 丢了它，改一格数字整张表就从右对齐塌回左对齐
      const al=cs(L[i+1]).map(s=>{
        const a=/^:/.test(s), b=/:$/.test(s);
        return a&&b?'center':b?'right':a?'left':'';
      });
      const sty=n=>al[n]?` style="text-align:${al[n]}"`:'';
      i+=2; const rs=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){rs.push(cs(L[i]));i++}
      push(`<div class="tw"><table data-al="${esc(al.join(','))}"><thead><tr>`
        +hd.map((c,n)=>`<th${sty(n)}>${inl(c)}</th>`).join('')
        +'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map((c,n)=>`<td${sty(n)}>${inl(c)}</td>`).join('')+'</tr>').join('')
        +'</tbody></table></div>', s0, i-1);
      continue;
    }
    const h=l.match(/^(#{1,4})\s+(.*)$/);
    // 标题 id 走一个只增不减、跨渲染不重置的全局号。
    // 不能用「第几个标题」——收起编辑框时只重渲染中间一段，计数器会从 0 重来，撞号。
    // 也不能用行号——行号会随编辑平移，data-l0 平移得了、已经写死在 id 里的平移不了，
    // 撞号之后篇内目录会跳到另一个标题上。篇内目录每次都从实时 DOM 重建，
    // 所以 id 只要此刻唯一就够，不需要跨渲染稳定。
    if(h){const n=h[1].length; const id='h'+(++HID);
      push(`<h${n} id="${id}">${inl(h[2])}</h${n}>`, s0, i); i++; continue}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){push('<hr>', s0, i); i++; continue}
    if(/^\s*>/.test(l)){const b=[];
      while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++}
      push('<blockquote>'+b.filter(Boolean).map(x=>`<p>${inl(x)}</p>`).join('')+'</blockquote>', s0, i-1);continue}
    // 列表。以前是把连续的列表行拉平成一层，源码里的缩进全丢；现在按缩进建层级，
    // 顺带认 - [ ] / - [x] 勾选框。一个 li 只吃一行——库里没有续行写法，
    // 吃续行会让行号对不回原文。
    if(LIRE.test(l)){
      const rows=[];
      while(i<L.length && LIRE.test(L[i])){
        const m=L[i].match(LIRE);
        rows.push({ind:m[1].replace(/\t/g,'  ').length, ord:!!m[3], num:+m[3]||1, txt:m[4]});
        i++;
      }
      push(listHtml(rows, inl, rows[0].ind), s0, i-1); continue;
    }
    if(l.trim()){const b=[];
      while(i<L.length&&L[i].trim()
            &&!/^\s*(\||#{1,4}\s|>|```)/.test(L[i])
            &&!LIRE.test(L[i])
            &&!/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(L[i])){b.push(L[i].trim());i++}
      if(b.length) push(`<p>${inl(joinLines(b))}</p>`, s0, i-1); else i++;
      continue}
    i++;
  }
  return o.join('\n');
}

/* 列表行 → 嵌套的 ul/ol。层级按缩进值分档，不假定「一层＝两个空格」——
   库里 2 空格和 4 空格两种写法都有。同一层里有序无序混着写，按第一行的类型算，
   这种写法库里没有，真碰上也只是显示成一种，不会掉内容。 */
function listHtml(rows, inl, base){
  const li = r => {
    const m = r.txt.match(/^\[([ xX])\]\s+(.*)$/);
    // 空项塞一个 <br>：contenteditable 里空 <li> 放不进光标。
    // 写回时 inlMd 会丢掉块末 <br>，normHtml 比较也忽略，不进锁块基线。
    return m
      ? `<li class="task"><input type="checkbox"${/[xX]/.test(m[1])?' checked':''}><span>${inl(m[2])||'<br>'}</span></li>`
      : `<li>${inl(r.txt)||'<br>'}</li>`;
  };
  const build = (k, ind) => {
    const ord = rows[k].ord;
    const tag = ord ? 'ol' : 'ul';
    let h = `<${tag}${ord && rows[k].num!==1 ? ` start="${rows[k].num}"` : ''}>`;
    let n = k;
    while(n < rows.length && rows[n].ind >= ind){
      if(rows[n].ind > ind){                       // 更深一层，塞进上一个 li 里
        const sub = build(n, rows[n].ind);
        h = h.replace(/<\/li>$/, sub.html + '</li>');
        n = sub.next;
        continue;
      }
      h += li(rows[n]); n++;
    }
    return {html: h + `</${tag}>`, next: n};
  };
  return build(0, base).html;
}
/* ═══ Markdown ← HTML ═══════════════════
   富文本编辑要把改完的正文写回 markdown，这一段就是那个反向器。

   **它只认 md2html 自己生成的那套结构**，别的一概不猜。外面粘进来的 HTML
   在入口处就被拦掉了（见 onPaste：只收纯文本，按 markdown 解析），
   所以这里遇到的永远是自己刚渲染出来的东西。

   安全边界不靠这个反向器本身，靠三道：
     ① 进编辑时逐块自检（safeBlock）：反解→重渲染，跟原样对不上的块直接锁住，
        只能点开源码改，跟 v10 一模一样的老路；
     ② 没动过的块不反解，原样抄源码字节（见 serializeBody 的 registry）；
     ③ 存盘前再自检一次（verifyDirty），改出歧义会先拦一次。 */

function inlMd(node){
  let out = '';
  node.childNodes.forEach(n => {
    if(n.nodeType === 3){ out += n.nodeValue; return; }
    if(n.nodeType !== 1) return;
    const t = n.tagName;
    if(t === 'BR'){ out += '<br>'; return; }
    if(t === 'IMG'){ out += `![${n.getAttribute('alt')||''}](${n.dataset.u || n.getAttribute('src') || ''})`; return; }
    if(t === 'A'){
      // [[题名]] 原样写回，别把它降级成普通链接——那会把「按名找」变成死路径
      if(n.dataset.wl!==undefined){ out += `[[${n.dataset.wl}]]`; return; }
      out += `[${inlMd(n)}](${n.dataset.u || n.getAttribute('href') || ''})`; return; }
    if(t === 'CODE'){ out += '`' + n.textContent + '`'; return; }
    if(t === 'STRONG' || t === 'B'){ const s=inlMd(n); out += s.trim()?'**'+s+'**':s; return; }
    if(t === 'EM' || t === 'I'){ const s=inlMd(n); out += s.trim()?'*'+s+'*':s; return; }
    if(t === 'DEL' || t === 'S' || t === 'STRIKE'){ const s=inlMd(n); out += s.trim()?'~~'+s+'~~':s; return; }
    if(t === 'INPUT') return;                       // 勾选框在 liMd 里单独处理
    out += inlMd(n);                                // span 之类的壳：只取里面的字
  });
  // 块末尾那个 <br> 不写出去。浏览器在空段落里塞它当光标位，显示上等于没有；
  // 写进文件就会在正文里留一串字面上的「<br>」。
  return out.replace(/(?:<br>)+$/, '');
}

function tableMd(tb){
  if(!tb) return '';
  const al = (tb.dataset.al || '').split(',');
  const rows = [...tb.rows].map(r => [...r.cells].map(c => inlMd(c).trim()));
  if(!rows.length) return '';
  const n = Math.max(...rows.map(r => r.length));
  const fill = cs => cs.concat(Array(Math.max(0, n - cs.length)).fill(''));
  const line = cs => '| ' + fill(cs).join(' | ') + ' |';
  const sep = Array.from({length:n}, (_,k) => {
    const a = al[k] || '';
    return a==='center' ? ':---:' : a==='right' ? '---:' : a==='left' ? ':---' : '---';
  });
  return [line(rows[0]), '| ' + sep.join(' | ') + ' |', ...rows.slice(1).map(line)].join('\n');
}

function listMd(list, ind){
  const ord = list.tagName === 'OL';
  let n = +(list.getAttribute('start') || 1);
  const out = [];
  [...list.children].forEach(li => {
    if(li.tagName !== 'LI') return;
    const cb = li.querySelector(':scope > input[type=checkbox]');
    const subs = [...li.children].filter(c => c.tagName==='UL' || c.tagName==='OL');
    const clone = li.cloneNode(true);
    [...clone.children].forEach(c => {
      if(c.tagName==='UL' || c.tagName==='OL' || c.tagName==='INPUT') c.remove();
    });
    const mark = ord ? (n++) + '.' : '-';
    out.push(ind + mark + ' ' + (cb ? '[' + (cb.checked?'x':' ') + '] ' : '') + inlMd(clone).trim());
    subs.forEach(s => out.push(listMd(s, ind + '  ')));
  });
  return out.join('\n');
}

/* 一个顶层块 → markdown。返回的不带块与块之间的空行，那个由 serializeBody 管。 */
function blkMd(el){
  if(!el || el.nodeType !== 1) return '';
  const t = el.tagName;
  if(/^H[1-6]$/.test(t)) return '#'.repeat(Math.min(4, +t[1])) + ' ' + inlMd(el).trim();
  if(t === 'HR') return '---';
  if(t === 'PRE'){
    const code = el.querySelector('code');
    const body = (code ? code.textContent : el.textContent).replace(/\n$/, '');
    return '```' + (el.dataset.lang || '') + '\n' + body + '\n```';
  }
  if(t === 'BLOCKQUOTE'){
    const ps = [...el.children];
    return (ps.length ? ps : [el]).map(c => '> ' + inlMd(c).trim()).join('\n');
  }
  if(t === 'UL' || t === 'OL') return listMd(el, '');
  if(t === 'TABLE') return tableMd(el);
  if(t === 'DIV' && el.classList.contains('tw')) return tableMd(el.querySelector('table'));
  // 顶层裸 <img>。光标停在段首或段末时，浏览器的 insertHTML 会把图甩出段落、
  // 直接挂到正文根上（Chromium 和 WKWebView 都这样）。img 没有子节点，走下面那条
  // inlMd 会得到空串，序列化时被当空块丢掉——屏幕上看得见，存进文件就没了。
  // 正常路径由 settleImg 当场把它包回 <p>，这条是兜底：不让任何一条路静默丢图。
  if(t === 'IMG')
    return `![${el.getAttribute('alt')||''}](${el.dataset.u || el.getAttribute('src') || ''})`;
  // P，以及浏览器在 contenteditable 里自己造出来的 DIV
  return inlMd(el).trim();
}

/* 比两段 HTML 是不是同一个东西。行号、块号、脏标记、标题 id 都是运行时贴上去的，
   不参与比较；贴着标签的那些空白也不算——库里很多行末尾挂着两个空格
   （别处 markdown 的「硬换行」写法，这里的渲染器不认，显示上等于没有）。
   词与词中间的空白照比，代码块里的缩进和换行也照比。 */
function normHtml(h){
  return String(h)
    .replace(/\s(data-(l0|l1|bid|dirty|lock|ph)|contenteditable|id)="[^"]*"/g, '')
    // 块末尾那一个 <br> 不参与比较：浏览器拿它当光标位，显示上等于没有，
    // inlMd 出口处本来就不写出去。留着比会让「按一次换行再贴图」这种正常操作
    // 在存盘自检里报一次假警。连着两个以上是真的空行，照旧比，报警是对的。
    .replace(/<br\s*\/?>(?=<\/(?:p|li|td|th|h[1-6]|blockquote|div)>|$)/i, '')
    .replace(/>\s+/g, '>')
    .replace(/\s+</g, '<')
    .trim();
}

/* 这一块能不能当富文本改：反解成 markdown 再渲染回来，跟现在长得一模一样才算能。
   对不上的（裸 HTML、认不出的表格写法、md2html 覆盖不到的语法）就锁住，
   只能点「改源码」按源码改——那是 v10 走的老路，不会有人被改坏。 */
function safeBlock(el, base){
  try{
    const md = blkMd(el);
    if(!md.trim()) return false;
    const box = document.createElement('div');
    box.innerHTML = md2html(md, base, 0);
    return box.children.length === 1 && normHtml(box.innerHTML) === normHtml(el.outerHTML);
  }catch(e){ return false; }
}

/* ── 标签页 ─────────────────────────────
   MD 都在门户里开，不弹新窗口。每个标签一个 pane，自己滚自己的，切回来还在原来的位置。
   两份以上才出标签栏。 */
const MAXTAB = 12;
let TABS = [], curTab = null, tabSeq = 0;

const paneOf = t => document.getElementById('pane-'+t.id);
const active = () => TABS.find(t=>t.id===curTab) || null;

function drawTabs(){
  const bar=$('#tabbar');
  const on = TABS.length>=2 && !SOLO;
  bar.classList.toggle('on', on);
  document.body.classList.toggle('tabs-on', on);
  if(!on){ bar.innerHTML=''; return; }
  bar.innerHTML = TABS.map(t=>
    `<div class="tab${t.id===curTab?' on':''}" data-id="${t.id}" title="${esc(t.path)}">
       <span class="tt">${esc(t.title)}</span>
       <button class="tx" data-close="${t.id}" title="关掉">${icon('close',11)}</button>
     </div>`).join('');
  $$('#tabbar .tab').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-close]')) return;
    showTab(el.dataset.id);
  });
  $$('#tabbar [data-close]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeTab(b.dataset.close);
  });
}

function showTab(id){
  const t=TABS.find(x=>x.id===id); if(!t) return;
  const prev=active();
  if(prev && prev.id!==id && prev.editing) flushSave(prev);   // 切文档强制落盘
  curTab=id;
  $$('#panes .pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+id));
  // 编辑区的判据看的是 #doc，所以 id 跟着当前这一份走
  $$('#panes .md').forEach(m=>m.removeAttribute('id'));
  const md=paneOf(t) && paneOf(t).querySelector('.md');
  if(md) md.id='doc';
  drawTabs(); buildToc(); syncProg(); syncBar();
  pushState();
}

function closeTab(id){
  const i=TABS.findIndex(t=>t.id===id); if(i<0) return;
  const t=TABS[i];
  if(t.editing) flushSave(t);                       // 关标签强制落盘
  if(dirty(t) && !ask(`要关掉「${t.title||''}」吗？`,'改动还没保存，关掉就丢了。','不保存并关闭','取消',true)) return;
  const p=paneOf(t); if(p) p.remove();
  if(t.blobs) t.blobs.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
  TABS.splice(i,1);
  if(!TABS.length){ curTab=null; drawTabs(); leaveReader(); return; }
  showTab(curTab===id ? TABS[Math.min(i,TABS.length-1)].id : curTab);
}

function newPane(t){
  const p=document.createElement('div');
  p.id='pane-'+t.id;
  p.className='pane';
  // 渲染稿和源码框都留在 pane 里，靠 .edit 切换谁露出来
  p.innerHTML='<div class="md f-sans"></div>'
    + '<textarea class="ed" spellcheck="false" autocomplete="off"></textarea>';
  p.addEventListener('scroll', ()=>{ if(t.id===curTab) syncProg(); }, {passive:true});
  const md0=p.querySelector('.md');
  // 阅读态点链接：指向库内 md / html 的在门户里开新标签；
  // [[题名]] 按标题 / 文件名解析，多个候选弹一列挑。编辑态不拦——点击是在放光标。
  md0.addEventListener('click', e=>{
    if(t.editing) return;
    const hp=e.target.closest('.histpill');
    if(hp){ const box=hp.closest('.histbox'); if(box) box.classList.toggle('open'); return; }
    const a=e.target.closest('a'); if(!a || !md0.contains(a)) return;
    if(a.dataset.wl!==undefined){ e.preventDefault(); openWiki(a.dataset.wl, e); return; }
    const rel=libRel(a.dataset.u||'', dirOf(t.path));
    if(rel){ e.preventDefault(); openByPath(rel); }
  });
  /* 双击进编辑：阅读态双击正文任意块 → 进编辑，光标落在双击的那个位置。
     先把「第几块、块内第几个字符」记下来，进编辑要重画一次，按这两个数找回来。 */
  md0.addEventListener('dblclick', e=>{
    if(t.editing || !canEditPath(t.path) || t.ext) return;
    const blk=e.target.closest('.md>*');
    if(!blk || blk.parentElement!==md0) return;
    e.preventDefault();
    startEdit({block:[...md0.children].indexOf(blk), at:offsetAtPoint(blk, e)});
  });
  // ⌘E 要把光标放到「鼠标正停着的那一块」，所以边读边记
  md0.addEventListener('mouseover', e=>{
    const b=e.target.closest && e.target.closest('.md>*');
    if(b && b.parentElement===md0) t.hover=b;
  });
  // 正文本身就是编辑区，打字直接落在这上面。这里只挂几件浏览器不管的事。
  md0.addEventListener('keydown', e=>{ if(t.editing && !p.classList.contains('src')) edKey(t, e); });
  md0.addEventListener('input', e=>{
    if(!t.editing || p.classList.contains('src')) return;
    syncPh(t);
    if(!COMPOSING) tryMdShortcut(t);
  });
  md0.addEventListener('paste', e=>{ if(t.editing && !p.classList.contains('src')) onPaste(t, e); });
  md0.addEventListener('click', e=>{
    if(!t.editing || p.classList.contains('src')) return;
    // 勾选框。浏览器自己会切 checked，但不动 attribute，这里补上那一半
    const cb=e.target.closest('input[type=checkbox]');
    if(cb){
      /* 浏览器在派发 click **之前**就把 checked 翻好了。这里只把翻好的状态同步到
         attribute 上（存盘要靠 outerHTML 比对，比的是 attribute），
         不要再取反、也不要 preventDefault——那两句合起来等于每次点击都还原回去，
         框永远点不动（0829 D 路实测时序）。 */
      if(cb.checked) cb.setAttribute('checked',''); else cb.removeAttribute('checked');
      const blk=cb.closest('.md>*'); if(blk) blk.dataset.dirty='1';
      t.touched=true; autoKick(t);
      return;
    }
    // 锁住的块：右上角那个「改源码」
    const lk=e.target.closest('[data-lock]');
    if(lk){
      const r=lk.getBoundingClientRect();
      if(e.clientX>r.right-72 && e.clientY<r.top+26) openSrcBlk(t, lk);
    }
  });
  md0.addEventListener('dblclick', e=>{
    if(!t.editing || p.classList.contains('src')) return;
    const lk=e.target.closest('[data-lock]');
    if(lk){ e.preventDefault(); openSrcBlk(t, lk); }
  });
  // 点正文下方那片留白＝在文末补一段
  p.addEventListener('mousedown', e=>{
    if(!t.editing || p.classList.contains('src')) return;
    if(e.target.closest('textarea')) return;
    const mdEl=p.querySelector('.md'), last=mdEl.lastElementChild;
    if(!last || e.clientY < last.getBoundingClientRect().bottom) return;
    e.preventDefault();
    if(last.tagName==='P' && !last.textContent.trim()){ caretEnd(last); return; }
    const np=document.createElement('p'); np.dataset.dirty='1';
    mdEl.appendChild(np); caretEnd(np); t.touched=true; autoKick(t);
  });
  p.oncontextmenu=e=>docMenu(e, t);
  const ta=p.querySelector('.ed');
  ta.addEventListener('input', ()=>{
    t.work=ta.value; t.touched=true; autoKick(t);
  });
  ta.addEventListener('keydown', e=>{
    if(e.key==='Tab'){                       // 列表缩进要用得上，别让 Tab 跳走焦点
      e.preventDefault();
      const s=ta.selectionStart, x=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(x);
      ta.selectionStart=ta.selectionEnd=s+2;
    }
  });
  $('#panes').appendChild(p);
}

/* 双击处在这一块里是第几个字符。进编辑要重画一次，按这个数把光标放回去。
   命中判定不到（点在浮层上、内核不给 caretRangeFromPoint）就返回 undefined，
   让上面退回「光标放这一块末尾」——别退成块首，那等于把光标甩到句子最前面。 */
function offsetAtPoint(blk, e){
  let r=null;
  try{
    if(document.caretRangeFromPoint) r=document.caretRangeFromPoint(e.clientX, e.clientY);
    else if(document.caretPositionFromPoint){
      const c=document.caretPositionFromPoint(e.clientX, e.clientY);
      if(c){ r=document.createRange(); r.setStart(c.offsetNode, c.offset); }
    }
  }catch(err){}
  if(!r || !blk.contains(r.startContainer)) return undefined;
  try{
    const pre=r.cloneRange();
    pre.selectNodeContents(blk); pre.setEnd(r.startContainer, r.startOffset);
    return pre.toString().length;
  }catch(err){ return undefined; }
}
/* 光标落到某一块里第 n 个字符处 */
function caretAtOffset(el, n){
  if(!el) return false;
  const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let seen=0, node=null, off=0, x;
  while((x=w.nextNode())){
    const end=seen+x.nodeValue.length;
    if(n<=end){ node=x; off=n-seen; break; }
    seen=end; node=x; off=x.nodeValue.length;
  }
  try{
    const r=document.createRange();
    if(node) r.setStart(node, Math.max(0, Math.min(off, node.nodeValue.length)));
    else { r.selectNodeContents(el); r.collapse(false); }
    r.collapse(true);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    return true;
  }catch(e){ return false; }
}

/* 打开文档＝正文栏出现。列表与边栏收放是另一件事（lists-on）。 */
function enterReader(){ document.body.classList.remove('nodoc'); pushState(); }
function leaveReader(){
  document.body.classList.add('nodoc');
  post({type:'doc', title:null, path:null});
  post({type:'canedit', on:false});
  render(); pushState();
}

/* md 在门户里读，其余一律交给系统默认程序——html 就是 Chrome。 */
async function openDoc(it, opt){
  if(!it) return;
  opt=opt||{};
  if((it.类型||'md')!=='md'){ openExternal(it.路径); return; }
  ST.lastPath=it.路径;
  saveST();
  const old=TABS.find(t=>t.path===it.路径 && !t.ext);
  if(old){ enterReader(); showTab(old.id); if(opt.jump) flashHit(old, opt.jump); return; }
  if(!IS_HTTP) return;                       // 双击 HTML 直接开时读不了本地文件

  const t={id:'t'+(++tabSeq), path:it.路径, title:it.标题||it.路径, type:'md'};
  TABS.push(t); newPane(t);
  if(TABS.length>MAXTAB) closeTab(TABS[0].id);
  enterReader(); showTab(t.id);
  await loadMd(t);
  if(opt.jump) flashHit(t, opt.jump);
}

/* ── 按路径 / 题名打开 ──────────────────── */
function openByPath(rel){
  if(!rel) return;
  if(rel[0]==='/' ){
    const root=LIBROOT ? LIBROOT.replace(/\/$/,'')+'/' : '';
    if(root && rel.startsWith(root)) return openByPath(rel.slice(root.length));
    if(/\.md$/i.test(rel)) return openExtPath(rel);
    tell('打不开','库外的文件只能读 .md：'+rel);
    return;
  }
  const it=items.find(i=>i.路径===rel);
  if(it) return openDoc(it);
  const md=/\.md$/i.test(rel);
  return openDoc({路径:rel, 标题:rel.split('/').pop(), 类型:md?'md':'other'});
}

/* md 里写的地址是不是指库内的 md / html。是就还原成库根相对路径。 */
function libRel(u, base){
  u=String(u||'').trim();
  if(!u || /^(?:[a-z][a-z0-9+.\-]*:|\/\/|#)/i.test(u)) return null;
  u=u.split('#')[0].split('?')[0];
  if(!/\.(md|html)$/i.test(u)) return null;
  const parts=(u[0]==='/' ? u.slice(1) : (base ? base+'/'+u : u)).split('/');
  const out=[];
  for(let s of parts){
    if(!s || s==='.') continue;
    if(s==='..'){ if(!out.length) return null; out.pop(); continue; }
    try{ s=decodeURIComponent(s); }catch(e){}
    out.push(s);
  }
  return out.length ? out.join('/') : null;
}

/* [[题名]] 解析：先跟标题精确对，再跟文件名主干对，再退到包含匹配。 */
function wikiMatches(name){
  const n=name.trim().toLowerCase();
  if(!n) return [];
  const stem=p=>p.split('/').pop().replace(/\.(md|html)$/i,'').toLowerCase();
  const exact=items.filter(i=>(i.标题||'').toLowerCase()===n || stem(i.路径)===n);
  if(exact.length) return exact;
  return items.filter(i=>(i.标题||'').toLowerCase().includes(n) || stem(i.路径).includes(n))
              .slice(0,12);
}
function openWiki(name, e){
  const c=wikiMatches(name);
  if(!c.length){ flash(`库里没有叫「${name}」的产出`); return; }
  if(c.length===1) return openDoc(c[0]);
  let pk=$('#wlpick');
  if(!pk){ pk=document.createElement('div'); pk.id='wlpick'; document.body.appendChild(pk);
    document.addEventListener('click', ev=>{ if(!pk.contains(ev.target)) pk.classList.remove('on'); }, true); }
  pk.innerHTML=c.map((i,ix)=>`<button data-ix="${ix}">${esc(i.标题)}<span class="wp">${esc(i.路径)}</span></button>`).join('');
  pk.querySelectorAll('button').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); pk.classList.remove('on'); openDoc(c[+b.dataset.ix]); });
  pk.classList.add('on');
  const x=Math.min(innerWidth-pk.offsetWidth-10, (e&&e.clientX)||60);
  const y=Math.min(innerHeight-pk.offsetHeight-10, ((e&&e.clientY)||60)+12);
  pk.style.left=Math.max(8,x)+'px'; pk.style.top=Math.max(8,y)+'px';
}

/* Agent 让门户打开某份时可以带一个锚点：跳到含这段文字的标题上。 */
function scrollToHeading(txt){
  const t=active(); if(!t || t.type!=='md' || !txt) return;
  const p=paneOf(t); if(!p) return;
  const h=[...p.querySelectorAll('.md h1,.md h2,.md h3,.md h4')]
    .find(el=>(el.textContent||'').includes(txt));
  if(h) p.scrollTop=Math.max(0, h.offsetTop-16);
}

/* 从搜索结果点开：跳到第一个命中段，闪一下就还原。 */
function flashHit(t, ts){
  if(!t || !ts || !ts.length) return;
  const p=paneOf(t); if(!p) return;
  const md=p.querySelector('.md');
  const low=x=>String(x||'').toLowerCase();
  const blk=[...md.children].find(el=>ts.every(w=>low(el.textContent).includes(w)))
        || [...md.children].find(el=>ts.some(w=>low(el.textContent).includes(w)));
  if(!blk) return;
  p.scrollTop=Math.max(0, blk.offsetTop-90);
  blk.classList.add('flash');
  setTimeout(()=>blk.classList.remove('flash'), 1500);
}

/* 图片取不到时把 <img> 换成一行带路径的提示——MD 里图片路径写错是常事。 */
function wireImg(root){
  root.querySelectorAll('img').forEach(im => im.addEventListener('error', () => {
    const s = document.createElement('span');
    s.className = 'imgbad';
    let p = im.getAttribute('src') || '';
    try{ p = decodeURI(p); }catch(e){}
    s.textContent = '图片没找到：' + p;
    im.replaceWith(s);
  }, {once:true}));
}

function renderMd(el, src, base){
  el.innerHTML = md2html(src, base);
  wireImg(el);
}

async function loadMd(t){
  const p=paneOf(t); if(!p) return;
  const md=p.querySelector('.md');
  try{
    const r=await fetch(url(t.path)); if(!r.ok) throw 0;
    t.raw=await r.text();
    renderMd(md, t.raw, dirOf(t.path));
    decorateHistory(md);
  }catch(err){
    md.textContent='';
    tell('读不出这一份', IS_HTTP ? '服务没应答。' :
      '浏览器不允许网页读本地文件。从 Dock 上的 AM·Note 图标进来就能读。\n\n'+LIBROOT+'/'+t.path);
  }
  applyPref();
  if(t.id===curTab){ buildToc(); syncProg(); syncBar(); }
}

/* ── 库外文档（只读）────────────────────
   壳递进来的库外路径、拖进来的库外 .md：走 /__extopen 登记，
   /__extdoc 取原文，图片走 /__extasset 用 fetch 带口令取回来转 blob。
   不进最近、不进索引、不可编辑。 */
async function openExtPath(abs){
  if(!abs) return;
  if(!IS_HTTP){ tell('打不开','要服务在跑。双击 AM·Note.app 打开就行。'); return; }
  const old=TABS.find(t=>t.ext && t.abs===abs);
  if(old){ enterReader(); showTab(old.id); return; }
  let r;
  try{
    r=await (await fetch('/__extopen',{method:'POST', headers:hdrs(),
      body:JSON.stringify({路径:abs})})).json();
  }catch(e){ tell('打不开','服务没应答'); return; }
  if(!r || !r.ok){ tell('打不开', (r&&r.错误)||'这个文件读不了'); return; }
  const t={id:'t'+(++tabSeq), path:abs, abs:abs, extId:r.id, ext:true,
           title:r.名称||abs.split('/').pop(), type:'md', noEdit:true, blobs:[]};
  TABS.push(t); newPane(t);
  if(TABS.length>MAXTAB) closeTab(TABS[0].id);
  enterReader(); showTab(t.id);
  await loadExt(t);
}

async function loadExt(t){
  const p=paneOf(t); if(!p) return;
  const md=p.querySelector('.md');
  try{
    // 这条 GET 也要带口令（契约里 ext 系两条都要），返回是 JSON 信封不是裸 markdown
    const r=await fetch('/__extdoc?id='+encodeURIComponent(t.extId),
                        {cache:'no-store', headers:hdrs()});
    if(!r.ok) throw 0;
    const j=await r.json();
    if(!j || !j.ok) throw 0;
    t.raw=j.正文||'';
    md.innerHTML = md2html(t.raw, '');
    // 库外的图不能用 <img src> 直连（要带口令），先把地址摘掉再逐张换成 blob
    const ims=[...md.querySelectorAll('img[data-u]')];
    ims.forEach(im=>im.removeAttribute('src'));
    wireImg(md);
    ims.forEach(async im=>{
      const u=im.dataset.u||'';
      if(/^(?:https?:|data:)/i.test(u)){ im.src=u; return; }
      try{
        const rr=await fetch('/__extasset?id='+encodeURIComponent(t.extId)
                             +'&rel='+encodeURIComponent(u), {headers:hdrs()});
        if(!rr.ok) throw 0;
        const b=URL.createObjectURL(await rr.blob());
        t.blobs.push(b); im.src=b;
      }catch(e){
        const s=document.createElement('span');
        s.className='imgbad'; s.textContent='图片没找到：'+u;
        im.replaceWith(s);
      }
    });
    decorateHistory(md);
  }catch(e){
    md.textContent='';
    tell('读不出这一份','库外文件读取失败');
  }
  applyPref();
  if(t.id===curTab){ buildToc(); syncProg(); syncBar(); }
}

/* ── 文档历史折叠 ───────────────────────
   正文第一张「版本 / 日期 / 修改人」表折成一颗胶囊，点了展开。
   **纯显示层**：被折的那张表一个属性都不动，只是被搬进一个包装盒；
   进编辑与存盘对比前先 undecorate 拆回去，DOM 跟渲染出来时一模一样。
   （0827 v27 的教训：undecorate 擦不干净，一个 style="" 都过不了自检。） */
const HISTHEAD=[/版本/, /日期/, /修改人|修改者|变更人/];
function isHistTable(tw){
  const tb=tw.querySelector('table'); if(!tb) return 0;
  const th=[...tb.querySelectorAll('thead th')].map(x=>(x.textContent||'').trim());
  if(th.length<3) return 0;
  const line=th.join(' ');
  if(!HISTHEAD.every(re=>re.test(line))) return 0;
  return (tb.tBodies[0]||tb).rows.length;
}
function decorateHistory(md){
  if(!md || md.getAttribute('contenteditable')==='true') return;
  for(const el of [...md.children]){
    if(el.nodeType!==1 || !el.classList.contains('tw')) continue;
    const n=isHistTable(el);
    if(!n) continue;
    const box=document.createElement('div');
    box.className='histbox';
    box.setAttribute('data-hist-deco','1');
    const pill=document.createElement('button');
    pill.className='histpill num';
    pill.textContent=`文档历史 · ${n} 版`;
    el.replaceWith(box);
    box.appendChild(pill);
    box.appendChild(el);
    break;                         // 只折第一张
  }
}
function undecorateHistory(md){
  if(!md) return;
  md.querySelectorAll('.histbox[data-hist-deco]').forEach(box=>{
    const tw=box.querySelector(':scope > .tw');
    if(tw) box.replaceWith(tw); else box.remove();
  });
}

/* ── 篇内目录：右侧短横线轨道 ───────────── */
function heads(){
  const t=active(); if(!t||t.type!=='md') return [];
  const p=paneOf(t); return p?[...p.querySelectorAll('.md h2, .md h3')]:[];
}
function buildToc(){
  const hs=heads();
  const on=hs.length>=2;
  const el=$('#toc');
  el.classList.toggle('hide', !on);
  el.innerHTML = on ? hs.map(h=>
    `<div class="tick${h.tagName==='H3'?' h3':''}" data-id="${h.id}">`
    + `<span class="lab">${esc(h.textContent)}</span><i class="bar"></i></div>`).join('') : '';
  el.querySelectorAll('.tick').forEach(a=>a.onclick=()=>{
    const t=active(), p=t&&paneOf(t);
    const h=p&&p.querySelector('#'+CSS.escape(a.dataset.id));
    if(h) p.scrollTo({top:Math.max(0,h.offsetTop-24), behavior:'smooth'});
  });
  syncToc();
}
function syncProg(){
  const t=active(), p=t&&paneOf(t);
  if(!p||t.type!=='md') return;
  let cur=null;
  heads().forEach(h=>{ if(h.offsetTop-80<=p.scrollTop) cur=h.id; });
  $$('#toc .tick').forEach(a=>a.classList.toggle('on', a.dataset.id===cur));
}
function syncToc(){ document.body.classList.toggle('toc-pin', !!ST.toc); }

/* ── 列表与边栏收放 ─────────────────────
   打开文档默认纯正文。这个开关只在当次会话内保持，重开回纯正文。 */
let LISTS=false;
function setLists(on){
  LISTS=!!on;
  document.body.classList.toggle('lists-on', LISTS);
  if(LISTS) mountOut('#listbody'); else if(document.body.classList.contains('nodoc')) mountOut('#hubbody');
  /* 关掉列表也要重画。上一版只在打开时 render，#out 里那列最近文件
     会被原样搬回首页，居中布局装不下，搜索框就顶进标题栏。 */
  render();
  syncNative();
}
function toggleLists(){
  if(!LISTS && document.body.classList.contains('nodoc')){ setLists(true); return; }
  setLists(!LISTS);
}
/* 行都画在同一个 #out 里，按当下这一屏挂到窄栏还是列表栏。
   只有一套行渲染、一套键盘、一套右键，四态之间不会走样。 */
function mountOut(sel){
  const host=$(sel), out=$('#out');
  if(!host || !out) return;
  out.hidden=false;
  if(out.parentElement!==host) host.appendChild(out);
}
function listHost(){
  return (document.body.classList.contains('nodoc') && !LISTS) ? '#hubbody' : '#listbody';
}

/* 块台账。每一块在原文里是哪几行（src），和下一块之间隔着哪几行（gap）。
   头（frontmatter 和它后面的空行）和尾（末尾的空行）单独留着，原样带出去。
   这三样拼起来一定等于进来时的 t.work，一个字节不差。 */
function buildRegistry(t){
  const md=paneOf(t).querySelector('.md');
  const lines=t.work.split('\n');
  const els=[...md.children].filter(e=>e.nodeType===1 && e.hasAttribute('data-l0'));
  const reg={head:[], tail:[], blocks:[]};
  if(!els.length){ reg.head=lines; return (t.reg=reg); }
  reg.head=lines.slice(0, +els[0].getAttribute('data-l0'));
  els.forEach((el,k)=>{
    const l0=+el.getAttribute('data-l0'), l1=+el.getAttribute('data-l1');
    const nx=els[k+1] ? +els[k+1].getAttribute('data-l0') : null;
    reg.blocks.push({src:lines.slice(l0,l1+1), gap:nx===null?null:lines.slice(l1+1,nx)});
    el.dataset.bid=k;
    delete el.dataset.dirty;
  });
  reg.tail=lines.slice(+els[els.length-1].getAttribute('data-l1')+1);
  return (t.reg=reg);
}

/* 正文 DOM → 整份文件的文本。顺序完全按 DOM 走，
   所以删一块、在中间插一块、把一段拆成两段都对得上。 */
function serializeBody(t){
  const p=paneOf(t); if(!p || !t.reg) return t.work;
  const md=p.querySelector('.md'), reg=t.reg, ent=[];
  [...md.children].forEach(el=>{
    if(el.nodeType!==1 || el.tagName==='TEXTAREA') return;
    const bid=el.dataset.bid;
    const keep = bid!==undefined && reg.blocks[+bid] && !el.dataset.dirty;
    const src = keep ? reg.blocks[+bid].src : blkMd(el).split('\n');
    if(!src.join('').trim()) return;                  // 空块不写出去
    ent.push({bid: bid===undefined?null:+bid, src});
  });
  const out=reg.head.slice();
  ent.forEach((e,k)=>{
    if(k){
      const pv=ent[k-1].bid;
      // 原来就前后挨着的两块，中间那几行空白原样保留；别的情况给一个空行
      const g=(pv!==null && e.bid===pv+1 && reg.blocks[pv]) ? reg.blocks[pv].gap : null;
      out.push(...(g||['']));
    }
    out.push(...e.src);
  });
  out.push(...reg.tail);
  return out.join('\n');
}

/* 编辑期间判「有没有改动」：把正文序列化出来跟磁盘那一版比。
   逐字符敲的时候不跑这个（太贵），顶栏那行提示看的是 t.touched。 */
const dirty = t => !!(t && t.editing && t.touched && serializeBody(t)!==t.raw);
/* ── DOM 洗白 ───────────────────────────
   浏览器在 contenteditable 里造出来的东西不完全是我们渲染的那一套：加粗给的是 <b>、
   斜体是 <i>，撤销和拖动还会塞 <span style> 和 <font>。每次改完把这一块洗回
   我们自己的形状，序列化和自检才有一个稳定的比较基准。 */
const UNWRAP={SPAN:1, DIV:1, FONT:1, U:1, SMALL:1, BIG:1};
const RETAG={B:'strong', I:'em', STRIKE:'del', S:'del'};

function cleanBlock(el){
  if(!el || el.nodeType!==1) return el;
  // 顶层被浏览器造成了 div（某些情况下回车会给 div），按正文段落算
  if(el.tagName==='DIV' && !el.classList.contains('tw')){
    const p=document.createElement('p');
    while(el.firstChild) p.appendChild(el.firstChild);
    [...el.attributes].forEach(a=>p.setAttribute(a.name,a.value));
    el.replaceWith(p); el=p;
  }
  el.querySelectorAll('b,i,s,strike,u,font,span,div,h5,h6').forEach(n=>{
    if(n.tagName==='SPAN' && n.parentElement && n.parentElement.classList.contains('task')) return;
    if(n.tagName==='SPAN' && n.classList.contains('imgbad')) return;
    const to=RETAG[n.tagName];
    if(to){
      const r=document.createElement(to);
      while(n.firstChild) r.appendChild(n.firstChild);
      n.replaceWith(r);
    }else if(UNWRAP[n.tagName] || /^H[56]$/.test(n.tagName)){
      const f=document.createDocumentFragment();
      while(n.firstChild) f.appendChild(n.firstChild);
      n.replaceWith(f);
    }
  });
  // 浏览器随手贴的 style / class 一律去掉。表格格子的 text-align 是我们自己按
  // 对齐位生成的，留着；li.task、div.tw、span.imgbad 三个 class 同理。
  el.querySelectorAll('[style],[class],[align],[color],[face],[dir]').forEach(n=>{
    if(!/^(TD|TH)$/.test(n.tagName)) n.removeAttribute('style');
    if(!(n.tagName==='LI'&&n.classList.contains('task'))
       && !n.classList.contains('tw') && !n.classList.contains('imgbad')) n.removeAttribute('class');
    ['align','color','face','dir'].forEach(a=>n.removeAttribute(a));
  });
  // 末尾那个 <br> 不在这里删。浏览器拿它当空段落的光标位，删了正在打字的地方
  // 就没了。它不写进文件——inlMd 出口处会去掉。
  ensureBr(el);
  return el;
}

/* 空块必须有一个 <br>，否则 WebKit 放不进光标，看起来像「回车了但光标没动」。 */
function ensureBr(el){
  if(!el || el.nodeType!==1) return el;
  if(/^(UL|OL|TABLE|THEAD|TBODY|TR|HR)$/.test(el.tagName)) return el;
  const has = (el.textContent||'').replace(/\u200b/g,'').length
           || el.querySelector('img,br,ul,ol,table,input');
  if(!has) el.appendChild(document.createElement('br'));
  return el;
}
function tidyTxt(s){ return String(s||'').replace(/[\u00a0\u3000]/g,' ').replace(/\u200b/g,''); }

/* 光标所在的可落点块。选区按这块内部的字符偏移记，不按整篇的字符数——
   空块没有字符，按整篇数会把光标送回上一块末尾。 */
function blockish(n, root){
  let topDiv=null;
  while(n && n!==root){
    if(n.nodeType===1 && /^(P|H[1-6]|LI|TD|TH|PRE|BLOCKQUOTE)$/.test(n.tagName)) return n;
    if(n.nodeType===1 && n.tagName==='DIV' && n.parentNode===root && !n.classList.contains('tw')) topDiv=n;
    n=n.parentNode;
  }
  return topDiv;
}
function pathFrom(root, el){
  const path=[];
  let n=el;
  while(n && n!==root){
    const p=n.parentNode; if(!p) break;
    path.unshift([...p.children].indexOf(n));
    n=p;
  }
  return path;
}
function elAtPath(root, path){
  let el=root;
  for(const i of (path||[])){
    if(!el || !el.children || i<0 || i>=el.children.length) return null;
    el=el.children[i];
  }
  return el;
}

/* 洗白会换掉节点，光标就散了。按「哪一块 + 块内第几个字符」记，
   DIV 换成 P、空段加 <br> 都不影响这个坐标。 */
function saveSel(md){
  const s=getSelection();
  if(!s || !s.rangeCount || !md.contains(s.anchorNode)) return null;
  const r=s.getRangeAt(0);
  const blk=blockish(r.startContainer, md);
  const pre=r.cloneRange();
  if(blk){
    pre.selectNodeContents(blk); pre.setEnd(r.startContainer, r.startOffset);
    return {
      path: pathFrom(md, blk),
      at: pre.toString().length,
      len: r.toString().length,
      empty: !tidyTxt(blk.textContent).length
    };
  }
  pre.selectNodeContents(md); pre.setEnd(r.startContainer, r.startOffset);
  return {at: pre.toString().length, len: r.toString().length, empty:false};
}
function restoreSel(md, m){
  if(!m) return;
  if(m.path){
    const el=elAtPath(md, m.path);
    if(!el) return;
    if(m.empty || !tidyTxt(el.textContent).length){
      ensureBr(el);
      caretEnd(el, true);
      return;
    }
    if(!caretAtOffset(el, m.at)) return;
    if(!m.len) return;
    const s=getSelection(); if(!s || !s.rangeCount) return;
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let seen=0, n, endAt=m.at+m.len, b=null;
    while((n=w.nextNode())){
      const e=seen+n.nodeValue.length;
      if(endAt<=e){ b=[n, endAt-seen]; break; }
      seen=e; b=[n, n.nodeValue.length];
    }
    if(!b) return;
    try{
      const r=s.getRangeAt(0);
      r.setEnd(b[0], Math.max(0, Math.min(b[1], b[0].nodeValue.length)));
      s.removeAllRanges(); s.addRange(r);
    }catch(e){}
    return;
  }
  const w=document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
  let seen=0, a=null, b=null, n;
  while((n=w.nextNode())){
    const end=seen+n.nodeValue.length;
    if(!a && m.at<=end) a=[n, m.at-seen];
    if(!b && m.at+m.len<=end){ b=[n, m.at+m.len-seen]; break; }
    seen=end;
  }
  if(!a) return;
  try{
    const r=document.createRange();
    r.setStart(a[0], Math.max(0, Math.min(a[1], a[0].nodeValue.length)));
    if(b) r.setEnd(b[0], Math.max(0, Math.min(b[1], b[0].nodeValue.length)));
    else r.collapse(true);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}

/* ── 重画正文 ─────────────────────────── */
function paintWork(t){
  const p=paneOf(t); if(!p) return;
  const top=p.scrollTop;
  unwatch(t);                                   // 整篇重画会炸出成千上万条变更记录
  const md=p.querySelector('.md');
  undecorateHistory(md);
  renderMd(md, t.editing ? t.work : t.raw, dirOf(t.path));
  if(!t.editing) decorateHistory(md);
  applyPref();
  p.scrollTop=top;
}

/* ── 改动跟踪 ───────────────────────────
   哪一块被动过就给哪一块盖 data-dirty，出去的时候只有盖了章的才反解。 */
function unwatch(t){ if(t.mo){ t.mo.disconnect(); t.mo=null; } }

function watchEdits(t){
  unwatch(t);
  const md=paneOf(t).querySelector('.md');
  const top=n=>{
    while(n && n!==md && n.parentNode && n.parentNode!==md) n=n.parentNode;
    return (n && n!==md && n.parentNode===md && n.nodeType===1) ? n : null;
  };
  const hit=[];
  const mark=n=>{ const b=top(n); if(b){ b.dataset.dirty='1'; hit.push(b); } };
  t.mo=new MutationObserver(ms=>{
    hit.length=0;
    ms.forEach(m=>{
      mark(m.target);
      m.addedNodes.forEach(mark);
    });
    t.touched=true;
    // 洗白要等这一轮变更记录处理完再做，不然会跟浏览器自己的编辑动作打架。
    // 洗之前把光标位置记下来，洗完放回去——换节点会把光标弄丢。
    // 拼音打到一半不能洗：换节点、重设 Range 会打断输入法组合，
    // 表现是候选框消失、半截拼音上屏。
    const list=[...new Set(hit)];
    if(list.length) requestAnimationFrame(()=>{
      if(COMPOSING) return;
      unwatch(t);
      const before=md.innerHTML, keep=saveSel(md);
      list.forEach(b=>{ if(b.isConnected) cleanBlock(b); });
      if(md.innerHTML!==before) restoreSel(md, keep);
      watchEdits(t);
      syncPh(t);
      if(t.id===curTab && !COMPOSING) syncTabTitle(t);
    });
    autoKick(t);                                 // 停笔两秒自动落盘
  });
  t.mo.observe(md, {subtree:true, childList:true, characterData:true});
}

/* ── 进编辑前的准备 ─────────────────────
   反解不回 markdown 的块锁住，只能按源码改（v10 的老路）。
   显示层的包装（文档历史折叠）必须先拆干净：台账按 .md 的直接子节点建，
   包装盒会把那张表挤出直接子节点，一拆一存就对不回原文。 */
function prepEdit(t){
  const p=paneOf(t), md=p.querySelector('.md'), base=dirOf(t.path);
  undecorateHistory(md);
  buildRegistry(t);
  let lock=0;
  [...md.children].forEach(el=>{
    if(el.nodeType!==1) return;
    if(safeBlock(el, base)){
      el.removeAttribute('data-lock'); el.removeAttribute('contenteditable');
    }else{
      el.setAttribute('data-lock','1'); el.setAttribute('contenteditable','false'); lock++;
    }
  });
  md.setAttribute('contenteditable','true');
  md.spellcheck=false;
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  watchEdits(t);
  t.lock=lock;
  syncPh(t);
}

/* 光标落到某一块的末尾（atStart 则到开头）。空块先补 <br> 再放光标。 */
function caretEnd(el, atStart){
  if(!el) return;
  const tgt = el.tagName==='UL'||el.tagName==='OL' ? (el.querySelector('li')||el) : el;
  ensureBr(tgt);
  try{
    const r=document.createRange();
    r.selectNodeContents(tgt);
    r.collapse(!!atStart);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
/* 选中一块里的文字（不含末尾那个当光标位的 <br>）。新建笔记用来圈住默认标题。 */
function caretSelect(el){
  if(!el) return;
  try{
    const texts=[];
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n; while((n=w.nextNode())) if(n.nodeValue) texts.push(n);
    const r=document.createRange();
    if(texts.length){
      r.setStart(texts[0], 0);
      const last=texts[texts.length-1];
      r.setEnd(last, last.nodeValue.length);
    }else{
      ensureBr(el);
      r.selectNodeContents(el);
    }
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
function isBlankBlock(el){
  if(!el || el.nodeType!==1) return true;
  if(el.querySelector('img,table,ul,ol,pre')) return false;
  return !tidyTxt(el.textContent).trim();
}
/* 空标题、文首空段叠一层占位。data-ph 不进序列化（normHtml 会剥掉）。 */
function syncPh(t){
  const p=t&&paneOf(t); if(!p || !t.editing || p.classList.contains('src')) return;
  const md=p.querySelector('.md'); if(!md) return;
  const kids=[...md.children].filter(el=>el.nodeType===1 && el.tagName!=='TEXTAREA');
  kids.forEach(el=>el.removeAttribute('data-ph'));
  const h1=kids[0] && kids[0].tagName==='H1' ? kids[0] : null;
  if(h1 && isBlankBlock(h1)) h1.setAttribute('data-ph','1');
  const para=kids.find(el=>el.tagName==='P');
  const rest=kids.filter(el=>el!==h1 && el!==para);
  if(para && isBlankBlock(para) && rest.every(isBlankBlock)) para.setAttribute('data-ph','1');
}
function syncTabTitle(t){
  if(!t || t.ext) return;
  const md=paneOf(t)&&paneOf(t).querySelector('.md');
  const h1=md && md.firstElementChild && md.firstElementChild.tagName==='H1'
    ? tidyTxt(md.firstElementChild.textContent).trim() : '';
  const title=h1 || '无标题';
  if(t.title===title) return;
  t.title=title;
  drawTabs();
  lastNat='';
  syncNative();
}
function caretAtStart(el){
  const s=getSelection();
  if(!s || !s.rangeCount || !s.isCollapsed || !el) return false;
  const r=s.getRangeAt(0);
  if(!el.contains(r.startContainer) && r.startContainer!==el) return false;
  const pre=r.cloneRange();
  pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return !pre.toString();
}

/* 当前光标所在的顶层块 */
function curBlock(t){
  const p=paneOf(t); if(!p) return null;
  const md=p.querySelector('.md'), s=getSelection();
  if(!s || !s.rangeCount) return null;
  let n=s.getRangeAt(0).startContainer;
  if(!md.contains(n)) return null;
  while(n && n.parentNode && n.parentNode!==md) n=n.parentNode;
  return (n && n.parentNode===md && n.nodeType===1) ? n : null;
}

/* 进编辑之后光标到底在不在正文里。v27「打不了字」的病根就是这一条没成立：
   选区还留在别处，看着进了编辑态，键盘敲进去没有插入点。
   判据：选区存在、且落在 #doc（当前这一份的正文）里面。 */
function caretInDoc(){
  const doc=$('#doc'); if(!doc) return false;
  const s=getSelection();
  if(!s || !s.rangeCount) return false;
  const n=s.getRangeAt(0).startContainer;
  return !!(n && doc.contains(n));
}
/* 兜底：不在就 focus 正文，把光标放到第一个可编辑块的末尾。 */
function ensureCaret(t){
  if(caretInDoc()) return true;
  const p=paneOf(t); if(!p) return false;
  const md=p.querySelector('.md');
  md.focus();
  const first=[...md.children].find(el=>el.nodeType===1 && !el.hasAttribute('data-lock')
                                        && el.tagName!=='TEXTAREA');
  if(first) caretEnd(first);
  else{
    const np=document.createElement('p'); np.dataset.dirty='1';
    md.appendChild(np); caretEnd(np);
  }
  return caretInDoc();
}

/* ── 块级源码 ───────────────────────────
   锁住的块只能走这条；没锁的块按 ⌥⌘E 也能走，想直接写 markdown 的时候用。
   改完是**把这一块在台账里的源码换掉**，不是反解——所以按源码改的块，
   写出去还是你亲手打的那几行字节。 */
function openSrcBlk(t, el){
  if(!el || el.tagName==='TEXTAREA') return null;
  const bid=el.dataset.bid;
  const src=(bid!==undefined && t.reg.blocks[+bid] && !el.dataset.dirty)
    ? t.reg.blocks[+bid].src.join('\n') : blkMd(el);
  const ta=document.createElement('textarea');
  ta.className='blk mono'; ta.value=src; ta.spellcheck=false;
  ta.setAttribute('contenteditable','false');    // 别让外面那层 contenteditable 接管
  if(bid!==undefined) ta.dataset.bid=bid;
  ta._fit=()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+1)+'px'; };
  ta.addEventListener('input', ta._fit);
  ta.addEventListener('keydown', e=>{
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeSrcBlk(t, ta, false); }
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); closeSrcBlk(t, ta, true); }
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart, x=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(x);
      ta.selectionStart=ta.selectionEnd=s+2; ta._fit();
    }
  });
  ta.addEventListener('blur', ()=>{ if(!ta.dataset.closing) closeSrcBlk(t, ta, true); });
  unwatch(t);
  el.replaceWith(ta);
  watchEdits(t);
  ta._fit(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  syncStatusLine();
  return ta;
}

function closeSrcBlk(t, ta, keep){
  if(!ta || !ta.isConnected) return;
  ta.dataset.closing='1';
  const bid=ta.dataset.bid;
  const p=paneOf(t), top=p.scrollTop;
  if(keep && bid!==undefined && t.reg.blocks[+bid]){
    t.reg.blocks[+bid].src=ta.value.replace(/\r\n/g,'\n').split('\n');
    t.touched=true;
  }
  // 占位块只带 bid、不带 dirty，序列化时会去台账里抄刚写进去的那几行
  const ph=document.createElement('p');
  if(bid!==undefined) ph.dataset.bid=bid;
  unwatch(t);
  ta.replaceWith(ph);
  if(keep && bid===undefined){                    // 没登记过的块（新插的），直接按文本走
    const box=document.createElement('div');
    box.innerHTML=md2html(ta.value, dirOf(t.path), 0);
    const made=[...box.children]; made.forEach(m=>m.dataset.dirty='1');
    if(made.length) ph.replaceWith(...made); else ph.remove();
  }
  // 行号全变了，重新落一次台账
  t.work=serializeBody(t);
  paintWork(t); prepEdit(t);
  p.scrollTop=top;
  buildToc(); syncProg();
  syncStatusLine(); autoKick(t);
}
/* ── 排版动作 ───────────────────────────
   都走「拿到这一块的纯文本 → 按新的块类型重新渲染一块 → 换上去」这条，
   不去手搓 DOM，样子一定跟正常渲染出来的一致。 */
const MARK={p:'', h1:'# ', h2:'## ', h3:'### ', h4:'#### ',
            quote:'> ', ul:'- ', ol:'1. ', task:'- [ ] '};

const plainOf = el => blkMd(el)
  .replace(/^#{1,6}\s+/,'')
  .replace(/^>\s?/,'')
  .replace(/^([-*+]|\d+[.)])\s+/,'')
  .replace(/^\[[ xX]\]\s+/,'')
  .replace(/^```[^\n]*\n?/,'').replace(/\n?```\s*$/,'');

function retype(t, el, kind, text){
  if(!el) return null;
  const body = text!==undefined ? text : plainOf(el);
  const src = kind==='pre' ? '```\n'+body+'\n```'
            : kind==='hr'  ? '---'
            : (MARK[kind]||'') + body;
  const box=document.createElement('div');
