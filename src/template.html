    if(!looksImg(f)) return;
    const k=(f.name||'')+'/'+f.size+'/'+(f.type||'');
    if(seen.has(k)) return;
    seen.add(k); out.push({file:f});
  };
  [...(dt.files||[])].forEach(add);
  [...(dt.items||[])].forEach(i=>{
    if(i.kind!=='file') return;
    add(i.getAsFile());
  });
  return out;
}

/* 把飞书／网页那种图文 HTML 拆成按出现顺序的文字块和图。
   不保留 style / class / span：只要正文和 <img> 的地址。装饰性小图
   （emoji、贴纸、1×1 跟踪像素）丢掉。 */
function htmlClipboardPieces(html){
  if(!html) return [];
  let doc; try{ doc=new DOMParser().parseFromString(html, 'text/html'); }
  catch(e){ return []; }
  const pieces=[];
  let buf='';
  const flush=()=>{
    const t=buf.replace(/\r\n/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n');
    buf='';
    if(t.trim()) pieces.push({kind:'text', text:t});
  };
  const skip=el=>{
    const t=(el.tagName||'').toLowerCase();
    return t==='script'||t==='style'||t==='meta'||t==='head'||t==='link'||t==='noscript';
  };
  const deco=img=>{
    const w=+img.getAttribute('width')||0, h=+img.getAttribute('height')||0;
    if(w && h && w<=32 && h<=32) return true;
    const hint=((img.className||'')+' '+(img.getAttribute('alt')||'')+' '+(img.getAttribute('src')||''));
    return /\bemoji\b|\bsticker\b|\bemoticon\b|\bemotion\b/i.test(hint);
  };
  const srcOf=img=>{
    const src=(img.getAttribute('src')||'').trim();
    const lark=(img.getAttribute('data-lark-image-uri')||'').trim();
    const key=(img.getAttribute('data-image-key')||'').trim();
    // 飞书桌面复制：src 是 native-resource://，带 crypto；这个必须优先，
    // 本地 data-origin-file 在别人容器里，别的进程读不了。
    if(/^native-resource:/i.test(src) || /^imkey:/i.test(src)) return src;
    if(/^native-resource:/i.test(lark) || /^imkey:/i.test(lark)) return lark;
    if(key) return 'native-resource://sdk/image?key='+encodeURIComponent(key);
    const s=(src
      || img.getAttribute('data-src')
      || img.getAttribute('data-origin-src')
      || img.getAttribute('data-original')
      || img.getAttribute('origin-src')
      || img.getAttribute('data-image-src')
      || img.getAttribute('data-origin')
      || img.getAttribute('data-origin-file')
      || '').trim();
    return s;
  };
  const walk=node=>{
    if(!node) return;
    if(node.nodeType===3){ buf+=node.nodeValue; return; }
    if(node.nodeType!==1) return;
    if(skip(node)) return;
    const tag=node.tagName;
    if(tag==='IMG'){
      if(!deco(node)){
        const src=srcOf(node);
        flush();
        pieces.push({kind:'img', src, alt:node.getAttribute('alt')||''});
      }
      return;
    }
    if(tag==='BR'){ buf+='\n'; return; }
    const block=/^(P|DIV|H[1-6]|LI|TR|BLOCKQUOTE|PRE|SECTION|ARTICLE|FIGURE|FIGCAPTION|DT|DD|TABLE|UL|OL)$/.test(tag);
    if(block && buf && !buf.endsWith('\n')) buf+='\n';
    for(const c of node.childNodes) walk(c);
    if(block) buf+='\n';
  };
  walk(doc.body);
  flush();
  return pieces;
}

const CLIP_PEEK={};
function clipPeek(){
  if(!SHELL) return Promise.resolve(null);
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  return new Promise(resolve=>{
    const to=setTimeout(()=>{ delete CLIP_PEEK[id]; resolve(null); }, 8000);
    CLIP_PEEK[id]={resolve, to};
    post({type:'clipPeek', id});
  });
}

function fileUrlToPath(u){
  try{
    const x=new URL(u);
    if(x.protocol!=='file:') return '';
    return decodeURIComponent(x.pathname||'');
  }catch(e){ return ''; }
}

/* 飞书 Mac 客户端复制聊天：<img src="native-resource://sdk/image?key=img_v3_…&crypto=…">
   改写成可下的 https，crypto 留在查询串里给服务端 AES-GCM 解。 */
function feishuStaticUrl(src){
  try{
    const u=new URL(src);
    let key='';
    if(u.protocol==='imkey:'){
      key=((u.hostname||'')+(u.pathname||'')).replace(/^\/*/,'').split('?')[0];
    }else if(u.protocol==='native-resource:'){
      key=u.searchParams.get('key')||'';
    }else return '';
    key=String(key||'').replace(/_MIDDLE_WEBP$/i,'');
    if(!/^img_[A-Za-z0-9_.-]+$/.test(key)) return '';
    const crypto=u.searchParams.get('crypto')||'';
    let out='https://internal-api-lark-file.feishu.cn/static-resource/v1/'+key;
    if(crypto) out+='?crypto='+encodeURIComponent(crypto);
    return out;
  }catch(e){ return ''; }
}

function dataUrlB64(src){
  const i=String(src||'').indexOf(',');
  return i<0 ? '' : src.slice(i+1).replace(/\s+/g,'');
}

function fileToB64(file){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onload=()=>ok(String(fr.result).split(',')[1]||'');
    fr.onerror=()=>no(new Error(TR('读不了这张图')));
    fr.readAsDataURL(file);
  });
}

async function savePastedImg(t, spec){
  const img={};
  if(spec.b64) img.数据=spec.b64;
  else if(spec.url) img.网址=spec.url;
  else if(spec.path) img.文件=spec.path;
  else if(spec.file) img.数据=await fileToB64(spec.file);
  else return {ok:false};
  const r=await (await fetch('/__save',{method:'POST', headers:hdrs(),
    body:JSON.stringify({路径:t.path, 图片:img})})).json();
  return r;
}

async function resolvePastedImg(t, piece){
  const src=String(piece.src||'').trim();
  const trySpec=async spec=>{
    try{
      const r=await savePastedImg(t, spec);
      return (r && r.ok && r.相对路径) ? r.相对路径 : '';
    }catch(e){ return ''; }
  };
  if(piece.file) return trySpec({file:piece.file});
  if(piece.b64) return trySpec({b64:piece.b64});
  if(piece.path) return trySpec({path:piece.path});
  const lark=feishuStaticUrl(src);
  if(lark) return trySpec({url:lark});
  if(/^data:image\//i.test(src)){
    const b64=dataUrlB64(src);
    if(b64) return trySpec({b64});
  }else if(/^blob:/i.test(src)){
    try{
      const blob=await fetch(src).then(r=>r.blob());
      const file=new File([blob], 'paste', {type:blob.type||'image/png'});
      return trySpec({file});
    }catch(e){}
  }else if(/^file:/i.test(src)){
    const path=fileUrlToPath(src);
    if(path) return trySpec({path});
  }else if(src.startsWith('/') && !src.startsWith('//')){
    const rel=await trySpec({path:src});
    if(rel) return rel;
  }else{
    let url=src;
    if(url.startsWith('//')) url='https:'+url;
    if(/^https?:\/\//i.test(url)) return trySpec({url});
  }
  return '';
}

async function pasteMixed(t, src){
  if(!IS_HTTP){ flash(TR('贴图要服务在跑')); return; }
  if(!canEditPath(t.path) || t.ext){ flash(TR('这一份不能改')); return; }
  const p=paneOf(t), md=p && p.querySelector('.md');
  if(!md) return;
  if(t.pasteBusy) return;
  t.pasteBusy=true;
  const keep=saveSel(md);
  try{
    let html=src.html||'';
    let pieces=htmlClipboardPieces(html);
    const fileQ=(src.files||[]).slice();
    if(SHELL){
      const peek=await clipPeek();
      if(peek && typeof peek==='object'){
        const alt=htmlClipboardPieces(peek.html||'');
        const n=(html.match(/<img\b/gi)||[]).length;
        const m=((peek.html||'').match(/<img\b/gi)||[]).length;
        if(m>n || !pieces.some(x=>x.kind==='img')){
          if(alt.some(x=>x.kind==='img')) pieces=alt;
        }
        if(!src.txt && peek.text) src.txt=String(peek.text).replace(/\r\n/g,'\n');
        (peek.files||[]).forEach(path=>{ if(path) fileQ.push({path}); });
        (Array.isArray(peek.images)?peek.images:[]).forEach(b64=>{ if(b64) fileQ.push({b64}); });
      }
    }
    if(!pieces.some(x=>x.kind==='img')){
      if(fileQ.length){
        const head=src.txt && src.txt.trim() ? [{kind:'text', text:src.txt}] : [];
        pieces=head.concat(fileQ.map(f=>({kind:'img', ...f})));
        fileQ.length=0;
      }else if(src.txt && src.txt.trim()){
        pieces=[{kind:'text', text:src.txt}];
      }
    }
    if(!pieces.length) return;
    if(pieces.some(x=>x.kind==='img') || fileQ.length) flash(TR('图片上传中'));
    const resolved=[];
    let failed=0, imgs=0;
    const extras=fileQ.slice();
    for(const piece of pieces){
      if(piece.kind==='text'){ resolved.push(piece); continue; }
      imgs++;
      let rel=await resolvePastedImg(t, piece);
      if(!rel && extras.length) rel=await resolvePastedImg(t, extras.shift());
      if(rel) resolved.push({kind:'img', rel, alt:piece.alt||''});
      else failed++;
    }
    // HTML 里的地址下不下来（飞书临时链常见），剪贴板里还有位图就顶上。
    if(!resolved.some(x=>x.kind==='img')){
      failed=0;
      while(extras.length){
        const rel=await resolvePastedImg(t, extras.shift());
        if(rel) resolved.push({kind:'img', rel});
      }
    }
    restoreSel(md, keep);
    let htmlOut='';
    // 这一下只有字、没有图（壳里所有纯文字粘贴都走这里，5.13.2 起）：跟浏览器那条路一样，
    // 一段就行内插，光标在列表项／格子里就用 <br> 接（见 pasteHtml）
    const textOnly=resolved.length && resolved.every(x=>x.kind==='text');
    if(textOnly) htmlOut=pasteHtml(resolved.map(x=>x.text).join('\n'), dirOf(t.path));
    else{
      const imgTag=piece=>{
        const alt=esc(piece.alt||'');
        return `<img src="${esc(resolveRef(piece.rel, dirOf(t.path), true))}" alt="${alt}" title="${alt}" data-u="${esc(piece.rel)}"`;
      };
      const s=getSelection(), at=s && s.rangeCount ? s.anchorNode : null;
      const li=closestTag(at,'LI'), cell=closestTag(at,'TD') || closestTag(at,'TH'), quote=closestTag(at,'BLOCKQUOTE');
      if(li || cell || quote){
        // 落在列表项／格子／引用里：跟纯文字粘贴（pasteHtml）一个口径，块级的东西一律降成行——
        // 字逐行、图当行内图（「- 字 ![](图)」在 md 里成立），列表项、格子里 <br> 接，引用里一行一段。
        // 以前整段块级 HTML 插进去，列表里冒出「子表后面还有图和字」，整块存不进（R 复审 P1-A）
        const rows=[];
        resolved.forEach(piece=>{
          if(piece.kind==='text'){
            const box=document.createElement('div');
            box.innerHTML=md2html(pasteLines(piece.text), dirOf(t.path), 0);
            rows.push(...pasteRows([...box.children]));
          }else rows.push(imgTag(piece)+'>');
        });
        htmlOut=(quote && !li && !cell) ? rows.map(r=>'<p>'+(r||'<br>')+'</p>').join('') : rows.join('<br>');
      }else for(const piece of resolved){
        if(piece.kind==='text'){
          const box=document.createElement('div');
          box.innerHTML=md2html(pasteLines(piece.text), dirOf(t.path), 0);
          htmlOut+=box.innerHTML;
        }else htmlOut+=`<p>${imgTag(piece)} data-fresh="1"></p>`;
      }
    }
    if(!htmlOut){
      if(failed) flash(TR('{n} 张图没贴上',{n:failed}));
      return;
    }
    // 图文是好几段：光标停在标题里的话，浏览器会把第一段字塞进 h1，
    // 还带一个 <span style>，存盘自检就过不去。先跳到标题后面再贴。
    pasteLeaveHeading(md);
    document.execCommand('insertHTML', false, htmlOut);
    settleImgs(md);
    [...md.children].forEach(el=>{ if(el.dataset.dirty) cleanBlock(el); });
    t.touched=true; autoKick(t);
    if(failed) flash(TR('{n} 张图没贴上',{n:failed}));
  }catch(err){ flash(TR('图片上传失败')); }
  finally{ t.pasteBusy=false; }
}

/* 把粘进来的图写进这份 md 旁边的 _图/，再插一条跟渲染器一模一样的 <img>。
   反解那边（blkMd 的 IMG 分支）认 data-u，所以这里必须带上原始相对路径，
   不然存盘时会把解析后的完整 URL 写回 markdown。
   v17 起：全库可编辑的 md 都能贴图（服务端同一道判据再拦一次）。 */
async function pasteImg(t, file){
  if(!IS_HTTP){ flash(TR('贴图要服务在跑')); return; }
  if(!canEditPath(t.path) || t.ext){ flash(TR('这一份不能改')); return; }
  const p=paneOf(t), md=p && p.querySelector('.md');
  if(!md) return;
  const keep=saveSel(md);          // 上传要等一会儿，光标位置先记下来
  flash(TR('图片上传中'));
  try{
    const r=await savePastedImg(t, {file});
    if(!r.ok){ flash(r.错误||TR('图片没写进去')); return; }
    restoreSel(md, keep);
    const u=r.相对路径;
    pasteLeaveHeading(md);
    document.execCommand('insertHTML', false,
      `<p><img src="${esc(resolveRef(u, dirOf(t.path), true))}" alt="" title="" data-u="${esc(u)}" data-fresh="1"></p>`);
    settleImgs(md);
    t.touched=true; autoKick(t);
  }catch(err){ flash(TR('图片上传失败')); }
}

/* 刚插进去的图归位。

   浏览器的 insertHTML 有个脾气：光标停在段首或段末（以及正文本来就是空的）时，
   它不把 <img> 放进段落里，而是甩出来挂在正文根上。裸 <img> 不是这套编辑器认识的
   顶层块，序列化时取不到内容，会被当空块丢掉——图在屏幕上好好的，一存盘就没了。
   所以插完当场把它包回一个 <p>，再把光标放到最后一张图后面，接着打字就是图下面一段。 */
function settleImgs(md){
  const ims=[...md.querySelectorAll('img[data-fresh]')];
  if(!ims.length) return;
  let last=null;
  ims.forEach(im=>{
    im.removeAttribute('data-fresh');
    if(im.parentElement===md){
      const p=document.createElement('p');
      im.replaceWith(p); p.appendChild(im);
    }
    let blk=im;
    while(blk.parentElement && blk.parentElement!==md) blk=blk.parentElement;
    if(blk.parentElement===md) blk.dataset.dirty='1';   // 新包的块没有 bid，盖章免得被抄旧源码
    last=im;
  });
  if(!last) return;
  try{
    const r=document.createRange(); r.setStartAfter(last); r.collapse(true);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
function settleImg(md){ settleImgs(md); }

function pasteLeaveHeading(md){
  const s=getSelection();
  if(!s || !s.rangeCount || !md) return;
  let n=s.anchorNode;
  while(n && n!==md && n.parentNode!==md) n=n.parentNode;
  if(!n || n.parentNode!==md || !/^H[1-6]$/.test(n.tagName)) return;
  let p=n.nextElementSibling;
  if(!p || p.parentNode!==md || p.tagName!=='P'){
    p=document.createElement('p'); p.dataset.dirty='1'; ensureBr(p); n.after(p);
  }
  caretEnd(p, true);
}

/* ── 正文栏右上角那行淡字 ───────────────
   只报状态，不讲解怎么用：正在编辑 / 保存中 / 已保存 HH:MM / 有 N 处存不进 · 点看。 */
function syncStatusLine(){
  syncScanChip();
  const m=$('#edMsg'); if(!m) return;
  const t=active();
  paintSaveState(t);
  m.classList.remove('act');
  if(!t || !t.editing){ m.textContent=''; return; }
  if(t.pendingBad && t.pendingBad.length){
    m.textContent=TR('有 {n} 处存不进 · 点看',{n:t.pendingBad.length});
    m.classList.add('act');
    return;
  }
  if(t.saving){ m.textContent=TR('保存中'); return; }
  if(t.saveErr){ m.textContent=TR('没存上 · 点重试'); m.classList.add('act'); return; }
  m.textContent = t.savedAt ? TR('正在编辑 · 已保存 {at}',{at:t.savedAt}) : TR('正在编辑');
}
/* 老代码里的一句话回执沿用这个名字，路由到同一格。 */
function edSay(cls, txt){ if(txt) flash(txt); else syncStatusLine(); }
$('#edMsg').onclick=()=>{
  const t=active();
  if(!t || !t.editing) return;
  if(t.saveErr){ retrySave(t); return; }
  if(t.pendingBad && t.pendingBad.length) showStuck(t);
};

/* ── 能不能改 ───────────────────────────
   全库 md 都能改，判据照抄服务端 _edit_ok：只收 .md（小写，服务端是 endswith(".md")）；
   路径要落在库根内（相对路径，不许绝对、不许 ..）；任一段**含有** _编辑备份 /
   __pycache__ / .amnote，或以点开头的，一律不可编辑——服务端 _seg_blocked 认的是
   「包含」，以前这里认「整段相等」，像「旧_编辑备份」这种段能进编辑、永远存不上。
   99_历史版本 和 99、归档 是可编辑的（给她开，Agent 纪律照旧）。 */
const BADSEG=/_编辑备份|__pycache__|\.amnote|^\./;
function canEditPath(rel){
  if(!IS_HTTP) return false;
  rel=String(rel||'');
  if(!/\.md$/.test(rel) || rel[0]==='/' || rel.indexOf('\u0000')>=0) return false;
  const parts=rel.split('/');
  if(!parts.length) return false;
  return parts.every(s=>s && s!=='..' && !BADSEG.test(s));
}
/* 能不能移到废纸篓。判据照抄服务端 _trash_ok，跟 canEditPath 只差认哪些后缀：
   改只认 .md，搬认 .md / .html / .htm——门户里打得开的就这三种。
   **两边改必须一起改**（portal_server.py 的 _trash_ok）。
   库外文档（t.ext）恒假：那些文件不在库根里，服务端一条都不给动。 */
function canTrashPath(rel){
  if(!IS_HTTP) return false;
  rel=String(rel||'');
  if(!/\.(md|html|htm)$/i.test(rel)) return false;
  if(rel[0]==='/') return false;
  const parts=rel.split('/');
  if(!parts.length) return false;
  return parts.every(s=>s && s!=='..' && !BADSEG.test(s));
}

/* ── 移到废纸篓 ─────────────────────────
   建错一份随手记是最常见的一次误操作，以前只能去访达删。这里给一条出口。

   **不弹确认框。** 文件进的是系统废纸篓，原样躺着；toast 上八秒内点「撤销」
   就回原位，八秒之后访达里照样捞得回来。多一道确认只是多一次点击。

   TRASHED 是「刚挪走、服务端索引还没跟上」的那几份：/__tree 是从索引里出的，
   同步跑完之前会照样把它们列出来，卡片会「消失一下又冒回来」。先在 setTree
   里挡一道，等索引真的不列它了（或者撤销了）再解除。
   记的是挪走的时刻：同步万一没跑到（服务重启、索引坏了），挡了 30 秒就无条件
   放行——挡下去等于一份存在的笔记从库里凭空消失，比闪一下糟得多。 */
const TRASHED=new Map();          // 相对路径 → 挪走的时刻
const TRASH_HIDE_MS=30000;
let trashBusy=false;

function forgetPath(rel){
  ST.recents=(Array.isArray(ST.recents)?ST.recents:[]).filter(x=>x && x.路径!==rel);
  ST.pins=(Array.isArray(ST.pins)?ST.pins:[]).filter(p=>p!==rel);
  if(ST.lastPath===rel) ST.lastPath=ST.recents.length ? ST.recents[0].路径 : '';
  saveST();
}

async function trashDoc(rel){
  rel=String(rel||'');
  if(!rel || !IS_HTTP) return false;
  if(!canTrashPath(rel)){ flash(TR('这一份不能删')); return false; }
  if(trashBusy) return false;
  trashBusy=true;
  const mine=TABS.filter(t=>!t.ext && t.path===rel);
  try{
    /* **等 /__trash 回来了再收编辑态。** 收在前面的话，服务端一说不行，
       屏幕上还是用户刚敲的字，t.work 却已经丢了、dirty 也假了、停笔自动保存
       也停了——下一次导航按 t.raw 重画，那几个字就永久没了。
       等响应这段用 t.trashing 顶住：autoKick / flushSave / saveEdit /
       saveBeforeLeave 第一行都在判它，不会有哪一存赶在文件挪走前后发出去。 */
    for(const t of mine){
      // 自动保存正好在飞：等它落地再动文件，不然那一存会赶在挪走之后，把文件又写出来
      for(let i=0;i<60 && t.saving;i++) await new Promise(r=>setTimeout(r, 50));
      t.trashing=true;
      clearTimeout(t.autoT); t.autoT=null;
    }
    let r=null;
    try{
      r=await (await fetch('/__trash',{method:'POST', headers:hdrs(),
        body:JSON.stringify({路径:rel})})).json();
    }catch(e){ flash(TR('服务没应答')); return false; }
    if(!r || !r.ok){ flash((r&&r.错误)||TR('删不掉')); return false; }
    /* 文件这会儿才真的挪走了，收编辑态才安全。收完 t.editing 就是假，
       flushAll / flushSave / saveBeforeLeave / saveEdit 四个入口第一行都在判它，
       pagehide 和 visibilitychange 那两条也走 flushAll——所以挪走之后
       不会再有任何一条 /__save 把这份文件写回来。 */
    for(const t of mine){
      clearTimeout(t.autoT); t.autoT=null;
      if(t.editing) endEdit(t);              // 里面把 editing/work/touched/pendingBad 一起清了
      t.again=false; t.conflict=null;
    }
    TRASHED.set(rel, Date.now());
    forgetPath(rel);
    /* solo 窗里就这一份，关掉标签只剩一块白板。窗口本来就是 window.open 开的，
       关掉它才是这一步的收尾；关不掉（浏览器里直开的那种）就留着字，报一句。 */
    if(SOLO){
      notify(TR('已移到废纸篓，可以关掉这个窗口'), {ms:8000});
      try{ window.close(); }catch(e){}
      return true;
    }
    // 关掉所有开着它的标签。**不进 CLOSED**：⌘⇧T 恢复出来的会是一个开不了的标签
    for(const t of mine) await closeTab(t.id, {forget:true});
    refreshTree();
    notify(TR('已移到废纸篓'), {ms:8000, action:{label:TR('撤销'), fn:()=>untrashDoc(rel)}});
    return true;
  }finally{
    trashBusy=false;
    // 没删成就把顶住的那道撤了，字还在编辑区里，停笔照样自动保存
    mine.forEach(t=>{ if(t.trashing){ t.trashing=false; if(t.editing && dirty(t)) autoKick(t); } });
  }
}

async function untrashDoc(rel){
  rel=String(rel||'');
  if(!rel || !IS_HTTP) return;
  let r=null;
  try{
    r=await (await fetch('/__untrash',{method:'POST', headers:hdrs(),
      body:JSON.stringify({路径:rel})})).json();
  }catch(e){ flash(TR('服务没应答')); return; }
  if(!r || !r.ok){ flash((r&&r.错误)||TR('放不回去')); return; }
  TRASHED.delete(rel);
  notify(TR('已放回'));
  await refreshTree();
  openByPath(rel);
}

/* 挪完文件重取一次树。服务端那趟同步是后台跑的，第一次取回来可能还是旧的，
   隔七百毫秒再取一次；再不成也有 /__pulse 那条三秒一次的兜底。 */
async function refreshTree(){
  await loadTree();
  setTimeout(loadTree, 700);
}

function syncBar(){
  syncStatusLine();
  drawDocBar(active());
  syncNative();
  syncTabDirty();
}

/* 把「开着哪一份、改了没有」告诉壳。壳据此设窗口标题、代理图标、
   关闭按钮里的脏点。 */
let lastNat='';
function syncNative(){
  const t=active();
  const d=!!dirty(t);
  const sig=(t?t.path:'')+'|'+d;
  if(sig===lastNat) return;
  lastNat=sig;
  const file=hasDocNow(t);
  post({type:'doc', title:t?(t.title||''):null,
        path: file ? ((t&&!t.ext)?absOf(t.path):t.path) : null});
  post({type:'dirty', on:d});
  post({type:'canedit', on:!!file && !t.ext && kindOfTab(t)==='md' && canEditPath(t.path)});
}

/* ── 进／出编辑态 ───────────────────────
   opt.block / opt.at：双击进来的那一下，光标要落回双击的位置。 */
async function startEdit(opt){
  opt=opt||{};
  const t=active();
  if(!t || t.ext || !canEditPath(t.path) || t.editing) return;
  const p=paneOf(t);
  try{
    const r=await (await fetch('/__raw?path='+encodeURIComponent(t.path)+'&lang='+LANG,
                               {cache:'no-store'})).json();
    if(!r.ok){ tell(TR('进不了编辑'), r.错误||TR('读不到源码')); return; }
    t.raw=r.正文; t.rawAt=r.改于;
  }catch(e){ tell(TR('进不了编辑'), TR('服务没应答')); return; }
  // ⌘E 走「鼠标停在第几块」；双击走双击的那一块
  const md0=p.querySelector('.md');
  undecorateHistory(md0);
  const kids0=[...md0.children];
  const hi = (opt.block!==undefined && opt.block>=0) ? opt.block
           : (t.hover && t.hover.isConnected ? kids0.indexOf(t.hover) : -1);
  p.querySelector('.ed').value=t.raw;
  t.work=t.raw;
  t.editing=true; t.touched=false; t.pendingBad=null; t.savedAt=null;
  p.classList.add('edit'); p.classList.remove('src','fresh');
  paintWork(t); prepEdit(t); buildToc(); buildFmtBar();
  if(opt.fresh){
    const md=p.querySelector('.md');
    const h1=[...md.children].find(el=>el.tagName==='H1' && !el.hasAttribute('data-lock'));
    unwatch(t);
    if(![...md.children].some(el=>el.tagName==='P' && !el.dataset.chrome)){
      const np=document.createElement('p');
      ensureBr(np);
      const meta=md.querySelector('.doc-meta');
      if(meta) meta.after(np);
      else if(h1) h1.after(np);
      else md.appendChild(np);
    }
    t.touched=false;
    watchEdits(t);
    p.classList.add('fresh');
    md.focus();
    if(h1) caretSelect(h1); else ensureCaret(t);
    syncPh(t);
    syncTabTitle(t);
  }else{
    const kids=[...p.querySelector('.md').children];
    const tgt = hi>=0 ? kids[hi] : null;
    if(tgt && !tgt.hasAttribute('data-lock')){
      if(opt.at!==undefined) caretAtOffset(tgt, opt.at); else caretEnd(tgt);
    }
    // v27 的病根：进了编辑态但选区不在 #doc 里，键盘敲进去没有插入点。
    // 这里判一次，不成立就 focus 正文、把光标放到第一个可编辑块末尾。
    ensureCaret(t);
  }
  syncBar();
}

function endEdit(t){
  const p=paneOf(t); if(!p) return;
  clearTimeout(t.autoT); t.autoT=null;
  clearTimeout(t.retryT); t.retryT=null;
  unwatch(t); hideFmt();
  const md=p.querySelector('.md');
  md.removeAttribute('contenteditable');
  [...md.children].forEach(el=>{
    if(el.nodeType!==1) return;
    el.removeAttribute('contenteditable');
    ['bid','dirty'].forEach(k=>delete el.dataset[k]);
    el.removeAttribute('data-lock');
  });
  md.querySelectorAll('a[contenteditable]').forEach(a=>a.removeAttribute('contenteditable'));   // 双链的原子壳
  p.classList.remove('edit','src','fresh');
  t.editing=false; t.work=undefined; t.reg=null; t.touched=false;
  t.pendingBad=null; t.stuckEls=null; t.saveErr=null; t.retryN=0; t.redraw=null; t.composeWait=0; t.again=false;
  bnr('conflict', false);
  syncBar();
}

function cancelEdit(){
  const t=active(); if(!t||!t.editing) return;
  // 这一趟存过（自动保存）：文件是那一刻的样子，不是打开时的（I 轮措辞，有存不进的块时更要说清）
  const back=t.savedAt ? TR('没存进去的改动会丢掉，文件还是 {time} 存下的样子。',{time:t.savedAt})
                       : TR('改过的内容会回到打开时的样子。');
  if(dirty(t) && !ask(TR('要放弃这次修改吗？'), back, TR('放弃修改'), TR('取消'), true)) return;
  endEdit(t); paintWork(t); buildToc(); syncProg();
}

/* 富文本 ↔ 整篇源码。开头的标签块不参与渲染，要改它只能来源码这边。 */
function toggleSrc(){
  const t=active(); if(!t||!t.editing) return;
  const p=paneOf(t), ta=p.querySelector('.ed');
  if(p.classList.contains('src')){
    t.work=ta.value.replace(/\r\n/g,'\n');
    p.classList.remove('src');
    paintWork(t); prepEdit(t); buildToc();
    /* 按源码整篇重画、台账重建：哪一块都没动过，存不进的那几块已经不在了。胶囊当场复位，
       别挂着「有 N 处存不进」等下一次停笔（J 轮，R 终审 P3-1）。改动还在（touched），照常算没存。 */
    t.pendingBad=null; t.stuckEls=null;
    syncStatusLine(); syncNative(); syncTabDirty();
    ensureCaret(t);
  }else{
    hideFmt();
    /* 有存不进的段：先问。切过去以后这几段在源码里是「能存下来的样子」（草稿 md），可能跟眼前的排法
       不一样；切回来以源码为准、照常存——不问就切，等于把它们静默写进了文件（R 复审 P2-A）。 */
    const v=verifyDirty(t);
    const n=bodyPlan(t, v.over).stuck.length;
    if(n && !ask(TR('有 {n} 处改动存不进',{n}),
                 TR('切到源码后，这几处显示的是能存下来的样子，可能和你现在看到的排法不一样；之后以源码为准。'),
                 TR('继续'), TR('取消'), false)) return;
    t.work=serializeBody(t, v.over, true);         // 正文里改的先落到工作副本（存不进的块按眼前的样子，见 bodyPlan）
    unwatch(t);
    /* 开着的块源码框：框里眼下的字已经原样进了源码（bodyPlan 的 draft），框本身拿掉——藏着的框还在的话，
       srcBlkPending 会一直说「没存完」；切回正文按源码整篇重画，本来也没有它了（K 轮：框落不下时
       点「源码」按钮，失焦收不了、框还开着，不拿进源码的话框里的字就丢了） */
    p.querySelectorAll('.md > textarea.blk').forEach(x=>{ x.dataset.closing='1'; x.remove(); });
    ta.value=t.work;
    p.classList.add('src');
    growEd(ta);
    ta.focus(); ta.setSelectionRange(0,0); p.scrollTop=0;
  }
  applyPref(); syncBar();
}

/* ── 自动保存 ───────────────────────────
   停笔 2 秒落盘；切文档、关标签、关窗口、页面隐藏时强制落盘；⌘S 照常手动即存。 */
const AUTOSAVE_MS = 2000;
function autoKick(t){
  if(!t || !t.editing || t.trashing) return;   // trashing：/__trash 正在飞，这一刻一个字都不许写回去
  t.pendingBad=null;
  // 打字这条路径也要把脏标志推给壳，不然关闭按钮里的脏点要等到别处
  // 调 syncBar 才出现。syncNative 自带 lastNat 去重，敲一个字不会刷屏。
  if(t.id===curTab){ syncStatusLine(); syncNative(); }
  syncTabDirty();
  clearTimeout(t.autoT);
  t.autoT=setTimeout(function fire(){
    t.autoT=null;
    /* 输入法还在组字：拼音字母不是要的字，先别落盘（以前停笔两秒，「第一段文字zhong」
       就进了文件，上屏之后下一次保存才盖掉）。上屏那一下会再推一次；
       万一 compositionend 一直不来，最多等半分钟照存。 */
    if(COMPOSING && (t.composeWait=(t.composeWait||0)+1) < 15){ t.autoT=setTimeout(fire, AUTOSAVE_MS); return; }
    t.composeWait=0;
    saveEdit(false, {tab:t, auto:true});
  }, AUTOSAVE_MS);
}
/* 切走、关窗时把没落盘的改动推出去。
   unload＝页面真要卸了（pagehide / beforeunload）：请求可能活不过页面，带 keepalive——
   但浏览器给 keepalive 的请求体只有 64 KiB，超了整条不发，所以 saveEdit 只给小正文带。
   页面只是藏起来（visibilitychange：切到别的 app、进全屏）不会卸，普通请求就走得完，
   不带 keepalive。以前一律带，长笔记一切走就存不上，之后也不再重试。 */
function flushSave(t, unload){
  if(!t || !t.editing || t.trashing) return;   // 同 autoKick
  clearTimeout(t.autoT); t.autoT=null;
  if(!dirty(t)) return;
  saveEdit(false, {tab:t, auto:true, unload:!!unload});
}
function flushAll(unload){ TABS.forEach(t=>{ if(t.editing) flushSave(t, unload); }); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAll(false); });
addEventListener('pagehide', ()=>flushAll(true));
addEventListener('beforeunload', e=>{
  flushAll(true);
  if(TABS.some(dirty)){ e.preventDefault(); e.returnValue=''; }
});

const hhmm = () => { const d=new Date(), z=n=>String(n).padStart(2,'0');
  return z(d.getHours())+':'+z(d.getMinutes()); };

/* 存盘。自动保存这条路上不弹窗打断：
   冲突（别人改过）→ 顶部横幅两个动作；服务端拒写、请求没回来 → 胶囊「没存上 · 点重试」，
   隔一会儿自己再试（saveFailed）。
   自检逐块判（verifyDirty）：对不上的块不再整篇拒存——不丢字就照存、光标离开那一块时
   按文件重画；照常写会丢字的那一块改写成纯文字兜底，其余照存。手动 ⌘S 走同一道闸，
   不再问「仍然保存吗」。只有兜底也保不住字（理论上到不了）才退回老路：
   自动保存先不存、胶囊「有 N 处存不进」，手动问一句。
   返回值：真＝这次改动确实落到文件里了（或本来就跟文件一样）；假＝没落盘，
   改动还在编辑区里。「完成」按这个决定要不要回阅读态，别的调用点可以不看。 */
async function saveEdit(force, opt){
  opt=opt||{};
  const t=opt.tab||active();
  if(!t || !t.editing || t.trashing) return false;   // 同 autoKick
  if(t.saving){ t.again=true; return false; }
  const p=paneOf(t); if(!p) return false;
  const auto=!!opt.auto;

  let body, redraw=[], refused=null;
  if(p.classList.contains('src')){
    body=wellFormed(p.querySelector('.ed').value.replace(/\r\n/g,'\n'));
  }else{
    undecorateHistory(p.querySelector('.md'));
    // ⌘S 时开着的块源码框：先把框里的字落回那一块，再存（I 轮）。自动保存不落——框收起时才算数。
    // 落不下的框（围栏没收尾，K 轮）：框里的字不落，别的照存，存完再说一句（放在最后，别被别的提示盖掉）
    if(!auto) p.querySelectorAll('.md > textarea.blk').forEach(ta=>{ if(!commitSrcBlk(t, ta)) refused=ta; });
    const v=verifyDirty(t);
    const plan=bodyPlan(t, v.over);
    /* 有一块存不进：这一次整篇不写（I 轮）。文件保持上次存下的样子，胶囊报「有 N 处存不进」，
       dirty 一直为真（关标签、退出会拦）；那几块改好（或撤销掉）之后的下一次照常整篇写。
       H 轮那种「只把 stuck 那一段写原字节、别的照存」三轮都被拖放／并段／源码框找出丢字、写重，不要了。 */
    if(plan.stuck.length){
      t.pendingBad=plan.stuck.map(el=>(el.tagName==='TEXTAREA' ? el.value : (el.textContent||'')).replace(/\s+/g,' ').trim().slice(0,26));
      t.stuckEls=plan.stuck;
      t.touched=true;
      if(t.id===curTab){ syncStatusLine(); syncNative(); }
      syncTabDirty();
      if(!auto){ if(refused) srcBlkRefuse(t, refused); else showStuck(t); }
      return false;
    }
    t.pendingBad=null; t.stuckEls=null;
    body=plan.text;
    redraw=v.redraw;
  }
  if(body===t.raw){
    t.touched=srcBlkPending(t); saveOk(t);          // 块源码框里还有没落的字：没存完（J 轮）
    queueRedraw(t, redraw);
    if(t.id===curTab){ syncStatusLine(); syncNative(); }
    if(refused) srcBlkRefuse(t, refused);
    return true;
  }

  t.saving=true; if(t.id===curTab) syncStatusLine();
  const payload={路径:t.path, 正文:body, 基于:t.rawAt, 强制:!!force};
  // 卸页那条路上响应可能到不了，不改名——下次正常保存再跟标题对齐。
  if(!opt.unload){
    const dest=suggestRename(t.path, firstHeading(body));
    if(dest) payload.新路径=dest;
  }
  const json=JSON.stringify(payload);
  const req={method:'POST', headers:hdrs(), body:json};
  if(opt.unload && new Blob([json]).size < 60*1024) req.keepalive=true;
  let r=null;
  try{ r=await (await fetch('/__save', req)).json(); }
  catch(e){ t.saving=false; saveFailed(t, TR('服务没应答')); return false; }
  t.saving=false;

  if(!r.ok){
    if(r.需确认){
      t.conflict=body;
      if(auto){ showConflict(t, r.错误||''); return false; }
      if(ask(TR('这份在外部被改过了，仍然保存吗？'),
             (r.错误||'')+'\n'+TR('外部那一版会被你这一版覆盖，覆盖前会先留档。'),
             TR('仍然保存'), TR('取消'), true)) return saveEdit(true, {tab:t});
      // 手动这条路上按了「取消」＝不存了，冲突就此揭过，别让 pill 和「完成」一直卡着
      t.conflict=null;
      if(t.id===curTab) syncStatusLine();
      return false;
    }
    saveFailed(t, r.错误||TR('写失败'));
    return false;
  }
  t.raw=body; t.conflict=null; saveOk(t);
  // 存的这一会儿又动过（停笔计时又挂上了）、块源码框里还有没落的字：还不算存完，壳退出照样拦
  t.touched=!!(t.autoT || t.again) || srcBlkPending(t);
  bnr('conflict', false);
  t.savedAt=hhmm(); t.lastArchive=r.留档||'';
  if(r.路径 && r.路径!==t.path) applyRenamedPath(t, r.路径);
  else if(t.id===curTab) syncTabTitle(t);
  // 留档只在手动 ⌘S 之后报一句；自动保存不吭声，状态字里只有「已保存 HH:MM」
  if(!auto && r.留档 && t.id===curTab){
    flash(TR('已保存 · 留档 {name}',{name:r.留档}));
  }
  // 存完文件的 mtime 变了，下一次的「基于」得跟着换，不然会被当成外部改动
  if(r.改于) t.rawAt=r.改于; else await refreshRawAt(t);
  drawDocMeta(t);
  queueRedraw(t, redraw);
  if(t.id===curTab){ syncStatusLine(); syncNative(); }
  if(t.again){ t.again=false; autoKick(t); }
  if(refused) srcBlkRefuse(t, refused);
  return true;
}
/* 「有 N 处存不进 · 点看」：滚到第一块、闪一下；提示条说清楚两件事——这篇的改动先没存、文件还是上次
   存下的样子（I 轮：有 stuck 就整篇不写），给「改源码」入口（框里是这一块尽力写出来的 md，收起就照它重画、照常存）。 */
function showStuck(t){
  const els=(t.stuckEls||[]).filter(el=>el.isConnected);
  if(!els.length){ if(!t.saving) saveEdit(false, {tab:t, auto:true}); return; }
  const el=els[0];
  try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
  el.classList.add('stuckflash');
  setTimeout(()=>el.classList.remove('stuckflash'), 1800);
  const n=els.length;
  const msg = t.savedAt
    ? TR('有 {n} 处存不进，这篇的改动先没存，文件还是 {time} 存下的样子。',{n, time:t.savedAt})
    : TR('有 {n} 处存不进，这篇的改动先没存，文件还是打开时的样子。',{n});
  notify(msg, {ms:8000, action: el.tagName==='TEXTAREA' ? null
                : {label:TR('改源码'), fn:()=>{ if(el.isConnected && t.editing) openSrcBlk(t, el); }}});
}

/* 没存上（服务端拒写、请求没回来）：胶囊进「没存上 · 点重试」，别停在「正在保存…」；
   隔一会儿自己再试，一次比一次等得久（3 秒起，最长一分钟）。点胶囊看原因、马上重试。
   字一直在编辑区里，touched 没清，壳退出照样会拦。提示条只在第一次失败时闪一下。 */
function saveFailed(t, why){
  const first=!t.saveErr;
  t.saveErr=String(why||TR('写失败'));
  t.retryN=(t.retryN||0)+1;
  clearTimeout(t.retryT);
  t.retryT=setTimeout(()=>{
    t.retryT=null;
    if(t.editing && t.saveErr && !t.saving) saveEdit(false, {tab:t, auto:true});
  }, Math.min(60000, 3000*Math.pow(2, t.retryN-1)));
  if(t.id===curTab){ syncStatusLine(); if(first) flash(t.saveErr); }
}
function saveOk(t){ t.saveErr=null; t.retryN=0; clearTimeout(t.retryT); t.retryT=null; }

/* ── 按文件重画 ─────────────────────────
   自检对不上、照存了的块（见 verifyDirty）：光标离开这一块（或点「完成」，那会整篇按
   文件重画）时，按存下去的 md 重画，屏幕＝文件。正在打字的那一块不能当场重画——
   会吃掉刚打的空格、光标乱跳。重画了就安静地说一句。 */
/* 等着按文件重画的块，按块号记（没块号的新块才记元素本身）：cleanBlock、浏览器拆段都会换掉
   元素，按元素记的话换完就找不着了，那一块永远不重画（R 报告 P3-9）。 */
function queueRedraw(t, els){
  if(!els || !els.length) return;
  t.redraw=t.redraw||new Set();
  els.forEach(el=>t.redraw.add(el.dataset && el.dataset.bid!==undefined ? 'b'+el.dataset.bid : el));
  redrawAway(t);
}
function redrawAway(t){
  if(!t || !t.editing || !t.redraw || !t.redraw.size || COMPOSING) return;
  const p=paneOf(t); if(!p || p.classList.contains('src')) return;
  const md=p.querySelector('.md'), base=dirOf(t.path);
  const s=getSelection();
  const sel=s && s.rangeCount ? s.getRangeAt(0) : null;
  // 光标／选区还碰着这一块（起点、终点、或者整个跨过去）：等它离开。只看起点的话，
  // 从下一段反着拖进来的选区会被重画打断（R 报告 P3-8）
  const touching=el=>{ try{ return !!sel && sel.intersectsNode(el); }catch(e){ return false; } };
  let n=0, lossy=false;
  [...t.redraw].forEach(key=>{
    const els=typeof key==='string'
      ? [...md.children].filter(c=>c.dataset && 'b'+c.dataset.bid===key)
      : (key.isConnected && key.parentNode===md ? [key] : []);
    if(!els.length){ t.redraw.delete(key); return; }
    if(els.some(touching)) return;
    t.redraw.delete(key);
    els.forEach(el=>{
      const v=blockPlan(el, base);
      if(v.ok || v.stuck) return;                     // 后来又改对了；或者成了存不进的（原样留着、胶囊管）
      const box=document.createElement('div');
      box.innerHTML=md2html(v.md, base, 0);
      wireImg(box);                                   // 取不到的图照样给占位（编辑态不换成字）
      const made=[...box.children];
      if(!made.length) return;
      made.forEach(m=>{ m.removeAttribute('data-l0'); m.removeAttribute('data-l1'); m.dataset.dirty='1'; });
      // 重画出好几块：都带原来的块号（同一块劈开的，块号重了就都按眼前的样子写，见 bodyPlan）
      if(el.dataset.bid!==undefined) made.forEach(m=>{ m.dataset.bid=el.dataset.bid; if(el.dataset.be!==undefined) m.dataset.be=el.dataset.be; });
      unwatch(t);
      el.replaceWith(...made);
      made.forEach(m=>cleanBlock(m));
      watchEdits(t);
      n++; if(v.lossy) lossy=true;
    });
  });
  if(n) notify(lossy ? TR('有一段的格式存不下，已按纯文字存好') : TR('有一段按存下的样子重排了'));
}

/* 存盘前对改过的块逐块自检：反解出来的 markdown 重新渲染，看起来还得是屏幕上那个样子
   （visSig，见「看得见的样子」）。先把动过的块再洗一遍白——改完那一帧的洗白可能没跑
   （页面藏着时 rAF 停摆、组字时跳过），反解认的是洗过的形状。
   返回 {bad, stuck, redraw, over}：
     over    块 → 结论（blockVerdict：要写的 md、是不是存不进）
     redraw  对不上、照存了的纯文字块：存完、光标离开时按文件重画
     stuck   存不进的块：文件里留它原来的字节，其余照存（见 serializeBody）；bad 是它们的开头几个字 */
function verifyDirty(t){
  const md=paneOf(t).querySelector('.md'), base=dirOf(t.path);
  const out={bad:[], stuck:[], redraw:[], over:new Map()};
  tidyDirty(t);
  [...md.children].forEach(el=>{
    if(el.nodeType!==1 || !el.dataset.dirty || el.hasAttribute('data-lock')
       || el.tagName==='TEXTAREA' || el.dataset.chrome) return;
    const v=blockPlan(el, base);
    out.over.set(el, v);
    if(v.ok) return;
    if(v.stuck){ out.stuck.push(el); out.bad.push((el.textContent||'').replace(/\s+/g,' ').trim().slice(0,26)); }
    else out.redraw.push(el);
  });
  return out;
}
/* 动过的块再洗一遍白（同 watchEdits 里改完那一帧）。光标记下来、洗完放回去；组字时不动。 */
function tidyDirty(t){
  const p=paneOf(t); if(!p || COMPOSING) return;
  const md=p.querySelector('.md');
  const list=[...md.children].filter(el=>el.nodeType===1 && el.dataset.dirty && !el.hasAttribute('data-lock')
                                      && el.tagName!=='TEXTAREA' && !el.dataset.chrome);
  if(!list.length) return;
  unwatch(t);
  const before=md.innerHTML, keep=saveSel(md);
  list.forEach(b=>{ if(b.isConnected) cleanBlock(b); });
  dropIdleShells(list);
  if(md.innerHTML!==before) restoreSel(md, keep);
  watchEdits(t);
}
/* 存盘前：空的行内壳（只剩光标位 <br> 的 <strong>／<em>／<del>／<code>——加粗项开头、项末回车造出来的），
   光标已经不在它那一项（那一段）里了就拆掉。光标还在的时候 cleanBlock 留着它，接着打的字照旧是粗的；
   光标走了它就什么用都没有：空的加粗写不进文件，留着的话屏幕上是「粗的空项」、文件里是普通空项，
   存完对不上（K 轮随机会话种子 320，F 轮起就有）。 */
function dropIdleShells(list){
  const s=getSelection();
  const ends=s && s.rangeCount ? [s.anchorNode, s.focusNode] : [];
  list.forEach(b=>{
    if(!b.isConnected) return;
    b.querySelectorAll('strong,em,del,code').forEach(n=>{
      if(!b.contains(n) || n.closest('pre')) return;
      if(![...n.childNodes].every(c=>c.nodeType===1 && c.tagName==='BR')) return;   // 只认光标位 <br>，有字（哪怕是空格）的不碰
      const host=n.parentElement && n.parentElement.closest('li,p,td,th,h1,h2,h3,h4,h5,h6,blockquote') || b;
      if(ends.some(x=>x && host.contains(x))) return;     // 光标还在这一项里：留着
      unwrapKeep(n);
    });
  });
}
/* 一块的自检，跟 verifyDirty 一模一样（先洗白、再判），测试台直接调它。
   洗白可能把元素换掉（顶层的裸行内元素包进段落），返回里的 el 是洗完的那一块。 */
function checkBlock(el, base){
  el=cleanBlock(el);
  const v=blockVerdict(el, base);
  v.el=el;
  return v;
}

/* ── 数据 ───────────────────────────────
   只有一份：`/__tree`，服务从全文索引里现给。库里全部 md 和 html，每条有
   路径、标题、类型、改动时间、预览。 */
let items=[];
let TREE=null;
let fDir=null, fSub=null;       // 选中的大类文件夹 ／ 它下面的子文件夹
let fNotes=false;               // 随手记那一屏
let fRecent=true;               // 首页＝最近改动
let fKind='all';                // 最近／搜索：全部 ／ 只 md ／ 只 html
let kw='';
let PAGE=80;                    // 往下滚动续加，不加按钮

const stripNo = s => String(s||'').replace(/^\d{1,2}[、_.．]\s*/,'');

/* 文件夹＝路径的前两段。再往下不切——库里的专项就住在第二层。
   多笔记本时先把开头的笔记本名剥掉：不剥的话「工作」会被当成一个顶层文件夹。 */
function prepItems(){
  const d=bookDepth();
  items.forEach(i=>{
    const seg=(i.路径||'').split('/').slice(d);
    i._d0 = seg.length>1 ? seg[0] : '';
    i._d1 = seg.length>2 ? seg[1] : '';
  });
}

const ymd = t => { const d=new Date((t||0)*1000), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };

/* 英文的月份缩写。Intl 取不到（旧内核）就退回写死的一张表。 */
const MONTH_ABBR = (()=>{
  try{
    const f=new Intl.DateTimeFormat('en',{month:'short'});
    return Array.from({length:12},(_,m)=>f.format(new Date(2021,m,15)));
  }catch(e){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; }
})();
/* 日期：中文 9月3日 ／ 2025年12月1日，英文 Sep 3 ／ Dec 1, 2025。
   数字和分隔符是格式不是文案，所以按语言分支，不进词典。 */
function fmtDate(d, withYear){
  if(LANG==='en'){
    const s=MONTH_ABBR[d.getMonth()]+' '+d.getDate();
    return withYear ? s+', '+d.getFullYear() : s;
  }
  const s=(d.getMonth()+1)+'月'+d.getDate()+'日';
  return withYear ? d.getFullYear()+'年'+s : s;
}
/* 「多久之前」只有这一把梯子：刚刚 → N 分钟前 → 今天 09:12 → 昨天 16:40
   → 9月3日 → 2025年12月1日。卡片、最近列表、继续阅读大卡都走它。 */
function fmtWhen(sec){
  const ms=(sec||0)*1000;
  if(!ms) return '';
  const d=new Date(ms), z=n=>String(n).padStart(2,'0');
  const gap=Date.now()-ms;
  if(gap>=0 && gap<60e3) return TR('刚刚');
  if(gap>=0 && gap<3600e3) return TR('{n} 分钟前',{n:Math.floor(gap/60e3)});
  const hm=z(d.getHours())+':'+z(d.getMinutes());
  const b=dayBucket(sec);
  if(b!=='older') return dayLabel(b)+' '+hm;
  return fmtDate(d, d.getFullYear()!==new Date().getFullYear());
}
/* 时间怎么写：窄栏（wide）走上面那把梯子，列表栏挤，只写时刻。 */
function whenLabel(sec, wide){
  if(wide) return fmtWhen(sec);
  const ms=(sec||0)*1000, d=new Date(ms), z=n=>String(n).padStart(2,'0');
  return dayBucket(sec)==='older' ? fmtDate(d, false)
                                  : z(d.getHours())+':'+z(d.getMinutes());
}

function setTree(t){
  if(!t || !t.ok) return;
  TREE=t;
  /* 多本的 /__tree 顺手带一份笔记本列表：比 /__status 早到时先用它，
     首屏就能画对笔记本条（单本的 /__tree 一字不变，没有这个键）。 */
  let nbNew=false;
  if(Array.isArray(t.笔记本) && t.笔记本.length){
    const was=NB.multi;
    nbNew = nbApply(t.笔记本, '多') || was!==NB.multi;
    // 这一趟翻了面：下面这棵树的路径形态跟手上的标签对不上，画它没有意义，整页重来
    if(nbFlipped){ reloadForNb({writeST:true}); return; }
  }
  let docs=t.文档||[];
  /* 刚挪进废纸篓的那几份：索引跟上之前先当它们不在。索引真的不列了就解除，
     免得这张表越攒越长（撤销那条路上 untrashDoc 自己会删）。
     再加一道时间上限：挡了 30 秒还在树上，就当同步这条路断了，无条件放行——
     一直挡着等于一份还在的笔记从库里凭空消失，比闪一下糟得多。 */
  if(TRASHED.size){
    const have=new Set(docs.map(d=>d.路径)), now=Date.now();
    TRASHED.forEach((ts, p)=>{
      if(!have.has(p) || now-ts>TRASH_HIDE_MS) TRASHED.delete(p);
    });
    if(TRASHED.size) docs=docs.filter(d=>!TRASHED.has(d.路径));
  }
  /* 换表之前留一份「路径 → 修改时间」，下面作废关联面板的链接缓存要用。 */
  const prevMtime=new Map(items.map(i=>[i.路径, i.修改时间||0]));
  items=docs.map(d=>({
    路径:d.路径, 标题:d.标题||'', 类型:d.类型||'md',
    修改时间:d.改于||0, 日期:ymd(d.改于), 预览:d.预览||'',
    本:d.本||'',                              // 多本时服务端标好了这一条属于哪一本
    代理:d.代理||'',                          // 有名字＝最近一次是本机 AI 助手改的
    任务:taskList(d.任务),                     // 5.14 没勾的待办 [[行, 原文], …]（见「待办汇总」那一段）
    基于:d.基于||''}));                       // 5.14 索引那一版的 mtime 串；缺席＝索引落后于磁盘
  prepItems(); syncNotePv(); prunePins();
  buildNav(); render();
  syncScanChip();
  /* 笔记本列表刚到（solo 窗口、首屏 /__tree 比 /__status 快）：
     标签的色点、云上那一枚、文档头的路径芯片都得补画一次。 */
  if(nbNew){
    syncHomeDot(); drawTabs();
    const at=active(); if(at) drawDocBar(at);
  }
  /* 待办页悄悄并：自己勾一下三秒后就有一棵新树，每回都淡入一次会晃（行本来就留在原位）。
     其余几种页面照旧。 */
  TABS.forEach(t=>{
    const k=kindOfTab(t);
    if(isPageKind(k)) paintPage(t, k==='todo' ? {quiet:true} : undefined);
  });
  /* 链接段按路径缓存（契约 §3.2）。可它会过期，而且不只是因为自己被改：
     A 加了个 [[B]] 存下，B 的**被链**就多了一条，B 自己的修改时间却纹丝不动。
     所以只要这一版树跟上一版有任何出入（篇数不同、有路径进出、任何一篇的修改
     时间变了），就把整表标一遍「可能过期」——数据留着不删（删了签名要 1→0→1
     翻一趟，链接段白闪一下），下次画到那一篇时后台重新问一发，一样就什么都不做。
     已经不在了的路径没有下一次，直接扔掉。 */
  if(REL_LINKS.size){
    const nowM=new Map(items.map(i=>[i.路径, i.修改时间||0]));
    let moved = nowM.size!==prevMtime.size;
    if(!moved) for(const [p, m] of nowM){ if(prevMtime.get(p)!==m){ moved=true; break; } }
    if(moved) REL_LINKS.forEach((_, p)=>{
      if(nowM.has(p)) REL_STALE.add(p);
      else { REL_LINKS.delete(p); REL_STALE.delete(p); }
    });
  }
  /* 树换了一版：关联面板画的正是这张表，开着就得跟着重算。 */
  relGen++;
  if(REL_ON) syncRel();
}

async function loadTree(){
  if(!IS_HTTP) return;
  try{ setTree(await (await fetch('/__tree',{cache:'no-store'})).json()); }
  catch(e){ /* 服务没起：列表是空的，状态点会变灰 */ }
}

/* 类型筛：全部 / Markdown / HTML。只在浏览列表时生效；搜索始终覆盖 md 和 html。
   html 点开在标签里用沙箱 iframe 读。 */
function kindOf(i){
  if(i && (i.类型==='html' || i.类型==='md')) return i.类型;
  if(i && /\.html?$/i.test(i.路径||i.path||'')) return 'html';
  return (i && i.类型) || 'md';
}
function kindOk(i){
  const k=kindOf(i);
  if(fKind==='md') return k==='md';
  if(fKind==='html') return k==='html';
  return k==='md' || k==='html';
}
/* 这一条在不在它那一本的随手记目录里。多本时每本各有各的随手记目录。 */
function inNotesDir(rel){
  const book=NB.of(rel);
  const b=book ? NB.byName(book) : null;
  const nd=(b&&b.随手记目录)||NOTE_DIR;
  return NB.strip(String(rel||'')).startsWith(nd+'/');
}
function passes(i){
  if(fNotes) return inNotesDir(i.路径);
  if(!kindOk(i)) return false;
  if(inNotesDir(i.路径) && !fDir) return false;                          // 随手记有自己那一格
  if(fDir===null) return true;                                           // 最近：md 和 html 都进
  if(i._d0!==fDir) return false;
  if(fSub && i._d1!==fSub) return false;
  return true;
}

function saveFilters(){
  ST.f={dir:fDir, sub:fSub, recent:fRecent, notes:fNotes, kind:fKind};
  saveST();
}
function loadFilters(){
  const f=ST.f; if(!f) return;
  fDir=f.dir??null; fSub=f.sub??null;
  fRecent=f.recent===undefined?true:!!f.recent;
  fNotes=!!f.notes;
  /* 类型筛的那排按钮跟列表栏一起下线了，老档案里存的 kind 不再沿用。 */
}

/* ── 边栏：随手记 ｜ 最近 ｜ 文件夹 ｜ 设置 ──
   文件夹图标一律中性灰，18 色调色板撤了。 */
let navSig='';
function buildNav(){
  const nn=$('#navNotes'); if(nn) nn.classList.toggle('on', fNotes);
  const nr=$('#navRecent'); if(nr) nr.classList.toggle('on', fRecent && !fNotes && fDir===null && !kw);
  const cn=$('#ctNotes'); if(cn) cn.textContent=(TREE&&TREE.随手记||[]).length||'';
  const ct=$('#ctRecent'); if(ct)
    ct.textContent=items.filter(i=>(i.修改时间||0)*1000 > Date.now()-7*864e5).length || '';

  /* 多笔记本时按当前那一本筛：`名称` 是本内相对的，两本都有「会议」就会重名，
     不筛就是同一个名字出现两遍、点哪一枚都说不清是谁的。「全部」不筛。 */
  const dirs=(TREE && TREE.目录)
    ? TREE.目录.filter(d=>!NB.cur || d.本===NB.cur)
        .map(d=>({名称:d.名称, 份数:d.份数, 子目录:d.子目录||[]})) : [];
  const sig=[fDir,fSub,!!kw,NB.cur,dirs.length,dirs.map(d=>d.名称+':'+d.份数).join('|')].join('~');
  if(sig===navSig) return;
  navSig=sig;

  $('#dirList').innerHTML = dirs.map(d=>{
    const open = fDir===d.名称;
    const subs=(d.子目录||[]).filter(s=>s.份数>0);
    return `<button class="nav sub${open&&!fSub&&!kw?' on':''}" data-d="${esc(d.名称)}" title="${esc(d.名称)}">`
      + `<i data-ic="folder"></i>`
      + `<span class="lbl">${esc(stripNo(d.名称))}</span>`
      + `<span class="n">${d.份数||''}</span></button>`
      + (open ? subs.map(s=>
          `<button class="nav sub deep${fSub===s.名称&&!kw?' on':''}" data-d="${esc(d.名称)}" data-s="${esc(s.名称)}" title="${esc(s.名称)}">`
          + `<span class="lbl">${esc(stripNo(s.名称))}</span>`
          + `<span class="n">${s.份数}</span></button>`).join('') : '');
  }).join('');

  paintIcons($('#dirList'));
  $$('#dirList [data-d]').forEach(b=>{
    b.onclick=()=>gotoDir(b.dataset.d, b.dataset.s||null);
    b.oncontextmenu=e=>popMenu(e,[{id:'reveal', label:TR('在访达中显示')}],
      id=>{ if(id==='reveal') revealPath(b.dataset.s ? b.dataset.d+'/'+b.dataset.s : b.dataset.d); });
  });
}

/* 进文件夹＝退出搜索。搜索是全库的，跟文件夹叠不到一起。 */
function gotoDir(name, sub){
  setKw('');
  if(fDir===name && !sub && !fSub){ fDir=null; }          // 再点一次＝收起来
  else fDir=name;
  fSub=sub||null; fRecent=false; fNotes=false; PAGE=80;
  buildNav(); render();
}

function goHome(notes){
  setKw('');
  fDir=null; fSub=null; fNotes=!!notes; fRecent=!notes; PAGE=80;
  buildNav(); render();
}
function openNotesFolder(){
  // 跟 newNote() 用同一条解析：聚焦哪一本就开哪一本的随手记
  const f=noteDirOf(NB.multi ? (NB.cur||NB.default) : '');
  navigate(makeEntry('folder', {folder:f, title:f.split('/').pop(), path:f+'/'}));
}

/* ── 搜索 ───────────────────────────────
   搜索一律走全库：只要搜索框里有字，文件夹就不参与。 */
const terms = () => kw.toLowerCase().split(/\s+/).filter(Boolean);
/* 路径里那一段笔记本名不参与匹配：留着它，打「工作」就等于把那一本所有笔记
   都算成命中（范围芯片才是选本的地方，不是搜索词）。 */
const hayOf = i => (String(i.标题||'')+' '+NB.strip(String(i.路径||''))+' '+String(i.预览||'')).toLowerCase();

/* 标题和路径的匹配在本地立刻出；正文命中问服务的全文索引（/__search），防抖 250ms。 */
let FT={q:'', nb:'', map:new Map(), 状态:'', 总:0, timer:null};
/* nb＝这一次搜索限在哪一本（'' ＝全体）。范围换了也要重发，缓存键是 q＋nb。 */
function ftKick(nb){
  if(!LIVE) return;
  const q=kw;
  nb=String(nb||'');
  if(q===FT.q && nb===FT.nb) return;
  clearTimeout(FT.timer);
  if(!q){ FT={q:'', nb:'', map:new Map(), 状态:'', 总:0, timer:null}; return; }
  FT.timer=setTimeout(async()=>{
    try{
      const r=await (await fetch('/__search?q='+encodeURIComponent(q)+'&n=200'
                                 +(nb?'&nb='+encodeURIComponent(nb):''),
                                 {cache:'no-store'})).json();
      if(kw!==q) return;                       // 打字比请求快，过期的丢掉
      FT.q=q; FT.nb=nb;
      FT.map=new Map((r.结果||[]).map(h=>[h.路径,h]));
      FT.状态=(r.状态||{}).状态||'';
      FT.总=r.总命中||0;
      render();
    }catch(e){}
  }, 250);
}

function hit(i){
  const ts=terms();
  if(!ts.length) return passes(i);
  // 搜索覆盖 md 和 html，不管类型筛。类型筛只在浏览列表时生效。
  const k=kindOf(i);
  if(k!=='md' && k!=='html') return false;
  return ts.every(t=>hayOf(i).includes(t)) || (FT.q===kw && FT.map.has(i.路径));
}
/* nb＝这一次的搜索范围（'' ＝全体）。跟服务端的 nb= 用同一个名字。 */
function docsMatching(q, nb){
  q=String(q||'').trim();
  nb=String(nb||'');
  const ts=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!ts.length) return [];
  const seen=new Set(), out=[];
  const useFt=FT.q===q;
  const okBook=p=>!nb || NB.of(p)===nb;
  const take=i=>{
    const p=i && i.路径; if(!p || seen.has(p) || !okBook(p)) return;
    const k=kindOf(i);
    if(k!=='md' && k!=='html') return;
    seen.add(p); out.push(i);
  };
  items.forEach(i=>{
    if(ts.every(x=>hayOf(i).includes(x)) || (useFt && FT.map.has(i.路径))) take(i);
  });
  if(useFt){
    FT.map.forEach((h,p)=>{
      if(seen.has(p)) return;
      if(h.类型==='md' || h.类型==='html')
        take({路径:p, 标题:h.标题||p.split('/').pop(), 类型:h.类型, 预览:''});
    });
  }
  /* 同分时当前笔记本优先（brief §3）。 */
  const cur=NB.cur;
  const mine=i=>(cur && NB.of(i.路径)===cur) ? 1 : 0;
  return out.sort((a,b)=>(score(b,ts)-score(a,ts)) || (mine(b)-mine(a)));
}

/* 相关度：文件名全中最重（跟服务端第一档同一个判据），标题次之，正文命中加一点。 */
function score(i, ts){
  // 笔记本名那一段不算分（同 hayOf）：不然聚焦哪一本，那一本整体高 8 分
  const t=(i.标题||'').toLowerCase(), p=NB.strip(i.路径||'').toLowerCase();
  const name=p.split('/').pop();
  const fb0=FT.map.get(i.路径);
  let s=0;
  if((fb0 && fb0.档===1) || ts.every(x=>name.includes(x))) s+=400;
  ts.forEach(x=>{
    if(t===x) s+=200; else if(t.startsWith(x)) s+=120; else if(t.includes(x)) s+=80;
    if(p.includes(x)) s+=8;
  });
  const fb=FT.map.get(i.路径);
  if(fb) s+= 6 + Math.min(24, fb.命中数||0);
  return s;
}

/* 正文摘录。全文索引连标签块一起收了，命中经常落在文件头的 YAML 上，
   摘出来全是字段名，这类片段直接丢掉。
   文件名档（服务端 档=1）的「片段」是空数组：这时不出摘录行，路径那一行兜底，
   别渲染一个空框出来。 */
const FMKEYS=/(标题:|状态:|层级:|日期:|主题:|版本:|关键词:|阅读版:|回答什么:|底稿:)/g;
function isFrontMatter(f){
  const s=(f.前||'')+(f.中||'')+(f.后||'');
  if(/^\s*---/.test(s)) return true;
  return (s.match(FMKEYS)||[]).length>=2;
}
function snipOf(i, ts){
  if(!ts || !ts.length) return '';
  const fb=FT.map.get(i.路径);
  if(!fb || !(fb.片段||[]).length) return '';
  const frag=(fb.片段||[]).filter(f=>!isFrontMatter(f))[0];
  if(!frag) return '';
  return esc(frag.前||'')+'<span class="hit">'+esc(frag.中||'')+'</span>'+esc(frag.后||'');
}

/* 命中的词标出来：加粗＋强调色下划线，不铺底色（金黄命中色 v17 退役）。 */
function hl(s, ts){
  s=String(s==null?'':s);
  if(!ts||!ts.length) return esc(s);
  const low=s.toLowerCase(), spans=[];
  ts.forEach(t=>{
    if(!t) return;
    let i=low.indexOf(t);
    while(i!==-1){ spans.push([i,i+t.length]); i=low.indexOf(t,i+t.length); }
  });
  if(!spans.length) return esc(s);
  spans.sort((a,b)=>a[0]-b[0]);
  const m=[];
  spans.forEach(x=>{
    const last=m[m.length-1];
    if(last && x[0]<=last[1]) last[1]=Math.max(last[1],x[1]);
    else m.push(x.slice());
  });
  let out='', p=0;
  m.forEach(([a,b])=>{ out+=esc(s.slice(p,a))+'<span class="hit">'+esc(s.slice(a,b))+'</span>'; p=b; });
  return out+esc(s.slice(p));
}

/* 标题末尾那个八位日期是文件名的尾巴（命名规矩是 名称_vN_YYYYMMDD），
   日期已经在右边单列了一格，剪掉不写两遍。 */
const TAILDATE=/[ _\-·]*20\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])$/;
const TAILZHDATE=/\s+\d{1,2}月\d{1,2}日$/;
function cleanTitle(i){
  const s=String(i.标题||'');
  return s.replace(TAILDATE,'').replace(TAILZHDATE,'').trim() || s;
}

/* 「今天 ／ 昨天 ／ 更早」。找刚写完的那份，问的是「多久之前」。
   返回的是稳定 id（分组的键、各处的比较都靠它），显示的时候才翻。 */
function dayBucket(t){
  const d=new Date(); d.setHours(0,0,0,0);
  const ms=(t||0)*1000;
  if(ms>=d.getTime()) return 'today';
  if(ms>=d.getTime()-864e5) return 'yesterday';
  return 'older';
}
function dayLabel(id){
  return id==='today' ? TR('今天') : id==='yesterday' ? TR('昨天') : TR('更早');
}

/* 行上的次要动作三颗：拷贝路径 / 访达 / 浏览器打开（html 才有），hover 才出。 */
const acts = (i, idx) =>
  `<span class="racts">`
  + ((i.类型||'md')==='html'
      ? `<button class="iba" data-ext="${idx}" title="${esc(TR('在浏览器里打开'))}">${icon('globe',15)}</button>` : '')
  + `<button class="iba" data-clip="${idx}" title="${esc(TR('拷贝路径'))}">${icon('copy',15)}</button>`
  + `<button class="iba" data-rev="${idx}" title="${esc(TR('在访达中显示'))}">${icon('folder',15)}</button>`
  + `</span>`;

/* 一行。普通行和搜索结果两种形状，走同一套选中、拖动、右键。 */
function excerptOf(i){
  const fromNote=NOTEPV.get(i && i.路径);
  if(fromNote) return String(fromNote).replace(/\s+/g,' ').trim();
  if(kindOf(i)==='html' && i && i.预览) return String(i.预览).replace(/\s+/g,' ').trim();
  const p=String((i&&i.路径)||'');
  return p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
}

function rowHtml(i, idx, ts, seq, kind){
  const base=`role="option" data-idx="${idx}" data-seq="${seq}" draggable="true" aria-selected="false"`;
  const tag = kindOf(i)==='html' ? `<span class="kindtag">HTML</span>` : '';
  if(kind==='res'){
    const x=snipOf(i,ts);
    return `<div class="res" ${base}>`
      + `<div class="rt"><span class="t">${hl(cleanTitle(i),ts)}</span>${tag}</div>`
      + `<div class="rp">${esc(i.路径)}</div>`
      + (x?`<div class="rx">${x}</div>`:'')
      + acts(i, idx)
      + `</div>`;
  }
  const ex=excerptOf(i);
  return `<div class="lrow" ${base}>`
    + `<span class="top"><span class="t">${esc(cleanTitle(i))}</span>${tag}`
    + acts(i, idx)
    + `<span class="m num">${esc(whenLabel(i.修改时间, false))}</span></span>`
    + (ex?`<span class="ex">${esc(ex)}</span>`:'')
    + `</div>`;
}

let hits=[];        // 当前搜索结果，Enter 开第一条要用
let listNow=[];     // 当前屏上按显示顺序排好的条目，键盘上下键走的就是它
let selSeq=-1;
let selSet=new Set();
const NOTEPV=new Map();

const byRecent=(a,b)=>(b.修改时间||0)-(a.修改时间||0);

/* 这一趟全文搜索限在哪一本：搜索结果页上改过范围就听它的，否则跟笔记本条走。
   render() 和 paintSerp() 各踢一次 ftKick，两边给的范围不一样时同一次搜索会
   打两趟 /__search，后一趟还把前一趟的结果顶掉。 */
function serpScope(){
  const at=active();
  return (at && kindOfTab(at)==='search' && at.nbs) ? at.nbs : NB.cur;
}
function render(){
  const ts=terms(), searching=ts.length>0;
  document.body.classList.toggle('searching', searching);
  if(searching) ftKick(serpScope());
  buildNav();
  const kind = searching ? 'res' : 'lrow';
  const glab = 'lgroup';

  const list=items.filter(hit);
  hits = searching ? list : [];
  listNow=[]; selSet.clear();

  if(!list.length){
    const empty = (searching || fNotes) ? '' : (fKind==='html' ? TR('没有 HTML 文件') : fKind==='md' ? TR('没有 Markdown 文件') : '');
    $('#out').innerHTML = empty ? `<div class="kindempty">${empty}</div>` : '';
    selSeq=-1; saveFilters(); pushState(); return;
  }

  const cell=(i,tt)=>{ listNow.push(i); const seq=listNow.length-1;
    return rowHtml(i, items.indexOf(i), tt, seq, kind); };
  const sec=(title,arr,attr)=>
    `<div class="${glab}"${attr||''}>${esc(title)}</div>` + arr.map(i=>cell(i)).join('');

  let h='';
  if(searching){
    list.sort((a,b)=> score(b,ts)-score(a,ts) || (b.修改时间||0)-(a.修改时间||0));
    hits=list;
    h=list.slice(0,PAGE).map(i=>cell(i,ts)).join('');
  }else if(fNotes || fSub){
    h=list.slice().sort(byRecent).slice(0,PAGE).map(i=>cell(i)).join('');
  }else if(fDir===null){
    /* 三栏里的最近仍按今天／昨天／更早分组，信息结构不变。 */
    const arr=list.slice().sort(byRecent).slice(0,PAGE);
    const rest = arr;
    const g={today:[], yesterday:[], older:[]};
    rest.forEach(i=>g[dayBucket(i.修改时间)].push(i));
    ['today','yesterday','older'].forEach(k=>{ if(g[k].length) h+=sec(dayLabel(k), g[k]); });
  }else{
    // 在大类里：按子文件夹分组，直接摊在大类根下的排最前
    const g=new Map(); const root=[];
    list.slice().sort(byRecent).forEach(i=>{
      if(!i._d1) root.push(i); else { if(!g.has(i._d1)) g.set(i._d1,[]); g.get(i._d1).push(i); } });
    if(root.length) h+=sec(TR('直接放在这一层'), root);
    [...g.keys()].sort().forEach(k=> h+=sec(stripNo(k), g.get(k), ` data-gs="${esc(k)}"`));
  }
  $('#out').innerHTML=h;
  wireRows($('#out'));
  $$('#out [data-gs]').forEach(el=>el.onclick=()=>gotoDir(fDir, el.dataset.gs));
  if(selSeq>=listNow.length) selSeq=-1;
  paintSel();
  saveFilters();
  pushState();
  const at=active();
  if(at && kindOfTab(at)==='search') paintSerp(at);
}

/* ── 选中与键盘 ───────────────────────── */
function wireRows(root){
  root.querySelectorAll('[data-seq]').forEach(el=>{
    const seq=+el.dataset.seq;
    el.onclick=e=>{
      if(e.target.closest('[data-ext],[data-clip],[data-rev]')) return;
      if(e.metaKey){ selSet.has(seq)?selSet.delete(seq):selSet.add(seq); selSeq=seq; paintSel(); return; }
      if(e.shiftKey && selSeq>=0){ const a=Math.min(selSeq,seq),b=Math.max(selSeq,seq);
        selSet.clear(); for(let k=a;k<=b;k++) selSet.add(k); paintSel(); return; }
      selectSeq(seq, true);
    };
    el.ondblclick=()=>openDoc(listNow[seq], {jump:terms()});
    el.oncontextmenu=e=>{ if(!selSet.has(seq)) selectSeq(seq, false); rowMenu(e, seq); };
    el.ondragstart=e=>{
      const picked=(selSet.size?[...selSet]:[seq]).map(s=>listNow[s]).filter(Boolean);
      const uris=picked.map(i=>'file://'+encodeURI(absOf(i.路径))).join('\n');
      try{
        e.dataTransfer.setData('text/uri-list', uris);
        e.dataTransfer.setData('text/plain', uris);
        e.dataTransfer.effectAllowed='copyLink';
      }catch(err){}
    };
  });
  root.querySelectorAll('[data-ext]').forEach(el=>el.onclick=e=>{e.stopPropagation();openExternal(items[+el.dataset.ext].路径)});
  root.querySelectorAll('[data-clip]').forEach(el=>el.onclick=e=>{e.stopPropagation();clipPath(items[+el.dataset.clip].路径)});
  root.querySelectorAll('[data-rev]').forEach(el=>el.onclick=e=>{e.stopPropagation();revealPath(items[+el.dataset.rev].路径)});
}

let openT=null;
function selectSeq(seq, open){
  if(seq<0||seq>=listNow.length) return;
  selSeq=seq; selSet.clear(); selSet.add(seq); paintSel();
  const el=$(`#out [data-seq="${seq}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
  if(open){ clearTimeout(openT); openT=setTimeout(()=>openDoc(listNow[seq], {jump:terms()}), 90); }
}
function paintSel(){
  $$('#out [data-seq]').forEach(el=>{
    const s=+el.dataset.seq, on=selSet.has(s)||s===selSeq;
    el.classList.toggle('sel', on);
    el.setAttribute('aria-selected', on?'true':'false');
  });
}

/* ── 右键菜单 ───────────────────────────
   壳里弹真的 NSMenu，浏览器里弹一个同款外观的面板。 */
let ctxCb=null, ctxSeq=0;
function popMenu(e, itemsArr, cb){
  e.preventDefault(); e.stopPropagation();
  const x=e.clientX, y=e.clientY;
  if(SHELL){
    ctxCb=cb; ctxSeq++;
    post({type:'menu', id:ctxSeq, x, y, items:itemsArr});
    return;
  }
  const box=$('#ctx');
  box.innerHTML=itemsArr.map(it=>it.sep?`<div class="sep"></div>`
    :`<button data-mid="${esc(it.id)}"${it.enabled===false?' disabled':''}>${esc(it.label)}</button>`).join('');
  box.classList.add('on');
  const w=box.offsetWidth, h=box.offsetHeight;
  box.style.left=Math.min(x, innerWidth-w-8)+'px';
  box.style.top =Math.min(y, innerHeight-h-8)+'px';
  box.querySelectorAll('[data-mid]').forEach(b=>b.onclick=()=>{ closeCtx(); cb(b.dataset.mid); });
  ctxCb=cb;
}
function closeCtx(){ const b=$('#ctx'); if(b) b.classList.remove('on'); }

function rowMenu(e, seq){
  const i=listNow[seq]; if(!i) return;
  const many=selSet.size>1 ? TR('（{n} 份）',{n:selSet.size}) : '';
  const md=(i.类型||'md')==='md';
  popMenu(e, [
    {id:'open', label:TR('打开')},
    ...(!md?[{id:'browser', label:TR('在浏览器里打开')}]:[]),
    ...(IS_HTTP?[{id:'newwin', label:TR('在新窗口打开')}]:[]),
    {sep:true},
    {id:'copyurl',label:TR('拷贝路径')+many},
    {id:'reveal', label:TR('在访达中显示')+many},
    {id:'copyrel',label:TR('拷贝库内相对路径')+many},
  ], id=>{
    const picked=(selSet.size?[...selSet]:[seq]).map(s=>listNow[s]).filter(Boolean);
    if(id==='open') openDoc(i, {jump:terms()});
    else if(id==='browser') openExternal(i.路径);
    else if(id==='newwin') openSolo(i.路径);
    else if(id==='reveal') picked.forEach(x=>revealPath(x.路径));
    else if(id==='copyrel') copyText(picked.map(x=>x.路径).join('\n')).then(ok=>flash(ok?TR('路径已拷贝'):TR('拷不了')));
    else if(id==='copyurl'){
      copyText(picked.map(x=>'file://'+absOf(x.路径)).join('\n'))
        .then(ok=>flash(!ok ? TR('拷不了') : (picked.length>1?TR('{n} 条路径已拷贝',{n:picked.length}):TR('路径已拷贝'))));
    }
  });
}

/* 卡片上的右键：开始页 / 文件夹页 / 已收藏页那一张张卡片，还有搜索结果那一行行。
   壳里是原生 NSMenu，浏览器里是 #ctx，都走 popMenu。 */
function cardMenu(e, rel, kind){
  if(!rel) return;
  const it=items.find(i=>i.路径===rel)
    || {路径:rel, 标题:rel.split('/').pop(), 类型:kind||'md'};
  popMenu(e, [
    {id:'open',    label:TR('打开')},
    {id:'newtab',  label:TR('在新标签打开')},
    {id:'pin',     label:isPinned(rel)?TR('取消收藏'):TR('收藏')},
    {id:'reveal',  label:TR('在访达中显示')},
    {id:'copyurl', label:TR('拷贝路径')},
    ...(canTrashPath(rel) ? [{sep:true},{id:'trash', label:TR('移到废纸篓')}] : []),
  ], id=>{
    if(id==='open') openDoc(it);
    else if(id==='newtab') openDoc(it, {newTab:true});
    else if(id==='pin') togglePin(rel);
    else if(id==='reveal') revealPath(rel);
    else if(id==='copyurl') clipPath(rel);
    else if(id==='trash') trashDoc(rel);
  });
}

/* 正文上的右键：原来顶栏那一排按钮搬到这里（工具栏收成两颗，见 C 路）。 */
function docMenu(e, t){
  if(!t) return;
  const kk=kindOfTab(t);
  if(isPageKind(kk)) return;
  if(e.target.closest('a,img,textarea,iframe,.pagebox')) return;
  const ed=!!t.editing, src=paneOf(t).classList.contains('src');
  popMenu(e, [
    ...(!ed && !t.ext && canEditPath(t.path) ? [{id:'edit', label:TR('进入编辑')},{sep:true}] : []),
    ...(ed ? [{id:'src', label:src?TR('回到正文'):TR('整篇源码')},
              {id:'cancel', label:TR('放弃这次修改')},{sep:true}] : []),
    ...(t.ext ? [] : [{id:'newwin', label:TR('在新窗口打开')}]),
    {id:'copyurl',label:TR('拷贝路径')},
    {id:'reveal', label:TR('在访达中显示')},
    {id:'type', label:TR('排版')},
    ...(t.ext ? [] : [{id:'share', label:TR('分享')}]),
  ], id=>{
    if(id==='edit') startEdit();
    else if(id==='src') toggleSrc();
    else if(id==='cancel') cancelEdit();
    else if(id==='newwin') openSolo(t.path);
    else if(id==='copyurl'){
      const s = t.ext ? t.abs : absOf(t.path);
      copyText('file://'+s).then(ok=>flash(ok?TR('路径已拷贝'):TR('拷不了')));
    }
    else if(id==='reveal') revealPath(t.path);
    else if(id==='type') openType();
    else if(id==='share') post({type:'share', path:absOf(t.path)});
  });
}

/* ── 空格快看 ─────────────────────────── */
let qlOn=false, qlItem=null;
async function quickLook(i){
  if(!i) return;
  closeUserPop();
  qlItem=i; qlOn=true;
  $('#qlwrap').classList.add('on');
  $('#qlt').textContent=i.标题||'';
  const b=$('#qlb'); b.innerHTML='';
  try{
    if((i.类型||'md')==='md'){
      const r=await fetch(url(i.路径)); const t=await r.text();
      const body=t.replace(/^---[\s\S]*?\n---\n/, '');           // 标签块不进预览
      const cut=body.split('\n').slice(0,60).join('\n');
      b.innerHTML=`<div class="md ${PREF.font}" style="--rw:${PREF.fw}">${md2html(cut, dirOf(i.路径), 0)}</div>`;
      return;
    }
    b.innerHTML=`<div class="md"><p>${esc(i.路径)}</p></div>`;
  }catch(e){ b.innerHTML=''; }
}
function closeQL(){ qlOn=false; $('#qlwrap').classList.remove('on'); }

/* ── 搜索词：5.4.1 起只有 ⌘K 面板这一个入口，页面里没有别的输入框要同步 ── */
function setKw(v){
  kw=String(v||'').trim();
  PAGE=80;
  post({type:'search', text:kw});
}
function clearQ(focus){ setKw(''); render(); if(focus) focusSearch(); }
/* 5.4 起搜索只有一个入口：⌘K 面板。地址栏（#omnibox）连同书签栏整条删了，
   ⌘L／⌥⌘K／开始页直接打字／点搜索胶囊都落到这里。
   名字留着不改：壳菜单指着 AMN.focusOmnibox / AMN.focusSearch，页内也到处在调。
   opts.seed 预填一段文字；opts.select 决定预填的是全选（AMN.search）还是
   把光标放在末尾（开始页敲第一个字那条路，接着敲第二个字才不会把第一个顶掉）。 */
function focusSearch(){ focusOmnibox(); }
function focusOmnibox(opts){
  opts=opts||{};
  openQuick(opts.seed||'', {select:!!opts.select});
}
/* ── 书签栏的去处 ─────────────────────────
   5.4 起 #bmbar（书签栏）和 #omnibox（地址栏）整条删了：文件夹入口搬到开始页
   问候区下面那行芯片，路径搬到文档头的芯片，搜索只剩 ⌘K 面板。
   壳菜单里「书签栏 ⌘⇧B」那一项还指着 AMN.toggleBookmarks，所以这个名字得留着——
   点了报一句就完事，state().bookmarks 恒 false，菜单上的勾永远不打。 */
function toggleBookmarks(){
  if(ST.bookmarks!==false){ ST.bookmarks=false; saveST(); }
  notify(TR('文件夹入口已并入开始页'));
}

(function wireChromeBtns(){
  const home=$('#navHome'), plus=$('#tabplus'),
        sp=$('#topSearch'), cfg=$('#navCfgTop');
  /* 品牌标：不在开始页就回开始页；已经在开始页就把这一页滚回顶——
     不弹 ⌘K，搜索只有右边那颗胶囊一个入口。 */
  if(home) home.onclick=()=>{
    home.blur();
    const t=active();
    if(isStartTab(t)){
      const p=paneOf(t);
      const box=(p && p.classList.contains('pg') && p.querySelector('.pagebox')) || p;
      if(box) box.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    navigate(makeEntry('start', {title:TR('开始')}));
  };
  if(plus) plus.onclick=()=>{ newTab(); plus.blur(); };
  if(sp) sp.onclick=()=>{ sp.blur(); AMN.quickOpen(); };
  if(cfg) cfg.onclick=()=>{ cfg.blur(); openCfg(); };
  /* 头像在开始页问候里，paintStart 每次都会重画，所以点按走委托。 */
  document.addEventListener('click', e=>{
    const uc=e.target.closest('#userChip');
    if(!uc) return;
    userPopOn() ? closeUserPop() : openUserPop();
  });
})();

/* ── ⌘K 直达 ────────────────────────────
   5.4 起这是唯一的搜索入口。有输入时第一行是「在全部笔记中搜索“…”」——
   走的正是原来地址栏回车那条路（setKw ＋ 搜索页），⌘回车开新标签；
   下面照旧是动作和笔记，排序没动。 */
let ckList=[], ckSel=0;
/* title 存的是简体源串（当键用），显示时 TR() 一次；kw 是别名，
   让人用英文、繁体或者近义词也搜得到同一个动作。 */
const CK_ACTS=[
  {id:'tab', title:K('新建标签页'), kbd:'⌘T',
   kw:['new tab','tab','标签','標籤','分页','分頁'], go(){ newTab(); }},
  {id:'new', title:K('新建随手记'), kbd:'',
   kw:['new note','note','quick note','新建','笔记','筆記','随手','隨手'], go(){ newNote(); }},
  {id:'win', title:K('新建窗口'), kbd:'⌘N',
   kw:['new window','window','窗口','視窗','视窗'], go(){ AMN.newWindow(); }},
  {id:'edit', title:K('进入编辑'), kbd:'⌘E',
   kw:['edit','write','编辑','編輯'], go(){ AMN.enterEdit(); }},
  {id:'related', title:K('关联'), kbd:'⌥⌘R',
   kw:['related','tree','files','links','关联','關聯','文件树','版本','链接'],

  {id:'type', title:K('阅读与外观'), kbd:'',
   kw:['appearance','typography','theme','font','外观','外觀','字体','字體','主题','主題','排版'],

  {id:'finder', title:K('在访达中显示'), kbd:'⇧⌘R',
   kw:['reveal','reveal in finder','finder','访达','訪達'], go(){ AMN.reveal(); }},
  {id:'home', title:K('回到开始页'), kbd:'',
   kw:['home','start','start page','开始','開始','首页','首頁'],
   go(){ navigate(makeEntry('start', {title:TR('开始')})); }},
  /* 5.14 待办页。同 home：在当前标签打开（从开始标签进去是替换），⌘↵ 对动作行不起作用。 */
  {id:'todo', title:K('待办##page'), kbd:'',
   kw:['todo','todos','to-do','task','tasks','checklist','待办','待辦','任务','任務','勾选','勾選','清单','清單'],
   go(){ openTodo(false); }},
  /* 只有两本以上才出现：弹一列笔记本（含「全部」），选了就是笔记本条那一下。 */
  {id:'nb', title:K('切换到笔记本…'), kbd:'', multi:true,
   kw:['notebook','switch','vault','笔记本','筆記本','切换','切換'],
   go(){ pickNotebook(null, {all:true}, n=>setCurNb(n)); }},

/* seed 预填一段文字。opt.select 为真＝全选（AMN.search），否则光标停在末尾
   （开始页敲第一个字那条路：接着敲第二个字不能把第一个顶掉）。 */
/* ⌘K 面板这一次的搜索范围。开面板时跟笔记本条对齐，改了只影响这一次。 */
let ckScope='';
function openQuick(seed, opt){
  opt=opt||{};
  closeUserPop();               // 盖住了就不该还开着：Esc 得先关面板
  ckScope=NB.cur;
  $('#cmdkWrap').classList.add('on');
  const el=$('#ck'); el.value=seed||''; ckSel=0; ckRender();
  setTimeout(()=>{
    el.focus();
    if(seed && !opt.select) el.setSelectionRange(seed.length, seed.length);
    else el.select();
  }, 0);
}
function closeQuick(){ $('#cmdkWrap').classList.remove('on'); }
const quickOn = () => $('#cmdkWrap').classList.contains('on');
function ckNotes(q){
  q=String(q||'').trim().toLowerCase();
  const stem=p=>p.split('/').pop().replace(/\.(md|html|htm)$/i,'');
  const pool=items.filter(i=>{ const k=kindOf(i); return k==='md'||k==='html'; })
    .filter(i=>!ckScope || NB.of(i.路径)===ckScope);
  if(!q) return pool.sort(byRecent).slice(0,12);
  const w=q.split(/\s+/).filter(Boolean);
  const rank=i=>{
    const t=(i.标题||'').toLowerCase(), n=stem(i.路径).toLowerCase(), h=hayOf(i);
    if(!w.every(x=>h.includes(x))) return -1;
    let s=0;
    w.forEach(x=>{
      if(t.startsWith(x)||n.startsWith(x)) s+=100;
      else if(t.includes(x)||n.includes(x)) s+=40;
      else s+=10;
    });
    return s;
  };
  /* 同分时当前笔记本优先（brief §3 的搜索范围细则）。 */
  const cur=NB.cur;
  const mine=i=>(cur && NB.of(i.路径)===cur) ? 1 : 0;
  return pool.map(i=>({i, s:rank(i)})).filter(x=>x.s>=0)
    .sort((a,b)=> b.s-a.s || mine(b.i)-mine(a.i) || (b.i.修改时间||0)-(a.i.修改时间||0))
    .slice(0,12).map(x=>x.i);
}
function ckItems(q){
  const raw=String(q||'').trim();
  const low=raw.toLowerCase();
  const head=raw ? [{kind:'q', q:raw}] : [];
  /* 三处都认：译文（眼睛看到的那串）、简体源串、别名。 */
  const acts=CK_ACTS.filter(a=>{
    if(a.multi && !NB.multi) return false;
    if(!low) return true;
    // 源串上的 ##语境 后缀不算字（不然敲 page 也能搜出「待办」）
    const hay=[TR(a.title), a.title.replace(/##.*$/,'')].concat(a.kw||[]).join(' ').toLowerCase();
    return hay.includes(low);
  }).map(a=>({kind:'act', a}));
  const notes=ckNotes(raw).map(i=>({kind:'note', i}));
  return head.concat(acts, notes);
}
/* 动作行前面那颗图标，只是长相，不进 CK_ACTS。 */
const CK_ICON={tab:'plus', new:'new-note', win:'newwin',
  edit:'pencil', type:'sliders', finder:'folder', home:'home', related:'sidebar', todo:'checklist'};
/* 全库搜索：跟原来地址栏回车一字不差——setKw ＋ 一张搜索结果页。 */
function runSearch(q, newTab, scope){
  q=String(q||'').trim(); if(!q) return;
  setKw(q);
  const p=navigate(makeEntry('search', {q, title:q, path:TR('搜索: {q}',{q})}), {newTab:!!newTab});
  // ⌘K 里改过范围就带过去，别让结果页又跳回笔记本条那一本
  if(scope!==undefined && p && p.then) p.then(t=>{
    if(t){ t.nbsQ=q; t.nbs=scope; paintPage(t); }
  });
}
function runCk(it, newTab){
  const scope=ckScope;
  closeQuick();
  if(!it) return;
  if(it.kind==='q'){ runSearch(it.q, newTab, scope); return; }
  if(it.kind==='act'){ it.a.go(); return; }
  openDoc(it.i, newTab?{newTab:true}:null);
}
function ckRender(){
  const q=$('#ck').value;
  ckList=ckItems(q);
  if(ckSel>=ckList.length) ckSel=Math.max(0, ckList.length-1);
  const ts=String(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const mark=s=>{
    if(!ts.length) return esc(s);
    let out=esc(s);
    ts.forEach(t=>{
      const low=String(s).toLowerCase(), k=low.indexOf(t);
      if(k<0) return;
      out=esc(s.slice(0,k))+'<b>'+esc(s.slice(k,k+t.length))+'</b>'+esc(s.slice(k+t.length));
    });
    return out;
  };
  const row=(n, ico, title, sub, tail)=>
    `<button type="button" class="search-row${n===ckSel?' on':''}" role="option"`
    + ` aria-selected="${n===ckSel?'true':'false'}" data-n="${n}">`
    + `<span class="ico">${ico}</span>`
    + `<span class="search-info"><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span>`
    + tail + `</button>`;
  const acts=ckList.filter(x=>x.kind==='act');
  const notes=ckList.filter(x=>x.kind==='note');
  let html='';
  const qrow=ckList.find(x=>x.kind==='q');
  if(qrow){
    html+=row(ckList.indexOf(qrow), icon('search',17),
      esc(TR('在全部笔记中搜索“{q}”',{q:qrow.q})), '', '<span class="enter">↩</span>');
  }
  if(acts.length){
    html+=`<div class="search-label">${esc(TR('动作'))}</div>`;
    acts.forEach(it=>{
      const n=ckList.indexOf(it);
      /* 「新建随手记」的副标写清楚会落到哪一本（P5）。 */
      const tgt = (it.a.id==='new' && NB.multi) ? (NB.cur||NB.default) : '';
      const sub = tgt ? nbDot(tgt,{sm:true})+`<span class="nbname">${esc(tgt)}</span>` : '';
      html+=row(n, icon(CK_ICON[it.a.id]||'arrow',17), esc(TR(it.a.title)), sub,
        it.a.kbd ? `<kbd>${esc(it.a.kbd)}</kbd>` : '<span class="enter">↵</span>');
    });
  }
  if(notes.length){
    const typed=String(q||'').trim();
    html+=`<div class="search-label">${esc(typed?TR('找到 {n} 篇',{n:notes.length}):TR('最近的笔记'))}</div>`;
    notes.forEach(it=>{
      const n=ckList.indexOf(it);
      const isHtml=kindOf(it.i)==='html';
      /* 副标：「● 工作 › 会议 · 摘要」。范围锁在某一本时不重复报本名。 */
      const where = withNbCtx(ckScope, ()=>whereHtml(it.i.路径));
      const ex=cardText(it.i);
      html+=row(n, icon(isHtml?'globe':'doc',17), mark(cleanTitle(it.i)),
        where+(ex?' · '+esc(ex):''), '<span class="enter">↵</span>');
    });
  }
  if(!ckList.length || (ckList.length===1 && qrow)){
    html+=`<div class="modal-empty"><h2>${esc(TR('还没找到这篇笔记'))}</h2>`
      + `<p>${esc(TR('换一个短一点的词试试。'))}</p>`
      + `<button type="button" class="hbtn" id="ckNew">${icon('plus',15)}<span>${esc(TR('先记下这个想法'))}</span></button></div>`;
  }
  const sc=$('#ckScope');
  if(sc){
    sc.innerHTML=nbStripHtml(ckScope, {scope:true});
    sc.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{
      ckScope=b.dataset.nb||''; ckSel=0; ckRender();
      const el=$('#ck'); if(el) el.focus();
    });
  }
  $('#ckList').innerHTML=html;
  $$('#ckList .search-row').forEach(el=>{
    el.onclick=e=>runCk(ckList[+el.dataset.n], e.metaKey||e.ctrlKey);
  });
  const ne=$('#ckNew'); if(ne) ne.onclick=()=>{ closeQuick(); newNote(); };
  const cur=$('#ckList .search-row.on');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}
$('#ck').oninput=()=>{ ckSel=0; ckRender(); };
$('#ck').onkeydown=e=>{
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); ckSel=Math.min(ckList.length-1, ckSel+1); ckRender(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); ckSel=Math.max(0, ckSel-1); ckRender(); }
  else if(e.key==='Enter'){ e.preventDefault(); runCk(ckList[ckSel], e.metaKey||e.ctrlKey); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeQuick(); }
};
/* 点面板以外的蒙层、或右上角那颗 Esc，都关。 */
$('#cmdkWrap').onclick=e=>{ if(e.target===$('#cmdkWrap')) closeQuick(); };
$('#ckEsc').onclick=closeQuick;
